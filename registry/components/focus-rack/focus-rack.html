<!doctype html>
<!--
  focus-rack: HyperFrames video primitive (camera / holdable / emphasize)

  Concept: two cards sit at different apparent depths. Card A begins sharp
  and near while card B is blurred and dim. Focus moves to card B exactly
  once, with blur, scale, and parallax changing together over 0.7 seconds.

  Variables:
    - label_a (string, default "Черновик"): foreground card label.
    - label_b (string, default "Опубликовано"): background card label.

  Envelope (fixed IN/OUT, elastic HOLD only, never gsap.timeScale()):
    IN_BASE  = 1.32s  stage reveal, initial focus beat, then one 0.7s rack
    HOLD     = elastic card B remains sharp with a restrained depth drift
    OUT_BASE = 0.42s  completed focus state fades from the stage
    If D is shorter than IN_BASE plus OUT_BASE, both fixed phases compress
    proportionally and HOLD becomes zero. The rack still occurs exactly once.

  Mount contract: the runtime clones only this template. #root fills the host
  box, establishes the container query basis, has no data-width or data-height,
  and registers one paused timeline under the hardcoded focus-rack id.
-->
<html
  lang="en"
  data-composition-id="focus-rack"
  data-composition-duration="3.5"
  data-composition-variables='[
    {"id": "label_a", "type": "string", "role": "content", "label": "Card A label", "description": "Label on the card that begins in focus.", "default": "Черновик", "maxLength": 16},
    {"id": "label_b", "type": "string", "role": "content", "label": "Card B label", "description": "Label on the card that receives focus.", "default": "Опубликовано", "maxLength": 16}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Focus Rack</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="focus-rack" data-duration="3.5" data-fps="30">
        <style>
          @font-face {
            font-family: "Bebas Neue";
            src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
            font-weight: 700;
            font-display: block;
          }
          @font-face {
            font-family: "Montserrat";
            src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
            font-weight: 100 900;
            font-display: block;
            unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
          }
          @font-face {
            font-family: "Montserrat";
            src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
            font-weight: 100 900;
            font-display: block;
            unicode-range:
              U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
              U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
          }
          @font-face {
            font-family: "Montserrat";
            src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
            font-weight: 100 900;
            font-display: block;
            unicode-range:
              U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308,
              U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4,
              U+2113, U+2C60-2C7F, U+A720-A7FF;
          }
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            container-type: size;
            isolation: isolate;
            background: var(--bg, #0c1014);
            color: var(--fg, #f2f2f2);
            font-family: var(--font-body, "Montserrat", sans-serif);
            pointer-events: none;
          }

          .fr-clip {
            position: absolute;
            inset: 0;
            overflow: hidden;
            background: radial-gradient(
              ellipse at 52% 48%,
              color-mix(in srgb, var(--fr-accent) 12%, var(--surface, #18181a)) 0%,
              var(--bg, #0c1014) 72%
            );
          }

          .fr-stage {
            position: absolute;
            inset: 0;
            perspective: 120cqw;
            opacity: 0;
          }

          .fr-card {
            --fr-blur: 0;
            position: absolute;
            top: 21cqh;
            width: 39cqw;
            height: 58cqh;
            padding: 4.2cqh 3.4cqw;
            overflow: hidden;
            border: 0.1cqw solid color-mix(in srgb, var(--fr-accent) 28%, var(--border, #2e2e32));
            border-radius: 2.4cqmin;
            background: linear-gradient(
              145deg,
              color-mix(in srgb, var(--fg, #f2f2f2) 6%, var(--surface, #18181a)),
              var(--surface, #18181a)
            );
            box-shadow:
              0 4.4cqh 10cqh rgba(0, 0, 0, 0.42),
              inset 0 0.12cqh 0 rgba(255, 255, 255, 0.08);
            color: var(--fg, #f2f2f2);
            filter: blur(calc(var(--fr-blur) * 1cqw));
            transform-origin: 50% 50%;
            will-change: transform, opacity, filter;
          }

          .fr-card-a {
            left: 8cqw;
          }

          .fr-card-b {
            right: 8cqw;
          }

          /* Portrait field (a vertical reel's graphics field is 780 x 1180):
             side by side each card was ~300 px wide and a long label broke
             mid-word. The pair stacks, card A above card B, full width. */
          @container (aspect-ratio < 1) {
            .fr-card {
              width: 84cqw;
              height: 40cqh;
              padding: 4.2cqh 5cqw;
            }

            .fr-card-a {
              top: 7cqh;
              left: 8cqw;
            }

            .fr-card-b {
              top: 53cqh;
              right: auto;
              left: 8cqw;
            }
          }

          .fr-card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
          }

          .fr-kicker {
            display: flex;
            align-items: center;
            gap: 0.8cqw;
            color: var(--muted, #8a8a90);
            /* 31 px: the card out of focus sits at scale 0.92-0.93; the 28 px floor holds after it. */
            font-size: max(31px, 1.15cqw);
            font-weight: 760;
            letter-spacing: 0.13em;
            line-height: 1;
            text-transform: uppercase;
          }

          .fr-dot {
            width: 0.75cqw;
            aspect-ratio: 1;
            border-radius: 50%;
            background: var(--fr-accent);
            box-shadow: 0 0 1.4cqw color-mix(in srgb, var(--fr-accent) 52%, transparent);
          }

          .fr-index {
            color: var(--muted, #8a8a90);
            font-family: var(--font-body, "Montserrat", sans-serif);
            font-size: max(31px, 1.05cqw);
            font-weight: 700;
          }

          .fr-label {
            margin-top: 7.4cqh;
            max-width: 100%;
            color: var(--fg, #f2f2f2);
            /* A card title, not a reel heading: Montserrat; long labels wrap by words. */
            font-family: var(--font-body, "Montserrat", sans-serif);
            font-size: max(28px, 4.8cqw);
            font-weight: 800;
            letter-spacing: -0.01em;
            line-height: 1.1;
            text-wrap: balance;
            overflow-wrap: anywhere;
          }

          .fr-rule {
            width: 100%;
            height: 0.35cqh;
            margin-top: 5cqh;
            border-radius: 99cqh;
            background: color-mix(in srgb, var(--fr-accent) 76%, var(--border, #2e2e32));
          }

          .fr-copy {
            display: grid;
            gap: 1.4cqh;
            margin-top: 3.2cqh;
          }

          .fr-line {
            display: block;
            height: 1.15cqh;
            border-radius: 99cqh;
            background: color-mix(in srgb, var(--fg, #f2f2f2) 18%, transparent);
          }

          .fr-line:last-child {
            width: 68%;
          }
        </style>

        <div
          id="focus-rack-clip"
          class="fr-clip clip"
          data-start="0"
          data-duration="3.5"
          data-track-index="0"
        >
          <div class="fr-stage">
            <article class="fr-card fr-card-a">
              <div class="fr-card-top">
                <span class="fr-kicker"><span class="fr-dot"></span>Проект</span>
                <span class="fr-index">А</span>
              </div>
              <div class="fr-label fr-label-a"></div>
              <div class="fr-rule"></div>
              <div class="fr-copy" aria-hidden="true">
                <span class="fr-line"></span>
                <span class="fr-line"></span>
              </div>
            </article>

            <article class="fr-card fr-card-b">
              <div class="fr-card-top">
                <span class="fr-kicker"><span class="fr-dot"></span>Проект</span>
                <span class="fr-index">Б</span>
              </div>
              <div class="fr-label fr-label-b"></div>
              <div class="fr-rule"></div>
              <div class="fr-copy" aria-hidden="true">
                <span class="fr-line"></span>
                <span class="fr-line"></span>
              </div>
            </article>
          </div>
        </div>

        <script>
          /* hostSlot: the whole-scene clip follows the host slot (komp-sobrat.py klip_hozyaina; caret-swap:219) */
          (function () {
            var c = document.getElementById("focus-rack-clip");
            var h = c && c.parentElement && c.parentElement.closest("[data-duration]");
            if (h) c.dataset.duration = h.dataset.duration;
          })();
        </script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var stage = root.querySelector(".fr-stage");
            var cardA = root.querySelector(".fr-card-a");
            var cardB = root.querySelector(".fr-card-b");
            var labelA = root.querySelector(".fr-label-a");
            var labelB = root.querySelector(".fr-label-b");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            // One palette: the focus highlight rides the reel's brand red.
            labelA.textContent = vars.label_a == null ? "Черновик" : String(vars.label_a);
            labelB.textContent = vars.label_b == null ? "Опубликовано" : String(vars.label_b);
            root.style.setProperty("--fr-accent", "var(--brand, #ff0000)");

            var IN_BASE = 1.32;
            var OUT_BASE = 0.42;
            var STAGE_IN_BASE = 0.38;
            var RACK_AT_BASE = 0.62;
            var RACK_DURATION_BASE = 0.7;
            var duration = Math.max(
              0.001,
              parseFloat(
                ((root.parentElement && root.parentElement.closest("[data-duration]")) || root)
                  .dataset.duration || "3.5",
              ),
            );
            var fixedDuration = IN_BASE + OUT_BASE;
            var phaseScale = duration < fixedDuration ? duration / fixedDuration : 1;
            var IN = IN_BASE * phaseScale;
            var OUT = OUT_BASE * phaseScale;
            var STAGE_IN = STAGE_IN_BASE * phaseScale;
            var RACK_AT = RACK_AT_BASE * phaseScale;
            var RACK_DURATION = RACK_DURATION_BASE * phaseScale;
            var HOLD = Math.max(0, duration - IN - OUT);
            var HOLD_START = IN;
            var OUT_START = IN + HOLD;

            var tl = gsap.timeline({ paused: true });

            tl.set(stage, { opacity: 0 }, 0);
            tl.set(
              cardA,
              {
                "--fr-blur": 0,
                opacity: 1,
                x: "0cqw",
                y: "-0.5cqh",
                scale: 1.045,
                rotation: -3,
              },
              0,
            );
            tl.set(
              cardB,
              {
                "--fr-blur": 0.48,
                opacity: 0.52,
                x: "1.6cqw",
                y: "0.8cqh",
                scale: 0.93,
                rotation: 2.4,
              },
              0,
            );

            tl.to(stage, { opacity: 1, duration: STAGE_IN, ease: "power2.out" }, 0);

            tl.to(
              cardA,
              {
                "--fr-blur": 0.48,
                opacity: 0.5,
                x: "-1.4cqw",
                y: "0.8cqh",
                scale: 0.94,
                rotation: -1.6,
                duration: RACK_DURATION,
                ease: "sine.inOut",
              },
              RACK_AT,
            );
            tl.to(
              cardB,
              {
                "--fr-blur": 0,
                opacity: 1,
                x: "-1.6cqw",
                y: "-0.4cqh",
                scale: 1.04,
                rotation: 1.3,
                duration: RACK_DURATION,
                ease: "sine.inOut",
              },
              RACK_AT,
            );

            if (HOLD > 0) {
              tl.to(cardA, { y: "1.15cqh", duration: HOLD, ease: "sine.inOut" }, HOLD_START);
              tl.to(cardB, { y: "-0.75cqh", duration: HOLD, ease: "sine.inOut" }, HOLD_START);
            }

            tl.to(stage, { opacity: 0, duration: OUT, ease: "power2.in" }, OUT_START);

            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["focus-rack"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
