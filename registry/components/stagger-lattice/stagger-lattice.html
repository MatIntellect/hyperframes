<!--
  Stagger Lattice - advanced HyperFrames primitive.

  This is intentionally seekable: drive it from a paused GSAP timeline.
  MotionPath examples require GSAP MotionPathPlugin. Three.js examples expose
  a render(progress) adapter instead of a free-running requestAnimationFrame loop.
-->

<div class="hf-advanced-stagger-lattice">
  <div class="grid">
    <span class="cell"></span><span class="cell"></span><span class="cell"></span
    ><span class="cell"></span><span class="cell"></span><span class="cell"></span
    ><span class="cell"></span><span class="cell"></span><span class="cell"></span
    ><span class="cell"></span><span class="cell"></span><span class="cell"></span
    ><span class="cell"></span><span class="cell"></span><span class="cell"></span
    ><span class="cell"></span><span class="cell"></span><span class="cell"></span
    ><span class="cell"></span><span class="cell"></span><span class="cell"></span
    ><span class="cell"></span><span class="cell"></span><span class="cell"></span
    ><span class="cell"></span><span class="cell"></span><span class="cell"></span
    ><span class="cell"></span><span class="cell"></span><span class="cell"></span
    ><span class="cell"></span><span class="cell"></span><span class="cell"></span
    ><span class="cell"></span><span class="cell"></span><span class="cell"></span
    ><span class="cell"></span><span class="cell"></span><span class="cell"></span
    ><span class="cell"></span>
  </div>
</div>

<style>

  }

    src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
    unicode-range:
      U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329,
      U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
    unicode-range:
      U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329,
      U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F,
      U+A720-A7FF;
  }
  .hf-advanced-stagger-lattice {
    --hf-accent: var(--accent, #ff0000);
    --hf-l1: color-mix(in srgb, var(--fg, #f2f2f2) 72%, transparent);
    --hf-l3: color-mix(in srgb, var(--fg, #f2f2f2) 18%, transparent);
    --hf-l4: color-mix(in srgb, var(--fg, #f2f2f2) 8%, transparent);
    --hf-hair: color-mix(in srgb, var(--fg, #f2f2f2) 14%, transparent);
    color: var(--hf-l1);
    font-family: "Montserrat", system-ui, sans-serif;
  }
  .hf-advanced-stagger-lattice {
    width: 700px;
    max-width: 100%;
    min-height: 420px;
    border-radius: 30px;
    padding: 36px;
    background: var(--surface, #18181a);
    border: 2px solid var(--border, #2e2e32);
    box-shadow: 0 28px 80px rgba(0, 0, 0, 0.35);
    display: grid;
    place-items: center;
  }
  .hf-advanced-stagger-lattice .grid {
    display: grid;
    grid-template-columns: repeat(8, 46px);
    gap: 10px;
  }
  .hf-advanced-stagger-lattice .cell {
    width: 46px;
    height: 46px;
    border-radius: 14px;
    background: var(--hf-l1);

  .hf-advanced-stagger-lattice svg {

  .hf-advanced-stagger-lattice path {

    stroke-dasharray: 900;
    stroke-dashoffset: var(--hf-dash, 0);
  }
  .hf-advanced-stagger-lattice .stack {
    position: relative;
    width: 520px;
    height: 260px;
  }
  .hf-advanced-stagger-lattice .card {
    position: absolute;
    inset: 0;
    border-radius: 26px;
    background: linear-gradient(var(--hf-l4), var(--hf-l4)), var(--surface, #18181a);
    border: 2px solid var(--hf-hair);
    box-shadow: 0 20px 54px rgba(0, 0, 0, 0.4);
    transform: translateY(var(--hf-card-y, 0px)) scale(var(--hf-card-scale, 1));
    opacity: var(--hf-card-opacity, 1);
  }
</style>

<!--
  Timeline integration: built in, see the script below. It registers its own paused timeline as
  window.__timelines["stagger-lattice"]; mount the snippet inside a clip with data-composition-id="stagger-lattice"
  and the runtime nests it at that clip's start.
-->

<script>
  /* own timeline (component-quality-bar.md X1): the host clip carries data-composition-id="stagger-lattice" */
  (function () {
    var startTime = 0;
    var tl = gsap.timeline({ paused: true });
    tl.fromTo(
      ".hf-advanced-stagger-lattice .cell",
      { "--hf-cell-y": "24px", "--hf-cell-scale": 0.72, "--hf-cell-opacity": 0 },
      {
        "--hf-cell-y": "0px",
        "--hf-cell-scale": 1,
        "--hf-cell-opacity": 1,
        duration: 0.28,
        stagger: { each: 0.018, from: "center", grid: [5, 8] },
        ease: "power2.out",
      },
      startTime,
    );
    window.__timelines = window.__timelines || {};
    window.__timelines["stagger-lattice"] = tl;
  })();
</script>
