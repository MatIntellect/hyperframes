<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    { "id": "chip", "type": "string", "role": "content", "label": "Chip unit", "description": "Abbreviated unit of the seconds left while the ring holds, the same after any number (сек, с, s); empty means no chip.", "default": "сек", "maxLength": 8 }
  ]'
>
  <head>
    <meta charset="utf-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
          U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range:
          U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329,
          U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113,
          U+2C60-2C7F, U+A720-A7FF;
      }
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: transparent;
        overflow: hidden;
      }
      /* ---- yt-circle-pointer -----------------------------------------------
         Annotation tools: a hand-drawn-feel circle that draws on around a
         target, and a countdown chip. Position instances via top/left with
         explicit width/height. */
      .yt-circle {
        --yt-red: var(--brand, #ff0000);
        position: absolute;
        pointer-events: none;
      }
      .yt-circle svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .yt-circle ellipse {
        fill: none;
        stroke: var(--yt-ptr-color, var(--yt-red));
        stroke-width: 6;
        stroke-linecap: round;
        transform: rotate(-6deg);
        transform-origin: 50% 50%;
      }
      .yt-count {
        position: absolute;
        display: inline-flex;
        align-items: center;
        gap: 14px;
        padding: 16px 32px;
        border-radius: 999px;
        font-family: "Montserrat", ui-sans-serif, sans-serif;
        font-weight: 700;
        font-size: 40px;
        /* --yt-red lives on .yt-circle only, so the chip fell back to no fill */
        background: var(--yt-count-bg, var(--brand, #ff0000));
        color: var(--fg, #f2f2f2);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
        pointer-events: none;
        opacity: 0;
      }
      .yt-count .num {
        font-variant-numeric: tabular-nums;
        min-width: 1.2em;
        text-align: center;
      }
      /* The scene fills the host box; the ring circles a target in the
         host's frame underneath (the source baked a cyan-blue scene). */
      #yt-ptr-root {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <!-- A red ring drawn on around a target, with a countdown chip.
         Whole: mount on a host whose style box is the target; the ring fills
         the box (at most 520x260), the chip sits top right and counts the
         seconds the ring holds; the ring leaves before the host ends.
         WIRING, for elements of your own: copy the CSS rules .yt-circle,
         .yt-circle svg, .yt-circle ellipse, .yt-count, .yt-count .num; the
         markup of #yt-ptr-circle and #yt-ptr-count with new ids, placed over
         your target; the helpers block under "copy these helpers into the
         host script" (before your timeline code); then on your timeline:

           ytCircleOn(tl, "#yt-my-circle", 3.0);          // draws the ring
           ytCircleOff(tl, "#yt-my-circle", 6.0);
           ytCountIn(tl, "#yt-my-count", 2.0);
           ytCountdown(tl, "#yt-my-count", 2.4, 5);       // 5 -> 0, pulsing each tick
    -->
    <div id="yt-ptr-root" data-composition-id="yt-circle-pointer" data-start="0" data-duration="5">
      <div
        class="yt-circle"
        id="yt-ptr-circle"
        data-layout-allow-occlusion
        style="left: calc(50% - 260px); top: calc(50% - 130px); width: 520px; height: 260px"
      >
        <svg viewBox="0 0 520 260"><ellipse cx="260" cy="130" rx="244" ry="110"></ellipse></svg>
      </div>
      <div class="yt-count" id="yt-ptr-count" style="right: 14%; top: 14%">
        <span class="num">3</span><span>сек</span>
      </div>
      <div
        id="yt-ptr-drv"
        class="clip"
        data-start="0"
        data-duration="5"
        data-track-index="0"
        style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none"
      ></div>
    </div>
    <script>
      /* hostSlot: the whole-scene clip follows the host slot (komp-sobrat.py klip_hozyaina; caret-swap:219) */
      (function () {
        var c = document.getElementById("yt-ptr-drv");
        var h = c && c.parentElement && c.parentElement.closest("[data-duration]");
        if (h) c.dataset.duration = h.dataset.duration;
      })();
    </script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};

        // ---- copy these helpers into the host script ----
        window.ytCircleOn = function (tl, target, at, dur) {
          var el = document.querySelector(target + " ellipse");
          var len = el.getTotalLength();
          // The round cap paints a dot even at full dash offset: the ring stays hidden until it starts.
          gsap.set(el, { strokeDasharray: len, strokeDashoffset: len, opacity: 0 });
          tl.set(el, { opacity: 1 }, at);
          tl.to(
            el,
            { strokeDashoffset: 0, duration: dur === undefined ? 0.7 : dur, ease: "power2.inOut" },
            at,
          );
        };
        window.ytCircleOff = function (tl, target, at) {
          tl.to(target, { opacity: 0, duration: 0.35, ease: "power2.in" }, at);
        };
        window.ytCountIn = function (tl, target, at) {
          gsap.set(target, { y: -18, scale: 0.9 });
          tl.to(target, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.5)" }, at);
        };
        window.ytCountdown = function (tl, target, at, from) {
          var num = document.querySelector(target + " .num");
          var st = { v: from };
          tl.to(
            st,
            {
              v: 0,
              duration: from,
              ease: "none",
              onUpdate: function () {
                num.textContent = String(Math.ceil(st.v));
              },
            },
            at,
          );
          for (var i = 1; i <= from; i++) {
            tl.to(target, { scale: 1.07, duration: 0.09, ease: "sine.out" }, at + i - 0.09);
            tl.to(target, { scale: 1, duration: 0.14, ease: "sine.in" }, at + i);
          }
        };

        // ---- the unit: ring sized to the host box, timing from the host clip ----
        var root = document.getElementById("yt-ptr-root");
        var vars =
          window.__hyperframes && window.__hyperframes.getVariables
            ? window.__hyperframes.getVariables()
            : {};
        var chip = typeof vars.chip === "string" ? vars.chip.trim() : "сек";
        // length from the host clip: the runtime strips data-duration from a mounted root (flattenedRoot.ts:8-19)
        var D = parseFloat(
          ((root.parentElement && root.parentElement.closest("[data-duration]")) || root).dataset
            .duration || "5",
        );
        // The ring fills the host box, capped at the 520x260 ring of a full-frame host.
        var W = root.clientWidth || 1080;
        var H = root.clientHeight || 1920;
        var on = Math.min(1.0, D * 0.2);
        var off = Math.max(on + 0.8, D - 0.8);
        // the chip counts the whole seconds the ring holds; no whole second, no chip
        var from = Math.floor(off - 0.7);
        if (from < 1) chip = "";
        var countEl = document.getElementById("yt-ptr-count");
        if (chip) countEl.querySelector(".num").nextElementSibling.textContent = chip;
        else countEl.style.display = "none";
        // On a small host the ring takes the box below the chip, so the chip never covers it.
        var top0 = 0;
        var rw = Math.max(80, Math.min(W - 24, 520));
        var rh = Math.max(40, Math.min(H - 24, 260));
        if (chip && countEl.offsetTop + countEl.offsetHeight + 12 > (H - rh) / 2) {
          top0 = countEl.offsetTop + countEl.offsetHeight + 12;
          rh = Math.max(40, Math.min(H - top0 - 12, 260));
        }
        var ring = document.getElementById("yt-ptr-circle");
        ring.style.cssText =
          "left:" +
          (W - rw) / 2 +
          "px;top:" +
          (top0 + (H - top0 - rh) / 2) +
          "px;width:" +
          rw +
          "px;height:" +
          rh +
          "px";
        ring.querySelector("svg").setAttribute("viewBox", "0 0 " + rw + " " + rh);
        var ell = ring.querySelector("ellipse");
        ell.setAttribute("cx", rw / 2);
        ell.setAttribute("cy", rh / 2);
        ell.setAttribute("rx", rw / 2 - 16);
        ell.setAttribute("ry", rh / 2 - 20);

        var tl = gsap.timeline({ paused: true });
        window.ytCircleOn(tl, "#yt-ptr-circle", on);
        window.ytCircleOff(tl, "#yt-ptr-circle", off);
        if (chip) {
          document.querySelector("#yt-ptr-count .num").textContent = String(from);
          window.ytCountIn(tl, "#yt-ptr-count", Math.min(0.3, D * 0.06));
          window.ytCountdown(tl, "#yt-ptr-count", 0.7, from);
          tl.to("#yt-ptr-count", { opacity: 0, duration: 0.3, ease: "power2.in" }, off + 0.1);
        }
        tl.set("#yt-ptr-root", { visibility: "hidden" }, D - 0.02);
        window.__timelines["yt-circle-pointer"] = tl;
      })();
    </script>
  </body>
</html>
