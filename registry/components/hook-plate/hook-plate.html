<!doctype html>
<!--
  hook-plate: the opening hook headline of a vertical reel, one line on a black plate.

  The hook is the speaker's first phrase, word for word, never cut, upper case, one size for
  every hook: 6% of the frame height (115 px of 1920; motion.md: titles 4-9%, one or two
  lines). One line when it fits the readable width (72.2% of the box: 780 px of 1080), else a
  second line at a whole word, on the same plate with the same padding; only a hook too long
  for two lines steps the size down. The
  plate is centred in the hook band (y 70.8%-80.2%: 1360-1540 px); a taller plate keeps its
  bottom on 1540 and rises over the lower edge of the opening circle, never above y 65.8%
  (1264 px), so it can cover the beard but not the face. The letters sit dead centre in the
  plate with equal padding on all four sides (text-box trim to cap height and baseline, one
  padding value). On screen from 0 s by default: the first frame is the thumbnail.

  Variables:
    - text (string): the hook line.
    - cues (string): "in,out" seconds from mount start. in: the plate pops in (empty: on screen from 0);
      out: the plate leaves, used only with exit fade.
    - exit (none | fade): none holds the plate to the end of the mount.

  Mount contract: the runtime clones only this template. #root fills the host box (mount it
  over the whole 1080 x 1920 frame), has no data-width or data-height, and registers one
  paused timeline under the hook-plate key. Fonts come from the project's assets/fonts.
-->
<html
  lang="ru"
  data-composition-id="hook-plate"
  data-composition-duration="30"
  data-composition-variables='[
    { "id": "text", "type": "string", "role": "content", "label": "Text", "description": "The hook: the first phrase of the recording, word for word, never cut. Upper case on screen, one size for every hook (6% of the frame height, 115 px of 1920); one line when it fits 780, else wraps to a second line at a whole word, on the same plate.", "default": "Монтаж с ИИ" },
    { "id": "cues", "type": "string", "role": "timing", "label": "Cues", "description": "Comma-separated seconds from mount start: 1 the plate pops in (empty: on screen from 0 s, the thumbnail frame), 2 the plate leaves (only with exit fade).", "default": "" },
    { "id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "none holds the plate to the end of the mount; fade takes it out at cue 2 (or 0.3 s before the mount ends).", "default": "none", "options": [{ "value": "none", "label": "None" }, { "value": "fade", "label": "Fade" }] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Hook Plate</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="hook-plate" data-duration="30" data-fps="30">
        <style>
          @font-face {
            font-family: "Bebas Neue";
            src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
            font-weight: 700;
            font-display: block;
          }
          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            container-type: size;
            pointer-events: none;
          }
          .hp-clip {
            position: absolute;
            inset: 0;
          }
          .hp-plate {
            position: absolute;
            left: 0;
            right: 0;
            margin: 0 auto;
            width: fit-content;
            top: 71.6146cqh;
            background: var(--plate, #000);
            border-radius: 2.5926cqw;
            color: var(--fg, #f2f2f2);
            font-family: "Bebas Neue", sans-serif;
            font-weight: 700;
            font-size: 97px;
            line-height: 1.08;
            text-transform: uppercase;
            text-align: center;
            white-space: nowrap;
            text-box: trim-both cap alphabetic;
            padding: 0.3em;
            opacity: 0;
          }
        </style>

        <div
          id="hook-plate-clip"
          class="hp-clip clip"
          data-start="0"
          data-duration="30"
          data-track-index="0"
        >
          <div class="hp-plate" id="hp-plate">Монтаж с ИИ</div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            var root = document.getElementById("root");
            var plate = document.getElementById("hp-plate");
            var V =
              window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
                ? window.__hyperframes.getVariables()
                : {};
            var text = typeof V.text === "string" && V.text.trim() ? V.text.trim() : "Монтаж с ИИ";
            plate.textContent = text;

            var cues = String(V.cues || "")
              .split(",")
              .map(function (v) {
                return parseFloat(v);
              });
            var tIn = isFinite(cues[0]) && cues[0] > 0 ? cues[0] : 0;
            var exit = V.exit === "fade" ? "fade" : "none";

            var tl = gsap.timeline({ paused: true });
            if (tIn > 0)
              tl.fromTo(
                plate,
                { opacity: 0, scale: 0.92 },
                { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(1.7)" },
                tIn,
              );
            else tl.set(plate, { opacity: 1 }, 0);
            if (exit === "fade") {
              var tOut = isFinite(cues[1]) && cues[1] > tIn ? cues[1] : 29.7;
              tl.to(plate, { opacity: 0, duration: 0.12, ease: "power2.in" }, tOut - 0.12);
              tl.set(plate, { opacity: 0, visibility: "hidden" }, tOut);
            }
            tl.set({}, {}, 30);
            window.__timelines = window.__timelines || {};
            window.__timelines["hook-plate"] = tl;

            // One size for every hook (Mat 12.11): 6% of the frame height (115 px of 1920), the largest
            // at which two lines still keep the plate below y 1264; titles 4-9%, one or two lines
            // (motion.md:23). One line if it fits 780 with the plate padding; else two lines split at
            // a whole word, the most even split first, same size. Only when two lines do not fit
            // either does the size step down. Measured after the font loads; render waits on buildReady.
            function fit() {
              var H = root.clientHeight;
              var maxW = root.clientWidth * 0.72222;
              var maxH = H * (0.80208 - 0.65833);
              function set(lines, fs) {
                plate.textContent = "";
                lines.forEach(function (l, i) {
                  if (i) plate.appendChild(document.createElement("br"));
                  plate.appendChild(document.createTextNode(l));
                });
                plate.style.fontSize = fs + "px";
              }
              function fits(lines, fs) {
                var wide = lines.every(function (l) {
                  return window.__hyperframes.fitTextFontSize(l.toUpperCase(), {
                    fontFamily: "Bebas Neue",
                    fontWeight: 700,
                    maxWidth: maxW - 0.6 * fs,
                    baseFontSize: fs,
                    minFontSize: fs,
                  }).fits;
                });
                if (!wide) return false;
                set(lines, fs);
                return plate.offsetHeight <= maxH;
              }
              var words = text.split(/\s+/);
              var splits = [];
              for (var k = 1; k < words.length; k++)
                splits.push([words.slice(0, k).join(" "), words.slice(k).join(" ")]);
              // a one-letter word (с, в, и, к, у, о, а, я) never hangs at the end of the first line
              splits = splits.filter(function (l) {
                return !/(^|\s)\S$/.test(l[0]);
              });
              splits.sort(function (a, b) {
                return Math.abs(a[0].length - a[1].length) - Math.abs(b[0].length - b[1].length);
              });
              var choices = [[text]].concat(splits);
              var pick = null;
              for (var fs = Math.round(H * 0.06); fs >= 42 && !pick; fs--) {
                for (var i = 0; i < choices.length && !pick; i++)
                  if (fits(choices[i], fs)) pick = { lines: choices[i], fs: fs };
              }
              pick = pick || { lines: choices[choices.length > 1 ? 1 : 0], fs: 42 };
              set(pick.lines, pick.fs);
              // centred in the band 1360-1540; taller – bottom on 1540, rising over the circle
              var h = plate.offsetHeight;
              plate.style.top = Math.min(H * 0.75521 - h / 2, H * 0.80208 - h) + "px";
            }
            window.__hf = window.__hf || {};
            window.__hf.buildReady = window.__hf.buildReady || {};
            window.__hf.buildReady["hook-plate"] = document.fonts
              .load('700 100px "Bebas Neue"', text)
              .then(fit);
          })();
        </script>
      </div>
    </template>
  </body>
</html>
