<!doctype html>
<!--
  constellation-hub: HyperFrames video primitive (feature tour / exhibit)

  Feature nodes form an orbit around one fixed hub. Each connector draws
  from the hub to its node in narration order while that node brightens,
  then every element settles into one readable lockup.

  Variables:
    - hub_label (string, default "Ролик"): text inside the fixed hub.
    - nodes (string, default "Сценарий,Съёмка,Монтаж,Публикация"): comma-separated
      feature labels introduced from first to last.
    - cues (string, default ""): comma-separated seconds (from mount start)
      for each node reveal. Empty keeps the authored even spread.
    The accent rides the reel brand red (--brand).
    - exit (none | fade | up, default "none"): optional departure.

  Envelope, fixed IN and OUT with elastic HOLD only:
    IN_BASE  = 2.40s, hub arrival plus ordered connector and node reveals
               (cues can stretch the reveal phase past IN_BASE)
    HOLD     = max(0, D - IN - OUT), subtle orbital drift around the fixed hub
    OUT_BASE = 0.50s departure when exit is fade or up, 0s when exit is
               none (the default: the lockup holds until the cut)
    If D is shorter than IN_BASE + OUT_BASE, IN and OUT compress together.
    The timeline is never time-scaled.

  Draw contract: each connector reads its real SVG getTotalLength() during
  synchronous construction. That value owns both dash array and initial dash
  offset, and GSAP draws the connector by tweening the offset to zero.

  Mount contract: the runtime clones only this template. #root fills the host
  box, uses cqw and cqh for elastic sizing, carries no data-width or
  data-height, and registers one paused timeline under the literal
  constellation-hub key.
-->
<html
  lang="en"
  data-composition-id="constellation-hub"
  data-composition-duration="4.5"
  data-composition-variables='[
    {"id": "hub_label", "type": "string", "role": "content", "label": "Hub label", "description": "Text displayed inside the fixed central hub.", "default": "Ролик", "maxLength": 16},
    {"id": "nodes", "type": "string", "role": "content", "label": "Feature nodes", "description": "Comma-separated feature labels introduced in narration order.", "default": "Сценарий,Съёмка,Монтаж,Публикация"},
    {"id": "cues", "type": "string", "role": "timing", "label": "Cues", "description": "Comma-separated seconds (from mount start) for each node reveal. Empty keeps the authored even spread.", "default": ""},
    {"id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "Optional departure. Default none: the lockup holds until the frame cuts.", "default": "none", "options": [{"value": "none", "label": "None"}, {"value": "fade", "label": "Fade"}, {"value": "up", "label": "Up"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Constellation Hub</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="constellation-hub" data-duration="4.5" data-fps="30">
        <style>
          @font-face {
            font-family: "Bebas Neue";
            src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
            font-weight: 700;
            font-display: block;
          }
          @font-face {
            font-family: "Montserrat";
            src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
            font-weight: 100 900;
            font-display: block;
            unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
          }
          @font-face {
            font-family: "Montserrat";
            src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
            font-weight: 100 900;
            font-display: block;
            unicode-range:
              U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
              U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
          }
          @font-face {
            font-family: "Montserrat";
            src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
            font-weight: 100 900;
            font-display: block;
            unicode-range:
              U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308,
              U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4,
              U+2113, U+2C60-2C7F, U+A720-A7FF;
          }
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            container-type: size;
            isolation: isolate;
            color: var(--fg, #f2f2f2);
            font-family: var(--font-body, "Montserrat", sans-serif);
            pointer-events: none;
          }

          .ch-clip {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
            background: var(--bg, transparent);
          }

          .ch-lockup {
            position: relative;
            width: 100cqw;
            height: 100cqh;
            opacity: 0;
          }

          .ch-orbit {
            position: absolute;
            left: 0;
            top: 0;
            width: 100cqw;
            height: 100cqh;
            transform-origin: 50cqw 50cqh;
            will-change: transform;
          }

          .ch-connectors {
            position: absolute;
            left: 0;
            top: 0;
            width: 100cqw;
            height: 100cqh;
            overflow: visible;
          }

          .ch-connector {
            fill: none;
            stroke: var(--ch-accent);
            stroke-width: 0.72;
            stroke-linecap: round;
            opacity: 0.72;
          }

          .ch-node-position {
            position: absolute;
            width: var(--ch-node-width, 21cqw);
            transform: translate(-50%, -50%);
          }

          .ch-node {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 10cqh;
            padding: var(--space-1, 1.2cqh) var(--space-2, 2.4cqw);
            overflow: hidden;
            border: 0.14cqw solid var(--border, #2e2e32);
            border-radius: var(--radius, 2.4cqw);
            /* plates stay clean: surface mixed with red gave a brown the palette does not have */
            background: var(--surface, #18181a);
            box-shadow: 0 1.8cqh 4.8cqh color-mix(in srgb, var(--bg, #0c1014) 38%, transparent);
            color: var(--fg, #f2f2f2);
            font-family: var(--font-body, "Montserrat", sans-serif);
            font-size: max(28px, var(--ch-node-font-size, 2.25cqw));
            font-weight: 680;
            line-height: 1.1;
            letter-spacing: -0.01em;
            text-align: center;
            white-space: normal;
            overflow-wrap: break-word;
            will-change: transform, opacity;
          }

          .ch-hub {
            position: absolute;
            left: 50cqw;
            top: 50cqh;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 21cqw;
            min-height: 18cqh;
            padding: var(--space-2, 2.4cqh) var(--space-2, 2.4cqw);
            overflow: hidden;
            border: 0.22cqw solid var(--ch-accent);
            border-radius: var(--radius, 2.4cqw);
            background: var(--ch-accent);
            box-shadow:
              0 0 7cqh color-mix(in srgb, var(--ch-accent) 24%, transparent),
              0 2.4cqh 6cqh color-mix(in srgb, var(--bg, #0c1014) 46%, transparent);
            color: var(--fg, #f2f2f2);
            font-family: var(--font-body, "Montserrat", sans-serif);
            font-size: max(28px, 3.05cqw);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.03em;
            text-align: center;
            white-space: normal;
            overflow-wrap: break-word;
            transform: translate(-50%, -50%);
            will-change: transform, opacity;
          }
        </style>

        <div
          id="constellation-hub-clip"
          class="ch-clip clip"
          data-start="0"
          data-duration="4.5"
          data-track-index="0"
        >
          <div class="ch-lockup" role="img">
            <div class="ch-orbit">
              <svg
                class="ch-connectors"
                viewBox="0 0 100 100"
                preserveAspectRatio="none"
                aria-hidden="true"
              ></svg>
              <div class="ch-nodes"></div>
            </div>
            <div class="ch-hub"></div>
          </div>
        </div>

        <script>
          /* hostSlot: the whole-scene clip follows the host slot (komp-sobrat.py klip_hozyaina; caret-swap:219) */
          (function () {
            var c = document.getElementById("constellation-hub-clip");
            var h = c && c.parentElement && c.parentElement.closest("[data-duration]");
            if (h) c.dataset.duration = h.dataset.duration;
          })();
        </script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var lockup = root.querySelector(".ch-lockup");
            var orbit = root.querySelector(".ch-orbit");
            var connectorsLayer = root.querySelector(".ch-connectors");
            var nodesLayer = root.querySelector(".ch-nodes");
            var hub = root.querySelector(".ch-hub");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            var hubLabel = vars.hub_label == null ? "Ролик" : String(vars.hub_label).trim();
            var nodeSource =
              vars.nodes == null ? "Сценарий,Съёмка,Монтаж,Публикация" : String(vars.nodes);
            var nodeLabels = nodeSource
              .split(",")
              .map(function (label) {
                return label.trim();
              })
              .filter(function (label) {
                return label.length > 0;
              });

            if (nodeLabels.length === 0) nodeLabels = ["Шаг"];

            // One palette: the accent rides the reel brand red.
            var accentColors = { brand: "var(--brand, #ff0000)" };
            var accent = "brand";
            var exit = vars.exit === "fade" || vars.exit === "up" ? vars.exit : "none";
            var cuesValue = vars.cues == null ? "" : String(vars.cues);
            var cues = cuesValue.split(",").reduce(function (result, token) {
              var trimmed = token.trim();
              if (trimmed === "") return result;
              var seconds = Number(trimmed);
              if (!Number.isFinite(seconds) || seconds < 0) return result;
              result.push(seconds);
              return result;
            }, []);

            // A standing box (vertical reel field) is narrow: nodes ride a tighter ellipse and
            // get wider plates, so a label at the 28px floor fits and wraps instead of cutting.
            var standing = root.clientHeight > root.clientWidth;
            var radiusX = standing ? 30 : 38;
            var nodeWidth = standing
              ? 34
              : Math.max(12, Math.min(21, 78 / Math.max(4, nodeLabels.length) + 2));
            if (standing) hub.style.width = "30cqw";
            var nodeFontSize = nodeLabels.length > 6 ? 1.75 : 2.25;

            root.style.setProperty("--ch-accent", accentColors[accent]);
            root.style.setProperty("--ch-node-width", nodeWidth.toFixed(2) + "cqw");
            root.style.setProperty("--ch-node-font-size", nodeFontSize.toFixed(2) + "cqw");
            hub.textContent = hubLabel;
            lockup.setAttribute(
              "aria-label",
              "Hub " + hubLabel + " connected to " + nodeLabels.join(", "),
            );

            var svgNamespace = "http://www.w3.org/2000/svg";
            var connectors = [];
            var nodes = [];
            var connectorFragment = document.createDocumentFragment();
            var nodeFragment = document.createDocumentFragment();

            nodeLabels.forEach(function (label, index) {
              var angle = -Math.PI / 2 + (index / nodeLabels.length) * Math.PI * 2;
              var x = 50 + Math.cos(angle) * radiusX;
              var y = 50 + Math.sin(angle) * 39;
              var connector = document.createElementNS(svgNamespace, "path");
              connector.setAttribute("class", "ch-connector");
              // The connector stops at the node's edge (nodeWidth x 10cqh box): drawn to the
              // centre it showed through the settled, slightly translucent label.
              var dx = x - 50;
              var dy = y - 50;
              var edge = Math.min(
                dx ? nodeWidth / 2 / Math.abs(dx) : Infinity,
                dy ? 5 / Math.abs(dy) : Infinity,
              );
              var ex = x - dx * edge;
              var ey = y - dy * edge;
              connector.setAttribute("d", "M 50 50 L " + ex.toFixed(3) + " " + ey.toFixed(3));
              connectorFragment.appendChild(connector);
              connectors.push(connector);

              var position = document.createElement("div");
              position.className = "ch-node-position";
              position.style.left = x.toFixed(3) + "cqw";
              position.style.top = y.toFixed(3) + "cqh";

              var node = document.createElement("div");
              node.className = "ch-node";
              node.textContent = label;
              position.appendChild(node);
              nodeFragment.appendChild(position);
              nodes.push(node);
            });

            connectorsLayer.appendChild(connectorFragment);
            nodesLayer.appendChild(nodeFragment);

            connectors.forEach(function (connector) {
              var length = connector.getTotalLength();
              connector.style.strokeDasharray = length + " " + length;
              connector.style.strokeDashoffset = String(length);
            });

            var IN_BASE = 2.4;
            var OUT_BASE = exit === "none" ? 0 : 0.5;
            var HUB_IN_BASE = 0.46;
            var SEQUENCE_START_BASE = 0.34;
            var DRAW_BASE = 0.5;
            var NODE_UP_BASE = 0.3;
            var NODE_DOWN_BASE = 0.2;
            var SETTLE_BASE = 0.28;
            var STILLNESS = 0.24;
            var durationValue = Number(
              ((root.parentElement && root.parentElement.closest("[data-duration]")) || root)
                .dataset.duration,
            );
            var duration =
              Number.isFinite(durationValue) && durationValue > 0 ? durationValue : 4.5;
            var phaseBase = Math.max(0.001, IN_BASE + OUT_BASE);
            var phaseScale = duration < phaseBase ? duration / phaseBase : 1;
            var IN = IN_BASE * phaseScale;
            var OUT = OUT_BASE * phaseScale;
            var HUB_IN = HUB_IN_BASE * phaseScale;
            var SEQUENCE_START = SEQUENCE_START_BASE * phaseScale;
            var DRAW = DRAW_BASE * phaseScale;
            var NODE_UP = NODE_UP_BASE * phaseScale;
            var NODE_DOWN = NODE_DOWN_BASE * phaseScale;
            var SETTLE = SETTLE_BASE * phaseScale;

            // Reveal schedule: cues own each connector-and-node start when
            // provided; the authored even spread otherwise. Reveals beyond
            // the cue list extrapolate at the cue list's own gap, and every
            // reveal clamps so the settle finishes before any exit.
            var starts;
            var SETTLE_START;
            if (cues.length > 0) {
              var lastCue = cues[cues.length - 1];
              var cueGap =
                cues.length >= 2 ? Math.max(0.05, (lastCue - cues[0]) / (cues.length - 1)) : DRAW;
              var latestStart = Math.max(0, duration - OUT - (NODE_UP + NODE_DOWN + SETTLE));
              starts = nodeLabels.map(function (label, index) {
                var at =
                  index < cues.length
                    ? cues[index]
                    : lastCue + (index - (cues.length - 1)) * cueGap;
                return Math.min(latestStart, Math.max(0, at));
              });
              SETTLE_START = Math.max.apply(null, starts) + NODE_UP + NODE_DOWN;
            } else {
              SETTLE_START = Math.max(SEQUENCE_START, IN - SETTLE);
              var LAST_DRAW_START = Math.max(SEQUENCE_START, SETTLE_START - DRAW);
              var STEP =
                nodeLabels.length > 1
                  ? (LAST_DRAW_START - SEQUENCE_START) / (nodeLabels.length - 1)
                  : 0;
              starts = nodeLabels.map(function (label, index) {
                return SEQUENCE_START + index * STEP;
              });
            }
            var IN_END = Math.min(Math.max(0, duration - OUT), Math.max(IN, SETTLE_START + SETTLE));
            var HOLD = Math.max(0, duration - IN_END - OUT);
            var HOLD_START = IN_END;
            var OUT_START = IN_END + HOLD;

            gsap.set(lockup, { opacity: 0, scale: 0.985 });
            gsap.set(hub, { opacity: 0, scale: 0.86 });
            gsap.set(orbit, { rotation: -4 });
            gsap.set(nodes, { opacity: 0.24, scale: 0.92 });

            var tl = gsap.timeline({ paused: true });

            tl.to(lockup, { opacity: 1, scale: 1, duration: HUB_IN, ease: "power2.out" }, 0);
            tl.to(hub, { opacity: 1, scale: 1, duration: HUB_IN, ease: "back.out(1.7)" }, 0);
            tl.to(orbit, { rotation: 0, duration: IN, ease: "power3.out" }, 0);

            connectors.forEach(function (connector, index) {
              var start = starts[index];
              var node = nodes[index];

              tl.to(connector, { strokeDashoffset: 0, duration: DRAW, ease: "power2.out" }, start);
              tl.to(
                node,
                { opacity: 1, scale: 1.055, duration: NODE_UP, ease: "power3.out" },
                start,
              );
              tl.to(
                node,
                { opacity: 0.82, scale: 1, duration: NODE_DOWN, ease: "power2.out" },
                start + NODE_UP,
              );
            });

            tl.to(
              nodes,
              { opacity: 0.88, scale: 1, duration: SETTLE, ease: "power2.out" },
              SETTLE_START,
            );
            tl.to(connectors, { opacity: 1, duration: SETTLE, ease: "power2.out" }, SETTLE_START);

            var driftHalf = Math.max(0, HOLD - STILLNESS) / 2;
            if (driftHalf > 0) {
              tl.to(
                orbit,
                { rotation: 1.1, duration: driftHalf, ease: "sine.inOut", yoyo: true, repeat: 1 },
                HOLD_START,
              );
            }

            // OUT: optional departure; exit none holds until the frame cuts.
            if (exit === "fade") {
              tl.to(
                lockup,
                { opacity: 0, scale: 0.97, duration: OUT, ease: "power2.in" },
                OUT_START,
              );
            } else if (exit === "up") {
              tl.to(
                lockup,
                { opacity: 0, y: "-3cqh", duration: OUT, ease: "power2.in" },
                OUT_START,
              );
            }

            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["constellation-hub"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
