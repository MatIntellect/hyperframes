<!--
  Streaming Text - AI-answer token-flow primitive.

  Paste the markup, CSS and script into a composition. Use the timeline
  integration note at the bottom as the starting point for deterministic GSAP
  animation.

  This is not a typewriter. A typewriter is even; an AI answer arrives in
  bursts - two words together, a pause, three more. The GAPS table in the
  integration note is that rhythm, measured word-by-word from reference
  footage of a real streamed answer, and each word lands grey and inks to
  full colour over 0.27s, the way fresh tokens read before the eye settles.

  Wrap each word in a span with class "w". The script only styles; the
  timeline recipe reveals.

  Variables. The script reads each one, falls back to the declared default on
  anything missing or unrecognised, and writes the result as a custom property
  the CSS below consumes.

    - size (28 to 64, default 40, in px): type size; the stream is the hero of the frame, 28 px is only the floor.
    - tone (dark-on-light | light-on-dark, default light-on-dark: the reels are dark): the ink
      pair. Fresh-token grey is chosen to sit between the two.

  On every default the result matches the measured reference: 27px ink on a
  light chat ground.
-->

<div
  data-hf-ui-root
  class="hf-ui-streaming-text"
  aria-label="Streamed answer text"
  data-composition-variables='[
    { "id": "size", "type": "number", "role": "style", "label": "Size", "description": "Type size of the streamed words.", "default": 40, "min": 28, "max": 64, "step": 1, "unit": "px" },
    { "id": "tone", "type": "enum", "role": "style", "label": "Tone", "description": "Ink pair: dark words on a light ground, or light words on a dark ground.", "default": "light-on-dark", "options": [{ "value": "dark-on-light", "label": "Dark on light" }, { "value": "light-on-dark", "label": "Light on dark" }] }
  ]'
>
  <p class="hf-st-p">
    <span class="w">Тебе</span> <span class="w">не</span> <span class="w">нужен</span>
    <span class="w">монтажёр.</span> <span class="w">Нейросеть</span> <span class="w">соберёт</span>
    <span class="w">ролик</span> <span class="w">из</span> <span class="w">твоей</span>
    <span class="w">записи</span> <span class="w">и</span> <span class="w">сама</span>
    <span class="w">расставит</span> <span class="w">субтитры</span> <span class="w">и</span>
    <span class="w">хук.</span>
  </p>
</div>

<script>
  (function () {
    "use strict";

    var vars =
      window.__hyperframes && window.__hyperframes.getVariables
        ? window.__hyperframes.getVariables()
        : {};

    // Unrecognised overrides return to their declared defaults.
    function pick(table, value, fallback) {
      return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
    }

    function clampNumber(value, min, max, fallback) {
      var n = typeof value === "number" ? value : parseFloat(value);
      if (!isFinite(n)) {
        return fallback;
      }
      return Math.min(max, Math.max(min, n));
    }

    var tones = {
      "dark-on-light": { ink: "#141414", fresh: "#767676" },
      "light-on-dark": { ink: "#f3f3f3", fresh: "#5f5f5f" },
    };

    var size = clampNumber(vars.size, 28, 64, 40); // hero size; 28 px is the floor (vertical.md:18)
    var tone = tones[pick(tones, vars.tone, "light-on-dark")]; // the reels are dark

    var roots = document.querySelectorAll(".hf-ui-streaming-text");
    for (var i = 0; i < roots.length; i += 1) {
      roots[i].style.setProperty("--hf-st-size", size + "px");
      roots[i].style.setProperty("--hf-st-ink", tone.ink);
      roots[i].style.setProperty("--hf-st-fresh", tone.fresh);
    }
  })();
</script>

<!--
  Timeline integration: built in, see the script below. It registers its own paused timeline as
  window.__timelines["streaming-text"]; mount the snippet inside a clip with data-composition-id="streaming-text"
  and the runtime nests it at that clip's start.
-->

<script>
  /* own timeline (component-quality-bar.md X1): the host clip carries data-composition-id="streaming-text" */
  (function () {
    var startTime = 0;
    var tl = gsap.timeline({ paused: true });
    var GAPS = [
      0.167, 0.1, 0.0, 0.367, 0.0, 0.167, 0.133, 0.1, 0.1, 0.133, 0.167, 0.133, 0.0, 0.233, 0.167,
      0.1, 0.0, 0.133, 0.133, 0.1, 0.167, 0.133, 0.1, 0.133, 0.167, 0.1, 0.133, 0.1, 0.133,
    ];
    var t = startTime;
    gsap.utils.toArray(".hf-ui-streaming-text .w").forEach(function (w, i) {
      if (i > 0) t += GAPS[i % GAPS.length];
      tl.set(w, { opacity: 1 }, t);
      tl.fromTo(
        w,
        { color: "var(--hf-st-fresh, #5f5f5f)" },
        { color: "var(--hf-st-ink, #f3f3f3)", duration: 0.2667, ease: "none" },
        t,
      );
    });
    window.__timelines = window.__timelines || {};
    window.__timelines["streaming-text"] = tl;
  })();
</script>
