<!--
  Perspective Marquee - typography primitive for HyperFrames.

  Paste the markup and CSS into a composition. Drive the timeline integration
  from a paused GSAP timeline so renders remain deterministic.

  Variables. The script reads each one, falls back to the declared default on
  anything missing or unrecognised, and writes the result as a custom property
  the CSS above consumes. The timeline recipe below is untouched by them: it
  keeps driving one horizontal offset, and these decide how far that offset
  carries and what the strip looks like while it rolls.

    - tilt (flat | standard | steep, default standard): how far the marquee
      plane leans back toward the horizon. flat is almost head-on, steep sends
      the strip deep into the frame.
    - travel (short | standard | long, default standard): scales the offset the
      timeline drives, so the strip covers a shorter or longer run in the same
      time. short reads as a slow drift, long as a fast roll.
    - tone (ink | paper | accent, default ink): pill colour. ink is near-black
      with white type for light frames, paper near-white with dark type for
      dark ones, accent rides the brand token.
    - words (string, default МОНТАЖ, СУБТИТРЫ, ПЕРЕХОДЫ, ИИ): the
      comma separated list of pill labels. The list is laid down twice so the
      strip still reads as a continuous loop.

  On every default the result is identical to the original: four near-black
  pills, laid down twice, rolling 360px left across an 18 degree tilt.
-->

<div
  class="hf-catalog-perspective-marquee"
  data-composition-variables='[
    { "id": "tilt", "type": "enum", "role": "style", "label": "Tilt", "description": "How far the marquee plane leans back toward the horizon.", "default": "standard", "options": [{ "value": "flat", "label": "Flat" }, { "value": "standard", "label": "Standard" }, { "value": "steep", "label": "Steep" }] },
    { "id": "travel", "type": "enum", "role": "motion", "label": "Travel", "description": "Scales the offset the timeline drives, so the strip covers a shorter or longer run in the same time.", "default": "standard", "options": [{ "value": "short", "label": "Short" }, { "value": "standard", "label": "Standard" }, { "value": "long", "label": "Long" }] },
    { "id": "tone", "type": "enum", "role": "style", "label": "Tone", "description": "Pill colour: ink for light frames, paper for dark ones, accent rides the brand token.", "default": "ink", "options": [{ "value": "ink", "label": "Ink" }, { "value": "paper", "label": "Paper" }, { "value": "accent", "label": "Accent" }] },
    { "id": "words", "type": "string", "role": "content", "label": "Words", "description": "Comma separated pill labels. The list is laid down twice so the strip still reads as a continuous loop.", "default": "МОНТАЖ, СУБТИТРЫ, ПЕРЕХОДЫ, ИИ" }
  ]'
>
  <div>
    <span>МОНТАЖ</span><span>СУБТИТРЫ</span><span>ПЕРЕХОДЫ</span><span>ИИ</span><span>МОНТАЖ</span
    ><span>СУБТИТРЫ</span><span>ПЕРЕХОДЫ</span><span>ИИ</span>
  </div>
</div>

<style>
  @font-face {
    font-family: "Bebas Neue";
    src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
    font-weight: 700;
    font-display: block;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
    unicode-range:
      U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329,
      U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
    unicode-range:
      U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329,
      U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F,
      U+A720-A7FF;
  }
  .hf-catalog-perspective-marquee {
    color: var(--fg, #f2f2f2);
    font-family: "Montserrat", system-ui, sans-serif;
    font-weight: 900;
    letter-spacing: -0.04em;
  }
  .hf-catalog-perspective-marquee {
    width: 720px;
    overflow: hidden;
    /* perspective() inside the transform: the perspective property only acts on children, so on the element
       that is itself rotated it left the strip flat */
    transform: perspective(900px) rotateX(var(--hf-marquee-tilt, 18deg));
  }
  .hf-catalog-perspective-marquee div {
    display: inline-flex;
    gap: 22px;
    white-space: nowrap;
    transform: translateX(calc(var(--hf-marquee-x, 0px) * var(--hf-marquee-reach, 1)));
  }
  .hf-catalog-perspective-marquee span {
    padding: 12px 18px;
    border-radius: 999px;
    background: var(--hf-marquee-pill-bg, var(--surface, #18181a));
    color: var(--hf-marquee-pill-fg, var(--fg, #f2f2f2));
    font-size: 36px; /* 28 px floor holds after the steepest 34 deg tilt foreshortens the type */
    box-shadow: 0 18px 44px rgba(24, 24, 27, 0.18);
  }
</style>

<script>
  (function () {
    "use strict";

    var vars =
      window.__hyperframes && window.__hyperframes.getVariables
        ? window.__hyperframes.getVariables()
        : {};

    // Unrecognised overrides return to their declared defaults.
    var tilts = { flat: "6deg", standard: "18deg", steep: "34deg" };
    var reaches = { short: 0.55, standard: 1, long: 1.8 };
    var tones = {
      ink: { bg: "var(--surface, #18181a)", fg: "var(--fg, #f2f2f2)" },
      paper: { bg: "var(--fg, #f2f2f2)", fg: "var(--bg, #0c1014)" },
      accent: { bg: "var(--brand, #ff0000)", fg: "var(--fg, #f2f2f2)" },
    };
    var defaultWords = "МОНТАЖ, СУБТИТРЫ, ПЕРЕХОДЫ, ИИ";

    function pick(table, value, fallback) {
      return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
    }

    function parseWords(value) {
      var source = typeof value === "string" ? value : "";
      var parts = source.split(",");
      var words = [];
      for (var i = 0; i < parts.length; i += 1) {
        var word = parts[i].trim();
        if (word) words.push(word);
      }
      return words.length ? words : parseWords(defaultWords);
    }

    var tilt = tilts[pick(tilts, vars.tilt, "standard")];
    var reach = reaches[pick(reaches, vars.travel, "standard")];
    var tone = tones[pick(tones, vars.tone, "ink")];
    var words = parseWords(vars.words);

    var roots = document.querySelectorAll(".hf-catalog-perspective-marquee");
    for (var i = 0; i < roots.length; i += 1) {
      roots[i].style.setProperty("--hf-marquee-tilt", tilt);
      roots[i].style.setProperty("--hf-marquee-reach", String(reach));
      roots[i].style.setProperty("--hf-marquee-pill-bg", tone.bg);
      roots[i].style.setProperty("--hf-marquee-pill-fg", tone.fg);

      var strip = roots[i].querySelector("div");
      if (!strip) continue;
      var markup = "";
      for (var pass = 0; pass < 2; pass += 1) {
        for (var w = 0; w < words.length; w += 1) {
          markup += "<span>" + words[w].replace(/&/g, "&amp;").replace(/</g, "&lt;") + "</span>";
        }
      }
      strip.innerHTML = markup;
    }
  })();
</script>

<!--
  Timeline integration: built in, see the script below. It registers its own paused timeline as
  window.__timelines["perspective-marquee"]; mount the snippet inside a clip with data-composition-id="perspective-marquee"
  and the runtime nests it at that clip's start.
-->

<script>
  /* own timeline (component-quality-bar.md X1): the host clip carries data-composition-id="perspective-marquee" */
  (function () {
    var startTime = 0;
    var tl = gsap.timeline({ paused: true });
    tl.fromTo(
      ".hf-catalog-perspective-marquee div",
      { "--hf-marquee-x": "0px" },
      { "--hf-marquee-x": "-360px", duration: 4.5, ease: "none" },
      startTime,
    );
    window.__timelines = window.__timelines || {};
    window.__timelines["perspective-marquee"] = tl;
  })();
</script>
