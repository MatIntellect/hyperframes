<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
          U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range:
          U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329,
          U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113,
          U+2C60-2C7F, U+A720-A7FF;
      }
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: transparent;
        overflow: hidden;
      }
      /* ---- yt-screen-warp ---------------------------------------------------
         Make footage read as a physical display: add .yt-screen-warp3d to the
         media WRAPPER (subtle perspective), and place .yt-screen-fx overlay
         inside it (pixel grid + scanlines + vignette + sheen). */
      .yt-screen-warp3d {
        transform: perspective(1400px) rotateY(-3.5deg) rotateX(1.6deg);
      }
      .yt-screen-fx {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        background:
          /* sheen */
          linear-gradient(115deg, rgba(255, 255, 255, 0.09) 0%, transparent 30%),
          /* scanlines */
          repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.1) 0 1px, transparent 1px 3px),
          /* pixel grid */
          repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.06) 0 1px, transparent 1px 4px);
        box-shadow:
          inset 0 0 90px rgba(0, 0, 0, 0.4),
          inset 0 0 8px rgba(0, 0, 0, 0.5);
      }
      /* self-preview stand-in */
      /* The scene fills the host box (vertical reel or landscape alike);
         the screen sits inset from its edges. */
      #yt-sw-root {
        position: absolute;
        inset: 0;
        container-type: size;
      }
      #yt-sw-wrap {
        position: absolute;
        inset: 6cqmin;
        border-radius: 18px;
        overflow: hidden;
      }
      #yt-sw-fill {
        position: absolute;
        inset: 0;
        /* Placeholder footage: L3 of the ink over the dark ground, plus a 3px
           achromatic hatch so the plate reads as a media surface, not an empty box. */
        background:
          repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.05) 0 1px, transparent 1px 3px),
          rgba(255, 255, 255, 0.18);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14);
      }
      /* SLOT content: the host's footage or still fills the screen. */
      #yt-sw-fill > img,
      #yt-sw-fill > video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <!-- Screen slot: put the footage in an inert template anywhere in the HOST
         page, no edit of this file:
           <template data-slot="yt-screen-warp-screen"><video ...></video></template>
         img/video children fill the screen. Self-preview wrapper. WIRING: copy the two CSS classes; add
         class="yt-screen-warp3d" to your media wrapper and
         <div class="yt-screen-fx" id="yt-my-fx"></div> as its LAST child. Then:

           ytScreenOn(tl, "#yt-my-fx", 2.0);
           ytScreenOff(tl, "#yt-my-fx", 8.0);
    -->
    <div id="yt-sw-root" data-composition-id="yt-screen-warp" data-start="0" data-duration="4">
      <div id="yt-sw-wrap" class="yt-screen-warp3d">
        <div id="yt-sw-fill"></div>
        <div class="yt-screen-fx" id="yt-sw-fx"></div>
      </div>
      <div
        id="yt-sw-drv"
        class="clip"
        data-start="0"
        data-duration="4"
        data-track-index="0"
        style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none"
      ></div>
    </div>
    <script>
      /* hostSlot: the whole-scene clip follows the host slot (komp-sobrat.py klip_hozyaina; caret-swap:219) */
      (function () {
        var c = document.getElementById("yt-sw-drv");
        var h = c && c.parentElement && c.parentElement.closest("[data-duration]");
        if (h) c.dataset.duration = h.dataset.duration;
      })();
    </script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};

        // SLOT. The host's footage lives in an inert template at HOST
        // DOCUMENT level (the mount wipes the host clip's children and
        // templates never render); the scoped document only sees this
        // composition, so the lookup goes through ownerDocument
        // (particle-image-reveal's slot pattern). Without it the screen
        // shows a neutral hatched placeholder, no text.
        var swRoot = document.getElementById("yt-sw-root");
        var hostDoc = swRoot.ownerDocument;
        var screenTpl = null;
        try {
          screenTpl = hostDoc.querySelector('template[data-slot="yt-screen-warp-screen"]');
        } catch (error) {
          screenTpl = null;
        }
        if (screenTpl) {
          document
            .getElementById("yt-sw-fill")
            .replaceChildren(hostDoc.importNode(screenTpl.content, true));
        }

        // ---- copy these helpers into the host script ----
        window.ytScreenOn = function (tl, target, at) {
          tl.to(target, { opacity: 1, duration: 0.5, ease: "power2.out" }, at);
        };
        window.ytScreenOff = function (tl, target, at) {
          tl.to(target, { opacity: 0, duration: 0.4, ease: "power2.in" }, at);
        };

        // Self-preview timeline.
        var tl = gsap.timeline({ paused: true });
        gsap.set("#yt-sw-wrap", { opacity: 0, scale: 0.96 });
        tl.to("#yt-sw-wrap", { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" }, 0.2);
        window.ytScreenOn(tl, "#yt-sw-fx", 0.8);
        window.ytScreenOff(tl, "#yt-sw-fx", 3.1);
        tl.to("#yt-sw-wrap", { opacity: 0, duration: 0.35, ease: "power2.in" }, 3.5);
        tl.set("#yt-sw-root", { visibility: "hidden" }, 3.98);
        window.__timelines["yt-screen-warp"] = tl;
      })();
    </script>
  </body>
</html>
