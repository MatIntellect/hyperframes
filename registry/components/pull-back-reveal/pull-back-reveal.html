<!doctype html>
<!--
  pull-back-reveal: HyperFrames video primitive (camera / reveal / recontextualize)

  Concept: the frame starts tight on one stat chip, pauses long enough to
  establish it as the subject, then pulls back to reveal the headline and two
  supporting cards that give the stat its meaning. The chip remains the same
  DOM element for the entire move.

  Variables:
    - detail_text (string, default "+312%"): the stat inside the focus chip.
    - headline (string, default "Рост складывается"): the scene headline.
    - detail_label, detail_context, support_a_label, support_a_value,
      support_b_label, support_b_value (strings): the card words.

  Layout: a landscape field keeps the source layout (detail card left, two
  supporting cards stacked right). A portrait field (a vertical reel's
  graphics field is 780 x 1180) restacks: headline on top, the detail card
  across the middle with the chip at the field centre (the camera starts
  tight there), the two supporting cards side by side below.

  Envelope (fixed IN, elastic HOLD, no OUT, never gsap.timeScale()):
    IN_BASE  = 2.40s  tight hold, whip-out pull-back, then a short drift settle
    HOLD     = elastic full-scene hold with a restrained shadow breath
    OUT_BASE = 0s     the reveal establishes the final composed scene
    If D is shorter than IN_BASE, the three IN beats compress together and
    HOLD becomes zero. Longer mounts stretch HOLD only.

  Mount contract: the runtime clones only this template. #root fills the host
  box, establishes the container query basis, has no data-width or data-height,
  and registers one paused timeline under the hardcoded pull-back-reveal id.
-->
<html
  lang="en"
  data-composition-id="pull-back-reveal"
  data-composition-duration="4.5"
  data-composition-variables='[
    { "id": "detail_text", "type": "string", "role": "content", "label": "Detail text", "description": "Stat shown in the detail chip at the center of the reveal.", "default": "+312%" },
    { "id": "headline", "type": "string", "role": "content", "label": "Headline", "description": "Headline revealed around the focused detail.", "default": "Рост складывается" },
    { "id": "detail_label", "type": "string", "role": "content", "label": "Detail label", "description": "Small caps label at the top of the detail card.", "default": "Рост за месяц" },
    { "id": "detail_context", "type": "string", "role": "content", "label": "Detail context", "description": "Line at the bottom of the detail card; wraps by words.", "default": "Во всех проектах" },
    { "id": "support_a_label", "type": "string", "role": "content", "label": "Card A label", "description": "Label of the first supporting card.", "default": "Досмотры" },
    { "id": "support_a_value", "type": "string", "role": "content", "label": "Card A value", "description": "Value of the first supporting card.", "default": "94%" },
    { "id": "support_b_label", "type": "string", "role": "content", "label": "Card B label", "description": "Label of the second supporting card.", "default": "Ролики" },
    { "id": "support_b_value", "type": "string", "role": "content", "label": "Card B value", "description": "Value of the second supporting card.", "default": "48" }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Pull Back Reveal</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="pull-back-reveal" data-duration="4.5" data-fps="30">
        <style>
          @font-face {
            font-family: "Bebas Neue";
            src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
            font-weight: 700;
            font-display: block;
          }
          @font-face {
            font-family: "Montserrat";
            src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
            font-weight: 100 900;
            font-display: block;
            unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
          }
          @font-face {
            font-family: "Montserrat";
            src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
            font-weight: 100 900;
            font-display: block;
            unicode-range:
              U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
              U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
          }
          @font-face {
            font-family: "Montserrat";
            src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
            font-weight: 100 900;
            font-display: block;
            unicode-range:
              U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308,
              U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4,
              U+2113, U+2C60-2C7F, U+A720-A7FF;
          }
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            container-type: size;
            isolation: isolate;
            background: var(--bg, #0c1014);
            color: var(--fg, #f2f2f2);
            font-family: var(--font-body, "Montserrat", sans-serif);
            pointer-events: none;
          }

          .pbr-clip,
          .pbr-world {
            position: absolute;
            inset: 0;
          }

          .pbr-clip {
            overflow: hidden;
            background: var(--bg, #0c1014);
          }

          .pbr-world {
            overflow: hidden;
            transform-origin: 50% 50%;
            background:
              radial-gradient(
                circle at 48% 50%,
                color-mix(in srgb, var(--pbr-accent) 19%, transparent),
                transparent 27%
              ),
              linear-gradient(
                145deg,
                color-mix(in srgb, var(--surface, #18181a) 82%, var(--bg, #0c1014)),
                var(--bg, #0c1014) 72%
              );
            will-change: transform;
          }

          .pbr-headline {
            position: absolute;
            z-index: 1;
            top: 8cqh;
            left: 8cqw;
            width: 76cqw;
            color: var(--fg, #f2f2f2);
            font-family: var(--font-display, "Bebas Neue", sans-serif);
            font-size: max(28px, 7.6cqw);
            font-weight: 780;
            line-height: 0.92;
            letter-spacing: -0.055em;
            overflow-wrap: anywhere;
            text-shadow: 0 1.8cqh 5cqh color-mix(in srgb, var(--bg, #0c1014) 72%, transparent);
          }

          .pbr-card {
            position: absolute;
            z-index: 1;
            overflow: hidden;
            border: 0.11cqw solid color-mix(in srgb, var(--border, #2e2e32) 78%, transparent);
            border-radius: var(--radius, 2.4cqw);
            background: color-mix(in srgb, var(--surface, #18181a) 92%, transparent);
            box-shadow:
              0 2.2cqh 5.5cqh color-mix(in srgb, var(--bg, #0c1014) 54%, transparent),
              inset 0 0.1cqh 0 color-mix(in srgb, var(--fg, #f2f2f2) 9%, transparent);
          }

          .pbr-detail-card {
            top: 31cqh;
            left: 8cqw;
            width: 56cqw;
            height: 56cqh;
            padding: 5cqh 4cqw;
          }

          .pbr-detail-label,
          .pbr-support-label {
            color: var(--muted, #8a8a90);
            font-size: max(28px, 1.35cqw);
            font-weight: 680;
            line-height: 1;
            letter-spacing: 0.1em;
            text-transform: uppercase;
          }

          .pbr-detail-chip {
            position: absolute;
            top: 13cqh;
            left: 31cqw;
            width: 20cqw;
            min-height: 12cqh;
            display: grid;
            place-items: center;
            padding: 1.8cqh 1.5cqw;
            border: 0.12cqw solid color-mix(in srgb, var(--pbr-accent) 72%, var(--fg, #f2f2f2));
            border-radius: calc(var(--radius, 2.4cqw) * 0.72);
            background: color-mix(in srgb, var(--pbr-accent) 22%, var(--surface, #18181a));
            box-shadow: 0 1.8cqh 4.5cqh color-mix(in srgb, var(--pbr-accent) 28%, transparent);
            color: var(--fg, #f2f2f2);
            font-family: var(--font-display, "Bebas Neue", sans-serif);
            font-size: max(28px, 4.4cqw);
            font-weight: 820;
            line-height: 1;
            letter-spacing: -0.055em;
            text-align: center;
            /* A long stat wraps, never cut with an ellipsis. */
            text-wrap: balance;
          }

          .pbr-detail-context {
            position: absolute;
            bottom: 5cqh;
            left: 4cqw;
            color: var(--muted, #8a8a90);
            font-size: max(28px, 1.6cqw);
            font-weight: 560;
            line-height: 1.25;
          }

          .pbr-support-card {
            left: 75cqw;
            width: 17cqw;
            height: 25cqh;
            padding: 3.6cqh 2.2cqw;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
          }

          .pbr-support-card-a {
            top: 31cqh;
          }

          .pbr-support-card-b {
            top: 62cqh;
          }

          .pbr-support-value {
            color: var(--fg, #f2f2f2);
            font-family: var(--font-display, "Bebas Neue", sans-serif);
            font-size: max(28px, 3.7cqw);
            font-weight: 780;
            line-height: 0.9;
            letter-spacing: -0.05em;
          }

          .pbr-support-rule {
            width: 100%;
            height: 0.5cqh;
            border-radius: 999cqw;
            background: color-mix(in srgb, var(--pbr-accent) 72%, var(--border, #2e2e32));
          }

          /* Portrait field: restack (see Layout in the header). The chip
             centre stays at the field centre: card top 30 + chip top 13 +
             half chip 7 = 50cqh; card left 7 + chip left 13 + half chip 30
             = 50cqw. */
          @container (aspect-ratio < 1) {
            .pbr-headline {
              top: 6cqh;
              left: 7cqw;
              width: 86cqw;
              font-size: max(28px, 10cqw);
              line-height: 0.95;
              letter-spacing: -0.02em;
              overflow-wrap: break-word;
              text-wrap: balance;
            }

            .pbr-detail-card {
              top: 30cqh;
              left: 7cqw;
              width: 86cqw;
              height: 38cqh;
              padding: 4cqh 6cqw;
            }

            .pbr-detail-chip {
              top: 13cqh;
              left: 13cqw;
              width: 60cqw;
              min-height: 14cqh;
              font-size: max(28px, 12cqw);
              letter-spacing: -0.02em;
            }

            .pbr-detail-context {
              bottom: 3.5cqh;
              left: 6cqw;
              right: 6cqw;
              text-align: center;
            }

            .pbr-support-card {
              top: 72cqh;
              width: 41.5cqw;
              height: 20cqh;
              padding: 3cqh 5cqw;
            }

            .pbr-support-card-a {
              left: 7cqw;
            }

            .pbr-support-card-b {
              top: 72cqh;
              left: 51.5cqw;
            }

            .pbr-support-value {
              font-size: max(28px, 9cqw);
              letter-spacing: -0.02em;
            }
          }

          .pbr-ground {
            position: absolute;
            z-index: 0;
            left: 15cqw;
            bottom: 2cqh;
            width: 70cqw;
            height: 10cqh;
            border-radius: 50%;
            background: color-mix(in srgb, var(--pbr-accent) 16%, var(--bg, #0c1014));
            filter: blur(3.2cqh);
            opacity: 0;
            transform-origin: 50% 50%;
            will-change: transform, opacity;
          }
        </style>

        <div
          id="pull-back-reveal-clip"
          class="pbr-clip clip"
          data-start="0"
          data-duration="4.5"
          data-track-index="0"
        >
          <div class="pbr-world">
            <div class="pbr-headline"></div>

            <section class="pbr-card pbr-detail-card">
              <div class="pbr-detail-label">Рост за месяц</div>
              <div class="pbr-detail-chip"></div>
              <div class="pbr-detail-context">Во всех проектах</div>
            </section>

            <section class="pbr-card pbr-support-card pbr-support-card-a">
              <div class="pbr-support-label">Досмотры</div>
              <div class="pbr-support-value">94%</div>
              <div class="pbr-support-rule"></div>
            </section>

            <section class="pbr-card pbr-support-card pbr-support-card-b">
              <div class="pbr-support-label">Ролики</div>
              <div class="pbr-support-value">48</div>
              <div class="pbr-support-rule"></div>
            </section>

            <div class="pbr-ground"></div>
          </div>
        </div>

        <script>
          /* hostSlot: the whole-scene clip follows the host slot (komp-sobrat.py klip_hozyaina; caret-swap:219) */
          (function () {
            var c = document.getElementById("pull-back-reveal-clip");
            var h = c && c.parentElement && c.parentElement.closest("[data-duration]");
            if (h) c.dataset.duration = h.dataset.duration;
          })();
        </script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var world = root.querySelector(".pbr-world");
            var headline = root.querySelector(".pbr-headline");
            var detail = root.querySelector(".pbr-detail-chip");
            var ground = root.querySelector(".pbr-ground");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            var detailText = vars.detail_text == null ? "+312%" : String(vars.detail_text);
            var headlineText = vars.headline == null ? "Рост складывается" : String(vars.headline);

            detail.textContent = detailText;
            headline.textContent = headlineText;
            // One palette: the highlight rides the reel's brand red.
            root.style.setProperty("--pbr-accent", "var(--brand, #ff0000)");
            // Card words are fields: the host never edits this file.
            [
              [".pbr-detail-label", "detail_label"],
              [".pbr-detail-context", "detail_context"],
              [".pbr-support-card-a .pbr-support-label", "support_a_label"],
              [".pbr-support-card-a .pbr-support-value", "support_a_value"],
              [".pbr-support-card-b .pbr-support-label", "support_b_label"],
              [".pbr-support-card-b .pbr-support-value", "support_b_value"],
            ].forEach(function (field) {
              if (typeof vars[field[1]] === "string") {
                root.querySelector(field[0]).textContent = vars[field[1]];
              }
            });

            // RETIME RANGE: IN owns the tight beat and complete camera move.
            // HOLD is the only elastic phase. This reveal has no exit.
            var IN_BASE = 2.4;
            var TIGHT_HOLD_BASE = 0.55;
            var WHIP_BASE = 1.2;
            var DRIFT_BASE = 0.65;
            var duration = Math.max(
              0.001,
              parseFloat(
                ((root.parentElement && root.parentElement.closest("[data-duration]")) || root)
                  .dataset.duration || "4.5",
              ),
            );
            var phaseScale = Math.min(1, duration / IN_BASE);
            var TIGHT_HOLD = TIGHT_HOLD_BASE * phaseScale;
            var WHIP = WHIP_BASE * phaseScale;
            var DRIFT = DRIFT_BASE * phaseScale;
            var IN = TIGHT_HOLD + WHIP + DRIFT;
            var HOLD = Math.max(0, duration - IN);

            var tl = gsap.timeline({ paused: true });

            tl.fromTo(
              world,
              { scale: 2.2, y: 0 },
              { scale: 1.055, y: "0.7cqh", duration: WHIP, ease: "power4.out" },
              TIGHT_HOLD,
            );
            tl.to(
              world,
              { scale: 1, y: 0, duration: DRIFT, ease: "sine.inOut" },
              TIGHT_HOLD + WHIP,
            );
            tl.fromTo(
              ground,
              { opacity: 0, scaleX: 0.72, scaleY: 0.72 },
              { opacity: 0.78, scaleX: 1, scaleY: 1, duration: DRIFT, ease: "power2.out" },
              TIGHT_HOLD + WHIP,
            );

            if (HOLD > 0) {
              tl.to(
                ground,
                { opacity: 0.68, scaleX: 0.97, duration: HOLD * 0.5, ease: "sine.inOut" },
                IN,
              );
              tl.to(
                ground,
                { opacity: 0.78, scaleX: 1, duration: HOLD * 0.5, ease: "sine.inOut" },
                IN + HOLD * 0.5,
              );
            }

            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["pull-back-reveal"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
