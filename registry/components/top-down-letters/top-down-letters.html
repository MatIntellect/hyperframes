<!--
  Top-Down Letters - typography primitive for HyperFrames.

  Paste the markup, CSS and script into a composition. Drive the timeline
  integration from a paused GSAP timeline so renders remain deterministic.

  Variables. The script reads each one, falls back to the declared default on
  anything missing or unrecognised, and writes the result either into the
  markup or into a custom property the CSS above consumes. The timeline recipe
  below is untouched by them: it keeps driving one offset per letter, and these
  decide which letters fall, how far that offset carries them, and what colour
  they are.

    - text (string, default МОНТАЖ): the word that cascades. Every character
      becomes one span, in source order, exactly like the hand-written markup;
      a space becomes a non-breaking space so it keeps its width in the flex
      row. Anything that is not a non-empty string keeps the shipped word.
    - distance (close | standard | far, default standard): multiplies the drop
      the timeline drives, so the letters cover a shorter or longer run in the
      same time. close covers half of it, standard leaves the shipped 42px
      alone, far carries them nearly double.
    - tone (ink | paper | accent, default paper: the reels are dark): letter colour. ink is
      near-black for light frames, paper near-white for dark ones, accent
      rides --brand.

  On every default the result is identical to the original: the seven
  near-black letters of МОНТАЖ dropping 42px into place.
-->

<div
  class="hf-catalog-top-down-letters"
  data-composition-variables='[
    {"id": "text", "type": "string", "role": "content", "label": "Text", "description": "Word that cascades in. Every character becomes one letter span, in source order.", "default": "МОНТАЖ", "maxLength": 12},
    {"id": "distance", "type": "enum", "role": "motion", "label": "Distance", "description": "Multiplies the drop the timeline drives, so the letters cover a shorter or longer run in the same time.", "default": "standard", "options": [{"value": "close", "label": "Close"}, {"value": "standard", "label": "Standard"}, {"value": "far", "label": "Far"}]},
    {"id": "tone", "type": "enum", "role": "style", "label": "Tone", "description": "Letter colour: ink for light frames, paper for dark ones, accent rides --brand.", "default": "paper", "options": [{"value": "ink", "label": "Ink"}, {"value": "paper", "label": "Paper"}, {"value": "accent", "label": "Accent"}]}
  ]'
>
  <span>C</span><span>A</span><span>S</span><span>C</span><span>A</span><span>D</span><span>E</span>
</div>

<style>
  @font-face {
    font-family: "Bebas Neue";
    src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
    font-weight: 700;
    font-display: block;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
    unicode-range:
      U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329,
      U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
    unicode-range:
      U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329,
      U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F,
      U+A720-A7FF;
  }
  .hf-catalog-top-down-letters {
    color: var(--hf-letters-color, var(--fg, #f2f2f2));
    font-family: "Montserrat", system-ui, sans-serif;
    font-weight: 900;
    letter-spacing: -0.04em;
  }
  .hf-catalog-top-down-letters {
    display: inline-flex;
    gap: 1px;
    font-size: 74px;
    line-height: 0.9;
    overflow: hidden;
  }
  .hf-catalog-top-down-letters span {
    display: inline-block;
    transform: translateY(calc(var(--hf-char-y, 0px) * var(--hf-char-distance, 1)));
    will-change: transform, opacity;
  }
</style>

<script>
  (function () {
    "use strict";

    var vars =
      window.__hyperframes && window.__hyperframes.getVariables
        ? window.__hyperframes.getVariables()
        : {};

    // Unrecognised overrides return to their declared defaults.
    var distances = { close: 0.5, standard: 1, far: 1.8 };
    var tones = {
      ink: "var(--bg, #0c1014)",
      paper: "var(--fg, #f2f2f2)",
      accent: "var(--brand, #ff0000)",
    };

    function pick(table, value, fallback) {
      return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
    }

    var distance = distances[pick(distances, vars.distance, "standard")];
    var tone = tones[pick(tones, vars.tone, "paper")];
    var text = typeof vars.text === "string" && vars.text !== "" ? vars.text : null;

    var roots = document.querySelectorAll(".hf-catalog-top-down-letters");
    for (var i = 0; i < roots.length; i += 1) {
      var root = roots[i];
      root.style.setProperty("--hf-char-distance", String(distance));
      root.style.setProperty("--hf-letters-color", tone);

      // Only rebuild when text was supplied; the shipped markup is already the
      // exact span-per-character output this branch produces for МОНТАЖ.
      if (text !== null) {
        var characters = Array.from(text);
        root.textContent = "";
        for (var j = 0; j < characters.length; j += 1) {
          var span = document.createElement("span");
          span.textContent = characters[j] === " " ? "\u00a0" : characters[j];
          root.appendChild(span);
        }
        root.setAttribute("aria-label", text);
      }
    }
  })();
</script>

<!--
  Timeline integration: built in, see the script below. It registers its own paused timeline as
  window.__timelines["top-down-letters"]; mount the snippet inside a clip with data-composition-id="top-down-letters"
  and the runtime nests it at that clip's start.
-->

<script>
  /* own timeline (component-quality-bar.md X1): the host clip carries data-composition-id="top-down-letters" */
  (function () {
    var startTime = 0;
    var tl = gsap.timeline({ paused: true });
    tl.fromTo(
      ".hf-catalog-top-down-letters span",
      { opacity: 0, "--hf-char-y": "-42px" },
      { opacity: 1, "--hf-char-y": "0px", duration: 0.22, stagger: 0.035, ease: "power3.out" },
      startTime,
    );
    window.__timelines = window.__timelines || {};
    window.__timelines["top-down-letters"] = tl;
  })();
</script>
