<!--
  Tabs Slide Indicator - transitions.dev-inspired primitive for HyperFrames.

  Paste the markup, CSS and script into a composition. Use the timeline
  integration note at the bottom as the starting point for deterministic GSAP
  animation.

  Variables. The script reads each one, falls back to the declared default on
  anything missing or unrecognised, and writes the result as a custom property
  the CSS below consumes. The timeline recipe at the bottom is untouched by
  them: it keeps sliding the pill one tab to the right, and these decide how
  wide that tab is, what the pill looks like and what the tabs say.

    - colour: the sliding pill is the brand accent (--brand of the reel palette on the
      root); the label sitting on it is light, the others muted.
    - width (compact | standard | wide, default standard): width of one tab,
      160px, 200px or 240px (28 px labels). The slide the timeline drives is scaled by the same
      ratio, so the pill still lands exactly on the next tab rather than
      stopping short or overshooting it.
    - shape (pill | rounded | square, default pill): corner radius of the track
      and the pill, 999px, 12px or 4px.
    - labels (text, default "План,Отладка,Вопрос"): the tab names, separated by
      commas. Two or more names rebuild the row, one name or none leaves the
      authored markup alone, since a single tab has nowhere to slide to.

  With the defaults, this renders three 200px tabs in a dark pill track. The
  brand-red pill and light active label move from the first tab to the second.
-->

<div
  class="hf-transition-tabs-slide-indicator"
  data-composition-variables='[
    {"id": "width", "type": "enum", "role": "layout", "label": "Tab width", "description": "Width of one tab. The slide the timeline drives is scaled to match, so the pill still lands on the next tab.", "default": "standard", "options": [{"value": "compact", "label": "Compact"}, {"value": "standard", "label": "Standard"}, {"value": "wide", "label": "Wide"}]},
    {"id": "shape", "type": "enum", "role": "style", "label": "Shape", "description": "Corner radius of the track and the pill.", "default": "pill", "options": [{"value": "pill", "label": "Pill"}, {"value": "rounded", "label": "Rounded"}, {"value": "square", "label": "Square"}]},
    {"id": "labels", "type": "string", "role": "content", "label": "Labels", "description": "The tab names, separated by commas. Two or more names rebuild the row.", "default": "План,Отладка,Вопрос", "maxLength": 80}
  ]'
>
  <span class="indicator"></span><button style="--hf-tab-index: 0">План</button
  ><button style="--hf-tab-index: 1">Отладка</button
  ><button style="--hf-tab-index: 2">Вопрос</button>
</div>

<style>
  @font-face {
    font-family: "Bebas Neue";
    src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
    font-weight: 700;
    font-display: block;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
    unicode-range:
      U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329,
      U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
    unicode-range:
      U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329,
      U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F,
      U+A720-A7FF;
  }
  /* Vertical reel: sized for the 780 px graphics field (labels 28 px), brand palette tokens:
     a dark track, the sliding pill in brand red, inactive labels muted, the active one light. */
  .hf-transition-tabs-slide-indicator {
    --hf-tab-x: 0px;
    --hf-tab-offset: calc(var(--hf-tab-x) * var(--hf-tab-step, 1));
    position: relative;
    display: inline-grid;
    grid-template-columns: repeat(var(--hf-tab-count, 3), var(--hf-tab-width, 200px));
    padding: 8px;
    border: 2px solid var(--border, #2e2e32);
    border-radius: var(--hf-tab-radius, 999px);
    background: color-mix(in srgb, var(--fg, #f2f2f2) 6%, var(--surface, #18181a));
    font-family: "Montserrat", system-ui, sans-serif;
  }
  .hf-transition-tabs-slide-indicator .indicator {
    position: absolute;
    top: 8px;
    left: 8px;
    width: var(--hf-tab-width, 200px);
    height: 76px;
    border-radius: var(--hf-tab-radius, 999px);
    background: var(--hf-tab-fill, var(--brand, #ff0000));
    transform: translateX(var(--hf-tab-offset));
    box-shadow: 0 12px 26px rgba(0, 0, 0, 0.35);
  }
  .hf-transition-tabs-slide-indicator button {
    --hf-tab-highlight-start: clamp(
      0px,
      calc(var(--hf-tab-offset) - var(--hf-tab-index) * var(--hf-tab-width, 200px)),
      var(--hf-tab-width, 200px)
    );
    --hf-tab-highlight-end: clamp(
      0px,
      calc(
        var(--hf-tab-offset) + var(--hf-tab-width, 200px) - var(--hf-tab-index) *
          var(--hf-tab-width, 200px)
      ),
      var(--hf-tab-width, 200px)
    );
    position: relative;
    z-index: 1;
    height: 76px;
    padding: 0 12px;
    border: 0;
    background-color: transparent;
    background-image: linear-gradient(
      to right,
      var(--muted, #8a8a90) 0 var(--hf-tab-highlight-start),
      var(--fg, #f2f2f2) var(--hf-tab-highlight-start) var(--hf-tab-highlight-end),
      var(--muted, #8a8a90) var(--hf-tab-highlight-end) 100%
    );
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    font-family: inherit;
    font-size: 28px;
    font-weight: 700;
    white-space: nowrap;
  }
</style>

<script>
  (function () {
    "use strict";

    var vars =
      window.__hyperframes && window.__hyperframes.getVariables
        ? window.__hyperframes.getVariables()
        : {};

    // Unrecognised overrides return to their declared defaults.
    // The pill is the one accent-carrying element: the brand accent of the reel palette.
    var accent = "var(--brand, #ff0000)";
    var widths = { compact: 160, standard: 200, wide: 240 };
    var shapes = { pill: "999px", rounded: "12px", square: "4px" };

    function pick(table, value, fallback) {
      return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
    }

    var width = widths[pick(widths, vars.width, "standard")];
    var radius = shapes[pick(shapes, vars.shape, "pill")];
    var labels =
      typeof vars.labels === "string"
        ? vars.labels.split(",").map(function (part) {
            return part.trim();
          })
        : [];
    labels = labels.filter(function (part) {
      return part.length > 0;
    });

    var roots = document.querySelectorAll(".hf-transition-tabs-slide-indicator");
    for (var i = 0; i < roots.length; i += 1) {
      roots[i].style.setProperty("--hf-tab-fill", accent);
      roots[i].style.setProperty("--hf-tab-width", width + "px");
      // The timeline slides the pill by one standard tab, so scale that slide
      // to whatever a tab is actually worth here.
      roots[i].style.setProperty("--hf-tab-step", String(width / 86));
      roots[i].style.setProperty("--hf-tab-radius", radius);
      // A single tab has nowhere to slide to, so it is left as authored.
      if (labels.length > 1) {
        var old = roots[i].querySelectorAll("button");
        for (var j = 0; j < old.length; j += 1) {
          old[j].parentNode.removeChild(old[j]);
        }
        for (var k = 0; k < labels.length; k += 1) {
          var button = document.createElement("button");
          button.textContent = labels[k];
          button.style.setProperty("--hf-tab-index", String(k));
          roots[i].appendChild(button);
        }
        roots[i].style.setProperty("--hf-tab-count", String(labels.length));
      }
    }
  })();
</script>

<!--
  Timeline integration: built in, see the script below. It registers its own paused timeline as
  window.__timelines["tabs-slide-indicator"]; mount the snippet inside a clip with data-composition-id="tabs-slide-indicator"
  and the runtime nests it at that clip's start.
-->

<script>
  /* own timeline (component-quality-bar.md X1): the host clip carries data-composition-id="tabs-slide-indicator" */
  (function () {
    var startTime = 0;
    var tl = gsap.timeline({ paused: true });
    tl.fromTo(
      ".hf-transition-tabs-slide-indicator",
      { "--hf-tab-x": "0px" },
      { "--hf-tab-x": "86px", duration: 0.42, ease: "power3.inOut" },
      startTime,
    );
    window.__timelines = window.__timelines || {};
    window.__timelines["tabs-slide-indicator"] = tl;
  })();
</script>
