<!doctype html>
<!--
  variable-axis-type -- HyperFrames video primitive (typography / burst / emphasize)

  Concept: one headline gains emphasis by morphing a single variable-font axis.
  The glyphs change shape while the text element itself stays fixed.

  Compiled-from evidence: hyperframes-research-type-svg.md, VariableAxisType.
  The research identifies variable axes as deterministic numeric seek handles and
  requires a complete, stable axis list, a font-ready gate, and midpoint checks.

  Use when: a word or short headline needs a decisive emphasis beat without a
  position, opacity, or scale animation.

  Variables:
    - text (string, default "УДАР"): headline copy.
    - fromValue (number, default 200): starting weight, 100-900.
    - toValue (number, default 900): ending weight, 100-900.

  Envelope: IN = up to 1.4s for the axis morph; HOLD = any remaining duration;
  OUT = 0s. Short hosts compress IN directly. Never use gsap.timeScale().

  Sync point: axis-land at 1.4s into IN, scaled proportionally when the host
  duration is shorter. It is never placed in the elastic HOLD.

  Sound: none. The changing glyph mass is the entire emphasis mechanic.

  Mount contract: this is a template-wrapped sub-composition. The root has no
  data-width or data-height, fills its host with inset:0, and registers one
  paused GSAP timeline under the hardcoded id "variable-axis-type".
-->
<html
  lang="en"
  data-composition-variables='[
    { "id": "text", "type": "string", "role": "content", "label": "Text", "description": "Word or short headline to emphasize.", "default": "УДАР" },
    { "id": "fromValue", "type": "number", "role": "motion", "label": "From value", "description": "Starting weight, 100-900.", "default": 200, "min": 100, "max": 900, "step": 1 },
    { "id": "toValue", "type": "number", "role": "motion", "label": "To value", "description": "Ending weight, 100-900.", "default": 900, "min": 100, "max": 900, "step": 1 }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Variable Axis Type</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="variable-axis-type" data-duration="1.6" data-fps="30">
        <style>
          @font-face {
            font-family: "Bebas Neue";
            src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
            font-weight: 700;
            font-display: block;
          }
          @font-face {
            font-family: "Montserrat";
            src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
            font-weight: 100 900;
            font-display: block;
            unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
          }
          @font-face {
            font-family: "Montserrat";
            src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
            font-weight: 100 900;
            font-display: block;
            unicode-range:
              U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
              U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
          }
          @font-face {
            font-family: "Montserrat";
            src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
            font-weight: 100 900;
            font-display: block;
            unicode-range:
              U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308,
              U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4,
              U+2113, U+2C60-2C7F, U+A720-A7FF;
          }
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          #root {
            position: absolute;
            inset: 0;
            container-type: size;
            isolation: isolate;
            overflow: hidden;
            background: var(--bg, #0c1014);
            color: var(--fg, #f2f2f2);
          }

          .vat-clip {
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
          }

          /* INVARIANT: width-axis changes may alter glyph advances, so the
             authored line lives in a fixed box and can never wrap mid-tween. */
          .vat-lock {
            width: 92cqw;
            height: 58cqh;
            display: grid;
            place-items: center;
            overflow: visible;
          }

          /* EDIT ZONE: font size and tracking are the only composition-level
             typography controls. Axis endpoints remain owned by variables. */
          .vat-headline {
            display: block;
            width: 100%;
            white-space: nowrap;
            text-align: center;
            color: var(--fg, #f2f2f2);
            font-family: var(--font-body, "Montserrat", sans-serif);
            font-size: 19cqw;
            font-weight: 400;
            font-stretch: 100%;
            font-optical-sizing: none;
            font-synthesis: none;
            line-height: 0.9;
            letter-spacing: 0;
          }
        </style>

        <div
          id="variable-axis-type-clip"
          class="vat-clip clip"
          data-start="0"
          data-duration="1.6"
          data-track-index="0"
        >
          <div class="vat-lock">
            <div class="vat-headline">УДАР</div>
          </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var headline = root.querySelector(".vat-headline");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            var text = vars.text == null ? "УДАР" : String(vars.text);
            var minimum = 100;
            var maximum = 900;
            var fromNumber = Number(vars.fromValue);
            var toNumber = Number(vars.toValue);
            var fromValue = Number.isFinite(fromNumber) ? fromNumber : 200;
            var toValue = Number.isFinite(toNumber) ? toNumber : 900;
            fromValue = Math.max(minimum, Math.min(maximum, fromValue));
            toValue = Math.max(minimum, Math.min(maximum, toValue));

            headline.textContent = text;

            // Both endpoints list the same complete axis set in the same order.
            // Omitting even an unchanged axis can silently disable interpolation.
            // Montserrat, the brand face with a weight axis: weight is its only axis.
            var fromSettings = '"wght" ' + fromValue;
            var toSettings = '"wght" ' + toValue;

            // RETIME RANGE: the morph is the fixed IN phase. Any time after it
            // is an elastic still HOLD, which preserves the landed emphasis.
            var IN_BASE = 1.4;
            var duration = Math.max(
              0.001,
              parseFloat(
                ((root.parentElement && root.parentElement.closest("[data-duration]")) || root)
                  .dataset.duration || "1.6",
              ),
            );
            var IN = Math.min(IN_BASE, duration);

            // Font readiness owns timeline registration. This prevents fallback
            // glyph metrics from leaking into any captured or midpoint frame.
            document.fonts
              .load('700 64px "Montserrat"', text)
              .then(function () {
                return document.fonts.ready;
              })
              .then(function () {
                if (!document.fonts.check('700 64px "Montserrat"', text)) {
                  throw new Error("Montserrat failed to load");
                }

                // Size: the largest that keeps the line on one line at the heaviest weight of the morph,
                // measured once Montserrat has loaded (fitTextFontSize – contributing.md:66 «Overflow»),
                // never under 28px (vertical.md:18); the shipped 19cqw is the ceiling.
                var fit = window.__hyperframes.fitTextFontSize(text, {
                  fontFamily: "Montserrat",
                  fontWeight: Math.max(fromValue, toValue),
                  maxWidth: root.clientWidth * 0.92,
                  baseFontSize: Math.max(28, Math.round(root.clientWidth * 0.19)),
                  minFontSize: 28,
                  step: 1,
                });
                headline.style.fontSize = fit.fontSize + "px";

                var tl = gsap.timeline({ paused: true });
                tl.fromTo(
                  headline,
                  { fontVariationSettings: fromSettings },
                  { fontVariationSettings: toSettings, duration: IN, ease: "expo.out" },
                  0,
                );
                tl.seek(0);

                window.__timelines = window.__timelines || {};
                window.__timelines["variable-axis-type"] = tl;
              });
          })();
        </script>
      </div>
    </template>
  </body>
</html>
