<!doctype html>
<!--
  parallax-device-dive: HyperFrames video primitive (camera / device / transition)

  Concept: a canonical phone rises into view, then the camera pushes through
  its screen until the screen fills the box width (top of the app in view). The app header, hero card, and supporting cards separate at
  different apparent depths during the push, then settle into one coherent UI
  that fills the frame.

  Variables:
    The app highlight rides the reel brand red (--brand); the app is dark,
    in the reel palette. Type is measured on the phone (cqh: the phone is
    82cqh tall), not on the frame width, so the hierarchy holds in a tall box.
    - app_title (string, default "Статистика"): title in the app header; wraps.

  Envelope (fixed IN/OUT, elastic HOLD only, never gsap.timeScale()):
    IN_BASE  = 1.05s  phone rises and settles on stage
    HOLD     = elastic subtle device drift before the camera move
    OUT_BASE = 1.65s  camera dives through the screen and the UI becomes stage
    If D is shorter than IN_BASE + OUT_BASE, IN and OUT compress together and
    HOLD becomes zero. OUT is a camera exit from the hardware, not a fade.

  Mount contract: the runtime clones only this template. #root fills the host
  box, establishes the container query basis, carries no data-width or
  data-height, and registers one paused timeline under the hardcoded
  parallax-device-dive id.
-->
<html
  lang="en"
  data-composition-id="parallax-device-dive"
  data-composition-duration="4.5"
  data-composition-variables='[
    {"id": "app_title", "type": "string", "role": "content", "label": "App title", "description": "Title displayed in the app header.", "default": "Статистика", "maxLength": 28}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Parallax Device Dive</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="parallax-device-dive" data-duration="4.5" data-fps="30">
        <style>
          @font-face {
            font-family: "Bebas Neue";
            src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
            font-weight: 700;
            font-display: block;
          }
          @font-face {
            font-family: "Montserrat";
            src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
            font-weight: 100 900;
            font-display: block;
            unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
          }
          @font-face {
            font-family: "Montserrat";
            src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
            font-weight: 100 900;
            font-display: block;
            unicode-range:
              U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
              U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
          }
          @font-face {
            font-family: "Montserrat";
            src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
            font-weight: 100 900;
            font-display: block;
            unicode-range:
              U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308,
              U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4,
              U+2113, U+2C60-2C7F, U+A720-A7FF;
          }
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            container-type: size;
            isolation: isolate;
            background: var(--bg, #0c1014);
            color: var(--fg, #f2f2f2);
            font-family: var(--font-body, "Montserrat", sans-serif);
          }

          .pdd-clip,
          .pdd-camera {
            position: absolute;
            inset: 0;
          }

          .pdd-clip {
            overflow: hidden;
            background: var(--bg, #0c1014);
          }

          .pdd-camera {
            display: grid;
            place-items: center;
            perspective: 125cqw;
          }

          .pdd-phone {
            position: relative;
            height: 82cqh;
            aspect-ratio: 9 / 19.5;
            padding: 0.72cqh;
            border: 0.08cqw solid rgba(255, 255, 255, 0.28);
            border-radius: 4.4cqh;
            background: linear-gradient(
              145deg,
              var(--border, #2e2e32),
              var(--surface, #18181a) 44%,
              var(--bg, #0c1014)
            );
            box-shadow:
              0 4.8cqh 10cqh rgba(0, 0, 0, 0.5),
              0 1.4cqh 3cqh rgba(0, 0, 0, 0.4),
              inset 0 0.12cqh 0 rgba(255, 255, 255, 0.3),
              inset 0 0 0 0.08cqw rgba(0, 0, 0, 0.72);
            transform-origin: 50% 50%;
            will-change: transform, opacity;
          }

          .pdd-screen {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            border-radius: 3.72cqh;
            background: var(--bg, #0c1014);
            box-shadow: inset 0 0 0 0.08cqw var(--border, #2e2e32);
            color: var(--fg, #f2f2f2);
            isolation: isolate;
          }

          .pdd-app-glow {
            position: absolute;
            inset: 0;
            background: var(--bg, #0c1014);
          }

          .pdd-cutout {
            position: absolute;
            z-index: 10;
            top: 1.2cqh;
            left: 50%;
            width: 7.2cqh;
            height: 2.1cqh;
            border-radius: 1.2cqh;
            background: #050607;
            transform: translateX(-50%);
          }

          .pdd-ui {
            position: absolute;
            inset: 0;
            padding: 6.2cqh 2.1cqh 2.2cqh;
            display: flex;
            flex-direction: column;
            gap: 1.55cqh;
          }

          .pdd-header,
          .pdd-hero,
          .pdd-stats {
            position: relative;
            z-index: 2;
            transform-origin: 50% 50%;
            will-change: transform;
          }

          .pdd-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
          }

          .pdd-heading {
            min-width: 0;
          }

          .pdd-kicker {
            color: var(--muted, #8a8a90);
            font-size: max(28px, 1.33cqh);
            font-weight: 700;
            letter-spacing: 0.12em;
            line-height: 1;
            text-transform: uppercase;
          }

          .pdd-title {
            color: var(--fg, #f2f2f2);
            font-size: max(28px, 3.4cqh);
            font-weight: 780;
            letter-spacing: -0.02em;
            line-height: 1.12;
            overflow-wrap: break-word;
          }

          .pdd-avatar {
            flex: 0 0 auto;
            width: max(56px, 4.6cqh);
            aspect-ratio: 1;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: var(--pdd-accent);
            color: var(--fg, #f2f2f2);
            font-size: max(28px, 1.28cqh);
            font-weight: 800;
            box-shadow: 0 0.55cqh 1.4cqh rgba(0, 0, 0, 0.4);
          }

          .pdd-hero {
            min-height: 24cqh;
            padding: 2.1cqh;
            overflow: hidden;
            border: 0.08cqw solid var(--border, #2e2e32);
            border-radius: 2.1cqh;
            background: var(--surface, #18181a);
            box-shadow: 0 1.7cqh 3.8cqh rgba(0, 0, 0, 0.35);
          }

          .pdd-hero-label {
            color: var(--muted, #8a8a90);
            font-size: max(28px, 1.28cqh);
            font-weight: 650;
          }

          .pdd-value {
            margin-top: 0.45cqh;
            color: var(--fg, #f2f2f2);
            font-size: max(28px, 5.4cqh);
            font-weight: 790;
            letter-spacing: -0.03em;
            line-height: 1;
          }

          .pdd-value span {
            color: var(--pdd-accent);
            font-size: max(28px, 1.35cqh);
            letter-spacing: 0;
          }

          .pdd-chart {
            position: absolute;
            left: 2.1cqh;
            right: 2.1cqh;
            bottom: 2.2cqh;
            height: 8.2cqh;
            display: flex;
            align-items: end;
            gap: 0.55cqh;
          }

          .pdd-bar {
            flex: 1 1 0;
            min-width: 0;
            border-radius: 0.55cqh 0.55cqh 0.18cqh 0.18cqh;
            background: var(--border, #2e2e32);
          }

          .pdd-bar:nth-child(1) {
            height: 38%;
          }

          .pdd-bar:nth-child(2) {
            height: 54%;
          }

          .pdd-bar:nth-child(3) {
            height: 46%;
          }

          .pdd-bar:nth-child(4) {
            height: 72%;
          }

          .pdd-bar:nth-child(5) {
            height: 64%;
          }

          .pdd-bar:nth-child(6) {
            height: 92%;
            background: var(--pdd-accent);
          }

          .pdd-stats {
            /* Side by side only when both cards fit the screen (about 430px in any box,
               the phone is sized by height); otherwise each takes its own full row. */
            display: flex;
            flex-wrap: wrap;
            gap: 1.15cqh;
          }

          .pdd-stats > .pdd-stat {
            flex: 1 1 0;
            min-width: max-content;
          }

          .pdd-stat {
            min-height: 11.5cqh;
            padding: 1.55cqh;
            border: 0.08cqw solid var(--border, #2e2e32);
            border-radius: 1.7cqh;
            background: var(--surface, #18181a);
            box-shadow: 0 1.1cqh 2.6cqh rgba(0, 0, 0, 0.3);
          }

          .pdd-stat-label {
            color: var(--muted, #8a8a90);
            font-size: max(28px, 1.16cqh);
            font-weight: 650;
          }

          .pdd-stat-value {
            margin-top: 1cqh;
            color: var(--fg, #f2f2f2);
            font-size: max(28px, 3.6cqh);
            font-weight: 780;
            letter-spacing: -0.02em;
          }

          .pdd-stat-value span {
            color: var(--pdd-accent);
          }
        </style>

        <div
          id="parallax-device-dive-clip"
          class="pdd-clip clip"
          data-start="0"
          data-duration="4.5"
          data-track-index="0"
        >
          <div class="pdd-camera">
            <div class="pdd-phone">
              <div class="pdd-screen">
                <div class="pdd-app-glow"></div>
                <div class="pdd-ui">
                  <div class="pdd-header">
                    <div class="pdd-heading">
                      <div class="pdd-kicker">Обзор</div>
                      <div class="pdd-title"></div>
                    </div>
                    <div class="pdd-avatar">М</div>
                  </div>

                  <div class="pdd-hero">
                    <div class="pdd-hero-label">За неделю</div>
                    <div class="pdd-value">24 800 <span>+18%</span></div>
                    <div class="pdd-chart" aria-hidden="true">
                      <span class="pdd-bar"></span>
                      <span class="pdd-bar"></span>
                      <span class="pdd-bar"></span>
                      <span class="pdd-bar"></span>
                      <span class="pdd-bar"></span>
                      <span class="pdd-bar"></span>
                    </div>
                  </div>

                  <div class="pdd-stats">
                    <div class="pdd-stat">
                      <div class="pdd-stat-label">Конверсия</div>
                      <div class="pdd-stat-value"><span>8,4%</span></div>
                    </div>
                    <div class="pdd-stat">
                      <div class="pdd-stat-label">Активные</div>
                      <div class="pdd-stat-value">12 604</div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="pdd-cutout" aria-hidden="true"></div>
            </div>
          </div>
        </div>

        <script>
          /* hostSlot: the whole-scene clip follows the host slot (komp-sobrat.py klip_hozyaina; caret-swap:219) */
          (function () {
            var c = document.getElementById("parallax-device-dive-clip");
            var h = c && c.parentElement && c.parentElement.closest("[data-duration]");
            if (h) c.dataset.duration = h.dataset.duration;
          })();
        </script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var phone = root.querySelector(".pdd-phone");
            var cutout = root.querySelector(".pdd-cutout");
            var header = root.querySelector(".pdd-header");
            var hero = root.querySelector(".pdd-hero");
            var stats = root.querySelector(".pdd-stats");
            var title = root.querySelector(".pdd-title");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            // One palette: the app highlight rides the reel brand red.
            var accentColor = "var(--brand, #ff0000)";
            var appTitle = vars.app_title == null ? "Статистика" : String(vars.app_title);

            root.style.setProperty("--pdd-accent", accentColor);
            title.textContent = appTitle;

            var IN_BASE = 1.05;
            var OUT_BASE = 1.65;
            var duration = Math.max(
              0.001,
              parseFloat(
                ((root.parentElement && root.parentElement.closest("[data-duration]")) || root)
                  .dataset.duration || "4.5",
              ),
            );
            var totalBase = IN_BASE + OUT_BASE;
            var envelopeScale = duration < totalBase ? duration / totalBase : 1;
            var IN = IN_BASE * envelopeScale;
            var OUT = OUT_BASE * envelopeScale;
            var HOLD = Math.max(0, duration - IN - OUT);
            var HOLD_START = IN;
            var OUT_START = IN + HOLD;
            var RISE = IN * 0.78;
            var SETTLE = IN - RISE;
            var DIVE = OUT * 0.72;
            var DEPTH_SETTLE = OUT - DIVE;

            var tl = gsap.timeline({ paused: true });

            tl.fromTo(
              phone,
              { opacity: 0, y: "18cqh", scale: 0.86 },
              { opacity: 1, y: "-1cqh", scale: 1.02, duration: RISE, ease: "power3.out" },
              0,
            );
            tl.to(phone, { y: 0, scale: 1, duration: SETTLE, ease: "power2.out" }, RISE);

            if (HOLD > 0) {
              tl.to(phone, { y: "-0.55cqh", duration: HOLD * 0.5, ease: "sine.inOut" }, HOLD_START);
              tl.to(
                phone,
                { y: 0, duration: HOLD * 0.5, ease: "sine.inOut" },
                HOLD_START + HOLD * 0.5,
              );
            }

            // The dive lands with the screen filling the box width and the top of the app in view,
            // measured once at mount: a fixed 6.4x (sized for 1920x1080) pushed the cards past the
            // box edges in a tall box, cutting their figures.
            var boxW = root.clientWidth || 1920;
            var boxH = root.clientHeight || 1080;
            var phoneW = phone.offsetWidth || 1;
            var phoneH = phone.offsetHeight || 1;
            // Bottom of the stats row inside the phone, at its deepest parallax pose
            // (2.4cqh down, scale 1.12 about its centre): the dive stops before the
            // box edge would cut it, so no line of the app is clipped silently.
            var statsBottom = stats.offsetHeight * 1.06 + boxH * 0.024;
            for (var el = stats; el && el !== phone; el = el.offsetParent)
              statsBottom += el.offsetTop;
            if (el !== phone) statsBottom = phoneH;
            var DIVE_SCALE = Math.max(1, Math.min(boxW / phoneW, (boxH * 0.97) / statsBottom));
            var DIVE_Y = Math.max(0, (phoneH * DIVE_SCALE - boxH) / 2);
            tl.to(
              phone,
              { scale: DIVE_SCALE, y: DIVE_Y, duration: OUT, ease: "power4.in" },
              OUT_START,
            );
            tl.to(cutout, { opacity: 0, duration: DIVE * 0.45, ease: "power2.out" }, OUT_START);
            tl.to(
              header,
              { y: "-1.2cqh", scale: 1.035, duration: DIVE, ease: "power4.in" },
              OUT_START,
            );
            tl.to(
              hero,
              { y: "-2.1cqh", scale: 1.09, duration: DIVE, ease: "power4.in" },
              OUT_START,
            );
            tl.to(
              stats,
              { y: "2.4cqh", scale: 1.12, duration: DIVE, ease: "power4.in" },
              OUT_START,
            );
            tl.to(
              [header, hero, stats],
              { y: 0, scale: 1, duration: DEPTH_SETTLE, ease: "power4.out" },
              OUT_START + DIVE,
            );
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["parallax-device-dive"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
