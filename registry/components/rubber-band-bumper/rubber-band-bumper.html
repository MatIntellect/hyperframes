<!doctype html>
<!--
  rubber-band-bumper: HyperFrames video primitive

  The outgoing panel is pulled opposite its exit direction in progressively
  smaller steps, visibly loading two accent bands. After a still threshold
  hold, it releases past the chosen edge with overshoot while the incoming
  panel settles into place behind it.

  Variables:
    direction: up or left exit direction
    out_kicker, out_title, out_subtitle / in_kicker, in_title, in_subtitle:
      the words of the outgoing and incoming panels; empty hides the line
    the tension bands ride the reel brand red (--brand), pure

  Envelope, fixed IN and OUT with elastic HOLD:
    IN_BASE  = 1.25s, five equal pull beats add decreasing displacement
    HOLD     = max(0, D - IN - OUT), stillness at maximum tension
    OUT_BASE = 0.95s, overshooting release and incoming-panel settle
    If D is shorter than IN_BASE + OUT_BASE, IN and OUT compress together.
    The timeline is never time-scaled.

  Mount contract: the runtime clones only this template. #root fills the host
  box, establishes the container query basis, and has no data-width or
  data-height. One paused timeline registers under the literal
  rubber-band-bumper key.
-->
<html
  lang="en"
  data-composition-id="rubber-band-bumper"
  data-composition-duration="2.5"
  data-composition-variables='[
    {"id": "direction", "type": "enum", "role": "content", "label": "Direction", "description": "Edge the outgoing panel releases through.", "default": "up", "options": [{"value": "up", "label": "Up"}, {"value": "left", "label": "Left"}]},
    {"id": "out_kicker", "type": "string", "role": "content", "label": "Outgoing kicker", "description": "Empty hides the line.", "default": "СЕЙЧАС"},
    {"id": "out_title", "type": "string", "role": "content", "label": "Outgoing title", "description": "Empty hides the line.", "default": "Держим натяжение"},
    {"id": "out_subtitle", "type": "string", "role": "content", "label": "Outgoing subtitle", "description": "Empty hides the line.", "default": "С каждым рывком сопротивление сильнее"},
    {"id": "in_kicker", "type": "string", "role": "content", "label": "Incoming kicker", "description": "Empty hides the line.", "default": "ДАЛЬШЕ"},
    {"id": "in_title", "type": "string", "role": "content", "label": "Incoming title", "description": "Empty hides the line.", "default": "Отпустили"},
    {"id": "in_subtitle", "type": "string", "role": "content", "label": "Incoming subtitle", "description": "Empty hides the line.", "default": "Новая сцена встаёт за рывком"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Rubber Band Bumper</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="rubber-band-bumper" data-duration="2.5" data-fps="30">
        <style>
          @font-face {
            font-family: "Bebas Neue";
            src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
            font-weight: 700;
            font-display: block;
          }
          @font-face {
            font-family: "Montserrat";
            src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
            font-weight: 100 900;
            font-display: block;
            unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
          }
          @font-face {
            font-family: "Montserrat";
            src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
            font-weight: 100 900;
            font-display: block;
            unicode-range:
              U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
              U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
          }
          @font-face {
            font-family: "Montserrat";
            src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
            font-weight: 100 900;
            font-display: block;
            unicode-range:
              U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308,
              U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4,
              U+2113, U+2C60-2C7F, U+A720-A7FF;
          }
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            container-type: size;
            isolation: isolate;
            color: var(--fg, #f2f2f2);
            font-family: var(--font-display, "Bebas Neue", sans-serif);
            pointer-events: none;
          }

          .rbb-clip,
          .rbb-panel {
            position: absolute;
            inset: 0;
            width: 100cqw;
            height: 100cqh;
          }

          .rbb-clip {
            overflow: hidden;
            background: var(--bg, #0c1014);
          }

          .rbb-panel {
            display: grid;
            place-items: center;
            will-change: transform, opacity;
          }

          .rbb-incoming {
            background: var(--bg, #0c1014);
          }

          .rbb-outgoing {
            z-index: 2;
            background: var(--surface, #18181a);
            border: 0.18cqmin solid var(--border, #2e2e32);
            box-shadow: 0 2.8cqh 8cqh rgba(0, 0, 0, 0.48);
          }

          .rbb-copy {
            display: grid;
            justify-items: center;
            gap: 2.4cqh;
            max-width: 72cqw;
            text-align: center;
          }

          .rbb-kicker {
            padding: 1cqh 1.4cqw;
            border: max(2px, 0.14cqmin) solid var(--rbb-accent);
            border-radius: 999px;
            color: var(--fg, #f2f2f2);
            font-family: var(--font-body, "Montserrat", sans-serif);
            font-size: max(28px, 2.2cqmin);
            font-weight: 700;
            letter-spacing: 0.16em;
            line-height: 1;
          }

          .rbb-title {
            margin: 0;
            color: var(--fg, #f2f2f2);
            font-size: clamp(28px, 8.8cqmin, 92px);
            font-weight: 700;
            letter-spacing: 0.01em;
            line-height: 0.95;
          }

          .rbb-subtitle {
            margin: 0;
            color: var(--muted, #8a8a90);
            font-family: var(--font-body, "Montserrat", sans-serif);
            font-size: clamp(28px, 3.1cqmin, 30px);
            font-weight: 520;
            line-height: 1.25;
          }

          .rbb-band {
            position: absolute;
            z-index: 1;
            border-radius: 999px;
            background: var(--rbb-accent);
            will-change: transform, opacity;
          }

          #root.rbb-left .rbb-band {
            left: 0;
            width: 14cqw;
            height: 1.1cqh;
            transform-origin: 0 50%;
          }

          #root.rbb-left .rbb-band-a {
            top: 34cqh;
          }

          #root.rbb-left .rbb-band-b {
            top: 66cqh;
          }

          #root.rbb-up .rbb-band {
            top: 0;
            width: 1.1cqw;
            height: 14cqh;
            transform-origin: 50% 0;
          }

          #root.rbb-up .rbb-band-a {
            left: 34cqw;
          }

          #root.rbb-up .rbb-band-b {
            left: 66cqw;
          }
        </style>

        <div
          id="rubber-band-bumper-clip"
          class="rbb-clip clip"
          data-start="0"
          data-duration="2.5"
          data-track-index="0"
        >
          <section class="rbb-panel rbb-incoming">
            <div class="rbb-copy" data-layout-allow-overlap>
              <span class="rbb-kicker">ДАЛЬШЕ</span>
              <h2 class="rbb-title">Отпустили</h2>
              <p class="rbb-subtitle">Новая сцена встаёт за рывком</p>
            </div>
          </section>

          <span class="rbb-band rbb-band-a" aria-hidden="true"></span>
          <span class="rbb-band rbb-band-b" aria-hidden="true"></span>

          <section class="rbb-panel rbb-outgoing" data-layout-allow-occlusion>
            <div class="rbb-copy">
              <span class="rbb-kicker">СЕЙЧАС</span>
              <h2 class="rbb-title">Держим натяжение</h2>
              <p class="rbb-subtitle">С каждым рывком сопротивление сильнее</p>
            </div>
          </section>
        </div>

        <script>
          /* hostSlot: the whole-scene clip follows the host slot (komp-sobrat.py klip_hozyaina; caret-swap:219) */
          (function () {
            var c = document.getElementById("rubber-band-bumper-clip");
            var h = c && c.parentElement && c.parentElement.closest("[data-duration]");
            if (h) c.dataset.duration = h.dataset.duration;
          })();
        </script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var outgoing = root.querySelector(".rbb-outgoing");
            var incoming = root.querySelector(".rbb-incoming");
            var bands = root.querySelectorAll(".rbb-band");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            var direction = vars.direction === "left" ? "left" : "up";
            // Words come from fields; an empty field hides its line.
            [
              ["out", outgoing],
              ["in", incoming],
            ].forEach(function (panel) {
              ["kicker", "title", "subtitle"].forEach(function (part) {
                var value = vars[panel[0] + "_" + part];
                if (value == null) return;
                var line = panel[1].querySelector(".rbb-" + part);
                line.textContent = String(value);
                if (!line.textContent) line.style.display = "none";
              });
            });
            // One palette: the accent rides the reel brand red.
            var accentColors = { brand: "var(--brand, #ff0000)" };
            var accent = "brand";
            var motionByDirection = {
              up: {
                rootClass: "rbb-up",
                axis: "y",
                crossAxis: "x",
                bandAxis: "scaleY",
                outgoingArc: "3%",
                incomingArc: "-1.6%",
              },
              left: {
                rootClass: "rbb-left",
                axis: "x",
                crossAxis: "y",
                bandAxis: "scaleX",
                outgoingArc: "-3%",
                incomingArc: "1.6%",
              },
            };
            var motion = motionByDirection[direction];

            root.classList.add(motion.rootClass);
            root.style.setProperty("--rbb-accent", accentColors[accent]);

            var IN_BASE = 1.25;
            var OUT_BASE = 0.95;
            var duration = Math.max(
              0.001,
              parseFloat(
                ((root.parentElement && root.parentElement.closest("[data-duration]")) || root)
                  .dataset.duration || "2.5",
              ),
            );
            var totalBase = IN_BASE + OUT_BASE;
            var scale = duration < totalBase ? duration / totalBase : 1;
            var IN = IN_BASE * scale;
            var OUT = OUT_BASE * scale;
            var HOLD = Math.max(0, duration - IN - OUT);
            var OUT_START = IN + HOLD;

            // One authored table owns the resistance curve. Equal-time steps
            // add 5, 3.5, 2, 1.25, then 0.5 percent displacement.
            var pullPositions = [5, 8.5, 10.5, 11.75, 12.25];
            var segmentDuration = IN / pullPositions.length;
            var exitPosition = "-112%";
            var incomingStart = "-5%";

            gsap.set(outgoing, { x: "0%", y: "0%" });
            gsap.set(incoming, { x: "0%", y: "0%", scale: 0.985, opacity: 0.82 });
            var incomingOffset = {};
            incomingOffset[motion.axis] = incomingStart;
            gsap.set(incoming, incomingOffset);
            gsap.set(bands, { opacity: 1, scaleX: 1, scaleY: 1 });
            var bandStart = {};
            bandStart[motion.bandAxis] = 0.08;
            gsap.set(bands, bandStart);

            var tl = gsap.timeline({ paused: true });

            pullPositions.forEach(function (position, index) {
              var at = index * segmentDuration;
              var panelTween = { duration: segmentDuration, ease: "power2.out" };
              var bandTween = { duration: segmentDuration, ease: "power2.out" };
              panelTween[motion.axis] = position + "%";
              bandTween[motion.bandAxis] = 0.08 + position / 14;
              tl.to(outgoing, panelTween, at);
              tl.to(bands, bandTween, at);
            });

            var releaseDuration = OUT * 0.84;
            var releaseTween = { duration: releaseDuration, ease: "back.out(1.7)" };
            var outgoingArc = {
              duration: releaseDuration * 0.5,
              ease: "sine.inOut",
              yoyo: true,
              repeat: 1,
            };
            releaseTween[motion.axis] = exitPosition;
            outgoingArc[motion.crossAxis] = motion.outgoingArc;
            tl.to(outgoing, releaseTween, OUT_START);
            tl.to(outgoing, outgoingArc, OUT_START);
            var bandRelease = {
              opacity: 0,
              duration: OUT * 0.28,
              ease: "power4.out",
            };
            bandRelease[motion.bandAxis] = 0.04;
            tl.to(bands, bandRelease, OUT_START);
            var incomingDuration = OUT * 0.78;
            var incomingSettle = {
              scale: 1,
              opacity: 1,
              duration: incomingDuration,
              ease: "back.out(1.7)",
            };
            var incomingArc = {
              duration: incomingDuration * 0.5,
              ease: "sine.inOut",
              yoyo: true,
              repeat: 1,
            };
            incomingSettle[motion.axis] = "0%";
            incomingArc[motion.crossAxis] = motion.incomingArc;
            tl.to(incoming, incomingSettle, OUT_START);
            tl.to(incoming, incomingArc, OUT_START);

            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["rubber-band-bumper"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
