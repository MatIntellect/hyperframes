<!--
  Confetti - celebration burst overlay for HyperFrames.

  Mount it over the moment to celebrate, in a clip with
  data-composition-id="confetti": it fills the clip with no background. 22
  pieces in the palette (brand red, light, grey) burst up from just below
  the centre, then fall under gravity and fade. The source was a demo card
  (English title, blurred blobs) whose pieces froze in the air: the card is
  gone and the fall is added, as its own description promised.
-->

<!--
  Timeline integration: built in, see the script below. It registers its own paused timeline as
  window.__timelines["confetti"]; mount the snippet inside a clip with data-composition-id="confetti"
  and the runtime nests it at that clip's start.
-->

<script>
  /* own timeline (component-quality-bar.md X1): the host clip carries data-composition-id="confetti" */
  (function () {
    var startTime = 0;
    var tl = gsap.timeline({ paused: true });
    const particles_confetti = gsap.utils.toArray(".hf-catalog-confetti .particle");
    if (particles_confetti.length) {
      tl.fromTo(
        particles_confetti,
        { "--hf-po": 0, "--hf-px": "0px", "--hf-py": "0px", "--hf-pr": "0deg" },
        {
          "--hf-po": 1,
          "--hf-px": (i) => Math.cos(i * 0.83) * 250 + "px",
          "--hf-py": (i) => -120 - Math.sin(i * 0.61) * 120 + "px",
          "--hf-pr": (i) => 180 + i * 37 + "deg",
          duration: 0.8,
          stagger: 0.015,
          ease: "power2.out",
        },
        startTime + 0.2,
      );
      tl.to(
        particles_confetti,
        {
          "--hf-py": (i) => 260 + Math.cos(i * 1.7) * 90 + "px",
          "--hf-pr": (i) => 540 + i * 53 + "deg",
          duration: 1.3,
          stagger: 0.015,
          ease: "power2.in",
        },
        startTime + 1.0,
      );
      tl.to(
        particles_confetti,
        { "--hf-po": 0, duration: 0.4, stagger: 0.015, ease: "power1.in" },
        startTime + 1.9,
      );
    }
    window.__timelines = window.__timelines || {};
    window.__timelines["confetti"] = tl;
  })();
</script>
