<!--
  RGB Glitch Text - typography primitive for HyperFrames.

  Paste the markup, CSS and script into a composition. Drive the timeline
  integration from a paused GSAP timeline so renders remain deterministic.

  Variables. The script reads each one, falls back to the declared default on
  anything missing or unrecognised, and writes the result as a custom property
  the CSS above consumes. The timeline recipe below is untouched by them: it
  keeps driving one red offset and one cyan offset, and intensity decides how
  far those offsets actually carry.

    - text (any short word, default "СБОЙ"): the word set on all three
      stacked copies at once, so they stay in register.
    - intensity (subtle | standard | extreme, default standard): scales the
      driven offsets, from a hairline fringe to a hard tear. Both offsets are
      zero at rest, so this one only shows once the timeline runs.
    - tone (ink | paper | accent, default paper: the reels are dark): colour of the solid copy the
      red and cyan ghosts split away from. ink is near-black for light frames,
      paper near-white for dark ones, accent rides --brand.

  On every default the result is identical to the original: near-black СБОЙ
  with red and cyan copies tearing 8px either way.
-->

<div
  class="hf-catalog-rgb-glitch-text"
  data-layout-allow-overlap
  data-composition-variables='[
    { "id": "text", "type": "string", "role": "content", "label": "Text", "description": "The word shown on all three stacked copies.", "default": "СБОЙ", "maxLength": 24 },
    { "id": "intensity", "type": "enum", "role": "motion", "label": "Intensity", "description": "Scales the red and cyan offsets the timeline drives, so the split reads as a hairline or a hard tear.", "default": "standard", "options": [{ "value": "subtle", "label": "Subtle" }, { "value": "standard", "label": "Standard" }, { "value": "extreme", "label": "Extreme" }] },
    { "id": "tone", "type": "enum", "role": "style", "label": "Tone", "description": "Colour of the solid copy the two ghosts split away from: ink for light frames, paper for dark ones, accent rides --brand.", "default": "paper", "options": [{ "value": "ink", "label": "Ink" }, { "value": "paper", "label": "Paper" }, { "value": "accent", "label": "Accent" }] }
  ]'
>
  <span>СБОЙ</span><span>СБОЙ</span><strong>СБОЙ</strong>
</div>

<style>
  @font-face {
    font-family: "Bebas Neue";
    src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
    font-weight: 700;
    font-display: block;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
    unicode-range:
      U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329,
      U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
    unicode-range:
      U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329,
      U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F,
      U+A720-A7FF;
  }
  .hf-catalog-rgb-glitch-text {
    color: var(--hf-glitch-ink, var(--fg, #f2f2f2));
    font-family: "Montserrat", system-ui, sans-serif;
    font-weight: 900;
    letter-spacing: -0.04em;
  }
  .hf-catalog-rgb-glitch-text {
    position: relative;
    width: max-content;
    max-width: 100%;
    text-align: center;
    font-size: 72px;
    line-height: 1;
  }
  .hf-catalog-rgb-glitch-text span {
    position: absolute;
    inset: 0;
  }
  /* the solid copy sits in flow and sizes the box: a long word wraps inside the space the host gives, the two
     ghosts above it are the same width and wrap the same way */
  .hf-catalog-rgb-glitch-text strong {
    position: relative;
    display: block;
  }
  .hf-catalog-rgb-glitch-text span:first-child {
    color: var(--accent, #ff0000);
    transform: translateX(calc(var(--hf-glitch-red, 0px) * var(--hf-glitch-reach, 1)));
  }
  .hf-catalog-rgb-glitch-text span:nth-child(2) {
    color: var(--muted, #8a8a90);
    transform: translateX(calc(var(--hf-glitch-blue, 0px) * var(--hf-glitch-reach, 1)));
  }
  .hf-catalog-rgb-glitch-text strong {
    color: var(--hf-glitch-ink, var(--fg, #f2f2f2));
  }
</style>

<script>
  (function () {
    "use strict";

    var vars =
      window.__hyperframes && window.__hyperframes.getVariables
        ? window.__hyperframes.getVariables()
        : {};

    // Unrecognised overrides return to their declared defaults.
    var reaches = { subtle: 0.5, standard: 1, extreme: 2.25 };
    var tones = {
      ink: "var(--bg, #0c1014)",
      paper: "var(--fg, #f2f2f2)",
      accent: "var(--brand, #ff0000)",
    };

    function pick(table, value, fallback) {
      return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
    }

    var reach = reaches[pick(reaches, vars.intensity, "standard")];
    var tone = tones[pick(tones, vars.tone, "paper")];
    var text = typeof vars.text === "string" && vars.text.trim() !== "" ? vars.text.trim() : "СБОЙ";

    var roots = document.querySelectorAll(".hf-catalog-rgb-glitch-text");
    for (var i = 0; i < roots.length; i += 1) {
      roots[i].style.setProperty("--hf-glitch-reach", String(reach));
      roots[i].style.setProperty("--hf-glitch-ink", tone);
      var copies = roots[i].querySelectorAll("span, strong");
      for (var j = 0; j < copies.length; j += 1) {
        copies[j].textContent = text;
      }
    }
  })();
</script>

<!--
  Timeline integration:
  tl.to('.hf-catalog-rgb-glitch-text', { opacity: 1, duration: 0.01 }, startTime); tl.to('.hf-catalog-rgb-glitch-text', { '--hf-glitch-red': '-8px', '--hf-glitch-blue': '8px', duration: 0.06, repeat: 5, yoyo: true, ease: 'steps(1)' }, startTime + 0.1);
-->
