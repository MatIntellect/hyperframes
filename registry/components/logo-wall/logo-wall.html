<!doctype html>
<!--
  logo-wall: HyperFrames video primitive (data / holdable / prove)

  Concept: a trusted-by wall of placeholder lettermark logos assembles in DOM
  order. Each cell fades and scales directly into its final grid slot with a
  fixed per-cell delay. One mechanic, one job: prove trust through a collected
  wall of customer marks.

  Compiled-from evidence: consumer-sim fixture plus the grid-card-assemble
  blueprint's Social_Proof logo-wall variant. The blueprint requires a dense
  array to use short, slot-local entrances instead of a shared-center burst.

  Use when: a scene needs a compact trusted-by beat without using real brand
  assets or turning the wall into a feature-card showcase.

  Variables (declared in data-composition-variables below):
    - rows (number, default 4, range 2 to 4): visible logo rows.
    - cols (number, default 3, range 3 to 6: a vertical reel holds 3): visible logo columns.
    - stagger (number, default 45, range 20 to 75 ms): fixed delay between
      consecutive cell entrances.

  Envelope (fixed IN/OUT, elastic HOLD only, never gsap.timeScale()):
    IN_BASE  = 2.50s  ordered fade and scale assembly.
    HOLD     = elastic = max(0, D - (IN_BASE + OUT_BASE)); deliberately still
               so the completed evidence wall remains readable.
    OUT_BASE = 0.50s  clean group fade.
    If D is shorter than IN_BASE + OUT_BASE, IN and OUT scale down together so
    IN + OUT equals D and HOLD equals 0. The index-based stagger scales only in
    that compressed envelope.

  Sync point: none. The proof is distributed across per-cell arrivals, so no
  single fixed cue represents the assembly honestly.

  Sound cue: none. A distributed wall assembly has no truthful single-frame
  sound event, so this primitive does not dispatch hf:sfx.

  Mount contract: this file is a mountable sub-composition. A host loads it via
  data-composition-src, and the runtime clones only <template> contents. Styles,
  markup, GSAP, and registration therefore live inside <template>. #root fills
  the host with inset:0 and container-type:size and has no data-width or
  data-height. The hardcoded id "logo-wall" matches the host id and timeline
  key after mount flattening. Variables come from
  window.__hyperframes.getVariables(), which merges declarations with host
  data-variable-values overrides.
-->
<html
  lang="ru"
  data-composition-variables='[
    { "id": "rows", "type": "number", "role": "layout", "label": "Rows", "description": "Number of logo rows in the wall.", "default": 4, "min": 2, "max": 4, "step": 1 },
    { "id": "cols", "type": "number", "role": "layout", "label": "Columns", "description": "Number of logo columns in the wall.", "default": 3, "min": 3, "max": 6, "step": 1 },
    { "id": "stagger", "type": "number", "role": "motion", "label": "Stagger", "description": "Delay between consecutive logo cell entrances.", "default": 45, "min": 20, "max": 75, "step": 1, "unit": "ms" },
    { "id": "heading", "type": "string", "role": "content", "label": "Heading", "description": "Line above the wall.", "default": "Нам доверяют", "maxLength": 28 },
    { "id": "marks", "type": "string", "role": "content", "label": "Marks", "description": "Comma-separated client names, one per cell, in reading order. Empty keeps the neutral lettermarks; the wall shrinks to the names given.", "default": "" }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Logo Wall</title>
    <!-- Metadata only. The loader reads declarations from <html>, then
         discards everything outside <template>. -->
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="logo-wall" data-start="0" data-duration="5" data-fps="30">
        <style>
          @font-face {
            font-family: "Bebas Neue";
            src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
            font-weight: 700;
            font-display: block;
          }
          @font-face {
            font-family: "Montserrat";
            src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
            font-weight: 100 900;
            font-display: block;
            unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
          }
          @font-face {
            font-family: "Montserrat";
            src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
            font-weight: 100 900;
            font-display: block;
            unicode-range:
              U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
              U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
          }
          @font-face {
            font-family: "Montserrat";
            src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
            font-weight: 100 900;
            font-display: block;
            unicode-range:
              U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308,
              U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4,
              U+2113, U+2C60-2C7F, U+A720-A7FF;
          }
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          /* Root fills the host box and consumes only the shared theme tokens.
             Every internal dimension is relative to this size container. */
          #root {
            position: absolute;
            inset: 0;
            container-type: size;
            isolation: isolate;
            overflow: hidden;
            color: var(--fg, #f2f2f2);
            font-family: var(--font-body, "Montserrat", sans-serif);
          }

          .lw-clip {
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
            overflow: hidden;
            background: var(--bg, #0c1014);
          }

          .lw-stage {
            width: 86cqw;
            height: 82cqh;
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            gap: var(--space-3, 3cqh);
            padding: var(--space-3, 3cqh);
          }

          .lw-heading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2, 1.6cqh);
            color: var(--muted, #8a8a90);
            font-family: var(--font-display, "Bebas Neue", sans-serif);
            font-size: max(28px, min(6.5cqw, 4.4cqh));
            font-weight: 700;
            letter-spacing: 0.08em;
            line-height: 1;
            text-transform: uppercase;
          }

          .lw-heading::before,
          .lw-heading::after {
            content: "";
            width: 8cqw;
            height: 0.14cqw;
            background: var(--border, #2e2e32);
          }

          /* EDIT ZONE: grid geometry. rows and cols are the sole owners of
             track count. Spacing and surfaces remain theme-token driven. */
          .lw-grid {
            min-width: 0;
            min-height: 0;
            /* rows wrap and centre: a short last row sits in the middle, not pinned left (second head 027) */
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-content: stretch;
            gap: var(--space-2, 1.6cqh);
          }

          .lw-grid > .lw-cell {
            flex: 0 0 calc((100% - (var(--lw-cols) - 1) * var(--space-2, 1.6cqh)) / var(--lw-cols));
            height: calc((100% - (var(--lw-rows) - 1) * var(--space-2, 1.6cqh)) / var(--lw-rows));
          }

          .lw-cell {
            min-width: 0;
            min-height: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
            border: 0.14cqw solid var(--border, #2e2e32);
            border-radius: var(--radius, 2cqw);
            background: var(--surface, #18181a);
            box-shadow: 0 1.2cqh 3cqh color-mix(in srgb, var(--bg, #0c1014) 58%, transparent);
          }

          .lw-mark {
            display: grid;
            place-items: center;
            /* a text mark sized for a 780 px reel field: names fit, 28 px floor (vertical.md:18) */
            max-width: 100%;
            padding: 0 0.4em;
            color: var(--fg, #f2f2f2);
            font-family: var(--font-body, "Montserrat", sans-serif);
            font-size: var(--lw-mark-size, max(28px, min(6cqw, 4.2cqh)));
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.05;
            text-align: center;
            /* names break between words only; the size is fitted to the longest word (second head 027: «Кофе/йня») */
            overflow-wrap: normal;
            text-wrap: balance;
          }
        </style>

        <div
          id="logo-wall-clip"
          class="lw-clip clip"
          data-start="0"
          data-duration="5"
          data-track-index="0"
        >
          <section class="lw-stage" aria-label="Нам доверяют">
            <div class="lw-heading">Нам доверяют</div>
            <div class="lw-grid"></div>
          </section>
        </div>

        <script>
          /* hostSlot: the whole-scene clip follows the host slot (komp-sobrat.py klip_hozyaina; caret-swap:219) */
          (function () {
            var c = document.getElementById("logo-wall-clip");
            var h = c && c.parentElement && c.parentElement.closest("[data-duration]");
            if (h) c.dataset.duration = h.dataset.duration;
          })();
        </script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var compositionId = "logo-wall";
            var stage = root.querySelector(".lw-stage");
            var grid = root.querySelector(".lw-grid");

            // EDIT ZONE: the runtime variable table is read once. These
            // clamped values own DOM count, grid tracks, and stagger timing.
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            var rawRows = Number(vars.rows);
            var rows = Number.isFinite(rawRows) ? Math.round(rawRows) : 4;
            rows = Math.max(2, Math.min(4, rows));

            var rawCols = Number(vars.cols);
            var cols = Number.isFinite(rawCols) ? Math.round(rawCols) : 3;
            cols = Math.max(3, Math.min(6, cols));

            var rawStagger = Number(vars.stagger);
            var staggerMs = Number.isFinite(rawStagger) ? rawStagger : 45;
            staggerMs = Math.max(20, Math.min(75, staggerMs));

            var lettermarks = [
              "AX",
              "BL",
              "CY",
              "DQ",
              "EV",
              "FK",
              "GN",
              "HT",
              "IP",
              "JR",
              "KS",
              "LU",
              "MW",
              "NX",
              "OZ",
              "PA",
              "QC",
              "RF",
              "SG",
              "TJ",
              "VK",
              "WL",
              "XM",
              "YN",
            ];
            // real client names, when given, replace the neutral lettermarks; the wall shrinks to them
            var given = String(vars.marks == null ? "" : vars.marks)
              .split(",")
              .map(function (name) {
                return name.trim();
              })
              .filter(Boolean);
            if (given.length) lettermarks = given;
            root.querySelector(".lw-heading").textContent =
              vars.heading == null ? "Нам доверяют" : String(vars.heading);
            var cellCount = Math.min(rows * cols, lettermarks.length);
            var fragment = document.createDocumentFragment();

            for (var index = 0; index < cellCount; index += 1) {
              var cell = document.createElement("div");
              var mark = document.createElement("span");
              cell.className = "lw-cell";
              cell.setAttribute("aria-hidden", "true");
              mark.className = "lw-mark";
              mark.textContent = lettermarks[index];
              cell.appendChild(mark);
              fragment.appendChild(cell);
            }

            grid.replaceChildren(fragment);
            grid.style.setProperty("--lw-rows", String(Math.ceil(cellCount / cols)));
            grid.style.setProperty("--lw-cols", String(cols));
            // one size for the whole wall, fitted to the longest single word in a cell (HF fitTextFontSize), floor 28;
            // a longer name then wraps between words. Fonts first (format.md:151)
            window.__hf = window.__hf || {};
            window.__hf.buildReady = window.__hf.buildReady || {};
            window.__hf.buildReady["logo-wall"] = document.fonts
              .load('800 100px "Montserrat"', lettermarks.join(" "))
              .then(function () {
                var cell = grid.querySelector(".lw-cell");
                var mark = grid.querySelector(".lw-mark");
                if (
                  !cell ||
                  !mark ||
                  !window.__hyperframes ||
                  !window.__hyperframes.fitTextFontSize
                )
                  return;
                var base = parseFloat(getComputedStyle(mark).fontSize);
                var words = lettermarks.join(" ").split(/\s+/).filter(Boolean);
                var longest = words.reduce(function (a, b) {
                  return b.length > a.length ? b : a;
                }, "");
                var fit = window.__hyperframes.fitTextFontSize(longest, {
                  fontFamily: "Montserrat",
                  fontWeight: 800,
                  maxWidth: cell.clientWidth - base * 0.8,
                  baseFontSize: base,
                  minFontSize: 28,
                  step: 1,
                });
                grid.style.setProperty("--lw-mark-size", fit.fontSize + "px");
              });

            var cells = root.querySelectorAll(".lw-cell");

            // RETIME RANGE: the 2.50s IN fits the largest public wall of 24
            // cells at the maximum 75ms stagger plus the 0.55s cell settle.
            // HOLD alone absorbs longer host durations.
            var IN_BASE = 2.5;
            var OUT_BASE = 0.5;
            var ASSEMBLE_START_BASE = 0.15;
            var CELL_DURATION_BASE = 0.55;

            var duration = Math.max(
              0.001,
              parseFloat(
                ((root.parentElement && root.parentElement.closest("[data-duration]")) || root)
                  .dataset.duration || "5",
              ),
            );
            var totalBase = IN_BASE + OUT_BASE;
            var scale = duration < totalBase ? duration / totalBase : 1;
            var IN = IN_BASE * scale;
            var OUT = OUT_BASE * scale;
            var HOLD = Math.max(0, duration - (IN + OUT));
            var OUT_START = IN + HOLD;
            var ASSEMBLE_START = ASSEMBLE_START_BASE * scale;
            var CELL_DURATION = CELL_DURATION_BASE * scale;
            var STAGGER_SECONDS = (staggerMs / 1000) * scale;

            var timeline = gsap.timeline({ paused: true });

            // IN: deterministic DOM-order assembly. power2.out is the GSAP
            // owner of the shared --ease-standard entrance token.
            timeline.fromTo(
              cells,
              { opacity: 0, scale: 0.94 },
              {
                opacity: 1,
                scale: 1,
                duration: CELL_DURATION,
                ease: "power2.out",
                stagger: { each: STAGGER_SECONDS, from: "start" },
              },
              ASSEMBLE_START,
            );

            // HOLD: deliberately still. OUT: the whole proof wall leaves once
            // with the production exit curve, never during the elastic hold.
            timeline.to(stage, { opacity: 0, duration: OUT, ease: "power2.in" }, OUT_START);

            timeline.seek(0);

            window.__timelines = window.__timelines || {};
            window.__timelines[compositionId] = timeline;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
