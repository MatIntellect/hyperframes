<!doctype html>
<!--
  curtain-reveal: HyperFrames video primitive (transitions / stage reveal).

  Two velvet stage curtains meet at center, covering the frame. On cue they
  gather outward: each fold narrows, hardest at the outer edge, and the hem
  sweeps up slightly as the fabric bunches at the sides, revealing the stage
  underneath. An optional pelmet frames the top edge and never moves; an
  optional spotlight comes up as the curtains part. The velvet is graphite in
  the reel palette (--bg, --surface, --border, --muted sheen); the pelmet is
  the brand red (--brand).

  The stage is a SLOT. Callers supply it by placing an inert template
  anywhere in the HOST page (templates never render, and the runtime wipes
  the host clip's own children on mount, so the slot lives at document level):

    <template data-slot="curtain-reveal-stage"> ... </template>

  Slot content may be an <img>, a muted <video>, or arbitrary HTML; direct
  img/video children are stretched to cover the stage (packages/producer
  drives a slotted <video>'s own data-start/data-duration exactly like any
  other clip -- this primitive never reads or sets currentTime itself). With
  no slot, the stage renders a token spotlight card so the reveal reads on
  its own.

  Variables (declared in data-composition-variables below):
    - pelmet ("on" | "off", default "on"): static valance framing the top.
    - spotlight ("on" | "off", default "on"): soft glow blooming over the
      stage as the curtains part.

  Envelope, fixed IN with elastic HOLD only (never timeScale):
    IN_BASE = 1.1s  the curtains gather and part
    HOLD    = max(0, D - IN); the stage stands revealed, still
    If D < IN_BASE, IN compresses to D (no hold).

  Determinism: no randomness anywhere in this primitive. Fold widths are a
  fixed table, the pelmet trim is a closed-form sine wave sampled at a fixed
  point count, and every fold's pose is a closed-form function of one tweened
  draw progress. Any seek order lands identical frames.

  Mount contract: the runtime clones only this template. #root fills the
  host box (no data-width/data-height, container-type: size, cqmin units),
  is styled via #root only, and registers one paused timeline under the
  LITERAL "curtain-reveal" key.
-->
<html
  lang="en"
  data-composition-id="curtain-reveal"
  data-composition-duration="2.4"
  data-composition-variables='[
    { "id": "pelmet", "type": "enum", "role": "style", "label": "Pelmet", "description": "Static valance framing the top of the stage.", "default": "on", "options": [{ "value": "on", "label": "On" }, { "value": "off", "label": "Off" }] },
    { "id": "spotlight", "type": "enum", "role": "style", "label": "Spotlight", "description": "Soft glow blooming over the stage as the curtains part.", "default": "on", "options": [{ "value": "on", "label": "On" }, { "value": "off", "label": "Off" }] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Curtain Reveal</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="curtain-reveal" data-duration="2.4" data-fps="30">
        <style>
          @font-face {
            font-family: "Bebas Neue";
            src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
            font-weight: 700;
            font-display: block;
          }
          @font-face {
            font-family: "Montserrat";
            src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
            font-weight: 100 900;
            font-display: block;
            unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
          }
          @font-face {
            font-family: "Montserrat";
            src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
            font-weight: 100 900;
            font-display: block;
            unicode-range:
              U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
              U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
          }
          @font-face {
            font-family: "Montserrat";
            src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
            font-weight: 100 900;
            font-display: block;
            unicode-range:
              U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308,
              U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4,
              U+2113, U+2C60-2C7F, U+A720-A7FF;
          }
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            container-type: size;
            isolation: isolate;
            color: var(--fg, #f2f2f2);
            font-family: var(--font-display, "Bebas Neue", sans-serif);
            background: var(--bg, #0c1014);
          }

          .cvr-clip {
            position: absolute;
            inset: 0;
            overflow: hidden;
          }

          .cvr-stage {
            position: absolute;
            inset: 0;
            overflow: hidden;
          }

          .cvr-stage > img,
          .cvr-stage > video {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
          }

          .cvr-stage-default {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            background: radial-gradient(
              60% 60% at 50% 42%,
              var(--surface, #18181a) 0%,
              var(--bg, #0c1014) 78%
            );
          }

          .cvr-stage-default-mark {
            font-size: max(28px, 4.5cqmin);
            font-weight: 700;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: var(--muted, #8a8a90);
          }

          .cvr-spotlight {
            position: absolute;
            inset: 0;
            background: radial-gradient(
              34% 52% at 50% 44%,
              color-mix(in srgb, var(--fg, #f2f2f2) 22%, transparent) 0%,
              color-mix(in srgb, var(--fg, #f2f2f2) 0%, transparent) 72%
            );
            mix-blend-mode: screen;
            opacity: 0;
            pointer-events: none;
          }

          .cvr-curtain {
            position: absolute;
            inset: 0;
          }

          .cvr-fold {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            transform-origin: 0 0;
            border-radius: 0 0 50% 50% / 0 0 1.6cqh 1.6cqh;
            background:
              linear-gradient(
                180deg,
                rgba(0, 0, 0, 0.45) 0%,
                rgba(0, 0, 0, 0) 16%,
                rgba(0, 0, 0, 0) 82%,
                rgba(0, 0, 0, 0.5) 100%
              ),
              linear-gradient(
                90deg,
                var(--cvr-fold-dark) 0%,
                var(--cvr-fold-mid) 20%,
                var(--cvr-fold-light) calc(var(--crest) - 14%),
                var(--cvr-fold-sheen) var(--crest),
                var(--cvr-fold-light) calc(var(--crest) + 10%),
                var(--cvr-fold-mid) 80%,
                var(--cvr-fold-dark) 100%
              );
          }
          .cvr-fold::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: #000;
            opacity: var(--shade, 0);
          }
          .cvr-fold:last-child {
            box-shadow: 1.2cqw 0 2.4cqw rgba(0, 0, 0, 0.55);
          }
          /* The right curtain lays out from the right edge. */
          .cvr-curtain-right .cvr-fold {
            left: auto;
            right: 0;
            transform-origin: 100% 0;
          }
          .cvr-curtain-right .cvr-fold:last-child {
            box-shadow: -1.2cqw 0 2.4cqw rgba(0, 0, 0, 0.55);
          }

          .cvr-pelmet {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 11%;
            background: var(--cvr-pelmet-color, var(--brand, #ff0000));
            box-shadow: 0 0.6cqmin 1.4cqmin rgba(0, 0, 0, 0.55);
            clip-path: var(--cvr-pelmet-hem);
          }
        </style>

        <div
          id="curtain-reveal-clip"
          class="cvr-clip clip"
          data-start="0"
          data-duration="2.4"
          data-track-index="0"
        >
          <div class="cvr-stage" id="cvr-stage">
            <div class="cvr-stage-default">
              <span class="cvr-stage-default-mark" aria-hidden="true">Сцена</span>
            </div>
          </div>
          <div class="cvr-spotlight" id="cvr-spotlight"></div>

          <div class="cvr-curtain" id="cvr-curtain-left" data-layout-allow-occlusion></div>
          <div
            class="cvr-curtain cvr-curtain-right"
            id="cvr-curtain-right"
            data-layout-allow-occlusion
          ></div>

          <div class="cvr-pelmet" id="cvr-pelmet"></div>
        </div>

        <script>
          /* hostSlot: the whole-scene clip follows the host slot (komp-sobrat.py klip_hozyaina; caret-swap:219) */
          (function () {
            var c = document.getElementById("curtain-reveal-clip");
            var h = c && c.parentElement && c.parentElement.closest("[data-duration]");
            if (h) c.dataset.duration = h.dataset.duration;
          })();
        </script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var stage = document.getElementById("cvr-stage");
            var spotlight = document.getElementById("cvr-spotlight");
            var curtainLeft = document.getElementById("cvr-curtain-left");
            var curtainRight = document.getElementById("cvr-curtain-right");
            var pelmet = document.getElementById("cvr-pelmet");

            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            // fold: [dark, mid, light, sheen] – one graphite velvet in the reel palette.
            var palette = {
              fold: [
                "var(--bg, #0c1014)",
                "var(--surface, #18181a)",
                "var(--border, #2e2e32)",
                "var(--muted, #8a8a90)",
              ],
              pelmet: "var(--brand, #ff0000)",
            };
            root.style.setProperty("--cvr-fold-dark", palette.fold[0]);
            root.style.setProperty("--cvr-fold-mid", palette.fold[1]);
            root.style.setProperty("--cvr-fold-light", palette.fold[2]);
            root.style.setProperty("--cvr-fold-sheen", palette.fold[3]);
            root.style.setProperty("--cvr-pelmet-color", palette.pelmet);

            var pelmetOn = vars.pelmet !== "off";
            var spotlightOn = vars.spotlight !== "off";
            pelmet.style.display = pelmetOn ? "" : "none";

            // Slot. Caller templates live at the host document level (the
            // mount wipes host-clip children, and templates never render).
            var hostDoc = root.ownerDocument;
            var slotTemplate = null;
            try {
              slotTemplate = hostDoc.querySelector('template[data-slot="curtain-reveal-stage"]');
            } catch (error) {
              slotTemplate = null;
            }
            if (slotTemplate) {
              var defaultMark = stage.querySelector(".cvr-stage-default");
              if (defaultMark) defaultMark.remove();
              stage.appendChild(hostDoc.importNode(slotTemplate.content, true));
            }

            // Closed-form scalloped hem: a fixed point count sampled from a
            // sine wave, never randomised, so the trim is identical on every
            // render of every instance.
            function hemPolygon(scallops, ampPct, baseY) {
              var STEPS = 24;
              var pts = ["0% 0%", "100% 0%"];
              for (var i = 0; i <= STEPS; i += 1) {
                var t = i / STEPS;
                var y = baseY + Math.sin(t * Math.PI * scallops) * ampPct;
                pts.push((100 - t * 100).toFixed(2) + "% " + y.toFixed(2) + "%");
              }
              return "polygon(" + pts.join(", ") + ")";
            }

            root.style.setProperty("--cvr-pelmet-hem", hemPolygon(5, 14, 78));

            // Fold widths in px at 1920 wide, outer edge first. Both sum to
            // 1075 px: from 5cqw off frame to just past center.
            var PX = 100 / 1920;
            function buildCurtain(el, dir, widths) {
              var total = 0;
              var folds = widths.map(function (w, i) {
                var fold = document.createElement("div");
                fold.className = "cvr-fold";
                // Slight overlap hides seams between neighbouring folds.
                fold.style.width = w * PX + 0.2 + "cqw";
                fold.style.setProperty("--crest", 44 + ((i * 5) % 13) + "%");
                el.appendChild(fold);
                total += w;
                return { el: fold, w: w * PX, u: i / (widths.length - 1) };
              });
              return { folds: folds, dir: dir, anchor: 51 - total * PX };
            }
            var curtains = [
              buildCurtain(curtainLeft, 1, [88, 124, 70, 106, 136, 80, 112, 62, 98, 130, 69]),
              buildCurtain(curtainRight, -1, [104, 66, 128, 84, 120, 62, 100, 134, 76, 112, 89]),
            ];

            // p = eased draw progress. Folds nearer the outer edge compress
            // harder, and the hem sweeps up toward the lead edge.
            function poseCurtains(p) {
              curtains.forEach(function (c) {
                var x = c.anchor;
                c.folds.forEach(function (f) {
                  var sx = 1 - p * (0.86 - 0.16 * f.u);
                  var sy = 1 - p * 0.07 * f.u * f.u;
                  f.el.style.transform =
                    "translateX(" +
                    (c.dir * x).toFixed(3) +
                    "cqw) scale(" +
                    sx.toFixed(4) +
                    ", " +
                    sy.toFixed(4) +
                    ")";
                  f.el.style.setProperty("--shade", (0.34 * (1 - sx)).toFixed(3));
                  x += f.w * sx;
                });
              });
            }

            // Envelope: fixed IN, elastic HOLD, never time-scaled.
            var IN_BASE = 1.1;
            var duration = Math.max(
              0.001,
              parseFloat(
                ((root.parentElement && root.parentElement.closest("[data-duration]")) || root)
                  .dataset.duration || "2.4",
              ),
            );
            var IN = Math.min(IN_BASE, duration);

            gsap.set(spotlight, { opacity: 0 });

            // Seek-safe driver: GSAP assigns `p` on every render, seek()
            // included, so the setter re-poses the folds; onUpdate is
            // suppressed on seek.
            var drawn = 0;
            var draw = {};
            Object.defineProperty(draw, "p", {
              get: function () {
                return drawn;
              },
              set: function (next) {
                drawn = next;
                poseCurtains(next);
              },
            });
            poseCurtains(0);

            var tl = gsap.timeline({ paused: true });
            tl.fromTo(draw, { p: 0 }, { p: 1, duration: IN, ease: "power2.inOut" }, 0);
            if (spotlightOn) {
              // Clamped to end by IN: uncapped, start (IN * 0.25) + duration
              // (IN * 0.85) lands at IN * 1.10 -- fine while the hold covers
              // it, but a short composition that compresses the hold away
              // would push GSAP's auto-extended timeline past data-duration.
              var spotlightStart = IN * 0.25;
              var spotlightDuration = Math.min(IN * 0.85, IN - spotlightStart);
              tl.fromTo(
                spotlight,
                { opacity: 0 },
                { opacity: 0.9, duration: spotlightDuration, ease: "power1.out" },
                spotlightStart,
              );
            }
            tl.set({}, {}, duration);
            tl.seek(0);

            window.__timelines = window.__timelines || {};
            window.__timelines["curtain-reveal"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
