<!--
  Line-by-Line Slide - typography primitive for HyperFrames.

  Paste the markup and CSS into a composition. Drive the timeline integration
  from a paused GSAP timeline so renders remain deterministic.

  Variables. The script reads each one, falls back to the declared default on
  anything missing or unrecognised, and writes a custom property the CSS above
  consumes. The timeline recipe below is untouched by them: it keeps driving
  one sideways offset, and direction decides which way that offset points.

    - size (compact | standard | display, default standard): type size of the
      stack, 40px, 52px, or 68px.
    - tone (ink | paper | accent, default paper: the reels are dark): line colour. ink is near-black
      for light frames, paper near-white for dark ones, accent rides the
      brand token.
    - density (fine | standard | coarse, default standard): the gap between
      lines, 4px, 10px, or 20px.
    - direction (left | right, default left): which side the lines slide in
      from. left keeps the original entry, right mirrors it.

  On every default the result is identical to the original: near-black 52px
  lines, 10px apart, entering from the left.
-->

<div
  class="hf-catalog-line-by-line-slide"
  data-composition-variables='[
    {"id": "size", "type": "enum", "role": "layout", "label": "Size", "description": "Type size of the whole stack.", "default": "standard", "options": [{"value": "compact", "label": "Compact"}, {"value": "standard", "label": "Standard"}, {"value": "display", "label": "Display"}]},
    {"id": "tone", "type": "enum", "role": "style", "label": "Tone", "description": "Line colour: ink for light frames, paper for dark ones, accent rides the brand token.", "default": "paper", "options": [{"value": "ink", "label": "Ink"}, {"value": "paper", "label": "Paper"}, {"value": "accent", "label": "Accent"}]},
    {"id": "density", "type": "enum", "role": "layout", "label": "Density", "description": "The gap between lines, from a tight block to an airy stack.", "default": "standard", "options": [{"value": "fine", "label": "Fine"}, {"value": "standard", "label": "Standard"}, {"value": "coarse", "label": "Coarse"}]},
    {"id": "direction", "type": "enum", "role": "motion", "label": "Direction", "description": "Which side the lines slide in from as the timeline drives the offset.", "default": "left", "options": [{"value": "left", "label": "Left"}, {"value": "right", "label": "Right"}]}
  ]'
>
  <span>Снимай быстрее</span><span>Монтируй с ИИ</span><span>Выкладывай чаще</span>
</div>

<style>
  @font-face {
    font-family: "Bebas Neue";
    src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
    font-weight: 700;
    font-display: block;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
    unicode-range:
      U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329,
      U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
    unicode-range:
      U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329,
      U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F,
      U+A720-A7FF;
  }
  .hf-catalog-line-by-line-slide {
    color: var(--hf-line-color, var(--fg, #f2f2f2));
    font-family: "Montserrat", system-ui, sans-serif;
    font-weight: 900;
    letter-spacing: -0.04em;
  }
  .hf-catalog-line-by-line-slide {
    display: grid;
    gap: var(--hf-line-gap, 10px);
    font-size: var(--hf-line-size, 52px);
    line-height: 1;
    overflow: hidden;
  }
  .hf-catalog-line-by-line-slide span {
    display: block;
    transform: translate(
      calc(var(--hf-line-x, 0px) * var(--hf-line-axis-x, 1)),
      var(--hf-line-y, 0px)
    );
    filter: blur(var(--hf-line-blur, 0px));
    will-change: transform, filter, opacity;
  }
</style>

<script>
  (function () {
    "use strict";

    var vars =
      window.__hyperframes && window.__hyperframes.getVariables
        ? window.__hyperframes.getVariables()
        : {};

    // Unrecognised overrides return to their declared defaults.
    function pick(table, value, fallback) {
      return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
    }

    var sizes = { compact: "40px", standard: "52px", display: "68px" };
    var tones = {
      ink: "var(--bg, #0c1014)",
      paper: "var(--fg, #f2f2f2)",
      accent: "var(--brand, #ff0000)",
    };
    var gaps = { fine: "4px", standard: "10px", coarse: "20px" };
    var axes = { left: 1, right: -1 };

    var size = sizes[pick(sizes, vars.size, "standard")];
    var tone = tones[pick(tones, vars.tone, "paper")];
    var gap = gaps[pick(gaps, vars.density, "standard")];
    var axis = axes[pick(axes, vars.direction, "left")];

    var roots = document.querySelectorAll(".hf-catalog-line-by-line-slide");
    for (var i = 0; i < roots.length; i += 1) {
      var root = roots[i];
      root.style.setProperty("--hf-line-size", size);
      root.style.setProperty("--hf-line-color", tone);
      root.style.setProperty("--hf-line-gap", gap);
      root.style.setProperty("--hf-line-axis-x", String(axis));
    }
  })();
</script>

<!--
  Timeline integration:
  tl.fromTo('.hf-catalog-line-by-line-slide span', { opacity: 0, '--hf-line-x': '-36px', '--hf-line-y': '18px', '--hf-line-blur': '6px' }, { opacity: 1, '--hf-line-x': '0px', '--hf-line-y': '0px', '--hf-line-blur': '0px', duration: 0.34, stagger: 0.08, ease: 'power3.out' }, startTime);
-->
