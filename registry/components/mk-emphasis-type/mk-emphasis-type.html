<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    { "id": "word", "type": "string", "role": "content", "label": "Word", "description": "The one word the beat is about, shown huge and faint behind the subject as background texture; fitted to the host width, up to 14 letters.", "default": "Монтаж", "maxLength": 14 }
  ]'
>
  <head>
    <meta charset="utf-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
          U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range:
          U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329,
          U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113,
          U+2C60-2C7F, U+A720-A7FF;
      }
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: transparent;
        overflow: hidden;
      }
      /* ---- mk-emphasis-type ------------------------------------------------
         Oversized low-contrast background word sliding slowly behind the
         subject (the promo's "EMPHASIS" texture type). Decorative only —
         keep it behind real content and mark it aria-hidden. */
      .mk-emphasis {
        --mk-font: var(--font-display, "Bebas Neue", sans-serif);
        --mk-emph-color: color-mix(
          in srgb,
          var(--fg, #f2f2f2) 8%,
          transparent
        ); /* the reels are dark */

        position: absolute;
        font-family: var(--mk-font);
        font-weight: 600;
        font-size: 260px;
        letter-spacing: 0;
        line-height: 1;
        white-space: nowrap;
        text-transform: uppercase;
        color: var(--mk-emph-color);
        pointer-events: none;
      }
      /* the unit: the word fills the host box, which gives place and size */
      #mk-emph-root {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <!-- Two ways in.
         WHOLE: mount by the data-composition-src line on a host that sets place
         and size in style (usually the full frame behind the subject); variable
         `word`. The word is fitted to the host width and centred, fades in at
         0.3 s, drifts left, and fades out over the host clip's last 0.6 s.
         WIRING (your own element): copy the .mk-emphasis CSS and the
         mkEmphasisIn / mkEmphasisOut helpers from this file, add the word
         behind the subject (the attributes stay: a 260px word is decoration,
         usually wider than the canvas; place it with top/left):
           <div class="mk-emphasis" id="mk-my-word" aria-hidden="true" data-layout-allow-overflow data-layout-ignore style="top: 800px; left: 60px">Монтаж</div>
         then:
           mkEmphasisIn(tl, "#mk-my-word", 1.0, { drift: -120, hold: 6 });
           mkEmphasisOut(tl, "#mk-my-word", 7.5); -->
    <div id="mk-emph-root" data-composition-id="mk-emphasis-type" data-start="0" data-duration="4">
      <div
        class="mk-emphasis"
        id="mk-emph-demo"
        aria-hidden="true"
        data-layout-allow-overflow
        data-layout-ignore
      ></div>
      <div
        id="mk-emph-drv"
        class="clip"
        data-start="0"
        data-duration="4"
        data-track-index="0"
        style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none"
      ></div>
    </div>
    <script>
      /* hostSlot: the whole-scene clip follows the host slot (komp-sobrat.py klip_hozyaina; caret-swap:219) */
      (function () {
        var c = document.getElementById("mk-emph-drv");
        var h = c && c.parentElement && c.parentElement.closest("[data-duration]");
        if (h) c.dataset.duration = h.dataset.duration;
      })();
    </script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};

        // ---- copy these helpers into the host script, then:
        //   mkEmphasisIn(tl, "#mk-my-word", 1.0, { drift: -120, hold: 6 });
        //   mkEmphasisOut(tl, "#mk-my-word", 7.5);
        window.mkEmphasisIn = function (tl, target, at, opts) {
          opts = opts || {};
          var drift = opts.drift === undefined ? -100 : opts.drift;
          var hold = opts.hold === undefined ? 5 : opts.hold;
          gsap.set(target, { opacity: 0, x: 40 });
          tl.to(target, { opacity: 1, duration: 1.0, ease: "power2.out" }, at);
          tl.to(target, { x: 40 + drift, duration: hold, ease: "sine.inOut" }, at);
        };
        window.mkEmphasisOut = function (tl, target, at) {
          tl.to(target, { opacity: 0, duration: 0.5, ease: "power2.in" }, at);
        };

        // ---- the unit (not part of the snippet you copy) ----
        var root = document.getElementById("mk-emph-root");
        var el = document.getElementById("mk-emph-demo");
        var vars =
          window.__hyperframes && window.__hyperframes.getVariables
            ? window.__hyperframes.getVariables()
            : {};
        var word =
          typeof vars.word === "string" && vars.word.trim() !== "" ? vars.word.trim() : "Монтаж";
        el.textContent = word;
        // length from the host clip: the runtime strips data-duration from a mounted root (flattenedRoot.ts:8-19)
        var D = parseFloat(
          ((root.parentElement && root.parentElement.closest("[data-duration]")) || root).dataset
            .duration || "4",
        );
        // fonts first (format.md:151): the word is sized from its measured width
        window.__hf = window.__hf || {};
        window.__hf.buildReady = window.__hf.buildReady || {};
        window.__hf.buildReady["mk-emphasis-type"] = document.fonts
          .load('700 100px "Bebas Neue"', word)
          .then(function () {
            var W = root.clientWidth;
            var H = root.clientHeight;
            var fit = window.__hyperframes.fitTextFontSize(word.toUpperCase(), {
              fontFamily: "Bebas Neue",
              fontWeight: 700,
              maxWidth: W * 0.8,
              baseFontSize: 260,
              minFontSize: 28,
              step: 1,
            });
            el.style.fontSize = fit.fontSize + "px";
            // centred; the drift runs from +40 to -60 px, inside the 10% margins
            el.style.left = (W - el.offsetWidth) / 2 + "px";
            el.style.top = (H - el.offsetHeight) / 2 + "px";
            var out = Math.max(1.4, D - 0.6);
            var tl = gsap.timeline({ paused: true });
            window.mkEmphasisIn(tl, el, 0.3, { drift: -100, hold: out - 0.3 });
            window.mkEmphasisOut(tl, el, out);
            tl.set({}, {}, D);
            window.__timelines["mk-emphasis-type"] = tl;
          });
      })();
    </script>
  </body>
</html>
