<!--
  Badge Pop - transitions.dev-inspired primitive for HyperFrames.

  Paste the markup, CSS and script into a composition. Use the timeline
  integration note at the bottom as the starting point for deterministic GSAP
  animation.

  Variables. The script reads each one, falls back to the declared default on
  anything missing or unrecognised, and writes the result as a custom property
  the CSS below consumes, or as the badge text. The timeline recipe at the
  bottom is untouched by them: it keeps popping the same badge, whatever the
  badge says and however it is coloured.

    - count (any text up to four characters, default "3"): what the badge
      reads. Use it to say 1, 12, 99+ or NEW.
    - colour: the brand palette of the reel (badge --brand, tile --surface).
  On every default: a dark bell tile with a brand-red 3 badge, sized for the
  780 px graphics field of a vertical reel.
-->

<div
  class="hf-transition-badge-pop"
  data-composition-variables='[
    { "id": "count", "type": "string", "role": "style", "label": "Count", "description": "Text shown inside the notification badge, up to four characters.", "default": "3", "maxLength": 4 }
  ]'
>
  <button class="hf-transition-badge-button" type="button" aria-label="Notifications">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M18 8a6 6 0 10-12 0c0 7-3 7-3 7h18s-3 0-3-7" />
      <path d="M10 20a2 2 0 004 0" />
    </svg>
  </button>
  <span class="hf-transition-badge-count">3</span>
</div>

<style>
  @font-face {
    font-family: "Bebas Neue";
    src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
    font-weight: 700;
    font-display: block;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
    unicode-range:
      U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329,
      U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
    unicode-range:
      U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329,
      U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F,
      U+A720-A7FF;
  }
  /* Vertical reel: sized for the 780 px graphics field (count 30 px), brand palette:
     the bell tile is the brand card, the badge brand red with a light count. */
  .hf-transition-badge-pop {
    --hf-badge-pop-accent: var(--brand, #ff0000);
    --hf-badge-pop-surface: var(--surface, #18181a);
    --hf-badge-pop-border: var(--border, #2e2e32);
    --hf-badge-pop-ink: var(--fg, #f2f2f2);
    position: relative;
    display: inline-grid;
    place-items: center;
    font-family: "Montserrat", system-ui, sans-serif;
  }
  .hf-transition-badge-button {
    display: grid;
    place-items: center;
    width: 160px;
    height: 160px;
    border: 2px solid var(--hf-badge-pop-border);
    border-radius: 44px;
    background: var(--hf-badge-pop-surface);
    color: var(--hf-badge-pop-ink);
    box-shadow: 0 20px 58px rgba(0, 0, 0, 0.35);
  }
  .hf-transition-badge-button svg {
    width: 64px;
    height: 64px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .hf-transition-badge-count {
    position: absolute;
    right: -16px;
    top: -16px;
    display: grid;
    place-items: center;
    min-width: 60px;
    height: 60px;
    padding: 0 14px;
    border: 5px solid var(--bg, #0c1014);
    border-radius: 999px;
    background: var(--hf-badge-pop-accent);
    color: var(--fg, #f2f2f2);
    font-size: 30px;
    font-weight: 800;
    transform-origin: center;
  }
</style>

<script>
  (function () {
    "use strict";

    var vars =
      window.__hyperframes && window.__hyperframes.getVariables
        ? window.__hyperframes.getVariables()
        : {};

    // Unrecognised overrides return to their declared defaults.
    function pick(table, value, fallback) {
      return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
    }

    // One palette: the reel's brand tokens (set in the CSS above).
    var accent = "var(--brand, #ff0000)";
    var surface = {
      surface: "var(--surface, #18181a)",
      border: "var(--border, #2e2e32)",
      ink: "var(--fg, #f2f2f2)",
    };
    var count =
      typeof vars.count === "string" && vars.count.trim() ? vars.count.trim().slice(0, 4) : "3";

    var roots = document.querySelectorAll(".hf-transition-badge-pop");
    for (var i = 0; i < roots.length; i += 1) {
      var root = roots[i];
      root.style.setProperty("--hf-badge-pop-accent", accent);
      root.style.setProperty("--hf-badge-pop-surface", surface.surface);
      root.style.setProperty("--hf-badge-pop-border", surface.border);
      root.style.setProperty("--hf-badge-pop-ink", surface.ink);
      var label = root.querySelector(".hf-transition-badge-count");
      if (label) {
        label.textContent = count;
      }
    }
  })();
</script>

<!--
  Timeline integration: built in, see the script below. It registers its own paused timeline as
  window.__timelines["badge-pop"]; mount the snippet inside a clip with data-composition-id="badge-pop"
  and the runtime nests it at that clip's start.
-->

<script>
  /* own timeline (component-quality-bar.md X1): the host clip carries data-composition-id="badge-pop" */
  (function () {
    var startTime = 0;
    var tl = gsap.timeline({ paused: true });
    tl.fromTo(
      ".hf-transition-badge-button",
      { y: 18, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.34, ease: "power2.out" },
      0.35,
    );
    tl.fromTo(
      ".hf-transition-badge-count",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.42, ease: "back.out(2.4)" },
      0.7,
    );
    tl.to(
      ".hf-transition-badge-count",
      { scale: 1.18, duration: 0.12, yoyo: true, repeat: 1, ease: "power1.inOut" },
      1.15,
    );
    window.__timelines = window.__timelines || {};
    window.__timelines["badge-pop"] = tl;
  })();
</script>
