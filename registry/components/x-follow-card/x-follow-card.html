  X Follow Card - catalog component for HyperFrames.

  Paste the markup and CSS into a composition. Drive the timeline integration
  from a paused GSAP timeline so renders remain deterministic.
-->

    <div>

  <div class="stat">30 600</div>
  <div class="avatars">

</div>

<!--
  Timeline integration: built in, see the script below. It registers its own paused timeline as
  window.__timelines["x-follow-card"]; mount the snippet inside a clip with data-composition-id="x-follow-card"
  and the runtime nests it at that clip's start.
-->

<script>
  /* own timeline (component-quality-bar.md X1): the host clip carries data-composition-id="x-follow-card" */
  (function () {
    var startTime = 0;
    var tl = gsap.timeline({ paused: true });
    tl.fromTo(
      ".hf-catalog-x-follow-card .stat",
      { "--hf-stat-y": "28px", opacity: 0 },
      { "--hf-stat-y": "0px", opacity: 1, duration: 0.46, ease: "back.out(1.6)" },
      startTime,
    );
    tl.fromTo(
      ".hf-catalog-x-follow-card .avatars span",
      { "--hf-avatar-y": "18px", "--hf-avatar-opacity": 0 },
      {
        "--hf-avatar-y": "0px",
        "--hf-avatar-opacity": 1,
        duration: 0.28,
        stagger: 0.05,
        ease: "power2.out",
      },
      startTime + 0.22,
    );
    window.__timelines = window.__timelines || {};
    window.__timelines["x-follow-card"] = tl;
  })();
</script>
