<!--
  Skeleton Reveal - transitions.dev-inspired primitive for HyperFrames.

  Paste the markup and CSS into a composition. Use the timeline integration
  note at the bottom as the starting point for deterministic GSAP animation.

  Variables. The script reads each one, falls back to the declared default on
  anything missing or invalid, and writes the result as a custom property the
  CSS below consumes, or straight onto the revealed text. The timeline recipe
  stays untouched: it keeps sweeping the skeleton and cross-fading to the
  content, and these decide what that content says and what both halves look
  like.

    - name (string, default Анна Смирнова): the primary line revealed once the
      skeleton fades out. Blank falls back to the default.
    - detail (string, default anna@studio.ru): the secondary line under the
      name, such as an email or a role. Blank falls back to the default.
  On every default: a dark brand card that shimmers, then reveals the name and the
  detail. One palette, the reel's. Sized for the 780 px graphics field of a vertical reel.
-->

<div
  class="hf-transition-skeleton-reveal"
  data-composition-variables='[
    {"id": "name", "type": "string", "role": "content", "label": "Name", "description": "Primary line revealed once the skeleton fades out.", "default": "Анна Смирнова", "maxLength": 16},
    {"id": "detail", "type": "string", "role": "content", "label": "Detail", "description": "Secondary line under the name, such as an email or a role.", "default": "anna@studio.ru", "maxLength": 28}
  ]'
>
  <div class="skeleton"></div>
  <div class="content"><strong>Анна Смирнова</strong><span>anna@studio.ru</span></div>
</div>

<style>
  @font-face {
    font-family: "Bebas Neue";
    src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
    font-weight: 700;
    font-display: block;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
    unicode-range:
      U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329,
      U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
    unicode-range:
      U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329,
      U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F,
      U+A720-A7FF;
  }
  /* Vertical reel: sized for the 780 px graphics field (text 28 px and up), one palette: the reel's
     brand tokens (card, nested plate shimmer, light name, muted detail). */
  .hf-transition-skeleton-reveal {
    position: relative;
    width: 640px;
    max-width: 100%;
    min-height: 150px;
    font-family: "Montserrat", system-ui, sans-serif;
  }
  .hf-transition-skeleton-reveal .skeleton,
  .hf-transition-skeleton-reveal .content {
    position: absolute;
    inset: 0;
    border: 2px solid var(--hf-sr-border, var(--border, #2e2e32));
    border-radius: 28px;
    background: var(--hf-sr-surface, var(--surface, #18181a));
  }
  .hf-transition-skeleton-reveal .skeleton {
    background: linear-gradient(
      90deg,
      var(--hf-sr-bar, color-mix(in srgb, var(--fg, #f2f2f2) 6%, var(--surface, #18181a))),
      var(--hf-sr-bar-strong, color-mix(in srgb, var(--fg, #f2f2f2) 16%, var(--surface, #18181a))),
      var(--hf-sr-bar, color-mix(in srgb, var(--fg, #f2f2f2) 6%, var(--surface, #18181a)))
    );
    background-size: 240% 100%;
    opacity: 1;
  }
  .hf-transition-skeleton-reveal .content {
    display: grid;
    align-content: center;
    gap: 8px;
    padding: 24px 32px;
    opacity: 0;
    color: var(--hf-sr-ink, var(--fg, #f2f2f2));
  }
  .hf-transition-skeleton-reveal strong {
    font-size: 34px;
    line-height: 1.15;
  }
  .hf-transition-skeleton-reveal span {
    color: var(--hf-sr-muted, var(--muted, #8a8a90));
    font-size: 28px;
    line-height: 1.2;
  }
</style>

<script>
  (function () {
    "use strict";

    var vars =
      window.__hyperframes && window.__hyperframes.getVariables
        ? window.__hyperframes.getVariables()
        : {};

    // Unrecognised overrides return to their declared defaults.
    var defaultName = "Анна Смирнова";
    var defaultDetail = "anna@studio.ru";

    function pick(table, value, fallback) {
      return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
    }

    function text(value, fallback) {
      return typeof value === "string" && value.trim() ? value.trim() : fallback;
    }

    var tone = null; // one palette: the reel brand tokens in the CSS
    var name = text(vars.name, defaultName);
    var detail = text(vars.detail, defaultDetail);

    var roots = document.querySelectorAll(".hf-transition-skeleton-reveal");
    for (var i = 0; i < roots.length; i += 1) {
      var root = roots[i];
      if (tone) {
        for (var key in tone) root.style.setProperty(key, tone[key]);
      }
      var strong = root.querySelector(".content strong");
      var span = root.querySelector(".content span");
      if (strong) strong.textContent = name;
      if (span) span.textContent = detail;
    }
  })();
</script>

<!--
  Timeline integration: built in, see the script below. It registers its own paused timeline as
  window.__timelines["skeleton-reveal"]; mount the snippet inside a clip with data-composition-id="skeleton-reveal"
  and the runtime nests it at that clip's start.
-->

<script>
  /* own timeline (component-quality-bar.md X1): the host clip carries data-composition-id="skeleton-reveal" */
  (function () {
    var startTime = 0;
    var tl = gsap.timeline({ paused: true });
    tl.to(
      ".hf-transition-skeleton-reveal .skeleton",
      { backgroundPosition: "100% 0", duration: 0.7, ease: "none" },
      startTime,
    );
    tl.to(
      ".hf-transition-skeleton-reveal .skeleton",
      { opacity: 0, duration: 0.22 },
      startTime + 0.72,
    );
    tl.to(
      ".hf-transition-skeleton-reveal .content",
      { opacity: 1, duration: 0.24 },
      startTime + 0.78,
    );
    window.__timelines = window.__timelines || {};
    window.__timelines["skeleton-reveal"] = tl;
  })();
</script>
