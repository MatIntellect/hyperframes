<!--
  Blur In - Operator Black content-focus reveal primitive.

  Paste the markup, CSS and script into a composition. Use the timeline
  integration note at the bottom as the starting point for deterministic GSAP
  animation.

  Variables. The script reads each one, falls back to the declared default on
  anything missing or unrecognised, and writes the result as a custom property
  the CSS below consumes. The timeline recipe at the bottom is untouched by
  them: it keeps resolving the same words out of the same blur.

    - size (28 to 120, default 52, in px): the type size of the words. The gap
      between words is set in em, so it scales with this.
    - tone (strong | muted | accent, default strong): word colour. strong is
      the headline text token, muted the supporting one, accent the brand
      red, so all three track light and dark frames.
    - align (left | center | right, default center): where the words sit across
      the frame.

  On every default the result is identical to the original: 52px strong words,
  centred.
-->

  data-hf-ui-root

  aria-label="Монтаж с ИИ за минуту"

    { "id": "size", "type": "number", "role": "style", "label": "Size", "description": "Type size of the revealed words in pixels; the gap between words scales with it.", "default": 52, "min": 28, "max": 120, "step": 2, "unit": "px" },

  ]'
>

<script>
  (function () {
    "use strict";

    var vars =
      window.__hyperframes && window.__hyperframes.getVariables
        ? window.__hyperframes.getVariables()
        : {};

    // Unrecognised overrides return to their declared defaults.
    function pick(table, value, fallback) {
      return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
    }

    function clampNumber(value, min, max, fallback) {
      var n = typeof value === "number" ? value : parseFloat(value);
      if (!isFinite(n)) {
        return fallback;
      }
      return Math.min(max, Math.max(min, n));
    }

    var tones = {
      strong: "var(--_hf-ui-text-strong)",
      muted: "var(--_hf-ui-text-muted)",
      accent: "var(--brand, #ff0000)", // the brand red, not the interface green
    };
    var aligns = { left: "flex-start", center: "center", right: "flex-end" };

    var size = clampNumber(vars.size, 28, 120, 52); // 28 px floor (vertical.md:18)
    var tone = tones[pick(tones, vars.tone, "strong")];
    var align = aligns[pick(aligns, vars.align, "center")];

    var roots = document.querySelectorAll(".hf-ui-blur-in");
    for (var i = 0; i < roots.length; i += 1) {
      roots[i].style.setProperty("--hf-blur-in-size", size + "px");
      roots[i].style.setProperty("--hf-blur-in-color", tone);
      roots[i].style.setProperty("--hf-blur-in-align", align);

<!--
  Timeline integration: built in, see the script below. It registers its own paused timeline as

-->

<script>
  /* own timeline (component-quality-bar.md X1): the host clip carries data-composition-id="blur-in" */
  (function () {
    var startTime = 0;
    var tl = gsap.timeline({ paused: true });
    tl.fromTo(
      ".hf-ui-blur-in span",
      { opacity: 0, y: 8, filter: "blur(10px)" },
      { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.36, stagger: 0.04, ease: "power3.out" },
      startTime,
    );
    window.__timelines = window.__timelines || {};
    window.__timelines["blur-in"] = tl;
  })();
</script>
