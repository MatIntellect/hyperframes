<!doctype html>
<!--
  decline-chart: HyperFrames video primitive

  One metric line draws downward while its numeric value counts down and the
  ambient background dims and desaturates from the same progress value.

  Envelope:
    IN_BASE  = 0.55s  chart frame settles into view
    HOLD     = elastic decline draw, countdown, and ambient darkening
    OUT_BASE = 0.45s  bottomed-out endpoint locks in with no recovery
    If D is shorter than IN_BASE + OUT_BASE, IN and OUT compress together
    and HOLD collapses to zero. Longer mounts stretch HOLD only.

  Variables:
    label       (string, default "Удержание")
    start_value (number, default 82)
    end_value   (number, default 34)
-->
<html
  lang="ru"
  data-composition-id="decline-chart"
  data-composition-duration="4"
  data-composition-variables='[
    { "id": "label", "type": "string", "role": "content", "label": "Metric label", "description": "Label shown above the declining value.", "default": "Удержание", "maxLength": 16 },
    { "id": "start_value", "type": "number", "role": "content", "label": "Start value", "description": "Metric value at the start of the decline.", "default": 82, "min": 0, "max": 100, "step": 1 },
    { "id": "end_value", "type": "number", "role": "content", "label": "End value", "description": "Metric value at the bottom of the decline.", "default": 34, "min": 0, "max": 100, "step": 1 }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Decline Chart</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="decline-chart" data-duration="4" data-fps="30">
        <style>
          @font-face {
            font-family: "Bebas Neue";
            src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
            font-weight: 700;
            font-display: block;
          }
          @font-face {
            font-family: "Montserrat";
            src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
            font-weight: 100 900;
            font-display: block;
            unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
          }
          @font-face {
            font-family: "Montserrat";
            src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
            font-weight: 100 900;
            font-display: block;
            unicode-range:
              U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
              U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
          }
          @font-face {
            font-family: "Montserrat";
            src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
            font-weight: 100 900;
            font-display: block;
            unicode-range:
              U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308,
              U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4,
              U+2113, U+2C60-2C7F, U+A720-A7FF;
          }
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            container-type: size;
            isolation: isolate;
            color: var(--fg, #f2f2f2);
            font-family: var(--font-body, "Montserrat", sans-serif);
            pointer-events: none;
          }

          .dc-clip,
          .dc-ambient,
          .dc-gloom {
            position: absolute;
            inset: 0;
          }

          .dc-clip {
            overflow: hidden;
          }

          .dc-ambient {
            background:
              radial-gradient(
                circle at 24% 16%,
                color-mix(in srgb, var(--brand, #ff0000) 32%, transparent),
                transparent 46%
              ),
              linear-gradient(145deg, var(--surface, #18181a) 0%, var(--bg, #0c1014) 100%);
            transform: scale(1.02);
            transform-origin: center;
            will-change: filter;
          }

          .dc-gloom {
            background: var(--plate, #000);
            opacity: 0;
          }

          .dc-layout {
            position: absolute;
            inset: 9cqh 9cqw 8cqh;
            display: grid;
            /* minmax(0, 1fr): a bare 1fr row inflates to the svg's intrinsic
               aspect height (min-height auto), overflowing the card. */
            grid-template-rows: auto minmax(0, 1fr);
            gap: 5cqh;
            opacity: 0;
          }

          .dc-header {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 5cqw;
          }

          .dc-label {
            max-width: 58cqw;
            /* a long label wraps instead of being cut with an ellipsis (clipped_text on a 780 px field) */
            color: var(--muted, #8a8a90);
            font-size: clamp(28px, 3.6cqh, 38px);
            font-weight: 620;
            letter-spacing: 0.05em;
            line-height: 1.1;
            text-transform: uppercase;
            text-wrap: balance;
          }

          .dc-value {
            flex: 0 0 auto;
            color: var(--fg, #f2f2f2);
            font-family: var(
              --font-body,
              "Montserrat",
              sans-serif
            ); /* figures are Montserrat (Mat 11.11) */
            font-size: clamp(30px, 12cqh, 118px);
            font-variant-numeric: tabular-nums;
            font-weight: 760;
            letter-spacing: -0.03em;
            line-height: 0.8;
          }

          .dc-chart {
            width: 100%;
            height: 100%;
            overflow: visible;
          }

          .dc-grid {
            stroke: var(--border, #2e2e32);
            stroke-width: 1;
            vector-effect: non-scaling-stroke;
          }

          .dc-line {
            fill: none;
            stroke: var(--brand, #ff0000);
            stroke-linecap: round;
            stroke-linejoin: round;
            /* No non-scaling-stroke here: with preserveAspectRatio=none Chromium
               applies the dash pattern in screen space, so the user-space
               dasharray from getTotalLength() splits the draw into two visible
               segments. Scaled stroke keeps dashes in user space. */
            stroke-width: 4;
          }

          /* the end dot is an HTML circle over the plot: inside the stretched svg (preserveAspectRatio=none) a circle
             turns into an oval (second head 026: 28x40 on a 780 px field) */
          .dc-plot {
            position: relative;
            min-height: 0;
          }
          .dc-endpoint {
            position: absolute;
            left: calc(252 / 260 * 100%);
            top: calc(222 / 240 * 100%);
            width: 4cqmin;
            height: 4cqmin;
            margin: -2cqmin 0 0 -2cqmin;
            border-radius: 50%;
            background: var(--fg, #f2f2f2);
            opacity: 0;
          }
        </style>

        <div
          id="decline-chart-clip"
          class="dc-clip clip"
          data-start="0"
          data-duration="4"
          data-track-index="0"
        >
          <div class="dc-ambient"></div>
          <div class="dc-gloom"></div>
          <div class="dc-layout">
            <div class="dc-header">
              <div class="dc-label"></div>
              <div class="dc-value"></div>
            </div>
            <div class="dc-plot">
              <svg
                class="dc-chart"
                viewBox="0 0 260 240"
                preserveAspectRatio="none"
                aria-hidden="true"
              >
                <line class="dc-grid" x1="8" y1="55" x2="252" y2="55"></line>
                <line class="dc-grid" x1="8" y1="120" x2="252" y2="120"></line>
                <line class="dc-grid" x1="8" y1="185" x2="252" y2="185"></line>
                <path
                  class="dc-line"
                  d="M 8 24 C 28 28, 44 43, 61 56 S 93 76, 112 92 S 144 111, 163 134 S 193 159, 213 186 S 239 211, 252 222"
                ></path>
              </svg>
              <div class="dc-endpoint"></div>
            </div>
          </div>
        </div>

        <script>
          /* hostSlot: the whole-scene clip follows the host slot (komp-sobrat.py klip_hozyaina; caret-swap:219) */
          (function () {
            var c = document.getElementById("decline-chart-clip");
            var h = c && c.parentElement && c.parentElement.closest("[data-duration]");
            if (h) c.dataset.duration = h.dataset.duration;
          })();
        </script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var layout = root.querySelector(".dc-layout");
            var ambient = root.querySelector(".dc-ambient");
            var gloom = root.querySelector(".dc-gloom");
            var label = root.querySelector(".dc-label");
            var value = root.querySelector(".dc-value");
            var line = root.querySelector(".dc-line");
            var endpoint = root.querySelector(".dc-endpoint");
            var lineLength = line.getTotalLength();
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            line.style.strokeDasharray = lineLength + " " + lineLength;

            var startValue = Number.isFinite(vars.start_value) ? vars.start_value : 82;
            var endValue = Number.isFinite(vars.end_value) ? vars.end_value : 34;
            var labelText = vars.label == null ? "Удержание" : String(vars.label);

            label.textContent = labelText;

            var IN_BASE = 0.55;
            var OUT_BASE = 0.45;
            var duration = Math.max(
              0.001,
              parseFloat(
                ((root.parentElement && root.parentElement.closest("[data-duration]")) || root)
                  .dataset.duration || "4",
              ),
            );
            var fixedTotal = IN_BASE + OUT_BASE;
            var phaseScale = duration < fixedTotal ? duration / fixedTotal : 1;
            var IN = IN_BASE * phaseScale;
            var OUT = OUT_BASE * phaseScale;
            var HOLD = Math.max(0, duration - IN - OUT);
            var OUT_START = IN + HOLD;
            var progress = { value: 0 };

            function renderProgress() {
              var p = progress.value;
              line.style.strokeDashoffset = String(lineLength * (1 - p));
              ambient.style.filter =
                "saturate(" + (1 - p * 0.72) + ") brightness(" + (1 - p * 0.52) + ")";
              gloom.style.opacity = String(p * 0.46);
              endpoint.style.opacity = String(Math.max(0, (p - 0.94) / 0.06));
              value.textContent = String(Math.round(startValue + (endValue - startValue) * p));
            }

            renderProgress();

            var tl = gsap.timeline({ paused: true });
            tl.fromTo(
              layout,
              { opacity: 0, y: "2.5cqh" },
              { opacity: 1, y: 0, duration: IN, ease: "power2.out" },
              0,
            );

            if (HOLD > 0) {
              tl.to(
                progress,
                { value: 1, duration: HOLD, ease: "power2.out", onUpdate: renderProgress },
                IN,
              );
            } else {
              tl.call(
                function () {
                  progress.value = 1;
                  renderProgress();
                },
                [],
                IN,
              );
            }

            tl.fromTo(
              endpoint,
              { scale: 0.72 },
              { scale: 1, duration: OUT, ease: "power2.out" },
              OUT_START,
            );

            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["decline-chart"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
