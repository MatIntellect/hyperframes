<!--
  Input Feedback - transitions.dev-inspired primitive for HyperFrames.

  Paste the markup, CSS and script into a composition. Use the timeline
  integration note at the bottom as the starting point for deterministic GSAP
  animation.

  Variables. The script reads each one, falls back to the declared default on
  anything missing or unrecognised, and writes the text or state attribute the
  CSS below already keys off. The timeline recipe at the bottom is untouched
  by them: it keeps shaking the same shell and popping the same chip.

    - status (valid | error, default valid): whether the field reads as
      accepted or rejected. valid is a light border and chip with a plain hint; error
      turns all three brand red and swaps the chip glyph to an exclamation mark.
      Pair it with a matching hint.
    - value (string, default "anna@studio.ru"): the text held by the field.
      A blank or non-text override keeps the default.
    - hint (string, default "Всё верно"): the helper line under the field.

  On every default the result is identical to the original: a valid
  field holding anna@studio.ru over Всё верно
-->

<div
  class="hf-transition-input-feedback"
  data-state="valid"
  data-composition-variables='[
    { "id": "status", "type": "enum", "role": "style", "label": "Status", "description": "Whether the field reads as accepted or rejected, colouring the border, chip and hint.", "default": "valid", "options": [{ "value": "valid", "label": "Valid" }, { "value": "error", "label": "Error" }] },
    { "id": "value", "type": "string", "role": "content", "label": "Value", "description": "Text held by the field.", "default": "anna@studio.ru", "maxLength": 28 },
    { "id": "hint", "type": "string", "role": "content", "label": "Hint", "description": "Helper line under the field.", "default": "Всё верно", "maxLength": 28 }
  ]'
>
  <label>Почта</label>
  <div class="hf-transition-input-shell">
    <span class="hf-transition-input-value">anna@studio.ru</span>
    <button class="hf-transition-input-clear" type="button">×</button>
    <span class="hf-transition-input-check">ОК</span>
  </div>
  <p class="hf-transition-input-hint">Всё верно</p>
</div>

<style>
  @font-face {
    font-family: "Bebas Neue";
    src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
    font-weight: 700;
    font-display: block;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
    unicode-range:
      U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329,
      U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
    unicode-range:
      U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329,
      U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F,
      U+A720-A7FF;
  }
  /* Vertical reel: sized for the 780 px graphics field (text 28 px and up), brand palette tokens.
     One accent: error is brand red; valid is a neutral light chip with "ОК" (green is not in the palette). */
  .hf-transition-input-feedback {
    --hf-fb-border: var(--border, #2e2e32);
    --hf-fb-chip-bg: var(--fg, #f2f2f2);
    --hf-fb-chip-fg: var(--bg, #0c1014);
    --hf-fb-hint: var(--fg, #f2f2f2);
    display: grid;
    gap: 16px;
    width: 640px;
    max-width: 100%;
    color: var(--fg, #f2f2f2);
    font-family: "Montserrat", system-ui, sans-serif;
  }
  .hf-transition-input-feedback label {
    color: var(--muted, #8a8a90);
    font-size: 28px;
    font-weight: 700;
  }
  .hf-transition-input-shell {
    display: flex;
    align-items: center;
    gap: 16px;
    min-height: 96px;
    padding: 0 24px;
    border: 3px solid var(--hf-fb-border);
    border-radius: 24px;
    background: var(--surface, #18181a);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
  }
  .hf-transition-input-value {
    flex: 1;
    min-width: 0;
    font-size: 32px;
    font-weight: 700;
    overflow-wrap: anywhere;
  }
  .hf-transition-input-clear,
  .hf-transition-input-check {
    display: grid;
    flex: none;
    place-items: center;
    height: 52px;
    border-radius: 999px;
    font-family: inherit;
    font-size: 28px;
    font-weight: 800;
  }
  .hf-transition-input-clear {
    width: 52px;
    border: 0;
    background: color-mix(in srgb, var(--fg, #f2f2f2) 10%, var(--surface, #18181a));
    color: var(--muted, #8a8a90);
  }
  .hf-transition-input-check {
    min-width: 72px;
    padding: 0 14px;
    background: var(--hf-fb-chip-bg);
    color: var(--hf-fb-chip-fg);
  }
  .hf-transition-input-hint {
    margin: 0;
    color: var(--hf-fb-hint);
    font-size: 28px;
    font-weight: 700;
  }
  .hf-transition-input-feedback[data-state="valid"] {
    --hf-fb-border: color-mix(in srgb, var(--fg, #f2f2f2) 55%, var(--surface, #18181a));
  }
  .hf-transition-input-feedback[data-state="error"] {
    --hf-fb-border: var(--brand, #ff0000);
    --hf-fb-chip-bg: var(--brand, #ff0000);
    --hf-fb-chip-fg: var(--fg, #f2f2f2);
    --hf-fb-hint: var(--brand, #ff0000);
  }
</style>

<script>
  (function () {
    "use strict";

    var vars =
      window.__hyperframes && window.__hyperframes.getVariables
        ? window.__hyperframes.getVariables()
        : {};

    // Unrecognised overrides return to their declared defaults.
    function pick(table, value, fallback) {
      return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
    }

    function text(value, fallback) {
      return typeof value === "string" && value.trim() !== "" ? value : fallback;
    }

    var statuses = { valid: "ОК", error: "!" };

    var status = pick(statuses, vars.status, "valid");
    var value = text(vars.value, "anna@studio.ru");
    var hint = text(vars.hint, "Всё верно");

    var roots = document.querySelectorAll(".hf-transition-input-feedback");
    for (var i = 0; i < roots.length; i += 1) {
      var root = roots[i];
      root.setAttribute("data-state", status);
      var valueEl = root.querySelector(".hf-transition-input-value");
      if (valueEl) valueEl.textContent = value;
      var hintEl = root.querySelector(".hf-transition-input-hint");
      if (hintEl) hintEl.textContent = hint;
      var chip = root.querySelector(".hf-transition-input-check");
      if (chip) chip.textContent = statuses[status];
    }
  })();
</script>

<!--
  Timeline integration: built in, see the script below. It registers its own paused timeline as
  window.__timelines["input-feedback"]; mount the snippet inside a clip with data-composition-id="input-feedback"
  and the runtime nests it at that clip's start.
-->

<script>
  /* own timeline (component-quality-bar.md X1): the host clip carries data-composition-id="input-feedback" */
  (function () {
    var startTime = 0;
    var tl = gsap.timeline({ paused: true });
    tl.fromTo(
      ".hf-transition-input-feedback",
      { y: 22, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.34, ease: "power2.out" },
      0.3,
    );
    tl.to(
      ".hf-transition-input-shell",
      { x: -12, duration: 0.06, repeat: 5, yoyo: true, ease: "none" },
      0.72,
    );
    tl.fromTo(
      ".hf-transition-input-check",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.28, ease: "back.out(2)" },
      1.18,
    );
    tl.fromTo(
      ".hf-transition-input-hint",
      { opacity: 0, y: -6 },
      { opacity: 1, y: 0, duration: 0.22, ease: "power2.out" },
      1.28,
    );
    window.__timelines = window.__timelines || {};
    window.__timelines["input-feedback"] = tl;
  })();
</script>
