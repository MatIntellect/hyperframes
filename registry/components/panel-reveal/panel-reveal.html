<!--
  Panel Reveal - transitions.dev-inspired primitive for HyperFrames.

  Paste the markup, CSS and script into a composition. Use the timeline
  integration note at the bottom as the starting point for deterministic GSAP
  animation.

  Variables. The script reads each one, falls back to the declared default on
  anything missing or unrecognised, and writes the result as a custom property
  the CSS below consumes. The timeline recipe at the end is untouched by them:
  it keeps driving the single open value from 0 to 1.

    - title (string, default "Параметры движения"): the header line above the fold.
    - width (narrow | standard | wide, default standard): how wide the panel
      sits, 520, 640 or 720 px.
    - reveal (fade | solid, default fade): whether the body fades in with the
      height. fade is the shipped motion, solid keeps the body at full opacity
      so only the height opens. Both look the same once the panel is open.

  On every default: a 640px dark brand card whose body fades in as it grows
  (a 780 px reel field).
-->

<section
  class="hf-transition-panel-reveal"
  data-composition-variables='[
    { "id": "title", "type": "string", "role": "content", "label": "Title", "description": "The header line that sits above the folded body.", "default": "Параметры движения" },
    { "id": "width", "type": "enum", "role": "layout", "label": "Width", "description": "How wide the panel sits, 520, 640 or 720 px.", "default": "standard", "options": [{ "value": "narrow", "label": "Narrow" }, { "value": "standard", "label": "Standard" }, { "value": "wide", "label": "Wide" }] },
    { "id": "reveal", "type": "enum", "role": "motion", "label": "Reveal", "description": "Whether the body fades in with the height. fade is the shipped motion, solid opens the height only.", "default": "fade", "options": [{ "value": "fade", "label": "Fade" }, { "value": "solid", "label": "Solid" }] }
  ]'
>
  <header>Параметры движения</header>
  <div>
    <p>Длительность 420 мс</p>
    <p>Плавность power3.out</p>
  </div>
</section>

<style>
  @font-face {
    font-family: "Bebas Neue";
    src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
    font-weight: 700;
    font-display: block;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
    unicode-range:
      U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329,
      U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
    unicode-range:
      U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329,
      U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F,
      U+A720-A7FF;
  }
  /* Vertical reel: sized for the 780 px graphics field (title 34 px, body 28 px), one palette:
     the reel's brand card, line, light title and muted body. */
  .hf-transition-panel-reveal {
    --hf-panel-open: 1;
    width: var(--hf-panel-width, 640px);
    max-width: 100%;
    overflow: hidden;
    border: 2px solid var(--hf-panel-border, var(--border, #2e2e32));
    border-radius: 28px;
    background: var(--hf-panel-surface, var(--surface, #18181a));
    color: var(--hf-panel-text, var(--fg, #f2f2f2));
    font-family: "Montserrat", system-ui, sans-serif;
    box-shadow: 0 20px 56px rgba(0, 0, 0, 0.35);
  }
  .hf-transition-panel-reveal header {
    padding: 28px 32px;
    font-size: 34px;
    font-weight: 800;
    line-height: 1.15;
  }
  .hf-transition-panel-reveal div {
    max-height: calc(var(--hf-panel-open) * 240px);
    opacity: calc(1 - var(--hf-panel-fade, 1) * (1 - var(--hf-panel-open)));
    padding: 0 32px calc(var(--hf-panel-open) * 28px);
    overflow: hidden;
  }
  .hf-transition-panel-reveal p {
    margin: 0 0 12px;
    color: var(--hf-panel-muted, var(--muted, #8a8a90));
    font-size: 28px;
    line-height: 1.3;
  }
</style>

<script>
  (function () {
    "use strict";

    var vars =
      window.__hyperframes && window.__hyperframes.getVariables
        ? window.__hyperframes.getVariables()
        : {};

    // Unrecognised overrides return to their declared defaults.
    var widths = { narrow: "520px", standard: "640px", wide: "720px" };
    // One palette: the reel's brand tokens.
    var tone = {
      surface: "var(--surface, #18181a)",
      border: "var(--border, #2e2e32)",
      text: "var(--fg, #f2f2f2)",
      muted: "var(--muted, #8a8a90)",
    };
    var reveals = { fade: 1, solid: 0 };

    function pick(table, value, fallback) {
      return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
    }

    var width = widths[pick(widths, vars.width, "standard")];
    var fade = reveals[pick(reveals, vars.reveal, "fade")];

    var title = typeof vars.title === "string" ? vars.title.trim() : "";
    if (!title) {
      title = "Параметры движения";
    }

    var roots = document.querySelectorAll(".hf-transition-panel-reveal");
    for (var i = 0; i < roots.length; i += 1) {
      var root = roots[i];
      root.style.setProperty("--hf-panel-width", width);
      root.style.setProperty("--hf-panel-surface", tone.surface);
      root.style.setProperty("--hf-panel-border", tone.border);
      root.style.setProperty("--hf-panel-text", tone.text);
      root.style.setProperty("--hf-panel-muted", tone.muted);
      root.style.setProperty("--hf-panel-fade", String(fade));

      var header = root.querySelector("header");
      if (header) {
        header.textContent = title;
      }
    }
  })();
</script>

<!--
  Timeline integration: built in, see the script below. It registers its own paused timeline as
  window.__timelines["panel-reveal"]; mount the snippet inside a clip with data-composition-id="panel-reveal"
  and the runtime nests it at that clip's start.
-->

<script>
  /* own timeline (component-quality-bar.md X1): the host clip carries data-composition-id="panel-reveal" */
  (function () {
    var startTime = 0;
    var tl = gsap.timeline({ paused: true });
    tl.fromTo(
      ".hf-transition-panel-reveal",
      { "--hf-panel-open": 0 },
      { "--hf-panel-open": 1, duration: 0.44, ease: "power3.inOut" },
      startTime,
    );
    window.__timelines = window.__timelines || {};
    window.__timelines["panel-reveal"] = tl;
  })();
</script>
