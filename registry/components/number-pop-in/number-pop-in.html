<!--
  Number Pop In - transitions.dev-inspired primitive for HyperFrames.

  Paste the markup, CSS and script into a composition. Use the timeline
  integration note at the bottom as the starting point for deterministic GSAP
  animation.

  Variables. The script reads each one, falls back to the declared default on
  anything missing or unrecognised, and either rebuilds the characters or writes
  a custom property the CSS above consumes. The timeline recipe stays untouched:
  it keeps driving one offset, one scale and one blur, and these decide what the
  number is, what colour it is, and how far that offset carries it.

    - value (any text, default 5,7): the number itself. Every character becomes
      its own span, so the stagger still lands character by character.
    - unit (any text, default млн): the small suffix printed after the number.
      Pass an empty string to drop it.
    - lift (close | standard | far, default standard): scales the offset the
      timeline drives, so the characters cover a shorter or longer run in the
      same time. The offset is zero at rest, so this one only shows in motion.
    - tone (ink | paper | accent, default paper: the reels are dark): number colour. ink is near-black
      for light frames, paper near-white for dark ones, accent rides --brand.
      The suffix follows in the same family.

  On every default the result is identical to the original: 5,7 млн rising 24px
  through an 8px blur in near-white.
-->

<div
  class="hf-transition-number-pop-in"
  data-composition-variables='[
    {"id": "value", "type": "string", "role": "content", "label": "Value", "description": "The number itself. Every character becomes its own span, so the stagger still lands character by character.", "default": "5,7", "maxLength": 12},
    {"id": "unit", "type": "string", "role": "content", "label": "Unit", "description": "Small suffix printed after the number. Pass an empty string to drop it.", "default": "млн", "maxLength": 8},
    {"id": "lift", "type": "enum", "role": "motion", "label": "Lift", "description": "Scales the offset the timeline drives, so the characters cover a shorter or longer run in the same time.", "default": "standard", "options": [{"value": "close", "label": "Close"}, {"value": "standard", "label": "Standard"}, {"value": "far", "label": "Far"}]},
    {"id": "tone", "type": "enum", "role": "style", "label": "Tone", "description": "Number colour: ink for light frames, paper for dark ones, accent rides --brand.", "default": "paper", "options": [{"value": "ink", "label": "Ink"}, {"value": "paper", "label": "Paper"}, {"value": "accent", "label": "Accent"}]}
  ]'
>
  <span>5</span><span>,</span><span>7</span><small>млн</small>
</div>

<style>
  @font-face {
    font-family: "Bebas Neue";
    src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
    font-weight: 700;
    font-display: block;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
    unicode-range:
      U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329,
      U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
    unicode-range:
      U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329,
      U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F,
      U+A720-A7FF;
  }
  .hf-transition-number-pop-in {
    display: inline-flex;
    align-items: baseline;
    gap: 2px;
    color: var(--hf-number-color, var(--fg, #f2f2f2));
    font-family: "Montserrat", system-ui, sans-serif;
    font-weight: 900;
    letter-spacing: -0.04em;
  }
  .hf-transition-number-pop-in span {
    font-size: 76px;
    line-height: 0.9;
    white-space: pre; /* a space between digit groups is its own span and must keep its width */
    filter: blur(var(--hf-number-blur, 0px));
    transform: translateY(calc(var(--hf-number-y, 0px) * var(--hf-number-lift, 1)))
      scale(var(--hf-number-scale, 1));
    will-change: transform, filter, opacity;
  }
  .hf-transition-number-pop-in small {
    margin-left: 2px;
    color: var(--hf-number-unit-color, var(--muted, #8a8a90));
    font-size: 34px;
    font-weight: 850;
  }
</style>

<script>
  (function () {
    "use strict";

    var vars =
      window.__hyperframes && window.__hyperframes.getVariables
        ? window.__hyperframes.getVariables()
        : {};

    // Unrecognised overrides return to their declared defaults.
    var lifts = { close: 0.5, standard: 1, far: 1.75 };
    var tones = {
      ink: { number: "var(--bg, #0c1014)", unit: "var(--muted, #8a8a90)" },
      paper: { number: "var(--fg, #f2f2f2)", unit: "var(--muted, #8a8a90)" },
      accent: { number: "var(--brand, #ff0000)", unit: "var(--brand, #ff0000)" },
    };

    function text(value, fallback) {
      return typeof value === "string" ? value : fallback;
    }

    var value = text(vars.value, "5,7");
    if (value === "") value = "5,7";
    var unit = text(vars.unit, "млн");
    var lift = Object.prototype.hasOwnProperty.call(lifts, vars.lift) ? vars.lift : "standard";
    var tone = Object.prototype.hasOwnProperty.call(tones, vars.tone) ? vars.tone : "paper"; // the reels are dark

    var roots = document.querySelectorAll(".hf-transition-number-pop-in");
    for (var i = 0; i < roots.length; i += 1) {
      var root = roots[i];
      root.style.setProperty("--hf-number-lift", String(lifts[lift]));
      root.style.setProperty("--hf-number-color", tones[tone].number);
      root.style.setProperty("--hf-number-unit-color", tones[tone].unit);

      var next = [];
      for (var c = 0; c < value.length; c += 1) {
        var span = document.createElement("span");
        span.textContent = value.charAt(c);
        next.push(span);
      }
      if (unit !== "") {
        var small = document.createElement("small");
        small.textContent = unit;
        next.push(small);
      }
      root.replaceChildren.apply(root, next);
    }
  })();
</script>

<!--
  Timeline integration: built in, see the script below. It registers its own paused timeline as
  window.__timelines["number-pop-in"]; mount the snippet inside a clip with data-composition-id="number-pop-in"
  and the runtime nests it at that clip's start.
-->

<script>
  /* own timeline (component-quality-bar.md X1): the host clip carries data-composition-id="number-pop-in" */
  (function () {
    var startTime = 0;
    var tl = gsap.timeline({ paused: true });
    tl.fromTo(
      ".hf-transition-number-pop-in span, .hf-transition-number-pop-in small",
      { opacity: 0, "--hf-number-y": "24px", "--hf-number-scale": 0.82, "--hf-number-blur": "8px" },
      {
        opacity: 1,
        "--hf-number-y": "0px",
        "--hf-number-scale": 1,
        "--hf-number-blur": "0px",
        duration: 0.34,
        stagger: 0.055,
        ease: "back.out(1.8)",
      },
      startTime,
    );
    window.__timelines = window.__timelines || {};
    window.__timelines["number-pop-in"] = tl;
  })();
</script>
