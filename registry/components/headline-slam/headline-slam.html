<!doctype html>
<!--
  headline-slam: HyperFrames video primitive

  One headline scales down from 1.6 to rest with expo.out weight. Its landing
  drives a deterministic three-frame stage shake, followed by a quiet drift
  and a fast upward exit.

  Variables:
    text: headline copy
    accent_word_index: zero-based word index to color, out of range colors none
    accent: green, blue, or violet accent color
    shadow: drop shadow under the headline, on by default

  Envelope, fixed IN and OUT with elastic HOLD:
    IN_BASE  = 0.72s, headline slam and three-frame impact shake
    HOLD     = max(0, D - IN - OUT), one subtle drift cycle
    OUT_BASE = 0.46s, headline whips upward out of frame
    If D is shorter than IN_BASE + OUT_BASE, IN and OUT compress together.
    The timeline is never time-scaled.

  Mount contract: the runtime clones only this template. #root fills the host
  box, establishes the container query basis, and has no data-width or
  data-height. One paused timeline registers under the literal headline-slam
  key.
-->
<html
  lang="en"
  data-composition-id="headline-slam"
  data-composition-duration="3.5"
  data-composition-variables='[
    {"id": "text", "type": "string", "role": "content", "label": "Headline", "description": "Text displayed as the headline.", "default": "Монтаж без людей", "maxLength": 28},
    {"id": "accent_word_index", "type": "number", "role": "content", "label": "Accent word index", "description": "Zero-based word index to color. Out of range leaves the headline unaccented.", "default": 1, "step": 1},
    {"id": "shadow", "type": "boolean", "role": "style", "label": "Shadow", "description": "Drop shadow cast under the headline. On by default; set false for a flat matte look.", "default": true}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Headline Slam</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="headline-slam" data-duration="3.5" data-fps="30">
        <style>
          @font-face {
            font-family: "Bebas Neue";
            src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
            font-weight: 700;
            font-display: block;
          }
          @font-face {
            font-family: "Montserrat";
            src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
            font-weight: 100 900;
            font-display: block;
            unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
          }
          @font-face {
            font-family: "Montserrat";
            src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
            font-weight: 100 900;
            font-display: block;
            unicode-range:
              U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
              U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
          }
          @font-face {
            font-family: "Montserrat";
            src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
            font-weight: 100 900;
            font-display: block;
            unicode-range:
              U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308,
              U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4,
              U+2113, U+2C60-2C7F, U+A720-A7FF;
          }
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            container-type: size;
            isolation: isolate;
            color: var(--fg, #f2f2f2);
            font-family: var(--font-display, "Bebas Neue", sans-serif);
            pointer-events: none;
          }

          .hs-clip,
          .hs-stage {
            position: absolute;
            inset: 0;
            width: 100cqw;
            height: 100cqh;
          }

          .hs-clip {
            overflow: hidden;
          }

          .hs-stage {
            display: grid;
            place-items: center;
            will-change: transform;
          }

          .hs-headline {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2cqw;
            width: 90cqw;
            min-height: 22cqh;
            color: var(--fg, #f2f2f2);
            font-size: var(--hs-font-size, 10.5cqw);
            font-weight: 900;
            line-height: 0.88;
            letter-spacing: 0;
            text-align: center;
            white-space: nowrap;
            transform-origin: 50% 50%;
            will-change: transform, opacity;
          }

          /* Shadow is on by default; the shadow variable opts out of it. */
          .hs-headline.hs-shadow {
            text-shadow: 0 1.2cqh 4.5cqh color-mix(in srgb, #000 52%, transparent);
          }

          .hs-word {
            display: inline-block;
          }

          .hs-word-accent {
            color: var(--hs-accent, var(--brand, #ff0000));
          }
        </style>

        <div
          id="headline-slam-clip"
          class="hs-clip clip"
          data-start="0"
          data-duration="3.5"
          data-track-index="0"
        >
          <div class="hs-stage">
            <div class="hs-headline" role="heading" aria-level="1"></div>
          </div>
        </div>

        <script>
          /* hostSlot: the whole-scene clip follows the host slot (komp-sobrat.py klip_hozyaina; caret-swap:219) */
          (function () {
            var c = document.getElementById("headline-slam-clip");
            var h = c && c.parentElement && c.parentElement.closest("[data-duration]");
            if (h) c.dataset.duration = h.dataset.duration;
          })();
        </script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var stage = root.querySelector(".hs-stage");
            var headline = root.querySelector(".hs-headline");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            var text = vars.text == null ? "Монтаж без людей" : String(vars.text);
            var indexValue = Number(vars.accent_word_index);
            var accentWordIndex = Number.isFinite(indexValue) ? Math.trunc(indexValue) : 1;
            var accentColors = {
              green: "var(--brand, #ff0000)",
              blue: "var(--brand, #ff0000)",
              violet: "var(--accent-2, #ff0000)",
            };
            var accent = Object.prototype.hasOwnProperty.call(accentColors, vars.accent)
              ? vars.accent
              : "green";
            var shadow = !(vars.shadow === false || vars.shadow === "false");
            var words = text.trim() === "" ? [] : text.trim().split(/\s+/);

            root.style.setProperty("--hs-accent", accentColors[accent]);
            headline.classList.toggle("hs-shadow", shadow);
            headline.setAttribute("aria-label", text);

            words.forEach(function (word, index) {
              var span = document.createElement("span");
              span.className = index === accentWordIndex ? "hs-word hs-word-accent" : "hs-word";
              span.textContent = word;
              span.setAttribute("aria-hidden", "true");
              headline.appendChild(span);
            });

            // Size: the largest that keeps every line on one line, measured in Bebas Neue once the face has
            // loaded (fitTextFontSize – contributing.md:66 «Overflow»), never under 28px (vertical.md:18).
            // Render waits on buildReady.
            var fitTexts = [text];
            window.__hf = window.__hf || {};
            window.__hf.buildReady = window.__hf.buildReady || {};
            window.__hf.buildReady["headline-slam"] = document.fonts
              .load('700 100px "Bebas Neue"', fitTexts.join(" "))
              .then(function () {
                var base = Math.max(28, Math.round(root.clientWidth * 0.105));
                var size = fitTexts.reduce(function (smallest, line) {
                  var fit = window.__hyperframes.fitTextFontSize(line, {
                    fontFamily: "Bebas Neue",
                    fontWeight: 700,
                    maxWidth: root.clientWidth * 0.56,
                    baseFontSize: base,
                    minFontSize: 28,
                    step: 1,
                  });
                  return Math.min(smallest, fit.fontSize);
                }, base);
                root.style.setProperty("--hs-font-size", size + "px");
              });

            var IN_BASE = 0.72;
            var OUT_BASE = 0.46;
            var LAND_AT_BASE = 0.58;
            var SHAKE_FRAME_BASE = 1 / 30;
            var duration = Math.max(
              0.001,
              parseFloat(
                ((root.parentElement && root.parentElement.closest("[data-duration]")) || root)
                  .dataset.duration || "3.5",
              ),
            );
            var baseTotal = IN_BASE + OUT_BASE;
            var envelopeScale = duration < baseTotal ? duration / baseTotal : 1;
            var IN = IN_BASE * envelopeScale;
            var OUT = OUT_BASE * envelopeScale;
            var LAND_AT = LAND_AT_BASE * envelopeScale;
            var SHAKE_FRAME = SHAKE_FRAME_BASE * envelopeScale;
            var HOLD = Math.max(0, duration - IN - OUT);
            var HOLD_START = IN;
            var OUT_START = IN + HOLD;

            var tl = gsap.timeline({ paused: true });

            tl.fromTo(
              headline,
              { scale: 1.6, opacity: 0, y: 0 },
              { scale: 1, opacity: 1, y: 0, duration: LAND_AT, ease: "expo.out" },
              0,
            );

            tl.to(
              stage,
              { x: "0.55cqw", y: "-0.3cqh", duration: SHAKE_FRAME, ease: "power2.out" },
              LAND_AT,
            );
            tl.to(stage, {
              x: "-0.38cqw",
              y: "0.2cqh",
              duration: SHAKE_FRAME,
              ease: "power2.out",
            });
            tl.to(stage, { x: 0, y: 0, duration: SHAKE_FRAME, ease: "power2.out" });

            if (HOLD > 0) {
              tl.fromTo(
                headline,
                { y: 0 },
                {
                  y: "-0.55cqh",
                  duration: HOLD / 2,
                  ease: "sine.inOut",
                  yoyo: true,
                  repeat: 1,
                  immediateRender: false,
                },
                HOLD_START,
              );
            }

            tl.to(headline, { y: "-120cqh", duration: OUT, ease: "power4.in" }, OUT_START);

            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["headline-slam"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
