<!doctype html>
<!--
  focus-swap: HyperFrames video primitive (ui-props / holdable / demonstrate)

  Concept: attention moves between two cards (side by side in a landscape
  field, one above the other in a portrait field). The card losing
  focus recedes to 0.92 scale, softens, and dims while the other card advances
  to full scale, sharpness, and opacity. Both sides move together as one clean
  swap.

  Compiled-from evidence: launches-motion-vocabulary.md section 3.6 identifies
  blur-focus / defocus in 14 of 18 production launches and names focus-swap as
  a high-frequency missing primitive for blur + opacity + optional scale.

  Use when: directing the viewer from one product state, option, or result to
  another without moving either element out of its established layout.

  Variables:
    - focus ("a" | "b", default "b"): the card that ends focused.
    - blurPx (number, default 6): blur applied to the unfocused card.
    - dim (number from 0 to 1, default 0.5): unfocused card opacity.
    - status_a, title_a, detail_a / status_b, title_b, detail_b (strings):
      the words of card A and card B; long words wrap.

  Envelope (holdable):
    IN = 0.90s at the standard duration, including a 0.20s readable lead.
    HOLD = elastic and deliberately still after focus lands.
    OUT = none; the host composition owns the cut or exit.
    For durations under 0.90s, the lead and swap compress to finish by D.

  Sync point: focus-landed at 0.90s into IN at the standard duration. It
  compresses with IN only when D is shorter than 0.90s and never enters HOLD.

  Sound: none. This continuous attention shift has no discrete impact cue.

  Mount contract: this is a template-wrapped sub-composition. The runtime
  clones only template contents. #root has no data-width or data-height and
  fills the host-owned box with position:absolute, inset:0, and
  container-type:size. The paused GSAP timeline is registered under the
  hardcoded composition id "focus-swap".
-->
<html
  lang="en"
  data-composition-variables='[
    { "id": "focus", "type": "enum", "role": "motion", "label": "Final focus", "description": "Card that ends sharp, full-size, and fully opaque.", "default": "b", "options": [{ "value": "a", "label": "Card A" }, { "value": "b", "label": "Card B" }] },
    { "id": "blurPx", "type": "number", "role": "style", "label": "Unfocused blur", "description": "Blur applied to the card outside the viewer focus.", "default": 6, "min": 0, "max": 20, "step": 1, "unit": "px" },
    { "id": "dim", "type": "number", "role": "style", "label": "Unfocused opacity", "description": "Opacity of the card outside the viewer focus.", "default": 0.5, "min": 0, "max": 1, "step": 0.05 },
    { "id": "status_a", "type": "string", "role": "content", "label": "Card A status", "description": "Short status word above the title of card A.", "default": "План" },
    { "id": "title_a", "type": "string", "role": "content", "label": "Card A title", "description": "Title of card A.", "default": "Придумать идею" },
    { "id": "detail_a", "type": "string", "role": "content", "label": "Card A detail", "description": "One line under the title of card A; wraps by words.", "default": "Собрать задачу и договориться с командой" },
    { "id": "status_b", "type": "string", "role": "content", "label": "Card B status", "description": "Short status word above the title of card B.", "default": "Запуск" },
    { "id": "title_b", "type": "string", "role": "content", "label": "Card B title", "description": "Title of card B.", "default": "Выпустить ролик" },
    { "id": "detail_b", "type": "string", "role": "content", "label": "Card B detail", "description": "One line under the title of card B; wraps by words.", "default": "От согласованного монтажа к публикации" }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Focus Swap</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="focus-swap" data-duration="1.5" data-fps="30">
        <style>
          @font-face {
            font-family: "Bebas Neue";
            src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
            font-weight: 700;
            font-display: block;
          }
          @font-face {
            font-family: "Montserrat";
            src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
            font-weight: 100 900;
            font-display: block;
            unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
          }
          @font-face {
            font-family: "Montserrat";
            src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
            font-weight: 100 900;
            font-display: block;
            unicode-range:
              U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
              U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
          }
          @font-face {
            font-family: "Montserrat";
            src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
            font-weight: 100 900;
            font-display: block;
            unicode-range:
              U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308,
              U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4,
              U+2113, U+2C60-2C7F, U+A720-A7FF;
          }
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          #root {
            position: absolute;
            inset: 0;
            container-type: size;
            isolation: isolate;
            overflow: hidden;
            background: var(--bg, #0c1014);
            color: var(--fg, #f2f2f2);
            font-family: var(--font-body, "Montserrat", sans-serif);
          }

          .fs-clip {
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
            padding: 7cqh 6cqw;
          }

          .fs-pair {
            width: 100%;
            height: min(72cqh, 52cqw);
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 4cqw;
            align-items: stretch;
          }

          /* Portrait field (a vertical reel's graphics field is 780 x 1180):
             side by side each card was ~330 px wide and its copy filled the
             card to the meter. The pair stacks, one card above the other. */
          @container (aspect-ratio < 1) {
            .fs-pair {
              height: min(86cqh, 150cqw);
              grid-template-columns: minmax(0, 1fr);
              grid-template-rows: repeat(2, minmax(0, 1fr));
            }
          }

          /* EDIT ZONE: visual payload only. Keep the card frames and their
             initial states transform-free because GSAP owns scale and blur. */
          .fs-card {
            min-width: 0;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 5cqh 3.2cqw;
            overflow: hidden;
            border: 0.16cqw solid var(--border, #2e2e32);
            border-radius: var(--radius, 22px);
            background: var(--surface, #18181a);
            box-shadow: 0 2.2cqh 5cqh color-mix(in srgb, var(--bg, #0c1014) 72%, transparent);
            transform-origin: center;
            will-change: transform, filter, opacity;
            /* Both cards are the same placeholder material. Which one holds
               attention is said by blur, scale, and opacity, never by hue. */
            --fs-card-accent: color-mix(in srgb, var(--fg, #f2f2f2) 72%, var(--surface, #18181a));
          }

          .fs-card::before {
            content: "";
            position: absolute;
            inset: 0 0 auto;
            height: 0.75cqh;
            background: var(--fs-card-accent);
          }

          .fs-card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-2, 16px);
          }

          .fs-card-letter {
            display: grid;
            place-items: center;
            width: 5cqw;
            aspect-ratio: 1;
            border-radius: 50%;
            background: color-mix(in srgb, var(--fg, #f2f2f2) 13%, var(--surface, #18181a));
            color: var(--fg, #f2f2f2);
            font-family: var(--font-body, "Montserrat", sans-serif);
            /* 31 px: the card out of focus sits at scale 0.92-0.93; the 28 px floor holds after it. */
            font-size: max(31px, 2.3cqw);
            font-weight: 700;
          }

          .fs-status {
            color: var(--muted, #8a8a90);
            font-family: var(--font-body, "Montserrat", sans-serif);
            font-size: max(31px, 1.25cqw);
            letter-spacing: 0.12em;
            text-transform: uppercase;
          }

          .fs-copy {
            display: grid;
            gap: var(--space-1, 8px);
          }

          .fs-title {
            color: var(--fg, #f2f2f2);
            /* Card titles are UI copy, not reel headings: Montserrat. */
            font-family: var(--font-body, "Montserrat", sans-serif);
            font-size: max(31px, 3.4cqw);
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -0.01em;
          }

          .fs-detail {
            color: var(--muted, #8a8a90);
            font-size: max(31px, 1.45cqw);
            line-height: 1.35;
          }

          .fs-meter {
            height: 1.1cqh;
            overflow: hidden;
            border-radius: var(--radius, 22px);
            background: color-mix(in srgb, var(--border, #2e2e32) 60%, transparent);
          }

          .fs-meter-fill {
            width: var(--fs-meter-width);
            height: 100%;
            border-radius: inherit;
            background: var(--fs-card-accent);
          }
        </style>

        <div
          id="focus-swap-hf-clip"
          class="fs-clip clip"
          data-start="0"
          data-duration="1.5"
          data-track-index="0"
        >
          <div class="fs-pair">
            <article class="fs-card" data-focus-card="a" aria-label="Карточка А, план">
              <div class="fs-card-head">
                <span class="fs-card-letter">А</span>
                <span class="fs-status">План</span>
              </div>
              <div class="fs-copy">
                <h2 class="fs-title">Придумать идею</h2>
                <p class="fs-detail">Собрать задачу и договориться с командой</p>
              </div>
              <div class="fs-meter" aria-hidden="true">
                <div class="fs-meter-fill" style="--fs-meter-width: 58%"></div>
              </div>
            </article>

            <article class="fs-card" data-focus-card="b" aria-label="Карточка Б, запуск">
              <div class="fs-card-head">
                <span class="fs-card-letter">Б</span>
                <span class="fs-status">Запуск</span>
              </div>
              <div class="fs-copy">
                <h2 class="fs-title">Выпустить ролик</h2>
                <p class="fs-detail">От согласованного монтажа к публикации</p>
              </div>
              <div class="fs-meter" aria-hidden="true">
                <div class="fs-meter-fill" style="--fs-meter-width: 86%"></div>
              </div>
            </article>
          </div>
        </div>

        <script>
          /* hostSlot: the whole-scene clip follows the host slot (komp-sobrat.py klip_hozyaina; caret-swap:219) */
          (function () {
            var c = document.getElementById("focus-swap-hf-clip");
            var h = c && c.parentElement && c.parentElement.closest("[data-duration]");
            if (h) c.dataset.duration = h.dataset.duration;
          })();
        </script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var cardA = root.querySelector('[data-focus-card="a"]');
            var cardB = root.querySelector('[data-focus-card="b"]');
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            // INVARIANT: focus is the only owner of which card advances and
            // which recedes. Invalid input resolves to the declared default.
            // Card words are fields: the host never edits this file.
            [
              ["a", "status", ".fs-status"],
              ["a", "title", ".fs-title"],
              ["a", "detail", ".fs-detail"],
              ["b", "status", ".fs-status"],
              ["b", "title", ".fs-title"],
              ["b", "detail", ".fs-detail"],
            ].forEach(function (field) {
              var value = vars[field[1] + "_" + field[0]];
              var card = field[0] === "a" ? cardA : cardB;
              if (typeof value === "string") card.querySelector(field[2]).textContent = value;
            });
            [cardA, cardB].forEach(function (card) {
              card.setAttribute(
                "aria-label",
                card.querySelector(".fs-title").textContent +
                  ", " +
                  card.querySelector(".fs-status").textContent,
              );
            });

            var targetIsB = vars.focus !== "a";
            var initialFocused = targetIsB ? cardA : cardB;
            var targetFocused = targetIsB ? cardB : cardA;

            var rawBlur = Number(vars.blurPx);
            var blurPx = Number.isFinite(rawBlur) ? Math.max(0, Math.min(20, rawBlur)) : 6;
            var rawDim = Number(vars.dim);
            var dim = Number.isFinite(rawDim) ? Math.max(0, Math.min(1, rawDim)) : 0.5;
            var blurred = "blur(" + blurPx + "px)";
            var sharp = "blur(0px)";

            // RETIME RANGE: keep the standard 0.20s lead and 0.70s swap. Only
            // short host durations compress them so focus always lands by D.
            var duration = Math.max(
              0.001,
              parseFloat(
                ((root.parentElement && root.parentElement.closest("[data-duration]")) || root)
                  .dataset.duration || "1.5",
              ),
            );
            var SWAP_START = Math.min(0.2, duration * 0.2);
            var SWAP_DURATION = Math.min(0.7, Math.max(0.001, duration - SWAP_START));

            gsap.set(initialFocused, { opacity: 1, scale: 1, filter: sharp });
            gsap.set(targetFocused, { opacity: dim, scale: 0.92, filter: blurred });

            var tl = gsap.timeline({ paused: true });
            tl.to(
              initialFocused,
              {
                opacity: dim,
                scale: 0.92,
                filter: blurred,
                duration: SWAP_DURATION,
                ease: "power2.out",
              },
              SWAP_START,
            );
            tl.to(
              targetFocused,
              {
                opacity: 1,
                scale: 1,
                filter: sharp,
                duration: SWAP_DURATION,
                ease: "power2.out",
              },
              SWAP_START,
            );

            tl.seek(0);

            window.__timelines = window.__timelines || {};
            window.__timelines["focus-swap"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
