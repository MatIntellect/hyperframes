<!doctype html>
<!--
  gesture-tap: HyperFrames video primitive (ui-props / interaction / demonstrate)

  Concept: a contact circle appears directly over a real pill button, presses
  it, releases it into a new state, then lifts away. One mechanic, one job:
  showing a decisive mobile tap response.

  Variables:
    - tap_label (string, default "Подписаться"): button label before release.
    - response_label (string, default "Подписан"): button label after release.
    - response color: --brand of the reel palette.

  Envelope: fixed IN and OUT with elastic HOLD only.
    IN_BASE = 1.35s. The stage fades in, contact fades up at the target,
    presses, then releases. The label swap, accent response, and pulse share
    one release timestamp.
    HOLD = max(0, D - IN - OUT). Only this phase stretches for longer mounts.
    A barely visible card drift keeps the held state alive.
    OUT_BASE = 0.55s. The completed mobile state fades cleanly.
    If D is shorter than IN_BASE + OUT_BASE, IN and OUT compress together.

  Mount contract: the runtime clones only this template. #root fills the host
  box, establishes the container query basis, carries no data-width or
  data-height, and registers one paused timeline under the literal
  gesture-tap key.
-->
<html
  lang="en"
  data-composition-id="gesture-tap"
  data-composition-duration="3"
  data-composition-variables='[
    {"id": "tap_label", "type": "string", "role": "content", "label": "Tap label", "description": "Button label shown before the tap response.", "default": "Подписаться", "maxLength": 16},
    {"id": "response_label", "type": "string", "role": "content", "label": "Response label", "description": "Button label shown when the tap releases.", "default": "Подписан", "maxLength": 16}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Gesture Tap</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="gesture-tap" data-duration="3" data-fps="30">
        <style>
          @font-face {
            font-family: "Bebas Neue";
            src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
            font-weight: 700;
            font-display: block;
          }
          @font-face {
            font-family: "Montserrat";
            src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
            font-weight: 100 900;
            font-display: block;
            unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
          }
          @font-face {
            font-family: "Montserrat";
            src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
            font-weight: 100 900;
            font-display: block;
            unicode-range:
              U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
              U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
          }
          @font-face {
            font-family: "Montserrat";
            src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
            font-weight: 100 900;
            font-display: block;
            unicode-range:
              U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308,
              U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4,
              U+2113, U+2C60-2C7F, U+A720-A7FF;
          }
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            container-type: size;
            isolation: isolate;
            color: #eef2ff;
            font-family: "Montserrat", system-ui, sans-serif;
            pointer-events: none;
          }

          .gt-clip {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
            background: radial-gradient(
              circle at 50% 44%,
              var(--surface, #18181a) 0%,
              var(--bg, #0c1014) 68%
            ); /* the reel ground, not navy */
          }

          .gt-stage {
            width: 100cqw;
            height: 100cqh;
            display: grid;
            place-items: center;
            opacity: 0;
            will-change: transform, opacity;
          }

          .gt-phone {
            position: relative;
            width: 60cqw; /* a vertical field: the phone may widen, Russian names and labels are longer */
            height: 78cqh;
            overflow: hidden;
            border: 0.18cqmin solid rgba(255, 255, 255, 0.24);
            border-radius: 5cqmin;
            background: #f7f8fb;
            box-shadow: 0 4cqh 10cqh rgba(2, 6, 23, 0.44);
            color: #111827;
            will-change: transform;
          }

          .gt-status {
            height: 9cqh;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4cqw;
            border-bottom: 0.12cqmin solid #e5e7eb;
            color: #64748b;
            font-family: var(
              --font-body,
              "Montserrat",
              sans-serif
            ); /* a label, not code (Mat 11.11) */
            font-size: max(28px, 2.1cqh);
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
          }

          .gt-signal {
            width: 4.8cqw;
            height: 1.4cqh;
            border-radius: 999cqw;
            background: #cbd5e1;
          }

          .gt-profile {
            height: 50cqh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2.2cqh;
            padding: 0 5cqw;
            text-align: center;
          }

          .gt-avatar {
            width: 12cqmin;
            aspect-ratio: 1;
            border-radius: 50%;
            background: linear-gradient(145deg, #e2e8f0, #cbd5e1);
            box-shadow: inset 0 0 0 0.8cqmin #ffffff;
          }

          .gt-name {
            max-width: 52cqw;
            color: #0f172a;
            font-size: max(28px, 4.2cqh);
            font-weight: 780;
            line-height: 1.05;
            letter-spacing: -0.035em;
            text-align: center;
            text-wrap: balance; /* a long name wraps instead of an ellipsis */
          }

          .gt-detail {
            max-width: 52cqw;
            color: #64748b;
            font-size: max(28px, 2.35cqh);
            font-weight: 520;
            line-height: 1.35;
          }

          .gt-button-shell {
            position: relative;
            width: fit-content; /* the pill fits its label, nothing is cut */
            min-width: 34cqw;
            max-width: 54cqw;
            height: 11cqh;
            margin: 0 auto;
          }

          .gt-button {
            position: relative;
            width: 100%;
            height: 100%;
            padding: 0 1em;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 0.16cqmin solid #273449;
            border-radius: 999cqw;
            background: #172033;
            color: #f8fafc;
            font: inherit;
            font-size: max(28px, 2.9cqh);
            font-weight: 760;
            letter-spacing: -0.01em;
            transform-origin: 50% 50%;
            will-change: transform, background-color, border-color;
          }

          .gt-button-label {
            display: block;
            max-width: 46cqw;
            text-align: center;
            text-wrap: balance;
            line-height: 1.1; /* a long label wraps by words, never cut */
          }

          .gt-response-pulse {
            position: absolute;
            inset: -1.7cqh -1.7cqw;
            z-index: 1;
            border: 0.28cqmin solid var(--gt-accent, var(--brand, #ff0000));
            border-radius: 999cqw;
            opacity: 0;
            will-change: transform, opacity;
          }

          .gt-contact {
            position: absolute;
            top: calc(50% - 7cqmin);
            left: calc(50% - 7cqmin);
            z-index: 4;
            width: 14cqmin;
            aspect-ratio: 1;
            border: 0.24cqmin solid rgba(255, 255, 255, 0.78);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.34);
            box-shadow:
              inset 0 0 0 0.8cqmin rgba(255, 255, 255, 0.12),
              0 1.2cqh 3cqh rgba(15, 23, 42, 0.28);
            opacity: 0;
            transform-origin: 50% 50%;
            will-change: transform, opacity;
          }
        </style>

        <div
          id="gesture-tap-clip"
          class="gt-clip clip"
          data-start="0"
          data-duration="3"
          data-track-index="0"
        >
          <div class="gt-stage">
            <article class="gt-phone" aria-label="Mobile profile card">
              <div class="gt-status">
                <span>Профиль</span>
                <span class="gt-signal" aria-hidden="true"></span>
              </div>
              <div class="gt-profile">
                <div class="gt-avatar" aria-hidden="true"></div>
                <div class="gt-name">Ольга Петрова</div>
                <div class="gt-detail">Пеку хлеб и снимаю, как он растёт.</div>
              </div>
              <div class="gt-button-shell">
                <div class="gt-response-pulse" aria-hidden="true"></div>
                <button class="gt-button" type="button" aria-pressed="false" tabindex="-1">
                  <span class="gt-button-label"></span>
                </button>
                <div class="gt-contact" aria-hidden="true"></div>
              </div>
            </article>
          </div>
        </div>

        <script>
          /* hostSlot: the whole-scene clip follows the host slot (komp-sobrat.py klip_hozyaina; caret-swap:219) */
          (function () {
            var c = document.getElementById("gesture-tap-clip");
            var h = c && c.parentElement && c.parentElement.closest("[data-duration]");
            if (h) c.dataset.duration = h.dataset.duration;
          })();
        </script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var stage = root.querySelector(".gt-stage");
            var card = root.querySelector(".gt-phone");
            var button = root.querySelector(".gt-button");
            var label = root.querySelector(".gt-button-label");
            var contact = root.querySelector(".gt-contact");
            var pulse = root.querySelector(".gt-response-pulse");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            var tapLabel = vars.tap_label == null ? "Подписаться" : String(vars.tap_label);
            var responseLabel =
              vars.response_label == null ? "Подписан" : String(vars.response_label);
            var accentName =
              vars.accent === "blue" || vars.accent === "violet" ? vars.accent : "green";
            var accentColors = {
              green: "var(--brand, #ff0000)",
              blue: "var(--brand, #ff0000)",
              violet: "var(--accent-2, #ff0000)",
            };
            var accentColor = accentColors[accentName];

            label.textContent = tapLabel;
            button.setAttribute("aria-label", tapLabel);
            root.style.setProperty("--gt-accent", accentColor);
            // GSAP interpolates colors numerically, so tween values need the
            // substituted color rather than the var() form.
            accentColor = getComputedStyle(root).getPropertyValue("--gt-accent").trim();

            var IN_BASE = 1.35;
            var OUT_BASE = 0.55;
            var STAGE_IN_BASE = 0.24;
            var CONTACT_AT_BASE = 0.28;
            var CONTACT_IN_BASE = 0.18;
            var PRESS_AT_BASE = 0.54;
            var PRESS_DURATION_BASE = 0.18;
            var RELEASE_AT_BASE = 0.72;
            var RELEASE_DURATION_BASE = 0.28;
            var CONTACT_OUT_BASE = 0.34;
            var PULSE_DURATION_BASE = 0.56;

            var parsedDuration = Number.parseFloat(
              ((root.parentElement && root.parentElement.closest("[data-duration]")) || root)
                .dataset.duration,
            );
            var duration =
              Number.isFinite(parsedDuration) && parsedDuration > 0 ? parsedDuration : 3;
            var fixedBase = IN_BASE + OUT_BASE;
            var phaseScale = duration < fixedBase ? duration / fixedBase : 1;
            var IN = IN_BASE * phaseScale;
            var OUT = OUT_BASE * phaseScale;
            var HOLD = Math.max(0, duration - IN - OUT);
            var HOLD_START = IN;
            var OUT_START = IN + HOLD;
            var STAGE_IN = STAGE_IN_BASE * phaseScale;
            var CONTACT_AT = CONTACT_AT_BASE * phaseScale;
            var CONTACT_IN = CONTACT_IN_BASE * phaseScale;
            var PRESS_AT = PRESS_AT_BASE * phaseScale;
            var PRESS_DURATION = PRESS_DURATION_BASE * phaseScale;
            var RELEASE_AT = RELEASE_AT_BASE * phaseScale;
            var RELEASE_DURATION = RELEASE_DURATION_BASE * phaseScale;
            var CONTACT_OUT = CONTACT_OUT_BASE * phaseScale;
            var PULSE_DURATION = PULSE_DURATION_BASE * phaseScale;

            var tl = gsap.timeline({ paused: true });

            tl.to(stage, { opacity: 1, duration: STAGE_IN, ease: "power2.out" }, 0);

            // IN: the contact appears at the target. No x or y tween precedes the press.
            tl.fromTo(
              contact,
              { opacity: 0, scale: 0.82 },
              { opacity: 0.68, scale: 1, duration: CONTACT_IN, ease: "power2.out" },
              CONTACT_AT,
            );
            tl.to(
              button,
              {
                scale: 0.93,
                backgroundColor: "#26324a",
                duration: PRESS_DURATION,
                ease: "power4.in",
              },
              PRESS_AT,
            );
            tl.to(contact, { scale: 0.78, duration: PRESS_DURATION, ease: "power4.in" }, PRESS_AT);

            // Release owns the response. Label, state, accent fill, and pulse
            // all begin at RELEASE_AT so the UI answers on the release frame.
            tl.set(label, { innerText: responseLabel }, RELEASE_AT);
            tl.set(
              button,
              { attr: { "aria-label": responseLabel, "aria-pressed": "true" } },
              RELEASE_AT,
            );
            tl.to(
              button,
              {
                scale: 1,
                backgroundColor: accentColor,
                borderColor: accentColor,
                color: "#071015",
                duration: RELEASE_DURATION,
                ease: "back.out(1.7)",
              },
              RELEASE_AT,
            );
            tl.set(pulse, { opacity: 0.58, scale: 0.76 }, RELEASE_AT);
            tl.to(
              pulse,
              { opacity: 0, scale: 1.14, duration: PULSE_DURATION, ease: "power2.out" },
              RELEASE_AT,
            );
            tl.to(
              contact,
              {
                opacity: 0,
                scale: 1.04,
                y: "-5cqh",
                duration: CONTACT_OUT,
                ease: "power2.in",
              },
              RELEASE_AT,
            );

            // HOLD: only this phase stretches. One slow yoyo returns the card
            // to its resting position exactly when OUT starts.
            if (HOLD > 0) {
              tl.to(
                card,
                {
                  y: "-0.6cqh",
                  duration: HOLD / 2,
                  ease: "sine.inOut",
                  yoyo: true,
                  repeat: 1,
                },
                HOLD_START,
              );
            }

            // OUT: the completed state remains intact while the stage exits.
            tl.to(stage, { opacity: 0, y: "-1.4cqh", duration: OUT, ease: "power2.in" }, OUT_START);

            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["gesture-tap"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
