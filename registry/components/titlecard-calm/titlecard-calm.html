<!doctype html>
<!--
  titlecard-calm: HyperFrames video primitive (typography / calm / orient)

  Concept: a restrained title card led by a small kicker and a large
  grotesque headline. The kicker fades and rises first, then the headline
  follows. Typography and negative space carry the frame.

  Variables:
    - headline (string, default "Меньше, но лучше"): the primary title.
    - kicker (string, default "ПРИНЦИП МОНТАЖА"): the small uppercase label.

  Envelope: fixed IN and OUT with an elastic HOLD only.
    IN_BASE  = 1.20s. Kicker arrives first, headline follows.
    HOLD     = max(0, D - IN - OUT). The lockup drifts barely upward.
    OUT_BASE = 0.55s. The full lockup fades with a small rise.
  If D is shorter than IN_BASE + OUT_BASE, IN and OUT compress together.
  Longer mounts stretch HOLD only. The timeline is never time-scaled.

  Mount contract: the runtime clones only this template. #root fills the
  host box, establishes the container query basis, has no data-width or
  data-height, and registers one paused timeline under the hardcoded
  titlecard-calm id.
-->
<html
  lang="en"
  data-composition-id="titlecard-calm"
  data-composition-duration="4"
  data-composition-variables='[
    { "id": "headline", "type": "string", "role": "content", "label": "Headline", "description": "Primary title displayed in the card.", "default": "Меньше, но лучше", "maxLength": 28 },
    { "id": "kicker", "type": "string", "role": "content", "label": "Kicker", "description": "Small uppercase label displayed above the headline.", "default": "ПРИНЦИП МОНТАЖА", "maxLength": 16 }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Titlecard Calm</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="titlecard-calm" data-duration="4" data-fps="30">
        <style>
          @font-face {
            font-family: "Bebas Neue";
            src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
            font-weight: 700;
            font-display: block;
          }
          @font-face {
            font-family: "Montserrat";
            src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
            font-weight: 100 900;
            font-display: block;
            unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
          }
          @font-face {
            font-family: "Montserrat";
            src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
            font-weight: 100 900;
            font-display: block;
            unicode-range:
              U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
              U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
          }
          @font-face {
            font-family: "Montserrat";
            src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
            font-weight: 100 900;
            font-display: block;
            unicode-range:
              U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308,
              U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4,
              U+2113, U+2C60-2C7F, U+A720-A7FF;
          }
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            container-type: size;
            isolation: isolate;
            color: var(--fg, #f2f2f2);
            font-family: var(--font-display, "Bebas Neue", sans-serif);
            pointer-events: none;
          }

          .tc-clip {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
          }

          .tc-lockup {
            display: flex;
            width: 78cqw;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 6cqh;
            transform-origin: 50% 50%;
            will-change: transform, opacity;
          }

          .tc-kicker {
            display: block;
            width: 100%;
            color: var(--muted, #8a8a90);
            /* Labels: Montserrat (brand: monospace is for code only); 3.6cqmin is the
               28px floor of vertical.md:18 in the 780px graphics field, larger anywhere else. */
            font-family: var(--font-body, "Montserrat", sans-serif);
            font-size: 3.6cqmin;
            font-weight: 600;
            line-height: 1;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            will-change: transform, opacity;
          }

          .tc-headline {
            display: block;
            width: 100%;
            color: var(--fg, #f2f2f2);
            font-family: var(--font-display, "Bebas Neue", sans-serif);
            font-size: max(28px, 17cqmin);
            font-weight: 600;
            line-height: 0.94;
            letter-spacing: 0;
            overflow-wrap: anywhere;
            text-wrap: balance;
            will-change: transform, opacity;
          }
        </style>

        <div
          id="titlecard-calm-clip"
          class="tc-clip clip"
          data-start="0"
          data-duration="4"
          data-track-index="0"
        >
          <div class="tc-lockup">
            <span class="tc-kicker"></span>
            <span class="tc-headline"></span>
          </div>
        </div>

        <script>
          /* hostSlot: the whole-scene clip follows the host slot (komp-sobrat.py klip_hozyaina; caret-swap:219) */
          (function () {
            var c = document.getElementById("titlecard-calm-clip");
            var h = c && c.parentElement && c.parentElement.closest("[data-duration]");
            if (h) c.dataset.duration = h.dataset.duration;
          })();
        </script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var lockup = root.querySelector(".tc-lockup");
            var kicker = root.querySelector(".tc-kicker");
            var headline = root.querySelector(".tc-headline");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            var headlineText = vars.headline == null ? "Меньше, но лучше" : String(vars.headline);
            var kickerText = vars.kicker == null ? "ПРИНЦИП МОНТАЖА" : String(vars.kicker);

            headline.textContent = headlineText;
            kicker.textContent = kickerText;

            var IN_BASE = 1.2;
            var OUT_BASE = 0.55;
            var parsedDuration = Number.parseFloat(
              ((root.parentElement && root.parentElement.closest("[data-duration]")) || root)
                .dataset.duration,
            );
            var duration = Number.isFinite(parsedDuration) ? Math.max(0.001, parsedDuration) : 4;
            var totalBase = IN_BASE + OUT_BASE;
            var phaseScale = duration < totalBase ? duration / totalBase : 1;
            var IN = IN_BASE * phaseScale;
            var OUT = OUT_BASE * phaseScale;
            var HOLD = Math.max(0, duration - IN - OUT);
            var HOLD_START = IN;
            var OUT_START = IN + HOLD;
            var KICKER_IN = 0.5 * phaseScale;
            var HEADLINE_AT = 0.28 * phaseScale;
            var HEADLINE_IN = 0.72 * phaseScale;

            gsap.set(lockup, { opacity: 1, y: "0cqh" });

            var tl = gsap.timeline({ paused: true });

            tl.fromTo(
              kicker,
              { opacity: 0, y: "2.2cqh" },
              { opacity: 1, y: "0cqh", duration: KICKER_IN, ease: "power2.out" },
              0,
            );
            tl.fromTo(
              headline,
              { opacity: 0, y: "3.2cqh" },
              { opacity: 1, y: "0cqh", duration: HEADLINE_IN, ease: "power3.out" },
              HEADLINE_AT,
            );

            if (HOLD > 0) {
              tl.to(lockup, { y: "-0.65cqh", duration: HOLD, ease: "sine.inOut" }, HOLD_START);
            }

            tl.to(
              lockup,
              { opacity: 0, y: "-2.1cqh", duration: OUT, ease: "power2.in" },
              OUT_START,
            );

            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["titlecard-calm"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
