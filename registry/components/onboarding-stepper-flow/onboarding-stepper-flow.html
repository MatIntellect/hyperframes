<!--
  Timeline integration: built in, see the script below. It registers its own paused timeline as
  window.__timelines["onboarding-stepper-flow"]; mount the snippet inside a clip with data-composition-id="onboarding-stepper-flow"
  and the runtime nests it at that clip's start.
-->

<script>
  /* own timeline (component-quality-bar.md X1): the host clip carries data-composition-id="onboarding-stepper-flow" */
  (function () {
    var startTime = 0;
    var tl = gsap.timeline({ paused: true });
    tl.fromTo(
      ".hf-ui-onboarding-steps span",
      { scale: 0.7, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.28, stagger: 0.08, ease: "back.out(1.8)" },
      0.3,
    );
    tl.fromTo(
      ".hf-ui-onboarding-card",
      { y: 28, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.42, ease: "power3.out" },
      0.62,
    );
    tl.to(
      ".hf-ui-onboarding-steps .active",
      { scale: 1.16, duration: 0.16, yoyo: true, repeat: 1, ease: "power1.inOut" },
      1.1,
    );
    window.__timelines = window.__timelines || {};
    window.__timelines["onboarding-stepper-flow"] = tl;
  })();
</script>
