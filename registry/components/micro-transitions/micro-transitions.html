<!--
  Micro Transitions - transitions.dev-inspired UI motion pack for HyperFrames.

  Includes six app-transition patterns in one copy-paste snippet:
    badge pop, dropdown reveal, modal open, tab indicator, tooltip appear,
    and success check draw.

  Animate --hf-micro-progress from 0 to 1, then optionally animate
  --hf-micro-tab from 0 to 1 for the segmented control.

  Variables. The script reads each one, falls back to the declared default on
  anything missing or unrecognised, and writes either the panel wording or a
  custom property the CSS below consumes. The two progress drivers above are
  untouched by them.

    - badge (any short text, default 3): the count inside the red chip on the
      bell. Blank or non-text input falls back to the default.
    - tooltip (any short text, default Скопировано): wording inside the small dark
      tooltip.
    - colour: the badge is the brand accent of the reel palette (--brand).
    - travel (close | standard | far, default standard): scales how far every
      panel starts from its resting place, so the whole pack drifts half as far
      or nearly twice as far into position over the same progress run. At full
      progress each panel lands in exactly the same place.

  On every default: a brand-red 3 on the bell, a Скопировано tooltip, and panels
  that rise into rows sized for the 780 px graphics field of a vertical reel.
-->

<div
  class="hf-micro-transitions"
  style="--hf-micro-progress: 0; --hf-micro-tab: 0"
  data-composition-variables='[
    {"id": "badge", "type": "string", "role": "content", "label": "Badge", "description": "Count inside the notification badge on the bell.", "default": "3", "maxLength": 4},
    {"id": "tooltip", "type": "string", "role": "content", "label": "Tooltip", "description": "Wording inside the small dark tooltip.", "default": "Скопировано", "maxLength": 48},
    {"id": "travel", "type": "enum", "role": "motion", "label": "Travel", "description": "Scales how far every panel starts from its resting place before it settles.", "default": "standard", "options": [{"value": "close", "label": "Close"}, {"value": "standard", "label": "Standard"}, {"value": "far", "label": "Far"}]}
  ]'
>
  <div class="hf-micro-bell"><span>3</span></div>
  <div class="hf-micro-dropdown">
    <strong>Действия</strong>
    <p>Выгрузить, копировать, в архив</p>
  </div>
  <div class="hf-micro-modal">
    <strong>Готово к публикации?</strong><span>Все проверки пройдены</span>
  </div>
  <div class="hf-micro-tabs"><i></i><b>Черновик</b><b>В эфире</b></div>
  <div class="hf-micro-tooltip">Скопировано</div>
  <svg class="hf-micro-check" viewBox="0 0 48 48" aria-hidden="true">
    <path d="M12 25l8 8 17-19" />
  </svg>
</div>

<style>
  @font-face {
    font-family: "Bebas Neue";
    src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
    font-weight: 700;
    font-display: block;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
    unicode-range:
      U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329,
      U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
    unicode-range:
      U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329,
      U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F,
      U+A720-A7FF;
  }
  /* Vertical reel: the six patterns re-laid in rows for the 780 px graphics field (text 28 px and up),
     brand palette: dark cards, brand-red badge and tab pill, light tooltip. */
  .hf-micro-transitions {
    --hf-micro-progress: 0;
    --hf-micro-tab: 0;
    position: relative;
    width: min(700px, 100%);
    height: 820px;
    font-family: "Montserrat", system-ui, sans-serif;
    color: var(--fg, #f2f2f2);
  }
  .hf-micro-bell,
  .hf-micro-dropdown,
  .hf-micro-modal,
  .hf-micro-tabs,
  .hf-micro-tooltip,
  .hf-micro-check {
    position: absolute;
    will-change: transform, opacity;
  }
  .hf-micro-bell {
    top: 24px;
    left: 0;
    width: 120px;
    height: 120px;
    border: 2px solid var(--border, #2e2e32);
    border-radius: 36px;
    background: var(--surface, #18181a);
    box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
  }
  .hf-micro-bell::before {
    content: "";
    position: absolute;
    inset: 32px 36px 28px;
    border: 4px solid var(--fg, #f2f2f2);
    border-radius: 24px 24px 16px 16px;
  }
  .hf-micro-bell span {
    position: absolute;
    top: -16px;
    right: -16px;
    min-width: 56px;
    height: 56px;
    padding: 0 12px;
    display: grid;
    place-items: center;
    border: 5px solid var(--bg, #0c1014);
    border-radius: 999px;
    background: var(--brand, #ff0000);
    color: var(--fg, #f2f2f2);
    font-size: 28px;
    font-weight: 800;
    opacity: var(--hf-micro-progress);
    transform: translate(
        calc((1 - var(--hf-micro-progress)) * -12px * var(--hf-micro-travel, 1)),
        calc((1 - var(--hf-micro-progress)) * 16px * var(--hf-micro-travel, 1))
      )
      scale(calc(0.25 + var(--hf-micro-progress) * 0.75));
  }
  .hf-micro-tooltip {
    top: 52px;
    left: 168px;
    padding: 14px 22px;
    border-radius: 18px;
    background: var(--fg, #f2f2f2);
    color: var(--bg, #0c1014);
    font-size: 28px;
    font-weight: 700;
    opacity: var(--hf-micro-progress);
    transform: translateY(calc((1 - var(--hf-micro-progress)) * 10px * var(--hf-micro-travel, 1)))
      scale(calc(0.96 + var(--hf-micro-progress) * 0.04));
  }
  .hf-micro-modal {
    top: 200px;
    left: 0;
    right: 0;
    padding: 34px;
    border: 2px solid var(--border, #2e2e32);
    border-radius: 32px;
    background: var(--surface, #18181a);
    opacity: var(--hf-micro-progress);
    transform: translateY(calc((1 - var(--hf-micro-progress)) * 28px * var(--hf-micro-travel, 1)))
      scale(calc(0.96 + var(--hf-micro-progress) * 0.04));
    box-shadow: 0 32px 80px rgba(0, 0, 0, 0.4);
  }
  .hf-micro-dropdown {
    top: 430px;
    left: 0;
    width: 450px;
    padding: 28px 32px;
    border: 2px solid var(--border, #2e2e32);
    border-radius: 28px;
    background: var(--surface, #18181a);
    opacity: var(--hf-micro-progress);
    transform: translateY(calc((1 - var(--hf-micro-progress)) * -20px * var(--hf-micro-travel, 1)))
      scale(calc(0.95 + var(--hf-micro-progress) * 0.05));
    transform-origin: top left;
    box-shadow: 0 24px 65px rgba(0, 0, 0, 0.35);
  }
  .hf-micro-dropdown strong,
  .hf-micro-modal strong {
    display: block;
    font-size: 36px;
    line-height: 1.15;
  }
  .hf-micro-dropdown p,
  .hf-micro-modal span {
    display: block;
    margin: 12px 0 0;
    color: var(--muted, #8a8a90);
    font-size: 28px;
    line-height: 1.3;
  }
  .hf-micro-check {
    top: 470px;
    right: 40px;
    width: 140px;
    height: 140px;
    fill: none;
    stroke: var(--brand, #ff0000);
    stroke-width: 5;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: var(--hf-micro-progress);
  }
  .hf-micro-check path {
    stroke-dasharray: 42;
    stroke-dashoffset: calc((1 - var(--hf-micro-progress)) * 42);
  }
  .hf-micro-tabs {
    top: 690px;
    left: 0;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    width: 520px;
    padding: 8px;
    border-radius: 28px;
    background: color-mix(in srgb, var(--fg, #f2f2f2) 6%, var(--surface, #18181a));
    opacity: var(--hf-micro-progress);
    transform: translateY(calc((1 - var(--hf-micro-progress)) * 22px * var(--hf-micro-travel, 1)));
  }
  .hf-micro-tabs i {
    position: absolute;
    top: 8px;
    left: 8px;
    width: calc((100% - 16px - 8px) / 2);
    height: calc(100% - 16px);
    border-radius: 22px;
    background: var(--brand, #ff0000);
    transform: translateX(calc(var(--hf-micro-tab) * (100% + 8px)));
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
  }
  .hf-micro-tabs b {
    position: relative;
    z-index: 1;
    display: grid;
    place-items: center;
    height: 76px;
    color: var(--fg, #f2f2f2);
    font-size: 28px;
    font-weight: 700;
  }
</style>

<script>
  (function () {
    "use strict";

    var vars =
      window.__hyperframes && window.__hyperframes.getVariables
        ? window.__hyperframes.getVariables()
        : {};

    // Unrecognised overrides return to their declared defaults.
    function pick(table, value, fallback) {
      return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
    }

    function text(value, fallback) {
      return typeof value === "string" && value.trim() !== "" ? value.trim() : fallback;
    }

    // One accent: the reel palette (the CSS above).
    var travels = { close: 0.5, standard: 1, far: 1.9 };

    var travel = travels[pick(travels, vars.travel, "standard")];
    var badgeText = text(vars.badge, "3");
    var tooltipText = text(vars.tooltip, "Скопировано");

    var roots = document.querySelectorAll(".hf-micro-transitions");
    for (var i = 0; i < roots.length; i += 1) {
      var root = roots[i];
      root.style.setProperty("--hf-micro-travel", String(travel));
      var badge = root.querySelector(".hf-micro-bell span");
      var tooltip = root.querySelector(".hf-micro-tooltip");
      if (badge) badge.textContent = badgeText;
      if (tooltip) tooltip.textContent = tooltipText;
    }
  })();
</script>

<!--
  Timeline integration: built in, see the script below. It registers its own paused timeline as
  window.__timelines["micro-transitions"]; mount the snippet inside a clip with data-composition-id="micro-transitions"
  and the runtime nests it at that clip's start.
-->

<script>
  /* own timeline (component-quality-bar.md X1): the host clip carries data-composition-id="micro-transitions" */
  (function () {
    var startTime = 0;
    var tl = gsap.timeline({ paused: true });
    tl.to(
      ".hf-micro-transitions",
      { "--hf-micro-progress": 1, duration: 0.5, ease: "power3.out" },
      startTime,
    );
    tl.to(
      ".hf-micro-transitions",
      { "--hf-micro-tab": 1, duration: 0.35, ease: "power3.out" },
      startTime + 0.55,
    );
    window.__timelines = window.__timelines || {};
    window.__timelines["micro-transitions"] = tl;
  })();
</script>
