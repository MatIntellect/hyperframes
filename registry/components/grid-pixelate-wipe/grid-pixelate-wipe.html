<!--
  Grid Pixelate Wipe — transition effect.

  Usage: place this overlay in your composition. To transition between
  scenes, animate .grid-cell scale from 0→1 (cover) then 1→0 (reveal)
  using GSAP stagger with a "from" pattern. The cells start at scale 0
  from the first tween (fromTo), not from CSS: GSAP overwrites a CSS
  transform it animates.

  Customize:
  - COLS / ROWS: grid density (default 16×9, turned to 9×16 in a box taller
    than wide so the cells stay square), edit in the script below
  - --grid-color: cell fill color (default the reel brand red --brand: opaque
    cells that read on the reel ground --bg)
  - Stagger "from": "center" for radial, "edges" for inward, "random" for scatter
-->

<div
  id="grid-pixelate-overlay"
  data-layout-allow-occlusion
  style="
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 999;
    display: grid;
  "
></div>

<style>
  #grid-pixelate-overlay {
    --grid-color: var(--brand, #ff0000);
  }

  #grid-pixelate-overlay .grid-cell {
    background: var(--grid-color);
    transform-origin: center center;
  }
</style>

<script>
  (function () {
    const overlay = document.getElementById("grid-pixelate-overlay");
    if (!overlay) return;
    const tall = overlay.clientHeight > overlay.clientWidth;
    const COLS = tall ? 9 : 16;
    const ROWS = tall ? 16 : 9;

    overlay.style.gridTemplateColumns = `repeat(${COLS}, 1fr)`;
    overlay.style.gridTemplateRows = `repeat(${ROWS}, 1fr)`;

    for (let i = 0; i < COLS * ROWS; i++) {
      const cell = document.createElement("div");
      cell.className = "grid-cell";
      overlay.appendChild(cell);
    }
  })();
</script>

<!--
  Timeline integration: built in, see the script below. It registers its own paused timeline as
  window.__timelines["grid-pixelate-wipe"]; mount the snippet inside a clip with data-composition-id="grid-pixelate-wipe"
  and the runtime nests it at that clip's start.
-->

<script>
  /* own timeline (component-quality-bar.md X1): the host clip carries data-composition-id="grid-pixelate-wipe" */
  (function () {
    var startTime = 0;
    var tl = gsap.timeline({ paused: true });
    tl.fromTo(
      "#grid-pixelate-overlay .grid-cell",
      { scale: 0 },
      {
        scale: 1,
        duration: 0.6,
        stagger: { amount: 0.6, from: "center" },
        ease: "power2.inOut",
      },
      startTime,
    );

    // Swap scene content at midpoint
    tl.set("#scene-a", { opacity: 0 }, startTime + 0.6);
    tl.set("#scene-b", { opacity: 1 }, startTime + 0.6);

    // Reveal scene B by removing grid
    tl.to(
      "#grid-pixelate-overlay .grid-cell",
      {
        scale: 0,
        duration: 0.6,
        stagger: { amount: 0.6, from: "edges" },
        ease: "power2.inOut",
      },
      startTime + 0.6,
    );
    window.__timelines = window.__timelines || {};
    window.__timelines["grid-pixelate-wipe"] = tl;
  })();
</script>
