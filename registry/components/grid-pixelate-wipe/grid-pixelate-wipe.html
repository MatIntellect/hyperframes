<!doctype html>
<!--
  Grid Pixelate Wipe: a transition between two scenes. Opaque cells grow from the center until
  they cover the whole frame, hold, then shrink from the edges with the next scene behind them.

  Usage: mount it over both scenes, once for each cut it covers. The host fills the frame
  (style="position: absolute; inset: 0"), sits on a track above the scenes and runs 1.2 s. The
  frame is fully covered from 0.55 s to 0.65 s after the host's start: put the cut between the
  scenes at 0.6 s, so the host starts 0.6 s before the cut.

  Customize in the installed copy:
  - COLS / ROWS: grid density (default 16×9, turned to 9×16 in a box taller
    than wide so the cells stay square), edit in the script below
  - --grid-color: cell fill color (default the reel brand red --brand: opaque
    cells that read on the reel ground --bg)
  - Stagger "from": "center" for radial, "edges" for inward

  Mount contract: the runtime clones only this template. #root fills the host
  box and has no data-width or data-height. One paused timeline registers under
  the literal grid-pixelate-wipe key. The cells start at scale 0 from the first
  tween (fromTo), not from CSS: GSAP overwrites a CSS transform it animates.
-->
<html lang="en" data-composition-id="grid-pixelate-wipe" data-composition-duration="1.2">
  <head>
    <meta charset="UTF-8" />
    <title>Grid Pixelate Wipe</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="grid-pixelate-wipe" data-duration="1.2" data-fps="30">
        <style>
          #root {
            position: absolute;
            inset: 0;
            pointer-events: none;
          }

          .gpw-grid {
            --grid-color: var(--brand, #ff0000);
            position: absolute;
            inset: 0;
            display: grid;
          }

          .gpw-cell {
            background: var(--grid-color);
            transform-origin: center center;
          }
        </style>

        <div class="gpw-grid" data-layout-allow-occlusion></div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            // The cells are this mount's own: a film mounts the wipe once for each cut.
            var grid = document.getElementById("root").querySelector(".gpw-grid");
            var tall = grid.clientHeight > grid.clientWidth;
            var COLS = tall ? 9 : 16;
            var ROWS = tall ? 16 : 9;

            grid.style.gridTemplateColumns = "repeat(" + COLS + ", 1fr)";
            grid.style.gridTemplateRows = "repeat(" + ROWS + ", 1fr)";

            var cells = [];
            for (var i = 0; i < COLS * ROWS; i++) {
              var cell = document.createElement("div");
              cell.className = "gpw-cell";
              grid.appendChild(cell);
              cells.push(cell);
            }

            var tl = gsap.timeline({ paused: true });
            tl.fromTo(
              cells,
              { scale: 0 },
              {
                scale: 1,
                duration: 0.3,
                stagger: { amount: 0.25, from: "center" },
                ease: "power2.inOut",
              },
              0,
            );

            // The last cell has covered by 0.55 s; the host cuts between its scenes at 0.6 s.
            // Reveal the next scene by removing the grid
            tl.to(
              cells,
              {
                scale: 0,
                duration: 0.3,
                stagger: { amount: 0.25, from: "edges" },
                ease: "power2.inOut",
              },
              0.65,
            );

            window.__timelines = window.__timelines || {};
            window.__timelines["grid-pixelate-wipe"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
