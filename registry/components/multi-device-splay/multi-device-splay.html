<!doctype html>
<!--
  multi-device-splay: HyperFrames video primitive (ui-props / devices / reveal)

  Concept: phone, tablet, and desktop product mockups begin as one centered
  stack, then fan into a proud three-device arrangement. Each screen uses the
  same brand accent while keeping a layout skeleton suited to its form factor.

  Variables:

  Envelope: fixed IN and OUT with elastic HOLD only, never timeScale.
    IN   1.35s fixed  devices fan out in phone, tablet, desktop order with a
                      0.12s cascade and overshoot settle.
    HOLD elastic      the settled devices float subtly around their final
                      -12, 0, and +12 degree rotations.
    OUT  0.55s fixed  the arrangement recedes and fades as one lockup.
    If duration is shorter than IN + OUT, both fixed phases shrink by the
    same ratio and HOLD becomes zero.

  Mount contract: the runtime clones only this template. #root fills the host
  box, establishes the cqw/cqh basis, has no data-width or data-height, and
  registers one paused timeline under the hardcoded multi-device-splay id.
-->
<html
  lang="en"
  data-composition-id="multi-device-splay"
  data-composition-duration="4.5"
  data-composition-variables="[

  ]"
>

    <title>Multi Device Splay</title>

        <script>
          /* hostSlot: the whole-scene clip follows the host slot (komp-sobrat.py klip_hozyaina; caret-swap:219) */
          (function () {
            var c = document.getElementById("multi-device-splay-clip");
            var h = c && c.parentElement && c.parentElement.closest("[data-duration]");
            if (h) c.dataset.duration = h.dataset.duration;
          })();
        </script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            // One palette: the shared product accent on all three screens is brand red.
            root.style.setProperty("--mds-accent", "var(--brand, #ff0000)");

            var IN_BASE = 1.35;
            var OUT_BASE = 0.55;
            var duration = Math.max(
              0.001,
              parseFloat(
                ((root.parentElement && root.parentElement.closest("[data-duration]")) || root)
                  .dataset.duration || "4.5",
              ),
            );
            var totalBase = IN_BASE + OUT_BASE;
            var envelopeScale = duration < totalBase ? duration / totalBase : 1;
            var IN = IN_BASE * envelopeScale;
            var OUT = OUT_BASE * envelopeScale;
            var HOLD = Math.max(0, duration - IN - OUT);
            var HOLD_START = IN;
            var OUT_START = IN + HOLD;

            var devices = [
              {
                element: root.querySelector('[data-device="phone"]'),
                x: -30,
                y: 3.5,
                rotation: -12,
                floatY: -0.65,
                floatRotation: -0.55,
              },
              {
                element: root.querySelector('[data-device="tablet"]'),
                x: -5,
                y: -1,
                rotation: 0,
                floatY: 0.7,
                floatRotation: 0.35,
              },
              {
                element: root.querySelector('[data-device="desktop"]'),
                x: 24,
                y: 2,
                rotation: 12,
                floatY: -0.5,
                floatRotation: 0.5,
              },
            ];

            // Portrait restack (see .mds-portrait): monitor on top, tablet left,
            // phone right, each fully inside the field.
            if (root.clientHeight > root.clientWidth) {
              root.classList.add("mds-portrait");
              var PORTRAIT = {
                phone: { x: 22, y: 24, rotation: 8 },
                tablet: { x: -14, y: 20, rotation: -5 },
                desktop: { x: 0, y: -22, rotation: 0 },
              };
              devices.forEach(function (device) {
                var pose = PORTRAIT[device.element.getAttribute("data-device")];
                device.x = pose.x;
                device.y = pose.y;
                device.rotation = pose.rotation;
              });
            }

            // The scene fades in and out as ONE plate: per-device opacity let
            // the devices show through each other on the way in and out.
            var stage = root.querySelector(".mds-stage");

            var CASCADE = 0.12 * envelopeScale;
            var FAN_DURATION = 0.9 * envelopeScale;
            var tl = gsap.timeline({ paused: true });

            gsap.set(stage, { opacity: 0 });
            tl.to(stage, { opacity: 1, duration: 0.35 * envelopeScale, ease: "power1.out" }, 0);
            tl.to(stage, { opacity: 0, duration: OUT, ease: "power2.in" }, OUT_START);

            devices.forEach(function (device, index) {
              gsap.set(device.element, {
                x: "0cqw",
                y: "9cqh",
                rotation: 0,
                scale: 0.9,
              });
              tl.to(
                device.element,
                {
                  x: device.x + "cqw",
                  y: device.y + "cqh",
                  rotation: device.rotation,
                  scale: 1,
                  duration: FAN_DURATION,
                  ease: "back.out(1.7)",
                },
                index * CASCADE,
              );
            });

            if (HOLD > 0) {
              devices.forEach(function (device) {
                tl.to(
                  device.element,
                  {
                    y: device.y + device.floatY + "cqh",
                    rotation: device.rotation + device.floatRotation,
                    duration: HOLD / 2,
                    ease: "sine.inOut",
                  },
                  HOLD_START,
                );
                tl.to(
                  device.element,
                  {
                    y: device.y + "cqh",
                    rotation: device.rotation,
                    duration: HOLD / 2,
                    ease: "sine.inOut",
                  },
                  HOLD_START + HOLD / 2,
                );
              });
            }

            devices.forEach(function (device) {
              tl.to(
                device.element,
                {
                  y: device.y + 5 + "cqh",
                  scale: 0.96,
                  duration: OUT,
                  ease: "power2.in",
                },
                OUT_START,
              );
            });

            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["multi-device-splay"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
