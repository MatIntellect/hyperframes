<!--
  Timeline integration: built in, see the script below. It registers its own paused timeline as
  window.__timelines["svg-line-draw-loader"]; mount the snippet inside a clip with data-composition-id="svg-line-draw-loader"
  and the runtime nests it at that clip's start.
-->

<script>
  /* own timeline (component-quality-bar.md X1): the host clip carries data-composition-id="svg-line-draw-loader" */
  (function () {
    var startTime = 0;
    var tl = gsap.timeline({ paused: true });
    tl.fromTo(
      ".hf-advanced-svg-line-draw-loader path",
      { "--hf-dash": 900 },
      { "--hf-dash": 0, duration: 1.35, ease: "power3.inOut" },
      startTime,
    );
    window.__timelines = window.__timelines || {};
    window.__timelines["svg-line-draw-loader"] = tl;
  })();
</script>
