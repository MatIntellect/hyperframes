<!--
  Spotlight Card - catalog component for HyperFrames.

  Paste the markup and CSS into a composition. Drive the timeline integration
  from a paused GSAP timeline so renders remain deterministic.
-->

<div class="hf-catalog-spotlight-card">
  <div class="mesh" data-layout-ignore></div>
  <div class="card">
    <div class="spot" data-layout-ignore></div>
    <div>
      <h3>Свет за курсором</h3>
      <p>Пятно света ведёт взгляд по карточке</p>
    </div>
  </div>
</div>

<style>

  @font-face {
    font-family: "Montserrat";

      U+A720-A7FF;
  }
  .hf-catalog-spotlight-card {
    --hf-accent: var(--accent, #ff0000);
    --hf-ink: var(--fg, #f2f2f2);
    --hf-muted: var(--muted, #8a8a90);
    --hf-surface: var(--surface, #18181a);
    color: var(--hf-ink);

  }
  .hf-catalog-spotlight-card {

    height: 440px;

    border: 2px solid var(--border, #2e2e32);
    box-shadow: 0 28px 80px rgba(0, 0, 0, 0.35);

<!--
  Timeline integration: built in, see the script below. It registers its own paused timeline as
  window.__timelines["spotlight-card"]; mount the snippet inside a clip with data-composition-id="spotlight-card"
  and the runtime nests it at that clip's start.
-->

<script>
  /* own timeline (component-quality-bar.md X1): the host clip carries data-composition-id="spotlight-card" */
  (function () {
    var startTime = 0;
    var tl = gsap.timeline({ paused: true });
    tl.fromTo(
      ".hf-catalog-spotlight-card .mesh",
      {
        "--hf-x1": "18%",
        "--hf-y1": "28%",
        "--hf-x2": "78%",
        "--hf-y2": "46%",
        "--hf-x3": "44%",
        "--hf-y3": "80%",
      },
      {
        "--hf-x1": "34%",
        "--hf-y1": "42%",
        "--hf-x2": "62%",
        "--hf-y2": "60%",
        "--hf-x3": "58%",
        "--hf-y3": "64%",
        duration: 4,
        ease: "sine.inOut",
      },
      startTime,
    );
    tl.fromTo(
      ".hf-catalog-spotlight-card .spot",
      { "--hf-spot-x": "-120px", "--hf-spot-y": "-70px" },
      { "--hf-spot-x": "190px", "--hf-spot-y": "90px", duration: 3, ease: "sine.inOut" },
      startTime,
    );
    const particles_spotlight_card = gsap.utils.toArray(".hf-catalog-spotlight-card .particle");
    if (particles_spotlight_card.length) {
      tl.fromTo(
        particles_spotlight_card,
        { "--hf-po": 0, "--hf-px": "0px", "--hf-py": "0px", "--hf-pr": "0deg" },
        {
          "--hf-po": 1,
          "--hf-px": (i) => Math.cos(i * 0.83) * 250 + "px",
          "--hf-py": (i) => -120 - Math.sin(i * 0.61) * 120 + "px",
          "--hf-pr": (i) => 180 + i * 37 + "deg",
          duration: 0.8,
          stagger: 0.015,
          ease: "power2.out",
        },
        startTime + 0.2,
      );
    }
    window.__timelines = window.__timelines || {};
    window.__timelines["spotlight-card"] = tl;
  })();
</script>
