<!doctype html>
<!--
  logo-sting: HyperFrames video primitive (brand / impact / reveal)

  Concept: a wordmark lands from scale 1.15 with the slam ease. Its impact
  triggers one accent ring and exactly one frame of white, then the finished
  lockup holds completely still.

  Variables:
    - wordmark (string, default "MATINTELLECT"): the brand name.

  Envelope (fixed IN, elastic HOLD, no OUT, never timeScale):
    IN_BASE = 0.95s. The wordmark lands at 0.55s, then the ring resolves.
    HOLD = max(0, D - IN). This phase is deliberately dead still.
    OUT = 0s. The final brand frame remains established through the end.
    If D is shorter than IN_BASE, only IN compresses and HOLD becomes zero.

  Mount contract: this template is cloned into a sized host. #root fills that
  host, establishes the container query basis, and registers one paused GSAP
  timeline under the hardcoded logo-sting key.
-->
<html
  lang="en"
  data-composition-id="logo-sting"
  data-composition-duration="2.2"
  data-composition-variables='[
    {"id": "wordmark", "type": "string", "role": "content", "label": "Wordmark", "description": "Brand name displayed in the final lockup.", "default": "MATINTELLECT"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Logo Sting</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="logo-sting" data-duration="2.2" data-fps="30">
        <style>
          @font-face {
            font-family: "Bebas Neue";
            src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
            font-weight: 700;
            font-display: block;
          }
          @font-face {
            font-family: "Montserrat";
            src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
            font-weight: 100 900;
            font-display: block;
            unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
          }
          @font-face {
            font-family: "Montserrat";
            src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
            font-weight: 100 900;
            font-display: block;
            unicode-range:
              U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
              U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
          }
          @font-face {
            font-family: "Montserrat";
            src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
            font-weight: 100 900;
            font-display: block;
            unicode-range:
              U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308,
              U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4,
              U+2113, U+2C60-2C7F, U+A720-A7FF;
          }
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            container-type: size;
            background: var(--bg, #0c1014);
            color: var(--fg, #f2f2f2);
            font-family: var(--font-display, "Bebas Neue", sans-serif);
            pointer-events: none;
          }

          .ls-clip {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
          }

          .ls-ring {
            position: absolute;
            z-index: 1;
            width: min(42cqw, 72cqh);
            aspect-ratio: 1;
            border: min(0.34cqw, 0.62cqh) solid var(--ls-accent);
            border-radius: 50%;
            opacity: 0;
            will-change: transform, opacity;
          }

          .ls-wordmark {
            position: relative;
            z-index: 2;
            max-width: 90cqw;
            color: var(--fg, #f2f2f2);
            font-size: max(28px, min(10.5cqw, 18cqh));
            font-weight: 850;
            line-height: 0.9;
            letter-spacing: -0.055em;
            text-align: center;
            white-space: nowrap;
            transform-origin: 50% 50%;
            will-change: transform;
          }

          .ls-flash {
            position: absolute;
            inset: 0;
            z-index: 3;
            background: var(--fg, #f2f2f2);
            opacity: 0;
          }
        </style>

        <div
          id="logo-sting-clip"
          class="ls-clip clip"
          data-start="0"
          data-duration="2.2"
          data-track-index="0"
        >
          <div class="ls-ring" aria-hidden="true"></div>
          <div class="ls-wordmark"></div>
          <div class="ls-flash" aria-hidden="true"></div>
        </div>

        <script>
          /* hostSlot: the whole-scene clip follows the host slot (komp-sobrat.py klip_hozyaina; caret-swap:219) */
          (function () {
            var c = document.getElementById("logo-sting-clip");
            var h = c && c.parentElement && c.parentElement.closest("[data-duration]");
            if (h) c.dataset.duration = h.dataset.duration;
          })();
        </script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var wordmark = root.querySelector(".ls-wordmark");
            var ring = root.querySelector(".ls-ring");
            var flash = root.querySelector(".ls-flash");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            var wordmarkText = vars.wordmark == null ? "MATINTELLECT" : String(vars.wordmark);

            wordmark.textContent = wordmarkText;
            // One palette: the ring rides the reel's brand red.
            root.style.setProperty("--ls-accent", "var(--brand, #ff0000)");

            var IN_BASE = 0.95;
            var IMPACT_BASE = 0.55;
            var parsedDuration = parseFloat(
              ((root.parentElement && root.parentElement.closest("[data-duration]")) || root)
                .dataset.duration,
            );
            var duration = Number.isFinite(parsedDuration) ? Math.max(0.001, parsedDuration) : 2.2;
            var IN = Math.min(IN_BASE, duration);
            var retime = IN / IN_BASE;
            var IMPACT = IMPACT_BASE * retime;
            var RING_DURATION = (IN_BASE - IMPACT_BASE) * retime;
            var FLASH_FRAME = Math.min(1 / 30, RING_DURATION);
            var HOLD = Math.max(0, duration - IN);

            gsap.set(ring, { scale: 0.34, opacity: 0 });
            gsap.set(flash, { opacity: 0 });

            var tl = gsap.timeline({ paused: true });

            tl.fromTo(
              wordmark,
              { scale: 1.15 },
              { scale: 1, duration: IMPACT, ease: "expo.out" },
              0,
            );
            tl.set(ring, { opacity: 0.92 }, IMPACT);
            tl.to(
              ring,
              { scale: 2.4, opacity: 0, duration: RING_DURATION, ease: "power3.out" },
              IMPACT,
            );
            tl.set(flash, { opacity: 1 }, IMPACT);
            tl.set(flash, { opacity: 0 }, IMPACT + FLASH_FRAME);
            tl.addLabel("hold", IN);
            tl.addLabel("end", IN + HOLD);

            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["logo-sting"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
