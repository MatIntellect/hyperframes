<!--
  Terminal Simulator - catalog component for HyperFrames.

  Paste the markup and CSS into a composition. Drive the timeline integration
  from a paused GSAP timeline so renders remain deterministic.
-->

<div class="hf-catalog-terminal-simulator">
  <div class="chrome"><span class="dot"></span><span>Терминал</span></div>
  <div class="body">
    <div class="files">index.html<br />style.css<br />timeline.js</div>
    <div class="editor">
      <span class="line" style="width: 92%"></span><span class="line" style="width: 72%"></span
      ><span class="line" style="width: 84%"></span><span class="line" style="width: 58%"></span
      ><span class="line" style="width: 78%"></span>
    </div>
  </div>
  <div class="terminal"><span class="prompt">$</span> npx hyperframes render</div>
</div>

<style>

      U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
    unicode-range:
      U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329,
      U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F,
      U+A720-A7FF;
  }
  /* Vertical reel: sized for the 780 px graphics field, brand palette (an own editor mock,
     not a specific program): window --surface, panes --bg, hairlines --border, muted

  .hf-catalog-terminal-simulator {
    width: 700px;
    max-width: 100%;
    border: 2px solid var(--border, #2e2e32);
    border-radius: 32px;
    overflow: hidden;
    background: var(--surface, #18181a);
    color: var(--fg, #f2f2f2);
    box-shadow: 0 28px 80px rgba(0, 0, 0, 0.35);
    font-family: var(--font-mono, ui-monospace, Menlo, monospace);
    font-size: 28px;
    line-height: 1.4;
  }
  .hf-catalog-terminal-simulator .chrome {
    height: 76px;
    display: flex;
    align-items: center;
    gap: 70px;
    padding: 0 28px;
    border-bottom: 2px solid var(--border, #2e2e32);
    color: var(--muted, #8a8a90);
    font-family: var(--font-body, "Montserrat", sans-serif);
    font-weight: 600;
  }
  .hf-catalog-terminal-simulator .dot {

  .hf-catalog-terminal-simulator .line {

    padding: 24px 28px 30px;
    border-top: 2px solid var(--border, #2e2e32);
    color: var(--fg, #f2f2f2);
    min-height: 110px;
    overflow-wrap: anywhere;
  }
  .hf-catalog-terminal-simulator .prompt {
    color: var(--brand, #ff0000);
  }
</style>

<!--
  Timeline integration: built in, see the script below. It registers its own paused timeline as
  window.__timelines["terminal-simulator"]; mount the snippet inside a clip with data-composition-id="terminal-simulator"
  and the runtime nests it at that clip's start.
-->

<script>
  /* own timeline (component-quality-bar.md X1): the host clip carries data-composition-id="terminal-simulator" */
  (function () {
    var startTime = 0;
    var tl = gsap.timeline({ paused: true });
    tl.fromTo(
      ".hf-catalog-terminal-simulator .line",
      { "--hf-line": 0, "--hf-line-opacity": 0 },
      { "--hf-line": 1, "--hf-line-opacity": 1, duration: 0.24, stagger: 0.08, ease: "power2.out" },
      startTime,
    );
    tl.fromTo(
      ".hf-catalog-terminal-simulator .terminal",
      { opacity: 0, y: 16 },
      { opacity: 1, y: 0, duration: 0.34, ease: "power2.out" },
      startTime + 0.48,
    );
    window.__timelines = window.__timelines || {};
    window.__timelines["terminal-simulator"] = tl;
  })();
</script>
