<!doctype html>
<!--
  locked-nucleus-orbit: HyperFrames video primitive (intros / reveals / orbit)

  One nucleus stays dead center for the full composition. Satellite rings and
  copy chips fade in while orbiting on deterministic index-based phases, then
  decelerate into a composed lockup. The nucleus is never a GSAP target.

  Variables:
    - label (string, default "Идея"): text inside the fixed nucleus.
    The accent rides the reel brand red (--brand).
    - satellites (number, 3 to 6, default 4): visible satellite count.
    - words (string, comma-separated): satellite words, one per chip.

  Envelope (fixed IN and ORBIT, elastic HOLD, no OUT):
    IN_BASE    = 0.45s, rings and chips fade in along their orbital arcs
    ORBIT_BASE = 1.75s, satellites decelerate into their final phases
    HOLD       = max(0, D - (IN + ORBIT)), only ring opacity breathes
    OUT        = 0s, the composed lockup is the final state
    If D is shorter than IN_BASE + ORBIT_BASE, IN and ORBIT compress together.

  Mount contract: the runtime clones only this template. #root fills the host
  box, has no data-width or data-height, and registers one paused timeline
  under the hardcoded locked-nucleus-orbit id.
-->
<html
  lang="en"
  data-composition-id="locked-nucleus-orbit"
  data-composition-duration="4"
  data-composition-variables='[
    {"id": "label", "type": "string", "role": "content", "label": "Nucleus label", "description": "Text displayed inside the fixed center nucleus.", "default": "Идея"},
    {"id": "satellites", "type": "number", "role": "layout", "label": "Satellites", "description": "Number of orbiting copy chips.", "default": 4, "min": 3, "max": 6, "step": 1},
    {"id": "words", "type": "string", "role": "content", "label": "Satellite words", "description": "Comma-separated satellite words, one per chip; a missing entry keeps the default word.", "default": "звук,свет,кадры,монтаж,цвет,титры"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Locked Nucleus Orbit</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="locked-nucleus-orbit" data-duration="4" data-fps="30">
        <style>
          @font-face {
            font-family: "Bebas Neue";
            src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
            font-weight: 700;
            font-display: block;
          }
          @font-face {
            font-family: "Montserrat";
            src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
            font-weight: 100 900;
            font-display: block;
            unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
          }
          @font-face {
            font-family: "Montserrat";
            src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
            font-weight: 100 900;
            font-display: block;
            unicode-range:
              U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
              U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
          }
          @font-face {
            font-family: "Montserrat";
            src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
            font-weight: 100 900;
            font-display: block;
            unicode-range:
              U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308,
              U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4,
              U+2113, U+2C60-2C7F, U+A720-A7FF;
          }
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            container-type: size;
            isolation: isolate;
            background: var(--bg, #0c1014);
            color: var(--fg, #f2f2f2);
            font-family: var(--font-body, "Montserrat", sans-serif);
            pointer-events: none;
          }

          .lno-clip {
            position: absolute;
            inset: 0;
            overflow: hidden;
          }

          .lno-field {
            position: absolute;
            inset: 0;
          }

          .lno-ring {
            position: absolute;
            left: 50%;
            top: 50%;
            width: var(--lno-size);
            aspect-ratio: 1;
            border: 0.12cqmin solid color-mix(in srgb, var(--lno-accent) 34%, transparent);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transform-origin: 50% 50%;
            box-shadow: inset 0 0 3cqmin color-mix(in srgb, var(--lno-accent) 5%, transparent);
            opacity: 0;
          }

          .lno-ring:nth-child(1) {
            --lno-size: 46cqmin;
          }

          .lno-ring:nth-child(2) {
            --lno-size: 58cqmin;
          }

          .lno-ring:nth-child(3) {
            --lno-size: 70cqmin;
          }

          .lno-nucleus {
            position: absolute;
            left: 50%;
            top: 50%;
            /* 15cqmin held an 86px label: at the 28px floor a word did not fit */
            width: var(--lno-core, 22cqmin);
            aspect-ratio: 1;
            display: grid;
            place-items: center;
            transform: translate(-50%, -50%);
            border: 0.3cqmin solid var(--lno-accent);
            border-radius: 50%;
            /* clean plate: red mixed into surface gave brown, white into red gave pink */
            background: var(--surface, #18181a);
            box-shadow:
              0 0 2.8cqmin color-mix(in srgb, var(--lno-accent) 38%, transparent),
              inset 0 0 2.2cqmin color-mix(in srgb, var(--lno-accent) 18%, transparent);
            z-index: 3;
          }

          .lno-nucleus::before {
            content: "";
            position: absolute;
            width: 2.4cqmin;
            aspect-ratio: 1;
            top: 2.5cqmin;
            border-radius: 50%;
            background: var(--lno-accent);
            box-shadow: 0 0 1.8cqmin color-mix(in srgb, var(--lno-accent) 72%, transparent);
          }

          .lno-nucleus-label {
            max-width: 82%;
            margin-top: 3.1cqmin;
            text-align: center;
            color: var(--fg, #f2f2f2);
            font-family: var(--font-body, "Montserrat", sans-serif);
            font-size: max(28px, 2.6cqmin);
            font-weight: 700;
            letter-spacing: 0.02em;
            line-height: 1.15;

            text-transform: uppercase;
            white-space: normal;
            /* a word wider than the largest nucleus (30cqmin at the 28 px floor) wraps inside
               the circle instead of running across the first orbit */
            overflow-wrap: anywhere;
          }

          .lno-arm {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 0;
            height: 0;
            transform-origin: 0 0;
          }

          .lno-anchor {
            position: absolute;
            left: var(--lno-radius);
            top: 0;
            transform: translate(-50%, -50%);
          }

          .lno-chip {
            min-width: 12cqmin;
            max-width: 34cqmin;
            min-height: 5.2cqmin;
            display: flex;
            align-items: center;
            gap: 1.25cqmin;
            padding: 1.1cqmin 1.8cqmin;
            border: 0.12cqmin solid var(--border, #2e2e32);
            border-radius: 999px;
            background: color-mix(in srgb, var(--surface, #18181a) 90%, transparent);
            box-shadow: 0 1.2cqmin 3.6cqmin color-mix(in srgb, var(--bg, #0c1014) 60%, transparent);
            opacity: 0;
            will-change: transform, opacity;
          }

          .lno-marker {
            flex: 0 0 auto;
            width: 2.4cqmin;
            aspect-ratio: 1;
            border: 0.32cqmin solid var(--lno-accent);
            border-radius: 50%;
            box-shadow: 0 0 1.4cqmin color-mix(in srgb, var(--lno-accent) 56%, transparent);
          }

          .lno-copy {
            color: var(--fg, #f2f2f2);
            font-family: var(--font-body, "Montserrat", sans-serif);
            font-size: clamp(28px, 1.8cqmin, 18px);
            font-weight: 650;
            letter-spacing: 0.04em;
            /* line-height 1 with overflow hidden cut Cyrillic caps at their own box */
            line-height: 1.2;
            text-transform: uppercase;
            white-space: normal;
            /* a word wider than the largest nucleus (30cqmin at the 28 px floor) wraps inside
               the circle instead of running across the first orbit */
            overflow-wrap: anywhere;
          }
        </style>

        <div
          id="locked-nucleus-orbit-clip"
          class="lno-clip clip"
          data-start="0"
          data-duration="4"
          data-track-index="0"
        >
          <div class="lno-field">
            <div class="lno-ring" aria-hidden="true"></div>
            <div class="lno-ring" aria-hidden="true"></div>
            <div class="lno-ring" aria-hidden="true"></div>
            <div class="lno-satellites"></div>
            <div class="lno-nucleus">
              <span class="lno-nucleus-label"></span>
            </div>
          </div>
        </div>

        <script>
          /* hostSlot: the whole-scene clip follows the host slot (komp-sobrat.py klip_hozyaina; caret-swap:219) */
          (function () {
            var c = document.getElementById("locked-nucleus-orbit-clip");
            var h = c && c.parentElement && c.parentElement.closest("[data-duration]");
            if (h) c.dataset.duration = h.dataset.duration;
          })();
        </script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var label = root.querySelector(".lno-nucleus-label");
            var satelliteLayer = root.querySelector(".lno-satellites");
            var rings = root.querySelectorAll(".lno-ring");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            // One palette: the accent rides the reel brand red.
            var accentColors = { brand: "var(--brand, #ff0000)" };
            var accent = "brand";
            var countValue = Number(vars.satellites);
            var satelliteCount =
              vars.satellites != null && Number.isFinite(countValue)
                ? Math.max(3, Math.min(6, Math.round(countValue)))
                : 4;
            var labelText = vars.label == null ? "Идея" : String(vars.label);
            var defaultCopy = ["звук", "свет", "кадры", "монтаж", "цвет", "титры"];
            var givenCopy = vars.words == null ? [] : String(vars.words).split(",");
            var copy = defaultCopy.map(function (word, i) {
              var given = givenCopy[i] == null ? "" : givenCopy[i].trim();
              return given || word;
            });
            var radii = [23, 29, 35];

            root.style.setProperty("--lno-accent", accentColors[accent]);
            label.textContent = labelText;

            // The nucleus grows to hold its longest label word at the 28 px floor (a word wider
            // than the 22cqmin plate crossed the ring); up to 30cqmin, inside the first orbit.
            // Word widths exist only after the fonts load (runtimes.md:7, path-tracing.md:27).
            function fitNucleus() {
              var box = root.getBoundingClientRect();
              var cqmin = Math.min(box.width, box.height) / 100;
              if (!cqmin) return;
              var probe = label.cloneNode(false);
              probe.style.cssText =
                "position:absolute;visibility:hidden;max-width:none;white-space:nowrap";
              label.parentNode.appendChild(probe);
              var longest = 0;
              labelText.split(/\s+/).forEach(function (word) {
                probe.textContent = word;
                longest = Math.max(longest, probe.getBoundingClientRect().width);
              });
              probe.remove();
              var core = Math.min(30, Math.max(22, longest / 0.78 / cqmin + 1));
              root.style.setProperty("--lno-core", core.toFixed(2) + "cqmin");
            }
            fitNucleus();
            window.__hf = window.__hf || {};
            window.__hf.buildReady = window.__hf.buildReady || {};
            window.__hf.buildReady["locked-nucleus-orbit"] = document.fonts.ready.then(fitNucleus);

            var satellites = [];
            for (var index = 0; index < satelliteCount; index += 1) {
              var arm = document.createElement("div");
              var anchor = document.createElement("div");
              var chip = document.createElement("div");
              var marker = document.createElement("span");
              var chipCopy = document.createElement("span");

              arm.className = "lno-arm";
              anchor.className = "lno-anchor";
              chip.className = "lno-chip";
              marker.className = "lno-marker";
              chipCopy.className = "lno-copy";
              arm.style.setProperty("--lno-radius", radii[index % radii.length] + "cqmin");
              chipCopy.textContent = copy[index];

              chip.appendChild(marker);
              chip.appendChild(chipCopy);
              anchor.appendChild(chip);
              arm.appendChild(anchor);
              satelliteLayer.appendChild(arm);

              var finalPhase = -90 + (360 * index) / satelliteCount;
              var travel = 210 + (index % 3) * 70;
              satellites.push({
                arm: arm,
                chip: chip,
                startPhase: finalPhase - travel,
                finalPhase: finalPhase,
              });
            }

            var IN_BASE = 0.45;
            var ORBIT_BASE = 1.75;
            var duration = Math.max(
              0.001,
              parseFloat(
                ((root.parentElement && root.parentElement.closest("[data-duration]")) || root)
                  .dataset.duration || "4",
              ),
            );
            var motionBase = IN_BASE + ORBIT_BASE;
            var motionScale = duration < motionBase ? duration / motionBase : 1;
            var IN = IN_BASE * motionScale;
            var ORBIT = ORBIT_BASE * motionScale;
            var MOTION = IN + ORBIT;
            var HOLD = Math.max(0, duration - MOTION);
            var fadeStagger = Math.min(0.07, IN / (satelliteCount * 2));
            var fadeDuration = Math.max(0.001, IN - fadeStagger * (satelliteCount - 1));

            gsap.set(rings, { opacity: 0, scale: 0.86 });
            satellites.forEach(function (satellite) {
              gsap.set(satellite.arm, { rotation: satellite.startPhase });
              gsap.set(satellite.chip, {
                opacity: 0,
                rotation: -satellite.startPhase,
                scale: 0.82,
              });
            });

            var tl = gsap.timeline({ paused: true });

            tl.to(rings, { opacity: 0.38, scale: 1, duration: IN, ease: "power2.out" }, 0);

            satellites.forEach(function (satellite, index) {
              tl.to(
                satellite.arm,
                { rotation: satellite.finalPhase, duration: MOTION, ease: "power2.out" },
                0,
              );
              tl.to(
                satellite.chip,
                { rotation: -satellite.finalPhase, duration: MOTION, ease: "power2.out" },
                0,
              );
              tl.to(
                satellite.chip,
                {
                  opacity: 1,
                  scale: 1,
                  duration: fadeDuration,
                  ease: "back.out(1.7)",
                },
                index * fadeStagger,
              );
            });

            if (HOLD > 0.2) {
              tl.to(
                rings,
                {
                  opacity: 0.5,
                  duration: HOLD / 2,
                  ease: "sine.inOut",
                  yoyo: true,
                  repeat: 1,
                },
                MOTION,
              );
            }

            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["locked-nucleus-orbit"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
