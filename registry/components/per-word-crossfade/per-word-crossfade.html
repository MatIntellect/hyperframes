<!--
  Per-Word Crossfade - typography primitive for HyperFrames.

  Paste the markup, CSS and script into a composition. Drive the timeline
  integration from a paused GSAP timeline so renders remain deterministic.

  Variables. The script reads each one, falls back to the declared default on
  anything missing or unrecognised, and either rewrites the words or writes a
  custom property the CSS below consumes. The timeline recipe at the end is
  untouched by them: it keeps driving one offset and one blur, and these
  decide what that offset and that blur mean on screen.

    - text (string, default "Снял раз выложил везде"): the line to
      animate. It is split on whitespace and every word gets its own span, so
      the stagger picks up the new words with no other change.
    - drift (close | standard | far, default standard): scales the vertical
      offset. close covers half the run, far nearly double, in the same time.
    - blur (soft | standard | heavy, default standard): scales the blur
      radius, from a light haze to a full smear.
    - tone (ink | paper | accent, default paper: the reels are dark): word colour. ink is near-black
      for light frames, paper near-white for dark ones, accent rides --brand.

  On every default the result is identical to the original: four near-black
  words drifting 22px up through a 5px blur.
-->

<div
  class="hf-catalog-per-word-crossfade"
  data-composition-variables='[
    { "id": "text", "type": "string", "role": "content", "label": "Text", "description": "The line to animate. It is split on whitespace and every word gets its own span, so the stagger picks up the new words.", "default": "Снял раз выложил везде" },
    { "id": "drift", "type": "enum", "role": "motion", "label": "Drift", "description": "Scales the vertical offset, so the words cover a shorter or longer run in the same time.", "default": "standard", "options": [{ "value": "close", "label": "Close" }, { "value": "standard", "label": "Standard" }, { "value": "far", "label": "Far" }] },
    { "id": "blur", "type": "enum", "role": "style", "label": "Blur", "description": "Scales the blur radius the timeline drives, from a light haze to a full smear.", "default": "standard", "options": [{ "value": "soft", "label": "Soft" }, { "value": "standard", "label": "Standard" }, { "value": "heavy", "label": "Heavy" }] },
    { "id": "tone", "type": "enum", "role": "style", "label": "Tone", "description": "Word colour: ink for light frames, paper for dark ones, accent rides --brand.", "default": "paper", "options": [{ "value": "ink", "label": "Ink" }, { "value": "paper", "label": "Paper" }, { "value": "accent", "label": "Accent" }] }
  ]'
>
  <span>Снял</span><span>раз</span><span>выложил</span><span>везде</span>
</div>

<style>
  @font-face {
    font-family: "Bebas Neue";
    src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
    font-weight: 700;
    font-display: block;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
    unicode-range:
      U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329,
      U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
    unicode-range:
      U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329,
      U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F,
      U+A720-A7FF;
  }
  .hf-catalog-per-word-crossfade {
    color: var(--hf-word-color, var(--fg, #f2f2f2));
    font-family: "Montserrat", system-ui, sans-serif;
    font-weight: 900;
    letter-spacing: -0.04em;
  }
  .hf-catalog-per-word-crossfade {
    display: inline-flex;
    /* a long line wraps by word inside the space the host gives, 56 px stays */
    flex-wrap: wrap;
    justify-content: center;
    max-width: 100%;
    gap: 8px 12px;
    font-size: 56px;
    line-height: 1;
  }
  .hf-catalog-per-word-crossfade span {
    display: inline-block;
    transform: translate(
        var(--hf-word-x, 0px),
        calc(var(--hf-word-y, 0px) * var(--hf-word-drift, 1))
      )
      scale(var(--hf-word-scale, 1));
    filter: blur(calc(var(--hf-word-blur, 0px) * var(--hf-word-blur-scale, 1)));
    will-change: transform, filter, opacity;
  }
</style>

<script>
  (function () {
    "use strict";

    var vars =
      window.__hyperframes && window.__hyperframes.getVariables
        ? window.__hyperframes.getVariables()
        : {};

    // Unrecognised overrides return to their declared defaults.
    var drifts = { close: 0.5, standard: 1, far: 1.85 };
    var blurScales = { soft: 0.45, standard: 1, heavy: 2.2 };
    var tones = {
      ink: "var(--bg, #0c1014)",
      paper: "var(--fg, #f2f2f2)",
      accent: "var(--brand, #ff0000)",
    };

    function pick(table, value, fallback) {
      return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
    }

    var drift = drifts[pick(drifts, vars.drift, "standard")];
    var blurScale = blurScales[pick(blurScales, vars.blur, "standard")];
    var tone = tones[pick(tones, vars.tone, "paper")];

    var text = typeof vars.text === "string" ? vars.text.trim() : "";
    var words = (text || "Снял раз выложил везде").split(/\s+/);

    var roots = document.querySelectorAll(".hf-catalog-per-word-crossfade");
    for (var i = 0; i < roots.length; i += 1) {
      var root = roots[i];
      root.style.setProperty("--hf-word-drift", String(drift));
      root.style.setProperty("--hf-word-blur-scale", String(blurScale));
      root.style.setProperty("--hf-word-color", tone);

      while (root.firstChild) {
        root.removeChild(root.firstChild);
      }
      for (var w = 0; w < words.length; w += 1) {
        var span = document.createElement("span");
        span.textContent = words[w];
        root.appendChild(span);
      }
    }
  })();
</script>

<!--
  Timeline integration: built in, see the script below. It registers its own paused timeline as
  window.__timelines["per-word-crossfade"]; mount the snippet inside a clip with data-composition-id="per-word-crossfade"
  and the runtime nests it at that clip's start.
-->

<script>
  /* own timeline (component-quality-bar.md X1): the host clip carries data-composition-id="per-word-crossfade" */
  (function () {
    var startTime = 0;
    var tl = gsap.timeline({ paused: true });
    tl.fromTo(
      ".hf-catalog-per-word-crossfade span",
      { opacity: 0, "--hf-word-y": "22px", "--hf-word-scale": 0.92, "--hf-word-blur": "5px" },
      {
        opacity: 1,
        "--hf-word-y": "0px",
        "--hf-word-scale": 1,
        "--hf-word-blur": "0px",
        duration: 0.3,
        stagger: 0.055,
        ease: "power3.out",
      },
      startTime,
    );
    window.__timelines = window.__timelines || {};
    window.__timelines["per-word-crossfade"] = tl;
  })();
</script>
