<!doctype html>
<!--
  tracing-beam: HyperFrames video primitive (product-demo / attention)

  Concept: one glowing dash follows one authored SVG path through three UI
  elements. Each element brightens and lifts on arrival, then settles as the
  dash moves on. The final element stays active until the beam exits.

  Variables:
    - labels (string, default "Сценарий,Съёмка,Монтаж"): three comma-separated
      labels shown in path order.
    The beam rides the reel brand red (--brand).

  Envelope: fixed 3.00s IN, elastic HOLD, fixed 0.55s OUT. If the mounted
  duration is shorter than 3.55s, IN and OUT compress proportionally. Only
  HOLD grows when the mounted duration is longer.

  IN: the stage appears, then the dash visits all three elements in order.
  HOLD: the dash rests on the final element with a subtle vertical drift.
  OUT: the dash leaves the path, the final element settles, and the stage fades.

  Mount contract: everything needed at runtime lives inside this template.
  #root fills the host box with container query units and registers exactly
  one paused timeline under the hardcoded tracing-beam key.
-->
<html
  lang="en"
  data-composition-id="tracing-beam"
  data-composition-duration="4.5"
  data-composition-variables='[
    { "id": "labels", "type": "string", "role": "content", "label": "Labels", "description": "Three comma-separated labels shown in path order.", "default": "Сценарий,Съёмка,Монтаж" }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Tracing Beam</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="tracing-beam" data-duration="4.5" data-fps="30">
        <style>
          @font-face {
            font-family: "Bebas Neue";
            src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
            font-weight: 700;
            font-display: block;
          }
          @font-face {
            font-family: "Montserrat";
            src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
            font-weight: 100 900;
            font-display: block;
            unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
          }
          @font-face {
            font-family: "Montserrat";
            src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
            font-weight: 100 900;
            font-display: block;
            unicode-range:
              U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
              U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
          }
          @font-face {
            font-family: "Montserrat";
            src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
            font-weight: 100 900;
            font-display: block;
            unicode-range:
              U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308,
              U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4,
              U+2113, U+2C60-2C7F, U+A720-A7FF;
          }
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            container-type: size;
            isolation: isolate;
            color: var(--fg, #f2f2f2);
            font-family: var(--font-body, "Montserrat", sans-serif);
            pointer-events: none;
          }

          .tb-clip,
          .tb-stage {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
          }

          .tb-stage {
            opacity: 0;
          }

          .tb-route {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
          }

          .tb-beam {
            fill: none;
            stroke: var(--tb-accent, var(--brand, #ff0000));
            stroke-width: 9;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: url(#tracing-beam-glow);
            opacity: 0;
            will-change: stroke-dashoffset, opacity;
          }

          .tb-anchor {
            position: absolute;
            width: 22cqw;
            height: 24cqh;
            transform: translate(-50%, -50%);
          }

          .tb-anchor:nth-child(1) {
            left: 15%;
            top: 60%;
          }

          .tb-anchor:nth-child(2) {
            left: 50%;
            top: 35%;
          }

          .tb-anchor:nth-child(3) {
            left: 85%;
            top: 58%;
          }

          /* Standing box (vertical reel field): the three steps stack top to
             bottom as wide cards, the beam snakes between them (route set
             in the script). The source only laid them out in a row, which
             in a standing box squeezed each card to a column of syllables. */
          @container (aspect-ratio < 1) {
            .tb-anchor {
              width: 78cqw;
              height: 15cqh;
            }
            .tb-anchor:nth-child(1) {
              left: 50%;
              top: 22%;
            }
            .tb-anchor:nth-child(2) {
              left: 50%;
              top: 50%;
            }
            .tb-anchor:nth-child(3) {
              left: 50%;
              top: 78%;
            }
            .tb-card {
              gap: 4cqw;
              padding: 2cqh 5cqw;
            }
          }

          .tb-node {
            position: relative;
            width: 100%;
            height: 100%;
            will-change: transform;
          }

          .tb-halo {
            position: absolute;
            inset: -24%;
            border-radius: 50%;
            background: radial-gradient(
              circle,
              color-mix(in srgb, var(--tb-accent, var(--brand, #ff0000)) 42%, transparent) 0%,
              transparent 70%
            );
            opacity: 0;
            will-change: transform, opacity;
          }

          .tb-card {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            gap: 2.2cqw;
            padding: 2.4cqh 2.2cqw;
            overflow: hidden;
            border: 0.16cqmin solid color-mix(in srgb, var(--border, #2e2e32) 78%, transparent);
            border-radius: var(--radius, 2.8cqmin);
            background: color-mix(in srgb, var(--surface, #18181a) 92%, transparent);
            box-shadow: 0 2.4cqh 6cqh color-mix(in srgb, var(--bg, #0c1014) 56%, transparent);
            /* dimmed, still readable: text at 0.75 keeps the contrast of large text */
            opacity: 0.75;
            will-change: opacity;
          }

          .tb-icon {
            flex: 0 0 auto;
            width: 7.5cqmin;
            aspect-ratio: 1;
            display: grid;
            place-items: center;
            border: 0.14cqmin solid
              color-mix(in srgb, var(--tb-accent, var(--brand, #ff0000)) 52%, transparent);
            border-radius: 2cqmin;
            background: color-mix(
              in srgb,
              var(--tb-accent, var(--brand, #ff0000)) 14%,
              var(--surface, #18181a)
            );
            color: var(--tb-accent, var(--brand, #ff0000));
            font-family: var(--font-body, "Montserrat", sans-serif);
            font-size: clamp(28px, 3.5cqmin, 28px);
            font-weight: 700;
          }

          .tb-copy {
            min-width: 0;
          }

          .tb-kicker {
            margin-bottom: 0.8cqh;
            color: var(--muted, #8a8a90);
            font-family: var(--font-body, "Montserrat", sans-serif);
            font-size: 28px;
            font-weight: 650;
            letter-spacing: 0.06em;
            text-transform: uppercase;
          }

          .tb-label {
            max-width: 100%;
            color: var(--fg, #f2f2f2);
            font-family: var(--font-body, "Montserrat", sans-serif);
            font-size: clamp(28px, 4.6cqmin, 38px);
            font-weight: 700;
            line-height: 1.15;
            letter-spacing: -0.01em;
            overflow-wrap: anywhere;
          }
        </style>

        <div
          id="tracing-beam-clip"
          class="tb-clip clip"
          data-start="0"
          data-duration="4.5"
          data-track-index="0"
        >
          <div class="tb-stage">
            <svg
              class="tb-route"
              viewBox="0 0 1000 520"
              preserveAspectRatio="none"
              aria-hidden="true"
            >
              <defs>
                <filter id="tracing-beam-glow" x="-30%" y="-30%" width="160%" height="160%">
                  <feGaussianBlur stdDeviation="7" result="blur" />
                  <feMerge>
                    <feMergeNode in="blur" />
                    <feMergeNode in="SourceGraphic" />
                  </feMerge>
                </filter>
              </defs>
              <path
                class="tb-beam"
                d="M 150 312 C 280 312 335 182 500 182 C 665 182 720 302 850 302"
              />
            </svg>

            <div class="tb-nodes">
              <div class="tb-anchor">
                <div class="tb-node">
                  <div class="tb-halo"></div>
                  <div class="tb-card">
                    <div class="tb-icon">01</div>
                    <div class="tb-copy">
                      <div class="tb-kicker">Шаг 1</div>
                      <div class="tb-label"></div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="tb-anchor">
                <div class="tb-node">
                  <div class="tb-halo"></div>
                  <div class="tb-card">
                    <div class="tb-icon">02</div>
                    <div class="tb-copy">
                      <div class="tb-kicker">Шаг 2</div>
                      <div class="tb-label"></div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="tb-anchor">
                <div class="tb-node">
                  <div class="tb-halo"></div>
                  <div class="tb-card">
                    <div class="tb-icon">03</div>
                    <div class="tb-copy">
                      <div class="tb-kicker">Шаг 3</div>
                      <div class="tb-label"></div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <script>
          /* hostSlot: the whole-scene clip follows the host slot (komp-sobrat.py klip_hozyaina; caret-swap:219) */
          (function () {
            var c = document.getElementById("tracing-beam-clip");
            var h = c && c.parentElement && c.parentElement.closest("[data-duration]");
            if (h) c.dataset.duration = h.dataset.duration;
          })();
        </script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var stage = root.querySelector(".tb-stage");
            var beam = root.querySelector(".tb-beam");
            var nodes = root.querySelectorAll(".tb-node");
            var labels = root.querySelectorAll(".tb-label");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            var defaultLabels = ["Сценарий", "Съёмка", "Монтаж"];
            var labelValue = vars.labels == null ? defaultLabels.join(",") : String(vars.labels);
            var labelParts = labelValue.split(",");
            for (var i = 0; i < labels.length; i += 1) {
              var part = labelParts[i] == null ? "" : labelParts[i].trim();
              labels[i].textContent = part === "" ? defaultLabels[i] : part;
            }

            // One palette: the beam rides the reel brand red.
            root.style.setProperty("--tb-accent", "var(--brand, #ff0000)");

            // Standing box: the route snakes down between the stacked cards
            // (viewBox 0 0 1000 520 is stretched, so y follows 22/50/78%).
            if (root.clientHeight > root.clientWidth) {
              beam.setAttribute(
                "d",
                "M 500 114 C 820 150 820 224 500 260 C 180 296 180 370 500 406",
              );
            }
            var routeLength = beam.getTotalLength();
            var dashLength = routeLength * 0.24;
            beam.style.strokeDasharray = dashLength + " " + routeLength;
            beam.style.strokeDashoffset = String(dashLength);

            var IN_BASE = 3;
            var OUT_BASE = 0.55;
            var BEAM_START_BASE = 0.35;
            var BEAM_TRAVEL_BASE = 2.35;
            var NODE_MOVE_BASE = 0.28;
            var NODE_DIM_DELAY_BASE = 0.65;
            var BEAM_EXIT_BASE = 0.28;

            var duration = Math.max(
              0.001,
              parseFloat(
                ((root.parentElement && root.parentElement.closest("[data-duration]")) || root)
                  .dataset.duration || "4.5",
              ),
            );
            var fixedDuration = IN_BASE + OUT_BASE;
            var scale = duration < fixedDuration ? duration / fixedDuration : 1;
            var IN = IN_BASE * scale;
            var OUT = OUT_BASE * scale;
            var BEAM_START = BEAM_START_BASE * scale;
            var BEAM_TRAVEL = BEAM_TRAVEL_BASE * scale;
            var NODE_MOVE = NODE_MOVE_BASE * scale;
            var NODE_DIM_DELAY = NODE_DIM_DELAY_BASE * scale;
            var BEAM_EXIT = BEAM_EXIT_BASE * scale;
            var HOLD = Math.max(0, duration - (IN + OUT));
            var HOLD_START = IN;
            var OUT_START = IN + HOLD;
            var arrivals = [BEAM_START, BEAM_START + BEAM_TRAVEL * 0.5, BEAM_START + BEAM_TRAVEL];

            gsap.set(stage, { opacity: 0 });
            gsap.set(beam, { opacity: 0 });
            gsap.set(nodes, { y: 0 });
            gsap.set(root.querySelectorAll(".tb-halo"), { scale: 0.82 });

            var tl = gsap.timeline({ paused: true });

            function brighten(node, at) {
              var card = node.querySelector(".tb-card");
              var halo = node.querySelector(".tb-halo");
              tl.to(node, { y: "-2.2cqh", duration: NODE_MOVE, ease: "power3.out" }, at);
              tl.to(card, { opacity: 1, duration: NODE_MOVE, ease: "power2.out" }, at);
              tl.to(halo, { opacity: 0.86, scale: 1, duration: NODE_MOVE, ease: "power3.out" }, at);
            }

            function dim(node, at) {
              var card = node.querySelector(".tb-card");
              var halo = node.querySelector(".tb-halo");
              tl.to(node, { y: 0, duration: NODE_MOVE, ease: "power2.out" }, at);
              tl.to(card, { opacity: 0.75, duration: NODE_MOVE, ease: "power2.out" }, at);
              tl.to(halo, { opacity: 0, scale: 0.82, duration: NODE_MOVE, ease: "power2.out" }, at);
            }

            tl.to(stage, { opacity: 1, duration: Math.min(0.35, IN), ease: "power2.out" }, 0);
            tl.to(beam, { opacity: 1, duration: NODE_MOVE, ease: "power2.out" }, BEAM_START);
            tl.to(
              beam,
              {
                strokeDashoffset: -(routeLength - dashLength),
                duration: BEAM_TRAVEL,
                ease: "sine.inOut",
              },
              BEAM_START,
            );

            brighten(nodes[0], arrivals[0]);
            brighten(nodes[1], arrivals[1]);
            brighten(nodes[2], arrivals[2]);
            dim(nodes[0], arrivals[0] + NODE_DIM_DELAY);
            dim(nodes[1], arrivals[1] + NODE_DIM_DELAY);

            if (HOLD > 0.2) {
              tl.to(
                nodes[2],
                { y: "-2.7cqh", duration: HOLD * 0.5, ease: "sine.inOut" },
                HOLD_START,
              );
              tl.to(
                nodes[2],
                { y: "-2.2cqh", duration: HOLD * 0.5, ease: "sine.inOut" },
                HOLD_START + HOLD * 0.5,
              );
            }

            tl.to(
              beam,
              {
                strokeDashoffset: -routeLength,
                opacity: 0,
                duration: BEAM_EXIT,
                ease: "power2.in",
              },
              // the beam runs into the last step and goes out there; held, its tail
              // hung as a hook over the third card for the whole hold
              arrivals[2],
            );
            dim(nodes[2], OUT_START);
            tl.to(stage, { opacity: 0, duration: OUT, ease: "power2.in" }, OUT_START);

            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["tracing-beam"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
