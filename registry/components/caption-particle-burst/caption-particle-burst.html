<!doctype html>
<!--
  caption-particle-burst: captions of a vertical reel on a black rounded plate – the spoken word lights up from grey; a word marked with * in front turns red and throws a burst of sparks.

  Words come from outside in one variable, so the file is never edited: "word|start|end;..."
  with seconds from mount start (the transcript's words in order; empty shows nothing).
  Groups of up to 3 words (high energy, captions.md "Groups"), broken at a sentence mark, a
  pause of 150 ms, or where the next word would not fit the line; one group on screen at a
  time, hard-killed after it ends. Every group is one upper-case Bebas Neue line at one size,
  78 px (captions.md base), within the readable width (72.2% of the box: 780 px of 1080),
  centred in the caption band (y 71.9%-80.2%: 1380-1540 px); words go to the next group
  instead of shrinking the type (spec.md:48), only a single word wider than the line steps
  down. The letters sit dead centre in the plate with equal padding on all four sides
  (text-box trim to cap height and baseline, one padding value). Colours read the palette
  variables of the reel (--fg, --muted, --accent, --plate) with the brand as fallback.

  Mount contract: the runtime clones only this template. #root fills the host box (mount it
  over the whole 1080 x 1920 frame for the length of the speech), has no data-width or
  data-height, and registers one paused timeline under the caption-particle-burst key. Fonts come from the
  project's assets/fonts.
-->
<html
  lang="ru"
  data-composition-id="caption-particle-burst"
  data-composition-duration="600"
  data-composition-variables='[
    { "id": "words", "type": "string", "role": "content", "label": "Words", "description": "Every caption word with its timing, in order: word|start|end separated by ; (seconds from mount start, e.g. Такой|0.20|0.48;монтаж|0.48|0.90). Build it from transcript.json words.", "maxLength": 40000, "default": "Такой|0.20|0.48;монтаж|0.48|0.90;ещё|0.90|1.20;никто|1.35|1.70;не|1.70|1.82;делал.|1.82|2.30;Смотри,|2.55|2.95;как|3.05|3.25;это|3.25|3.50;работает.|3.50|4.10" }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Particle Burst</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="caption-particle-burst" data-duration="600" data-fps="30">
        <style>
          @font-face {
            font-family: "Bebas Neue";
            src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
            font-weight: 700;
            font-display: block;
          }
          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            container-type: size;
            pointer-events: none;
          }
          .pb-clip {
            position: absolute;
            inset: 0;
          }
          .pb-group {
            position: absolute;
            left: 0;
            right: 0;
            top: 71.875cqh;
            height: 8.3333cqh;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
          }
          .pb-plate {
            background: var(--plate, #000);
            border-radius: 2.5926cqw;
            color: var(--fg, #f2f2f2);
            font-family: "Bebas Neue", sans-serif;
            font-weight: 700;
            font-size: 78px;
            line-height: 1.08;
            text-transform: uppercase;
            text-align: center;
            white-space: nowrap;
            text-box: trim-both cap alphabetic;
            padding: 0.3em;
          }
          .pb-word {
            display: inline-block;
          }
          .pb-word {
            position: relative;
          }
          .pb-dot {
            position: absolute;
            left: 50%;
            top: 50%;
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
          }
        </style>

        <div
          id="caption-particle-burst-clip"
          class="pb-clip clip"
          data-start="0"
          data-duration="600"
          data-track-index="0"
          data-layout-allow-caption-zone
        ></div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          window.pbStyle = {
            // the spoken word lights up from grey; a word marked with * in front (*монтаж) turns red and throws sparks
            wordInner: function (s, text) {
              var kw = /^\*(?=\p{L})/u.test(text);
              s.textContent = kw ? text.slice(1) : text;
              if (!kw) return;
              s.setAttribute("data-kw", "1");
              var seed = 7;
              for (var i = 0; i < text.length; i++) seed = (seed * 31 + text.charCodeAt(i)) >>> 0;
              function rng() {
                seed = (seed * 1103515245 + 12345) >>> 0;
                return seed / 4294967296;
              }
              for (var p = 0; p < 12; p++) {
                var a = (p / 12) * Math.PI * 2 + rng() * 0.6;
                var dist = 90 + rng() * 120;
                var sz = 6 + rng() * 8;
                var d = document.createElement("span");
                d.className = "pb-dot";
                d.style.width = d.style.height = sz.toFixed(1) + "px";
                d.style.margin = (-sz / 2).toFixed(1) + "px 0 0 " + (-sz / 2).toFixed(1) + "px";
                d.style.background = p % 2 ? "var(--accent, #ff0000)" : "var(--fg, #f2f2f2)";
                d.setAttribute("data-dx", (Math.cos(a) * dist).toFixed(1));
                d.setAttribute("data-dy", (-Math.sin(a) * dist).toFixed(1));
                s.appendChild(d);
              }
            },
            word: function (tl, o) {
              var kw = o.el.getAttribute("data-kw");
              tl.set(o.el, { color: o.C.muted }, o.open);
              tl.to(o.el, { color: kw ? o.C.accent : o.C.fg, duration: 0.08, ease: "none" }, o.at);
              if (!kw) return;
              Array.prototype.forEach.call(o.el.querySelectorAll(".pb-dot"), function (d, i) {
                tl.set(d, { x: 0, y: 0, opacity: 0 }, o.open);
                tl.to(
                  d,
                  {
                    x: +d.getAttribute("data-dx"),
                    y: +d.getAttribute("data-dy"),
                    opacity: 1,
                    duration: 0.12,
                    ease: "power3.out",
                  },
                  o.at + i * 0.018,
                );
                tl.to(
                  d,
                  { opacity: 0, duration: 0.45, ease: "power1.in" },
                  o.at + 0.12 + i * 0.018,
                );
              });
            },
          };
          (function () {
            // Shared caption engine of the MatIntellect base (one source in the workshop: zagotovki/kapsh/_dvizhok.js).
            // Words come from outside in one variable "word|start|end;...". Groups of up to 3 words, broken at a
            // sentence mark, a pause of 150 ms, or where the next word would not fit the line at 78 px; one group on
            // screen at a time, hard-killed after it ends (captions.md "Groups"). Every group is one upper-case
            // line at 78 px on a black plate within 780 of 1080 (entrances grow it no further: room); a group goes off no later than the next one comes on; only a single word wider than the line steps
            // down ("cut words, never shrink type", spec.md:48). Built after the font loads; render waits on buildReady.
            var root = document.getElementById("root");
            var stage = document.getElementById("caption-particle-burst-clip");
            var STYLE = window.pbStyle;
            var DEFAULT =
              "Такой|0.20|0.48;монтаж|0.48|0.90;ещё|0.90|1.20;никто|1.35|1.70;не|1.70|1.82;делал.|1.82|2.30;Смотри,|2.55|2.95;как|3.05|3.25;это|3.25|3.50;работает.|3.50|4.10";
            var MAX_WORDS = STYLE.maxWords || 3;
            var SIZE = 78;
            var PAUSE = 0.15;
            var HOLD = 0.3;
            var LEAD = 0.05;
            var V =
              window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
                ? window.__hyperframes.getVariables()
                : {};
            var src = typeof V.words === "string" ? V.words : DEFAULT;
            var css = getComputedStyle(root);
            var C = {
              fg: css.getPropertyValue("--fg").trim() || "#f2f2f2",
              muted: css.getPropertyValue("--muted").trim() || "#8a8a90",
              accent: css.getPropertyValue("--accent").trim() || "#ff0000",
            };

            var words = src
              .split(";")
              .map(function (s) {
                var p = s.split("|");
                return {
                  text: (p[0] || "").trim(),
                  start: parseFloat(p[1]),
                  end: parseFloat(p[2]),
                };
              })
              .filter(function (w) {
                return w.text && isFinite(w.start) && isFinite(w.end);
              });

            var tl = gsap.timeline({ paused: true });
            tl.set({}, {}, 600);
            window.__timelines = window.__timelines || {};
            window.__timelines["caption-particle-burst"] = tl;

            function fits(text, fs) {
              return window.__hyperframes.fitTextFontSize(text.toUpperCase(), {
                fontFamily: "Bebas Neue",
                fontWeight: 700,
                maxWidth: root.clientWidth * 0.72222 - 0.6 * fs - (STYLE.extraWidth || 0) * fs,
                baseFontSize: fs,
                minFontSize: fs,
              }).fits;
            }
            function join(g) {
              return g
                .map(function (w) {
                  return w.text;
                })
                .join(" ");
            }

            function build() {
              var groups = [];
              var cur = [];
              words.forEach(function (w, i) {
                if (cur.length && !fits(join(cur.concat(w)), SIZE)) {
                  groups.push(cur);
                  cur = [];
                }
                cur.push(w);
                var next = words[i + 1];
                if (
                  !next ||
                  cur.length >= MAX_WORDS ||
                  /[.,:;!?…]$/.test(w.text) ||
                  next.start - w.end >= PAUSE
                ) {
                  groups.push(cur);
                  cur = [];
                }
              });
              groups.forEach(function (g, gi) {
                var el = document.createElement("div");
                el.className = "pb-group";
                var plate = document.createElement("div");
                plate.className = "pb-plate";
                g.forEach(function (w, wi) {
                  if (wi) plate.appendChild(document.createTextNode(" "));
                  var s = document.createElement("span");
                  s.className = "pb-word";
                  if (STYLE.wordInner) STYLE.wordInner(s, w.text);
                  else s.textContent = w.text;
                  plate.appendChild(s);
                  w.el = s;
                });
                var fs = SIZE;
                while (fs > 42 && !fits(join(g), fs)) fs -= 2;
                plate.style.fontSize = fs + "px";
                el.appendChild(plate);
                stage.appendChild(el);
                // room: how far the plate may grow in an entrance and still stay inside the 780 of 1080
                var room = Math.max(1, (root.clientWidth * 0.72222) / plate.offsetWidth);

                var open = Math.max(0, g[0].start - LEAD);
                var nextOpen = groups[gi + 1]
                  ? Math.max(0, groups[gi + 1][0].start - LEAD)
                  : Infinity;
                var close = Math.min(nextOpen, g[g.length - 1].end + HOLD);
                tl.set(el, { opacity: 1, visibility: "visible" }, open);
                if (STYLE.group)
                  STYLE.group(tl, {
                    el: el,
                    plate: plate,
                    words: g,
                    open: open,
                    close: close,
                    index: gi,
                    room: room,
                    C: C,
                  });
                g.forEach(function (w, wi) {
                  STYLE.word(tl, {
                    el: w.el,
                    w: w,
                    first: wi === 0,
                    open: open,
                    at: Math.max(open, w.start - LEAD),
                    close: close,
                    index: wi,
                    room: room,
                    C: C,
                  });
                });
                tl.set(el, { opacity: 0, visibility: "hidden" }, close);
              });
            }
            window.__hf = window.__hf || {};
            window.__hf.buildReady = window.__hf.buildReady || {};
            window.__hf.buildReady["caption-particle-burst"] = Promise.all(
              ['700 100px "Bebas Neue"'].concat(STYLE.fonts || []).map(function (f) {
                return document.fonts.load(f, join(words) || "А");
              }),
            ).then(build);
          })();
        </script>
      </div>
    </template>
  </body>
</html>
