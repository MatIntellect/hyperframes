<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
          U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range:
          U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329,
          U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113,
          U+2C60-2C7F, U+A720-A7FF;
      }
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: transparent;
        overflow: hidden;
      }
      /* ---- yt-camera-move --------------------------------------------------
         The creator-video punch-in as reusable GSAP helpers: dynamic
         zoom + slide + 3D tilt/pan on any wrapper (a #video-wrap, a
         sub-composition include, an image card). A talking-head recipe
         is the default: cubic easing, ~11% zoom.

         Optional: .yt-cm-defocus is an edge-blur overlay that pulses during
         the move to sell the 3D feel — place it ABOVE the moving layer,
         covering the same region. */
      .yt-cm-defocus {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        backdrop-filter: blur(7px);
        -webkit-backdrop-filter: blur(7px);
        /* blur only the frame edges; center stays sharp */
        -webkit-mask-image: radial-gradient(
          ellipse 62% 58% at 50% 50%,
          transparent 58%,
          rgba(0, 0, 0, 0.85) 92%
        );
        mask-image: radial-gradient(
          ellipse 62% 58% at 50% 50%,
          transparent 58%,
          rgba(0, 0, 0, 0.85) 92%
        );
      }
      /* The scene fills the host box; the moving layer carries the host's own
         shot (slot, see the script) or a neutral stand-in with a grid. */
      #yt-cm-root {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      #yt-cm-stage {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: radial-gradient(
          circle at 50% 42%,
          var(--surface, #18181a),
          var(--bg, #0c1014) 75%
        );
      }
      /* Grid is the only cue that reveals the camera move on a flat gradient
         plate; at 0.14/2px the zoom and slide were nearly imperceptible. */
      #yt-cm-stage .yt-cm-grid {
        position: absolute;
        inset: -60px;
        background:
          repeating-linear-gradient(
            0deg,
            color-mix(in srgb, var(--fg, #f2f2f2) 14%, transparent) 0 3px,
            transparent 3px 120px
          ),
          repeating-linear-gradient(
            90deg,
            color-mix(in srgb, var(--fg, #f2f2f2) 14%, transparent) 0 3px,
            transparent 3px 120px
          );
      }
    </style>
  </head>
  <body>
    <!-- Self-preview wrapper. WIRING: copy the .yt-cm-defocus CSS (if you want
         the edge blur), add <div class="yt-cm-defocus" id="yt-my-defocus"></div>
         as a sibling ABOVE your moving layer, and copy the helpers into your
         host script. Then drive any wrapper:

           ytCameraMove(tl, "#video-wrap", 5.0, { zoom: 0.11, slideY: -24 });
           ytDefocusPulse(tl, "#yt-my-defocus", 5.0, 1.2);
           ytCameraReset(tl, "#video-wrap", 9.0);
    -->
    <div id="yt-cm-root" data-composition-id="yt-camera-move" data-start="0" data-duration="4">
      <div id="yt-cm-stage">
        <div class="yt-cm-grid" data-layout-allow-overflow></div>
      </div>
      <div class="yt-cm-defocus" id="yt-cm-defocus"></div>
      <div
        id="yt-cm-drv"
        class="clip"
        data-start="0"
        data-duration="4"
        data-track-index="0"
        style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none"
      ></div>
    </div>
    <script>
      /* hostSlot: the whole-scene clip follows the host slot (komp-sobrat.py klip_hozyaina; caret-swap:219) */
      (function () {
        var c = document.getElementById("yt-cm-drv");
        var h = c && c.parentElement && c.parentElement.closest("[data-duration]");
        if (h) c.dataset.duration = h.dataset.duration;
      })();
    </script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};

        // ---- copy these helpers into the host script ----
        // Punch-in / camera move on any wrapper. A talking-head base:
        // zoom 0.11, cubic ease. tilt/pan are degrees (rotationX/rotationY,
        // perspective is set for you); slideX/slideY in px; roll in degrees.
        window.ytCameraMove = function (tl, target, at, opts) {
          opts = opts || {};
          var dur = opts.dur === undefined ? 1.2 : opts.dur;
          gsap.set(target, {
            transformPerspective: 1200,
            transformOrigin: opts.origin || "50% 50%",
          });
          tl.to(
            target,
            {
              scale: 1 + (opts.zoom === undefined ? 0.11 : opts.zoom),
              x: opts.slideX || 0,
              y: opts.slideY || 0,
              rotationX: opts.tilt || 0,
              rotationY: opts.pan || 0,
              rotation: opts.roll || 0,
              duration: dur,
              ease: opts.ease || "power2.inOut",
            },
            at,
          );
        };
        // Return to rest (same easing family).
        window.ytCameraReset = function (tl, target, at, opts) {
          opts = opts || {};
          tl.to(
            target,
            {
              scale: 1,
              x: 0,
              y: 0,
              rotationX: 0,
              rotationY: 0,
              rotation: 0,
              duration: opts.dur === undefined ? 1.2 : opts.dur,
              ease: opts.ease || "power2.inOut",
            },
            at,
          );
        };
        // Edge-defocus pulse synced to a move (overlay fades in then out).
        window.ytDefocusPulse = function (tl, target, at, dur) {
          dur = dur === undefined ? 1.2 : dur;
          tl.to(target, { opacity: 1, duration: dur * 0.45, ease: "power2.out" }, at);
          tl.to(target, { opacity: 0, duration: dur * 0.55, ease: "power2.in" }, at + dur * 0.45);
        };

        // Self-preview timeline (not part of the snippet you copy):
        // punch in with a slight tilt, hold, return.
        // Host slot: the shot lives in an inert template at HOST DOCUMENT level
        // (particle-image-reveal.mdx:45/238); without one the grid stand-in moves.
        var stage = document.getElementById("yt-cm-stage");
        var hostDoc = stage.ownerDocument;
        var shotTpl = hostDoc.querySelector('template[data-slot="yt-camera-move-shot"]');
        if (shotTpl) {
          var shot = document.createElement("div");
          shot.style.cssText = "position:absolute;inset:0";
          shot.appendChild(hostDoc.importNode(shotTpl.content, true));
          stage.replaceChildren(shot);
        }
        // Timing follows the host clip (the driver clip carries its length).
        var drv = document.getElementById("yt-cm-drv");
        var D =
          parseFloat(
            drv &&
              ((drv.parentElement && drv.parentElement.closest("[data-duration]")) || drv).dataset
                .duration,
          ) || 4;
        var back = Math.max(1.8, D - 1.5);
        var tl = gsap.timeline({ paused: true });
        window.ytCameraMove(tl, "#yt-cm-stage", 0.4, { zoom: 0.11, slideY: -26, tilt: 3, pan: -2 });
        window.ytDefocusPulse(tl, "#yt-cm-defocus", 0.4, 1.2);
        window.ytCameraReset(tl, "#yt-cm-stage", back);
        window.ytDefocusPulse(tl, "#yt-cm-defocus", back, 1.2);
        tl.set("#yt-cm-root", { visibility: "hidden" }, D - 0.02);
        window.__timelines["yt-camera-move"] = tl;
      })();
    </script>
  </body>
</html>
