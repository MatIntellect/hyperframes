-->

<!--
  Timeline integration: built in, see the script below. It registers its own paused timeline as
  window.__timelines["animated-bar-chart"]; mount the snippet inside a clip with data-composition-id="animated-bar-chart"
  and the runtime nests it at that clip's start.
-->

<script>
  /* own timeline (component-quality-bar.md X1): the host clip carries data-composition-id="animated-bar-chart" */
  (function () {
    var startTime = 0;
    var tl = gsap.timeline({ paused: true });
    tl.fromTo(
      ".hf-catalog-animated-bar-chart",
      { "--hf-grow": 0, "--hf-dash": 900 },
      { "--hf-grow": 1, "--hf-dash": 0, duration: 1.2, ease: "power3.out" },
      startTime,
    );
    window.__timelines = window.__timelines || {};
    window.__timelines["animated-bar-chart"] = tl;
  })();
</script>
