<!--
  Typewriter - typography primitive for HyperFrames.

  Paste the markup, CSS and script into a composition. Drive the timeline
  integration from a paused GSAP timeline so renders remain deterministic.

  Variables. The script reads each one, falls back to the declared default on
  anything missing or unrecognised, and writes the result either into the
  markup or into a custom property the CSS above consumes. The timeline recipe
  below is untouched by them: it keeps driving one type progress and one caret
  opacity, and these decide what is typed, in what colour, and behind which
  caret.

    - text (string, default монтаж с ИИ за минуту): the line that types
      itself out. It is written into the existing span, so the reveal keeps
      running character by character over whatever is set. Anything that is
      not a non-empty string keeps the shipped line.
    - tone (ink | paper | accent, default paper: the reels are dark): colour of both the text and
      the caret. ink is near-black for light frames, paper near-white for dark
      ones, accent rides --brand.
    - caret (line | block | none, default line): caret shape. line is the
      shipped 3px rule, block is a 22px slab in the style of a terminal
      cursor, none removes the caret entirely and closes the gap after the
      text.

  On every default: a near-white
  monospace line typing itself out behind a 3px caret.
-->

<div
  class="hf-catalog-typewriter"
  data-composition-variables='[
    { "id": "text", "type": "string", "role": "content", "label": "Text", "description": "Line that types itself out character by character.", "default": "монтаж с ИИ за минуту" },
    { "id": "tone", "type": "enum", "role": "style", "label": "Tone", "description": "Colour of the text and the caret: ink for light frames, paper for dark ones, accent rides --brand.", "default": "paper", "options": [{ "value": "ink", "label": "Ink" }, { "value": "paper", "label": "Paper" }, { "value": "accent", "label": "Accent" }] },
    { "id": "caret", "type": "enum", "role": "style", "label": "Caret", "description": "Caret shape: a thin rule, a terminal-style block, or no caret at all.", "default": "line", "options": [{ "value": "line", "label": "Line" }, { "value": "block", "label": "Block" }, { "value": "none", "label": "None" }] }
  ]'
>
  <span>монтаж с ИИ за минуту</span><i></i>
</div>

<style>
  @font-face {
    font-family: "Bebas Neue";
    src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
    font-weight: 700;
    font-display: block;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
    unicode-range:
      U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329,
      U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
    unicode-range:
      U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329,
      U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F,
      U+A720-A7FF;
  }
  .hf-catalog-typewriter {
    color: var(--hf-type-color, var(--fg, #f2f2f2));
    font-family: "Montserrat", system-ui, sans-serif;
    font-weight: 900;
    letter-spacing: -0.04em;
  }
  .hf-catalog-typewriter {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font:
      800 42px/1 ui-monospace,
      Menlo,
      monospace;
  }
  .hf-catalog-typewriter span {
    display: inline-block;
    max-width: calc(var(--hf-type-progress, 1) * 100%);
    overflow: hidden;
    white-space: nowrap;
  }
  .hf-catalog-typewriter i {
    display: var(--hf-caret-display, block);
    width: var(--hf-caret-width, 3px);
    height: 42px;
    border-radius: 999px;
    background: var(--hf-type-color, var(--fg, #f2f2f2));
    opacity: var(--hf-caret-opacity, 1);
  }
</style>

<script>
  (function () {
    "use strict";

    var vars =
      window.__hyperframes && window.__hyperframes.getVariables
        ? window.__hyperframes.getVariables()
        : {};

    // Unrecognised overrides return to their declared defaults.
    var tones = {
      ink: "var(--bg, #0c1014)",
      paper: "var(--fg, #f2f2f2)",
      accent: "var(--brand, #ff0000)",
    };
    var carets = {
      line: { width: "3px", display: "block" },
      block: { width: "22px", display: "block" },
      none: { width: "3px", display: "none" },
    };

    function pick(table, value, fallback) {
      return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
    }

    var tone = tones[pick(tones, vars.tone, "paper")];
    var caret = carets[pick(carets, vars.caret, "line")];
    var text = typeof vars.text === "string" && vars.text !== "" ? vars.text : null;

    var roots = document.querySelectorAll(".hf-catalog-typewriter");
    for (var i = 0; i < roots.length; i += 1) {
      var root = roots[i];
      root.style.setProperty("--hf-type-color", tone);
      root.style.setProperty("--hf-caret-width", caret.width);
      root.style.setProperty("--hf-caret-display", caret.display);

      var line = root.querySelector("span");
      if (text !== null && line) {
        line.textContent = text;
      }
    }
  })();
</script>

<!--
  Timeline integration:
  tl.fromTo('.hf-catalog-typewriter', { '--hf-type-progress': 0 }, { '--hf-type-progress': 1, duration: 1.2, ease: 'steps(28)' }, startTime); tl.to('.hf-catalog-typewriter i', { '--hf-caret-opacity': 0.2, duration: 0.24, repeat: 7, yoyo: true, ease: 'none' }, startTime + 0.2);
-->
