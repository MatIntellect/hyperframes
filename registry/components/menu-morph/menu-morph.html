<!--
  Menu Morph - transitions.dev-inspired primitive for HyperFrames.

  Paste the markup, CSS and script into a composition. Use the timeline
  integration note at the bottom as the starting point for deterministic GSAP
  animation.

  Variables. The script reads each one, falls back to the declared default on
  anything missing or invalid, and writes the result as a custom property the
  CSS consumes (or, for the actions, as the pills themselves). The timeline
  recipe below is untouched by them: it still pops the button, crosses the two
  outer bars and staggers whatever pills are present.

    - actions (text, default Текст, Картинка, Звук): comma separated labels for
      the pills that fan out under the button, up to six. The stagger picks up
      the new count.
    - colour: the round button is the brand accent (--brand of the reel palette on
      the root) behind light bars.
    - size (96 to 180 px, default 120): diameter of the round button. The bar
      width is a fixed fraction of it, so the whole glyph scales together.

  On every default: a 120px brand-red button with light bars over three pills.
  Sized for the 780 px graphics field of a vertical reel.
-->

<div
  class="hf-transition-menu-morph"
  data-composition-variables='[
    { "id": "actions", "type": "string", "role": "content", "label": "Actions", "description": "Comma separated labels for the pills that fan out under the button. Up to six.", "default": "Текст, Картинка, Звук" },
    { "id": "size", "type": "number", "role": "layout", "label": "Button size", "description": "Diameter of the round button in pixels. The bars scale with it.", "default": 120, "min": 96, "max": 180, "step": 4, "unit": "px" }
  ]'
>
  <button class="hf-transition-menu-button" type="button" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
  <div class="hf-transition-menu-actions">
    <div>Текст</div>
    <div>Картинка</div>
    <div>Звук</div>
  </div>
</div>

<style>
  @font-face {
    font-family: "Bebas Neue";
    src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
    font-weight: 700;
    font-display: block;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
    unicode-range:
      U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329,
      U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
    unicode-range:
      U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329,
      U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F,
      U+A720-A7FF;
  }
  /* Vertical reel: sized for the 780 px graphics field (labels 28 px), brand palette tokens:
     the round button in brand red with light bars, action pills on the brand card. */
  .hf-transition-menu-morph {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 44px; /* button above, the pills below it: they never sit on the button */
    width: 700px;
    max-width: 100%;
    min-height: 440px;
    font-family: "Montserrat", system-ui, sans-serif;
  }
  .hf-transition-menu-button {
    z-index: 2;
    display: grid;
    place-items: center;
    align-content: center; /* rows hug the bars: bar 6 + gap 10 = the 16 px the cross travels */
    gap: 10px;
    width: var(--hf-menu-size, 120px);
    height: var(--hf-menu-size, 120px);
    border: 0;
    border-radius: 999px;
    background: var(--hf-menu-bg, var(--brand, #ff0000));
    box-shadow: 0 22px 58px rgba(0, 0, 0, 0.35);
  }
  .hf-transition-menu-button span {
    width: calc(var(--hf-menu-size, 120px) * 6 / 17);
    height: 6px;
    border-radius: 999px;
    background: var(--fg, #f2f2f2);
    transform-origin: center;
  }
  .hf-transition-menu-actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 14px;
    max-width: 100%;
  }
  .hf-transition-menu-actions div {
    padding: 16px 26px;
    border: 2px solid var(--border, #2e2e32);
    border-radius: 999px;
    background: var(--surface, #18181a);
    color: var(--fg, #f2f2f2);
    font-size: 28px;
    font-weight: 700;
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.35);
  }
</style>

<script>
  (function () {
    "use strict";

    var vars =
      window.__hyperframes && window.__hyperframes.getVariables
        ? window.__hyperframes.getVariables()
        : {};

    // Anything missing or invalid returns to its declared default.
    // The button is the one accent-carrying element: the brand accent of the reel palette.
    var tone = "var(--brand, #ff0000)";
    function pick(table, value, fallback) {
      return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
    }

    var labels = [];
    if (typeof vars.actions === "string") {
      var parts = vars.actions.split(",");
      for (var p = 0; p < parts.length && labels.length < 6; p += 1) {
        var label = parts[p].trim();
        if (label) {
          labels.push(label);
        }
      }
    }
    if (!labels.length) {
      labels = ["Текст", "Картинка", "Звук"];
    }

    var size =
      typeof vars.size === "number" || typeof vars.size === "string" ? Number(vars.size) : NaN;
    size = isFinite(size) && size > 0 ? Math.min(180, Math.max(96, size)) : 120;

    var roots = document.querySelectorAll(".hf-transition-menu-morph");
    for (var i = 0; i < roots.length; i += 1) {
      roots[i].style.setProperty("--hf-menu-size", size + "px");
      roots[i].style.setProperty("--hf-menu-bg", tone);
      var row = roots[i].querySelector(".hf-transition-menu-actions");
      if (!row) {
        continue;
      }
      while (row.firstChild) {
        row.removeChild(row.firstChild);
      }
      for (var j = 0; j < labels.length; j += 1) {
        var pill = document.createElement("div");
        pill.textContent = labels[j];
        row.appendChild(pill);
      }
    }
  })();
</script>

<!--
  Timeline integration: built in, see the script below. It registers its own paused timeline as
  window.__timelines["menu-morph"]; mount the snippet inside a clip with data-composition-id="menu-morph"
  and the runtime nests it at that clip's start.
-->

<script>
  /* own timeline (component-quality-bar.md X1): the host clip carries data-composition-id="menu-morph" */
  (function () {
    var startTime = 0;
    var tl = gsap.timeline({ paused: true });
    tl.fromTo(
      ".hf-transition-menu-button",
      { scale: 0.72, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.34, ease: "back.out(1.8)" },
      0.3,
    );
    tl.to(
      ".hf-transition-menu-button span:nth-child(1)",
      { y: 16, rotation: 45, duration: 0.24, ease: "power2.inOut" },
      0.78,
    );
    tl.to(
      ".hf-transition-menu-button span:nth-child(2)",
      { opacity: 0, duration: 0.18, ease: "power1.out" },
      0.78,
    );
    tl.to(
      ".hf-transition-menu-button span:nth-child(3)",
      { y: -16, rotation: -45, duration: 0.24, ease: "power2.inOut" },
      0.78,
    );
    tl.fromTo(
      ".hf-transition-menu-actions div",
      { y: 40, opacity: 0, scale: 0.86 },
      { y: 0, opacity: 1, scale: 1, duration: 0.26, stagger: 0.06, ease: "back.out(1.6)" },
      0.96,
    );
    window.__timelines = window.__timelines || {};
    window.__timelines["menu-morph"] = tl;
  })();
</script>
