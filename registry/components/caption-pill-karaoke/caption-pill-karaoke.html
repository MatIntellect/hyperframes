<!doctype html>
<!--
  caption-pill-karaoke: captions of a vertical reel on a black rounded plate, word-by-word
  karaoke highlight.

  Words come from outside in one variable, so the file is never edited: "word|start|end;..."
  with seconds from mount start (the transcript's words in order; empty shows nothing).
  Groups of up to 3 words and 30 letters (high energy, captions.md "Groups"), broken at a
  sentence mark or a pause of 150 ms; one group on screen at a time, hard-killed after it ends. Each group is one
  upper-case line sized with fitTextFontSize (base 78, minimum 42) to the readable width (72.2%
  of the box: 780 px of 1080) and centred in the caption band (y 71.9%-80.2%: 1380-1540 px).
  The letters sit dead centre in the plate with equal padding on all four sides (text-box
  trim to cap height and baseline, one padding value). A word lights from muted to full ink as
  it is spoken.

  Mount contract: the runtime clones only this template. #root fills the host box (mount it
  over the whole 1080 x 1920 frame for the length of the speech), has no data-width or
  data-height, and registers one paused timeline under the caption-pill-karaoke key. Fonts
  come from the project's assets/fonts.
-->
<html
  lang="ru"
  data-composition-id="caption-pill-karaoke"
  data-composition-duration="600"
  data-composition-variables='[
    { "id": "words", "type": "string", "role": "content", "label": "Words", "description": "Every caption word with its timing, in order: word|start|end separated by ; (seconds from mount start, e.g. Такой|0.20|0.48;монтаж|0.48|0.90). Build it from transcript.json words.", "maxLength": 40000, "default": "Такой|0.20|0.48;монтаж|0.48|0.90;ещё|0.90|1.20;никто|1.35|1.70;не|1.70|1.82;делал.|1.82|2.30;Смотри,|2.55|2.95;как|3.05|3.25;это|3.25|3.50;работает.|3.50|4.10" }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Pill Karaoke</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="caption-pill-karaoke" data-duration="600" data-fps="30">
        <style>
          @font-face {
            font-family: "Bebas Neue";
            src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
            font-weight: 700;
            font-display: block;
          }
          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            container-type: size;
            pointer-events: none;
          }
          .pk-clip {
            position: absolute;
            inset: 0;
          }
          .pk-group {
            position: absolute;
            left: 0;
            right: 0;
            top: 71.875cqh;
            height: 8.3333cqh;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
          }
          .pk-plate {
            background: var(--plate, #000);
            border-radius: 2.5926cqw;
            font-family: var(--font-display, "Bebas Neue"), sans-serif;
            font-weight: 700;
            font-size: 78px;
            line-height: 1.08;
            text-transform: uppercase;
            text-align: center;
            white-space: nowrap;
            text-box: trim-both cap alphabetic;
            padding: 0.3em;
          }
          .pk-word {
            color: var(--muted, #8a8a90);
          }
        </style>

        <div
          id="caption-pill-karaoke-clip"
          class="pk-clip clip"
          data-start="0"
          data-duration="600"
          data-track-index="0"
        ></div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            var root = document.getElementById("root");
            var stage = document.getElementById("caption-pill-karaoke-clip");
            var DEFAULT =
              "Такой|0.20|0.48;монтаж|0.48|0.90;ещё|0.90|1.20;никто|1.35|1.70;не|1.70|1.82;делал.|1.82|2.30;Смотри,|2.55|2.95;как|3.05|3.25;это|3.25|3.50;работает.|3.50|4.10";
            var MAX_WORDS = 3;
            var MAX_CHARS = 30; // 30 widest letters with no space still fit 780 at the 42 px floor
            var PAUSE = 0.15;
            var HOLD = 0.3;
            var LEAD = 0.05;
            var V =
              window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
                ? window.__hyperframes.getVariables()
                : {};
            var src = typeof V.words === "string" ? V.words : DEFAULT;
            var INK = getComputedStyle(root).getPropertyValue("--fg").trim() || "#f2f2f2";

            var words = src
              .split(";")
              .map(function (s) {
                var p = s.split("|");
                return {
                  text: (p[0] || "").trim(),
                  start: parseFloat(p[1]),
                  end: parseFloat(p[2]),
                };
              })
              .filter(function (w) {
                return w.text && isFinite(w.start) && isFinite(w.end);
              });

            var groups = [];
            var cur = [];
            words.forEach(function (w, i) {
              var len = cur
                .map(function (x) {
                  return x.text;
                })
                .concat(w.text)
                .join(" ").length;
              if (cur.length && len > MAX_CHARS) {
                groups.push(cur);
                cur = [];
              }
              cur.push(w);
              var next = words[i + 1];
              if (
                !next ||
                cur.length >= MAX_WORDS ||
                /[.,:;!?…]$/.test(w.text) ||
                next.start - w.end >= PAUSE
              ) {
                groups.push(cur);
                cur = [];
              }
            });

            var tl = gsap.timeline({ paused: true });
            var plates = [];
            groups.forEach(function (g, gi) {
              var el = document.createElement("div");
              el.className = "pk-group";
              var plate = document.createElement("div");
              plate.className = "pk-plate";
              g.forEach(function (w, wi) {
                if (wi) plate.appendChild(document.createTextNode(" "));
                var s = document.createElement("span");
                s.className = "pk-word";
                s.textContent = w.text;
                plate.appendChild(s);
                w.el = s;
              });
              el.appendChild(plate);
              stage.appendChild(el);
              plates.push({
                plate: plate,
                text: g
                  .map(function (w) {
                    return w.text;
                  })
                  .join(" "),
              });

              var open = Math.max(0, g[0].start - LEAD);
              var nextOpen = groups[gi + 1]
                ? Math.max(0, groups[gi + 1][0].start - LEAD)
                : Infinity;
              var close = Math.max(
                g[g.length - 1].end,
                Math.min(nextOpen, g[g.length - 1].end + HOLD),
              );
              tl.set(el, { opacity: 1, visibility: "visible" }, open);
              g.forEach(function (w, wi) {
                if (wi === 0) tl.set(w.el, { color: INK }, open);
                else
                  tl.to(
                    w.el,
                    { color: INK, duration: 0.1, ease: "none" },
                    Math.max(open, w.start - LEAD),
                  );
              });
              tl.set(el, { opacity: 0, visibility: "hidden" }, close);
            });
            tl.set({}, {}, 600);
            window.__timelines = window.__timelines || {};
            window.__timelines["caption-pill-karaoke"] = tl;

            // One line per group: plate (text + 0.3em padding each side) within 780 of 1080, from 78 px
            // down to 42 (captions.md "Fit and place"); measured after the font loads.
            function fit() {
              var maxW = root.clientWidth * 0.72222;
              plates.forEach(function (p) {
                for (var fs = 78; fs > 42; fs -= 2) {
                  var r = window.__hyperframes.fitTextFontSize(p.text.toUpperCase(), {
                    fontFamily: "Bebas Neue",
                    fontWeight: 700,
                    maxWidth: maxW - 0.6 * fs,
                    baseFontSize: fs,
                    minFontSize: fs,
                  });
                  if (r.fits) break;
                }
                p.plate.style.fontSize = fs + "px";
              });
            }
            window.__hf = window.__hf || {};
            window.__hf.buildReady = window.__hf.buildReady || {};
            window.__hf.buildReady["caption-pill-karaoke"] = document.fonts
              .load(
                '700 100px "Bebas Neue"',
                words
                  .map(function (w) {
                    return w.text;
                  })
                  .join(" ") || "А",
              )
              .then(fit);
          })();
        </script>
      </div>
    </template>
  </body>
</html>
