<!doctype html>
<!--
  cta-lockup: HyperFrames video primitive (ui-props / holdable / ask)

  Concept: a canonical closing lockup with one frozen reveal order. The
  action line arrives first, the CTA capsule pops beneath it with a restrained
  overshoot second, and supporting microcopy settles last. The completed
  lockup then holds with confidence.

  Use when: a product film, launch video, or explainer needs one clear final
  action without adding a second visual idea.

  Variables:
    - action_line (string, default "Начните сегодня"): primary close.
    - button_label (string, default "Оставить заявку"): CTA capsule label.
    - microcopy (string, default "Ответим в течение дня"): supporting detail.

  Envelope:
    IN   1.60s fixed, action line then capsule then microcopy.
    HOLD elastic, with one nearly imperceptible drift cycle across the full
         remaining duration so longer mounts stretch only this phase.
    OUT  none. This closing lockup establishes the final held state.
    If D is shorter than 1.60s, IN compresses to fit and HOLD becomes zero.

  Mount contract: this file is a template-wrapped sub-composition. #root
  fills the host box, establishes the container query basis, carries no
  data-width or data-height, and registers one paused GSAP timeline under
  the hardcoded literal id "cta-lockup".
-->
<html
  lang="en"
  data-composition-id="cta-lockup"
  data-composition-duration="4"
  data-composition-variables='[
    {"id": "action_line", "type": "string", "role": "content", "label": "Action line", "description": "Primary action statement shown above the CTA.", "default": "Начните сегодня", "maxLength": 48},
    {"id": "button_label", "type": "string", "role": "content", "label": "Button label", "description": "Text displayed inside the CTA capsule.", "default": "Оставить заявку", "maxLength": 16},
    {"id": "microcopy", "type": "string", "role": "content", "label": "Microcopy", "description": "Supporting detail shown below the CTA capsule.", "default": "Ответим в течение дня", "maxLength": 48}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>CTA Lockup</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="cta-lockup" data-duration="4" data-fps="30">
        <style>
          @font-face {
            font-family: "Bebas Neue";
            src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
            font-weight: 700;
            font-display: block;
          }
          @font-face {
            font-family: "Montserrat";
            src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
            font-weight: 100 900;
            font-display: block;
            unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
          }
          @font-face {
            font-family: "Montserrat";
            src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
            font-weight: 100 900;
            font-display: block;
            unicode-range:
              U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
              U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
          }
          @font-face {
            font-family: "Montserrat";
            src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
            font-weight: 100 900;
            font-display: block;
            unicode-range:
              U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308,
              U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4,
              U+2113, U+2C60-2C7F, U+A720-A7FF;
          }
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            container-type: size;
            isolation: isolate;
            color: var(--fg, #f2f2f2);
            font-family: var(--font-body, "Montserrat", sans-serif);
            pointer-events: none;
          }

          .cl-clip {
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
            overflow: hidden;
          }

          .cl-lockup {
            width: min(88cqw, 150cqh);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            will-change: transform;
          }

          .cl-action {
            max-width: 86cqw;
            margin: 0 0 6.5cqh;
            color: var(--fg, #f2f2f2);
            font-family: var(--font-display, "Bebas Neue", sans-serif);
            font-size: max(28px, min(10cqw, 14cqh));
            font-weight: 760;
            line-height: 1.02;
            letter-spacing: -0.045em;
            text-wrap: balance;
            will-change: transform, opacity;
          }

          .cl-button {
            min-width: 34cqw;
            max-width: 78cqw;
            margin: 0 0 3.8cqh;
            padding: 3.2cqh 5.5cqw;
            border: 0;
            border-radius: 50cqh;
            background: var(--cl-accent, var(--brand, #ff0000));
            box-shadow: 0 2.2cqh 6cqh
              color-mix(in srgb, var(--cl-accent, var(--brand, #ff0000)) 28%, transparent);
            /* Light text on brand red, as on every brand plate in the base. */
            color: var(--fg, #f2f2f2);
            font: inherit;
            font-size: max(28px, min(4.3cqw, 6.8cqh));
            font-weight: 760;
            line-height: 1.15;
            letter-spacing: -0.02em;
            /* A long label wraps by words, never cut with an ellipsis. */
            text-wrap: balance;
            transform-origin: 50% 50%;
            will-change: transform, opacity;
          }

          .cl-microcopy {
            max-width: 76cqw;
            margin: 0;
            color: var(--muted, #8a8a90);
            font-size: max(28px, min(3cqw, 4.2cqh));
            font-weight: 520;
            line-height: 1.25;
            letter-spacing: 0.01em;
            text-wrap: balance;
            will-change: transform, opacity;
          }
        </style>

        <div
          id="cta-lockup-clip"
          class="cl-clip clip"
          data-start="0"
          data-duration="4"
          data-track-index="0"
        >
          <div class="cl-lockup">
            <h2 class="cl-action"></h2>
            <button class="cl-button" type="button" tabindex="-1"></button>
            <p class="cl-microcopy"></p>
          </div>
        </div>

        <script>
          /* hostSlot: the whole-scene clip follows the host slot (komp-sobrat.py klip_hozyaina; caret-swap:219) */
          (function () {
            var c = document.getElementById("cta-lockup-clip");
            var h = c && c.parentElement && c.parentElement.closest("[data-duration]");
            if (h) c.dataset.duration = h.dataset.duration;
          })();
        </script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";

            var root = document.getElementById("root");
            var lockup = root.querySelector(".cl-lockup");
            var actionLine = root.querySelector(".cl-action");
            var button = root.querySelector(".cl-button");
            var microcopy = root.querySelector(".cl-microcopy");
            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};

            var actionText =
              vars.action_line == null ? "Начните сегодня" : String(vars.action_line);
            var buttonText =
              vars.button_label == null ? "Оставить заявку" : String(vars.button_label);
            var microcopyText =
              vars.microcopy == null ? "Ответим в течение дня" : String(vars.microcopy);

            actionLine.textContent = actionText;
            button.textContent = buttonText;
            microcopy.textContent = microcopyText;
            // One palette: the capsule rides the reel's brand red.
            root.style.setProperty("--cl-accent", "var(--brand, #ff0000)");

            var IN_BASE = 1.6;
            var duration = Math.max(
              0.001,
              parseFloat(
                ((root.parentElement && root.parentElement.closest("[data-duration]")) || root)
                  .dataset.duration || "4",
              ),
            );
            var envelopeScale = Math.min(1, duration / IN_BASE);
            var IN = IN_BASE * envelopeScale;
            var HOLD = Math.max(0, duration - IN);

            var ACTION_DURATION = 0.5 * envelopeScale;
            var BUTTON_AT = 0.56 * envelopeScale;
            var BUTTON_DURATION = 0.6 * envelopeScale;
            var BUTTON_OPACITY_DURATION = 0.24 * envelopeScale;
            var MICROCOPY_AT = 1.18 * envelopeScale;
            var MICROCOPY_DURATION = 0.42 * envelopeScale;

            var tl = gsap.timeline({ paused: true });

            tl.fromTo(
              actionLine,
              { opacity: 0, y: "3.4cqh" },
              { opacity: 1, y: 0, duration: ACTION_DURATION, ease: "power3.out" },
              0,
            );
            tl.fromTo(
              button,
              { scale: 0.72, y: "2.2cqh" },
              {
                scale: 1,
                y: 0,
                duration: BUTTON_DURATION,
                ease: "back.out(1.7)",
              },
              BUTTON_AT,
            );
            tl.fromTo(
              button,
              { opacity: 0 },
              {
                opacity: 1,
                duration: BUTTON_OPACITY_DURATION,
                ease: "power2.out",
              },
              BUTTON_AT,
            );
            tl.fromTo(
              microcopy,
              { opacity: 0, y: "1.8cqh" },
              {
                opacity: 1,
                y: 0,
                duration: MICROCOPY_DURATION,
                ease: "power2.out",
              },
              MICROCOPY_AT,
            );

            if (HOLD > 0) {
              tl.fromTo(
                lockup,
                { y: 0 },
                {
                  y: "-0.35cqh",
                  duration: HOLD / 2,
                  ease: "sine.inOut",
                  yoyo: true,
                  repeat: 1,
                },
                IN,
              );
            }

            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["cta-lockup"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
