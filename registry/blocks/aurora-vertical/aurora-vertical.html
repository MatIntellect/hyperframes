<!doctype html>
<html
  lang="ru"
  data-composition-variables='[
    {"id": "placement", "type": "enum", "role": "layout", "label": "Placement", "description": "full: own ground to the frame edge. top / bottom: the shader on a 780x760 card at y 180-940 / 600-1360, rest of the frame transparent.", "default": "full", "options": [{"value": "full", "label": "Full screen"}, {"value": "top", "label": "Top"}, {"value": "bottom", "label": "Bottom"}]},
    {"id": "ground", "type": "string", "role": "style", "label": "Background", "description": "Ground behind the shader, seen where it is transparent. Any CSS colour; by default the theme token --bg.", "default": "var(--bg, #0c1014)"},
    {"id": "colorA", "type": "string", "role": "style", "label": "Color A", "description": "Edge color at the curtain base. Any CSS colour; by default the theme token --accent.", "default": "var(--accent, #ff0000)"},
    {"id": "colorB", "type": "string", "role": "style", "label": "Color B", "description": "Core color in the bright center. Any CSS colour; by default the theme token --muted.", "default": "var(--muted, #8a8a90)"},
    {"id": "colorC", "type": "string", "role": "style", "label": "Color C", "description": "Tip color at the ray ends. Any CSS colour; by default the theme token --fg.", "default": "var(--fg, #f2f2f2)"},
    {"id": "cues", "type": "string", "role": "timing", "label": "Cues", "description": "Comma-separated seconds from mount start: 1 the shader fades in over 0.6 s (0 = already on the first frame), 2 it fades out over the 0.5 s before it when exit is fade (without cue 2, at the mount end). Empty keeps 0.", "default": ""},
    {"id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "none keeps the shader running to the end of the mount.", "default": "none", "options": [{"value": "none", "label": "Hold"}, {"value": "fade", "label": "Fade"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;
      }
      #shaurorav-root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      /* Full-bleed child carries the ground; never the composition root. */
      #shaurorav-stage {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: var(--shaurorav-ground, var(--bg, #0c1014));
      }
      #shaurorav-stage canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      
      #shaurorav-stage.shaurorav-card {
        left: 150px;
        top: 180px;
        width: 780px;
        height: 760px;
        border-radius: 32px;
        border: 2px solid var(--border, #2e2e32);
      }
      #shaurorav-stage.shaurorav-bottom {
        top: 600px;
      }
      
    </style>
  </head>
  <body>
    <div id="shaurorav-root" data-composition-id="aurora-vertical" data-start="0" data-duration="30" data-width="1080" data-height="1920" data-requires-webgpu>
      <div id="shaurorav-stage">
        <canvas data-shader="Aurora" width="1080" height="1920"></canvas>
      </div>
      <!-- Driver clip: gives the block a timed element for the host timeline. -->
      <div
        id="shaurorav-drv"
        class="clip"
        data-start="0"
        data-duration="30"
        data-track-index="0"
        style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none"
      ></div>
    </div>
    <script>
      // The shared library (assets/lib/shaders.iife.js, below) draws the canvas from HyperFrames time and reads
      // the canvas's data-shader-props once at start (its driver: JSON.parse(canvas.dataset.shaderProps || "{}")).
      // This script runs first: it turns the variables into those props and sizes the canvas.
      (function () {
        var COMP_ID = "aurora-vertical";
        var DURATION = 30;
        // colour variables: id -> default (the same default as in the variables list above)
        var COLORS = {"colorA": "var(--accent, #ff0000)", "colorB": "var(--muted, #8a8a90)", "colorC": "var(--fg, #f2f2f2)"};
        // gradient stop variables stop1..stopN, at these positions; null when the shader has no stop list
        var STOPS = null;
        var MODE = null;
        // settings the brand fixes that are not variables (colour blending)
        var FIXED = {};
        var vars =
          window.__hyperframes && window.__hyperframes.getVariables
            ? window.__hyperframes.getVariables()
            : {};
        var root = document.getElementById("shaurorav-root");
        var stage = document.getElementById("shaurorav-stage");
        var cv = stage.querySelector("canvas");
        // A colour variable is any CSS colour, by default a theme token ("var(--accent, #ff0000)"). The shader needs
        // the resolved colour: a probe inside the root takes the value and the browser resolves it against the reel's
        // palette – the developers' own way (registry/components/halftone-dissolve/halftone-dissolve.html:258-262).
        var probe = document.createElement("span");
        root.appendChild(probe);
        function colour(id, fallback) {
          var v = vars[id];
          probe.style.color = typeof v === "string" && v.trim() ? v.trim() : fallback;
          return getComputedStyle(probe).color || fallback;
        }
        var props = Object.assign({}, FIXED);
        Object.keys(COLORS).forEach(function (id) {
          props[id] = colour(id, COLORS[id]);
        });
        if (STOPS)
          props.stops = STOPS.map(function (s, i) {
            return { color: colour("stop" + (i + 1), s.color), position: s.position };
          });
        if (MODE) props.mode = MODE.indexOf(vars.mode) >= 0 ? vars.mode : MODE[0];
        probe.remove();
        // the ground stays CSS: the variable goes to the block's own token, as camera-scan-gate does (:370-382)
        if (typeof vars.ground === "string" && vars.ground.trim()) root.style.setProperty("--shaurorav-ground", vars.ground.trim());
        var W = 1080,
          H = 1920;
        
        var placement = ["full", "top", "bottom"].indexOf(vars.placement) >= 0 ? vars.placement : "full";
        if (placement !== "full") {
          stage.classList.add("shaurorav-card", "shaurorav-" + placement);
          W = 780;
          H = 760;
        }
        
        cv.width = W;
        cv.height = H;
        cv.dataset.shaderProps = JSON.stringify(props);

        var cues = String(vars.cues || "")
          .split(",")
          .map(parseFloat);
        var c0 = isFinite(cues[0]) && cues[0] >= 0 ? cues[0] : 0;
        var end = isFinite(cues[1]) && cues[1] > c0 + 0.6 ? cues[1] : DURATION;
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });
        if (c0 > 0) tl.fromTo(root, { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, c0);
        if (vars.exit === "fade") tl.to(root, { opacity: 0, duration: 0.5, ease: "power2.in" }, end - 0.5);
        tl.set({}, {}, DURATION);
        window.__timelines[COMP_ID] = tl;
      })();
    </script>
    <script src="assets/lib/shaders.iife.js"></script>
  </body>
</html>
