<!doctype html>
<html
  lang="ru"
  data-composition-variables='[
    { "id": "placement", "type": "enum", "role": "layout", "label": "Placement", "description": "full: the backdrop fills the frame. top / bottom: the backdrop is a rounded card 780x760 at y 180-940 / 600-1360, rest of the frame transparent.", "default": "full", "options": [{ "value": "full", "label": "Full screen" }, { "value": "top", "label": "Top" }, { "value": "bottom", "label": "Bottom" }] },
    { "id": "cues", "type": "string", "role": "timing", "label": "Cues", "description": "Comma-separated seconds from mount start: 1 the backdrop fades in, 2 it shrinks into the card (wide, shape card), 3 it fades out (only when exit is fade). Empty keeps 0 and 1.6.", "default": "" },
    { "id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "none holds the backdrop to the end of the mount.", "default": "none", "options": [{ "value": "none", "label": "Hold" }, { "value": "fade", "label": "Fade" }] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: transparent;
        overflow: hidden;
      }
      body {
        width: 1080px;
        height: 1920px;
      }
      #mbgv-root {
        position: absolute;
        inset: 0;
        background: transparent;
        overflow: hidden;
      }
      #mbgv-card {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--bg, #0c1014);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
      }
      .mbgv-blob {
        position: absolute;
        border-radius: 50%;
      }
      #mbgv-blob1 {
        background: radial-gradient(circle closest-side, color-mix(in srgb, var(--accent, #ff0000) 45%, transparent) 0%, transparent 72%);
      }
      #mbgv-blob2 {
        background: radial-gradient(circle closest-side, color-mix(in srgb, var(--muted, #8a8a90) 30%, transparent) 0%, transparent 72%);
      }
    </style>
  </head>
  <body>
    <div id="mbgv-root" data-composition-id="mk-background-vertical" data-width="1080" data-height="1920" data-start="0" data-duration="30">
      <div id="mbgv-card" data-layout-allow-occlusion>
        <div id="mbgv-blob1" class="mbgv-blob" data-layout-allow-overflow data-layout-ignore></div>
        <div id="mbgv-blob2" class="mbgv-blob" data-layout-allow-overflow data-layout-ignore></div>
      </div>
    </div>
    <script>
      (function () {
        var root = document.getElementById("mbgv-root");
        var card = document.getElementById("mbgv-card");
        var b1 = document.getElementById("mbgv-blob1"),
          b2 = document.getElementById("mbgv-blob2");
        var V =
          window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
            ? window.__hyperframes.getVariables()
            : {};
        function oneOf(v, list, d) {
          return list.indexOf(v) >= 0 ? v : d;
        }
        var W = 1080,
          H = 1920;
        var k = Math.max(W, H) / 1920;
        function place(el, x, y, r, w, h) {
          el.style.cssText = "width:" + 2 * r + "px;height:" + 2 * r + "px;left:" + (x * w - r) + "px;top:" + (y * h - r) + "px";
        }
        place(b1, 0.28, 0.32, 950 * k, W, H);
        place(b2, 0.74, 0.66, 1100 * k, W, H);

        var cues = String(V.cues || "")
          .split(",")
          .map(function (v) {
            return parseFloat(v);
          });
        var c0 = isFinite(cues[0]) && cues[0] >= 0 ? cues[0] : 0;
        var cB = isFinite(cues[1]) && cues[1] > c0 ? cues[1] : c0 + 1.6;
        var exit = oneOf(V.exit, ["none", "fade"], "none");

        var tl = gsap.timeline({ paused: true });
        tl.from(card, { opacity: 0, duration: 0.7, ease: "power2.out" }, c0);
        tl.from([b1, b2], { scale: 1.14, duration: 1.2, ease: "power3.out" }, c0);
        tl.to(b1, { x: 70 * k, y: 42 * k, duration: 2.35, ease: "sine.inOut", yoyo: true, repeat: 11 }, c0 + 0.3);
        tl.to(b2, { x: -84 * k, y: -36 * k, duration: 2.35, ease: "sine.inOut", yoyo: true, repeat: 11 }, c0 + 0.3);
        
        
        var placement = oneOf(V.placement, ["full", "top", "bottom"], "full");
        if (placement !== "full") {
          // пятна – по размеру карточки, иначе второе уходит за её край
          k = 780 / 1920;
          place(b1, 0.28, 0.32, 950 * k, 780, 760);
          place(b2, 0.74, 0.66, 1100 * k, 780, 760);
        }
        if (placement !== "full") gsap.set(card, { x: 150, y: placement === "top" ? 180 : 600, width: 780, height: 760, borderRadius: 32 });
        
        if (exit === "fade") tl.to(card, { opacity: 0, duration: 0.5, ease: "power2.in" }, isFinite(cues[2]) ? cues[2] : cB + 4);
        tl.set({}, {}, 30);
        window.__timelines = window.__timelines || {};
        window.__timelines["mk-background-vertical"] = tl;
      })();
    </script>
  </body>
</html>
