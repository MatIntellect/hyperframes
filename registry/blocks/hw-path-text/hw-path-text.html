<!doctype html>
<html
  lang="ru"
  data-composition-variables='[
    { "id": "d", "type": "string", "role": "layout", "label": "Path", "description": "SVG path the text runs along, in 1920x1080 frame px (the text sits on it, letters rise about 60 px above). An unreadable path falls back to the default wave.", "default": "M 220 700 C 520 480, 900 820, 1230 560 S 1700 380, 1780 420" },
    { "id": "text", "type": "string", "role": "content", "label": "Text", "description": "What is written along the path, letter by letter, Montserrat 76 px.", "maxLength": 34, "default": "Поехали со мной в путешествие" },
    { "id": "guide", "type": "enum", "role": "style", "label": "Guide", "description": "show draws a faint dotted line along the path under the text; none writes without it.", "default": "show", "options": [{ "value": "show", "label": "Show" }, { "value": "none", "label": "None" }] },
    { "id": "cues", "type": "string", "role": "timing", "label": "Cues", "description": "Comma-separated seconds from mount start: 1 the text starts to write (the guide draws from 0.5 s earlier; letters every 0.05 s, all within 2.6 s), 2 the text fades out (only when exit is fade; empty – once it has been read: 0.5 s + 0.3 s a word, at least 2 s after the last letter). Empty keeps 0.7.", "default": "" },
    { "id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "none holds the text to the end of the mount; fade fades it out.", "default": "none", "options": [{ "value": "none", "label": "Hold" }, { "value": "fade", "label": "Fade" }] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: transparent;
        overflow: hidden;
      }
      body {
        width: 1920px;
        height: 1080px;
      }
      #hwt-root {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: transparent; /* накладка поверх видео */
      }
      #hwt-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      /* путь для textPath – только форма; без fill:none он залит чёрным под текстом (как у разработчиков) */
      #hwt-path {
        fill: none;
      }
      #hwt-guide {
        fill: none;
        stroke: var(--fg, #f2f2f2);
        stroke-opacity: 0.22;
        stroke-width: 3;
        stroke-dasharray: 2 14;
        stroke-linecap: round;
      }
      #hwt-svg text {
        font-family: var(--font-body, "Montserrat"), sans-serif;
        font-weight: 700;
        fill: var(--fg, #f2f2f2);
      }
      #hwt-svg tspan {
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="hwt-root" data-composition-id="hw-path-text" data-width="1920" data-height="1080" data-start="0" data-duration="30">
      <svg id="hwt-svg" viewBox="0 0 1920 1080" data-layout-ignore>
        <path id="hwt-path" d=""></path>
        <path id="hwt-guide" d=""></path>
        <text id="hwt-text">
          <textPath id="hwt-tp" href="#hwt-path" startOffset="4%"></textPath>
        </text>
      </svg>
    </div>
    <script>
      (function () {
        var V =
          window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
            ? window.__hyperframes.getVariables()
            : {};
        function oneOf(v, list, d) {
          return list.indexOf(v) >= 0 ? v : d;
        }
        var SEED = 12,
          BOIL = { amp: 1.4, rot: 0.3, frameDrop: 3 },
          CHAR_DELAY = 0.05,
          OUT = 0.36;

        
        var DEF_D = "M 220 700 C 520 480, 900 820, 1230 560 S 1700 380, 1780 420",
          FS = 76,
          DEF_TEXT = "Поехали со мной в путешествие";
        var D = typeof V.d === "string" && V.d.trim() ? V.d.trim() : DEF_D;
        
        

        var pathEl = document.getElementById("hwt-path");
        var guide = document.getElementById("hwt-guide");
        pathEl.setAttribute("d", D);
        var plen = 0;
        try {
          plen = pathEl.getTotalLength();
        } catch (e) {
          plen = 0;
        }
        if (!(plen > 0)) {
          D = DEF_D;
          pathEl.setAttribute("d", D);
        }
        var showGuide = oneOf(V.guide, ["show", "none"], "show") === "show";
        if (showGuide) guide.setAttribute("d", D);
        document.getElementById("hwt-text").setAttribute("font-size", FS);

        /* по букве на tspan вдоль пути (родное) */
        var NS = "http://www.w3.org/2000/svg";
        var tp = document.getElementById("hwt-tp");
        var said = typeof V.text === "string" ? V.text.trim() : DEF_TEXT;
        Array.from(said).forEach(function (ch) {
          var t = document.createElementNS(NS, "tspan");
          t.textContent = ch;
          tp.appendChild(t);
        });

        var cues = String(V.cues || "")
          .split(",")
          .map(function (v) {
            return parseFloat(v);
          });
        var c0 = isFinite(cues[0]) && cues[0] >= 0 ? cues[0] : 0.7;
        var exit = oneOf(V.exit, ["none", "fade"], "none");

        var tl = gsap.timeline({ paused: true });
        /* сперва пунктир, потом надпись по нему (родной ход) */
        if (showGuide) {
          var glen = guide.getTotalLength();
          gsap.set(guide, { strokeDasharray: "2 14", strokeDashoffset: glen });
          tl.to(guide, { strokeDashoffset: 0, duration: 0.9, ease: "power2.inOut" }, Math.max(0, c0 - 0.5));
        }
        var chars = tp.querySelectorAll("tspan");
        var delay = Math.min(CHAR_DELAY, 2.6 / Math.max(1, chars.length));
        if (chars.length) tl.to(chars, { opacity: 1, duration: 0.03, stagger: delay, ease: "none" }, c0);
        var typed = c0 + chars.length * delay;

        /* дрожь всей надписи – родная */
        var svg = document.getElementById("hwt-svg");
        function boil() {
          var step = Math.floor((tl.time() * 30) / BOIL.frameDrop);
          gsap.set(svg, {
            x: hash(step * 3) * BOIL.amp,
            y: hash(step * 3 + 1) * BOIL.amp,
            rotation: hash(step * 3 + 2) * BOIL.rot,
          });
        }
        function hash(n) {
          var x = Math.sin(n * 127.1 + SEED * 311.7) * 43758.5453;
          return (x - Math.floor(x)) * 2 - 1;
        }
        tl.eventCallback("onUpdate", boil);
        boil();

        var words = said ? said.split(/\s+/).length : 0;
        if (exit === "fade") tl.to(svg, { opacity: 0, duration: OUT, ease: "power2.in" }, isFinite(cues[1]) && cues[1] > c0 ? cues[1] : typed + Math.max(2, 0.5 + 0.3 * words));
        tl.set({}, {}, 30);
        window.__timelines = window.__timelines || {};
        window.__timelines["hw-path-text"] = tl;
      })();
    </script>
  </body>
</html>
