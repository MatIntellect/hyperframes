<!doctype html>
<html
  lang="ru"
  data-composition-variables='[
    { "id": "badge", "type": "string", "role": "content", "label": "Badge", "description": "Small red caps line above the headline.", "maxLength": 24, "default": "Запись → готовый ролик" },
    { "id": "head1", "type": "string", "role": "content", "label": "Headline line 1", "description": "First headline line behind the glass, Bebas Neue, one line (a long line shrinks to the field width).", "maxLength": 14, "default": "Ролики сами" },
    { "id": "head2", "type": "string", "role": "content", "label": "Headline line 2", "description": "Second headline line in red, Bebas Neue, one line (a long line shrinks to the field width).", "maxLength": 14, "default": "в 10 раз быстрее" },
    { "id": "sub", "type": "string", "role": "content", "label": "Text", "description": "Text under the headline, Montserrat, up to two lines (three in the vertical layouts).", "maxLength": 80, "default": "Без монтажёра и таймлайна: субтитры, графика и звук собираются из записи" },
    { "id": "val1", "type": "string", "role": "content", "label": "Number 1", "description": "First number, Montserrat.", "maxLength": 6, "default": "10x" },
    { "id": "lab1", "type": "string", "role": "content", "label": "Number 1 label", "description": "Caps label under the first number.", "maxLength": 12, "default": "Быстрее" },
    { "id": "val2", "type": "string", "role": "content", "label": "Number 2", "description": "Second number, Montserrat.", "maxLength": 6, "default": "148" },
    { "id": "lab2", "type": "string", "role": "content", "label": "Number 2 label", "description": "Caps label under the second number.", "maxLength": 12, "default": "Роликов" },
    { "id": "val3", "type": "string", "role": "content", "label": "Number 3", "description": "Third number, Montserrat.", "maxLength": 6, "default": "71%" },
    { "id": "lab3", "type": "string", "role": "content", "label": "Number 3 label", "description": "Caps label under the third number.", "maxLength": 12, "default": "Досмотров" },
    { "id": "cues", "type": "string", "role": "timing", "label": "Cues", "description": "Comma-separated seconds from mount start: 1 the block fades out (only when exit is fade). The glass drifts and parts around a wandering point for 20 s from the mount start; from 18.2 s it opens over the page and by 19.6 s rests with the page in a clear window. Empty keeps 20.", "default": "" },
    { "id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "none holds the opened glass (the page in a clear window) to the end of the mount; fade fades the block out.", "default": "none", "options": [{ "value": "none", "label": "Hold" }, { "value": "fade", "label": "Fade" }] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        background: transparent;
        overflow: hidden;
      }
      #lgl-root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #lgl-frame {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      
      #lgl-cap,
      #lgl-theater {
        position: absolute;
        top: 0;
        left: 0;
      }
      #lgl-cap {
        pointer-events: none;
      }
      /* страница за стеклом: размеры в пикселях текстуры, на экране она крупнее в 1.18 раза (плоскость фона больше кадра) */
      .lgl-src {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 85% 8%, color-mix(in srgb, var(--accent, #ff0000) 7%, transparent), transparent 40%),
          linear-gradient(160deg, var(--bg, #0c1014) 0%, var(--surface, #18181a) 45%, var(--bg, #0c1014) 100%);
      }
      .lgl-in {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
      }
      .lgl-badge {
        font-family: var(--font-body, "Montserrat"), sans-serif;
        font-weight: 600;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--accent, #ff0000);
      }
      .lgl-h1 {
        font-family: var(--font-display, "Bebas Neue"), sans-serif;
        font-weight: 700;
        line-height: 0.92;
        color: var(--fg, #f2f2f2);
        text-shadow: 0 0 60px rgb(255 255 255 / 15%);
      }
      .lgl-h1 span {
        display: block;
        white-space: nowrap;
      }
      .lgl-h1 span + span {
        color: var(--accent, #ff0000);
      }
      .lgl-sub {
        font-family: var(--font-body, "Montserrat"), sans-serif;
        color: var(--muted, #8a8a90);
        line-height: 1.45;
      }
      .lgl-stats {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        row-gap: 20px;
        margin-top: 8px;
      }
      .lgl-val {
        font-family: var(--font-body, "Montserrat"), sans-serif;
        font-weight: 700;
        line-height: 1;
        color: var(--fg, #f2f2f2);
      }
      .lgl-lab {
        font-family: var(--font-body, "Montserrat"), sans-serif;
        font-weight: 600;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--muted, #8a8a90);
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <div id="lgl-root" data-composition-id="vfx-liquid-glass" data-width="1920" data-height="1080" data-start="0" data-duration="30">
      <div id="lgl-frame">
        <canvas id="lgl-cap" layoutsubtree width="1920" height="1080">
          <!-- источник текстуры за стеклом, на экран не выводится: текст виден только сквозь осколки (format.md:140) -->
          <div class="lgl-src" data-layout-ignore>
            <div class="lgl-in">
              <div class="lgl-badge" id="lgl-badge"></div>
              <h1 class="lgl-h1"><span id="lgl-head1"></span><span id="lgl-head2"></span></h1>
              <div class="lgl-sub" id="lgl-sub"></div>
              <div class="lgl-stats">
                <div><div class="lgl-val" id="lgl-val1"></div><div class="lgl-lab" id="lgl-lab1"></div></div>
                <div><div class="lgl-val" id="lgl-val2"></div><div class="lgl-lab" id="lgl-lab2"></div></div>
                <div><div class="lgl-val" id="lgl-val3"></div><div class="lgl-lab" id="lgl-lab3"></div></div>
              </div>
            </div>
          </div>
        </canvas>
        <canvas id="lgl-theater" width="1920" height="1080"></canvas>
      </div>
    </div>
    <script>
      // страница за стеклом меряется шрифтами бренда – строим после их загрузки (runtimes.md)
      Promise.all([document.fonts.load('700 120px "Bebas Neue"'), document.fonts.load('400 32px "Montserrat"'), document.fonts.load('600 32px "Montserrat"'), document.fonts.load('700 32px "Montserrat"')]).then(function () {
      var V =
        window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
          ? window.__hyperframes.getVariables()
          : {};
      function txt(v, d) {
        return typeof v === "string" && v.trim() ? v.trim() : d;
      }
      function oneOf(v, list, d) {
        return list.indexOf(v) >= 0 ? v : d;
      }
      var $ = function (id) {
        return document.getElementById("lgl-" + id);
      };
      var root = $("root"),
        frame = $("frame");
      var css = getComputedStyle(root);
      var BG = css.getPropertyValue("--bg").trim() || "#0c1014",
        FG = css.getPropertyValue("--fg").trim() || "#f2f2f2",
        ACC = css.getPropertyValue("--accent").trim() || "#ff0000";

      // размеры страницы (пиксели текстуры) на каждую раскладку; SHIFT – сдвиг середины текста к середине поля
      var W = 1920,
        H = 1080,
        T = { w: 1300, badge: 30, h1: 170, sub: 34, subW: 1000, val: 90, lab: 26, gap: 64 },
        SHIFT = 0;
      
      var DURATION = 20,
        ASPECT = W / H;
      var TEXT_Z = -3.08;
      ["cap", "theater"].forEach(function (id) {
        $(id).width = W;
        $(id).height = H;
        $(id).style.width = W + "px";
        $(id).style.height = H + "px";
      });
      var srcEl = frame.querySelector(".lgl-src");
      srcEl.style.width = W + "px";
      srcEl.style.height = H + "px";
      var inner = frame.querySelector(".lgl-in");
      inner.style.maxWidth = T.w + "px";
      inner.style.transform = "translateY(" + SHIFT + "px)";
      $("badge").style.fontSize = T.badge + "px";
      frame.querySelector(".lgl-h1").style.fontSize = T.h1 + "px";
      $("sub").style.fontSize = T.sub + "px";
      $("sub").style.maxWidth = T.subW + "px";
      frame.querySelector(".lgl-stats").style.gap = T.gap + "px";
      frame.querySelectorAll(".lgl-val").forEach(function (e) {
        e.style.fontSize = T.val + "px";
      });
      frame.querySelectorAll(".lgl-lab").forEach(function (e) {
        e.style.fontSize = T.lab + "px";
      });
      var HEAD1 = txt(V.head1, "Ролики сами"),
        HEAD2 = txt(V.head2, "в 10 раз быстрее");
      $("badge").textContent = txt(V.badge, "Запись → готовый ролик");
      $("head1").textContent = HEAD1;
      $("head2").textContent = HEAD2;
      $("sub").textContent = txt(V.sub, "Без монтажёра и таймлайна: субтитры, графика и звук собираются из записи");
      [["val1", "10x"], ["lab1", "Быстрее"], ["val2", "148"], ["lab2", "Роликов"], ["val3", "71%"], ["lab3", "Досмотров"]].forEach(function (p) {
        $(p[0]).textContent = txt(V[p[0]], p[1]);
      });
      // строка заголовка – одной строкой: длинная уменьшает свой шрифт до ширины поля
      ["head1", "head2"].forEach(function (id) {
        var e = $(id);
        if (e.scrollWidth > T.w) e.style.fontSize = Math.floor((T.h1 * T.w) / e.scrollWidth) + "px";
      });

      // ── Seeded PRNG ────────────────────────────────────────────────────
      function seededRandom(seed) {
        var v = seed >>> 0;
        return function () {
          v += 0x6d2b79f5;
          var m = v;
          m = Math.imul(m ^ (m >>> 15), m | 1);
          m ^= m + Math.imul(m ^ (m >>> 7), m | 61);
          return ((m ^ (m >>> 14)) >>> 0) / 4294967296;
        };
      }

      // ── Voronoi (self-contained, no d3) ────────────────────────────────
      function polygonArea(pts) {
        var a = 0;
        for (var i = 0; i < pts.length; i++) {
          var j = (i + 1) % pts.length;
          a += pts[i][0] * pts[j][1] - pts[j][0] * pts[i][1];
        }
        return a * 0.5;
      }

      function polygonCentroid(pts) {
        var sa = polygonArea(pts) || 1;
        var cx = 0,
          cy = 0;
        for (var i = 0; i < pts.length; i++) {
          var j = (i + 1) % pts.length;
          var f = pts[i][0] * pts[j][1] - pts[j][0] * pts[i][1];
          cx += (pts[i][0] + pts[j][0]) * f;
          cy += (pts[i][1] + pts[j][1]) * f;
        }
        return { x: cx / (6 * sa), y: cy / (6 * sa) };
      }

      function clipPoly(poly, px, py, nx, ny) {
        var out = [];
        for (var i = 0; i < poly.length; i++) {
          var c = poly[i],
            n = poly[(i + 1) % poly.length];
          var dc = (c[0] - px) * nx + (c[1] - py) * ny;
          var dn = (n[0] - px) * nx + (n[1] - py) * ny;
          if (dc <= 0) out.push(c);
          if (dc <= 0 !== dn <= 0) {
            var t = dc / (dc - dn);
            out.push([c[0] + t * (n[0] - c[0]), c[1] + t * (n[1] - c[1])]);
          }
        }
        return out;
      }

      function computeVoronoi(points, xmin, ymin, xmax, ymax) {
        var cells = [];
        for (var i = 0; i < points.length; i++) {
          var px = points[i][0],
            py = points[i][1];
          var poly = [
            [xmin, ymin],
            [xmax, ymin],
            [xmax, ymax],
            [xmin, ymax],
          ];
          for (var j = 0; j < points.length; j++) {
            if (i === j) continue;
            var qx = points[j][0],
              qy = points[j][1];
            var mx = (px + qx) * 0.5,
              my = (py + qy) * 0.5;
            poly = clipPoly(poly, mx, my, qx - px, qy - py);
            if (poly.length < 3) break;
          }
          cells.push(poly.length >= 3 ? poly : null);
        }
        return cells;
      }

      // ── Feature Detection ──────────────────────────────────────────────
      function canCapture() {
        var tc = document.createElement("canvas");
        if (!("layoutSubtree" in tc)) return false;
        tc.setAttribute("layoutsubtree", "");
        var ctx = tc.getContext("2d");
        return ctx && typeof ctx.drawElementImage === "function";
      }
      var apiOk = canCapture();


      // ── Capture backdrop ───────────────────────────────────────────────
      var capCanvas = document.getElementById("lgl-cap");
      var capCtx = capCanvas.getContext("2d");
      var textEl = capCanvas.querySelector(".lgl-src");

      function captureBackdrop() {
        capCtx.clearRect(0, 0, W, H);
        if (apiOk) {
          capCtx.drawElementImage(textEl, 0, 0, W, H);
        } else {
          // запасной путь – заголовок прямо на холсте, шрифтом бренда
          capCtx.fillStyle = BG;
          capCtx.fillRect(0, 0, W, H);
          capCtx.textAlign = "center";
          capCtx.textBaseline = "middle";
          capCtx.font = "700 " + T.h1 + 'px "Bebas Neue"';
          capCtx.fillStyle = FG;
          capCtx.fillText(HEAD1, W / 2, H / 2 + SHIFT - T.h1 * 0.5);
          capCtx.fillStyle = ACC;
          capCtx.fillText(HEAD2, W / 2, H / 2 + SHIFT + T.h1 * 0.5);
        }
      }

      // ── Three.js Renderer ──────────────────────────────────────────────
      var theaterCanvas = document.getElementById("lgl-theater");
      var renderer = new THREE.WebGLRenderer({
        canvas: theaterCanvas,
        antialias: true,
        alpha: false,
        powerPreference: "high-performance",
        preserveDrawingBuffer: true,
      });
      renderer.setSize(W, H, false);
      renderer.setPixelRatio(1);
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.08;
      renderer.setClearColor(0x030407, 1);

      var scene = new THREE.Scene();
      scene.background = new THREE.Color(0x030407);

      // ── Environment Map (procedural) ───────────────────────────────────
      var envCanvas = document.createElement("canvas");
      envCanvas.width = 1024;
      envCanvas.height = 512;
      var ectx = envCanvas.getContext("2d");
      var eg = ectx.createLinearGradient(0, 0, 1024, 512);
      eg.addColorStop(0, "#020307");
      eg.addColorStop(0.18, "#ffffff");
      eg.addColorStop(0.24, "#7fdcff");
      eg.addColorStop(0.42, "#07101c");
      eg.addColorStop(0.58, "#ffffff");
      eg.addColorStop(0.64, "#ffc4a6");
      eg.addColorStop(0.82, "#0b0c12");
      eg.addColorStop(1, "#020307");
      ectx.fillStyle = eg;
      ectx.fillRect(0, 0, 1024, 512);
      ectx.globalCompositeOperation = "screen";
      var envRng = seededRandom(999);
      for (var ei = 0; ei < 9; ei++) {
        var ey = 36 + ei * 52;
        ectx.fillStyle = "rgba(255,255,255," + (ei % 3 === 0 ? 0.22 : 0.1) + ")";
        ectx.fillRect((ei % 2) * 120, ey, 1024 * 0.72, 4 + (ei % 3) * 2);
      }
      var envTex = new THREE.CanvasTexture(envCanvas);
      envTex.mapping = THREE.EquirectangularReflectionMapping;
      var pmrem = new THREE.PMREMGenerator(renderer);
      var envMap = pmrem.fromEquirectangular(envTex);
      scene.environment = envMap.texture;
      envTex.dispose();
      pmrem.dispose();

      // ── Camera ─────────────────────────────────────────────────────────
      var CAM_Z = 9.35;
      // угол по высоте растёт с высотой кадра выше 1080: ячейка стекла остаётся ~190 px, как у разработчиков в 16:9
      var FOV = (2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(17)) * Math.max(1, H / 1080)) * 180) / Math.PI;
      var camera = new THREE.PerspectiveCamera(FOV, ASPECT, 0.1, 80);
      camera.position.set(0, 0, CAM_Z);

      // ── Scene Groups ───────────────────────────────────────────────────
      var rig = new THREE.Group();
      scene.add(rig);
      var textRig = new THREE.Group();
      rig.add(textRig);

      // ── Backdrop Plane (text behind glass) ─────────────────────────────
      var backdropTex = new THREE.CanvasTexture(capCanvas);
      backdropTex.minFilter = THREE.LinearFilter;
      backdropTex.magFilter = THREE.LinearFilter;
      backdropTex.generateMipmaps = false;

      function viewportAtZ(z) {
        var d = camera.position.z - z;
        var h = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5)) * d;
        return { w: h * camera.aspect, h: h };
      }
      var vp = viewportAtZ(TEXT_Z);
      var backdropMesh = new THREE.Mesh(
        new THREE.PlaneGeometry(vp.w * 1.18, vp.h * 1.18),
        new THREE.MeshBasicMaterial({ map: backdropTex, depthWrite: true, depthTest: true }),
      );
      backdropMesh.position.z = TEXT_Z;
      backdropMesh.renderOrder = -4;
      textRig.add(backdropMesh);


      // ── Light Bands ────────────────────────────────────────────────────
      var bandSpecs = [
        [-2.8, 1.45, -1.78, 3.2, 0.035, 0.13, 0x9edaff, 0.24],
        [2.7, -1.24, -1.76, 3.0, 0.032, -0.1, 0xffd1b5, 0.18],
        [0.0, 2.05, -1.82, 5.2, 0.026, 0.02, 0xffffff, 0.13],
        [-0.55, -1.92, -1.8, 4.2, 0.024, -0.03, 0xc7f6ff, 0.1],
      ];
      bandSpecs.forEach(function (s) {
        var m = new THREE.Mesh(
          new THREE.PlaneGeometry(s[3], s[4]),
          new THREE.MeshBasicMaterial({
            color: s[6],
            transparent: true,
            opacity: s[7],
            blending: THREE.AdditiveBlending,
            depthWrite: false,
          }),
        );
        m.position.set(s[0], s[1], s[2]);
        m.rotation.z = s[5];
        rig.add(m);
      });

      // ── Glass Shards (Voronoi fracture) ────────────────────────────────
      // сетка осколков – под видимую область (у разработчиков 9.7 x 5.78, 9 x 6 при 16:9): та же доля поля и тот же размер ячейки
      var VP0 = viewportAtZ(0);
      var LAYOUT = {
        width: VP0.w * 0.954,
        height: VP0.h * 1.011,
        cols: Math.max(3, Math.round((VP0.w * 0.954) / 1.078)),
        rows: Math.max(3, Math.round((VP0.h * 1.011) / 0.963)),
        seed: 5297,
      };
      var rng = seededRandom(LAYOUT.seed);
      var seedPoints = [];
      var cw = LAYOUT.width / LAYOUT.cols,
        ch = LAYOUT.height / LAYOUT.rows;

      for (var row = 0; row < LAYOUT.rows; row++) {
        for (var col = 0; col < LAYOUT.cols; col++) {
          var cp =
            1 -
            Math.min(
              0.62,
              Math.hypot((col + 0.5) / LAYOUT.cols - 0.5, (row + 0.5) / LAYOUT.rows - 0.5),
            );
          var jx = (rng() - 0.5) * cw * (0.58 + cp * 0.16);
          var jy = (rng() - 0.5) * ch * (0.58 + cp * 0.16);
          seedPoints.push([(col + 0.5) * cw + jx, (row + 0.5) * ch + jy]);
        }
      }

      var voronoiCells = computeVoronoi(seedPoints, 0, 0, LAYOUT.width, LAYOUT.height);

      var glassRig = new THREE.Group();
      glassRig.scale.setScalar(1.025);
      glassRig.position.set(0, 0, 0.08);
      rig.add(glassRig);

      var panes = [];
      var GAP_SCALE = 0.954;

      for (var pi = 0; pi < voronoiCells.length; pi++) {
        var cell = voronoiCells[pi];
        if (!cell || cell.length < 3) continue;

        var worldPts = cell.map(function (p) {
          return [p[0] - LAYOUT.width / 2, LAYOUT.height / 2 - p[1]];
        });
        var area = Math.abs(polygonArea(worldPts));
        if (area < 0.034) continue;

        var cent = polygonCentroid(worldPts);
        var rad = new THREE.Vector2(cent.x, cent.y);
        var radLen = Math.max(rad.length(), 0.001);
        rad.divideScalar(radLen);

        var localPts = worldPts.map(function (p) {
          return [(p[0] - cent.x) * GAP_SCALE, (p[1] - cent.y) * GAP_SCALE];
        });
        var outward = 0.046 + rng() * 0.105;
        var depthLift = (area / (LAYOUT.width * LAYOUT.height)) * 1.42;
        var phase = pi * 0.71 + rng() * 4;
        var depth = 0.18 + rng() * 0.1;
        var bevel = Math.min(0.108, Math.sqrt(area) * 0.095);
        var roughness = pi % 7 === 0 ? 0.08 + rng() * 0.035 : 0.012 + rng() * 0.038;
        var thickness = 1.45 + rng() * 1.25;

        // Geometry
        var shape = new THREE.Shape();
        localPts.forEach(function (p, idx) {
          idx === 0 ? shape.moveTo(p[0], p[1]) : shape.lineTo(p[0], p[1]);
        });
        shape.closePath();
        var geo = new THREE.ExtrudeGeometry(shape, {
          depth: depth,
          bevelEnabled: true,
          bevelThickness: bevel,
          bevelSize: bevel,
          bevelSegments: 9,
          curveSegments: 2,
          steps: 2,
        });
        geo.center();
        geo.computeVertexNormals();

        // Material
        var mat = new THREE.MeshPhysicalMaterial({
          color: 0xf7fbff,
          metalness: 0,
          roughness: roughness,
          transmission: 1,
          thickness: thickness,
          ior: 1.55,
          attenuationColor: new THREE.Color(0xe5f8ff),
          attenuationDistance: 12,
          clearcoat: 1,
          clearcoatRoughness: Math.min(0.12, roughness + 0.035),
          specularIntensity: 1,
          envMapIntensity: 2.1,
          transparent: true,
          opacity: 0.76,
          side: THREE.DoubleSide,
        });

        var pane = new THREE.Group();
        var mesh = new THREE.Mesh(geo, mat);
        mesh.renderOrder = 4 + pi;
        pane.add(mesh);

        // Edge highlights (white + cyan + pink for chromatic aberration look)
        var edgeGeo = new THREE.EdgesGeometry(geo, 18);
        var whiteEdge = new THREE.LineSegments(
          edgeGeo,
          new THREE.LineBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: roughness > 0.08 ? 0.32 : 0.44,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
          }),
        );
        pane.add(whiteEdge);
        var cyanEdge = new THREE.LineSegments(
          edgeGeo.clone(),
          new THREE.LineBasicMaterial({
            color: 0x72e8ff,
            transparent: true,
            opacity: 0.18,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
          }),
        );
        cyanEdge.position.set(0.008, -0.002, -0.008);
        pane.add(cyanEdge);
        var pinkEdge = new THREE.LineSegments(
          edgeGeo.clone(),
          new THREE.LineBasicMaterial({
            color: 0xff6f8d,
            transparent: true,
            opacity: 0.14,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
          }),
        );
        pinkEdge.position.set(-0.009, 0.003, 0.006);
        pane.add(pinkEdge);

        var basePos = new THREE.Vector3(
          cent.x + rad.x * outward,
          cent.y + rad.y * outward,
          0.28 + depthLift + rng() * 0.18,
        );
        var baseRot = new THREE.Euler(
          (rng() - 0.5) * 0.074,
          (rng() - 0.5) * 0.086,
          (rng() - 0.5) * 0.052,
        );
        pane.position.copy(basePos);
        pane.rotation.copy(baseRot);

        pane.userData = {
          basePos: basePos.clone(),
          baseRot: { x: baseRot.x, y: baseRot.y, z: baseRot.z },
          phase: phase,
          speed: 0.28 + rng() * 0.16,
          drift: new THREE.Vector3(
            0.02 + rng() * 0.026,
            0.018 + rng() * 0.024,
            0.068 + rng() * 0.092,
          ),
          rotDrift: new THREE.Vector3(
            0.016 + rng() * 0.026,
            0.018 + rng() * 0.03,
            0.008 + rng() * 0.016,
          ),
          ptrWeight: 0.04 + rng() * 0.052,
          rad: rad.clone(),
          baseOpacity: 0.76,
          baseRoughness: roughness,
          glassMat: mat,
          edgeW: whiteEdge.material,
          edgeC: cyanEdge.material,
          edgeP: pinkEdge.material,
          edgeWBase: whiteEdge.material.opacity,
          edgeCBase: cyanEdge.material.opacity,
          edgePBase: pinkEdge.material.opacity,
        };

        panes.push(pane);
        glassRig.add(pane);
      }

      // ── Lighting ───────────────────────────────────────────────────────
      scene.add(new THREE.HemisphereLight(0xe8f0ff, 0x07040b, 1.1));
      var keyLight = new THREE.DirectionalLight(0xffffff, 3.4);
      keyLight.position.set(-3.8, 4.4, 5.6);
      scene.add(keyLight);
      var edgeLight = new THREE.PointLight(0x8bdcff, 14, 12);
      edgeLight.position.set(3.1, 1.4, 3.4);
      scene.add(edgeLight);
      var warmLight = new THREE.PointLight(0xffc8a8, 7, 12);
      warmLight.position.set(-4.4, -2.2, 3.2);
      scene.add(warmLight);

      // ── Post-Processing ────────────────────────────────────────────────
      var GrainShader = {
        uniforms: { tDiffuse: { value: null }, time: { value: 0 }, strength: { value: 0.024 } },
        vertexShader:
          "varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }",
        fragmentShader: [
          "uniform sampler2D tDiffuse; uniform float time; uniform float strength; varying vec2 vUv;",
          "float n(vec2 v){ return fract(sin(dot(v+time,vec2(12.9898,78.233)))*43758.5453); }",
          "void main(){",
          "  vec4 c=texture2D(tDiffuse,vUv);",
          "  c.rgb+=(n(vUv*vec2(1520.0,940.0))-0.5)*strength;",
          "  c.rgb=pow(max(c.rgb,vec3(0.0)),vec3(0.985));",
          "  gl_FragColor=c;",
          "}",
        ].join("\n"),
      };

      var composer = new THREE.EffectComposer(renderer);
      composer.addPass(new THREE.RenderPass(scene, camera));
      var bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(W, H), 0.32, 0.4, 0.86);
      composer.addPass(bloomPass);
      var grainPass = new THREE.ShaderPass(GrainShader);
      composer.addPass(grainPass);


      // ── Pointer State (GSAP-animated, replaces mouse) ──────────────────
      var ptr = { x: 0.16, y: 0.04 };
      var REVEAL_R = 2.18;
      // покой: стекло расходится над страницей. Окно – прямоугольник текста (пиксели текстуры на экране в 1.18 раза
      // крупнее), переведённый в мир на глубину осколков, с запасом в полосколка; rest.k – доля раскрытия
      var rest = { k: 0 };
      var VPG = viewportAtZ(0.4),
        PXW = (1.18 * VPG.h) / H,
        WIN = {
          x: 0,
          y: -SHIFT * PXW,
          ax: ((inner.offsetWidth || T.w) / 2) * PXW + 0.55,
          ay: ((inner.offsetHeight || T.h1 * 2) / 2) * PXW + 0.55,
        };
      var PTR_WORLD = new THREE.Vector2();

      function updatePtrWorld() {
        // у разработчиков 4.86 x 2.84 – доли видимой области 16:9
        PTR_WORLD.set(ptr.x * VP0.w * 0.478, ptr.y * VP0.h * 0.497);
      }


      // ── Render Function (deterministic, seekable) ──────────────────────
      function renderScene(elapsed) {
        updatePtrWorld();

        camera.position.x = ptr.x * 0.38;
        camera.position.y = -ptr.y * 0.27;
        camera.position.z = CAM_Z;
        camera.lookAt(0, 0, 0);

        textRig.position.x = -ptr.x * 0.56;
        textRig.position.y = ptr.y * 0.36;
        textRig.position.z = Math.sin(elapsed * 0.28) * 0.018;
        textRig.rotation.x = ptr.y * 0.028;
        textRig.rotation.y = ptr.x * 0.042;

        glassRig.rotation.x = -ptr.y * 0.064;
        glassRig.rotation.y = ptr.x * 0.078;

        edgeLight.position.x = 3.1 + ptr.x * 0.9;
        edgeLight.position.y = 1.4 + ptr.y * 0.55;
        warmLight.position.x = -4.4 - ptr.x * 0.65;

        for (var i = 0; i < panes.length; i++) {
          var pane = panes[i];
          var d = pane.userData;
          var t = elapsed * d.speed + d.phase;
          var ptrDist = PTR_WORLD.distanceTo(new THREE.Vector2(d.basePos.x, d.basePos.y));
          var reveal = Math.pow(Math.max(0, 1 - ptrDist / REVEAL_R), 2);
          var shatter = reveal * 0.36;
          var awayX = d.basePos.x - PTR_WORLD.x;
          var awayY = d.basePos.y - PTR_WORLD.y;
          var awayLen = Math.max(Math.hypot(awayX, awayY), 0.001);
          var revealSpread = reveal * 0.24;
          var shatterSpread = shatter * 0.68;
          var pSlide = d.ptrWeight * 1.9;

          pane.position.x =
            d.basePos.x +
            Math.sin(t * 0.42) * d.drift.x +
            ptr.x * pSlide +
            (awayX / awayLen) * (revealSpread + shatterSpread);
          pane.position.y =
            d.basePos.y +
            Math.cos(t * 0.38) * d.drift.y -
            ptr.y * pSlide * 0.72 +
            (awayY / awayLen) * (revealSpread + shatterSpread * 0.84);
          if (rest.k > 0) {
            // осколок внутри окна уходит по своему лучу на край окна
            var ox = pane.position.x - WIN.x,
              oy = pane.position.y - WIN.y,
              e = Math.max(Math.abs(ox) / WIN.ax, Math.abs(oy) / WIN.ay);
            if (e < 1) {
              var f = 1 + (1 / Math.max(e, 0.06) - 1) * rest.k;
              pane.position.x = WIN.x + ox * f;
              pane.position.y = WIN.y + oy * f;
            }
          }
          pane.position.z =
            d.basePos.z + Math.sin(t * 0.52 + i) * d.drift.z + reveal * 0.32 + shatter * 0.74;

          pane.rotation.x =
            d.baseRot.x +
            Math.sin(t * 0.46) * d.rotDrift.x -
            ptr.y * d.ptrWeight * 1.15 +
            reveal * (awayY / awayLen) * 0.16 +
            shatter * (awayY / awayLen) * 0.58;
          pane.rotation.y =
            d.baseRot.y +
            Math.cos(t * 0.43) * d.rotDrift.y +
            ptr.x * d.ptrWeight * 1.38 -
            reveal * (awayX / awayLen) * 0.2 -
            shatter * (awayX / awayLen) * 0.66;
          pane.rotation.z =
            d.baseRot.z +
            Math.sin(t * 0.34) * d.rotDrift.z +
            reveal * Math.sin(t + i) * 0.028 +
            shatter * (d.rad.x * awayY - d.rad.y * awayX) * 0.18;

          d.glassMat.opacity = d.baseOpacity + shatter * 0.14;
          d.glassMat.roughness = Math.min(0.14, d.baseRoughness + shatter * 0.048);
          d.edgeW.opacity = d.edgeWBase + shatter * 0.34;
          d.edgeC.opacity = d.edgeCBase + shatter * 0.22;
          d.edgeP.opacity = d.edgePBase + shatter * 0.2;
        }

        grainPass.uniforms.time.value = elapsed;
        composer.render();
      }


      // ── Ход разработчиков (20 с), блуждающая точка раздвигает стекло ──
      var cues = String(V.cues || "")
        .split(",")
        .map(function (v) {
          return parseFloat(v);
        });
      var exit = oneOf(V.exit, ["none", "fade"], "none");
      var tl = gsap.timeline({ paused: true });
      tl.to({ _: 0 }, { _: 1, duration: DURATION, ease: "none" }, 0);
      tl.set(ptr, { x: 0.16, y: 0.04 }, 0);
      tl.to(ptr, { x: 0.45, y: -0.15, duration: 3.5, ease: "sine.inOut" }, 0.5);
      tl.to(ptr, { x: -0.35, y: 0.25, duration: 3.5, ease: "sine.inOut" }, 4);
      tl.to(ptr, { x: 0.15, y: -0.35, duration: 3, ease: "sine.inOut" }, 7.5);
      tl.to(ptr, { x: -0.45, y: 0.05, duration: 3, ease: "sine.inOut" }, 10.5);
      tl.to(ptr, { x: 0.3, y: 0.2, duration: 3, ease: "sine.inOut" }, 13.5);
      tl.to(ptr, { x: -0.1, y: -0.1, duration: 1.7, ease: "sine.inOut" }, 16.5);
      tl.to(ptr, { x: 0, y: 0, duration: 1.4, ease: "power2.inOut" }, 18.2);
      tl.to(rest, { k: 1, duration: 1.4, ease: "power2.inOut" }, 18.2);
      if (exit === "fade") tl.to(frame, { opacity: 0, duration: 0.5, ease: "power2.in" }, isFinite(cues[0]) && cues[0] > 0 ? cues[0] : DURATION);
      tl.set({}, {}, 30);
      tl.eventCallback("onUpdate", function () {
        renderScene(tl.time());
      });
      // снимок страницы – только когда холст её отрисовал (как в принятом liquid-glass-widgets): иначе «No cached paint record»
      capCanvas.onpaint = function () {
        captureBackdrop();
        backdropTex.needsUpdate = true;
        renderScene(tl.time());
      };
      if (apiOk && capCanvas.requestPaint) capCanvas.requestPaint();
      else capCanvas.onpaint();
      renderScene(0);
      window.__timelines = window.__timelines || {};
      window.__timelines["vfx-liquid-glass"] = tl;
      });
    </script>
  </body>
</html>
