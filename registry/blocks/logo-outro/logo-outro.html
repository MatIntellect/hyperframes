<!doctype html>
<html
  lang="ru"
  data-composition-variables='[
    { "id": "wordmark", "type": "string", "role": "content", "label": "Wordmark", "description": "The logo word, Bebas Neue, one line: its letters fly in one by one and assemble. Size follows the length.", "maxLength": 16, "default": "MatIntellect" },
    { "id": "tagline", "type": "string", "role": "content", "label": "Tagline", "description": "Line under the wordmark, up to two lines. Empty hides it.", "maxLength": 48, "default": "Монтаж без монтажёра" },
    { "id": "url", "type": "string", "role": "content", "label": "URL", "description": "Text in the pill under the tagline. Empty hides the pill.", "maxLength": 28, "default": "matintellect.com" },
    { "id": "cues", "type": "string", "role": "timing", "label": "Cues", "description": "Comma-separated seconds from mount start: 1 the letters start to fly in (they close up 1.2 s later), 2 the tagline lands (the pill follows 0.4 s later), 3 the outro fades out (only when exit is fade). Empty keeps 0 and 2.", "default": "" },
    { "id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "none holds the outro to the end of the mount.", "default": "none", "options": [{ "value": "none", "label": "Hold" }, { "value": "fade", "label": "Fade" }] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: transparent;
        overflow: hidden;
      }
      body {
        width: 1920px;
        height: 1080px;
      }
      #lgo-root {
        position: absolute;
        inset: 0;
        font-family: var(--font-body, "Montserrat"), sans-serif;
        color: var(--fg, #f2f2f2);
        overflow: hidden;
      }
      .lgo-ground {
        position: absolute;
        inset: 0;
        background: var(--bg, #0c1014);
      }
      #lgo-box {
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      #lgo-markwrap {
        position: relative;
      }
      #lgo-glow {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 520px;
        height: 520px;
        margin: -260px 0 0 -260px;
        border-radius: 50%;
        background: radial-gradient(circle, color-mix(in srgb, var(--accent, #ff0000) 32%, transparent) 0%, transparent 70%);
        opacity: 0;
      }
      #lgo-mark {
        position: relative;
        font-family: var(--font-display, "Bebas Neue"), sans-serif;
        font-weight: 700;
        line-height: 1;
        text-transform: uppercase;
        white-space: nowrap;
      }
      #lgo-mark span {
        display: inline-block;
        opacity: 0;
      }
      #lgo-tag {
        font-weight: 500;
        line-height: 1.25;
        opacity: 0;
      }
      #lgo-pill {
        background: var(--surface, #18181a);
        border: 2px solid var(--border, #2e2e32);
        border-radius: 100px;
        color: var(--muted, #8a8a90);
        font-weight: 500;
        letter-spacing: 0.02em;
        opacity: 0;
        white-space: nowrap;
      }
      
      #lgo-box {
        inset: 0;
        padding: 0 160px;
      }
      #lgo-tag {
        font-size: 48px;
        margin-top: 48px;
        max-width: 1400px;
      }
      #lgo-pill {
        font-size: 32px;
        margin-top: 32px;
        padding: 12px 34px;
      }
      
      
    </style>
  </head>
  <body>
    <div id="lgo-root" data-composition-id="logo-outro" data-width="1920" data-height="1080" data-start="0" data-duration="30">
      <div class="lgo-ground"></div>
      <div id="lgo-box">
        <div id="lgo-markwrap">
          <div id="lgo-glow" data-layout-ignore></div>
          <div id="lgo-mark"></div>
        </div>
        <div id="lgo-tag"></div>
        <div id="lgo-pill"></div>
      </div>
    </div>
    <script>
      (function () {
        var root = document.getElementById("lgo-root");
        var V =
          window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
            ? window.__hyperframes.getVariables()
            : {};
        function oneOf(v, list, d) {
          return list.indexOf(v) >= 0 ? v : d;
        }
        function txt(v, d) {
          return typeof v === "string" ? v.trim() : d;
        }
        var word = txt(V.wordmark, "MatIntellect") || "MatIntellect";
        var tag = txt(V.tagline, "Монтаж без монтажёра");
        var url = txt(V.url, "matintellect.com");
        var W = 1920;
        // Размер надписи по длине: средняя ширина знака Bebas около 0,44 кегля
        var avail = 1600,
          cap = 240;
        
        var mark = document.getElementById("lgo-mark");
        mark.style.fontSize = Math.round(Math.min(cap, avail / (0.44 * word.length))) + "px";
        var letters = word.split("").map(function (ch) {
          var s = document.createElement("span");
          s.textContent = ch === " " ? " " : ch;
          mark.appendChild(s);
          return s;
        });
        var tagEl = document.getElementById("lgo-tag"),
          pill = document.getElementById("lgo-pill");
        tagEl.textContent = tag;
        pill.textContent = url;
        if (!tag) tagEl.style.display = "none";
        if (!url) pill.style.display = "none";

        var cues = String(V.cues || "")
          .split(",")
          .map(function (v) {
            return parseFloat(v);
          });
        var c0 = isFinite(cues[0]) && cues[0] >= 0 ? cues[0] : 0;
        var cT = isFinite(cues[1]) && cues[1] > c0 ? cues[1] : c0 + 2;
        var exit = oneOf(V.exit, ["none", "fade"], "none");
        var each = Math.min(0.08, 0.6 / letters.length);
        var glow = document.getElementById("lgo-glow");

        var tl = gsap.timeline({ paused: true });
        letters.forEach(function (s, i) {
          tl.fromTo(s, { x: W, opacity: 0 }, { x: 0, opacity: 1, duration: 1.2, ease: "power4.out" }, c0 + i * each);
        });
        var tx = c0 + 1.2;
        tl.to(letters, { scale: 1.15, duration: 0.5, ease: "back.out(1.7)", stagger: 0.02 }, tx);
        tl.to(letters, { scale: 1, duration: 0.4, ease: "power2.inOut", stagger: 0.02 }, tx + 0.3);
        tl.fromTo(glow, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1.2, duration: 0.4, ease: "power2.out" }, tx);
        tl.to(glow, { opacity: 0, scale: 1.8, duration: 1.2, ease: "power2.out" }, tx + 0.4);
        tl.fromTo(tagEl, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 1, ease: "power3.out" }, cT);
        tl.fromTo(pill, { opacity: 0, y: 15 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, cT + 0.4);
        if (exit === "fade") tl.to("#lgo-box", { opacity: 0, duration: 0.5, ease: "power2.in" }, isFinite(cues[2]) ? cues[2] : cT + 3);
        tl.set({}, {}, 30);
        window.__timelines = window.__timelines || {};
        window.__timelines["logo-outro"] = tl;
      })();
    </script>
  </body>
</html>
