<!doctype html>
<html
  lang="ru"
  data-composition-variables='[
    { "id": "name", "type": "string", "role": "content", "label": "Name", "description": "Bold name, one line.", "maxLength": 21, "default": "Мат Джестер" },
    { "id": "role", "type": "string", "role": "content", "label": "Role", "description": "Upper-case line under the name, one line.", "maxLength": 30, "default": "Основатель MatIntellect" },
    { "id": "movement", "type": "enum", "role": "style", "label": "Movement", "description": "step snaps the lights from corner to corner, glide moves them smoothly.", "default": "step", "options": [{ "value": "step", "label": "Step (snap at corners)" }, { "value": "glide", "label": "Glide (smooth)" }] },
    { "id": "speed", "type": "number", "role": "style", "label": "Speed", "description": "Corners per second.", "default": 1.6, "min": 0.2, "max": 6, "step": 0.1 },
    { "id": "cornerRadius", "type": "number", "role": "style", "label": "Corner radius", "description": "Panel corner radius, px.", "default": 26, "min": 0, "max": 90, "step": 1 },
    { "id": "thickness", "type": "number", "role": "style", "label": "Thickness", "description": "Light line thickness, px.", "default": 5, "min": 1, "max": 16, "step": 1 },
    { "id": "arcLength", "type": "number", "role": "style", "label": "Arc length", "description": "Length of each light, percent of the edge.", "default": 22, "min": 5, "max": 100, "step": 1 },
    { "id": "glow", "type": "number", "role": "style", "label": "Glow", "description": "Bloom strength.", "default": 1, "min": 0, "max": 2, "step": 0.05 },
    { "id": "cues", "type": "string", "role": "timing", "label": "Cues", "description": "Comma-separated seconds from mount start: 1 the panel and the words come in, 2 they fade out (only when exit is fade). Empty keeps 0.08, 4.3. The lights run for the whole mount.", "default": "" },
    { "id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "none holds the panel with its running lights to the end of the mount.", "default": "none", "options": [{ "value": "none", "label": "Hold" }, { "value": "fade", "label": "Fade" }] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: transparent;
        overflow: hidden;
      }
      body {
        width: 1920px;
        height: 1080px;
      }
      #lnb-root {
        font-family: var(--font-body, "Montserrat"), sans-serif;
      }
      /* the wrap is the traced panel plus 150 px of bloom room on every side */
      #lnb-wrap {
        position: absolute;
      }
      #lnb-svg {
        position: absolute;
        inset: 0;
        display: block;
      }
      #lnb-panel {
        position: absolute;
        left: 150px;
        top: 150px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 14px;
        padding: 0 52px;
      }
      #lnb-name {
        display: block;
        font-weight: 700;
        color: var(--fg, #f2f2f2);
        line-height: 1.1;
        letter-spacing: -0.015em;
        white-space: nowrap;
      }
      #lnb-role {
        display: block;
        font-size: 28px;
        font-weight: 500;
        color: var(--muted, #8a8a90);
        line-height: 1.2;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      
      #lnb-wrap {
        left: 50px;
        bottom: 56px;
        width: 1120px;
        height: 510px;
      }
      #lnb-panel {
        width: 820px;
        height: 210px;
      }
      #lnb-name {
        font-size: 54px;
      }
      
      
    </style>
  </head>
  <body>
    <div id="lnb-root" data-composition-id="lt-neon-border" data-width="1920" data-height="1080" data-start="0" data-duration="30">
      <div id="lnb-wrap">
        <svg id="lnb-svg" data-layout-ignore fill="none" aria-hidden="true">
          <defs>
            <g id="lnb-seg-a-glow"></g>
            <g id="lnb-seg-a-core"></g>
            <g id="lnb-seg-b-glow"></g>
            <g id="lnb-seg-b-core"></g>
          </defs>
          <g transform="translate(150,150)">
            <g id="lnb-bloom-under"></g>
            <path id="lnb-fill" d="" fill="rgba(12,16,20,0.85)" />
            <path id="lnb-rail" d="" fill="none" stroke-linejoin="round" />
            <g id="lnb-bloom-over"></g>
          </g>
        </svg>
        <div id="lnb-panel">
          <span id="lnb-name">Мат Джестер</span>
          <span id="lnb-role">Основатель MatIntellect</span>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var root = document.getElementById("lnb-root");
        var V =
          window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
            ? window.__hyperframes.getVariables()
            : {};
        function oneOf(v, list, d) {
          return list.indexOf(v) >= 0 ? v : d;
        }
        
        document.getElementById("lnb-name").textContent = typeof V.name === "string" && V.name.trim() ? V.name.trim() : "Мат Джестер";
        var role = typeof V.role === "string" ? V.role.trim() : "Основатель MatIntellect";
        if (role) document.getElementById("lnb-role").textContent = role;
        else document.getElementById("lnb-role").remove();

        /* the traced rectangle */
        
        var W = 820,
          H = 210;
        
        
        var DUR = 30;
        var svgEl = document.getElementById("lnb-svg");
        svgEl.setAttribute("width", W + 300);
        svgEl.setAttribute("height", H + 300);
        svgEl.setAttribute("viewBox", "0 0 " + (W + 300) + " " + (H + 300));

        var SVG_NS = "http://www.w3.org/2000/svg";

        function num(v, fallback) {
          var n = typeof v === "number" ? v : parseFloat(v);
          return isFinite(n) ? n : fallback;
        }

        /* the light is the theme accent (brand red); the hot core needs a #rrggbb value */
        var accent = getComputedStyle(root).getPropertyValue("--accent").trim();
        if (!/^#[0-9a-fA-F]{6}$/.test(accent)) accent = "#ff0000";
        var mode = V.movement === "glide" ? "glide" : "step";
        var speed = Math.max(0.05, num(V.speed, 1.6)); // corners per second
        var radius = Math.min(Math.min(W, H) / 2, Math.max(0, num(V.cornerRadius, 26)));
        var thickness = Math.max(0.5, num(V.thickness, 5));
        var arcFrac = Math.min(1, Math.max(0.02, num(V.arcLength, 22) / 100));
        var glow = Math.max(0, num(V.glow, 1));

        // Hot core: the accent lifted most of the way to white, the way a real
        // filament reads brighter than its halo.
        function towardWhite(hex, amount) {
          var v = parseInt(hex.slice(1), 16);
          var out = "#";
          for (var s = 16; s >= 0; s -= 8) {
            var c = (v >> s) & 255;
            var m = Math.round(c + (255 - c) * amount);
            out += (m < 16 ? "0" : "") + m.toString(16);
          }
          return out;
        }
        var hot = towardWhite(accent, 0.78);

        // ---- geometry -------------------------------------------------------
        // Rounded rect, clockwise, starting where the top edge leaves the
        // top-left corner arc.
        var r = radius;
        var arc = "A " + r + " " + r + " 0 0 1 ";
        var d = [
          "M " + r + " 0",
          "H " + (W - r),
          arc + W + " " + r,
          "V " + (H - r),
          arc + (W - r) + " " + H,
          "H " + r,
          arc + "0 " + (H - r),
          "V " + r,
          arc + r + " 0",
          "Z",
        ].join(" ");

        var fillEl = document.getElementById("lnb-fill");
        var railEl = document.getElementById("lnb-rail");
        fillEl.setAttribute("d", d);
        railEl.setAttribute("d", d);
        railEl.setAttribute("stroke", accent);
        railEl.setAttribute("stroke-width", String(thickness));
        railEl.setAttribute("stroke-opacity", "0.14");

        // Analytic perimeter, then rescaled to whatever length the renderer
        // actually measures for the path so dash distances line up exactly.
        var SW = W - 2 * r; // straight run, horizontal
        var SH = H - 2 * r; // straight run, vertical
        var AC = (Math.PI * r) / 2; // one corner arc
        var P_ANALYTIC = 2 * SW + 2 * SH + 4 * AC;
        var P = railEl.getTotalLength() || P_ANALYTIC;
        var K = P / P_ANALYTIC;

        // Distance along the path of the MIDPOINT of each corner arc, so the
        // light parks centred on the corner rather than skidding past it.
        var CORNERS = [
          (SW + AC / 2) * K, // top-right
          (SW + SH + 1.5 * AC) * K, // bottom-right
          (2 * SW + SH + 2.5 * AC) * K, // bottom-left
          (2 * SW + 2 * SH + 3.5 * AC) * K, // top-left
        ];

        /** Absolute path distance of corner k, for any integer k (k may be
         * negative or beyond one lap). Pure function of k — no accumulator. */
        function cornerPos(k) {
          var lap = Math.floor(k / 4);
          var i = k - lap * 4;
          return CORNERS[i] + lap * P;
        }

        // ---- easing ---------------------------------------------------------
        // The step curve overshoots (y2 = 1.05); that overshoot IS the snap.
        function cubicBezier(x1, y1, x2, y2) {
          function axis(t, a, b) {
            var u = 1 - t;
            return 3 * u * u * t * a + 3 * u * t * t * b + t * t * t;
          }
          return function (x) {
            if (x <= 0) return 0;
            if (x >= 1) return 1;
            var lo = 0;
            var hi = 1;
            var t = x;
            // Fixed iteration count: same input, same output, every run.
            for (var i = 0; i < 32; i++) {
              t = (lo + hi) / 2;
              if (axis(t, x1, x2) < x) lo = t;
              else hi = t;
            }
            return axis(t, y1, y2);
          };
        }
        var ease =
          mode === "glide" ? cubicBezier(0.65, 0, 0.35, 1) : cubicBezier(0.72, 0.16, 0.18, 1.05);

        var beat = 1 / speed; // seconds per corner hop

        /** Head position (path distance) at time t. floor/frac of t/beat is the
         * closed form of the reference's `stepT += dt` accumulator. */
        function headAt(t) {
          var total = t / beat;
          var k = Math.floor(total);
          var u = total - k;
          var a = cornerPos(k);
          var b = cornerPos(k + 1);
          return a + (b - a) * ease(u);
        }

        // ---- arc construction ----------------------------------------------
        // Each arc is a run of abutting dash segments whose opacity falls off
        // behind the head; that ramp is the taper. Geometry lives once in
        // <defs> and is shared by every bloom layer through <use>.
        function buildSegments(groupId, count, falloff) {
          var g = document.getElementById(groupId);
          var segs = [];
          for (var i = 0; i < count; i++) {
            var p = document.createElementNS(SVG_NS, "path");
            p.setAttribute("d", d);
            p.setAttribute("fill", "none");
            p.setAttribute("stroke-linecap", i === 0 ? "round" : "butt");
            p.setAttribute("opacity", String(Math.pow(1 - i / count, falloff)));
            g.appendChild(p);
            segs.push(p);
          }
          return segs;
        }

        var GLOW_SEGS = 20;
        var CORE_SEGS = 26;
        var glowLen = arcFrac * P;
        var coreLen = 0.34 * glowLen;

        var arcs = [
          {
            offset: 0,
            glow: buildSegments("lnb-seg-a-glow", GLOW_SEGS, 2.6),
            core: buildSegments("lnb-seg-a-core", CORE_SEGS, 1.4),
          },
          {
            // Half a lap behind: the diametrically opposite corner. The pairing
            // is most of why the effect reads as designed rather than random.
            offset: 2,
            glow: buildSegments("lnb-seg-b-glow", GLOW_SEGS, 2.6),
            core: buildSegments("lnb-seg-b-core", CORE_SEGS, 1.4),
          },
        ];

        // Three stacked bloom layers (soft / medium / wide) plus the filament.
        // `spread` widens the stroke before it is blurred — that pairing, not
        // the blur alone, is what makes the halo read as emitted light.
        var MAX_REACH = 36;
        var LAYERS = [
          { blur: 30, spread: 1, opacity: 0.18, stroke: accent, deep: true },
          { blur: 15, spread: 0.6, opacity: 0.3, stroke: accent, deep: true },
          { blur: 8, spread: 0.3, opacity: 0.5, stroke: accent, deep: true },
          { blur: 4, spread: 0.05, opacity: 0.9, stroke: hot, core: true },
          { blur: 0, spread: -0.012, opacity: 1, stroke: "#ffffff", core: true },
        ];

        var under = document.getElementById("lnb-bloom-under");
        var over = document.getElementById("lnb-bloom-over");
        ["a", "b"].forEach(function (tag) {
          LAYERS.forEach(function (layer) {
            var u = document.createElementNS(SVG_NS, "use");
            u.setAttribute("href", "#lnb-seg-" + tag + "-" + (layer.core ? "core" : "glow"));
            u.setAttribute("stroke", layer.stroke);
            u.setAttribute(
              "stroke-width",
              String(Math.max(0.5, thickness + 2 * layer.spread * MAX_REACH * glow)),
            );
            u.setAttribute("opacity", String(Math.min(1, layer.opacity * glow)));
            if (layer.blur > 0) u.style.filter = "blur(" + layer.blur + "px)";
            (layer.deep ? under : over).appendChild(u);
          });
        });

        /** Lay a segment run out behind `head`. Every value derives from head. */
        function layout(segs, head, length) {
          var step = length / segs.length;
          for (var i = 0; i < segs.length; i++) {
            var start = head - (i + 1) * step;
            start = ((start % P) + P) % P;
            segs[i].setAttribute("stroke-dasharray", step + " " + (P - step));
            segs[i].setAttribute("stroke-dashoffset", String(-start));
          }
        }

        function render(t) {
          for (var i = 0; i < arcs.length; i++) {
            var head = headAt(t + arcs[i].offset * beat);
            layout(arcs[i].glow, head, glowLen);
            layout(arcs[i].core, head, coreLen);
          }
        }

        var cues = String(V.cues || "")
          .split(",")
          .map(function (v) {
            return parseFloat(v);
          });
        var c0 = isFinite(cues[0]) && cues[0] >= 0 ? cues[0] : 0.08;
        var exit = oneOf(V.exit, ["none", "fade"], "none");
        var wrap = document.getElementById("lnb-wrap");
        var nameEl = document.getElementById("lnb-name");
        var roleEl = document.getElementById("lnb-role");
        var words = roleEl ? [nameEl, roleEl] : [nameEl];

        /* the driver spans the whole mount; every light position is recomputed from its own time, so seeking is exact */
        var tl = gsap.timeline({ paused: true });
        var driver = { t: 0 };
        tl.to(driver, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { render(driver.t); } }, 0);
        tl.fromTo(wrap, { opacity: 0, scale: 0.965, transformOrigin: "50% 100%" }, { opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" }, c0);
        tl.fromTo(words, { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, stagger: 0.14, ease: "power3.out" }, c0 + 0.22);
        if (exit === "fade") {
          var out = isFinite(cues[1]) ? cues[1] : c0 + 4.2;
          tl.to(words.slice().reverse(), { y: -12, opacity: 0, duration: 0.3, stagger: 0.06, ease: "power2.in" }, out);
          tl.to(wrap, { opacity: 0, scale: 0.985, duration: 0.36, ease: "power2.in" }, out + 0.12);
        }
        tl.set({}, {}, 30);
        render(0);
        window.__timelines = window.__timelines || {};
        window.__timelines["lt-neon-border"] = tl;
      })();
    </script>
  </body>
</html>
