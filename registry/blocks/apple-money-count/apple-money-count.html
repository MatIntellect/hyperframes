<!doctype html>
<html
  lang="ru"
  data-composition-variables='[
    { "id": "amount", "type": "number", "role": "content", "label": "Amount", "description": "The count runs from 0 to this number in 3.2 s, then flashes red and bursts bills and coins, with its own sound.", "default": 10000, "min": 1, "max": 9999999, "step": 1 },
    { "id": "currency", "type": "string", "role": "content", "label": "Currency", "description": "Currency sign, also printed on the bills and coins.", "maxLength": 1, "default": "$" },
    { "id": "currencyAfter", "type": "boolean", "role": "content", "label": "Sign after the number", "description": "true prints 10 000 ₽, false prints $10 000.", "default": false },
    { "id": "label", "type": "string", "role": "content", "label": "Label", "description": "Line under the amount, up to two lines. Empty hides it.", "maxLength": 40, "default": "Выручка за первый месяц" },
    { "id": "cues", "type": "string", "role": "timing", "label": "Cues", "description": "Comma-separated seconds from mount start: 1 the amount fades out (only when exit is fade). The count itself starts at the mount start and lands at 3.2 s, tied to its sound.", "default": "" },
    { "id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "none holds the amount to the end of the mount.", "default": "none", "options": [{ "value": "none", "label": "Hold" }, { "value": "fade", "label": "Fade" }] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: transparent;
        overflow: hidden;
      }
      body {
        width: 1920px;
        height: 1080px;
      }
      #amc-root {
        font-family: var(--font-body, "Montserrat"), sans-serif;
        color: var(--fg, #f2f2f2);
        overflow: hidden;
      }
      #amc-root .amc-ground {
        position: absolute;
        inset: 0;
        background: var(--bg, #0c1014);
      }
      #amc-stage {
        position: absolute;
        overflow: hidden;
      }
      #amc-flash {
        position: absolute;
        inset: 0;
        background: var(--accent, #ff0000);
        opacity: 0;
      }
      #amc-center {
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        z-index: 5;
      }
      #amc-amount {
        font-weight: 900;
        line-height: 1;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      #amc-label {
        margin-top: 24px;
        font-weight: 600;
        color: var(--muted, #8a8a90);
        line-height: 1.2;
      }
      #amc-burst {
        position: absolute;
        inset: 0;
        z-index: 8;
        pointer-events: none;
      }
      .amc-icon {
        position: absolute;
        left: 50%;
        top: 50%;
        display: grid;
        place-items: center;
        opacity: 0;
      }
      .amc-icon.amc-bill {
        width: 104px;
        height: 56px;
        border-radius: 10px;
        background: var(--surface, #242427);
        border: 3px solid var(--muted, #8a8a90);
      }
      .amc-icon.amc-coin {
        width: 68px;
        height: 68px;
        border-radius: 50%;
        background: var(--muted, #8a8a90);
        border: 4px solid var(--fg, #f2f2f2);
      }
      .amc-icon span {
        font-size: 30px;
        font-weight: 900;
        line-height: 1;
        color: var(--fg, #f2f2f2);
      }
      .amc-icon.amc-coin span {
        color: var(--bg, #0c1014);
      }
      
      #amc-stage {
        inset: 0;
      }
      #amc-center {
        left: 160px;
        top: 120px;
        width: 1600px;
        height: 840px;
      }
      #amc-label {
        font-size: 48px;
        max-width: 1200px;
      }
      
      
    </style>
  </head>
  <body>
    <div id="amc-root" data-composition-id="apple-money-count" data-width="1920" data-height="1080" data-start="0" data-duration="30">
      <div class="amc-ground"></div>
      <div id="amc-stage">
        <div id="amc-flash"></div>
        <div id="amc-center">
          <div id="amc-amount">$0</div>
          <div id="amc-label">Выручка за первый месяц</div>
        </div>
        <div id="amc-burst" data-layout-allow-overflow data-layout-ignore></div>
      </div>
      <audio id="amc-sfx" data-start="0" data-duration="5" data-track-index="9" src="assets/money-count.wav" data-volume="0.92"></audio>
    </div>
    <script>
      (function () {
        var root = document.getElementById("amc-root");
        var V =
          window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
            ? window.__hyperframes.getVariables()
            : {};
        function num(value, fallback, lo, hi) {
          var n = typeof value === "number" ? value : Number.parseFloat(value);
          if (!Number.isFinite(n)) n = fallback;
          return Math.min(hi, Math.max(lo, n));
        }
        function oneOf(v, list, d) {
          return list.indexOf(v) >= 0 ? v : d;
        }

        
        var SIZE = 230,
          FIT = 1600,
          SPREAD = [860, 470],
          ICON = 1.3,
          LOW = 470;
        
        

        var AMOUNT = Math.round(num(V.amount, 10000, 1, 9999999));
        var SIGN = typeof V.currency === "string" ? V.currency : "$";
        var AFTER = V.currencyAfter === true || V.currencyAfter === "true";
        function fmt(v) {
          var n = Math.round(Math.max(0, Math.min(AMOUNT, v))).toLocaleString("ru-RU");
          return AFTER ? n + (SIGN ? " " + SIGN : "") : SIGN + n;
        }
        var label = typeof V.label === "string" ? V.label : "Выручка за первый месяц";
        var labelEl = document.getElementById("amc-label");
        labelEl.textContent = label;
        if (!label) labelEl.style.display = "none";

        var amountEl = document.getElementById("amc-amount");
        amountEl.style.fontSize = Math.round(Math.min(SIZE, FIT / (fmt(AMOUNT).length * 0.68))) + "px";
        amountEl.textContent = fmt(0);

        /* bills and coins: placed by index (golden angle), no randomness */
        var burst = document.getElementById("amc-burst");
        var icons = [],
          specs = [];
        for (var i = 0; i < 62; i++) {
          var icon = document.createElement("div");
          var coin = i % 3 === 0;
          icon.className = "amc-icon " + (coin ? "amc-coin" : "amc-bill");
          var mark = document.createElement("span");
          mark.textContent = SIGN || "$";
          icon.appendChild(mark);
          burst.appendChild(icon);
          icons.push(icon);
          var a = i * 2.399963229728653;
          var ring = i % 5;
          var k = 0.3 + ring * 0.17 + (i % 7) * 0.012;
          specs.push({
            x: Math.max(-SPREAD[0], Math.min(SPREAD[0], Math.cos(a) * SPREAD[0] * k)),
            y: Math.max(-SPREAD[1], Math.min(LOW, Math.sin(a * 1.13) * SPREAD[1] * k)),
            delay: (i % 8) * 0.025,
            duration: 0.74 + (i % 5) * 0.045,
            fadeDelay: (i % 5) * 0.05,
            rotation: ((i * 43) % 160) - 80,
            scale: ICON * (coin ? 0.72 + (i % 4) * 0.08 : 0.68 + (i % 5) * 0.07),
          });
        }

        var cues = String(V.cues || "")
          .split(",")
          .map(function (v) {
            return parseFloat(v);
          });
        var exit = oneOf(V.exit, ["none", "fade"], "none");

        var center = document.getElementById("amc-center");
        var st = { v: 0 };
        var tl = gsap.timeline({ paused: true });
        gsap.set(icons, { x: 0, y: 0, xPercent: -50, yPercent: -50, opacity: 0, scale: 0.18 });
        tl.fromTo(center, { y: 26, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power2.out" }, 0);
        tl.fromTo(
          st,
          { v: 0 },
          {
            v: AMOUNT,
            duration: 3.16,
            ease: "none",
            onUpdate: function () {
              amountEl.textContent = fmt(st.v);
            },
          },
          0,
        );
        /* the landing colour is the theme accent, brand red when the theme has none */
        var accent = getComputedStyle(root).getPropertyValue("--accent").trim() || "#ff0000";
        tl.to(amountEl, { color: accent, duration: 0.18 }, 3.16);
        tl.to(amountEl, { scale: 1.06, duration: 0.16, ease: "back.out(2.2)" }, 3.16);
        tl.to(amountEl, { scale: 1, duration: 0.23, ease: "power2.out" }, 3.33);
        tl.to("#amc-flash", { opacity: 0.14, duration: 0.08, ease: "none" }, 3.16);
        tl.to("#amc-flash", { opacity: 0.07, duration: 0.76, ease: "none" }, 3.24);
        tl.to("#amc-flash", { opacity: 0, duration: 0.16, ease: "power2.out" }, 4);
        icons.forEach(function (icon, i) {
          var s = specs[i];
          tl.to(icon, { x: s.x, y: s.y, rotation: s.rotation, scale: s.scale, opacity: 1, duration: s.duration, ease: "power4.out" }, 3.28 + s.delay);
          tl.to(icon, { y: s.y + (s.y < 0 ? -58 : Math.min(58, LOW - s.y)), scale: s.scale * 0.54, opacity: 0, duration: 0.38, ease: "power2.in" }, 4.18 + s.fadeDelay);
        });
        if (exit === "fade") tl.to(center, { opacity: 0, duration: 0.3, ease: "power2.in" }, isFinite(cues[0]) ? cues[0] : 6);
        tl.set({}, {}, 30);
        window.__timelines = window.__timelines || {};
        window.__timelines["apple-money-count"] = tl;
      })();
    </script>
  </body>
</html>
