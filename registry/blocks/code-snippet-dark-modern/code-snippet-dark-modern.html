    {"id": "code", "type": "string", "role": "content", "label": "Code", "description": "The typed file, lines split by a line break: up to 13 lines of 78 characters, Python colours; a longer file scrolls like the editor.", "maxLength": 1100, "default": "# A small functional toolkit\ndef pluck_deep(key):\n    return lambda obj: reduce(lambda acc, k: acc[k], key.split(&#39;.&#39;), obj)\n\ndef compose(*fns):\n    return lambda res: reduce(lambda acc, fn: fn(acc), fns, res)\n\ndef unfold(f, seed):\n    acc = []\n    while (result := f(seed)) is not None:\n        acc.append(result[0])\n        seed = result[1]\n    return acc"},

  ]'

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (() => {
            const V =
              window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
                ? window.__hyperframes.getVariables()
                : {};
            const text = (v, fb) => (typeof v === "string" && v.trim() ? v.trim() : fb);
            const cues = String(V.cues || "")
              .split(",")
              .map((v) => parseFloat(v));

            /* Python colours in the theme's own token classes: keywords, strings, numbers, comments,
               calls and definitions, parameters of def and lambda, constants and Capitalised names */
            const KW = new Set("def return lambda if elif else while for in is not and or import from as class with try except finally yield pass break continue raise async await global nonlocal del".split(" "));
            const CONST = new Set(["None", "True", "False"]);
            function tokenize(line) {
              const out = [];
              let rest = line,
                prevWord = "",
                params = 0;
              const push = (t, token) => out.push({ text: t, token });
              while (rest) {
                let m;
                if ((m = rest.match(/^#.*/))) push(m[0], "comment");
                else if ((m = rest.match(/^("""[^]*?"""|\'\'\'[^]*?\'\'\'|"(?:\\.|[^"\\])*"?|'(?:\\.|[^'\\])*'?)/))) push(m[0], "string");
                else if ((m = rest.match(/^\d+(\.\d+)?/))) push(m[0], "number");
                else if ((m = rest.match(/^[A-Za-z_]\w*/))) {
                  const w = m[0];
                  const next = rest.slice(w.length).trimStart()[0];
                  let token = "variable";
                  if (KW.has(w)) token = "keyword";
                  else if (CONST.has(w) || prevWord === "class" || /^[A-Z]/.test(w)) token = "className";
                  else if (prevWord === "def" || next === "(") token = "function";
                  else if (params) token = "parameter";
                  if (w === "lambda") params = 2;
                  push(w, token);
                  prevWord = w;
                } else if ((m = rest.match(/^\s+/))) push(m[0], "plain");
                else if ((m = rest.match(/^(==|!=|<=|>=|:=|\*\*|\/\/|->|[-+*\/%=<>!&|^~@])/))) push(m[0], "operator");
                else if ((m = rest.match(/^[()\[\]{}:,.;]/))) {
                  // parameters: inside the brackets right after def name, or between lambda and its colon
                  if (m[0] === "(" && out.length > 1 && out[out.length - 1].token === "function" && line.trimStart().startsWith("def ")) params = 1;
                  else if (m[0] === ")" && params === 1) params = 0;
                  else if (m[0] === ":" && params === 2) params = 0;
                  push(m[0], "punctuation");
                } else (m = [rest[0]]), push(rest[0], "plain");
                rest = rest.slice(m[0].length);
              }
              return out;
            }
            const DEFAULT_CODE = "# A small functional toolkit\ndef pluck_deep(key):\n    return lambda obj: reduce(lambda acc, k: acc[k], key.split('.'), obj)\n\ndef compose(*fns):\n    return lambda res: reduce(lambda acc, fn: fn(acc), fns, res)\n\ndef unfold(f, seed):\n    acc = []\n    while (result := f(seed)) is not None:\n        acc.append(result[0])\n        seed = result[1]\n    return acc";
            const codeLines = text(V.code, DEFAULT_CODE).replace(/\r/g, "").split("\n").map(tokenize);

            const fallback = {
              "activityBar.background": "#181818",
              "activityBar.foreground": "#d7d7d7",
              "activityBar.inactiveForeground": "#868686",
              "activityBar.activeBorder": "#0078d4",
              "sideBar.background": "#181818",
              "sideBar.foreground": "#cccccc",
              "sideBar.border": "#2b2b2b",
              "tab.activeBackground": "#1f1f1f",
              "tab.activeForeground": "#ffffff",
              "tab.inactiveBackground": "#181818",
              "tab.inactiveForeground": "#9d9d9d",
              "tab.border": "#2b2b2b",
              "editor.background": "#1f1f1f",
              "editor.foreground": "#cccccc",
              "editor.lineHighlightBackground": "#ffffff0a",
              "editorLineNumber.foreground": "#6e7681",
              "editorLineNumber.activeForeground": "#cccccc",
              "panel.background": "#181818",
              "panel.border": "#2b2b2b",
              "statusBar.background": "#181818",
              "statusBar.foreground": "#cccccc",
              "statusBar.border": "#2b2b2b",
              "titleBar.activeBackground": "#181818",
              "titleBar.activeForeground": "#cccccc",
            };

            function color(theme, key) {
              return theme.colors[key] || fallback[key] || theme.colors.foreground || "#cccccc";
            }

            function solarizedGrey(theme) {
              return (
                theme.colors["tab.inactiveForeground"] ||
                theme.colors["editor.foreground"] ||
                "#586E75"
              );
            }

            function setVar(root, name, value) {
              root.style.setProperty(name, value);
            }

            function applyTheme(root, theme) {
              const solarizedUiGrey = theme.id === "solarized-light" ? solarizedGrey(theme) : null;
              setVar(root, "--activity-bg", color(theme, "activityBar.background"));
              setVar(
                root,
                "--activity-fg",
                solarizedUiGrey || color(theme, "activityBar.foreground"),
              );
              setVar(
                root,
                "--activity-muted",
                solarizedUiGrey || color(theme, "activityBar.inactiveForeground"),
              );
              setVar(root, "--activity-active", color(theme, "activityBar.activeBorder"));
              setVar(root, "--sidebar-bg", color(theme, "sideBar.background"));
              setVar(root, "--sidebar-fg", solarizedUiGrey || color(theme, "sideBar.foreground"));
              setVar(root, "--sidebar-border", color(theme, "sideBar.border"));
              setVar(root, "--tab-bg", color(theme, "tab.inactiveBackground"));
              setVar(root, "--tab-active-bg", color(theme, "tab.activeBackground"));
              setVar(
                root,
                "--tab-active-fg",
                solarizedUiGrey || color(theme, "tab.activeForeground"),
              );
              setVar(
                root,
                "--tab-inactive-fg",
                solarizedUiGrey || color(theme, "tab.inactiveForeground"),
              );
              setVar(root, "--tab-border", color(theme, "tab.border"));
              setVar(root, "--editor-bg", color(theme, "editor.background"));
              setVar(root, "--editor-fg", color(theme, "editor.foreground"));
              setVar(root, "--editor-line", color(theme, "editor.lineHighlightBackground"));
              setVar(root, "--gutter-fg", color(theme, "editorLineNumber.foreground"));
              setVar(root, "--gutter-active-fg", color(theme, "editorLineNumber.activeForeground"));
              setVar(root, "--panel-bg", color(theme, "panel.background"));
              setVar(root, "--panel-border", color(theme, "panel.border"));
              setVar(root, "--status-bg", color(theme, "statusBar.background"));
              setVar(root, "--status-fg", color(theme, "statusBar.foreground"));
              setVar(root, "--status-border", color(theme, "statusBar.border"));
              setVar(root, "--status-remote-bg", color(theme, "statusBarItem.remoteBackground"));
              setVar(
                root,
                "--status-remote-fg",
                solarizedUiGrey || color(theme, "statusBarItem.remoteForeground"),
              );
              setVar(root, "--title-bg", color(theme, "titleBar.activeBackground"));
              setVar(
                root,
                "--title-fg",
                solarizedUiGrey || color(theme, "titleBar.activeForeground"),
              );
              setVar(root, "--token-comment", theme.tokens.comment);
              setVar(root, "--token-keyword", theme.tokens.keyword);
              setVar(root, "--token-function", theme.tokens.function);
              setVar(root, "--token-string", theme.tokens.string);
              setVar(root, "--token-number", theme.tokens.number);
              setVar(root, "--token-variable", theme.tokens.variable);
              setVar(root, "--token-parameter", theme.tokens.parameter);
              setVar(root, "--token-operator", theme.tokens.operator);
              setVar(root, "--token-punctuation", theme.tokens.punctuation);
              setVar(root, "--token-class-name", theme.tokens.className);
            }

            function renderCode(root) {
              const code = root.querySelector(".code");
              codeLines.forEach((segments, index) => {
                const line = document.createElement("div");
                line.className = "line";
                line.dataset.lineIndex = String(index);

                const lineNumber = document.createElement("span");
                lineNumber.className = "line-number";
                lineNumber.textContent = String(index + 1);
                line.appendChild(lineNumber);

                const lineCode = document.createElement("span");
                lineCode.className = "line-code";
                segments.forEach((segment) => {
                  [...segment.text].forEach((char) => {
                    const span = document.createElement("span");
                    span.className =
                      segment.token === "plain"
                        ? "char"
                        : "char tok-" +
                          segment.token.replace(/[A-Z]/g, (match) => "-" + match.toLowerCase());
                    span.dataset.lineIndex = String(index);
                    span.textContent = char;
                    lineCode.appendChild(span);
                  });
                });
                line.appendChild(lineCode);
                code.appendChild(line);
              });

              const caret = document.createElement("span");
              caret.className = "caret";
              root.querySelector(".editor").appendChild(caret);
            }

            function caretPointForElement(editor, el) {
              const editorBox = editor.getBoundingClientRect();
              const charBox = el.getBoundingClientRect();
              return {
                x: charBox.right - editorBox.left + 2,
                y: charBox.top - editorBox.top + 3,
              };
            }

            function caretPointForLineStart(editor, line) {
              const editorBox = editor.getBoundingClientRect();
              const lineBox = line.getBoundingClientRect();
              const codeBox = line.querySelector(".line-code").getBoundingClientRect();
              return {
                x: codeBox.left - editorBox.left,
                y: lineBox.top - editorBox.top + 3,
              };
            }

            function lineHighlightY(editor, line) {
              const editorBox = editor.getBoundingClientRect();
              const lineBox = line.getBoundingClientRect();
              return lineBox.top - editorBox.top;
            }

            function buildTimeline(root, compositionId) {
              const tl = gsap.timeline({ paused: true });
              const editor = root.querySelector(".editor");
              const caret = root.querySelector(".caret");
              const activeLine = root.querySelector(".active-line");
              const lineEls = gsap.utils.toArray(root.querySelectorAll(".line"));
              const lineStartTimes = [];
              const codeEl = root.querySelector(".code");
              const scrolls = gsap.utils
                .toArray(root.querySelectorAll(".line"))
                .map((line) => Math.max(0, line.offsetTop + line.offsetHeight + 18 - editor.clientHeight));
              const charSchedule = [];
              let cursorTime = isFinite(cues[0]) && cues[0] >= 0.6 ? cues[0] : 0.95;

              lineEls.forEach((line, lineIndex) => {
                const lineChars = gsap.utils.toArray(line.querySelectorAll(".char"));
                lineStartTimes[lineIndex] = cursorTime;
                lineChars.forEach((char, charIndex) => {
                  charSchedule.push({ char, line: lineIndex, time: cursorTime + charIndex * 0.012 });
                });
                cursorTime += Math.max(lineChars.length * 0.012, 0.08) + 0.045;
              });

              const typed = cursorTime;
              // a line exists once typing reaches it, as in a new file: no hidden rows wait below the view
              gsap.set(lineEls.slice(1), { autoAlpha: 0 });
              const TERM = isFinite(cues[1]) && cues[1] > typed ? cues[1] : typed + 0.35;
              gsap.set(activeLine, { y: lineHighlightY(editor, lineEls[0]) });
              gsap.set(caret, caretPointForLineStart(editor, lineEls[0]));

              tl.from(
                root.querySelector(".header"),
                { y: 24, opacity: 0, duration: 0.45, ease: "power3.out" },
                0,
              );
              tl.from(
                root.querySelector(".workbench"),
                { y: 42, opacity: 0, scale: 0.986, duration: 0.58, ease: "power3.out" },
                0.1,
              );
              tl.from(activeLine, { opacity: 0, duration: 0.22, ease: "power2.out" }, 0.74);
              lineStartTimes.forEach((time, lineIndex) => {
                const line = lineEls[lineIndex];
                const sy = scrolls[lineIndex];
                tl.set(line, { autoAlpha: 1 }, time);
                tl.set(codeEl, { y: -sy }, time);
                tl.set(activeLine, { y: lineHighlightY(editor, line) - sy }, time);
                const p0 = caretPointForLineStart(editor, line);
                tl.set(caret, { x: p0.x, y: p0.y - sy }, time);
                tl.call(
                  () => {
                    lineEls.forEach((item) => item.classList.toggle("is-active", item === line));
                  },
                  [],
                  time,
                );
              });
              charSchedule.forEach(({ char, line, time }) => {
                const p = caretPointForElement(editor, char);
                tl.set(char, { opacity: 1 }, time);
                tl.set(caret, { x: p.x, y: p.y - scrolls[line] }, time + 0.002);
              });
              tl.to(
                root.querySelector(".caret"),
                { opacity: 0, duration: 0.34, repeat: 43, yoyo: true, ease: "steps(1)" },
                0.95,
              );
              tl.from(
                root.querySelector(".terminal"),
                { y: 140, opacity: 0, duration: 0.56, ease: "power3.out" },
                TERM,
              );
              tl.from(
                root.querySelector(".terminal-body").children,
                { opacity: 0, y: 8, duration: 0.24, stagger: 0.16, ease: "power2.out" },
                TERM + 0.5,
              );
              tl.to(
                root.querySelector(".workbench"),
                { rotateY: -10.5, z: 74, duration: 0.72, ease: "power2.inOut" },
                TERM + 1.8,
              );
              tl.to(
                root.querySelector(".workbench"),
                { rotateY: 0, z: 0, duration: 0.62, ease: "power2.inOut" },
                TERM + 2.53,
              );
              if (V.exit === "fade") {
                const out = isFinite(cues[2]) && cues[2] > TERM + 2 ? cues[2] : TERM + 4.5;
                tl.to(root, { autoAlpha: 0, duration: 0.4, ease: "power2.in" }, out);
              }
              tl.set({}, {}, 30);

              window.__timelines = window.__timelines || {};
              window.__timelines[compositionId] = tl;

              const previewTime = new URLSearchParams(window.location.search).get("t");
              if (previewTime !== null) {
                tl.time(Number(previewTime));
              }
            }

            window.createVSCodeThemeComposition = (compositionId, themeOrId) => {
              const root =
                document.querySelector(
                  '[data-composition-id="' + compositionId + '"] .vscode-theme-scene',
                ) ||
                document.querySelector(
                  '.vscode-theme-scene[data-composition-id="' + compositionId + '"]',
                ) ||
                document.querySelector('[data-composition-id="' + compositionId + '"]');
              const theme =
                typeof themeOrId === "string"
                  ? window.VSCODE_THEME_REGISTRY.find((item) => item.id === themeOrId)
                  : themeOrId;
              if (!root || !theme) return;
              root.querySelector(".kicker").textContent = text(V.kicker, "Встроенная тема VS Code");
              root.querySelector(".theme-label").textContent = text(V.title, theme.label);
              const note = root.querySelector(".source-note");
              if (note) note.textContent = text(V.note, "Цвета из файла " + theme.sourceFile);
              root.querySelectorAll(".fname").forEach((el) => (el.textContent = text(V.file, "functional_toolkit.py")));
              
              applyTheme(root, theme);
              renderCode(root);
              buildTimeline(root, compositionId);
            };
          })();
        </script>
        <script>
          window.__timelines = window.__timelines || {};
          window.__timelines["code-snippet-dark-modern"] =
            window.__timelines["code-snippet-dark-modern"] || gsap.timeline({ paused: true });
          window.createVSCodeThemeComposition("code-snippet-dark-modern", {
            id: "dark-modern",
            label: "Dark Modern",
            sourceFile: "dark_modern.json",
            uiTheme: "vs-dark",
            colors: {
              "activityBar.activeBorder": "#0078D4",
              "activityBar.background": "#181818",
              "activityBar.border": "#2B2B2B",
              "activityBar.foreground": "#D7D7D7",
              "activityBar.inactiveForeground": "#868686",
              "editor.background": "#1F1F1F",
              "editor.foreground": "#CCCCCC",
              "editorGroup.border": "#FFFFFF17",
              "editorGroupHeader.tabsBackground": "#181818",
              "editorGroupHeader.tabsBorder": "#2B2B2B",
              "editorLineNumber.activeForeground": "#CCCCCC",
              "editorLineNumber.foreground": "#6E7681",
              foreground: "#CCCCCC",
              "icon.foreground": "#CCCCCC",
              "panel.background": "#181818",
              "panel.border": "#2B2B2B",
              "sideBar.background": "#181818",
              "sideBar.border": "#2B2B2B",
              "sideBar.foreground": "#CCCCCC",
              "sideBarSectionHeader.background": "#181818",
              "sideBarSectionHeader.border": "#2B2B2B",
              "sideBarSectionHeader.foreground": "#CCCCCC",
              "sideBarTitle.foreground": "#CCCCCC",
              "statusBar.background": "#181818",
              "statusBar.border": "#2B2B2B",
              "statusBar.foreground": "#CCCCCC",
              "statusBarItem.remoteBackground": "#0078D4",
              "statusBarItem.remoteForeground": "#FFFFFF",
              "tab.activeBackground": "#1F1F1F",
              "tab.activeBorder": "#1F1F1F",
              "tab.activeBorderTop": "#0078D4",
              "tab.activeForeground": "#FFFFFF",
              "tab.border": "#2B2B2B",
              "tab.inactiveBackground": "#181818",
              "tab.inactiveForeground": "#9D9D9D",
              "terminal.foreground": "#CCCCCC",
              "titleBar.activeBackground": "#181818",
              "titleBar.activeForeground": "#CCCCCC",
            },
            tokens: {
              comment: "#6A9955",
              keyword: "#d7ba7d",
              function: "#DCDCAA",
              string: "#d16969",
              number: "#b5cea8",
              variable: "#4FC1FF",
              parameter: "#9CDCFE",
              operator: "#d7ba7d",
              punctuation: "#CE9178",
              className: "#4EC9B0",
            },
          });
        </script>
      </div>
    </template>
  </body>
</html>
