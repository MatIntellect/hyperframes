<!doctype html>
<html
  lang="ru"
  data-composition-variables='[
    {"id": "code", "type": "string", "role": "content", "label": "Code", "description": "The code, newlines kept: up to 12 lines, a line up to 60 characters.", "maxLength": 732, "default": "const app = pipe(\n  parse,\n  optimize,\n  emit,\n)"},
    {"id": "lang", "type": "enum", "role": "content", "label": "Language", "description": "Language of the code, for the colours.", "default": "js", "options": [{"value": "js", "label": "JavaScript"}, {"value": "ts", "label": "TypeScript"}, {"value": "python", "label": "Python"}, {"value": "bash", "label": "Bash"}, {"value": "json", "label": "JSON"}]},
    {"id": "cues", "type": "string", "role": "timing", "label": "Cues", "description": "Comma-separated seconds from mount start: 1 is not used (the move starts with the block), 2 the block fades out (only when exit is fade).", "default": ""},
    {"id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "none holds the last frame to the end of the mount; fade fades the whole block at cue 2, by default 2 s after the code is complete.", "default": "none", "options": [{"value": "none", "label": "Hold"}, {"value": "fade", "label": "Fade"}]}

  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Code Particle Assemble</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=block" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-typescript.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-bash.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-json.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
      }
      #kdpart-root {
        position: relative;
        width: 1920px;
        height: 1080px;
      }
      #kdpart-gl {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        display: block;
      }
    </style>
  </head>
  <body>
    <div
      id="kdpart-root"
      data-composition-id="code-particle-assemble"
      data-start="0"
      data-duration="30"
      data-width="1920"
      data-height="1080"
    >
      <canvas id="kdpart-gl" width="1920" height="1080"></canvas>
    </div>
    <script>
      // Код – поле блока. Раскраска – Prism в момент загрузки, цвета родной темы github-dark (как у запечённых
      // разработчиками токенов Shiki); кусочки двух версий кода сопоставляются по наибольшей общей
      // последовательности, чтобы родные превращение и правка работали на любом коде
      (function () {
        var V =
          window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
            ? window.__hyperframes.getVariables()
            : {};
        var DEF = {"seq": "assemble", "codes": ["const app = pipe(\n  parse,\n  optimize,\n  emit,\n)"], "fields": ["code"], "block": {"id": "code-particle-assemble", "effect": "particles", "seq": "assemble", "duration": 8, "seed": 23}, "start": 0.45, "exitAt": 8, "filename": "main.js", "lineBase": 1, "line1": 0};
        var LANGS = { js: "javascript", ts: "typescript", python: "python", bash: "bash", json: "json" };
        var lang = LANGS[V.lang] ? V.lang : "js";
        var COLORS = {
          keyword: "#F97583",
          operator: "#F97583",
          "function": "#B392F0",
          "class-name": "#B392F0",
          decorator: "#B392F0",
          number: "#79B8FF",
          boolean: "#79B8FF",
          constant: "#79B8FF",
          builtin: "#79B8FF",
          property: "#79B8FF",
          string: "#9ECBFF",
          "template-string": "#9ECBFF",
          char: "#9ECBFF",
          regex: "#DBEDFF",
          comment: "#6A737D",
        };
        var FG = "#E1E4E8";
        function flat(list, type, out) {
          list.forEach(function (t) {
            if (typeof t === "string") out.push({ content: t, color: COLORS[type] || FG });
            else if (Array.isArray(t.content)) flat(t.content, COLORS[t.type] ? t.type : type, out);
            else flat([t.content], COLORS[t.type] ? t.type : type, out);
          });
          return out;
        }
        function tokens(code) {
          var out = [];
          flat(Prism.tokenize(code, Prism.languages[LANGS[lang]]), null, []).forEach(function (t) {
            t.content.split(/(\n)/).forEach(function (part) {
              if (part) out.push({ content: part, color: part === "\n" ? FG : t.color, fontStyle: 0 });
            });
          });
          return out;
        }
        function keyed(prev, cur, tag) {
          // наибольшая общая последовательность по тексту кусочков: совпавшие берут ключ предыдущей версии
          var n = prev.length,
            m = cur.length,
            dp = [];
          for (var i = 0; i <= n; i++) dp.push(new Array(m + 1).fill(0));
          for (var i = n - 1; i >= 0; i--)
            for (var j = m - 1; j >= 0; j--)
              dp[i][j] = prev[i].content === cur[j].content ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
          var i = 0,
            j = 0;
          while (i < n && j < m) {
            if (prev[i].content === cur[j].content) {
              cur[j].key = prev[i].key;
              i++;
              j++;
            } else if (dp[i + 1][j] >= dp[i][j + 1]) i++;
            else j++;
          }
          cur.forEach(function (t, k) {
            if (!t.key) t.key = tag + "-" + k;
          });
        }
        var codes = DEF.codes.map(function (d, k) {
          var v = V[DEF.fields[k]];
          return typeof v === "string" && v.replace(/\s/g, "") ? v.replace(/\r/g, "").replace(/\t/g, "  ") : d;
        });
        var states = [];
        codes.forEach(function (code, k) {
          var tk = tokens(code);
          if (k === 0)
            tk.forEach(function (t, i) {
              t.key = "s0-" + i;
            });
          else keyed(states[k - 1].tokens, tk, "s" + k);
          states.push({ code: code, tokens: tk });
        });
        window.__TOKENS = {};
        window.__TOKENS[DEF.seq] = { lang: lang, theme: "github-dark", bg: "#24292e", fg: "#e1e4e8", states: states };
        var line = parseInt(V.line, 10);
        window.__BLOCK = DEF.block;
        window.__BLOCK.id = "code-particle-assemble";
        if (DEF.block.line) window.__BLOCK.line = (line >= 1 ? line : DEF.line1) - (1 - DEF.lineBase);
        var cues = String(V.cues || "")
          .split(",")
          .map(function (v) {
            return parseFloat(v);
          });
        window.__BLOCK.start = isFinite(cues[0]) && cues[0] >= 0 ? cues[0] : DEF.start;
        window.__kodExit = function (tl) {
          if (V.exit !== "fade") return;
          // default: 2 s after the last move of the content (the pad to the mount length is not content)
          var end = 0;
          tl.getChildren(false, true, true).forEach(function (c) {
            if (!(c.startTime() === 0 && c.duration() >= tl.duration() - 0.001)) end = Math.max(end, c.endTime());
          });
          tl.to(document.getElementById("kdpart-root"), { autoAlpha: 0, duration: 0.4, ease: "power2.in" }, isFinite(cues[1]) ? cues[1] : Math.max(DEF.exitAt, end + 2));
        };
        var root = document.getElementById("kdpart-root");
        // своя графика сцены – из меток темы: фон и кромка растворения
        var cs = getComputedStyle(root);
        window.__kodBg = cs.getPropertyValue("--bg").trim() || "#0c1014";
        var probe = document.createElement("i");
        probe.style.color = cs.getPropertyValue("--accent").trim() || "#ff0000";
        root.appendChild(probe);
        window.__kodAccent = getComputedStyle(probe)
          .color.match(/[\d.]+/g)
          .slice(0, 3)
          .map(function (c) {
            return (Number(c) / 255).toFixed(3);
          })
          .join(",");
        window.__kodAccentCss = getComputedStyle(probe).color;
        probe.remove();
        
        var fname = document.getElementById("kdpart-fname");
        if (fname) fname.textContent = typeof V.filename === "string" && V.filename.trim() ? V.filename.trim() : DEF.filename;
      })();
    </script>

    <script>
      // hf-code-anim-gl.js — WebGL code-animation engine for the "crazy" Code Animations blocks.
      //
      // Bridges the baked Shiki tokens (window.__TOKENS) into Three.js: the tokens are drawn once
      // to an offscreen 2D canvas (a CanvasTexture), which then drives a lit 3D slab, a dissolve
      // shader, or a GPU particle system. Determinism per the project contract:
      //   - render only via tl.eventCallback("onUpdate", …) + one initial render() — never rAF
      //   - all randomness from a seeded mulberry32 — never Math.random / Date.now
      //   - canvas drawn once after document.fonts.ready (final glyph metrics)
      //   - paused GSAP timeline registered on window.__timelines[id]; HF seeks it per frame
      //
      // Each block sets window.__BLOCK = { id, effect, seq, duration, seed } and includes this engine.
      (function () {
        "use strict";
        var T = window.__TOKENS || {};

        // ---- seeded PRNG (no Math.random) -----------------------------------------
        function mulberry32(a) {
          return function () {
            a |= 0;
            a = (a + 0x6d2b79f5) | 0;
            var t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }

        // ---- split a token state into lines of {content,color} --------------------
        function splitLines(state) {
          var lines = [[]];
          for (var i = 0; i < state.tokens.length; i++) {
            var t = state.tokens[i];
            if (t.content === "\n") {
              lines.push([]);
              continue;
            }
            lines[lines.length - 1].push(t);
          }
          while (lines.length && lines[lines.length - 1].length === 0) lines.pop();
          return lines;
        }

        // ---- THE BRIDGE: draw baked tokens to an offscreen 2D canvas ---------------
        // Returns { canvas, W, H, lines, lineH, padY, fontPx } so effects can sample it.
        function drawCodeToCanvas(state, opts) {
          opts = opts || {};
          var fontPx = opts.fontPx || 36;
          var lineH = opts.lineH || 54;
          var padX = opts.padX || 70;
          var padY = opts.padY || 60;
          var weight = opts.weight || 500;
          var font = weight + " " + fontPx + 'px "JetBrains Mono", monospace';

          var lines = splitLines(state);
          var measure = document.createElement("canvas").getContext("2d");
          measure.font = font;
          var maxW = 0;
          for (var i = 0; i < lines.length; i++) {
            var w = 0;
            for (var j = 0; j < lines[i].length; j++)
              w += measure.measureText(lines[i][j].content).width;
            if (w > maxW) maxW = w;
          }
          var W = Math.max(2, Math.ceil(maxW + padX * 2));
          var H = Math.max(2, Math.ceil(lines.length * lineH + padY * 2));

          var canvas = document.createElement("canvas");
          canvas.width = W;
          canvas.height = H;
          var ctx = canvas.getContext("2d");
          if (opts.transparent) {
            ctx.clearRect(0, 0, W, H);
          } else {
            ctx.fillStyle = opts.bg || "#0b0f17";
            ctx.fillRect(0, 0, W, H);
          }
          ctx.textBaseline = "top";
          ctx.font = font;
          for (var li = 0; li < lines.length; li++) {
            var x = padX;
            var y = padY + li * lineH;
            for (var k = 0; k < lines[li].length; k++) {
              var tok = lines[li][k];
              ctx.fillStyle = tok.color;
              ctx.fillText(tok.content, x, y);
              x += ctx.measureText(tok.content).width;
            }
          }
          return {
            canvas: canvas,
            W: W,
            H: H,
            lines: lines.length,
            lineH: lineH,
            padY: padY,
            fontPx: fontPx,
          };
        }

        function fxParticles(THREE, scene, camera, renderer, state, st, tl, dur, seed) {
          scene.background = new THREE.Color(window.__kodBg);
          var code = drawCodeToCanvas(state, {
            fontPx: 46,
            lineH: 70,
            padX: 70,
            padY: 64,
            weight: 700,
          });
          var cw = code.W;
          var ch = code.H;
          var data = code.canvas.getContext("2d").getImageData(0, 0, cw, ch).data;
          var rng = mulberry32(((seed || 1) * 2654435761) >>> 0);

          var worldW = 13.0;
          var worldH = worldW * (ch / cw);

          // sample glyph pixels (brighter than the dark bg) on a fixed grid
          var step = 2;
          var tx = [];
          var col = [];
          for (var y = 0; y < ch; y += step) {
            for (var x = 0; x < cw; x += step) {
              var idx = (y * cw + x) * 4;
              var r = data[idx];
              var g = data[idx + 1];
              var b = data[idx + 2];
              if (r + g + b < 120) continue; // skip background
              tx.push((x / cw - 0.5) * worldW, -(y / ch - 0.5) * worldH, 0);
              col.push(r / 255, g / 255, b / 255);
            }
          }
          var n = tx.length / 3;

          var positions = new Float32Array(n * 3);
          var aOrigin = new Float32Array(n * 3);
          var aTarget = new Float32Array(tx);
          var aColor = new Float32Array(col);
          var aDelay = new Float32Array(n);
          for (var i = 0; i < n; i++) {
            var sx = (rng() * 2 - 1) * worldW * 1.15;
            var sy = (rng() * 2 - 1) * worldH * 1.7;
            var sz = (rng() * 2 - 1) * 9.0 - 2.0;
            aOrigin[i * 3] = sx;
            aOrigin[i * 3 + 1] = sy;
            aOrigin[i * 3 + 2] = sz;
            positions[i * 3] = sx;
            positions[i * 3 + 1] = sy;
            positions[i * 3 + 2] = sz;
            aDelay[i] = rng();
          }

          var geo = new THREE.BufferGeometry();
          geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
          geo.setAttribute("aOrigin", new THREE.BufferAttribute(aOrigin, 3));
          geo.setAttribute("aTarget", new THREE.BufferAttribute(aTarget, 3));
          geo.setAttribute("aColor", new THREE.BufferAttribute(aColor, 3));
          geo.setAttribute("aDelay", new THREE.BufferAttribute(aDelay, 1));

          var uniforms = { uProgress: { value: 0 }, uSize: { value: 3.4 * Math.min(1, 609 / cw) } };
          var mat = new THREE.ShaderMaterial({
            uniforms: uniforms,
            transparent: true,
            depthTest: false,
            depthWrite: false,
            blending: THREE.NormalBlending,
            vertexShader: [
              "attribute vec3 aOrigin; attribute vec3 aTarget; attribute vec3 aColor; attribute float aDelay;",
              "uniform float uProgress; uniform float uSize;",
              "varying vec3 vColor; varying float vP;",
              "void main(){",
              "  float span = 0.62;",
              "  float p = clamp((uProgress - aDelay*(1.0-span)) / span, 0.0, 1.0);",
              "  p = p*p*(3.0-2.0*p);",
              "  vec3 pos = mix(aOrigin, aTarget, p);",
              "  vec4 mv = modelViewMatrix * vec4(pos, 1.0);",
              "  gl_Position = projectionMatrix * mv;",
              "  gl_PointSize = uSize * (60.0 / -mv.z) * (0.45 + 0.55*p);",
              "  vColor = aColor; vP = p;",
              "}",
            ].join("\n"),
            fragmentShader: [
              "precision highp float;",
              "varying vec3 vColor; varying float vP;",
              "void main(){",
              "  vec2 d = gl_PointCoord - 0.5;",
              "  float r2 = dot(d, d);",
              "  if (r2 > 0.25) discard;",
              "  float a = smoothstep(0.25, 0.02, r2);",
              // brighter & whiter in flight, resolves to true color as it lands
              "  vec3 c = mix(vColor + vec3(0.32)*(1.0-vP), vColor, vP);",
              "  gl_FragColor = vec4(c, a * (0.7 + 0.3*vP));",
              "}",
            ].join("\n"),
          });

          var pts = new THREE.Points(geo, mat);
          scene.add(pts);

          camera.position.set(0, 0, 10);
          var vfov = (camera.fov * Math.PI) / 180;
          var sa = camera.aspect;
          var fitH = worldH / 2 / Math.tan(vfov / 2) / (0.78);
          var fitW = worldW / 2 / (Math.tan(vfov / 2) * sa) / (0.78);
          camera.position.z = Math.max(fitH, fitW);
          camera.lookAt(0, 0, 0);

          tl.to(uniforms.uProgress, { value: 1.0, duration: dur * 0.72, ease: "power2.out" }, 0);

          // uProgress is tweened by GSAP; the boot loop's render() draws once per frame.
          return function () {};
        }

        // ---- dispatch + boot ------------------------------------------------------
        function buildEffect(THREE, scene, camera, renderer, spec, st, tl) {
          var state = T[spec.seq].states[0];
          var dur = spec.duration;
          if (spec.effect === "particles")
            return fxParticles(THREE, scene, camera, renderer, state, st, tl, dur, spec.seed);
          return function () {};
        }

        // Free GPU resources (renderer, geometries, materials, textures) on page teardown.
        // One-shot renders exit per job so nothing leaks there; this guards long-lived
        // Studio/player sessions that reload. Fires only on unload — never during capture.
        function disposeGL(renderer, scene) {
          scene.traverse(function (o) {
            if (o.geometry && o.geometry.dispose) o.geometry.dispose();
            var mats = o.material ? (Array.isArray(o.material) ? o.material : [o.material]) : [];
            mats.forEach(function (m) {
              if (m.map && m.map.dispose) m.map.dispose();
              if (
                m.uniforms &&
                m.uniforms.uTex &&
                m.uniforms.uTex.value &&
                m.uniforms.uTex.value.dispose
              ) {
                m.uniforms.uTex.value.dispose();
              }
              if (m.dispose) m.dispose();
            });
          });
          if (renderer.dispose) renderer.dispose();
        }

        function go() {
          var spec = window.__BLOCK;
          var root = document.getElementById("kdpart-root");
          var glcanvas = document.getElementById("kdpart-gl");
          var W = window.__kodW || 1920;
          var H = window.__kodH || 1080;
          window.__timelines = window.__timelines || {};
          var tl = gsap.timeline({ paused: true });

          var THREE = window.THREE;
          var renderer = new THREE.WebGLRenderer({
            canvas: glcanvas,
            antialias: true,
            alpha: false,
            preserveDrawingBuffer: true,
          });
          renderer.setPixelRatio(1);
          renderer.setSize(W, H, false);
          var scene = new THREE.Scene();
          var camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 200);
          var st = {};

          document.fonts.ready.then(function () {
            var renderFn = buildEffect(THREE, scene, camera, renderer, spec, st, tl);
            function render() {
              renderFn();
              renderer.render(scene, camera);
            }
            tl.eventCallback("onUpdate", render);
            var dur = parseFloat(root.dataset.duration) || tl.duration();
            tl.to({}, { duration: dur }, 0); // pad to full composition length
            render(); // paint frame 0
            window.addEventListener("beforeunload", function () {
              disposeGL(renderer, scene);
            });
            window.__kodExit(tl);
            window.__timelines[spec.id] = tl; // register AFTER setup completes
            if (typeof window.__hfForceTimelineRebind === "function") {
              window.__hfForceTimelineRebind(); // re-nest now that we are populated
            }
          });
        }

        if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", go);
        else go();
      })();
    </script>
  </body>
</html>
