<!doctype html>
<html
  lang="ru"
  data-composition-variables='[
    { "id": "placement", "type": "enum", "role": "layout", "label": "Placement", "description": "full: own ground to the frame edge, card centred in the 780x1180 field (y 180-1360). top: card in the 780x760 field at y 180-940, rest of the frame transparent. bottom: same field at y 600-1360.", "default": "full", "options": [{ "value": "full", "label": "Full screen" }, { "value": "top", "label": "Top" }, { "value": "bottom", "label": "Bottom" }] },
    { "id": "displayName", "type": "string", "role": "content", "label": "Display name", "description": "Profile name in bold.", "maxLength": 12, "default": "MatIntellect" },
    { "id": "handle", "type": "string", "role": "content", "label": "Handle", "description": "Account handle with @.", "maxLength": 18, "default": "@matintellect" },
    { "id": "followers", "type": "string", "role": "content", "label": "Followers line", "description": "Small grey line under the handle.", "maxLength": 21, "default": "12,5 тыс. подписчиков" },
    { "id": "followLabel", "type": "string", "role": "content", "label": "Follow button", "description": "Button text before the press.", "maxLength": 12, "default": "Подписаться" },
    { "id": "followingLabel", "type": "string", "role": "content", "label": "Following button", "description": "Button text after the press.", "maxLength": 12, "default": "Вы подписаны" },
    { "id": "avatar", "type": "image", "role": "content", "label": "Avatar", "description": "Round profile picture.", "default": "assets/img/matintellect-avatar.svg" },
    { "id": "verified", "type": "boolean", "role": "content", "label": "Verified badge", "description": "Blue tick after the name.", "default": true },
    { "id": "cues", "type": "string", "role": "timing", "label": "Cues", "description": "Comma-separated seconds from mount start: 1 card lands, 2 button pressed, 3 card leaves (only when exit is not none). Empty keeps 0.1, 1.0, 3.8.", "default": "" },
    { "id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "none holds the card to the end of the mount.", "default": "none", "options": [{ "value": "none", "label": "Hold" }, { "value": "fade", "label": "Fade" }, { "value": "down", "label": "Slide down" }] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: transparent;
        overflow: hidden;
      }
      body {
        width: 1080px;
        height: 1920px;
      }

      [data-composition-id="instagram-follow"] .igf-ground {
        position: absolute;
        inset: 0;
        background: var(--bg, #0c1014);
      }
      [data-composition-id="instagram-follow"] .igf-field {
        position: absolute;
        left: 150px;
        width: 780px;
        top: 180px;
        height: 1180px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      [data-composition-id="instagram-follow"].igf-top .igf-field {
        top: 180px;
        height: 760px;
      }
      [data-composition-id="instagram-follow"].igf-bottom .igf-field {
        top: 600px;
        height: 760px;
      }

      [data-composition-id="instagram-follow"] .igf-card {
        display: flex;
        align-items: center;
        gap: 22px;
        background: #1a1a1a;
        border-radius: 70px;
        padding: 22px 26px 22px 22px;
        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
        font-family: "Montserrat", sans-serif;
        white-space: nowrap;
      }
      [data-composition-id="instagram-follow"] .igf-avatar {
        width: 104px;
        height: 104px;
        border-radius: 50%;
        object-fit: cover;
        flex-shrink: 0;
        border: 3px solid #333;
      }
      [data-composition-id="instagram-follow"] .igf-info {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      [data-composition-id="instagram-follow"] .igf-name-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      [data-composition-id="instagram-follow"] .igf-name {
        font-size: 38px;
        font-weight: 700;
        color: #ffffff;
        line-height: 1.25;
      }
      [data-composition-id="instagram-follow"] .igf-badge {
        width: 30px;
        height: 30px;
        flex-shrink: 0;
      }
      [data-composition-id="instagram-follow"] .igf-handle {
        font-size: 28px;
        color: #a0a0a0;
        line-height: 1.25;
      }
      [data-composition-id="instagram-follow"] .igf-followers {
        font-size: 28px;
        color: #8a8a8a;
        line-height: 1.25;
      }
      [data-composition-id="instagram-follow"] .igf-btn {
        position: relative;
        min-width: 232px;
        height: 76px;
        padding: 0 26px;
        border-radius: 38px;
        background: #0095f6;
        flex-shrink: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
      }
      [data-composition-id="instagram-follow"] .igf-btn-text {
        grid-area: 1 / 1;
        font-size: 28px;
        font-weight: 700;
        color: #ffffff;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      [data-composition-id="instagram-follow"] .igf-following {
        opacity: 0;
      }
      [data-composition-id="instagram-follow"] .igf-chevron {
        width: 18px;
        height: 18px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="instagram-follow"
      data-width="1080"
      data-height="1920"
      data-start="0"
      data-duration="30"
    >
      <div class="igf-ground"></div>
      <div class="igf-field">
        <div
          id="igf-card"
          class="clip igf-card"
          data-start="0"
          data-duration="30"
          data-track-index="0"
        >
          <img
            class="igf-avatar"
            src="assets/img/matintellect-avatar.svg"
            alt=""
            crossorigin="anonymous"
          />
          <div class="igf-info">
            <div class="igf-name-row">
              <div class="igf-name">MatIntellect</div>
              <svg class="igf-badge" viewBox="0 0 40 40" fill="none">
                <circle cx="20" cy="20" r="20" fill="#0095F6" />
                <path d="M17.5 27.5L10 20l2.5-2.5 5 5 10-10L30 15 17.5 27.5z" fill="#fff" />
              </svg>
            </div>
            <div class="igf-handle">@matintellect</div>
            <div class="igf-followers">12,5 тыс. подписчиков</div>
          </div>
          <div id="igf-btn" class="igf-btn">
            <span id="igf-follow" class="igf-btn-text">Подписаться</span>
            <span id="igf-following" class="igf-btn-text igf-following"
              ><span class="igf-following-label">Вы подписаны</span
              ><svg
                class="igf-chevron"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#fff"
                stroke-width="3"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polyline points="6 9 12 15 18 9"></polyline></svg
            ></span>
          </div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        var root = document.querySelector('[data-composition-id="instagram-follow"]');
        var vars =
          window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
            ? window.__hyperframes.getVariables()
            : {};
        function str(v, d) {
          return typeof v === "string" && v.trim() ? v : d;
        }
        function oneOf(v, list, d) {
          return list.indexOf(v) >= 0 ? v : d;
        }

        var placement = oneOf(vars.placement, ["full", "top", "bottom"], "full");
        root.classList.add("igf-" + placement);
        if (placement !== "full") root.querySelector(".igf-ground").remove();

        root.querySelector(".igf-name").textContent = str(vars.displayName, "MatIntellect");
        root.querySelector(".igf-handle").textContent = str(vars.handle, "@matintellect");
        root.querySelector(".igf-followers").textContent = str(
          vars.followers,
          "12,5 тыс. подписчиков",
        );
        root.querySelector("#igf-follow").textContent = str(vars.followLabel, "Подписаться");
        root.querySelector(".igf-following-label").textContent = str(
          vars.followingLabel,
          "Вы подписаны",
        );
        root.querySelector(".igf-avatar").src = str(
          vars.avatar,
          "assets/img/matintellect-avatar.svg",
        );
        if (vars.verified === false) root.querySelector(".igf-badge").remove();

        var authored = [0.1, 1.0, 3.8];
        var cues = String(vars.cues || "")
          .split(",")
          .map(function (s) {
            return parseFloat(s);
          });
        function at(i) {
          return isFinite(cues[i]) ? cues[i] : authored[i];
        }
        var exit = oneOf(vars.exit, ["none", "fade", "down"], "none");

        var card = document.getElementById("igf-card");
        var btn = document.getElementById("igf-btn");
        var tFollow = document.getElementById("igf-follow");
        var tFollowing = document.getElementById("igf-following");

        var tl = gsap.timeline({ paused: true });
        gsap.set(card, { y: 300, opacity: 0 });
        tl.to(card, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, at(0));
        tl.to(btn, { scale: 0.92, duration: 0.15, ease: "power2.out" }, at(1));
        tl.to(btn, { scale: 1, duration: 0.4, ease: "elastic.out(1, 0.4)" }, at(1) + 0.15);
        tl.to(btn, { backgroundColor: "#2f2f2f", duration: 0.12, ease: "none" }, at(1) + 0.15);
        tl.to(tFollow, { opacity: 0, duration: 0.08, ease: "none" }, at(1) + 0.15);
        tl.to(tFollowing, { opacity: 1, duration: 0.08, ease: "none" }, at(1) + 0.18);
        if (exit === "fade") tl.to(card, { opacity: 0, duration: 0.3, ease: "power2.in" }, at(2));
        if (exit === "down")
          tl.to(card, { y: 300, opacity: 0, duration: 0.25, ease: "power3.in" }, at(2));

        window.__timelines = window.__timelines || {};
        window.__timelines["instagram-follow"] = tl;
      })();
    </script>
  </body>
</html>
