<!doctype html>
<html
  lang="ru"
  data-composition-variables='[
    { "id": "placement", "type": "enum", "role": "layout", "label": "Placement", "description": "Overlay over footage, centred on the frame, no ground. bottom: the plate sits on y 1360, just above the caption band. top: the plate hangs from y 180. center: centred on y 770.", "default": "bottom", "options": [{ "value": "bottom", "label": "Bottom" }, { "value": "top", "label": "Top" }, { "value": "center", "label": "Centre" }] },
    { "id": "name", "type": "string", "role": "content", "label": "Name", "description": "Name line, bold; wraps to up to three lines in the vertical version.", "maxLength": 28, "default": "Мат Джестер" },
    { "id": "role", "type": "string", "role": "content", "label": "Role", "description": "Line under the name. Empty hides it.", "maxLength": 40, "default": "Основатель MatIntellect" },
    { "id": "cues", "type": "string", "role": "timing", "label": "Cues", "description": "Comma-separated seconds from mount start: 1 the card wipes in, the red tab grows, name and role rise, 2 the plate leaves (only when exit is out). Empty keeps 0.1, 4.3.", "default": "" },
    { "id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "none holds the plate to the end of the mount; out plays its own leaving motion at cue 2.", "default": "none", "options": [{ "value": "none", "label": "Hold" }, { "value": "out", "label": "Leave" }] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: transparent;
        overflow: hidden;
      }
      body {
        width: 1080px;
        height: 1920px;
      }
      #lcbv-root {
        font-family: var(--font-body, "Montserrat"), sans-serif;
      }
      #lcbv-lt {
        position: absolute;
      }
      #lcbv-card { display: flex; align-items: stretch; border-radius: 16px; overflow: hidden; border: 2px solid var(--border, #2e2e32); box-shadow: 0 14px 44px rgba(0, 0, 0, 0.35); }
      #lcbv-tab { width: 12px; background: var(--accent, #ff0000); flex-shrink: 0; }
      #lcbv-body { background: var(--surface, #18181a); padding: 22px 40px 24px 30px; display: flex; flex-direction: column; gap: 8px; }
      #lcbv-name { font-weight: 700; color: var(--fg, #f2f2f2); line-height: 1.06; }
      #lcbv-role { color: var(--muted, #8a8a90); line-height: 1.2; }
      
      
      #lcbv-lt {
        left: 150px;
        width: 780px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      #lcbv-root.lcbv-bottom #lcbv-lt {
        bottom: 560px;
      }
      #lcbv-root.lcbv-top #lcbv-lt {
        top: 180px;
      }
      #lcbv-root.lcbv-center #lcbv-lt {
        top: 770px;
        transform: translateY(-50%);
      }
      #lcbv-card { max-width: 780px; }
      #lcbv-name { font-size: 62px; }
      #lcbv-role { font-size: 34px; }
      
    </style>
  </head>
  <body>
    <div id="lcbv-root" data-composition-id="lt-clean-bar-vertical" data-width="1080" data-height="1920" data-start="0" data-duration="30">
      <div id="lcbv-lt">
        <div id="lcbv-card">
          <div id="lcbv-tab"></div>
          <div id="lcbv-body">
            <div id="lcbv-name"></div>
            <div id="lcbv-role"></div>
          </div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var root = document.getElementById("lcbv-root");
        var V =
          window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
            ? window.__hyperframes.getVariables()
            : {};
        function oneOf(v, list, d) {
          return list.indexOf(v) >= 0 ? v : d;
        }
        
        root.classList.add("lcbv-" + oneOf(V.placement, ["bottom", "top", "center"], "bottom"));
        
        document.getElementById("lcbv-name").textContent = typeof V.name === "string" && V.name.trim() ? V.name : "Мат Джестер";
        var role = typeof V.role === "string" ? V.role : "Основатель MatIntellect";
        var roleEl = document.getElementById("lcbv-role");
        roleEl.textContent = role;
        if (!role) (document.getElementById("lcbv-rolebox") || roleEl).style.display = "none";

        var cues = String(V.cues || "")
          .split(",")
          .map(function (v) {
            return parseFloat(v);
          });
        var c0 = isFinite(cues[0]) && cues[0] >= 0 ? cues[0] : 0.1;
        var exit = oneOf(V.exit, ["none", "out"], "none");

        var tl = gsap.timeline({ paused: true });
        tl.fromTo("#lcbv-card", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.55, ease: "power3.out" }, c0);
        tl.fromTo("#lcbv-tab", { scaleY: 0, transformOrigin: "50% 0%" }, { scaleY: 1, duration: 0.45, ease: "power2.out" }, c0 + 0.18);
        tl.fromTo("#lcbv-name", { y: 22, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, c0 + 0.24);
        tl.fromTo("#lcbv-role", { y: 22, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, c0 + 0.34);
        if (exit === "out") {
          var out = isFinite(cues[1]) ? cues[1] : c0 + 4.2;
          tl.to("#lcbv-card", { y: 18, opacity: 0, duration: 0.35, ease: "power2.in" }, out);
        }
        tl.set({}, {}, 30);
        window.__timelines = window.__timelines || {};
        window.__timelines["lt-clean-bar-vertical"] = tl;
      })();
    </script>
  </body>
</html>
