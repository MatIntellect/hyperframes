<!doctype html>
<html
  lang="ru"
  data-composition-variables='[
    { "id": "title", "type": "string", "role": "content", "label": "Headline", "description": "Headline above the list, Bebas Neue, one line; the vertical sets it smaller to keep a long headline on one line. Empty hides it.", "maxLength": 24, "default": "Что внутри" },
    { "id": "rows", "type": "string", "role": "content", "label": "Rows", "description": "Rows separated by ;, each as Label | value (value optional). Up to 6 rows; label up to 20 characters, value up to 32.", "maxLength": 340, "default": "Монтаж | сам, без человека; Графика | из готовой базы; Субтитры | по словам речи; Звук | только эффекты; Рендер | один раз" },
    { "id": "cues", "type": "string", "role": "timing", "label": "Cues", "description": "Comma-separated seconds from mount start: 1 the headline and the first row land, 2 the last row lands (rows between are spread evenly), 3 the list fades out (only when exit is fade). Empty keeps 0.3 and 0.25 s per row.", "default": "" },
    { "id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "none holds the list to the end of the mount.", "default": "none", "options": [{ "value": "none", "label": "Hold" }, { "value": "fade", "label": "Fade" }] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: transparent;
        overflow: hidden;
      }
      body {
        width: 1920px;
        height: 1080px;
      }
      #msl-root {
        font-family: var(--font-body, "Montserrat"), sans-serif;
        color: var(--fg, #f2f2f2);
      }
      #msl-root .msl-ground {
        position: absolute;
        inset: 0;
        background: var(--bg, #0c1014);
      }
      #msl-field {
        position: absolute;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      #msl-title {
        font-family: var(--font-display, "Bebas Neue"), sans-serif;
        font-weight: 700;
        line-height: 1;
        text-transform: uppercase;
        white-space: nowrap;
        clip-path: inset(-0.3em 100% -0.3em 0);
      }
      .msl-row {
        opacity: 0;
      }
      .msl-text {
        display: flex;
        align-items: baseline;
        column-gap: 20px;
      }
      .msl-label {
        font-weight: 700;
        line-height: 1.15;
      }
      .msl-value {
        color: var(--muted, #8a8a90);
        line-height: 1.2;
      }
      .msl-line {
        position: relative;
        height: 4px;
        background: var(--border, #2e2e32);
        border-radius: 2px;
        overflow: hidden;
      }
      .msl-fill {
        position: absolute;
        inset: 0;
        background: var(--accent, #ff0000);
        transform-origin: left center;
      }
      
      #msl-field {
        left: 240px;
        top: 90px;
        width: 1440px;
        height: 900px;
      }
      #msl-title {
        font-size: 96px;
        margin-bottom: 40px;
      }
      .msl-row + .msl-row {
        margin-top: 34px;
      }
      .msl-label {
        font-size: 48px;
        white-space: nowrap;
      }
      .msl-value {
        font-size: 40px;
        white-space: nowrap;
      }
      .msl-line {
        margin-top: 18px;
      }
      
      
    </style>
  </head>
  <body>
    <div id="msl-root" data-composition-id="mk-specs-list" data-width="1920" data-height="1080" data-start="0" data-duration="30">
      <div class="msl-ground"></div>
      <div id="msl-field">
        <div id="msl-title">Что внутри</div>
      </div>
    </div>
    <script>
      (function () {
        var root = document.getElementById("msl-root");
        var V =
          window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
            ? window.__hyperframes.getVariables()
            : {};
        function oneOf(v, list, d) {
          return list.indexOf(v) >= 0 ? v : d;
        }
        var MAXROWS = 6;
        
        var DEF = "Монтаж | сам, без человека; Графика | из готовой базы; Субтитры | по словам речи; Звук | только эффекты; Рендер | один раз";
        var title = typeof V.title === "string" ? V.title : "Что внутри";
        var titleEl = document.getElementById("msl-title");
        titleEl.textContent = title;
        if (!title) titleEl.style.display = "none";
        var rows = String(typeof V.rows === "string" && V.rows.trim() ? V.rows : DEF)
          .split(";")
          .map(function (r) {
            var p = r.split("|");
            return { label: (p[0] || "").trim(), value: p.slice(1).join("|").trim() };
          })
          .filter(function (r) {
            return r.label;
          })
          .slice(0, MAXROWS);

        var field = document.getElementById("msl-field");
        var rowEls = [],
          fills = [];
        rows.forEach(function (r, i) {
          var row = document.createElement("div");
          row.className = "msl-row";
          row.id = "msl-row-" + i;
          var text = document.createElement("div");
          text.className = "msl-text";
          var label = document.createElement("span");
          label.className = "msl-label";
          label.textContent = r.label;
          text.appendChild(label);
          if (r.value) {
            var value = document.createElement("span");
            value.className = "msl-value";
            value.textContent = r.value;
            text.appendChild(value);
          }
          row.appendChild(text);
          var line = document.createElement("div");
          line.className = "msl-line";
          var fill = document.createElement("div");
          fill.className = "msl-fill";
          line.appendChild(fill);
          row.appendChild(line);
          field.appendChild(row);
          rowEls.push(row);
          fills.push(fill);
        });

        var cues = String(V.cues || "")
          .split(",")
          .map(function (v) {
            return parseFloat(v);
          });
        var c0 = isFinite(cues[0]) && cues[0] >= 0 ? cues[0] : 0.3;
        var cLast = rows.length > 1 && isFinite(cues[1]) && cues[1] > c0 ? cues[1] : c0 + 0.25 * (rows.length - 1);
        var exit = oneOf(V.exit, ["none", "fade"], "none");

        var tl = gsap.timeline({ paused: true });
        tl.to(titleEl, { clipPath: "inset(-0.3em 0% -0.3em 0)", duration: 0.6, ease: "power1.inOut" }, Math.max(0, c0 - 0.3));
        rowEls.forEach(function (row, i) {
          var t = rows.length > 1 ? c0 + ((cLast - c0) * i) / (rows.length - 1) : c0;
          tl.fromTo(row, { opacity: 0, x: -36 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, t);
          tl.fromTo(fills[i], { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power2.inOut" }, t + 0.15);
        });
        if (exit === "fade") tl.to(field, { opacity: 0, y: -20, duration: 0.4, ease: "power2.in" }, isFinite(cues[2]) ? cues[2] : cLast + 3);
        tl.set({}, {}, 30);
        window.__timelines = window.__timelines || {};
        window.__timelines["mk-specs-list"] = tl;
      })();
    </script>
  </body>
</html>
