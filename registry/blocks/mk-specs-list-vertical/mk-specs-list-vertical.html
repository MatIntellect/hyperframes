<!doctype html>
<html
  lang="ru"
  data-composition-variables='[
    { "id": "placement", "type": "enum", "role": "layout", "label": "Placement", "description": "full: own ground to the frame edge, the list in the 780x1180 field (y 180-1360), up to 6 rows. top / bottom: the list on a brand card 780x760 at y 180-940 / 600-1360, up to 4 rows, rest of the frame transparent.", "default": "full", "options": [{ "value": "full", "label": "Full screen" }, { "value": "top", "label": "Top" }, { "value": "bottom", "label": "Bottom" }] },
    { "id": "title", "type": "string", "role": "content", "label": "Headline", "description": "Headline above the list, Bebas Neue, one line wide, up to two lines vertical. Empty hides it.", "maxLength": 24, "default": "Что внутри" },
    { "id": "rows", "type": "string", "role": "content", "label": "Rows", "description": "Rows separated by ;, each as Label | value (value optional). Up to 6 rows; label up to 20 characters, value up to 32.", "maxLength": 340, "default": "Монтаж | сам, без человека; Графика | из готовой базы; Субтитры | по словам речи; Звук | только эффекты; Рендер | один раз" },
    { "id": "cues", "type": "string", "role": "timing", "label": "Cues", "description": "Comma-separated seconds from mount start: 1 the headline and the first row land, 2 the last row lands (rows between are spread evenly), 3 the list fades out (only when exit is fade). Empty keeps 0.3 and 0.25 s per row.", "default": "" },
    { "id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "none holds the list to the end of the mount.", "default": "none", "options": [{ "value": "none", "label": "Hold" }, { "value": "fade", "label": "Fade" }] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+20BD, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: transparent;
        overflow: hidden;
      }
      body {
        width: 1080px;
        height: 1920px;
      }
      #mslv-root {
        font-family: var(--font-body, "Montserrat"), sans-serif;
        color: var(--fg, #f2f2f2);
      }
      #mslv-root .mslv-ground {
        position: absolute;
        inset: 0;
        background: var(--bg, #0c1014);
      }
      #mslv-field {
        position: absolute;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      #mslv-title {
        font-family: var(--font-display, "Bebas Neue"), sans-serif;
        font-weight: 700;
        line-height: 1;
        text-transform: uppercase;
        white-space: nowrap;
        clip-path: inset(-0.3em 100% -0.3em 0);
      }
      .mslv-row {
        opacity: 0;
      }
      .mslv-text {
        display: flex;
        align-items: baseline;
        column-gap: 20px;
      }
      .mslv-label {
        font-weight: 700;
        line-height: 1.15;
      }
      .mslv-value {
        color: var(--muted, #8a8a90);
        line-height: 1.2;
      }
      .mslv-line {
        position: relative;
        height: 4px;
        background: var(--border, #2e2e32);
        border-radius: 2px;
        overflow: hidden;
      }
      .mslv-fill {
        position: absolute;
        inset: 0;
        background: var(--accent, #ff0000);
        transform-origin: left center;
      }
      
      
      #mslv-field {
        left: 150px;
        width: 780px;
        top: 180px;
        height: 1180px;
      }
      .mslv-text {
        flex-direction: column;
        align-items: flex-start;
        row-gap: 6px;
      }
      #mslv-title {
        font-size: 112px;
        margin-bottom: 44px;
        white-space: normal;
      }
      .mslv-row + .mslv-row {
        margin-top: 34px;
      }
      .mslv-label {
        font-size: 50px;
      }
      .mslv-value {
        font-size: 38px;
      }
      .mslv-line {
        margin-top: 18px;
      }
      #mslv-root.mslv-card #mslv-field {
        height: 760px;
        padding: 44px;
        background: var(--surface, #18181a);
        border: 2px solid var(--border, #2e2e32);
        border-radius: 32px;
      }
      #mslv-root.mslv-bottom #mslv-field {
        top: 600px;
      }
      #mslv-root.mslv-card #mslv-title {
        font-size: 72px;
        margin-bottom: 26px;
      }
      #mslv-root.mslv-card .mslv-row + .mslv-row {
        margin-top: 22px;
      }
      #mslv-root.mslv-card .mslv-label {
        font-size: 40px;
      }
      #mslv-root.mslv-card .mslv-value {
        font-size: 30px;
      }
      #mslv-root.mslv-card .mslv-line {
        margin-top: 12px;
      }
      
    </style>
  </head>
  <body>
    <div id="mslv-root" data-composition-id="mk-specs-list-vertical" data-width="1080" data-height="1920" data-start="0" data-duration="30">
      <div class="mslv-ground"></div>
      <div id="mslv-field">
        <div id="mslv-title">Что внутри</div>
      </div>
    </div>
    <script>
      (function () {
        var root = document.getElementById("mslv-root");
        var V =
          window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
            ? window.__hyperframes.getVariables()
            : {};
        function oneOf(v, list, d) {
          return list.indexOf(v) >= 0 ? v : d;
        }
        var MAXROWS = 6;
        
        var placement = oneOf(V.placement, ["full", "top", "bottom"], "full");
        if (placement !== "full") {
          root.classList.add("mslv-card", "mslv-" + placement);
          root.querySelector(".mslv-ground").remove();
          MAXROWS = 4;
        }
        
        var DEF = "Монтаж | сам, без человека; Графика | из готовой базы; Субтитры | по словам речи; Звук | только эффекты; Рендер | один раз";
        var title = typeof V.title === "string" ? V.title : "Что внутри";
        var titleEl = document.getElementById("mslv-title");
        titleEl.textContent = title;
        if (!title) titleEl.style.display = "none";
        var rows = String(typeof V.rows === "string" && V.rows.trim() ? V.rows : DEF)
          .split(";")
          .map(function (r) {
            var p = r.split("|");
            return { label: (p[0] || "").trim(), value: p.slice(1).join("|").trim() };
          })
          .filter(function (r) {
            return r.label;
          })
          .slice(0, MAXROWS);

        var field = document.getElementById("mslv-field");
        var rowEls = [],
          fills = [];
        rows.forEach(function (r, i) {
          var row = document.createElement("div");
          row.className = "mslv-row";
          row.id = "mslv-row-" + i;
          var text = document.createElement("div");
          text.className = "mslv-text";
          var label = document.createElement("span");
          label.className = "mslv-label";
          label.textContent = r.label;
          text.appendChild(label);
          if (r.value) {
            var value = document.createElement("span");
            value.className = "mslv-value";
            value.textContent = r.value;
            text.appendChild(value);
          }
          row.appendChild(text);
          var line = document.createElement("div");
          line.className = "mslv-line";
          var fill = document.createElement("div");
          fill.className = "mslv-fill";
          line.appendChild(fill);
          row.appendChild(line);
          field.appendChild(row);
          rowEls.push(row);
          fills.push(fill);
        });

        var cues = String(V.cues || "")
          .split(",")
          .map(function (v) {
            return parseFloat(v);
          });
        var c0 = isFinite(cues[0]) && cues[0] >= 0 ? cues[0] : 0.3;
        var cLast = rows.length > 1 && isFinite(cues[1]) && cues[1] > c0 ? cues[1] : c0 + 0.25 * (rows.length - 1);
        var exit = oneOf(V.exit, ["none", "fade"], "none");

        var tl = gsap.timeline({ paused: true });
        tl.to(titleEl, { clipPath: "inset(-0.3em 0% -0.3em 0)", duration: 0.6, ease: "power1.inOut" }, Math.max(0, c0 - 0.3));
        rowEls.forEach(function (row, i) {
          var t = rows.length > 1 ? c0 + ((cLast - c0) * i) / (rows.length - 1) : c0;
          tl.fromTo(row, { opacity: 0, x: -36 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, t);
          tl.fromTo(fills[i], { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power2.inOut" }, t + 0.15);
        });
        if (exit === "fade") tl.to(field, { opacity: 0, y: -20, duration: 0.4, ease: "power2.in" }, isFinite(cues[2]) ? cues[2] : cLast + 3);
        tl.set({}, {}, 30);
        window.__timelines = window.__timelines || {};
        window.__timelines["mk-specs-list-vertical"] = tl;
      })();
    </script>
  </body>
</html>
