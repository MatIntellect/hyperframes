<!doctype html>
<html
  lang="ru"
  data-composition-variables='[
    { "id": "label", "type": "string", "role": "content", "label": "Label", "description": "Plate in the lower left corner of the scene. Empty hides it.", "maxLength": 30, "default": "Эффект Хичкока" },
    { "id": "direction", "type": "enum", "role": "style", "label": "Dolly direction", "description": "out pulls the camera back and zooms in, the background rushes in. in pushes the camera forward and zooms out, the background falls away.", "default": "out", "options": [{ "value": "out", "label": "Dolly out + zoom in (background rushes in)" }, { "value": "in", "label": "Dolly in + zoom out (background falls away)" }] },
    { "id": "strength", "type": "number", "role": "style", "label": "Move strength (end / start distance ratio)", "default": 2, "min": 1.1, "max": 4, "step": 0.1 },
    { "id": "subjectDistance", "type": "number", "role": "style", "label": "Camera-to-subject distance at the start of the move", "default": 1400, "min": 600, "max": 3000, "step": 50, "unit": "px" },
    { "id": "easing", "type": "enum", "role": "style", "label": "Dolly easing", "default": "power2.inOut", "options": [{ "value": "none", "label": "Linear" }, { "value": "sine.inOut", "label": "Sine in-out" }, { "value": "power1.inOut", "label": "Power1 in-out" }, { "value": "power2.inOut", "label": "Power2 in-out" }, { "value": "power3.inOut", "label": "Power3 in-out" }] },
    { "id": "cues", "type": "string", "role": "timing", "label": "Cues", "description": "Comma-separated seconds from mount start: 1 the dolly starts, 2 it ends and the shot holds, 3 the scene fades out (only when exit is fade). Empty keeps 0 and 4.", "default": "" },
    { "id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "none holds the last camera position to the end of the mount.", "default": "none", "options": [{ "value": "none", "label": "Hold" }, { "value": "fade", "label": "Fade" }] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: transparent;
        overflow: hidden;
      }
      body {
        width: 1920px;
        height: 1080px;
      }
      #cdz-root {
        position: absolute;
        inset: 0;
        overflow: hidden;
        font-family: var(--font-body, "Montserrat"), sans-serif;
      }
      /* Окно сцены. Внутри – только preserve-3d, без overflow: hidden, иначе глубина сплющится */
      /* фон окна – цвет задней стены: у стены нет края на любых значениях полей (иначе на пределе видна коробка сцены) */
      #cdz-win {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: var(--surface, #18181a);
      }
      #cdz-stage {
        position: absolute;
        inset: 0;
        perspective-origin: 50% 50%;
      }
      #cdz-rig {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
      }
      .cdz-arch {
        position: absolute;
        border: 16px solid var(--border, #2e2e32);
        border-radius: 8px;
        transform-style: preserve-3d;
      }
      #cdz-backwall {
        position: absolute;
        background: var(--surface, #18181a);
        transform-style: preserve-3d;
      }
      #cdz-portal {
        position: absolute;
        background: var(--fg, #f2f2f2);
      }
      #cdz-subject {
        position: absolute;
        transform-style: preserve-3d;
      }
      .cdz-head {
        margin: 0 auto;
        border-radius: 50%;
        background: var(--accent, #ff0000);
      }
      .cdz-body {
        background: var(--accent, #ff0000);
      }
      #cdz-label {
        position: absolute;
        padding: 14px 22px;
        border-radius: 8px;
        background: var(--bg, #0c1014);
        border: 2px solid var(--border, #2e2e32);
        color: var(--fg, #f2f2f2);
        font-size: 28px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        overflow-wrap: break-word;
      }
      
      #cdz-label {
        left: 64px;
        bottom: 56px;
      }
      
      
    </style>
  </head>
  <body>
    <div id="cdz-root" data-composition-id="camera-dolly-zoom" data-width="1920" data-height="1080" data-start="0" data-duration="30">
      <div id="cdz-win">
        <div id="cdz-stage">
          <div id="cdz-rig">
            <div id="cdz-backwall" data-layout-allow-overflow data-layout-ignore><div id="cdz-portal"></div></div>
            <div class="cdz-arch" data-layout-allow-overflow data-layout-ignore data-z="-2360" data-t="0"></div>
            <div class="cdz-arch" data-layout-allow-overflow data-layout-ignore data-z="-1720" data-t="0.25"></div>
            <div class="cdz-arch" data-layout-allow-overflow data-layout-ignore data-z="-1120" data-t="0.5"></div>
            <div class="cdz-arch" data-layout-allow-overflow data-layout-ignore data-z="-560" data-t="0.75"></div>
            <div class="cdz-arch" data-layout-allow-overflow data-layout-ignore data-z="0" data-t="1"></div>
            <div id="cdz-subject"><div class="cdz-head"></div><div class="cdz-body"></div></div>
          </div>
        </div>
        <div id="cdz-label"></div>
      </div>
    </div>
    <script>
      (function () {
        var root = document.getElementById("cdz-root");
        var V =
          window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
            ? window.__hyperframes.getVariables()
            : {};
        function oneOf(v, list, d) {
          return list.indexOf(String(v)) >= 0 ? String(v) : d;
        }
        function clamp(v, lo, hi, d) {
          var n = Number(v);
          if (v === "" || v === null || v === undefined || !isFinite(n)) return d;
          return Math.min(hi, Math.max(lo, n));
        }
        // размер окна сцены и место фигуры (центр по x, верх фигуры)
        var W = 1920,
          H = 1080,
          k = 1,
          subTop = 300,
          OY = 540,
          portalH = 1500,
          portalDy = 350;
        
        var label = typeof V.label === "string" ? V.label.trim() : "Эффект Хичкока";
        var lab = document.getElementById("cdz-label");
        lab.textContent = label;
        if (!label) lab.style.display = "none";

        // сцена от размера окна: арки на 140/80 px шире кадра, стена с проёмом – по центру
        document.querySelectorAll(".cdz-arch").forEach(function (a) {
          var t = Number(a.getAttribute("data-t"));
          a.style.cssText = "left:-140px;top:-80px;width:" + (W + 280) + "px;height:" + (H + 160) + "px;transform:translateZ(" + a.getAttribute("data-z") + "px);border-color:color-mix(in srgb, var(--muted, #8a8a90) " + Math.round(t * 100) + "%, var(--border, #2e2e32))";
        });
        var bw = document.getElementById("cdz-backwall");
        bw.style.cssText = "left:" + (W / 2 - 4000) + "px;top:" + (OY - 2250) + "px;width:8000px;height:4500px;transform:translateZ(-3200px)";
        document.getElementById("cdz-portal").style.cssText = "left:3300px;top:" + (2250 + portalDy - portalH / 2) + "px;width:1400px;height:" + portalH + "px";
        var sub = document.getElementById("cdz-subject");
        sub.style.cssText = "left:" + (W / 2 - 120 * k) + "px;top:" + subTop + "px;width:" + 240 * k + "px;height:" + 620 * k + "px;transform:translateZ(0px)";
        sub.firstChild.style.cssText = "width:" + 120 * k + "px;height:" + 120 * k + "px";
        sub.lastChild.style.cssText = "width:" + 240 * k + "px;height:" + 470 * k + "px;margin-top:" + 30 * k + "px;border-radius:" + 120 * k + "px " + 120 * k + "px 10px 10px";

        var direction = oneOf(V.direction, ["in", "out"], "out");
        var strength = clamp(V.strength, 1.1, 4, 2);
        var ease = oneOf(V.easing, ["none", "sine.inOut", "power1.inOut", "power2.inOut", "power3.inOut"], "power2.inOut");
        var d0 = clamp(V.subjectDistance, 600, 3000, 1400);
        var d1 = direction === "in" ? d0 / strength : d0 * strength;
        var stage = document.getElementById("cdz-stage"),
          rig = document.getElementById("cdz-rig");
        stage.style.perspectiveOrigin = "50% " + OY + "px";
        // фигура держит размер, пока d * tan(FOV/2) постоянно: перспектива = расстояние
        function applyCamera(u) {
          var d = d0 + (d1 - d0) * u;
          var P = d;
          stage.style.perspective = P + "px";
          rig.style.transform = "translateZ(" + (P - d) + "px)";
        }
        // сеттер срабатывает и при перемотке (onUpdate шкалы при seek молчит)
        var camera = {
          _u: 0,
          get u() {
            return this._u;
          },
          set u(v) {
            this._u = v;
            applyCamera(v);
          },
        };
        applyCamera(0);

        var cues = String(V.cues || "")
          .split(",")
          .map(function (v) {
            return parseFloat(v);
          });
        var c0 = isFinite(cues[0]) && cues[0] >= 0 ? cues[0] : 0;
        var c1 = isFinite(cues[1]) && cues[1] > c0 + 0.5 ? cues[1] : c0 + 4;
        var exit = oneOf(V.exit, ["none", "fade"], "none");

        var tl = gsap.timeline({ paused: true });
        tl.to(camera, { u: 1, duration: c1 - c0, ease: ease }, c0);
        if (exit === "fade") tl.to("#cdz-win", { opacity: 0, duration: 0.5, ease: "power2.in" }, isFinite(cues[2]) && cues[2] > c1 ? cues[2] : c1 + 2);
        tl.set({}, {}, 30);
        window.__timelines = window.__timelines || {};
        window.__timelines["camera-dolly-zoom"] = tl;
      })();
    </script>
  </body>
</html>
