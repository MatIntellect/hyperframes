<!doctype html>
<html
  lang="ru"
  data-composition-variables='[
    { "id": "placement", "type": "enum", "role": "layout", "label": "Placement", "description": "Overlay over footage, no ground, in the 780 column centred on the frame. top: the comments hang from y 180. center: centred on y 770. bottom: they sit on y 1360, above the caption band.", "default": "center", "options": [{ "value": "top", "label": "Top" }, { "value": "center", "label": "Centre" }, { "value": "bottom", "label": "Bottom" }] },
    { "id": "user1", "type": "string", "role": "content", "label": "Comment 1 user", "description": "Handle of the first commenter.", "maxLength": 20, "default": "@pixelwaves" },
    { "id": "time1", "type": "string", "role": "content", "label": "Comment 1 time", "description": "Grey age after the handle.", "maxLength": 14, "default": "2 дня назад" },
    { "id": "text1", "type": "string", "role": "content", "label": "Comment 1 text", "description": "Typed on letter by letter, up to three lines.", "maxLength": 48, "default": "Как ты это смонтировал так быстро?" },
    { "id": "likes1", "type": "string", "role": "content", "label": "Comment 1 likes", "description": "Like count.", "maxLength": 8, "default": "47" },
    { "id": "avatar1", "type": "image", "role": "content", "label": "Comment 1 avatar", "description": "Round picture; empty draws a coloured circle with the first letter of the handle.", "default": "" },
    { "id": "user2", "type": "string", "role": "content", "label": "Comment 2 user", "description": "Handle of the second commenter. Empty hides the comment.", "maxLength": 20, "default": "@framerate" },
    { "id": "time2", "type": "string", "role": "content", "label": "Comment 2 time", "description": "Grey age after the handle.", "maxLength": 14, "default": "1 день назад" },
    { "id": "text2", "type": "string", "role": "content", "label": "Comment 2 text", "description": "Typed on letter by letter, up to three lines.", "maxLength": 48, "default": "Графика как у больших каналов, жду разбор" },
    { "id": "likes2", "type": "string", "role": "content", "label": "Comment 2 likes", "description": "Like count.", "maxLength": 8, "default": "12" },
    { "id": "avatar2", "type": "image", "role": "content", "label": "Comment 2 avatar", "description": "Round picture; empty draws a coloured circle with a letter.", "default": "" },
    { "id": "user3", "type": "string", "role": "content", "label": "Comment 3 user", "description": "Handle of the third commenter. Empty hides the comment.", "maxLength": 20, "default": "" },
    { "id": "time3", "type": "string", "role": "content", "label": "Comment 3 time", "description": "Grey age after the handle.", "maxLength": 14, "default": "" },
    { "id": "text3", "type": "string", "role": "content", "label": "Comment 3 text", "description": "Typed on letter by letter, up to three lines.", "maxLength": 48, "default": "" },
    { "id": "likes3", "type": "string", "role": "content", "label": "Comment 3 likes", "description": "Like count.", "maxLength": 8, "default": "" },
    { "id": "avatar3", "type": "image", "role": "content", "label": "Comment 3 avatar", "description": "Round picture; empty draws a coloured circle with a letter.", "default": "" },
    { "id": "replyLabel", "type": "string", "role": "content", "label": "Reply label", "description": "Word after the like count.", "maxLength": 12, "default": "Ответить" },
    { "id": "cues", "type": "string", "role": "timing", "label": "Cues", "description": "Comma-separated seconds from mount start: when each comment starts (avatar pops, then the text types), then when the comments leave (only when exit is fade). Empty starts at 0.3 and runs them one after another.", "default": "" },
    { "id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "none holds the comments to the end of the mount; fade lifts them out.", "default": "none", "options": [{ "value": "none", "label": "Hold" }, { "value": "fade", "label": "Fade" }] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: transparent;
        overflow: hidden;
      }
      body {
        width: 1080px;
        height: 1920px;
      }
      /* YouTube comments in the dark theme: native text colours set in Montserrat, shadowed for footage */
      #yccv-root {
        font-family: "Montserrat", sans-serif;
      }
      #yccv-col {
        position: absolute;
        display: flex;
        flex-direction: column;
      }
      .yccv-card {
        display: flex;
        align-items: flex-start;
      }
      .yccv-av {
        flex: none;
        border-radius: 50%;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 500;
        color: #ffffff;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
      }
      .yccv-av img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .yccv-body {
        min-width: 0;
        flex: 1;
      }
      .yccv-meta {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        column-gap: 14px;
      }
      .yccv-user,
      .yccv-text {
        color: #f1f1f1;
        text-shadow: 0 2px 16px rgba(0, 0, 0, 0.55);
      }
      .yccv-user {
        font-weight: 500;
      }
      .yccv-time,
      .yccv-row {
        color: #aaaaaa;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
      }
      .yccv-text {
        line-height: 1.35;
        overflow-wrap: break-word;
      }
      .yccv-text .yccv-ch {
        opacity: 0;
      }
      .yccv-row {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 500;
        opacity: 0;
      }
      .yccv-row svg {
        stroke: #aaaaaa;
        stroke-width: 2.4;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
        flex-shrink: 0;
      }
      .yccv-reply {
        margin-left: 18px;
      }
      
      
      #yccv-col {
        left: 150px;
        width: 780px;
      }
      #yccv-root.yccv-top #yccv-col {
        top: 180px;
      }
      #yccv-root.yccv-center #yccv-col {
        top: 770px;
        transform: translateY(-50%);
      }
      #yccv-root.yccv-bottom #yccv-col {
        bottom: 560px;
      }
      /* the comments fill the 780 field (montazher.md:22 "large, all the free space"): large; medium (-fit) when the
         large column would leave the field */
      #yccv-col {
        gap: 40px;
      }
      .yccv-card {
        gap: 28px;
      }
      .yccv-av {
        width: 112px;
        height: 112px;
        font-size: 50px;
      }
      .yccv-user,
      .yccv-time {
        font-size: 40px;
      }
      .yccv-text {
        margin-top: 6px;
        font-size: 54px;
        line-height: 1.2;
      }
      .yccv-row {
        margin-top: 12px;
        font-size: 36px;
      }
      .yccv-row svg {
        width: 40px;
        height: 40px;
      }
      #yccv-root.yccv-fit #yccv-col {
        gap: 20px;
      }
      #yccv-root.yccv-fit .yccv-card {
        gap: 24px;
      }
      #yccv-root.yccv-fit .yccv-av {
        width: 88px;
        height: 88px;
        font-size: 40px;
      }
      #yccv-root.yccv-fit .yccv-user,
      #yccv-root.yccv-fit .yccv-time {
        font-size: 34px;
      }
      #yccv-root.yccv-fit .yccv-text {
        font-size: 42px;
      }
      #yccv-root.yccv-fit .yccv-row {
        margin-top: 10px;
        font-size: 30px;
      }
      #yccv-root.yccv-fit .yccv-row svg {
        width: 32px;
        height: 32px;
      }
      
    </style>
  </head>
  <body>
    <div id="yccv-root" data-composition-id="yt-comment-card-vertical" data-width="1080" data-height="1920" data-start="0" data-duration="30">
      <div id="yccv-col"></div>
    </div>
    <script>
      (function () {
        var root = document.getElementById("yccv-root");
        var V =
          window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
            ? window.__hyperframes.getVariables()
            : {};
        function get(id, d) {
          var v = V[id];
          return typeof v === "string" ? v.trim() : d;
        }
        function oneOf(v, list, d) {
          return list.indexOf(v) >= 0 ? v : d;
        }
        
        var placement = oneOf(V.placement, ["top", "center", "bottom"], "center");
        root.classList.add("yccv-" + placement);
        /* the comments set large; when the column is taller than its field (760 on top / bottom, 1180 centred) they set
           medium. Measured once the face has loaded; render waits on buildReady (path-tracing.md:18) */
        window.__hf = window.__hf || {};
        window.__hf.buildReady = window.__hf.buildReady || {};
        window.__hf.buildReady["yt-comment-card-vertical-fit"] = Promise.all([
          // a Cyrillic, Latin and digit sample: every face the card sets (names, handle, likes) is waited for (FontFaceSet.load text argument)
          document.fonts.load('400 54px "Montserrat"', "Жж Aa 0"),
          document.fonts.load('500 40px "Montserrat"', "Жж Aa 0"),
        ]).then(function () {
          var col = document.getElementById("yccv-col");
          if (col.offsetHeight > (placement === "center" ? 1180 : 760)) root.classList.add("yccv-fit");
        });
        

        var DEF = [
          ["@pixelwaves", "2 дня назад", "Как ты это смонтировал так быстро?", "47"],
          ["@framerate", "1 день назад", "Графика как у больших каналов, жду разбор", "12"],
          ["", "", "", ""],
        ];
        var comments = [];
        for (var k = 1; k <= 3; k++) {
          var d = DEF[k - 1];
          var c = { user: get("user" + k, d[0]), time: get("time" + k, d[1]), text: get("text" + k, d[2]), likes: get("likes" + k, d[3]), avatar: get("avatar" + k, "") };
          if (c.user && c.text) comments.push(c);
        }
        var reply = get("replyLabel", "") || "Ответить";
        var THUMB = '<svg viewBox="0 0 24 24"><path d="M7 11v9M7 11l3.2-6.4a2 2 0 0 1 3.6 1.2V9h4.6a2 2 0 0 1 2 2.4l-1.2 6a2 2 0 0 1-2 1.6H7M7 11H4a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h3"/></svg>';
        /* YouTube's default avatars: a coloured circle with the first letter */
        var HUES = [210, 340, 150];

        var col = document.getElementById("yccv-col");
        var parts = comments.map(function (c, i) {
          var card = document.createElement("div");
          card.className = "yccv-card";
          var av = document.createElement("div");
          av.className = "yccv-av";
          if (c.avatar) {
            var img = document.createElement("img");
            img.src = c.avatar;
            av.appendChild(img);
          } else {
            av.textContent = c.user.replace(/^@/, "").charAt(0).toUpperCase() || "?";
            av.style.background = "linear-gradient(135deg, hsl(" + HUES[i] + ", 58%, 40%), hsl(" + (HUES[i] + 40) + ", 58%, 32%))";
          }
          card.appendChild(av);
          var body = document.createElement("div");
          body.className = "yccv-body";
          var meta = document.createElement("div");
          meta.className = "yccv-meta";
          var user = document.createElement("span");
          user.className = "yccv-user";
          user.textContent = c.user;
          var time = document.createElement("span");
          time.className = "yccv-time";
          time.textContent = c.time;
          meta.appendChild(user);
          meta.appendChild(time);
          body.appendChild(meta);
          var text = document.createElement("div");
          text.className = "yccv-text";
          var chars = Array.from(c.text).map(function (ch) {
            var s = document.createElement("span");
            s.className = "yccv-ch";
            s.textContent = ch;
            text.appendChild(s);
            return s;
          });
          body.appendChild(text);
          var row = document.createElement("div");
          row.className = "yccv-row";
          row.innerHTML = THUMB;
          var n = document.createElement("span");
          n.textContent = c.likes;
          var r = document.createElement("span");
          r.className = "yccv-reply";
          r.textContent = reply;
          row.appendChild(n);
          row.appendChild(r);
          body.appendChild(row);
          card.appendChild(body);
          col.appendChild(card);
          return { av: av, meta: meta, chars: chars, row: row };
        });

        var cues = String(V.cues || "")
          .split(",")
          .map(function (v) {
            return parseFloat(v);
          });
        var exit = oneOf(V.exit, ["none", "fade"], "none");
        var tl = gsap.timeline({ paused: true });
        /* each comment: avatar pops, handle fades, text types at most 2.2 s, like row fades; the next starts at its cue or right after */
        var t = isFinite(cues[0]) && cues[0] >= 0 ? cues[0] : 0.3;
        parts.forEach(function (p, i) {
          if (i > 0 && isFinite(cues[i]) && cues[i] >= t) t = cues[i];
          var next = isFinite(cues[i + 1]) ? cues[i + 1] : Infinity;
          var room = Math.max(0.4, Math.min(2.2, next - t - 1));
          var step = Math.min(0.024, room / Math.max(1, p.chars.length));
          tl.fromTo(p.av, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, t);
          tl.fromTo(p.meta, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, t + 0.12);
          t += 0.4;
          tl.to(p.chars, { opacity: 1, duration: 0.02, stagger: step, ease: "none" }, t);
          t += p.chars.length * step + 0.15;
          tl.to(p.row, { opacity: 1, duration: 0.35, ease: "power2.out" }, t);
          t += 0.5;
        });
        if (exit === "fade") tl.to(col, { opacity: 0, y: -18, duration: 0.4, ease: "power2.in" }, isFinite(cues[parts.length]) ? cues[parts.length] : t + 3);
        tl.set({}, {}, 30);
        window.__timelines = window.__timelines || {};
        window.__timelines["yt-comment-card-vertical"] = tl;
      })();
    </script>
  </body>
</html>
