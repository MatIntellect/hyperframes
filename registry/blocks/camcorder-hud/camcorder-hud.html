<!doctype html>
<html
  lang="ru"
  data-composition-variables='[
    { "id": "label", "type": "string", "role": "content", "label": "Record label", "description": "Word next to the red dot.", "maxLength": 8, "default": "REC" },
    { "id": "date", "type": "string", "role": "content", "label": "Date", "description": "Date corner, two lines separated by |.", "maxLength": 32, "default": "01 ЯНВ 2000|12:00" },
    { "id": "mode", "type": "string", "role": "content", "label": "Mode", "description": "Small line above the counter.", "maxLength": 12, "default": "SP · 16:9" },
    { "id": "counterStart", "type": "string", "role": "content", "label": "Counter start", "description": "Seconds the counter starts from.", "maxLength": 6, "default": "0" },
    { "id": "cues", "type": "string", "role": "timing", "label": "Cues", "description": "Comma-separated seconds from mount start: 1 the overlay fades out (only when exit is fade).", "default": "" },
    { "id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "none keeps the overlay and the running counter to the end of the mount.", "default": "none", "options": [{ "value": "none", "label": "Hold" }, { "value": "fade", "label": "Fade" }] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: transparent;
        overflow: hidden;
      }
      body {
        width: 1920px;
        height: 1080px;
      }
      #cch-root {
        position: absolute;
        inset: 0;
        color: var(--fg, #f2f2f2);
        font-family: var(--font-body, "Montserrat"), sans-serif;
        font-variant-numeric: tabular-nums;
        font-size: 40px;
        font-weight: 700;
        line-height: 1.25;
        -webkit-text-stroke: 1.3px rgb(0 0 0 / 92%);
        paint-order: stroke fill;
        text-shadow: 0 2px 6px rgb(0 0 0 / 90%);
      }
      .cch-c {
        position: absolute;
      }
      .cch-rec {
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .cch-dot {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: var(--accent, #ff0000);
        box-shadow: 0 0 10px color-mix(in srgb, var(--accent, #ff0000) 55%, transparent);
      }
      .cch-bat {
        width: 76px;
        height: 38px;
        border: 4px solid currentcolor;
      }
      .cch-bat::before {
        position: absolute;
        top: 7px;
        left: 7px;
        width: 50px;
        height: 16px;
        background: currentcolor;
        content: "";
      }
      .cch-bat::after {
        position: absolute;
        top: 7px;
        right: -12px;
        width: 8px;
        height: 16px;
        background: currentcolor;
        content: "";
      }
      .cch-cnt {
        text-align: right;
      }
      .cch-mode {
        display: block;
        margin-bottom: 8px;
        font-size: 28px;
      }
      
      .cch-rec {
        top: 54px;
        left: 54px;
      }
      .cch-bat {
        top: 54px;
        right: 66px;
      }
      .cch-date {
        bottom: 54px;
        left: 54px;
      }
      .cch-cnt {
        bottom: 54px;
        right: 54px;
      }
      
      
    </style>
  </head>
  <body>
    <div id="cch-root" data-composition-id="camcorder-hud" data-width="1920" data-height="1080" data-start="0" data-duration="30">
      <div id="cch-hud">
        <div class="cch-c cch-rec"><span class="cch-dot" id="cch-dot"></span><span id="cch-label"></span></div>
        <div class="cch-c cch-bat"></div>
        <div class="cch-c cch-date" id="cch-date"></div>
        <div class="cch-c cch-cnt"><span class="cch-mode" id="cch-mode"></span><span id="cch-counter">00:00:00</span></div>
      </div>
    </div>
    <script>
      (function () {
        var V =
          window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
            ? window.__hyperframes.getVariables()
            : {};
        function txt(v, d) {
          return typeof v === "string" && v.trim() ? v.trim() : d;
        }
        document.getElementById("cch-label").textContent = txt(V.label, "REC");
        var date = document.getElementById("cch-date");
        txt(V.date, "01 ЯНВ 2000|12:00")
          .split("|")
          .slice(0, 2)
          .forEach(function (t, i) {
            if (i) date.appendChild(document.createElement("br"));
            date.appendChild(document.createTextNode(t.trim()));
          });
        document.getElementById("cch-mode").textContent = txt(V.mode,  "SP · 16:9"  );
        var counter = document.getElementById("cch-counter");
        var dot = document.getElementById("cch-dot");
        var start = parseFloat(V.counterStart) || 0;
        var state = { s: 0 };
        function fmt(v) {
          var s = Math.max(0, Math.floor(v));
          return [Math.floor(s / 3600), Math.floor((s % 3600) / 60), s % 60]
            .map(function (p) {
              return String(p).padStart(2, "0");
            })
            .join(":");
        }
        function update() {
          counter.textContent = fmt(start + state.s);
          dot.style.opacity = Math.floor(state.s / 0.55) % 2 === 0 ? "1" : "0.25";
        }
        var cues = String(V.cues || "")
          .split(",")
          .map(function (v) {
            return parseFloat(v);
          });
        var tl = gsap.timeline({ paused: true });
        tl.to(state, { s: 30, duration: 30, ease: "none", onUpdate: update }, 0);
        update();
        if (V.exit === "fade") tl.to("#cch-hud", { opacity: 0, duration: 0.4, ease: "power2.in" }, isFinite(cues[0]) ? cues[0] : 6);
        window.__timelines = window.__timelines || {};
        window.__timelines["camcorder-hud"] = tl;
      })();
    </script>
  </body>
</html>
