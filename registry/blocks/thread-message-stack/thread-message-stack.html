<!doctype html>
<html
  lang="ru"
  data-composition-variables='[
    { "id": "thread", "type": "string", "role": "content", "label": "Messages", "description": "Messages separated by |, up to 8. A message starting with > is yours (right, blue); the others come in (left, light). Each wraps inside its bubble.", "maxLength": 420, "default": "Видел ролик? Как это вообще смонтировано|>Система собрала за шесть минут|Без монтажёра?|>Ни одного человека|Это нереально|>Уже делаем следующий" },
    { "id": "sender", "type": "string", "role": "content", "label": "Sender", "description": "Name above the first incoming message. Empty hides it.", "maxLength": 24, "default": "Аня" },
    { "id": "cues", "type": "string", "role": "timing", "label": "Cues", "description": "Comma-separated seconds from mount start: 1 the first message pops in, 2 the last one does (the rest spread evenly between), 3 the thread fades (only when exit is fade). Empty keeps 0.25 and 0.86 s between messages.", "default": "" },
    { "id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "none holds the thread to the end of the mount.", "default": "none", "options": [{ "value": "none", "label": "Hold" }, { "value": "fade", "label": "Fade" }] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: transparent;
        overflow: hidden;
      }
      body {
        width: 1920px;
        height: 1080px;
      }
      /* message bubbles keep the original block colours (blue yours, light theirs) and Inter for Russian letters; the ground is the brand */
      #tms-root {
        font-family: "Inter", sans-serif;
      }
      .tms-ground {
        position: absolute;
        inset: 0;
        background: var(--bg, #0c1014);
      }
      #tms-view {
        position: absolute;
      }
      .tms-row {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        opacity: 0;
      }
      .tms-in {
        align-items: flex-start;
      }
      .tms-out {
        align-items: flex-end;
      }
      .tms-sender {
        color: #ffffff;
        font-weight: 700;
        line-height: 1.1;
        text-shadow: 0 3px 12px rgba(0, 0, 0, 0.72);
      }
      .tms-bubble {
        font-weight: 500;
        letter-spacing: -0.015em;
        line-height: 1.3;
        overflow-wrap: anywhere;
      }
      .tms-in .tms-bubble {
        color: #101216;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.14), rgba(0, 0, 0, 0.05)), rgba(240, 240, 245, 0.92);
        box-shadow: 0 12px 34px rgba(0, 0, 0, 0.3);
        transform-origin: 0 100%;
      }
      .tms-out .tms-bubble {
        color: #ffffff;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.2), rgba(0, 0, 0, 0.17)), #2d89e1;
        box-shadow: 0 12px 38px rgba(0, 0, 0, 0.38);
        transform-origin: 100% 100%;
      }
      
      #tms-view {
        left: 115px;
        right: 115px;
        top: 0;
        bottom: 108px;
      }
      .tms-sender {
        font-size: 28px;
        padding: 0 18px 8px;
      }
      .tms-bubble {
        max-width: 920px;
        padding: 24px 38px;
        border-radius: 42px;
        font-size: 42px;
      }
      
      
    </style>
  </head>
  <body>
    <div id="tms-root" data-composition-id="thread-message-stack" data-width="1920" data-height="1080" data-start="0" data-duration="30">
      <div class="tms-ground"></div>
      <div id="tms-view"></div>
    </div>
    <script>
      (function () {
        var root = document.getElementById("tms-root");
        var V =
          window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
            ? window.__hyperframes.getVariables()
            : {};
        function oneOf(v, list, d) {
          return list.indexOf(v) >= 0 ? v : d;
        }
        

        var raw = typeof V.thread === "string" && V.thread.trim() ? V.thread : "Видел ролик? Как это вообще смонтировано|>Система собрала за шесть минут|Без монтажёра?|>Ни одного человека|Это нереально|>Уже делаем следующий";
        var sender = typeof V.sender === "string" ? V.sender.trim() : "Аня";
        var messages = raw
          .split("|")
          .map(function (t) {
            t = t.trim();
            var out = t.charAt(0) === ">";
            return { out: out, text: out ? t.slice(1).trim() : t };
          })
          .filter(function (m) {
            return m.text;
          })
          .slice(0, 8);

        var view = document.getElementById("tms-view");
        var named = false;
        var rows = messages.map(function (m) {
          var row = document.createElement("div");
          row.className = "tms-row " + (m.out ? "tms-out" : "tms-in");
          if (!m.out && sender && !named) {
            named = true;
            var s = document.createElement("div");
            s.className = "tms-sender";
            s.textContent = sender;
            row.appendChild(s);
          }
          var b = document.createElement("div");
          b.className = "tms-bubble";
          b.textContent = m.text;
          row.appendChild(b);
          view.appendChild(row);
          return row;
        });
        var GAP = 22;
        var heights = rows.map(function (r) {
          return r.offsetHeight + GAP;
        });

        var cues = String(V.cues || "")
          .split(",")
          .map(function (v) {
            return parseFloat(v);
          });
        var c0 = isFinite(cues[0]) && cues[0] >= 0 ? cues[0] : 0.25;
        var step = rows.length > 1 && isFinite(cues[1]) && cues[1] > c0 ? (cues[1] - c0) / (rows.length - 1) : 0.86;
        var exit = oneOf(V.exit, ["none", "fade"], "none");

        /* each new message pops in at the bottom and pushes the earlier ones up; a message that would cross the top of the view fades out as it is pushed */
        var viewH = view.clientHeight;
        var gone = [];
        var tl = gsap.timeline({ paused: true });
        rows.forEach(function (row, i) {
          var at = c0 + i * step;
          var dir = row.classList.contains("tms-in") ? -1 : 1;
          tl.fromTo(row, { x: dir * 34, scale: 0.94, opacity: 0 }, { x: 0, scale: 1, opacity: 1, duration: 0.28, ease: "back.out(1.45)" }, at);
          var lift = 0;
          for (var p = i - 1; p >= 0; p--) {
            lift += heights[p + 1];
            tl.to(rows[p], { y: -lift, duration: 0.24, ease: "power3.out" }, at);
            if (!gone[p] && lift + heights[p] - GAP > viewH) {
              gone[p] = true;
              tl.to(rows[p], { opacity: 0, duration: 0.2, ease: "power1.out" }, at);
            }
          }
        });
        /* the exit takes the whole block, ground included */
        if (exit === "fade") tl.to(root, { autoAlpha: 0, duration: 0.4, ease: "power2.in" }, isFinite(cues[2]) ? cues[2] : c0 + (rows.length - 1) * step + 3);
        tl.set({}, {}, 30);
        window.__timelines = window.__timelines || {};
        window.__timelines["thread-message-stack"] = tl;
      })();
    </script>
  </body>
</html>
