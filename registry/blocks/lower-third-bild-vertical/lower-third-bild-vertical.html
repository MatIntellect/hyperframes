<!doctype html>
<html
  lang="ru"
  data-composition-variables='[
    { "id": "placement", "type": "enum", "role": "layout", "label": "Placement", "description": "Overlay over footage, no ground, in the 780 column. bottom: the plate sits on y 1360, above the caption band. top: it hangs from y 180. center: centred on y 770.", "default": "bottom", "options": [{ "value": "bottom", "label": "Bottom" }, { "value": "top", "label": "Top" }, { "value": "center", "label": "Centre" }] },
    { "id": "headline", "type": "string", "role": "content", "label": "Headline", "description": "Bebas Neue on a light bar with a red offset shadow; long lines wrap, each line on its own bar.", "maxLength": 30, "default": "Монтаж без человека" },
    { "id": "sub", "type": "string", "role": "content", "label": "Sub line", "description": "Upper-case line on a red bar under the headline. Empty hides it.", "maxLength": 36, "default": "Эксклюзив MatIntellect" },
    { "id": "cues", "type": "string", "role": "timing", "label": "Cues", "description": "Comma-separated seconds from mount start: 1 the bars wipe in, 2 they wipe out (only when exit is out). Empty keeps 0.1, 4.5.", "default": "" },
    { "id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "none holds the plate to the end of the mount.", "default": "none", "options": [{ "value": "none", "label": "Hold" }, { "value": "out", "label": "Wipe out" }] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: transparent;
        overflow: hidden;
      }
      body {
        width: 1080px;
        height: 1920px;
      }
      #ltbv-plate {
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }
      /* each wrapped line gets its own tight bar and its own shadow */
      #ltbv-main,
      #ltbv-sub {
        -webkit-box-decoration-break: clone;
        box-decoration-break: clone;
        text-transform: uppercase;
      }
      #ltbv-mainwrap,
      #ltbv-subwrap {
        clip-path: inset(-20px 100% -20px 0);
      }
      #ltbv-main {
        font-family: var(--font-display, "Bebas Neue"), sans-serif;
        font-weight: 700;
        line-height: 1.12;
        letter-spacing: 0.02em;
        color: var(--bg, #0c1014);
        background: var(--fg, #f2f2f2);
        box-shadow: 12px 12px 0 0 var(--accent, #ff0000);
      }
      #ltbv-sub {
        font-family: var(--font-body, "Montserrat"), sans-serif;
        font-weight: 700;
        line-height: 1.5;
        letter-spacing: 0.04em;
        color: var(--fg, #f2f2f2);
        background: var(--accent, #ff0000);
        box-shadow: 8px 8px 0 0 var(--fg, #f2f2f2);
      }
      
      
      #ltbv-plate {
        left: 150px;
        width: 760px;
        gap: 24px;
        align-items: center;
        text-align: center;
      }
      #ltbv-root.ltbv-bottom #ltbv-plate {
        bottom: 572px;
      }
      #ltbv-root.ltbv-top #ltbv-plate {
        top: 180px;
      }
      #ltbv-root.ltbv-center #ltbv-plate {
        top: 770px;
        transform: translateY(-50%);
      }
      #ltbv-main {
        font-size: 104px;
        padding: 4px 20px 0;
      }
      #ltbv-sub {
        font-size: 34px;
        padding: 4px 16px;
      }
      
    </style>
  </head>
  <body>
    <div id="ltbv-root" data-composition-id="lower-third-bild-vertical" data-width="1080" data-height="1920" data-start="0" data-duration="30">
      <div id="ltbv-plate">
        <div id="ltbv-mainwrap"><span id="ltbv-main">Монтаж без человека</span></div>
        <div id="ltbv-subwrap"><span id="ltbv-sub">Эксклюзив MatIntellect</span></div>
      </div>
    </div>
    <script>
      (function () {
        var root = document.getElementById("ltbv-root");
        var V =
          window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
            ? window.__hyperframes.getVariables()
            : {};
        function oneOf(v, list, d) {
          return list.indexOf(v) >= 0 ? v : d;
        }
        
        root.classList.add("ltbv-" + oneOf(V.placement, ["bottom", "top", "center"], "bottom"));
        
        var main = typeof V.headline === "string" && V.headline.trim() ? V.headline.trim() : "Монтаж без человека";
        var sub = typeof V.sub === "string" ? V.sub.trim() : "Эксклюзив MatIntellect";
        document.getElementById("ltbv-main").textContent = main;
        if (sub) document.getElementById("ltbv-sub").textContent = sub;
        else document.getElementById("ltbv-subwrap").remove();

        var cues = String(V.cues || "")
          .split(",")
          .map(function (v) {
            return parseFloat(v);
          });
        var c0 = isFinite(cues[0]) && cues[0] >= 0 ? cues[0] : 0.1;
        var exit = oneOf(V.exit, ["none", "out"], "none");
        var wraps = sub ? ["#ltbv-mainwrap", "#ltbv-subwrap"] : ["#ltbv-mainwrap"];
        var tl = gsap.timeline({ paused: true });
        tl.to(wraps, { clipPath: "inset(-20px -4% -20px 0)", duration: 0.45, stagger: 0.14, ease: "power3.out" }, c0);
        /* the wipe closes past the shadow edge, so nothing of the plate is left */
        if (exit === "out") tl.to(wraps.slice().reverse(), { clipPath: "inset(-20px -4% -20px 104%)", duration: 0.3, stagger: 0.08, ease: "power3.in" }, isFinite(cues[1]) ? cues[1] : c0 + 4.4);
        tl.set({}, {}, 30);
        window.__timelines = window.__timelines || {};
        window.__timelines["lower-third-bild-vertical"] = tl;
      })();
    </script>
  </body>
</html>
