<!doctype html>
<!--
  Exploded Stack: isometric layer plates sit as one stack, explode apart along the vertical
  axis with labels drawing in beside each layer, then hold or collapse back.
  Seek-safe: every frame is render(t), driven by one linear GSAP clock.
-->
<html
  lang="ru"
  data-composition-variables='[
    { "id": "title", "type": "string", "role": "content", "label": "Title", "description": "Title, Bebas Neue. Empty hides it.", "default": "Как идёт запрос", "maxLength": 32 },
    { "id": "layer_1", "type": "string", "role": "content", "label": "Top layer", "default": "Интерфейс", "maxLength": 22 },
    { "id": "layer_2", "type": "string", "role": "content", "label": "Layer 2", "default": "API-шлюз", "maxLength": 22 },
    { "id": "layer_3", "type": "string", "role": "content", "label": "Layer 3", "default": "Сервисы", "maxLength": 22 },
    { "id": "layer_4", "type": "string", "role": "content", "label": "Bottom layer", "default": "Данные", "maxLength": 22 },
    { "id": "cues", "type": "string", "role": "timing", "label": "Cues", "description": "Comma-separated seconds from mount start: 1 the plates explode apart (the labels land 0.95 s later, one every 0.7 s, each lighting its layer red), 2 the stack collapses or fades (only when exit is collapse or fade). Empty keeps 0.3 and 4.05.", "default": "" },
    { "id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "none holds the exploded stack with its labels to the end of the mount; collapse closes it back into one stack, as in the native block; fade fades it out.", "default": "none", "options": [{ "value": "none", "label": "Hold" }, { "value": "collapse", "label": "Collapse" }, { "value": "fade", "label": "Fade" }] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
      }
      #exs-root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        font-family: var(--font-body, "Montserrat"), sans-serif;
      }
      #exs-ground {
        position: absolute;
        inset: 0;
        background: var(--bg, #0c1014);
      }
      #exs-canvas,
      #exs-leaders {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        display: block;
      }
      #exs-title {
        position: absolute;
        font-family: var(--font-display, "Bebas Neue"), sans-serif;
        font-weight: 700;
        line-height: 1;
        text-transform: uppercase;
        color: var(--fg, #f2f2f2);
      }
      .exs-label {
        position: absolute;
        left: 0;
        top: 0;
        display: flex;
        align-items: center;
        gap: 18px;
        font-size: 34px;
        font-weight: 500;
        line-height: 1.15;
        color: var(--fg, #f2f2f2);
        white-space: nowrap;
        opacity: 0;
      }
      .exs-index {
        flex: none;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }
      #exs-leaders line {
        stroke: color-mix(in srgb, var(--fg, #f2f2f2) 35%, transparent);
        stroke-width: 2;
      }
      
      #exs-title {
        left: 120px;
        top: 110px;
        font-size: 96px;
        white-space: nowrap;
      }
      
      
    </style>
  </head>
  <body>
    <div id="exs-root" data-composition-id="exploded-stack" data-start="0" data-duration="30" data-width="1920" data-height="1080">
      <div id="exs-ground"></div>
      <canvas id="exs-canvas" class="clip" data-start="0" data-duration="30" data-track-index="1"></canvas>
      <svg id="exs-leaders" viewBox="0 0 1920 1080" aria-hidden="true"></svg>
      <div id="exs-title"></div>
      <div id="exs-labels"></div>
    </div>

    <script>
      (function () {
        var V =
          (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
        function txt(v, d) {
          return typeof v === "string" ? v.trim() : d;
        }
        var root = document.getElementById("exs-root");
        
        var title = document.getElementById("exs-title");
        title.textContent = txt(V.title, "Как идёт запрос");
        if (!title.textContent) title.style.display = "none";

        var names = [V.layer_1, V.layer_2, V.layer_3, V.layer_4].map(function (n, i) {
          return txt(n, "") || ["Интерфейс", "API-шлюз", "Сервисы", "Данные"][i];
        });
        var labels = document.getElementById("exs-labels");
        var leaders = document.getElementById("exs-leaders");
        var svg = "http://www.w3.org/2000/svg";
        names.forEach(function (name, i) {
          var el = document.createElement("div");
          el.className = "exs-label";
          el.innerHTML = '<span class="exs-index">0' + (i + 1) + "</span><span></span>";
          el.lastChild.textContent = name;
          labels.appendChild(el);
          var line = document.createElementNS(svg, "line");
          var dot = document.createElementNS(svg, "circle");
          dot.setAttribute("r", "6");
          leaders.appendChild(line);
          leaders.appendChild(dot);
        });

        // цвета темы – в виде rgb(), так их понимает three.js
        function color(name, d) {
          var probe = document.createElement("i");
          probe.style.color = getComputedStyle(root).getPropertyValue(name).trim() || d;
          root.appendChild(probe);
          var c = getComputedStyle(probe).color;
          probe.remove();
          return c;
        }
        var cues = String(V.cues || "")
          .split(",")
          .map(parseFloat);
        var open = isFinite(cues[0]) && cues[0] >= 0 ? cues[0] : 0.3;
        var exit = ["none", "collapse", "fade"].indexOf(V.exit) >= 0 ? V.exit : "none";
        var close = isFinite(cues[1]) && cues[1] > open ? cues[1] : open + 3.75;

        var clock = { t: 0 };
        var scene = {
          names: names,
          clock: clock,
          open: open,
          close: exit === "collapse" ? close : Infinity,
          colors: {
            surface: color("--surface", "#18181a"),
            border: color("--border", "#2e2e32"),
            muted: color("--muted", "#8a8a90"),
            accent: color("--accent", "#ff0000"),
          },
          card: root.classList.contains("exs-card"),
          bottom: root.classList.contains("exs-bottom"),
          render: null,
        };
        window.exsStack = scene;
        window.__hf = window.__hf || {};
        window.__hf.buildReady = window.__hf.buildReady || {};
        window.__hf.buildReady["exploded-stack"] = new Promise(function (resolve) {
          scene.ready = resolve;
        });

        var tl = gsap.timeline({ paused: true });
        tl.to(clock, {
          t: 30,
          duration: 30,
          ease: "none",
          onUpdate: function () {
            if (scene.render) scene.render(clock.t);
          },
        });
        if (exit === "fade") tl.to(root, { opacity: 0, duration: 0.5, ease: "power2.in" }, close);
        window.__timelines = window.__timelines || {};
        window.__timelines["exploded-stack"] = tl;
      })();
    </script>

    <script type="module">
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.184.0/+esm";
      import { RoundedBoxGeometry } from "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/geometries/RoundedBoxGeometry.js/+esm";

      const host = window.exsStack;
      const C = host.colors;
      const accent = new THREE.Color(C.accent);
      const W = 1920,
        H = 1080;

      const renderer = new THREE.WebGLRenderer({
        canvas: document.getElementById("exs-canvas"),
        antialias: true,
        alpha: true,
        preserveDrawingBuffer: true,
      });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      const scene = new THREE.Scene();
      // True isometric: orthographic, 45 degrees around Y, arctan(1/sqrt 2) down.
      
      const view = 5.9;
      const camera = new THREE.OrthographicCamera((-view * 16) / 9, (view * 16) / 9, view, -view, 0.1, 100);
      camera.position.set(10, 10.7, 10);
      camera.lookAt(0, 0.7, 0);
      // Slide along the camera's right axis so the stack sits left and labels get the right.
      camera.position.add(new THREE.Vector3(1.9, 0, -1.9));
      camera.updateMatrixWorld();
      
      

      scene.add(new THREE.HemisphereLight(0xffffff, 0xd6d9e4, 2.2));
      const sun = new THREE.DirectionalLight(0xffffff, 1.4);
      sun.position.set(-4, 10, 6);
      scene.add(sun);

      const texture = (c) => {
        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
        return tex;
      };
      // Brand card face with a hairline where the flat top meets the rounded edge.
      function faceTexture() {
        const c = document.createElement("canvas");
        c.width = c.height = 512;
        const g = c.getContext("2d");
        g.fillStyle = C.surface;
        g.fillRect(0, 0, 512, 512);
        g.strokeStyle = C.border;
        g.lineWidth = 3;
        g.strokeRect(1.5, 1.5, 509, 509);
        return texture(c);
      }
      // White glyphs on transparent; the material colour tints them per frame.
      function glyphTexture(i) {
        const c = document.createElement("canvas");
        c.width = c.height = 512;
        const g = c.getContext("2d");
        g.strokeStyle = g.fillStyle = "#ffffff";
        g.lineWidth = 6;
        // Each layer gets its own motif, so the plates read as different systems.
        if (i === 0) {
          for (let k = 0; k < 3; k++) g.strokeRect(70 + k * 130, 150, 110, 212);
        } else if (i === 1) {
          for (let k = 0; k < 5; k++) {
            g.beginPath();
            g.moveTo(80, 110 + k * 72);
            g.lineTo(432, 110 + k * 72);
            g.stroke();
          }
        } else if (i === 2) {
          for (let y = 0; y < 3; y++) for (let x = 0; x < 3; x++) g.fillRect(96 + x * 120, 96 + y * 120, 80, 80);
        } else {
          for (let k = 0; k < 3; k++) {
            g.beginPath();
            g.ellipse(256, 150 + k * 100, 150, 40, 0, 0, Math.PI * 2);
            g.stroke();
          }
        }
        return texture(c);
      }

      const LAYERS = 4;
      const THICK = 0.22;
      
      const GAP = 1.55;
      
      
      const edge = new THREE.MeshStandardMaterial({ color: new THREE.Color(C.border), roughness: 0.6 });
      const shadowCanvas = document.createElement("canvas");
      shadowCanvas.width = shadowCanvas.height = 256;
      const sg = shadowCanvas.getContext("2d");
      const sgrad = sg.createRadialGradient(128, 128, 40, 128, 128, 128);
      sgrad.addColorStop(0, "rgba(0,0,0,0.45)");
      sgrad.addColorStop(1, "rgba(0,0,0,0)");
      sg.fillStyle = sgrad;
      sg.fillRect(0, 0, 256, 256);
      const shadow = new THREE.Mesh(
        new THREE.PlaneGeometry(7, 7),
        new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(shadowCanvas), transparent: true, depthWrite: false }),
      );
      shadow.rotation.x = -Math.PI / 2;
      shadow.position.y = -2.4;
      scene.add(shadow);
      const top = new THREE.MeshStandardMaterial({ map: faceTexture(), roughness: 0.7 });
      const plates = [];
      const glyphs = [];
      for (let i = 0; i < LAYERS; i++) {
        const plate = new THREE.Mesh(new RoundedBoxGeometry(4.2, THICK, 4.2, 4, 0.08), edge);
        // 4.04 = the flat top inside the 0.08 rounded edge.
        const face = new THREE.Mesh(new THREE.PlaneGeometry(4.04, 4.04), top);
        face.rotation.x = -Math.PI / 2;
        face.position.y = THICK / 2 + 0.002;
        const glyph = new THREE.MeshStandardMaterial({ map: glyphTexture(i), roughness: 0.7, transparent: true, depthWrite: false });
        const motif = new THREE.Mesh(new THREE.PlaneGeometry(4.04, 4.04), glyph);
        motif.rotation.x = -Math.PI / 2;
        motif.position.y = THICK / 2 + 0.004;
        plate.add(face, motif);
        scene.add(plate);
        plates.push(plate);
        glyphs.push(glyph);
      }

      // Native beats in seconds; the clock is shifted so the explosion starts at the first cue.
      const OPEN_AT = 0.3,
        OPEN_FOR = 0.9,
        OPEN_STAGGER = 0.06;
      const LAND_AT = 1.25,
        LAND_EVERY = 0.7,
        DRAW = 0.3,
        FULL = 0.4,
        SETTLE = 0.3;
      const CLOSE_AT = host.close - host.open + OPEN_AT;
      const CLOSE_FOR = 0.6,
        CLOSE_STAGGER = 0.05,
        LIFT = 0.08;
      const clamp01 = (x) => Math.min(1, Math.max(0, x));
      const ease = (x) => {
        const u = clamp01(x);
        return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
      };
      const easeOut = (x) => 1 - Math.pow(1 - clamp01(x), 3);
      const easeOpen = (x) => easeOut(Math.pow(clamp01(x), 1.4));
      const focus = (T, i) => {
        const land = LAND_AT + i * LAND_EVERY;
        return easeOut((T - land + DRAW) / DRAW) * (1 - ease((T - land - FULL) / SETTLE));
      };
      const GLYPH_REST = new THREE.Color(C.muted);
      const INK_REST = new THREE.Color(C.muted);
      const ink = new THREE.Color();

      const labelEls = [...document.querySelectorAll(".exs-label")];
      const indexEls = [...document.querySelectorAll(".exs-index")];
      const lines = [...document.querySelectorAll("#exs-leaders line")];
      const dots = [...document.querySelectorAll("#exs-leaders circle")];
      const anchor = new THREE.Vector3();
      const toScreen = (v) => {
        const p = v.clone().project(camera);
        return [(p.x * 0.5 + 0.5) * W, (-p.y * 0.5 + 0.5) * H];
      };
      

      host.render = (t) => {
        const T = t - host.open + OPEN_AT;
        for (let i = 0; i < LAYERS; i++) {
          // Bottom plate stays put; the top plate travels furthest and leaves first.
          const order = LAYERS - 1 - i;
          const open = easeOpen((T - OPEN_AT - i * OPEN_STAGGER) / OPEN_FOR) - ease((T - CLOSE_AT - 0.05 - order * CLOSE_STAGGER) / CLOSE_FOR);
          const w = focus(T, i);
          const y = order * (THICK + 0.02 + open * GAP) - 2.2 + LIFT * w;
          plates[i].position.y = y;
          glyphs[i].color.copy(GLYPH_REST).lerp(accent, w);
          const inkHex = `#${ink.copy(INK_REST).lerp(accent, w).getHexString()}`;
          indexEls[i].style.color = inkHex;
          dots[i].style.fill = inkHex;

          const shown = easeOut((T - LAND_AT - i * LAND_EVERY + DRAW) / DRAW) * (1 - clamp01((T - CLOSE_AT) / 0.2));
          // The plate's right-hand corner, where a label has open space beside it.
          anchor.set(2.1, y, -2.1);
          const [ax, ay] = toScreen(anchor);
          const reach =  90  ;
          const lx = ax + reach;
          labelEls[i].style.opacity = shown.toFixed(3);
          
          // Whole pixels: a fractional offset rasterises text differently by frame order.
          labelEls[i].style.transform = `translate(${Math.round(lx + 24 + (1 - shown) * 16)}px, ${Math.round(ay)}px) translateY(-50%)`;
          lines[i].setAttribute("x1", ax.toFixed(1));
          lines[i].setAttribute("y1", ay.toFixed(1));
          lines[i].setAttribute("x2", (ax + reach * shown).toFixed(1));
          lines[i].setAttribute("y2", ay.toFixed(1));
          lines[i].style.opacity = shown > 0 ? 1 : 0;
          dots[i].setAttribute("cx", ax.toFixed(1));
          dots[i].setAttribute("cy", ay.toFixed(1));
          dots[i].style.opacity = shown.toFixed(3);
        }
        renderer.render(scene, camera);
      };
      host.render(host.clock.t);
      host.ready();
    </script>
  </body>
</html>
