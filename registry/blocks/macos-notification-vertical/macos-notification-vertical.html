<!doctype html>
<html
  lang="ru"
  data-composition-variables='[
    { "id": "placement", "type": "enum", "role": "layout", "label": "Placement", "description": "Overlay over footage, no ground, centred on the frame. top: the banner hangs from y 180. center: centred on y 770. bottom: the banner sits on y 1360, above the caption band.", "default": "top", "options": [{ "value": "top", "label": "Top" }, { "value": "center", "label": "Centre" }, { "value": "bottom", "label": "Bottom" }] },
    { "id": "appName", "type": "string", "role": "content", "label": "App name", "description": "Small grey app name, upper case as macOS writes it.", "maxLength": 16, "default": "MatIntellect" },
    { "id": "icon", "type": "image", "role": "content", "label": "App icon", "description": "Square app icon, rounded like macOS.", "default": "assets/img/matintellect-avatar.svg" },
    { "id": "time", "type": "string", "role": "content", "label": "Time", "description": "Grey time on the right.", "maxLength": 10, "default": "сейчас" },
    { "id": "title", "type": "string", "role": "content", "label": "Title", "description": "Bold first line.", "maxLength": 28, "default": "Ролик готов" },
    { "id": "body", "type": "string", "role": "content", "label": "Body", "description": "Grey text under the title, up to three lines.", "maxLength": 90, "default": "Монтаж, графика и субтитры собраны. Файл уже в ветке «Видео»" },
    { "id": "cues", "type": "string", "role": "timing", "label": "Cues", "description": "Comma-separated seconds from mount start: 1 the banner slides in from the right, 2 it slides back out (only when exit is out). Empty keeps 0.2, 4.2.", "default": "" },
    { "id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "none holds the banner to the end of the mount.", "default": "none", "options": [{ "value": "none", "label": "Hold" }, { "value": "out", "label": "Slide out" }] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: transparent;
        overflow: hidden;
      }
      body {
        width: 1080px;
        height: 1920px;
      }
      /* the macOS banner is drawn at its own size and scaled whole, so the 13 px body lands on 28 px */
      #mnov-root {
        font-family: "Montserrat", sans-serif;
      }
      #mnov-scale {
        position: absolute;
        transform: scale(2.155);
      }
      #mnov-card {
        background: rgba(30, 30, 30, 0.82);
        border-radius: 16px;
        padding: 16px;
        box-shadow:
          0 8px 32px rgba(0, 0, 0, 0.4),
          inset 0 0 0 0.5px rgba(255, 255, 255, 0.1);
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }
      #mnov-icon {
        width: 36px;
        height: 36px;
        border-radius: 8px;
        flex-shrink: 0;
        object-fit: cover;
      }
      #mnov-content {
        flex: 1;
        min-width: 0;
      }
      #mnov-headrow {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin-bottom: 2px;
      }
      #mnov-app {
        font-size: 13px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.5);
        text-transform: uppercase;
        letter-spacing: 0.02em;
        white-space: nowrap;
      }
      #mnov-time {
        font-size: 13px;
        color: rgba(255, 255, 255, 0.55);
        white-space: nowrap;
      }
      #mnov-title {
        font-size: 15px;
        font-weight: 600;
        color: #ffffff;
        line-height: 1.3;
        margin-bottom: 2px;
        overflow-wrap: break-word;
      }
      #mnov-body {
        font-size: 13px;
        color: rgba(255, 255, 255, 0.6);
        line-height: 1.35;
        overflow-wrap: break-word;
      }
      
      
      /* 362 x 2.155 = 780 px wide, centred on x 540 */
      #mnov-scale {
        left: 150px;
        width: 362px;
        transform-origin: top left;
      }
      #mnov-root.mnov-top #mnov-scale {
        top: 180px;
      }
      #mnov-root.mnov-center #mnov-scale {
        top: 770px;
        transform-origin: left center;
        translate: 0 -50%;
      }
      #mnov-root.mnov-bottom #mnov-scale {
        bottom: 560px;
        transform-origin: bottom left;
      }
      
    </style>
  </head>
  <body>
    <div id="mnov-root" data-composition-id="macos-notification-vertical" data-width="1080" data-height="1920" data-start="0" data-duration="30">
      <div id="mnov-scale">
        <div id="mnov-card">
          <img id="mnov-icon" src="assets/img/matintellect-avatar.svg" alt="" />
          <div id="mnov-content">
            <div id="mnov-headrow">
              <span id="mnov-app">MatIntellect</span>
              <span id="mnov-time">сейчас</span>
            </div>
            <div id="mnov-title">Ролик готов</div>
            <div id="mnov-body">Монтаж, графика и субтитры собраны. Файл уже в ветке «Видео»</div>
          </div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var root = document.getElementById("mnov-root");
        var V =
          window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
            ? window.__hyperframes.getVariables()
            : {};
        function str(v, d) {
          return typeof v === "string" && v.trim() ? v.trim() : d;
        }
        function oneOf(v, list, d) {
          return list.indexOf(v) >= 0 ? v : d;
        }
        
        root.classList.add("mnov-" + oneOf(V.placement, ["top", "center", "bottom"], "top"));
        
        document.getElementById("mnov-app").textContent = str(V.appName, "MatIntellect");
        document.getElementById("mnov-icon").src = str(V.icon, "assets/img/matintellect-avatar.svg");
        document.getElementById("mnov-time").textContent = str(V.time, "сейчас");
        document.getElementById("mnov-title").textContent = str(V.title, "Ролик готов");
        document.getElementById("mnov-body").textContent = str(V.body, "Монтаж, графика и субтитры собраны. Файл уже в ветке «Видео»");

        var cues = String(V.cues || "")
          .split(",")
          .map(function (v) {
            return parseFloat(v);
          });
        var c0 = isFinite(cues[0]) && cues[0] >= 0 ? cues[0] : 0.2;
        var exit = oneOf(V.exit, ["none", "out"], "none");
        /* macOS slides the banner in from the right screen edge; in the vertical version a short slide keeps it off the frame edge */
        var SLIDE = 420;
        
        SLIDE = 40;
        
        var card = document.getElementById("mnov-card");
        var tl = gsap.timeline({ paused: true });
        tl.fromTo(card, { x: SLIDE, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, c0);
        if (exit === "out") tl.to(card, { x: SLIDE, opacity: 0, duration: 0.3, ease: "power3.in" }, isFinite(cues[1]) ? cues[1] : c0 + 4);
        tl.set({}, {}, 30);
        window.__timelines = window.__timelines || {};
        window.__timelines["macos-notification-vertical"] = tl;
      })();
    </script>
  </body>
</html>
