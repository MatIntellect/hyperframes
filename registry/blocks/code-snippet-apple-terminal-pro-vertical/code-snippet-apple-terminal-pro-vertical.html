<!doctype html>
<html
  lang="ru"
  data-composition-variables='[
    { "id": "placement", "type": "enum", "role": "layout", "label": "Placement", "description": "full: own ground, the window in the 780 field (y 270-1270). top / bottom: the window alone, 780x760 at y 180-940 / 600-1360, rest of the frame transparent.", "default": "full", "options": [{ "value": "full", "label": "Full screen" }, { "value": "top", "label": "Top" }, { "value": "bottom", "label": "Bottom" }] },
    { "id": "title", "type": "string", "role": "content", "label": "Window title", "description": "Title in the window bar.", "maxLength": 30, "default": "bash — 80×24" },
    { "id": "header", "type": "string", "role": "content", "label": "Header", "description": "Dim line already on screen above the prompt. Empty hides it. Up to 42 characters.", "maxLength": 42, "default": "Last login: Mon Jun 2 on ttys008" },
    { "id": "prompt", "type": "string", "role": "content", "label": "Prompt", "description": "Prompt before the command, green.", "maxLength": 18, "default": "user@Mac myapp %" },
    { "id": "command", "type": "string", "role": "content", "label": "Command", "description": "Command typed after the prompt, up to 24 characters.", "maxLength": 24, "default": "npm run build" },
    { "id": "output", "type": "string", "role": "content", "label": "Output", "description": "Output lines, one per line, up to 12 lines of 42 characters. A line starting with ! is green and bold, with ~ is dim, with * is white and bold.", "maxLength": 520, "default": "~Building production bundle...\nvite v5.3.1 building for production\n✓ 142 modules transformed.\ndist/index.html             0.48 kB\ndist/assets/index.js      284.12 kB\ndist/assets/index.css      42.08 kB\n!✓ built in 2.31s" },
    { "id": "cues", "type": "string", "role": "timing", "label": "Cues", "description": "Comma-separated seconds from mount start: 1 typing starts (it takes 1.5 s), 2 the output starts, 3 the window fades out (only when exit is fade). Empty keeps 0.5 and 2.3.", "default": "" },
    { "id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "none holds the last frame to the end of the mount.", "default": "none", "options": [{ "value": "none", "label": "Hold" }, { "value": "fade", "label": "Fade" }] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=block" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: transparent;
        overflow: hidden;
      }
      body {
        width: 1080px;
        height: 1920px;
      }
      #atpv-root {
        position: absolute;
        inset: 0;
        font-family: "JetBrains Mono", monospace;
      }
      .atpv-ground {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center, var(--surface, #18181a) 0%, var(--bg, #0c1014) 70%);
      }
      #atpv-win {
        position: absolute;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
        display: flex;
        flex-direction: column;
        background: #000000;
      }
      .atpv-bar {
        height: 56px;
        flex: none;
        background: #1c1c1c;
        border-bottom: 1px solid #333333;
        display: flex;
        align-items: center;
        padding: 0 18px;
        position: relative;
      }
      .atpv-lights {
        display: flex;
        gap: 10px;
      }
      .atpv-lights span {
        width: 16px;
        height: 16px;
        border-radius: 50%;
      }
      .atpv-title {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        font-family: "Montserrat", sans-serif;
        font-weight: 500;
        font-size: 28px;
        color: #bbbbbb;
        white-space: nowrap;
      }
      #atpv-canvas {
        flex: 1;
        padding: 22px 24px;
        font-size: 28px;
        line-height: 42px;
        color: #bbbbbb;
        overflow: hidden;
      }
      .atpv-l {
        display: block;
        white-space: pre;
        min-height: 42px;
      }
      .atpv-dim {
        color: #666666;
      }
      .atpv-acc {
        color: #88ff67;
        font-weight: 700;
      }
      .atpv-bold {
        color: #ffffff;
        font-weight: 700;
      }
      .atpv-prompt {
        color: #88ff67;
        font-weight: 700;
      }
      .atpv-cur {
        display: inline-block;
        width: 17px;
        height: 32px;
        background: #88ff67;
        vertical-align: -6px;
        margin-left: 2px;
      }
      .atpv-ch {
        display: none;
      }
      
      
      #atpv-win {
        left: 150px;
        width: 780px;
        top: 270px;
        height: 1000px;
      }
      #atpv-root.atpv-top #atpv-win {
        top: 180px;
        height: 760px;
      }
      #atpv-root.atpv-bottom #atpv-win {
        top: 600px;
        height: 760px;
      }
      #atpv-canvas {
        padding: 20px 18px;
      }
      
    </style>
  </head>
  <body>
    <div id="atpv-root" data-composition-id="code-snippet-apple-terminal-pro-vertical" data-width="1080" data-height="1920" data-start="0" data-duration="30">
      <div class="atpv-ground"></div>
      <div id="atpv-win">
        <div class="atpv-bar">
          <div class="atpv-lights">
            <span style="background: #ff5f57; border: 1px solid #e0443e"></span>
            <span style="background: #ffbd2e; border: 1px solid #dfa123"></span>
            <span style="background: #28c840; border: 1px solid #1aab29"></span>
          </div>
          <span class="atpv-title" id="atpv-title"></span>
        </div>
        <div id="atpv-canvas"></div>
      </div>
    </div>
    <script>
      (function () {
        var root = document.getElementById("atpv-root");
        var canvas = document.getElementById("atpv-canvas");
        var V =
          window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
            ? window.__hyperframes.getVariables()
            : {};
        function oneOf(v, list, d) {
          return list.indexOf(v) >= 0 ? v : d;
        }
        function txt(v, d) {
          return typeof v === "string" ? v : d;
        }
        var D = {
          
          
          header: "Last login: Mon Jun 2 on ttys008",
          output:
            "~Building production bundle...\nvite v5.3.1 building for production\n✓ 142 modules transformed.\ndist/index.html             0.48 kB\ndist/assets/index.js      284.12 kB\ndist/assets/index.css      42.08 kB\n!✓ built in 2.31s",
          
        };
        
        var placement = oneOf(V.placement, ["full", "top", "bottom"], "full");
        root.classList.add("atpv-" + placement);
        if (placement !== "full") root.querySelector(".atpv-ground").remove();
        
        document.getElementById("atpv-title").textContent = txt(V.title, "bash — 80×24");
        var header = txt(V.header, D.header).trim();
        var prompt = (txt(V.prompt, "user@Mac myapp %").trim() || "user@Mac myapp %") + " ";
        var command = txt(V.command, "npm run build").trim() || "npm run build";
        var output = (typeof V.output === "string" && V.output.trim() ? V.output : D.output).replace(/\r/g, "").split("\n");

        function line(cls, text) {
          var el = document.createElement("span");
          el.className = "atpv-l" + (cls ? " atpv-" + cls : "");
          if (text !== undefined) el.textContent = text;
          canvas.appendChild(el);
          return el;
        }
        if (header) line("dim", header);
        // строка команды: подсказка, буквы команды по одной, курсор
        var cmdLine = line("");
        var p = document.createElement("span");
        p.className = "atpv-prompt";
        p.textContent = prompt;
        cmdLine.appendChild(p);
        var letters = command.split("").map(function (ch) {
          var s = document.createElement("span");
          s.className = "atpv-ch";
          s.textContent = ch;
          cmdLine.appendChild(s);
          return s;
        });
        var cur1 = document.createElement("span");
        cur1.className = "atpv-cur";
        cmdLine.appendChild(cur1);
        var outEls = output.map(function (t) {
          var k = t.charAt(0);
          var cls = k === "!" ? "acc" : k === "~" ? "dim" : k === "*" ? "bold" : "";
          var el = line(cls, cls ? t.slice(1) : t);
          el.style.visibility = "hidden";
          return el;
        });
        var last = line("");
        last.style.visibility = "hidden";
        var p2 = p.cloneNode(true);
        last.appendChild(p2);
        var cur2 = document.createElement("span");
        cur2.className = "atpv-cur";
        last.appendChild(cur2);

        var cues = String(V.cues || "")
          .split(",")
          .map(function (v) {
            return parseFloat(v);
          });
        var c0 = isFinite(cues[0]) && cues[0] >= 0 ? cues[0] : 0.5;
        var per = 1.5 / letters.length;
        var cO = isFinite(cues[1]) && cues[1] > c0 ? cues[1] : c0 + 1.8;
        var exit = oneOf(V.exit, ["none", "fade"], "none");

        var tl = gsap.timeline({ paused: true });
        letters.forEach(function (s, i) {
          tl.set(s, { display: "inline" }, c0 + i * per);
        });
        tl.set(cur1, { opacity: 0 }, cO - 0.1);
        outEls.forEach(function (el, i) {
          tl.set(el, { visibility: "visible" }, cO + 0.1 * i);
        });
        var tEnd = cO + 0.1 * outEls.length + 0.3;
        tl.set(last, { visibility: "visible" }, tEnd);
        for (var t = tEnd + 0.4, i = 0; t < 30; t += 0.4, i++) tl.set(cur2, { opacity: i % 2 === 0 ? 0 : 1 }, t);
        if (exit === "fade") tl.to("#atpv-root", { autoAlpha: 0, duration: 0.4, ease: "power2.in" }, isFinite(cues[2]) ? cues[2] : tEnd + 3);
        tl.set({}, {}, 30);
        window.__timelines = window.__timelines || {};
        window.__timelines["code-snippet-apple-terminal-pro-vertical"] = tl;
      })();
    </script>
  </body>
</html>
