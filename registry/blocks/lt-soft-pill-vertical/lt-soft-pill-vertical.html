<!doctype html>
<html
  lang="ru"
  data-composition-variables='[
    { "id": "placement", "type": "enum", "role": "layout", "label": "Placement", "description": "Overlay over footage, centred on the frame, no ground. bottom: the plate sits on y 1360, just above the caption band. top: the plate hangs from y 180. center: centred on y 770.", "default": "bottom", "options": [{ "value": "bottom", "label": "Bottom" }, { "value": "top", "label": "Top" }, { "value": "center", "label": "Centre" }] },
    { "id": "name", "type": "string", "role": "content", "label": "Name", "description": "Name line, bold; wraps to two lines in the vertical version.", "maxLength": 28, "default": "Мат Джестер" },
    { "id": "role", "type": "string", "role": "content", "label": "Role", "description": "Line under the name. Empty hides it.", "maxLength": 40, "default": "Основатель MatIntellect" },
    { "id": "cues", "type": "string", "role": "timing", "label": "Cues", "description": "Comma-separated seconds from mount start: 1 the pill pops up, the red dot pulses in, name and role settle, 2 the plate leaves (only when exit is out). Empty keeps 0.1, 4.3.", "default": "" },
    { "id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "none holds the plate to the end of the mount; out plays its own leaving motion at cue 2.", "default": "none", "options": [{ "value": "none", "label": "Hold" }, { "value": "out", "label": "Leave" }] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+20BD, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: transparent;
        overflow: hidden;
      }
      body {
        width: 1080px;
        height: 1920px;
      }
      #lspv-root {
        font-family: var(--font-body, "Montserrat"), sans-serif;
      }
      #lspv-lt {
        position: absolute;
      }
      #lspv-pill { display: flex; align-items: center; gap: 22px; background: var(--surface, #18181a); border: 2px solid var(--border, #2e2e32); border-radius: 999px; padding: 20px 44px 20px 28px; box-shadow: 0 16px 46px rgba(0, 0, 0, 0.35); transform-origin: 0% 100%; }
      #lspv-dot { width: 20px; height: 20px; border-radius: 50%; background: var(--accent, #ff0000); flex-shrink: 0; }
      #lspv-text { display: flex; flex-direction: column; gap: 4px; }
      #lspv-name { font-weight: 700; color: var(--fg, #f2f2f2); line-height: 1.04; }
      #lspv-role { color: var(--muted, #8a8a90); line-height: 1.2; }
      
      
      #lspv-lt {
        left: 150px;
        width: 780px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      #lspv-root.lspv-bottom #lspv-lt {
        bottom: 560px;
      }
      #lspv-root.lspv-top #lspv-lt {
        top: 180px;
      }
      #lspv-root.lspv-center #lspv-lt {
        top: 770px;
        transform: translateY(-50%);
      }
      #lspv-pill { max-width: 780px; transform-origin: 50% 100%; border-radius: 60px; }
      #lspv-name { font-size: 58px; }
      #lspv-role { font-size: 34px; }
      
    </style>
  </head>
  <body>
    <div id="lspv-root" data-composition-id="lt-soft-pill-vertical" data-width="1080" data-height="1920" data-start="0" data-duration="30">
      <div id="lspv-lt">
        <div id="lspv-pill">
          <div id="lspv-dot"></div>
          <div id="lspv-text">
            <div id="lspv-name"></div>
            <div id="lspv-role"></div>
          </div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var root = document.getElementById("lspv-root");
        var V =
          window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
            ? window.__hyperframes.getVariables()
            : {};
        function oneOf(v, list, d) {
          return list.indexOf(v) >= 0 ? v : d;
        }
        
        root.classList.add("lspv-" + oneOf(V.placement, ["bottom", "top", "center"], "bottom"));
        
        document.getElementById("lspv-name").textContent = typeof V.name === "string" && V.name.trim() ? V.name : "Мат Джестер";
        var role = typeof V.role === "string" ? V.role : "Основатель MatIntellect";
        var roleEl = document.getElementById("lspv-role");
        roleEl.textContent = role;
        if (!role) (document.getElementById("lspv-rolebox") || roleEl).style.display = "none";

        var cues = String(V.cues || "")
          .split(",")
          .map(function (v) {
            return parseFloat(v);
          });
        var c0 = isFinite(cues[0]) && cues[0] >= 0 ? cues[0] : 0.1;
        var exit = oneOf(V.exit, ["none", "out"], "none");

        var tl = gsap.timeline({ paused: true });
        tl.fromTo("#lspv-pill", { scale: 0.88, y: 18, opacity: 0 }, { scale: 1, y: 0, opacity: 1, duration: 0.55, ease: "back.out(1.7)" }, c0);
        tl.fromTo("#lspv-dot", { scale: 0 }, { scale: 1, duration: 0.4, ease: "back.out(3)" }, c0 + 0.3);
        tl.fromTo("#lspv-name", { x: -10, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, c0 + 0.32);
        tl.fromTo("#lspv-role", { x: -10, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, c0 + 0.4);
        if (exit === "out") {
          var out = isFinite(cues[1]) ? cues[1] : c0 + 4.2;
          tl.to("#lspv-pill", { scale: 0.94, y: 14, opacity: 0, duration: 0.35, ease: "power2.in" }, out);
        }
        tl.set({}, {}, 30);
        window.__timelines = window.__timelines || {};
        window.__timelines["lt-soft-pill-vertical"] = tl;
      })();
    </script>
  </body>
</html>
