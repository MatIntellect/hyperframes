<!doctype html>
<html
  lang="ru"
  data-composition-variables='[
    { "id": "placement", "type": "enum", "role": "layout", "label": "Placement", "description": "full: own ground to the frame edge, card centred in the 780x1180 field (y 180-1360). top: card in the 780x760 field at y 180-940, rest of the frame transparent. bottom: same field at y 600-1360.", "default": "full", "options": [{ "value": "full", "label": "Full screen" }, { "value": "top", "label": "Top" }, { "value": "bottom", "label": "Bottom" }] },
    { "id": "displayName", "type": "string", "role": "content", "label": "Display name", "description": "Profile name in bold.", "maxLength": 18, "default": "MatIntellect" },
    { "id": "handle", "type": "string", "role": "content", "label": "Handle", "description": "Account handle with @.", "maxLength": 18, "default": "@matintellect" },
    { "id": "avatar", "type": "image", "role": "content", "label": "Avatar", "description": "Round profile picture.", "default": "assets/img/matintellect-avatar.svg" },
    { "id": "verified", "type": "boolean", "role": "content", "label": "Verified badge", "description": "Blue tick after the name.", "default": true },
    { "id": "text", "type": "string", "role": "content", "label": "Post text", "description": "The post; words starting with # or @ turn blue like on X.", "maxLength": 160, "default": "Ролик собран за 6 минут: монтаж, графика и субтитры без человека. Проверяем систему на живых записях #монтаж" },
    { "id": "time", "type": "string", "role": "content", "label": "Time line", "description": "Grey line under the post, as X writes it.", "maxLength": 26, "default": "13:10 · 7 апр. 2026 г." },
    { "id": "replies", "type": "string", "role": "content", "label": "Replies", "description": "Reply count as shown, e.g. 34 or 2,3 тыс., up to 8 characters", "maxLength": 8, "default": "34" },
    { "id": "reposts", "type": "string", "role": "content", "label": "Reposts", "description": "Repost count as shown.", "maxLength": 8, "default": "2,3 тыс." },
    { "id": "likes", "type": "string", "role": "content", "label": "Likes", "description": "Like count before the press.", "maxLength": 8, "default": "10 тыс." },
    { "id": "likesAfter", "type": "string", "role": "content", "label": "Likes after", "description": "Like count after the press, shown in pink.", "maxLength": 8, "default": "11 тыс." },
    { "id": "views", "type": "string", "role": "content", "label": "Views", "description": "View count as shown.", "maxLength": 8, "default": "150 тыс." },
    { "id": "cues", "type": "string", "role": "timing", "label": "Cues", "description": "Comma-separated seconds from mount start: 1 card lands, 2 the like is pressed, 3 card leaves (only when exit is not none). Empty keeps 0.1, 1.5, 4.2.", "default": "" },
    { "id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "none holds the liked post to the end of the mount.", "default": "none", "options": [{ "value": "none", "label": "Hold" }, { "value": "fade", "label": "Fade" }, { "value": "down", "label": "Slide down" }] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: transparent;
        overflow: hidden;
      }
      body {
        width: 1080px;
        height: 1920px;
      }
      /* X in its dark theme: native colours and Inter, not the brand */
      #xpov-root {
        font-family: "Inter", sans-serif;
      }
      .xpov-ground {
        position: absolute;
        inset: 0;
        background: var(--bg, #0c1014);
      }
      #xpov-field {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #xpov-card {
        background: #15202b;
        border: 1px solid #38444d;
        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
      }
      #xpov-head {
        display: flex;
        align-items: flex-start;
      }
      #xpov-avatar {
        border-radius: 50%;
        object-fit: cover;
        flex-shrink: 0;
        background: #536471;
      }
      #xpov-user {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-width: 0;
      }
      #xpov-namerow {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      #xpov-name {
        font-weight: 700;
        color: #e7e9ea;
        line-height: 1.3;
        white-space: nowrap;
      }
      #xpov-badge {
        display: block;
        flex-shrink: 0;
      }
      #xpov-handle {
        color: #8b98a5;
        line-height: 1.3;
        white-space: nowrap;
      }
      #xpov-xlogo {
        flex-shrink: 0;
        display: block;
      }
      #xpov-text {
        color: #e7e9ea;
        line-height: 1.4;
        overflow-wrap: break-word;
      }
      .xpov-tag {
        color: #1d9bf0;
      }
      #xpov-time {
        color: #8b98a5;
        border-bottom: 1px solid #38444d;
        white-space: nowrap;
      }
      #xpov-metrics {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .xpov-metric {
        display: flex;
        align-items: center;
        white-space: nowrap;
      }
      .xpov-metric svg {
        display: block;
        flex-shrink: 0;
      }
      .xpov-count {
        color: #8b98a5;
        font-variant-numeric: tabular-nums;
      }
      #xpov-like {
        position: relative;
      }
      /* the count before and after the press share one cell */
      #xpov-likebox {
        display: inline-grid;
      }
      #xpov-likes,
      #xpov-likes2 {
        grid-area: 1 / 1;
      }
      #xpov-likes2 {
        color: #f91880;
        opacity: 0;
      }
      
      
      #xpov-field {
        left: 150px;
        width: 780px;
        top: 180px;
        height: 1180px;
      }
      #xpov-root.xpov-top #xpov-field,
      #xpov-root.xpov-bottom #xpov-field {
        height: 760px;
      }
      #xpov-root.xpov-bottom #xpov-field {
        top: 600px;
      }
      #xpov-card {
        width: 780px;
        border-radius: 28px;
        padding: 36px 36px 30px;
      }
      #xpov-head {
        gap: 18px;
        margin-bottom: 22px;
      }
      #xpov-avatar {
        width: 88px;
        height: 88px;
      }
      #xpov-name {
        font-size: 38px;
      }
      #xpov-badge,
      #xpov-xlogo {
        width: 36px;
        height: 36px;
      }
      #xpov-handle {
        font-size: 32px;
      }
      #xpov-text {
        font-size: 40px;
        margin-bottom: 18px;
      }
      #xpov-time {
        font-size: 30px;
        padding-bottom: 22px;
        margin-bottom: 20px;
      }
      .xpov-metric {
        gap: 8px;
      }
      .xpov-metric svg {
        width: 38px;
        height: 38px;
      }
      .xpov-count {
        font-size: 28px;
      }
      
    </style>
  </head>
  <body>
    <div id="xpov-root" data-composition-id="x-post-vertical" data-width="1080" data-height="1920" data-start="0" data-duration="30">
      <div class="xpov-ground"></div>
      <div id="xpov-field">
        <div id="xpov-card">
          <div id="xpov-head">
            <img id="xpov-avatar" src="assets/img/matintellect-avatar.svg" alt="" />
            <div id="xpov-user">
              <div id="xpov-namerow">
                <span id="xpov-name">MatIntellect</span>
                <svg id="xpov-badge" viewBox="0 0 22 22" fill="none">
                  <circle cx="11" cy="11" r="11" fill="#1d9bf0" />
                  <path d="M9.5 14.25L6.25 11l1.06-1.06 2.19 2.19 4.69-4.69L15.25 8.5 9.5 14.25z" fill="#fff" />
                </svg>
              </div>
              <span id="xpov-handle">@matintellect</span>
            </div>
            <svg id="xpov-xlogo" viewBox="0 0 24 24" fill="#e7e9ea">
              <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z" />
            </svg>
          </div>
          <div id="xpov-text"></div>
          <div id="xpov-time">13:10 · 7 апр. 2026 г.</div>
          <div id="xpov-metrics">
            <div class="xpov-metric">
              <svg viewBox="0 0 24 24" fill="#8b98a5"><path d="M1.751 10c0-4.42 3.584-8 8.005-8h4.366c4.49 0 8.129 3.64 8.129 8.13 0 2.96-1.607 5.68-4.196 7.11l-8.054 4.46v-3.69h-.067c-4.49.1-8.183-3.51-8.183-8.01zm8.005-6c-3.317 0-6.005 2.69-6.005 6 0 3.37 2.77 6.08 6.138 6.01l.351-.01h1.761v2.3l5.087-2.81c1.951-1.08 3.163-3.13 3.163-5.36 0-3.39-2.744-6.13-6.129-6.13H9.756z" /></svg>
              <span id="xpov-replies" class="xpov-count">34</span>
            </div>
            <div class="xpov-metric">
              <svg viewBox="0 0 24 24" fill="#8b98a5"><path d="M4.5 3.88l4.432 4.14-1.364 1.46L5.5 7.55V16c0 1.1.896 2 2 2H13v2H7.5c-2.209 0-4-1.79-4-4V7.55L1.432 9.48.068 8.02 4.5 3.88zM16.5 6H11V4h5.5c2.209 0 4 1.79 4 4v8.45l2.068-1.930 1.364 1.46-4.432 4.14-4.432-4.14 1.364-1.46 2.068 1.93V8c0-1.1-.896-2-2-2z" /></svg>
              <span id="xpov-reposts" class="xpov-count">2,3 тыс.</span>
            </div>
            <div id="xpov-like" class="xpov-metric">
              <svg viewBox="0 0 24 24">
                <path id="xpov-heart-o" d="M16.697 5.5c-1.222-.06-2.679.51-3.89 2.16l-.805 1.09-.806-1.09C9.984 6.01 8.526 5.44 7.304 5.5c-1.243.07-2.349.78-2.910 1.910-.552 1.12-.633 2.78.479 4.82 1.074 1.97 3.257 4.27 7.129 6.61 3.870-2.340 6.052-4.640 7.126-6.610 1.111-2.040 1.030-3.700.477-4.820-.561-1.130-1.666-1.840-2.908-1.910zm4.187 7.690c-1.351 2.480-4.001 5.120-8.379 7.670l-.503.300-.504-.300c-4.379-2.550-7.029-5.190-8.382-7.670-1.360-2.500-1.410-4.860-.514-6.670.887-1.790 2.647-2.910 4.601-3.010 1.651-.090 3.368.560 4.798 2.010 1.429-1.450 3.146-2.100 4.796-2.010 1.954.100 3.714 1.220 4.601 3.010.896 1.810.846 4.170-.514 6.670z" fill="#8b98a5" />
                <path id="xpov-heart-f" d="M20.884 13.19c-1.351 2.48-4.001 5.12-8.379 7.67l-.503.3-.504-.3c-4.379-2.55-7.029-5.19-8.382-7.67-1.36-2.5-1.41-4.86-.514-6.67.887-1.79 2.647-2.91 4.601-3.01 1.651-.09 3.368.56 4.798 2.01 1.429-1.45 3.146-2.1 4.796-2.01 1.954.1 3.714 1.22 4.601 3.01.896 1.81.846 4.17-.514 6.67z" fill="#f91880" opacity="0" />
              </svg>
              <span id="xpov-likebox"><span id="xpov-likes" class="xpov-count">10 тыс.</span><span id="xpov-likes2" class="xpov-count">11 тыс.</span></span>
            </div>
            <div class="xpov-metric">
              <svg viewBox="0 0 24 24" fill="#8b98a5"><path d="M8.75 21V3h2v18h-2zM18 21V8.5h2V21h-2zM4 21l.004-10h2L6 21H4zm9.248 0v-7h2v7h-2z" /></svg>
              <span id="xpov-views" class="xpov-count">150 тыс.</span>
            </div>
            
          </div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var root = document.getElementById("xpov-root");
        var V =
          window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
            ? window.__hyperframes.getVariables()
            : {};
        function str(v, d) {
          return typeof v === "string" && v.trim() ? v.trim() : d;
        }
        function oneOf(v, list, d) {
          return list.indexOf(v) >= 0 ? v : d;
        }
        
        var placement = oneOf(V.placement, ["full", "top", "bottom"], "full");
        root.classList.add("xpov-" + placement);
        if (placement !== "full") root.querySelector(".xpov-ground").remove();
        

        document.getElementById("xpov-name").textContent = str(V.displayName, "MatIntellect");
        document.getElementById("xpov-handle").textContent = str(V.handle, "@matintellect");
        document.getElementById("xpov-avatar").src = str(V.avatar, "assets/img/matintellect-avatar.svg");
        if (V.verified === false) document.getElementById("xpov-badge").remove();
        document.getElementById("xpov-time").textContent = str(V.time, "13:10 · 7 апр. 2026 г.");
        document.getElementById("xpov-replies").textContent = str(V.replies, "34");
        document.getElementById("xpov-reposts").textContent = str(V.reposts, "2,3 тыс.");
        var likes = document.getElementById("xpov-likes");
        likes.textContent = str(V.likes, "10 тыс.");
        document.getElementById("xpov-likes2").textContent = str(V.likesAfter, "11 тыс.");
        document.getElementById("xpov-views").textContent = str(V.views, "150 тыс.");

        /* post text: words starting with # or @ are blue, as X draws them */
        var textEl = document.getElementById("xpov-text");
        str(V.text, "Ролик собран за 6 минут: монтаж, графика и субтитры без человека. Проверяем систему на живых записях #монтаж")
          .split(/(\s+)/)
          .forEach(function (w) {
            if (/^[#@]\S/.test(w)) {
              var s = document.createElement("span");
              s.className = "xpov-tag";
              s.textContent = w;
              textEl.appendChild(s);
            } else textEl.appendChild(document.createTextNode(w));
          });

        var cues = String(V.cues || "")
          .split(",")
          .map(function (v) {
            return parseFloat(v);
          });
        var c0 = isFinite(cues[0]) && cues[0] >= 0 ? cues[0] : 0.1;
        var c1 = isFinite(cues[1]) && cues[1] > c0 + 0.6 ? cues[1] : c0 + 1.4;
        var exit = oneOf(V.exit, ["none", "fade", "down"], "none");

        /* how far the card travels: from under the frame edge in the wide version, a short lift in the vertical one */
        var RISE = 400;
        
        RISE = 60;
        
        var card = document.getElementById("xpov-card");
        var like = document.getElementById("xpov-like");
        var tl = gsap.timeline({ paused: true });
        tl.fromTo(card, { y: RISE, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, c0);
        tl.to(like, { scale: 0.85, duration: 0.12, ease: "power2.out" }, c1);
        tl.to(like, { scale: 1, duration: 0.4, ease: "elastic.out(1, 0.4)" }, c1 + 0.12);
        tl.set("#xpov-heart-o", { opacity: 0 }, c1 + 0.12);
        tl.to("#xpov-heart-f", { opacity: 1, duration: 0.12, ease: "none" }, c1 + 0.12);
        tl.to(likes, { opacity: 0, duration: 0.08, ease: "none" }, c1 + 0.12);
        tl.to("#xpov-likes2", { opacity: 1, duration: 0.12, ease: "none" }, c1 + 0.12);
        var tOut = isFinite(cues[2]) ? cues[2] : c1 + 2.7;
        if (exit === "fade") tl.to(card, { opacity: 0, duration: 0.4, ease: "power2.in" }, tOut);
        if (exit === "down") tl.to(card, { y: RISE, opacity: 0, duration: 0.3, ease: "power3.in" }, tOut);
        tl.set({}, {}, 30);
        window.__timelines = window.__timelines || {};
        window.__timelines["x-post-vertical"] = tl;
      })();
    </script>
  </body>
</html>
