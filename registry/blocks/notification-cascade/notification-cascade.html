<!doctype html>
<html
  lang="ru"
  data-composition-variables='[
    { "id": "placement", "type": "enum", "role": "layout", "label": "Placement", "description": "full: the backdrop photo to the frame edge, the stack in the 780x1180 field (y 180-1360). top / bottom: the stack alone in the 780x760 field at y 180-940 / 600-1360, the oldest banner and the pill fade out when the fourth lands, rest of the frame transparent.", "default": "full", "options": [{ "value": "full", "label": "Full screen" }, { "value": "top", "label": "Top" }, { "value": "bottom", "label": "Bottom" }] },
    { "id": "notifTitle", "type": "string", "role": "content", "label": "Notification title", "description": "Bold first line on every banner, one line clear of the time label.", "maxLength": 18, "default": "Новый ролик" },
    { "id": "message1", "type": "string", "role": "content", "label": "Message 1", "description": "Subtitle of the first banner to land.", "maxLength": 30, "default": "Ролик готов к публикации." },
    { "id": "message2", "type": "string", "role": "content", "label": "Message 2", "description": "Subtitle of the second banner.", "maxLength": 30, "default": "Все проверки пройдены." },
    { "id": "message3", "type": "string", "role": "content", "label": "Message 3", "description": "Subtitle of the third banner.", "maxLength": 30, "default": "Рендер 4K за 92 секунды." },
    { "id": "message4", "type": "string", "role": "content", "label": "Message 4", "description": "Subtitle of the fourth banner.", "maxLength": 30, "default": "Опубликовано в канале." },
    { "id": "appName", "type": "string", "role": "content", "label": "App name", "description": "Credited in the corner of every banner.", "maxLength": 16, "default": "MatIntellect" },
    { "id": "nowLabel", "type": "string", "role": "content", "label": "Time label", "description": "Small time label in the banner corner.", "maxLength": 8, "default": "сейчас" },
    { "id": "pillLabel", "type": "string", "role": "content", "label": "Pill label", "description": "Label of the collapse pill above the stack.", "maxLength": 10, "default": "Свернуть" },
    { "id": "backdrop", "type": "image", "role": "content", "label": "Backdrop", "description": "Photo behind the stack in full placement, slowly pushed in.", "default": "assets/desk-backdrop.jpg" },
    { "id": "cues", "type": "string", "role": "timing", "label": "Cues", "description": "Comma-separated seconds from mount start: 1-4 each banner lands (the earlier ones slide up to make room), 5 the stack lifts away (only when exit is lift). Empty keeps 1.6, 3.6, 5.6, 7.6, 9.2.", "default": "" },
    { "id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "none holds the stack to the end of the mount.", "default": "none", "options": [{ "value": "none", "label": "Hold" }, { "value": "lift", "label": "Lift away" }] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Notification Cascade</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: transparent;
        overflow: hidden;
      }
      #nc-root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        font-family: "Montserrat", sans-serif;
        /* palette: warm glass banners over a bright soft backdrop, dark scrim under the end card */
        --nc-glass: var(--hf-ui-surface-raised, rgba(250, 246, 241, 0.94));
        --nc-ink-strong: var(--hf-ui-text-strong, #1c1c1e);
        --nc-ink: var(--hf-ui-text, #464040);
        --nc-ink-faint: var(--hf-ui-text-faint, #5a5450);
        --nc-accent: var(--hf-ui-accent, #0a9c6b);
      }
      #nc-field {
        position: absolute;
        left: 150px;
        width: 780px;
        top: 180px;
        height: 1180px;
      }
      .nc-top #nc-field,
      .nc-bottom #nc-field {
        height: 760px;
      }
      .nc-bottom #nc-field {
        top: 600px;
      }
      .clip {
        position: absolute;
        inset: 0;
      }

      /* ---------------- backdrop plate ---------------- */
      /* a real photograph, like the footage it stands in for, pushed in slowly
         by the timeline */
      #nc-backdrop {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
      #nc-vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse 120% 90% at 50% 42%,
          rgba(0, 0, 0, 0) 58%,
          rgba(50, 25, 8, 0.18) 100%
        );
      }

      /* ---------------- notification stack ---------------- */
      /* geometry measured from the reference: 810px banners (780 here, to fit the field) on a 214px pitch,
         entries every 2.000s, expo.out restack (spec provenance: measured) */
      #nc-stack-inner {
        position: absolute;
        inset: 0;
      }
      .nc-banner {
        position: absolute;
        left: 0;
        width: 780px;
        height: 176px;
        border-radius: 26px;
        background: var(--nc-glass);
        box-shadow: 0 10px 26px rgba(50, 25, 8, 0.18);
      }
      .nc-banner .nc-icon {
        position: absolute;
        left: 23px;
        top: 38px;
        width: 100px;
        height: 100px;
        border-radius: 24px;
        background: linear-gradient(180deg, #5ae458 0%, #1fc83f 100%);
      }
      .nc-banner .nc-icon svg {
        position: absolute;
        left: 18px;
        top: 20px;
      }
      .nc-banner .nc-title {
        position: absolute;
        left: 148px;
        top: 37px;
        font-size: 35px;
        font-weight: 700;
        color: var(--nc-ink-strong);
        letter-spacing: 0.25px;
      }
      .nc-banner .nc-subtitle {
        position: absolute;
        left: 148px;
        top: 85px;
        font-size: 33px;
        font-weight: 400;
        color: var(--nc-ink);
        letter-spacing: -0.75px;
      }
      .nc-banner .nc-now {
        position: absolute;
        right: 26px;
        top: 32px;
        font-size: 28px;
        font-weight: 400;
        color: var(--nc-ink-faint);
        letter-spacing: 0.5px;
      }
      .nc-banner .nc-credit {
        position: absolute;
        right: 26px;
        bottom: 10px;
        font-size: 28px;
        font-style: italic;
        color: var(--nc-ink-faint);
      }
      #nc-pill-row {
        position: absolute;
        left: 0;
        top: var(--nc-pill-top, 894px);
        width: 780px;
        height: 72px;
      }
      #nc-pill {
        position: absolute;
        right: 97px;
        padding-right: 22px;
        height: 72px;
        border-radius: 36px;
        background: rgba(250, 246, 242, 0.85);
        display: flex;
        align-items: center;
        justify-content: flex-start;
        padding-left: 20px;
        gap: 9px;
        font-size: 28px;
        font-weight: 500;
        color: #3f3a38;
        box-shadow: 0 8px 20px rgba(50, 25, 8, 0.14);
      }
      #nc-pill-x {
        position: absolute;
        right: 0;
        width: 73px;
        height: 72px;
        border-radius: 50%;
        background: rgba(250, 246, 242, 0.85);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 20px rgba(50, 25, 8, 0.14);
      }
    </style>
  </head>
  <body>
    <div
      id="nc-root"
      data-composition-id="notification-cascade"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="30"
    >
      <!-- backdrop plate: slow push-in added in the timeline -->
      <section id="nc-base" class="clip" data-start="0" data-duration="30" data-track-index="1">
        <img id="nc-backdrop" data-var-src="backdrop" src="assets/desk-backdrop.jpg" alt="" />
        <div id="nc-vignette"></div>
      </section>

      <!-- notification stack -->
      <div id="nc-field">
        <section id="nc-stack" class="clip" data-start="0" data-duration="30" data-track-index="2">
          <div id="nc-stack-inner">
            <div id="nc-pill-row">
              <div id="nc-pill">
                <svg width="25" height="25" viewBox="0 0 26 26" fill="none">
                  <path
                    d="M4 8 L13 18 L22 8"
                    stroke="#3f3a38"
                    stroke-width="3.4"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
                <span id="nc-pill-label">Свернуть</span>
              </div>
              <div id="nc-pill-x">
                <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
                  <path
                    d="M6 6 L28 28 M28 6 L6 28"
                    stroke="#4a4442"
                    stroke-width="4.2"
                    stroke-linecap="round"
                  />
                </svg>
              </div>
            </div>

            <div class="nc-banner" id="nc-banner-1" style="top: var(--nc-base-top, 990px)">
              <div class="nc-icon">
                <svg width="64" height="60" viewBox="0 0 64 60" fill="none">
                  <path
                    d="M32 2 C15 2 2 13 2 27 c0 8 4.6 15 12 19.6 -0.7 3.6 -2.9 7.4 -6.4 10.2 5.8 -0.6 10.9 -2.8 14.6 -5.5 3.1 0.8 6.4 1.2 9.8 1.2 17 0 30 -11 30 -25.5 S49 2 32 2 Z"
                    fill="#fff"
                  />
                </svg>
              </div>
              <div class="nc-title">Новый ролик</div>
              <div class="nc-subtitle">Ролик готов к публикации.</div>
              <div class="nc-now">сейчас</div>
              <div class="nc-credit">MatIntellect</div>
            </div>
            <div class="nc-banner" id="nc-banner-2" style="top: var(--nc-base-top, 990px)">
              <div class="nc-icon">
                <svg width="64" height="60" viewBox="0 0 64 60" fill="none">
                  <path
                    d="M32 2 C15 2 2 13 2 27 c0 8 4.6 15 12 19.6 -0.7 3.6 -2.9 7.4 -6.4 10.2 5.8 -0.6 10.9 -2.8 14.6 -5.5 3.1 0.8 6.4 1.2 9.8 1.2 17 0 30 -11 30 -25.5 S49 2 32 2 Z"
                    fill="#fff"
                  />
                </svg>
              </div>
              <div class="nc-title">Новый ролик</div>
              <div class="nc-subtitle">Все проверки пройдены.</div>
              <div class="nc-now">сейчас</div>
              <div class="nc-credit">MatIntellect</div>
            </div>
            <div class="nc-banner" id="nc-banner-3" style="top: var(--nc-base-top, 990px)">
              <div class="nc-icon">
                <svg width="64" height="60" viewBox="0 0 64 60" fill="none">
                  <path
                    d="M32 2 C15 2 2 13 2 27 c0 8 4.6 15 12 19.6 -0.7 3.6 -2.9 7.4 -6.4 10.2 5.8 -0.6 10.9 -2.8 14.6 -5.5 3.1 0.8 6.4 1.2 9.8 1.2 17 0 30 -11 30 -25.5 S49 2 32 2 Z"
                    fill="#fff"
                  />
                </svg>
              </div>
              <div class="nc-title">Новый ролик</div>
              <div class="nc-subtitle">Рендер 4K за 92 секунды.</div>
              <div class="nc-now">сейчас</div>
              <div class="nc-credit">MatIntellect</div>
            </div>
            <div class="nc-banner" id="nc-banner-4" style="top: var(--nc-base-top, 990px)">
              <div class="nc-icon">
                <svg width="64" height="60" viewBox="0 0 64 60" fill="none">
                  <path
                    d="M32 2 C15 2 2 13 2 27 c0 8 4.6 15 12 19.6 -0.7 3.6 -2.9 7.4 -6.4 10.2 5.8 -0.6 10.9 -2.8 14.6 -5.5 3.1 0.8 6.4 1.2 9.8 1.2 17 0 30 -11 30 -25.5 S49 2 32 2 Z"
                    fill="#fff"
                  />
                </svg>
              </div>
              <div class="nc-title">Новый ролик</div>
              <div class="nc-subtitle">Опубликовано в канале.</div>
              <div class="nc-now">сейчас</div>
              <div class="nc-credit">MatIntellect</div>
            </div>
          </div>
        </section>
      </div>
    </div>

    <script>
      (function () {
        "use strict";

        /* -------- variables: every override falls back to its declared default -------- */
        var vars =
          window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
            ? window.__hyperframes.getVariables()
            : {};

        function text(value, fallback) {
          return typeof value === "string" && value.trim() ? value : fallback;
        }
        function oneOf(v, list, d) {
          return list.indexOf(v) >= 0 ? v : d;
        }
        var root = document.getElementById("nc-root");
        var placement = oneOf(vars.placement, ["full", "top", "bottom"], "full");
        root.classList.add("nc-" + placement);
        var full = placement === "full";
        /* the newest banner ends 14 px above the field bottom; the pill rides 96 px above banner 1 */
        var baseTop = full ? 990 : 570;
        root.style.setProperty("--nc-base-top", baseTop + "px");
        root.style.setProperty("--nc-pill-top", baseTop - 96 + "px");
        if (!full) document.getElementById("nc-base").remove();

        function setAll(selector, value) {
          document.querySelectorAll(selector).forEach(function (el) {
            el.textContent = value;
          });
        }

        setAll(".nc-title", text(vars.notifTitle, "Новый ролик"));
        setAll(".nc-credit", text(vars.appName, "MatIntellect"));
        setAll(".nc-now", text(vars.nowLabel, "сейчас"));
        document.getElementById("nc-pill-label").textContent = text(vars.pillLabel, "Свернуть");
        var messages = [
          text(vars.message1, "Ролик готов к публикации."),
          text(vars.message2, "Все проверки пройдены."),
          text(vars.message3, "Рендер 4K за 92 секунды."),
          text(vars.message4, "Опубликовано в канале."),
        ];
        document.querySelectorAll(".nc-subtitle").forEach(function (el, i) {
          el.textContent = messages[i] || messages[messages.length - 1];
        });

        /* -------- timeline: every decisive number is measured from the reference -------- */
        var tl = gsap.timeline({ paused: true });

        var PITCH = 214; /* banner-to-banner spacing, px */
        var cues = String(vars.cues || "")
          .split(",")
          .map(function (v) {
            return parseFloat(v);
          });
        var AUTHORED = [1.6033, 3.6033, 5.6033, 7.6033, 9.2033];
        var at = AUTHORED.map(function (t, i) {
          return isFinite(cues[i]) ? cues[i] : t;
        });
        if (
          !at.every(function (t, i) {
            return t >= 0 && (i === 0 || t > at[i - 1]);
          })
        )
          at = AUTHORED.slice();
        var ENTRY = at.slice(0, 4);
        var exit = oneOf(vars.exit, ["none", "lift"], "none");
        var FADE_D = 0.3333; /* linear alpha ramp */
        var RISE = 22; /* entry micro-rise, px */
        var RESTACK_D = 1.0; /* expo.out slide when the stack makes room */
        var EXIT_T = at[4]; /* group exit */

        /* baselines at t=0.001 so every span is covered at any seek */
        tl.set(
          ["#nc-banner-1", "#nc-banner-2", "#nc-banner-3", "#nc-banner-4", "#nc-pill-row"],
          { autoAlpha: 0 },
          0.001,
        );

        /* backdrop push-in: linear, scale 1 -> 1.105 across the whole mount */
        if (full)
          tl.fromTo(
            "#nc-backdrop",
            { scale: 1.0, transformOrigin: "525px 950px" },
            { scale: 1.105, duration: 29.4667, ease: "none" },
            0.5333,
          );

        /* banner entries: linear fade + expo micro-rise */
        var banners = ["#nc-banner-1", "#nc-banner-2", "#nc-banner-3", "#nc-banner-4"];
        banners.forEach(function (sel, i) {
          tl.fromTo(
            sel,
            { autoAlpha: 0 },
            { autoAlpha: 1, duration: FADE_D, ease: "none" },
            ENTRY[i],
          );
          tl.fromTo(sel, { y: RISE }, { y: 0, duration: 0.9, ease: "expo.out" }, ENTRY[i]);
        });
        /* pill + X appear with banner 1 */
        tl.fromTo(
          "#nc-pill-row",
          { autoAlpha: 0 },
          { autoAlpha: 1, duration: FADE_D, ease: "none" },
          ENTRY[0],
        );

        /* restacks: existing banners + pill slide up one pitch in lockstep */
        tl.to(
          ["#nc-banner-1", "#nc-pill-row"],
          { y: -PITCH, duration: RESTACK_D, ease: "expo.out" },
          ENTRY[1],
        );
        tl.to(
          ["#nc-banner-1", "#nc-pill-row"],
          { y: -2 * PITCH, duration: RESTACK_D, ease: "expo.out" },
          ENTRY[2],
        );
        tl.to("#nc-banner-2", { y: -PITCH, duration: RESTACK_D, ease: "expo.out" }, ENTRY[2]);
        tl.to(
          ["#nc-banner-1", "#nc-pill-row"],
          { y: -3 * PITCH, duration: RESTACK_D, ease: "expo.out" },
          ENTRY[3],
        );
        tl.to("#nc-banner-2", { y: -2 * PITCH, duration: RESTACK_D, ease: "expo.out" }, ENTRY[3]);
        tl.to("#nc-banner-3", { y: -PITCH, duration: RESTACK_D, ease: "expo.out" }, ENTRY[3]);
        /* half field holds three banners: the oldest and the pill fade out as they leave it */
        if (!full)
          tl.to(
            ["#nc-banner-1", "#nc-pill-row"],
            { autoAlpha: 0, duration: 0.3, ease: "none" },
            ENTRY[3],
          );

        /* group exit: rise + fade */
        if (exit === "lift") {
          tl.to("#nc-stack-inner", { y: -560, duration: 0.5, ease: "expo.out" }, EXIT_T);
          tl.to("#nc-stack-inner", { autoAlpha: 0, duration: 0.37, ease: "none" }, EXIT_T);
        }

        tl.set({}, {}, 30);
        window.__timelines = window.__timelines || {};
        window.__timelines["notification-cascade"] = tl;
      })();
    </script>
  </body>
</html>
