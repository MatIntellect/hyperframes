      #bswv-pt {

  <body>

    <script>

        var exit = oneOf(V.exit, ["none", "fade"], "none");

        s.to($("warm"), { x: 620 * K, opacity: 0, filter: "blur(18px)", duration: 0.24, ease: "power2.in" }, 0.25);

        s.to($("introsc"), { opacity: 0, duration: 0.06 }, 1.56);
        s.fromTo($("bstar"), { opacity: 0, scale: 0.08, rotation: -20 }, { opacity: 1, scale: 0.16, rotation: -6, duration: 0.08, ease: "power2.out" }, 1.43);

          { source: [-11, 5], scatter: [165, -123], drift: [153, -126], select: [61, -118], squeeze: [-81, -65], release: [-81, -65], fade: 2.17 },

        to(1540, 112, -9, 1.56, 0.26);
        to(380, 252, -7, 1.82, 0.16);
        s.fromTo($("sel"), { opacity: 0, scaleX: 0.06, scaleY: 0.1, x: 0, y: 0, filter: "blur(3px)" }, { opacity: 1, scaleX: 1, scaleY: 1, x: 42, y: 52, filter: "blur(0px)", duration: 0.18, ease: "power2.out" }, 1.96);
        to(930, 478, -4, 1.96, 0.14);
        to(1168, 560, -4, 2.12, 0.14);
        s.to($("sel"), { x: 220, y: 158, scaleX: 640 / 550, scaleY: 190 / 176, duration: 0.2, ease: "power2.inOut" }, 2.16);
        s.to($("bstar"), { x: 118, y: -62, scale: 0.16, opacity: 0.45, duration: 0.18, ease: "power2.inOut", overwrite: "auto" }, 2.12);
        s.to($("brandsc"), { opacity: 1, duration: 0.04 }, 2.08);
        var FM = [

        });
        s.fromTo(mark, { opacity: 0, x: -12, y: 8, scale: 0.995, filter: "blur(5px)" }, { opacity: 1, x: 0, y: 0, scale: 1, filter: "blur(0px)", duration: 0.24, ease: "power4.out", overwrite: "auto" }, 2.38);
        s.to($("bstar"), { opacity: 0, duration: 0.12, ease: "power2.in" }, 2.32);
        s.to($("sel"), { opacity: 0, filter: "blur(5px)", duration: 0.16, ease: "power2.in" }, 2.33);
        to(1256, 587, -3, 2.34, 0.3);

        s.to(cur, { opacity: 0, duration: 0.13, ease: "power2.in" }, 2.86);

        }

          xP = at($("xbtn"), 0.45, 0.55),

        s.fromTo($("stack"), { opacity: 0, scale: 0.88, y: 92, filter: "blur(14px)" }, { opacity: 1, scale: 1, y: 0, filter: "blur(0px)", duration: 0.66, ease: "expo.out" }, 3.05);
        s.fromTo($("pstar"), { opacity: 0, scale: 0.5, rotation: -16 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.38 }, 3.18);
        s.fromTo("#bswv-pe .bswv-placeholder", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.34 }, 3.3);
        s.fromTo("#bswv-pe .bswv-plus, #bswv-pe .bswv-model", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, stagger: 0.06 }, 3.42);
        s.to($("pe"), { opacity: 0, duration: 0.18, ease: "power2.inOut" }, 4.12);

        var Z = 1.32,

        s.to(cur, { x: sendP.x, y: sendP.y, rotation: -5, duration: 0.5, ease: "power2.inOut" }, 7.44 + D1);
        s.to($("sendf"), { scale: 0.86, duration: 0.08, ease: "power2.in" }, 7.9 + D1);
        s.to($("sendf"), { scale: 1, duration: 0.14, ease: "back.out(1.7)" }, 7.98 + D1);
        s.to(cur, { x: sendP.x + 22, duration: 0.28, ease: "power2.out" }, 7.94 + D1);
        s.to($("pf"), { opacity: 0, duration: 0.16, ease: "power2.inOut" }, 8.15 + D1);

        s.to(cur, { x: xP.x, y: xP.y, rotation: -6, duration: 0.58, ease: "power2.inOut", overwrite: "auto" }, 8.74 + D1);

        s.to(cur, { x: fbP.x, y: fbP.y, rotation: -5, duration: 0.36, ease: "power2.inOut", overwrite: "auto" }, 10.5 + D1 + D2);

        window.__timelines["blue-sweater-intro-video-vertical"] = tl;
