<!doctype html>
<html
  lang="ru"
  data-composition-variables='[
    { "id": "placement", "type": "enum", "role": "layout", "label": "Placement", "description": "Overlay over footage, centred on the frame, no ground. bottom: the card sits on y 1360, just above the caption band. top: the card hangs from y 180. center: centred on y 770.", "default": "bottom", "options": [{ "value": "bottom", "label": "Bottom" }, { "value": "top", "label": "Top" }, { "value": "center", "label": "Centre" }] },
    { "id": "name", "type": "string", "role": "content", "label": "Name", "description": "Name line, bold; wraps to two lines in the vertical version.", "maxLength": 28, "default": "Мат Джестер" },
    { "id": "role", "type": "string", "role": "content", "label": "Role", "description": "Line under the red underline. Empty hides it.", "maxLength": 40, "default": "Основатель MatIntellect" },
    { "id": "cues", "type": "string", "role": "timing", "label": "Cues", "description": "Comma-separated seconds from mount start: 1 the card slides up and the name, underline and role follow, 2 the card leaves (only when exit is not none). Empty keeps 0.1, 4.3.", "default": "" },
    { "id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "none holds the card to the end of the mount; down slides it out.", "default": "none", "options": [{ "value": "none", "label": "Hold" }, { "value": "down", "label": "Slide down" }] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: transparent;
        overflow: hidden;
      }
      body {
        width: 1080px;
        height: 1920px;
      }
      #ldcv-root {
        font-family: var(--font-body, "Montserrat"), sans-serif;
      }
      #ldcv-lt {
        position: absolute;
      }
      #ldcv-card {
        background: var(--surface, #18181a);
        border: 2px solid var(--border, #2e2e32);
        border-radius: 18px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.4);
        display: flex;
        flex-direction: column;
      }
      #ldcv-name {
        font-weight: 700;
        color: var(--fg, #f2f2f2);
        line-height: 1.08;
        letter-spacing: -0.01em;
      }
      #ldcv-underline {
        height: 5px;
        width: 100%;
        background: var(--accent, #ff0000);
        border-radius: 3px;
        transform-origin: 0% 50%;
      }
      #ldcv-role {
        color: var(--muted, #8a8a90);
        line-height: 1.2;
      }
      
      
      #ldcv-lt {
        left: 150px;
        width: 780px;
        display: flex;
        justify-content: center;
      }
      #ldcv-root.ldcv-bottom #ldcv-lt {
        bottom: 560px;
      }
      #ldcv-root.ldcv-top #ldcv-lt {
        top: 180px;
      }
      #ldcv-root.ldcv-center #ldcv-lt {
        top: 770px;
        transform: translateY(-50%);
      }
      #ldcv-card {
        max-width: 780px;
        padding: 30px 40px 32px;
        gap: 16px;
        align-items: center;
        text-align: center;
      }
      #ldcv-name {
        font-size: 64px;
      }
      #ldcv-role {
        font-size: 36px;
      }
      
    </style>
  </head>
  <body>
    <div id="ldcv-root" data-composition-id="lt-dark-card-vertical" data-width="1080" data-height="1920" data-start="0" data-duration="30">
      <div id="ldcv-lt">
        <div id="ldcv-card">
          <div id="ldcv-name">Мат Джестер</div>
          <div id="ldcv-underline"></div>
          <div id="ldcv-role">Основатель MatIntellect</div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var root = document.getElementById("ldcv-root");
        var V =
          window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
            ? window.__hyperframes.getVariables()
            : {};
        function oneOf(v, list, d) {
          return list.indexOf(v) >= 0 ? v : d;
        }
        
        root.classList.add("ldcv-" + oneOf(V.placement, ["bottom", "top", "center"], "bottom"));
        
        document.getElementById("ldcv-name").textContent = typeof V.name === "string" && V.name.trim() ? V.name : "Мат Джестер";
        var role = typeof V.role === "string" ? V.role : "Основатель MatIntellect";
        var roleEl = document.getElementById("ldcv-role");
        roleEl.textContent = role;
        if (!role) roleEl.style.display = "none";

        var cues = String(V.cues || "")
          .split(",")
          .map(function (v) {
            return parseFloat(v);
          });
        var c0 = isFinite(cues[0]) && cues[0] >= 0 ? cues[0] : 0.1;
        var exit = oneOf(V.exit, ["none", "down"], "none");

        var tl = gsap.timeline({ paused: true });
        tl.fromTo("#ldcv-card", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, c0);
        tl.fromTo("#ldcv-name", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, c0 + 0.16);
        tl.fromTo("#ldcv-underline", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power4.out" }, c0 + 0.32);
        tl.fromTo("#ldcv-role", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, c0 + 0.46);
        if (exit === "down") tl.to("#ldcv-card", { y: 24, opacity: 0, duration: 0.35, ease: "power2.in" }, isFinite(cues[1]) ? cues[1] : c0 + 4.2);
        tl.set({}, {}, 30);
        window.__timelines = window.__timelines || {};
        window.__timelines["lt-dark-card-vertical"] = tl;
      })();
    </script>
  </body>
</html>
