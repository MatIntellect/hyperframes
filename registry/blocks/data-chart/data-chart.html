<!doctype html>
<html
  lang="ru"
  data-composition-variables='[
    { "id": "title", "type": "string", "role": "content", "label": "Headline", "description": "Headline, Bebas Neue, up to two lines.", "maxLength": 28, "default": "Выручка и конверсия" },
    { "id": "subtitle", "type": "string", "role": "content", "label": "Subtitle", "description": "One line under the headline.", "maxLength": 36, "default": "Январь – июнь, тыс. ₽" },
    { "id": "labels", "type": "string", "role": "content", "label": "Labels", "description": "Category labels separated by ;, 2 to 7 items, each up to 5 characters.", "maxLength": 48, "default": "Янв;Фев;Мар;Апр;Май;Июн" },
    { "id": "values", "type": "string", "role": "content", "label": "Bar values", "description": "Bar values separated by ;, one per label, each up to 5 characters, decimals with a comma or a dot. Shown as written; put the unit in the subtitle.", "maxLength": 48, "default": "8;12;15;11;18;22" },
    { "id": "barName", "type": "string", "role": "content", "label": "Bar series name", "description": "Legend label of the bars.", "maxLength": 18, "default": "Выручка" },
    { "id": "lineValues", "type": "string", "role": "content", "label": "Line values", "description": "Second series drawn as a red line above the bars, separated by ;. Empty draws bars only.", "maxLength": 48, "default": "2,1;2,8;3,2;2,9;3,8;4,2" },
    { "id": "lineSuffix", "type": "string", "role": "content", "label": "Line value suffix", "description": "Appended to every line value; value plus suffix up to 5 characters.", "maxLength": 2, "default": "%" },
    { "id": "lineName", "type": "string", "role": "content", "label": "Line series name", "description": "Legend label of the line.", "maxLength": 18, "default": "Конверсия" },
    { "id": "source", "type": "string", "role": "content", "label": "Source", "description": "Small source line under the chart. Empty hides it.", "maxLength": 40, "default": "Источник: внутренняя аналитика" },
    { "id": "cues", "type": "string", "role": "timing", "label": "Cues", "description": "Comma-separated seconds from mount start: 1 the headline starts writing in, 2 the bars start growing one by one, 3 the line starts drawing (ignored without a line), 4 the chart fades out (only when exit is fade; empty fades 3 s after the last beat). Each stretch of the authored motion is sped up or slowed to land on its cue. Empty keeps 0, 0.8 and the line right after the last bar.", "default": "" },
    { "id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "none holds the finished chart to the end of the mount.", "default": "none", "options": [{ "value": "none", "label": "Hold" }, { "value": "fade", "label": "Fade" }] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+20BD, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: transparent;
        overflow: hidden;
      }
      body {
        width: 1920px;
        height: 1080px;
      }
      #dch-root {
        font-family: var(--font-body, "Montserrat"), sans-serif;
        color: var(--fg, #f2f2f2);
      }
      #dch-root .dch-ground {
        position: absolute;
        inset: 0;
        background: var(--bg, #0c1014);
      }
      #dch-root .dch-field {
        position: absolute;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      #dch-root .dch-box {
        display: flex;
        flex-direction: column;
      }
      #dch-root .dch-title {
        font-family: var(--font-display, "Bebas Neue"), sans-serif;
        font-weight: 700;
        line-height: 0.98;
        text-transform: uppercase;
        letter-spacing: 0.01em;
        clip-path: inset(-0.3em 100% -0.3em 0);
      }
      #dch-root .dch-sub {
        color: var(--muted, #8a8a90);
        line-height: 1.25;
        white-space: nowrap;
        clip-path: inset(-0.3em 100% -0.3em 0);
      }
      #dch-root .dch-key {
        display: flex;
        flex-wrap: wrap;
        column-gap: 36px;
        row-gap: 8px;
        opacity: 0;
      }
      #dch-root .dch-key-item {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--muted, #8a8a90);
        white-space: nowrap;
      }
      #dch-root .dch-key-box {
        width: 22px;
        height: 22px;
        background: var(--muted, #8a8a90);
      }
      #dch-root .dch-key-line {
        width: 34px;
        height: 4px;
        background: var(--accent, #ff0000);
      }
      #dch-root svg {
        display: block;
        overflow: visible;
      }
      #dch-root .dch-halo {
        paint-order: stroke;
        stroke: var(--bg, #0c1014);
        stroke-width: 10px;
        stroke-linejoin: round;
      }
      #dch-root .dch-card-on .dch-halo {
        stroke: var(--surface, #18181a);
      }
      #dch-root .dch-src {
        color: var(--muted, #8a8a90);
        white-space: nowrap;
        opacity: 0;
      }
      
      #dch-root .dch-field {
        left: 160px;
        top: 90px;
        width: 1600px;
        height: 900px;
      }
      #dch-root .dch-title {
        font-size: 92px;
        white-space: nowrap;
      }
      #dch-root .dch-sub {
        font-size: 36px;
        margin-top: 10px;
      }
      #dch-root .dch-key {
        font-size: 30px;
        margin-top: 22px;
      }
      #dch-root .dch-halo {
        paint-order: stroke;
        stroke: var(--bg, #0c1014);
        stroke-width: 10px;
        stroke-linejoin: round;
      }
      #dch-root .dch-card-on .dch-halo {
        stroke: var(--surface, #18181a);
      }
      #dch-root .dch-src {
        font-size: 28px;
        margin-top: 18px;
      }
      
      
    </style>
  </head>
  <body>
    <div id="dch-root" data-composition-id="data-chart" data-width="1920" data-height="1080" data-start="0" data-duration="30">
      <div class="dch-ground"></div>
      <div class="dch-field">
        <div id="dch-box" class="dch-box">
          <div id="dch-title" class="dch-title">Выручка и конверсия</div>
          <div id="dch-sub" class="dch-sub">Январь – июнь, тыс. ₽</div>
          <div id="dch-key" class="dch-key">
            <div class="dch-key-item"><div class="dch-key-box"></div><span id="dch-bar-name">Выручка</span></div>
            <div id="dch-key-line-item" class="dch-key-item"><div class="dch-key-line"></div><span id="dch-line-name">Конверсия</span></div>
          </div>
          <svg id="dch-svg" xmlns="http://www.w3.org/2000/svg"></svg>
          <div id="dch-src" class="dch-src">Источник: внутренняя аналитика</div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        var root = document.getElementById("dch-root");
        var vars =
          window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
            ? window.__hyperframes.getVariables()
            : {};
        function str(v, d) {
          return typeof v === "string" ? v : d;
        }
        function oneOf(v, list, d) {
          return list.indexOf(v) >= 0 ? v : d;
        }
        function list(v) {
          return String(v)
            .split(";")
            .map(function (s) {
              return s.trim();
            })
            .filter(function (s) {
              return s.length;
            });
        }
        function num(s) {
          return parseFloat(String(s).replace(",", "."));
        }

        

        document.getElementById("dch-title").textContent = str(vars.title, "Выручка и конверсия") || "Выручка и конверсия";
        var sub = str(vars.subtitle, "Январь – июнь, тыс. ₽");
        document.getElementById("dch-sub").textContent = sub;
        if (!sub) document.getElementById("dch-sub").style.display = "none";
        document.getElementById("dch-bar-name").textContent = str(vars.barName, "Выручка");
        document.getElementById("dch-line-name").textContent = str(vars.lineName, "Конверсия");
        var src = str(vars.source, "Источник: внутренняя аналитика");
        document.getElementById("dch-src").textContent = src;
        if (!src) document.getElementById("dch-src").style.display = "none";

        var labels = list(str(vars.labels, "") || "Янв;Фев;Мар;Апр;Май;Июн");
        var rawVals = list(str(vars.values, "") || "8;12;15;11;18;22");
        var rawLine = list(str(vars.lineValues, "2,1;2,8;3,2;2,9;3,8;4,2"));
        var n = Math.min(labels.length, rawVals.length, 7);
        var vals = rawVals.slice(0, n).map(num);
        var hasLine = rawLine.length >= n && n > 1;
        var lineVals = hasLine ? rawLine.slice(0, n).map(num) : [];
        if (!hasLine) document.getElementById("dch-key-line-item").style.display = "none";
        var lSuf = str(vars.lineSuffix, "%");

        /* chart box: what is left of the field once the words are laid out */
        
        var CW = 1600, CH = 560, FS = 30;
        
        
        var svg = document.getElementById("dch-svg");
        svg.setAttribute("width", CW);
        svg.setAttribute("height", CH);
        svg.setAttribute("viewBox", "0 0 " + CW + " " + CH);
        svg.style.marginTop = "28px";
        var NS = "http://www.w3.org/2000/svg";
        function el(tag, attrs, text) {
          var e = document.createElementNS(NS, tag);
          for (var k in attrs) {
            if (k === "fill" || k === "stroke") e.style[k] = attrs[k];
            else e.setAttribute(k, attrs[k]);
          }
          if (text != null) e.textContent = text;
          svg.appendChild(e);
          return e;
        }

        /* labels under the bars: the size fits the slot, never under 28; if 28 still does not fit, two staggered rows */
        var slot = CW / n;
        var maxLen = Math.max.apply(null, labels.slice(0, n).map(function (t) { return t.length; }));
        var LFS = Math.min(FS, Math.floor((slot - 12) / (maxLen * 0.7)));
        var rows = LFS < 28 && n > 1 ? 2 : 1;
        if (LFS < 28) LFS = 28;
        var base = CH - rows * (LFS + 8) - 10;
        var plotH = base;
        var lineBand = hasLine ? 0.2 : 0;
        var barFrac = hasLine ? Math.min(0.6, 1 - lineBand - (FS * 3 + 70) / plotH) : 1 - (FS + 24) / plotH;
        var maxV = Math.max.apply(null, vals.concat([0.0001]));
        var barW = Math.min(slot * 0.62, 130);
        function cx(i) {
          return slot * (i + 0.5);
        }
        function barH(i) {
          return Math.max(0, (vals[i] / maxV) * plotH * barFrac);
        }
        var lMin = Math.min.apply(null, lineVals.length ? lineVals : [0]);
        var lMax = Math.max.apply(null, lineVals.length ? lineVals : [1]);
        function ly(i) {
          var t = lMax === lMin ? 0.5 : (lineVals[i] - lMin) / (lMax - lMin);
          return FS + 22 + (1 - t) * plotH * lineBand;
        }

        var grid = [];
        for (var g = 1; g <= 4; g++) {
          var y = base - (g / 4) * plotH * (hasLine ? barFrac : barFrac);
          grid.push(el("line", { x1: 0, x2: CW, y1: y, y2: y, stroke: "var(--border, #2e2e32)", "stroke-width": 2, opacity: 0 }));
        }
        var bars = [],
          barLabels = [],
          lineLabels = [];
        for (var i = 0; i < n; i++) {
          el("text", { x: cx(i), y: base + LFS + 8 + (rows === 2 && i % 2 ? LFS + 8 : 0), "text-anchor": "middle", "font-size": LFS, fill: "var(--muted, #8a8a90)" }, labels[i]);
          bars.push(el("rect", { x: cx(i) - barW / 2, y: base, width: barW, height: 0, fill: "var(--muted, #8a8a90)" }));
          barLabels.push(
            el("text", { x: cx(i), y: base - barH(i) - 14, "text-anchor": "middle", "font-size": FS, "font-weight": 600, fill: "var(--fg, #f2f2f2)", opacity: 0 }, rawVals[i]),
          );
        }
        el("line", { x1: 0, x2: CW, y1: base, y2: base, stroke: "var(--fg, #f2f2f2)", "stroke-width": 2 });

        var path = null,
          dot = null;
        if (hasLine) {
          var pts = [];
          for (var j = 0; j < n; j++) pts.push(cx(j) + "," + ly(j));
          path = el("path", { d: "M " + pts.join(" L "), fill: "none", stroke: "var(--accent, #ff0000)", "stroke-width": 5, "stroke-linejoin": "round" });
          var len = path.getTotalLength();
          path.style.strokeDasharray = len;
          path.style.strokeDashoffset = len;
          for (var k = 0; k < n; k++) {
            /* a point lower than its neighbours carries its value under it, off the line */
            var dip = (k === 0 || lineVals[k] < lineVals[k - 1]) && (k === n - 1 || lineVals[k] < lineVals[k + 1]) && n > 1;
            lineLabels.push(
              el("text", { x: cx(k), y: dip ? ly(k) + FS + 14 : ly(k) - 18, "text-anchor": "middle", "font-size": FS, "font-weight": 700, fill: "var(--accent, #ff0000)", "class": "dch-halo", opacity: 0 }, rawLine[k] + lSuf),
            );
          }
          dot = el("circle", { r: 9, cx: cx(0), cy: ly(0), fill: "var(--accent, #ff0000)", opacity: 0 });
        }

        /* authored motion */
        var tl = gsap.timeline({ paused: true });
        tl.to("#dch-title", { clipPath: "inset(-0.3em 0% -0.3em 0)", duration: 0.9, ease: "power1.inOut" }, 0);
        tl.to("#dch-sub", { clipPath: "inset(-0.3em 0% -0.3em 0)", duration: 0.9, ease: "power1.inOut" }, 0.15);
        tl.to("#dch-key", { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.6);
        tl.to(grid, { opacity: 1, duration: 0.3, stagger: 0.08, ease: "power2.out" }, 0.4);
        var tBars = 0.8;
        bars.forEach(function (b, i) {
          var t = tBars + i * 0.3;
          tl.to(b, { attr: { height: barH(i), y: base - barH(i) }, duration: 0.6, ease: "power2.out" }, t);
          tl.to(barLabels[i], { opacity: 1, duration: 0.25, ease: "power2.out" }, t + 0.45);
        });
        var tLine = tBars + (n - 1) * 0.3 + 0.7;
        var BEATS = [0, tBars];
        if (hasLine) {
          BEATS.push(tLine);
          var seg = 1.6 / (n - 1);
          tl.set(dot, { opacity: 1 }, tLine);
          tl.to(path, { strokeDashoffset: 0, duration: 1.6, ease: "none" }, tLine);
          for (var m = 0; m < n; m++) {
            if (m > 0) tl.to(dot, { attr: { cx: cx(m), cy: ly(m) }, duration: seg, ease: "none" }, tLine + (m - 1) * seg);
            tl.to(lineLabels[m], { opacity: 1, duration: 0.2, ease: "power2.out" }, tLine + m * seg + 0.05);
          }
        }
        tl.to("#dch-src", { opacity: 1, duration: 0.4, ease: "power2.out" }, (hasLine ? tLine + 1.6 : tBars + n * 0.3 + 0.4) + 0.2);
        tl.set({}, {}, 30);

        /* cues: each stretch of the authored motion runs at the speed that lands its beat on its cue */
        var exit = oneOf(vars.exit, ["none", "fade"], "none");
        var cues = String(vars.cues || "")
          .split(",")
          .map(function (v) {
            return parseFloat(v);
          });
        var at = BEATS.map(function (b, i) {
          return isFinite(cues[i]) ? cues[i] : i === 0 ? b : NaN;
        });
        for (var q = 1; q < at.length; q++) if (!isFinite(at[q])) at[q] = at[q - 1] + (BEATS[q] - BEATS[q - 1]);
        if (
          !at.every(function (x, i) {
            return x >= 0 && (i === 0 || x > at[i - 1]);
          })
        )
          at = BEATS.slice();
        var master = gsap.timeline({ paused: true });
        var from = 0;
        BEATS.forEach(function (b, i) {
          master.to(tl, { time: b, duration: Math.max(at[i] - from, 0.001), ease: "none" }, from);
          from = at[i];
        });
        var last = BEATS[BEATS.length - 1];
        master.to(tl, { time: 30, duration: 30 - last, ease: "none" }, from);
        if (exit === "fade") master.to("#dch-box", { autoAlpha: 0, duration: 0.4, ease: "power2.in" }, isFinite(cues[3]) ? cues[3] : from + 3);
        master.set({}, {}, 30);
        window.__timelines = window.__timelines || {};
        window.__timelines["data-chart"] = master;
      })();
    </script>
  </body>
</html>
