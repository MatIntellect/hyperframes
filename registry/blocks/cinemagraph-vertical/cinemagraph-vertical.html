<!doctype html>
<html
  lang="ru"
  data-composition-variables='[
    { "id": "placement", "type": "enum", "role": "layout", "label": "Placement", "description": "full: the still scene to the frame edge, enlarged so the cup and its steam sit centred on the field (y 770). top / bottom: the scene on a 780x760 card at y 180-940 / 600-1360, rest of the frame transparent.", "default": "full", "options": [{ "value": "full", "label": "Full screen" }, { "value": "top", "label": "Top" }, { "value": "bottom", "label": "Bottom" }] },
    { "id": "loop", "type": "string", "role": "content", "label": "Loop video", "description": "Project path of a muted looping video (e.g. assets/loop.mp4), the base layer that lives inside the window; it repeats to the end of the mount. Empty keeps the drawn cup with rising steam.", "default": "" },
    { "id": "still", "type": "image", "role": "content", "label": "Freeze-frame", "description": "The first frame of the loop video as an image; it covers the frame except the window, so only the window moves. Empty with a loop video – the loop plays over the whole frame.", "default": "" },
    { "id": "wx", "type": "number", "role": "layout", "label": "Window centre x", "description": "Centre of the living window, % of the frame width (in the vertical card – of the card).", "default": 50, "min": 0, "max": 100, "step": 1, "unit": "%" },
    { "id": "wy", "type": "number", "role": "layout", "label": "Window centre y", "description": "Centre of the living window, % of the frame height.", "default": 40, "min": 0, "max": 100, "step": 1, "unit": "%" },
    { "id": "ww", "type": "number", "role": "layout", "label": "Window width", "description": "Width of the living window, % of the frame width.", "default": 30, "min": 5, "max": 100, "step": 1, "unit": "%" },
    { "id": "wh", "type": "number", "role": "layout", "label": "Window height", "description": "Height of the living window, % of the frame height.", "default": 40, "min": 5, "max": 100, "step": 1, "unit": "%" },
    { "id": "feather", "type": "number", "role": "style", "label": "Window feather", "description": "Soft edge of the window, % of its radius: 0 – hard oval edge, 100 – fades from the centre.", "default": 40, "min": 0, "max": 100, "step": 1, "unit": "%" },
    { "id": "cues", "type": "string", "role": "timing", "label": "Cues", "description": "Seconds from mount start when the scene fades out (only when exit is fade; empty – 9.5 s, the end of the first 10 s loop). The steam loops every 10 s.", "default": "" },
    { "id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "none holds the looping scene to the end of the mount; fade fades it out.", "default": "none", "options": [{ "value": "none", "label": "Hold" }, { "value": "fade", "label": "Fade" }] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!--
      cinemagraph — a still photograph with ONE living region.

      The frame is a frozen scene; a single masked window keeps moving — the classic
      cinemagraph gesture: the camera stops, the world keeps breathing. The living
      region here is the steam over a cup, drawn deterministically on a canvas from
      the seek time alone, with a period that divides the duration, so the last
      frame matches the first and the render loops seamlessly.

      Using it with real media: keep the structure and swap the layers —
        1. Put your looping <video> (or the animated source) as the BASE layer.
        2. Put a freeze-frame still of it (an <img>) ABOVE, full-frame.
        3. Move #cmg-window (the feathered mask) onto the still so the window
           reveals the video beneath, and delete the placeholder scene + canvas.
      One living region per frame. Two is a gif.
    -->
    <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        background: transparent;
        overflow: hidden;
      }
      #cmgv-root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        --hf-ink: var(--fg, #f2f2f2);
      }
      /* рамка кадра: весь кадр, в вертикали top/bottom – карточка */
      #cmgv-clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: var(--bg, #0c1014);
      }
      
      #cmgv-clip.cmgv-card {
        left: 150px;
        width: 780px;
        height: 760px;
        top: 180px;
        border-radius: 32px;
        border: 2px solid var(--border, #2e2e32);
      }
      #cmgv-clip.cmgv-bottom {
        top: 600px;
      }
      
      /* сцена разработчиков 1920x1080; в вертикали увеличена или уменьшена целиком */
      #cmgv-scene {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        transform-origin: 0 0;
      }
      /* ---- the still photograph (placeholder scene, monochrome ink ramp) ---- */
      .cmg-photo {
        position: absolute;
        inset: 0;
      }
      /* window light falling across the scene */
      .cmg-lightfall {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          115deg,
          color-mix(in srgb, var(--hf-ink) 8%, transparent) 0%,
          transparent 46%
        );
      }
      /* table surface */
      .cmg-table {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 320px;
        
        bottom: -200px;
        height: 520px; /* в вертикали стол уходит за нижний край кадра */
        
        background: color-mix(in srgb, var(--hf-ink) 8%, transparent);
        border-top: 1px solid color-mix(in srgb, var(--hf-ink) 14%, transparent);
      }
      /* window frame in the far wall */
      .cmg-pane {
        position: absolute;
        left: 1210px;
        top: 130px;
        width: 420px;
        height: 520px;
        background: color-mix(in srgb, var(--hf-ink) 18%, transparent);
        border: 1px solid color-mix(in srgb, var(--hf-ink) 14%, transparent);
      }
      .cmg-pane::before,
      .cmg-pane::after {
        content: "";
        position: absolute;
        background: color-mix(in srgb, var(--hf-ink) 14%, transparent);
      }
      .cmg-pane::before {
        left: 50%;
        top: 0;
        bottom: 0;
        width: 1px;
      }
      .cmg-pane::after {
        top: 50%;
        left: 0;
        right: 0;
        height: 1px;
      }
      /* saucer + cup, the photograph's subject */
      .cmg-saucer {
        position: absolute;
        left: 760px;
        bottom: 236px;
        width: 400px;
        height: 56px;
        border-radius: 50%;
        background: color-mix(in srgb, var(--hf-ink) 45%, transparent);
      }
      .cmg-cup {
        position: absolute;
        left: 830px;
        bottom: 262px;
        width: 260px;
        height: 190px;
        border-radius: 0 0 118px 118px;
        background: color-mix(in srgb, var(--hf-ink) 72%, transparent);
      }
      .cmg-cup::after {
        content: "";
        position: absolute;
        right: -64px;
        top: 18px;
        width: 88px;
        height: 96px;
        border: 22px solid color-mix(in srgb, var(--hf-ink) 72%, transparent);
        border-radius: 50%;
      }
      .cmg-rim {
        position: absolute;
        left: 822px;
        bottom: 436px;
        width: 276px;
        height: 34px;
        border-radius: 50%;
        background: color-mix(in srgb, var(--hf-ink) 45%, transparent);
      }
      /* a closed book beside the cup */
      .cmg-book {
        position: absolute;
        left: 1180px;
        bottom: 250px;
        width: 330px;
        height: 44px;
        background: color-mix(in srgb, var(--hf-ink) 18%, transparent);
        border: 1px solid color-mix(in srgb, var(--hf-ink) 14%, transparent);
        transform: rotate(-2deg);
      }
      .cmg-book::after {
        content: "";
        position: absolute;
        left: 14px;
        right: 14px;
        top: 12px;
        height: 1px;
        background: color-mix(in srgb, var(--hf-ink) 14%, transparent);
      }
      /* skeleton caption lines, bottom left — content lives here */
      .cmg-line {
        position: absolute;
        left: 160px;
        height: 22px;
        border-radius: 11px;
        background: color-mix(in srgb, var(--hf-ink) 18%, transparent);
      }
      /* ---- the ONE living region: a feathered window where steam moves ---- */
      #cmg-window {
        position: absolute;
        left: 790px;
        bottom: 430px;
        width: 340px;
        height: 420px;
        -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 55%, #000 55%, transparent 78%);
        mask-image: radial-gradient(ellipse 50% 50% at 50% 55%, #000 55%, transparent 78%);
      }
      #cmg-canvas {
        position: absolute;
        inset: 0;
        width: 340px;
        height: 420px;
      }
      /* still vignette over everything, part of the photograph */
      .cmg-vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse 78% 72% at 50% 46%,
          transparent 62%,
          rgb(0 0 0 / 50%) 100%
        );
        pointer-events: none;
      }
      /* своё видео: петля под стоп-кадром, окно движения прорезано в стоп-кадре (родной способ из комментария выше) */
      #cmgv-loop,
      #cmgv-still {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div id="cmgv-root" data-composition-id="cinemagraph-vertical" data-start="0" data-duration="30" data-width="1080" data-height="1920">
      <div id="cmgv-clip">
        <div id="cmgv-scene" data-layout-allow-overflow>
          <div class="cmg-photo" id="cmg-photo">
            <div class="cmg-lightfall"></div>
            <div class="cmg-pane"></div>
            <div class="cmg-table"></div>
            <div class="cmg-saucer"></div>
            <div class="cmg-cup"></div>
            <div class="cmg-rim"></div>
            <div class="cmg-book"></div>
            <div class="cmg-line" style="bottom: 150px; width: 460px"></div>
            <div class="cmg-line" style="bottom: 108px; width: 300px"></div>
          </div>
          <div id="cmg-window">
            <canvas id="cmg-canvas" width="340" height="420"></canvas>
          </div>
        </div>
        <div class="cmg-vignette"></div>
        <video id="cmgv-loop" class="clip" data-var-src="loop" data-start="0" data-duration="30" data-track-index="1" muted playsinline loop></video>
        <img id="cmgv-still" data-var-src="still" alt="" />
      </div>
      <div
        id="drv-cmgv"
        class="clip"
        data-start="0"
        data-duration="30"
        data-track-index="0"
        style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none"
      ></div>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var V =
          window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
            ? window.__hyperframes.getVariables()
            : {};
        var clip = document.getElementById("cmgv-clip"),
          scene = document.getElementById("cmgv-scene");
        
        // середина чашки с паром у разработчиков – (960, 537); ставим её в середину поля или карточки
        var placement = ["full", "top", "bottom"].indexOf(V.placement) >= 0 ? V.placement : "full";
        var card = placement !== "full";
        if (card) clip.classList.add("cmgv-card");
        if (placement === "bottom") clip.classList.add("cmgv-bottom");
        // карточка: чашка с паром (~550 по высоте у разработчиков, середина ~571) крупно в 760 – масштаб 1,2, середина на 380
        var S = card ? 1.2 : 1920 / 1080,
          AX = card ? 388 : 540,
          AY = card ? 360 : 770;
        scene.style.transform = "translate(" + (AX - 960 * S) + "px," + (AY - 537 * S) + "px) scale(" + S + ")";
        
        // своё видео: петля под стоп-кадром, в стоп-кадре – мягкое овальное окно; без видео – родная сцена с паром
        var loopEl = document.getElementById("cmgv-loop"),
          stillEl = document.getElementById("cmgv-still");
        var hasLoop = typeof V.loop === "string" && V.loop.trim() !== "";
        var stillUrl = V.still && typeof V.still === "object" ? V.still.url : V.still;
        if (!hasLoop) loopEl.remove();
        if (!hasLoop || !stillUrl) stillEl.remove();
        if (hasLoop) {
          scene.style.display = "none";
          clip.querySelector(".cmg-vignette").style.display = "none";
        }
        if (hasLoop && stillUrl) {
          var num = function (v, d, lo, hi) {
            v = parseFloat(v);
            return isFinite(v) ? Math.min(hi, Math.max(lo, v)) : d;
          };
          var wx = num(V.wx, 50, 0, 100),
            wy = num(V.wy, 40, 0, 100),
            ww = num(V.ww, 30, 5, 100),
            wh = num(V.wh, 40, 5, 100),
            fe = num(V.feather, 40, 0, 100);
          var mask =
            "radial-gradient(ellipse " + ww / 2 + "% " + wh / 2 + "% at " + wx + "% " + wy + "%, transparent " + (100 - fe) + "%, #000 100%)";
          stillEl.style.webkitMaskImage = mask;
          stillEl.style.maskImage = mask;
        }

        // цвет пара – из темы (у разработчиков тот же светлый цвет, что у предметов)
        var probe = document.createElement("i");
        probe.style.color = "var(--fg, #f2f2f2)";
        clip.appendChild(probe);
        var INK = (getComputedStyle(probe).color.match(/\d+/g) || [242, 242, 242]).slice(0, 3).join(",");
        probe.remove();

        // Seeded PRNG — never Math.random()
        function mulberry32(a) {
          return function () {
            a |= 0;
            a = (a + 0x6d2b79f5) | 0;
            var t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }
        var rng = mulberry32(1897);

        var DUR = 10;
        // Each wisp cycles an integer number of times over DUR, so the frame at
        // t = DUR equals the frame at t = 0 and the render loops seamlessly.
        var WISPS = [];
        for (var i = 0; i < 14; i++) {
          WISPS.push({
            x0: 90 + rng() * 160, // birth x inside the window
            cycles: 1 + Math.floor(rng() * 2), // 1 or 2 full rises over DUR
            phase: rng(), // where in its cycle it starts
            sway: 14 + rng() * 26, // horizontal sway amplitude
            swayFreq: 1 + Math.floor(rng() * 2), // integer — keeps the loop seam clean
            width: 10 + rng() * 22, // wisp thickness
            rise: 300 + rng() * 80, // how far it climbs before dissolving
            alpha: 0.05 + rng() * 0.09,
          });
        }

        var canvas = document.getElementById("cmg-canvas");
        var ctx = canvas.getContext("2d");
        var W = 340,
          H = 420;

        // State proxy — GSAP animates t, the render function reads it.
        var st = { t: 0 };

        function renderScene() {
          ctx.clearRect(0, 0, W, H);
          for (var i = 0; i < WISPS.length; i++) {
            var w = WISPS[i];
            // p in [0,1): this wisp's position in its own rise cycle
            var p = ((st.t % DUR) / DUR) * w.cycles + w.phase;
            p = p - Math.floor(p);
            var y = H - 40 - p * w.rise;
            var sway = Math.sin(2 * Math.PI * (p * w.swayFreq + w.phase)) * w.sway * p;
            var x = w.x0 + sway;
            // born faint, fullest mid-rise, dissolves at the top
            var a = w.alpha * Math.sin(Math.PI * p);
            var r = w.width * (0.7 + p * 1.6);
            var g = ctx.createRadialGradient(x, y, 0, x, y, r * 2.4);
            g.addColorStop(0, "rgba(" + INK + "," + a.toFixed(4) + ")");
            g.addColorStop(1, "rgba(" + INK + ",0)");
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.ellipse(x, y, r * 1.1, r * 2.2, sway * 0.004, 0, 2 * Math.PI);
            ctx.fill();
          }
        }

        // пар считается от времени по модулю 10 с – петля повторяется весь показ
        var tl = gsap.timeline({ paused: true });
        tl.to(st, { t: 30, duration: 30, ease: "none" }, 0);
        if (V.exit === "fade") {
          var c1 = parseFloat(String(V.cues || "").split(",")[0]);
          tl.to(clip, { opacity: 0, duration: 0.5, ease: "power2.in" }, isFinite(c1) && c1 > 0 ? c1 : 9.5);
        }

        window.__timelines["cinemagraph-vertical"] = tl;

        // Render from the timeline only — no requestAnimationFrame.
        tl.eventCallback("onUpdate", renderScene);
        renderScene();
      })();
    </script>
  </body>
</html>
