<!doctype html>
<html
  lang="ru"
  data-composition-variables='[
    { "id": "shareTitle", "type": "string", "role": "content", "label": "Sheet title", "description": "Heading at the top of the share sheet.", "maxLength": 20, "default": "Поделиться" },
    { "id": "senderName", "type": "string", "role": "content", "label": "Sender", "description": "Who offers the item, bold, before \"хочет поделиться\".", "maxLength": 16, "default": "MatIntellect" },
    { "id": "itemLabel", "type": "string", "role": "content", "label": "Item", "description": "What is offered, after \"хочет поделиться\".", "maxLength": 14, "default": "видео" },
    { "id": "stripText", "type": "string", "role": "content", "label": "Brand strip", "description": "Small caps line beside the logo under the preview.", "maxLength": 24, "default": "MATINTELLECT.COM" },
    { "id": "acceptLabel", "type": "string", "role": "content", "label": "Accept label", "description": "Right-hand action button.", "maxLength": 12, "default": "Принять" },
    { "id": "declineLabel", "type": "string", "role": "content", "label": "Decline label", "description": "Left-hand action button.", "maxLength": 12, "default": "Отклонить" },
    { "id": "slideImage1", "type": "image", "role": "content", "label": "Slide image 1", "description": "First carousel image; also fills the blurred ground.", "default": "assets/slide-01.jpg" },
    { "id": "slideImage2", "type": "image", "role": "content", "label": "Slide image 2", "description": "Second carousel image.", "default": "assets/slide-02.jpg" },
    { "id": "slideImage3", "type": "image", "role": "content", "label": "Slide image 3", "description": "Third carousel image.", "default": "assets/slide-03.jpg" },
    { "id": "slideImage4", "type": "image", "role": "content", "label": "Slide image 4", "description": "Fourth carousel image.", "default": "assets/slide-04.jpg" },
    { "id": "brandLogo", "type": "image", "role": "content", "label": "Brand logo", "description": "Transparent brand mark in the preview strip, 56 px tall (square or horizontal).", "default": "assets/img/matintellect-mark.svg" },
    { "id": "cues", "type": "string", "role": "timing", "label": "Cues", "description": "Comma-separated seconds from mount start: 1 the sheet springs up, 2 the previews start cutting, 3 the accept tap, 4 the sheet leaves (only when exit is not none). Each stretch of the authored motion is sped up or slowed to land on its cue. Empty keeps 0.06, 0.99, 6.32.", "default": "" },
    { "id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "none holds the accepted sheet to the end of the mount.", "default": "none", "options": [{ "value": "none", "label": "Hold" }, { "value": "fade", "label": "Fade" }] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Share-Sheet Carousel</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: transparent;
        overflow: hidden;
      }
      #ssc-root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
        font-family: "Inter", sans-serif;
      }
      #ssc-scene {
        position: absolute;
        inset: 0;
      }

      /* ---------------- fullscreen grounds ---------------- */
      /* the ground behind the sheet is the current slide blown up and blurred,
         exactly as the source footage was */
      .ssc-bg {
        position: absolute;
        left: -80px;
        top: -80px;
        width: 2080px;
        height: 1240px;
        object-fit: cover;
        filter: blur(46px) saturate(1.1) brightness(0.88);
      }

      /* ---------------- the share sheet ---------------- */
      /* geometry measured from the reference: 668x974 card at (206,473),
         spring entry sampled frame-by-frame (spec provenance: measured) */
      #ssc-card {
        position: absolute;
        left: 206px;
        top: 473px;
        width: 668px;
        height: 974px;
        background: #f9f9f9;
        border-radius: 34px;
        box-shadow: 0 18px 42px rgba(0, 0, 0, 0.28);
        opacity: 0;
      }
      #ssc-cardclipper {
        position: absolute;
        inset: 0;
        border-radius: 34px;
        overflow: hidden;
      }
      #ssc-title {
        position: absolute;
        top: 49px;
        left: 0;
        width: 100%;
        text-align: center;
        font-size: 44px;
        font-weight: 600;
        color: #101010;
        line-height: 44px;
        letter-spacing: 0.2px;
      }
      #ssc-subtitle {
        position: absolute;
        top: 117px;
        left: 0;
        width: 100%;
        text-align: center;
        font-size: 29px;
        font-weight: 400;
        color: #313131;
        line-height: 29px;
      }
      #ssc-subtitle b {
        font-weight: 700;
      }
      #ssc-imagebox {
        position: absolute;
        left: 43px;
        top: 191px;
        width: 582px;
        height: 632px;
        border-radius: 24px;
        overflow: hidden;
      }
      .ssc-slide {
        position: absolute;
        left: 0;
        top: 0;
        width: 582px;
        height: 476px;
        object-fit: cover;
      }
      /* the brand strip riding the bottom of the preview, as the reference had */
      #ssc-strip {
        position: absolute;
        left: 0;
        top: 476px;
        width: 582px;
        height: 156px;
        background: #f2ecdf;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 14px;
      }
      #ssc-strip img {
        height: 56px;
        display: block;
      }
      #ssc-strip-text {
        font-size: 28px;
        font-weight: 600;
        letter-spacing: 2px;
        white-space: nowrap;
        color: #4a4438;
        text-transform: uppercase;
      }
      #ssc-hdivider {
        position: absolute;
        left: 0;
        top: 859px;
        width: 100%;
        height: 1.5px;
        background: #dfdfdf;
      }
      #ssc-vdivider {
        position: absolute;
        left: 333px;
        top: 861px;
        width: 1.5px;
        bottom: 0;
        background: #dfdfdf;
      }
      #ssc-presscell {
        position: absolute;
        left: 335px;
        top: 861px;
        right: 0;
        bottom: 0;
        background: #e9e9e9;
        border-radius: 0 0 34px 0;
        opacity: 0;
      }
      .ssc-btn {
        position: absolute;
        top: 861px;
        bottom: 0;
        display: grid;
        place-items: center;
        font-size: 34px;
      }
      #ssc-decline {
        left: 0;
        width: 333px;
        color: #6f6f73;
        font-weight: 400;
      }
      #ssc-root.ssc-full #ssc-card {
        top: 283px;
      }
      #ssc-root.ssc-top #ssc-card,
      #ssc-root.ssc-bottom #ssc-card {
        top: 160px;
        left: 626px;
        height: 760px;
      }
      #ssc-root.ssc-bottom #ssc-card {
        top: 600px;
      }
      #ssc-root.ssc-top #ssc-imagebox,
      #ssc-root.ssc-bottom #ssc-imagebox {
        height: 418px;
      }
      #ssc-root.ssc-top .ssc-slide,
      #ssc-root.ssc-bottom .ssc-slide {
        height: 300px;
      }
      #ssc-root.ssc-top #ssc-strip,
      #ssc-root.ssc-bottom #ssc-strip {
        top: 300px;
        height: 118px;
      }
      #ssc-root.ssc-top #ssc-hdivider,
      #ssc-root.ssc-bottom #ssc-hdivider {
        top: 645px;
      }
      #ssc-root.ssc-top #ssc-vdivider,
      #ssc-root.ssc-bottom #ssc-vdivider,
      #ssc-root.ssc-top #ssc-presscell,
      #ssc-root.ssc-bottom #ssc-presscell,
      #ssc-root.ssc-top .ssc-btn,
      #ssc-root.ssc-bottom .ssc-btn {
        top: 647px;
      }
      #ssc-accept {
        left: 335px;
        right: 0;
        color: var(--hf-ui-accent, #087a57);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div
      id="ssc-root"
      data-composition-id="share-sheet-carousel-landscape"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="30"
      data-fps="30"
    >
      <section id="ssc-scene" class="clip" data-start="0" data-duration="30" data-track-index="1">
        <img
          class="ssc-bg"
          id="ssc-bg-1"
          data-var-src="slideImage1"
          src="assets/slide-01.jpg"
          alt=""
          style="opacity: 1"
        />
        <img
          class="ssc-bg"
          id="ssc-bg-2"
          data-var-src="slideImage2"
          src="assets/slide-02.jpg"
          alt=""
          style="opacity: 0"
        />
        <img
          class="ssc-bg"
          id="ssc-bg-3"
          data-var-src="slideImage3"
          src="assets/slide-03.jpg"
          alt=""
          style="opacity: 0"
        />
        <img
          class="ssc-bg"
          id="ssc-bg-4"
          data-var-src="slideImage4"
          src="assets/slide-04.jpg"
          alt=""
          style="opacity: 0"
        />
        <div id="ssc-card">
          <div id="ssc-cardclipper">
            <div id="ssc-title">Поделиться</div>
            <div id="ssc-subtitle"><b>MatIntellect</b> хочет поделиться видео</div>
            <div id="ssc-imagebox">
              <img
                class="ssc-slide"
                id="ssc-slide-1"
                data-var-src="slideImage1"
                src="assets/slide-01.jpg"
                alt=""
                style="opacity: 1"
              />
              <img
                class="ssc-slide"
                id="ssc-slide-2"
                data-var-src="slideImage2"
                src="assets/slide-02.jpg"
                alt=""
                style="opacity: 0"
              />
              <img
                class="ssc-slide"
                id="ssc-slide-3"
                data-var-src="slideImage3"
                src="assets/slide-03.jpg"
                alt=""
                style="opacity: 0"
              />
              <img
                class="ssc-slide"
                id="ssc-slide-4"
                data-var-src="slideImage4"
                src="assets/slide-04.jpg"
                alt=""
                style="opacity: 0"
              />
              <div id="ssc-strip">
                <img
                  data-var-src="brandLogo"
                  src="assets/img/matintellect-mark.svg"
                  alt="Brand logo"
                />
                <div id="ssc-strip-text">MATINTELLECT.COM</div>
              </div>
            </div>
            <div id="ssc-hdivider"></div>
            <div id="ssc-presscell"></div>
            <div id="ssc-vdivider"></div>
            <div id="ssc-decline" class="ssc-btn">Отклонить</div>
            <div id="ssc-accept" class="ssc-btn">Принять</div>
          </div>
        </div>
      </section>
    </div>
    <script>
      (function () {
        "use strict";

        /* -------- variables -------- */
        var vars =
          window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
            ? window.__hyperframes.getVariables()
            : {};

        function text(value, fallback) {
          return typeof value === "string" && value.trim() ? value : fallback;
        }
        function oneOf(v, list, d) {
          return list.indexOf(v) >= 0 ? v : d;
        }
        var root = document.getElementById("ssc-root");
        root.classList.add("ssc-top");

        document.getElementById("ssc-title").textContent = text(vars.shareTitle, "Поделиться");
        var subtitle = document.getElementById("ssc-subtitle");
        subtitle.innerHTML = "";
        var sender = document.createElement("b");
        sender.textContent = text(vars.senderName, "MatIntellect");
        subtitle.appendChild(sender);
        subtitle.appendChild(
          document.createTextNode(" хочет поделиться " + text(vars.itemLabel, "видео")),
        );
        document.getElementById("ssc-strip-text").textContent = text(
          vars.stripText,
          "MATINTELLECT.COM",
        );
        document.getElementById("ssc-decline").textContent = text(vars.declineLabel, "Отклонить");
        document.getElementById("ssc-accept").textContent = text(vars.acceptLabel, "Принять");

        /* -------- timeline: spring entry and cut rhythm measured from the reference -------- */
        var tl = gsap.timeline({ paused: true });

        tl.set("#ssc-card", { y: 1450, autoAlpha: 0 }, 0.001);
        tl.set("#ssc-presscell", { autoAlpha: 0 }, 0.001);

        /* sheet spring-up: frame-sampled from the reference, kept verbatim */
        var SPRING = [
          [0.056667, 1198, 0.13],
          [0.09, 903, 0.21],
          [0.123333, 648, 0.36],
          [0.156667, 437, 0.43],
          [0.19, 262, 0.5],
          [0.223333, 120, 0.62],
          [0.256667, 8, 0.78],
          [0.29, -76, 0.89],
          [0.323333, -138, 1.0],
          [0.356667, -175, null],
          [0.39, -191, null],
          [0.423333, -192, null],
          [0.456667, -181, null],
          [0.49, -159, null],
          [0.523333, -131, null],
          [0.556667, -100, null],
          [0.59, -68, null],
          [0.623333, -41, null],
          [0.656667, -18, null],
          [0.69, -5, null],
          [0.723333, 0, null],
        ];
        SPRING.forEach(function (step) {
          var props = { y: step[1] };
          if (step[2] !== null) props.autoAlpha = step[2];
          tl.set("#ssc-card", props, step[0]);
        });

        /* cut rhythm: fourteen swaps, cycling the four stills */
        var SLIDE_COUNT = 4;
        var CUTS = [
          0.99, 1.356667, 1.69, 2.023333, 2.356667, 2.69, 3.09, 3.456667, 3.79, 4.123333, 4.456667,
          4.79, 5.156667,
        ];
        var current = 0;
        CUTS.forEach(function (t, i) {
          var next = (i + 1) % SLIDE_COUNT;
          tl.set(["#ssc-bg-" + (current + 1), "#ssc-slide-" + (current + 1)], { autoAlpha: 0 }, t);
          tl.set(["#ssc-bg-" + (next + 1), "#ssc-slide-" + (next + 1)], { autoAlpha: 1 }, t);
          current = next;
        });

        /* accept press: cell highlights and the card dips, then releases */
        tl.set("#ssc-card", { y: 3 }, 6.323333);
        tl.set("#ssc-presscell", { autoAlpha: 1 }, 6.323333);
        tl.set("#ssc-card", { y: 0 }, 6.656667);
        tl.set("#ssc-presscell", { autoAlpha: 0 }, 6.656667);
        tl.set({}, {}, 7.2333);

        /* cues: each stretch of the authored timeline runs at the speed that lands its beat on its cue */
        var exit = oneOf(vars.exit, ["none", "fade"], "none");
        var BEATS = [0.056667, 0.99, 6.323333];
        var cues = String(vars.cues || "")
          .split(",")
          .map(function (v) {
            return parseFloat(v);
          });
        var at = BEATS.map(function (b, i) {
          return isFinite(cues[i]) ? cues[i] : b;
        });
        var ordered = at.every(function (t, i) {
          return t >= 0 && (i === 0 || t > at[i - 1]);
        });
        if (!ordered) at = BEATS.slice();
        var master = gsap.timeline({ paused: true });
        var from = 0;
        BEATS.forEach(function (b, i) {
          master.to(tl, { time: b, duration: Math.max(at[i] - from, 0.001), ease: "none" }, from);
          from = at[i];
        });
        master.to(
          tl,
          { time: tl.duration(), duration: tl.duration() - BEATS[BEATS.length - 1], ease: "none" },
          from,
        );
        if (exit === "fade") {
          var out = isFinite(cues[3]) ? cues[3] : from + 1;
          master.to("#ssc-card", { autoAlpha: 0, duration: 0.4, ease: "power2.in" }, out);
        }
        master.set({}, {}, 30);

        window.__timelines = window.__timelines || {};
        window.__timelines["share-sheet-carousel-landscape"] = master;
      })();
    </script>
  </body>
</html>
