<!doctype html>
<html
  lang="ru"
  data-composition-variables='[
    { "id": "placement", "type": "enum", "role": "layout", "label": "Placement", "description": "full: own ground to the frame edge, the headline centred on the 780x1180 field (y 770), up to three lines. top / bottom: the same on a brand card 780x760 at y 180-940 / 600-1360, rest of the frame transparent.", "default": "full", "options": [{ "value": "full", "label": "Full screen" }, { "value": "top", "label": "Top" }, { "value": "bottom", "label": "Bottom" }] },
    { "id": "text", "type": "string", "role": "content", "label": "Headline", "description": "Montserrat, constant size; wraps between words (wide – up to two lines, vertical – up to three). Each letter keeps its own place, the crest of weight runs through them.", "maxLength": 28, "default": "МОНТАЖ БЕЗ СПЕШКИ" },
    { "id": "weightFrom", "type": "number", "role": "style", "label": "Weight (rest)", "description": "Montserrat weight of the letters the crest is not on.", "default": 200, "min": 100, "max": 900, "step": 10 },
    { "id": "weightTo", "type": "number", "role": "style", "label": "Weight (crest)", "description": "Montserrat weight at the top of the crest.", "default": 900, "min": 100, "max": 900, "step": 10 },
    { "id": "crestWidth", "type": "number", "role": "style", "label": "Crest width", "default": 4, "min": 1, "max": 24, "step": 0.5, "unit": "chars" },
    { "id": "sweepSpeed", "type": "number", "role": "style", "label": "Sweep speed", "default": 0.5, "min": 0.05, "max": 3, "step": 0.05, "unit": "passes/s" },
    { "id": "direction", "type": "enum", "role": "style", "label": "Direction", "default": "ltr", "options": [{ "value": "ltr", "label": "Left to right" }, { "value": "rtl", "label": "Right to left" }] },
    { "id": "cues", "type": "string", "role": "timing", "label": "Cues", "description": "Comma-separated seconds from mount start: 1 the headline fades in, 2 the block fades out (only when exit is fade). Empty keeps 0 and 5.6. The wave runs the whole mount.", "default": "" },
    { "id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "none holds the wave to the end of the mount; fade fades the block out.", "default": "none", "options": [{ "value": "none", "label": "Hold" }, { "value": "fade", "label": "Fade" }] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        background: transparent;
        overflow: hidden;
      }
      #wwvv-root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      /* заливка – на дочернем слое (у разработчиков: заливку на корне отрисовщик может потерять) */
      #wwvv-ground {
        position: absolute;
        inset: 0;
        background: var(--bg, #0c1014);
      }
      #wwvv-stage {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #wwvv-line {
        text-align: center;
        font-family: "Montserrat", sans-serif;
        line-height: 1.15;
        color: var(--fg, #f2f2f2);
        font-variation-settings: "wght" 200;
      }
      /* слово не рвётся; буква – своё место постоянной ширины (Montserrat не «двойной»:
         толщина меняет ширину, без постоянных мест строка дёргалась бы под гребнем) */
      .wwvv-word {
        display: inline-block;
        white-space: nowrap;
      }
      .wwvv-ch {
        display: inline-block;
        text-align: center;
      }
      
      
      #wwvv-line {
        width: 780px;
        font-size: 112px;
      }
      #wwvv-root.wwvv-card #wwvv-ground,
      #wwvv-root.wwvv-card #wwvv-stage {
        left: 150px;
        width: 780px;
        top: 180px;
        height: 760px;
      }
      #wwvv-root.wwvv-card #wwvv-ground {
        border-radius: 32px;
        border: 2px solid var(--border, #2e2e32);
      }
      #wwvv-root.wwvv-card.wwvv-bottom #wwvv-ground,
      #wwvv-root.wwvv-card.wwvv-bottom #wwvv-stage {
        top: 600px;
      }
      #wwvv-root.wwvv-card #wwvv-line {
        width: 700px;
        font-size: 96px;
      }
      
    </style>
  </head>
  <body>
    <div id="wwvv-root" data-composition-id="weight-wave-vertical" data-width="1080" data-height="1920" data-start="0" data-duration="30">
      <div id="wwvv-ground"></div>
      <div id="wwvv-stage">
        <div id="wwvv-line"></div>
      </div>
    </div>
    <script>
      // места букв меряются шрифтом бренда – строим после его загрузки (runtimes.md)
      document.fonts.load('900 100px "Montserrat"').then(function () {
        var V =
          window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
            ? window.__hyperframes.getVariables()
            : {};
        function oneOf(v, list, d) {
          return list.indexOf(v) >= 0 ? v : d;
        }
        function num(value, fallback, min, max) {
          var n = Number(value);
          if (!Number.isFinite(n)) n = fallback;
          return Math.min(max, Math.max(min, n));
        }
        var root = document.getElementById("wwvv-root"),
          line = document.getElementById("wwvv-line");
        
        var placement = oneOf(V.placement, ["full", "top", "bottom"], "full");
        if (placement !== "full") root.classList.add("wwvv-card", "wwvv-" + placement);
        

        var TEXT = typeof V.text === "string" && V.text.trim() ? V.text.trim() : "МОНТАЖ БЕЗ СПЕШКИ";
        // ось wght переменного Montserrat бренда – 100..900 (_fonts.css)
        var W_FROM = num(V.weightFrom, 200, 100, 900),
          W_TO = num(V.weightTo, 900, 100, 900),
          CREST = num(V.crestWidth, 4, 1, 24),
          SPEED = num(V.sweepSpeed, 0.5, 0.05, 3),
          RTL = V.direction === "rtl";

        // буква за буквой (пробел – тоже место, как у разработчиков: гребень идёт с постоянной скоростью);
        // ширина места – буква в самой толстой точке волны, шрифт постоянного кегля (spec.md:48 – не ужимается)
        var size = parseFloat(getComputedStyle(line).fontSize);
        var ctx = document.createElement("canvas").getContext("2d");
        ctx.font = Math.max(W_FROM, W_TO) + " " + size + 'px "Montserrat"';
        var spans = [],
          word = null;
        Array.prototype.slice.call(TEXT).forEach(function (ch) {
          var el = document.createElement("span");
          el.className = "wwvv-ch";
          el.textContent = ch === " " ? " " : ch;
          el.style.width = ctx.measureText(ch).width + "px";
          if (ch === " ") {
            word = null;
            line.appendChild(el);
            line.appendChild(document.createTextNode("​")); // перенос строки – только между словами
          } else {
            if (!word) {
              word = document.createElement("span");
              word.className = "wwvv-word";
              line.appendChild(word);
            }
            word.appendChild(el);
          }
          spans.push(el);
        });
        var N = spans.length;

        // волна – родная, замкнутой формулой от времени (без накопления: перемотка = проигрывание)
        var DUR = 30,
          state = { p: 0 },
          travel = N - 1 + 2 * CREST;
        function paint() {
          var pass = state.p * DUR * SPEED;
          var crest = -CREST + (pass - Math.floor(pass)) * travel;
          if (RTL) crest = N - 1 - crest;
          for (var i = 0; i < N; i++) {
            var f = Math.min(1, Math.max(0, 1 - Math.abs(i - crest) / CREST));
            spans[i].style.fontVariationSettings = '"wght" ' + Math.round(W_FROM + (W_TO - W_FROM) * f);
          }
        }

        var cues = String(V.cues || "")
          .split(",")
          .map(function (v) {
            return parseFloat(v);
          });
        var c0 = isFinite(cues[0]) && cues[0] >= 0 ? cues[0] : 0;
        var exit = oneOf(V.exit, ["none", "fade"], "none");

        var tl = gsap.timeline({ paused: true });
        tl.to(state, { p: 1, duration: DUR, ease: "none", onUpdate: paint }, 0);
        if (c0 > 0) tl.fromTo(line, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, c0);
        if (exit === "fade") tl.to(root, { opacity: 0, duration: 0.5, ease: "power2.in" }, isFinite(cues[1]) && cues[1] > c0 ? cues[1] : 5.6);
        paint();
        window.__timelines = window.__timelines || {};
        window.__timelines["weight-wave-vertical"] = tl;

        // ловушка разработчиков: без переменного шрифта все буквы одной толщины, и ничего не падает –
        // считаем краску на холсте при 100 и 900 и громко пишем в журнал
        var c = document.createElement("canvas");
        c.width = 1000;
        c.height = 160;
        var g = c.getContext("2d", { willReadFrequently: true });
        function ink(w) {
          g.clearRect(0, 0, c.width, c.height);
          g.font = w + ' 100px "Montserrat"';
          g.fillStyle = "#fff";
          g.fillText("HAMBURGEFONSTIV", 10, 120);
          var d = g.getImageData(0, 0, c.width, c.height).data,
            n = 0;
          for (var k = 3; k < d.length; k += 4) if (d[k] > 8) n++;
          return n;
        }
        var ok = document.fonts.check('100px "Montserrat"') && ink(900) > ink(100) * 1.2;
        root.setAttribute("data-ww-font", ok ? "ok" : "missing-axes");
        if (!ok) console.error("weight-wave: variable Montserrat (assets/fonts/montserrat-*.woff2, wght 100-900) did not load – every letter renders at one weight");
      });
    </script>
  </body>
</html>
