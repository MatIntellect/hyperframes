<!doctype html>
<html
  lang="ru"
  data-composition-variables='[
    { "id": "name", "type": "string", "role": "content", "label": "Name", "description": "Upper-case name, heavy, shadowed for footage; wraps to two lines in the vertical version.", "maxLength": 28, "default": "Мат Джестер" },
    { "id": "role", "type": "string", "role": "content", "label": "Role", "description": "Line under the red rule. Empty hides it.", "maxLength": 40, "default": "Основатель MatIntellect" },
    { "id": "cues", "type": "string", "role": "timing", "label": "Cues", "description": "Comma-separated seconds from mount start: 1 the name rises, the red rule draws and the role follows, 2 the plate leaves (only when exit is out). Empty keeps 0.1, 4.3.", "default": "" },
    { "id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "none holds the plate to the end of the mount; out plays its own leaving motion at cue 2.", "default": "none", "options": [{ "value": "none", "label": "Hold" }, { "value": "out", "label": "Leave" }] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+20BD, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: transparent;
        overflow: hidden;
      }
      body {
        width: 1920px;
        height: 1080px;
      }
      #lau-root {
        font-family: var(--font-body, "Montserrat"), sans-serif;
      }
      #lau-lt {
        position: absolute;
      }
      #lau-lt { display: flex; flex-direction: column; align-items: flex-start; gap: 14px; }
      #lau-name { font-weight: 800; color: #ffffff; line-height: 1; text-transform: uppercase; text-shadow: 0 2px 22px rgba(0, 0, 0, 0.55); }
      #lau-rule { height: 6px; width: 100%; background: var(--accent, #ff0000); border-radius: 3px; transform-origin: 0% 50%; }
      #lau-role { color: #f2f2f2; line-height: 1.2; text-shadow: 0 2px 22px rgba(0, 0, 0, 0.55); }
      
      #lau-lt {
        left: 120px;
        bottom: 116px;
      }
      #lau-name { font-size: 76px; white-space: nowrap; }
      #lau-role { font-size: 30px; white-space: nowrap; }
      
      
    </style>
  </head>
  <body>
    <div id="lau-root" data-composition-id="lt-accent-underline" data-width="1920" data-height="1080" data-start="0" data-duration="30">
      <div id="lau-lt">
        <div id="lau-name"></div>
        <div id="lau-rule"></div>
        <div id="lau-role"></div>
      </div>
    </div>
    <script>
      (function () {
        var root = document.getElementById("lau-root");
        var V =
          window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
            ? window.__hyperframes.getVariables()
            : {};
        function oneOf(v, list, d) {
          return list.indexOf(v) >= 0 ? v : d;
        }
        
        document.getElementById("lau-name").textContent = typeof V.name === "string" && V.name.trim() ? V.name : "Мат Джестер";
        var role = typeof V.role === "string" ? V.role : "Основатель MatIntellect";
        var roleEl = document.getElementById("lau-role");
        roleEl.textContent = role;
        if (!role) (document.getElementById("lau-rolebox") || roleEl).style.display = "none";

        var cues = String(V.cues || "")
          .split(",")
          .map(function (v) {
            return parseFloat(v);
          });
        var c0 = isFinite(cues[0]) && cues[0] >= 0 ? cues[0] : 0.1;
        var exit = oneOf(V.exit, ["none", "out"], "none");

        var tl = gsap.timeline({ paused: true });
        tl.fromTo("#lau-name", { y: 28, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, c0);
        tl.fromTo("#lau-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power4.out" }, c0 + 0.2);
        tl.fromTo("#lau-role", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, c0 + 0.36);
        if (exit === "out") {
          var out = isFinite(cues[1]) ? cues[1] : c0 + 4.2;
          tl.to("#lau-role", { opacity: 0, duration: 0.3, ease: "power2.in" }, out);
          tl.to("#lau-rule", { scaleX: 0, duration: 0.3, ease: "power2.in" }, out + 0.05);
          tl.to("#lau-name", { y: -16, opacity: 0, duration: 0.32, ease: "power2.in" }, out + 0.1);
        }
        tl.set({}, {}, 30);
        window.__timelines = window.__timelines || {};
        window.__timelines["lt-accent-underline"] = tl;
      })();
    </script>
  </body>
</html>
