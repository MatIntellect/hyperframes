<!doctype html>
<html
  lang="ru"
  data-composition-variables='[
    { "id": "placement", "type": "enum", "role": "layout", "label": "Placement", "description": "full: the tiled surface to the frame edge, the headlines centred on the field (y 770) within 780. top / bottom: the surface on a 780x760 card at y 180-940 / 600-1360, rest of the frame transparent.", "default": "full", "options": [{ "value": "full", "label": "Full screen" }, { "value": "top", "label": "Top" }, { "value": "bottom", "label": "Bottom" }] },
    { "id": "headline", "type": "string", "role": "content", "label": "Front headline", "description": "Headline on the surface before the sweep, Bebas Neue at a fixed size; a long one wraps to the next line.", "maxLength": 24, "default": "Сделай это" },
    { "id": "reverseHeadline", "type": "string", "role": "content", "label": "Rear headline", "description": "Headline the flipped tiles reveal.", "maxLength": 24, "default": "Важным" },
    { "id": "direction", "type": "enum", "role": "style", "label": "Sweep direction", "default": "left-to-right", "options": [{ "value": "left-to-right", "label": "Left to right" }, { "value": "right-to-left", "label": "Right to left" }] },
    { "id": "sweepDuration", "type": "number", "role": "timing", "label": "Sweep duration", "default": 4.2, "min": 2.6, "max": 4.5, "step": 0.05, "unit": "s" },
    { "id": "sweepEaseStrength", "type": "number", "role": "style", "label": "Sweep easing strength", "default": 3, "min": 0, "max": 3, "step": 0.05, "description": "0 = linear. Higher values start faster and slow more strongly toward the end." },
    { "id": "flipDuration", "type": "number", "role": "timing", "label": "Each tile flip", "default": 0.75, "min": 0.65, "max": 1.65, "step": 0.05, "unit": "s" },
    { "id": "cursorRadius", "type": "number", "role": "style", "label": "Cursor influence radius", "default": 210, "min": 160, "max": 480, "step": 10, "unit": "px" },
    { "id": "cursorFalloff", "type": "number", "role": "style", "label": "Cursor influence falloff", "default": 1.4, "min": 0.4, "max": 3.5, "step": 0.05 },
    { "id": "cursorDepth", "type": "number", "role": "style", "label": "Cursor depth (+ toward camera)", "default": 80, "min": -320, "max": 320, "step": 10, "unit": "px" },
    { "id": "tiltStrength", "type": "number", "role": "style", "label": "Cursor pull / tilt strength", "default": 55, "min": 0, "max": 55, "step": 1, "unit": "deg" },
    { "id": "noiseStrength", "type": "number", "role": "style", "label": "Organic variation", "default": 2, "min": 0, "max": 2, "step": 0.05 },
    { "id": "flipBounce", "type": "number", "role": "style", "label": "Elastic flip bounce", "default": 0.15, "min": 0, "max": 0.8, "step": 0.05 },
    { "id": "cellSize", "type": "number", "role": "style", "label": "Square cell size", "description": "Tile size at the wide 300 px type; smaller type scales the tiles with it.", "default": 112, "min": 24, "max": 120, "step": 4, "unit": "px" },
    { "id": "formationScale", "type": "number", "role": "style", "label": "Local formation scale", "default": 1, "min": 0.94, "max": 1, "step": 0.001 },
    { "id": "behindColor", "type": "color", "role": "style", "label": "Behind-tile background", "description": "Seen in the gaps while tiles lift. Brand surface by default.", "default": "#18181a" },
    { "id": "shadowStrength", "type": "number", "role": "style", "label": "Cast shadow strength", "default": 0.19, "min": 0, "max": 0.65, "step": 0.01 },
    { "id": "shadowSoftness", "type": "number", "role": "style", "label": "Cast shadow softness", "default": 4, "min": 0.5, "max": 4, "step": 0.1, "unit": "px" },
    { "id": "cues", "type": "string", "role": "timing", "label": "Cues", "description": "Comma-separated seconds from mount start: 1 the cursor sweep starts (the rear headline is whole about sweep duration + flip later), 2 the surface fades out (only when exit is fade; empty – 2 s after the last tile settles). Empty keeps 1.35.", "default": "" },
    { "id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "none holds the rear headline to the end of the mount; fade fades the surface out.", "default": "none", "options": [{ "value": "none", "label": "Hold" }, { "value": "fade", "label": "Fade" }] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap-3.14.2.min.js"></script>
    <script src="assets/code-slice-shadows.js"></script>
    <script src="assets/code-slice-surface.js"></script>
    <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;
      }
      #cshv-root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      #cshv-clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      
      #cshv-clip.cshv-card {
        left: 150px;
        width: 780px;

        top: 180px;
        border-radius: 32px;
        border: 2px solid var(--border, #2e2e32);
      }
      #cshv-clip.cshv-bottom {
        top: 600px;
      }
      
      #cshv-stage,
      #cshv-flat {

        inset: 0;

    </style>
  </head>
  <body>
    <div id="cshv-root" data-composition-id="code-slice-hero-vertical" data-start="0" data-duration="30" data-width="1080" data-height="1920">
      <div id="cshv-clip">
        <section id="cshv-stage" class="clip" data-start="0" data-duration="30" data-track-index="1" aria-hidden="true"></section>
        <div id="cshv-flat" aria-hidden="true"></div>
      </div>
      <h1 id="cshv-accessible" class="cshv-accessible"></h1>
    </div>
    <script>
      (() => {
        "use strict";
        const V = window.__hyperframes?.getVariables?.() || {};
        const root = document.getElementById("cshv-root"),
          clip = document.getElementById("cshv-clip");
        const oneOf = (v, list, d) => (list.indexOf(v) >= 0 ? v : d);

        // раскладка: размер поверхности, кегль и середина надписи
        
        
        const placement = oneOf(V.placement, ["full", "top", "bottom"], "full");
        const card = placement !== "full";
        if (card) clip.classList.add("cshv-card");
        if (placement === "bottom") clip.classList.add("cshv-bottom");
        // карточка 780x760 с рамкой 2 px – поверхность внутри 776x756
        const W = card ? 776 : 1080,
          H = card ? 756 : 1920,
          FS = card ? 150 : 210,
          TW = card ? 696 : 780,
          CX = W / 2,
          CY = card ? H / 2 : 770;
        

        // цвета темы: бумага --fg, буквы --bg (у разработчиков белая бумага и чёрные буквы)
        const cs = getComputedStyle(root);
        const hexOf = (name, d) => {
          const i = document.createElement("i");
          i.style.color = cs.getPropertyValue(name).trim() || d;
          root.appendChild(i);
          const m = getComputedStyle(i).color.match(/\d+/g) || [];
          i.remove();
          return "#" + m.slice(0, 3).map((n) => Number(n).toString(16).padStart(2, "0")).join("");
        };
        const PAPER = hexOf("--fg", "#f2f2f2"),
          INK = hexOf("--bg", "#0c1014");
        const FONT = (cs.getPropertyValue("--font-display").trim() || '"Bebas Neue"').split(",")[0].replace(/["']/g, "").trim();

        const DURATION = 30;
        const cuesIn = String(V.cues || "")
          .split(",")
          .map((v) => parseFloat(v));
        const SWEEP_START = isFinite(cuesIn[0]) && cuesIn[0] >= 0 ? cuesIn[0] : 1.35;
        const exitMode = oneOf(V.exit, ["none", "fade"], "none");

        const D = {
          headline: "Сделай это",
          reverseHeadline: "Важным",
          sweepDuration: 4.2,
          sweepEaseStrength: 3,
          flipDuration: 0.75,
          cursorRadius: 210,
          cursorFalloff: 1.4,
          cursorDepth: 80,
          tiltStrength: 55,
          noiseStrength: 2,
          flipBounce: 0.15,
          cellSize: 112,
          formationScale: 1,
          shadowStrength: 0.19,
          shadowSoftness: 4,
        };
        const values = { ...D, ...V };
        const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
        const number = (key, a, b) => (values[key] !== "" && values[key] !== null && Number.isFinite(Number(values[key])) ? clamp(Number(values[key]), a, b) : D[key]);
        const smooth = (v) => {
          const u = clamp(v);
          return u * u * u * (10 + u * (-15 + 6 * u));
        };
        const headline = String(values.headline ?? D.headline)
          .replace(/\s+/g, " ")
          .trim();
        const reverseHeadline = String(values.reverseHeadline ?? D.reverseHeadline)
          .replace(/\s+/g, " ")
          .trim();
        const direction = values.direction === "right-to-left" ? -1 : 1;
        // плитка растёт вместе с кеглем (у разработчиков 112 px при 300+ px)
        const cellSize = Math.max(16, Math.round((number("cellSize", 24, 120) * FS) / 300));
        const columns = Math.ceil(W / cellSize),
          rows = Math.ceil(H / cellSize);
        const gridX = Math.floor((W - columns * cellSize) / 2),
          gridY = Math.floor((H - rows * cellSize) / 2);
        const formationScale = number("formationScale", 0.94, 1);
        const sweepPower = 1 + number("sweepEaseStrength", 0, 3);
        const sweepDuration = number("sweepDuration", 2.6, 4.5),
          flipDuration = number("flipDuration", 0.65, 1.65);
        const cursorRadius = number("cursorRadius", 160, 480),
          tiltStrength = number("tiltStrength", 0, 55);
        const cursorDepth = number("cursorDepth", -320, 320);
        const cursorFalloff = number("cursorFalloff", 0.4, 3.5);
        const fieldReach = cursorRadius * Math.sqrt(-Math.log(0.06) / cursorFalloff);
        const noiseStrength = number("noiseStrength", 0, 2),
          flipBounce = number("flipBounce", 0, 0.8);
        // Match the workbench color control: both #RGB and #RRGGBB are valid.
        const rawBehindColor = String(values.behindColor ?? "")
          .trim()
          .toLowerCase();
        const behindColor = /^#[0-9a-f]{3}$/.test(rawBehindColor)
          ? "#" +
            rawBehindColor
              .slice(1)
              .split("")
              .map((c) => c + c)
              .join("")
          : /^#[0-9a-f]{6}$/.test(rawBehindColor)
            ? rawBehindColor
            : "#18181a";
        const shadowStrength = number("shadowStrength", 0, 0.65),
          shadowSoftness = number("shadowSoftness", 0.5, 4);
        const stage = document.getElementById("cshv-stage");
        const accessible = document.getElementById("cshv-accessible"),
          flat = document.getElementById("cshv-flat");
        flat.style.backgroundSize = W + "px " + H + "px";
        const tiles = [],
          cells = [];
        const cursorLeft = -cursorRadius * 1.8,
          cursorSpan = W + cursorRadius * 3.6;
        let timeline,
          lastTime = 0,
          finishTime = 0;
        let firstMotion = SWEEP_START,
          lastMotion = DURATION,
          lastRenderedTime = NaN,
          frameMode;
        let surface;

        // строки при постоянном кегле: перенос между словами, слишком длинное слово режется
        function wrap(ctx, text) {
          const lines = [];
          let line = "";
          for (const word of text.split(" ")) {
            const next = line ? line + " " + word : word;
            if (ctx.measureText(next).width <= TW) {
              line = next;
              continue;
            }
            if (line) lines.push(line);
            line = "";
            for (const ch of Array.from(word)) {
              if (line && ctx.measureText(line + ch).width > TW) {
                lines.push(line);
                line = "";
              }
              line += ch;
            }
          }
          if (line) lines.push(line);
          return lines;
        }

        // Shared front and rear surfaces, as in Code Slice Hero's UV windows.
        // Raster alpha selects flip eligibility only, never a moving mask.
        function textSurface(text) {
          const canvas = document.createElement("canvas");
          canvas.width = W;
          canvas.height = H;
          const ctx = canvas.getContext("2d", { willReadFrequently: true });
          ctx.font = `700 ${FS}px "${FONT}"`;
          ctx.textAlign = "center";
          ctx.textBaseline = "alphabetic";
          const lines = wrap(ctx, text);
          const box = ctx.measureText(text || " ");
          const lh = FS * 0.95;
          const baseline0 = CY - ((lines.length - 1) * lh) / 2 + (box.actualBoundingBoxAscent - box.actualBoundingBoxDescent) / 2;
          ctx.fillStyle = INK;
          lines.forEach((l, i) => ctx.fillText(l, CX, baseline0 + i * lh));
          const ink = ctx.getImageData(0, 0, W, H).data;
          let inkPixels = 0;
          for (let i = 3; i < ink.length; i += 4) if (ink[i] > 0) inkPixels++;
          ctx.globalCompositeOperation = "destination-over";
          ctx.fillStyle = PAPER;
          ctx.fillRect(0, 0, W, H);
          return { canvas, ink, inkPixels, url: canvas.toDataURL("image/png") };
        }

        function countInk(ink, x0, y0, x1, y1) {
          let count = 0;
          for (let y = Math.max(0, y0); y < Math.min(H, y1); y++)
            for (let x = Math.max(0, x0); x < Math.min(W, x1); x++) {
              if (ink[(y * W + x) * 4 + 3] > 0) count++;
            }
          return count;
        }

        // These independent hashes are the experiment's actual per-purpose seeds.
        function hash(col, row, a, b) {
          const v = Math.sin(col * a + row * b) * 43758.5453;
          return v - Math.floor(v);
        }

        // Same Gaussian^falloff + smooth cutoff as the source hover (falloff 1.4).
        function fieldAt(x, y, cursorX, cursorY) {
          const distanceSquared = (x - cursorX) ** 2 + (y - cursorY) ** 2;
          const raw = Math.exp((-cursorFalloff * distanceSquared) / (cursorRadius * cursorRadius));
          const u = clamp((raw - 0.06) / 0.94);
          return u * u * (3 - 2 * u);
        }

        // One analytic ease-out and its inverse drive every passage/window time.
        const easeSweep = (u) => (sweepPower === 1 ? clamp(u) : 1 - Math.pow(1 - clamp(u), sweepPower));
        const inverseSweep = (u) => (sweepPower === 1 ? clamp(u) : 1 - Math.pow(1 - clamp(u), 1 / sweepPower));
        function cursorTimeAtX(x) {
          const rank = (direction === 1 ? x - cursorLeft : W - x - cursorLeft) / cursorSpan;
          return SWEEP_START + sweepDuration * inverseSweep(rank);
        }
        // курсор идёт по середине надписи (у разработчиков – по середине кадра, где она и стоит)
        function cursorAt(time) {
          const progress = easeSweep((time - SWEEP_START) / sweepDuration);
          return {
            x: cursorLeft + cursorSpan * (direction === 1 ? progress : 1 - progress),
            y: CY,
            z: cursorDepth,
          };
        }

        function poseAt(tile, time) {
          const t = clamp(time, 0, DURATION);
          const progress = tile.active ? clamp((t - tile.flipStart) / tile.flipDuration) : 0;
          const turn = smooth(progress / 0.64);
          // Analytic damped oscillation: overshoot, return past 180, settle exactly.
          const ringT = clamp((progress - 0.64) / 0.36);
          const ringEnvelope = smooth(ringT / 0.12) * Math.exp(-3.3 * ringT) * (1 - smooth((ringT - 0.72) / 0.28));
          const bounce = flipBounce * 36 * Math.sin(ringT * Math.PI * 3.3) * ringEnvelope;
          const flight = Math.sin(Math.PI * progress) ** 0.7;
          const cursor = cursorAt(t);
          const radial = fieldAt(tile.cx, tile.cy, cursor.x, cursor.y);
          const automatic = t >= SWEEP_START && t <= SWEEP_START + sweepDuration;
          const approach = smooth((t - tile.passTime + 0.2) / 0.16);
          const pull = (automatic ? radial * approach * (1 - smooth(progress / 0.32)) : 0) * (tile.active ? 1 : 0.55);
          const dx = cursor.x - tile.cx,
            dy = cursor.y - tile.cy;
          const variation = noiseStrength * Math.max(pull, flight * tile.peak);
          // Continuous deterministic oscillations, not random-at-render-time jitter.
          const n1 = Math.sin(t * 5.7 + tile.phase),
            n2 = Math.sin(t * 10.3 + tile.phase * 1.71);
          const jitter = variation * (n1 * 0.7 + n2 * 0.3);
          const formation = Math.max(pull, flight * (0.55 + 0.45 * tile.peak));
          const depthGain = cursor.z / 160;
          const pullTiltX = depthGain * ((dy / cursorRadius) * tiltStrength * 1.6 * pull + tile.seedX * tiltStrength * 0.16 * pull);
          const yawDx = tile.active ? direction * Math.max(0, -direction * dx) : -dx;
          const yawHandoff = tile.active ? 1 - smooth((t - tile.passTime + 0.04) / 0.12) : 1;
          const pullTiltY = depthGain * ((yawDx / cursorRadius) * tiltStrength * 1.8 * pull + tile.seedY * tiltStrength * 0.12 * pull) * yawHandoff;
          const pullZ = (tiltStrength / 30) * cursor.z * 0.45 * pull;
          const rx = pullTiltX + tile.seedX * variation * 3 * flight + jitter;
          const ry = direction * (180 * turn + bounce) + pullTiltY + jitter * 0.7;
          const rz = tile.seedZ * variation * (2.3 * flight + 1.2 * pull) + jitter * 0.35;
          return {
            x: clamp(dx * 0.08 * pull, -tile.width * 0.18, tile.width * 0.18) + jitter * 0.2,
            y: clamp(dy * 0.07 * pull, -tile.height * 0.11, tile.height * 0.11) + jitter * 0.16,
            z: pullZ + 17 * flight * tile.peak,
            rx,
            ry,
            rz,
            formation,
            scale: 1 - (1 - formationScale) * formation,
            shade: 1 - 0.12 * Math.abs(Math.sin((ry * Math.PI) / 180)) - 0.018 * formation,
          };
        }

        function setRest(tile, rear) {
          const rest = tile.active && rear ? 1 : 0;
          if (tile.restState === rest) return;
          tile.restState = rest;
          surface.set(tile.index, { x: 0, y: 0, z: 0, rx: 0, ry: rest * direction * 180, rz: 0, scale: 1, formation: 0, shade: 1 });
        }

        function renderAt(time) {
          lastTime = clamp(time, 0, DURATION);
          if (lastTime === lastRenderedTime) return;
          lastRenderedTime = lastTime;
          const mode = lastTime <= firstMotion ? "front" : lastTime >= lastMotion ? "rear" : "moving";
          if (mode !== frameMode) {
            frameMode = mode;
            stage.style.visibility = mode === "moving" ? "visible" : "hidden";
            flat.style.visibility = mode === "moving" ? "hidden" : "visible";
            if (mode !== "moving") flat.style.backgroundImage = `var(--cshv-${mode === "front" ? "front" : "back"})`;
          }
          for (const tile of tiles) {
            if (mode !== "moving" || lastTime < tile.motionStart || lastTime > tile.motionEnd) {
              setRest(tile, mode === "rear" || lastTime > tile.flipStart + tile.flipDuration);
              continue;
            }
            tile.restState = null;
            surface.set(tile.index, poseAt(tile, lastTime));
          }
          if (mode === "moving") surface.draw();
          const copy = lastTime < SWEEP_START + sweepDuration / 2 + flipDuration / 2 ? headline : reverseHeadline;
          if (accessible.textContent !== copy) accessible.textContent = copy;
        }

        function build() {
          const front = textSurface(headline),
            back = textSurface(reverseHeadline);
          root.style.setProperty("--cshv-front", `url("${front.url}")`);
          root.style.setProperty("--cshv-back", `url("${back.url}")`);
          firstMotion = Infinity;
          lastMotion = 0;
          for (let row = 0; row < rows; row++)
            for (let col = 0; col < columns; col++) {
              // One exhaustive integer pixel partition: no holes in the type.
              const x = gridX + col * cellSize,
                x1 = x + cellSize;
              const y = gridY + row * cellSize,
                y1 = y + cellSize;
              const frontInk = countInk(front.ink, x, y, x1, y1),
                backInk = countInk(back.ink, x, y, x1, y1);
              const cell = { col, row, x, y, width: x1 - x, height: y1 - y, frontInk, backInk, active: frontInk + backInk > 0 };
              cells.push(cell);
              const cx = x + cell.width / 2,
                cy = y + cell.height / 2;
              const peak = fieldAt(cx, cy, cx, CY);
              const passTime = cursorTimeAtX(cx);
              const columnSeconds = Math.abs(cursorTimeAtX(cx + cellSize / 2) - cursorTimeAtX(cx - cellSize / 2));
              // The turn starts at passage, with at most 12 ms of seeded stagger.
              const flipStart = passTime + hash(col, row, 269.5, 183.3) * Math.min(0.012, columnSeconds * 0.08) * Math.min(noiseStrength, 1);
              const duration = flipDuration * (1 + 0.18 * (1 - peak));
              const tile = {
                ...cell,
                index: tiles.length,
                cx,
                cy,
                peak,
                passTime,
                flipStart,
                flipDuration: duration,
                phase: hash(col, row, 127.1, 311.7) * Math.PI * 2,
                seedX: hash(col, row, 419.2, 371.9) * 2 - 1,
                seedY: hash(col, row, 37.7, 631.5) * 2 - 1,
                seedZ: hash(col, row, 97.3, 127.9) * 2 - 1,
              };
              // The Gaussian is exactly zero outside this circle.
              const dy = cy - CY;
              let enter = Infinity,
                exit = -Infinity;
              if (Math.abs(dy) < fieldReach) {
                const dx = Math.sqrt(fieldReach * fieldReach - dy * dy);
                enter = Math.max(SWEEP_START, passTime - 0.2, cursorTimeAtX(direction === 1 ? cx - dx : cx + dx));
                exit = Math.min(SWEEP_START + sweepDuration, cursorTimeAtX(direction === 1 ? cx + dx : cx - dx));
              }
              tile.motionStart = Math.min(enter, tile.active ? flipStart : Infinity);
              tile.motionEnd = Math.max(exit, tile.active ? flipStart + duration : -Infinity);
              firstMotion = Math.min(firstMotion, tile.motionStart);
              lastMotion = Math.max(lastMotion, tile.motionEnd);
              if (tile.active) finishTime = Math.max(finishTime, flipStart + duration);
              tiles.push(tile);
            }
          clip.style.backgroundColor = behindColor;
          surface = window.CodeSliceSurface(stage, front.canvas, back.canvas, tiles, {
            behindColor,
            shadowStrength,
            shadowSoftness,
            width: W,
            height: H,
            paper: PAPER,
          });
          const state = { time: 0 };
          timeline = gsap.timeline({ paused: true });
          timeline.to(state, { time: DURATION, duration: DURATION, ease: "none", onUpdate: () => renderAt(state.time) }, 0);
          if (exitMode === "fade") timeline.to(clip, { opacity: 0, duration: 0.5, ease: "power2.in" }, isFinite(cuesIn[1]) && cuesIn[1] > SWEEP_START ? cuesIn[1] : finishTime + 2);
          window.__timelines = window.__timelines || {};
          window.__timelines["code-slice-hero-vertical"] = timeline;
          renderAt(0);
        }

        // The cursor is imaginary and belongs exclusively to the timeline.
        function seek(event) {
          if (!timeline || typeof event.detail?.time !== "number") return;
          const time = clamp(event.detail.time, 0, DURATION);
          timeline.totalTime(time, true);
          renderAt(time);
        }
        window.addEventListener("hf-seek", seek);
        document.fonts.load(`700 100px "${FONT}"`, headline + reverseHeadline).then(build);
      })();
    </script>
  </body>
</html>
