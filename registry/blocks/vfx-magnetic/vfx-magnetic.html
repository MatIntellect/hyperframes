<!doctype html>
<html
  lang="ru"
  data-composition-variables='[
    { "id": "head1", "type": "string", "role": "content", "label": "Headline line 1", "description": "First headline line, Bebas Neue.", "maxLength": 14, "default": "Кадр тянется" },
    { "id": "head2", "type": "string", "role": "content", "label": "Headline line 2", "description": "Second headline line in red, Bebas Neue.", "maxLength": 14, "default": "к курсору" },
    { "id": "sub", "type": "string", "role": "content", "label": "Text", "description": "Text under the headline, Montserrat, up to three lines.", "maxLength": 90, "default": "Каждый пиксель страницы проходит через шейдер и тянется к точке, как железные опилки к магниту" },
    { "id": "card1", "type": "string", "role": "content", "label": "Card 1 title", "description": "Title of the first card.", "maxLength": 18, "default": "Живой текст" },
    { "id": "card1text", "type": "string", "role": "content", "label": "Card 1 text", "description": "Text of the first card, up to two lines (not shown on a top / bottom card).", "maxLength": 50, "default": "Страница остаётся читаемой даже под искажением" },
    { "id": "card2", "type": "string", "role": "content", "label": "Card 2 title", "description": "Title of the second card.", "maxLength": 18, "default": "Мягкий спад" },
    { "id": "card2text", "type": "string", "role": "content", "label": "Card 2 text", "description": "Text of the second card, up to two lines (not shown on a top / bottom card).", "maxLength": 50, "default": "Сильно у точки, к краям тяга плавно сходит на нет" },
    { "id": "card3", "type": "string", "role": "content", "label": "Card 3 title", "description": "Title of the third card.", "maxLength": 18, "default": "Цветной сдвиг" },
    { "id": "card3text", "type": "string", "role": "content", "label": "Card 3 text", "description": "Text of the third card, up to two lines (not shown on a top / bottom card).", "maxLength": 50, "default": "У точки каналы цвета расходятся, как в объективе" },
    { "id": "cues", "type": "string", "role": "timing", "label": "Cues", "description": "Comma-separated seconds from mount start: 1 the cursor appears (it runs 14 s: over the headline 1-5 s, around the text 5-8 s, push-away pulse at 8 s, over the cards 9-13 s, leaves at 13-14.5 s), 2 the block fades out (only when exit is fade). Empty keeps 0 and 15.", "default": "" },
    { "id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "none holds the still page to the end of the mount; fade fades the block out.", "default": "none", "options": [{ "value": "none", "label": "Hold" }, { "value": "fade", "label": "Fade" }] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        background: transparent;
        overflow: hidden;
      }
      #mgc-root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #mgc-frame {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: var(--bg, #0c1014);
      }
      
      #mgc-canvas {
        position: absolute;
        left: 0;
        top: 0;
      }
      #mgc-dot {
        position: absolute;
        left: 0;
        top: 0;
        width: 22px;
        height: 22px;
        margin: -11px 0 0 -11px;
        border-radius: 50%;
        background: var(--accent, #ff0000);
        box-shadow:
          0 0 20px color-mix(in srgb, var(--accent, #ff0000) 60%, transparent),
          0 0 44px color-mix(in srgb, var(--accent, #ff0000) 35%, transparent);
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="mgc-root" data-composition-id="vfx-magnetic" data-width="1920" data-height="1080" data-start="0" data-duration="30">
      <div id="mgc-frame">
        <canvas id="mgc-canvas" aria-hidden="true"></canvas>
        <div id="mgc-dot"></div>
      </div>
    </div>
    <script>
      // страница рисуется сама на холсте (у разработчиков – снимок живой разметки, которого у рендера нет: кадр пустой)
      Promise.all([document.fonts.load('700 120px "Bebas Neue"'), document.fonts.load('400 32px "Montserrat"'), document.fonts.load('600 32px "Montserrat"')]).then(function () {
        var V =
          window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
            ? window.__hyperframes.getVariables()
            : {};
        function txt(v, d) {
          return typeof v === "string" && v.trim() ? v.trim() : d;
        }
        function oneOf(v, list, d) {
          return list.indexOf(v) >= 0 ? v : d;
        }
        var $ = function (id) {
          return document.getElementById("mgc-" + id);
        };
        var root = $("root"),
          frame = $("frame"),
          canvas = $("canvas"),
          dot = $("dot");
        var css = getComputedStyle(root);
        function tok(n, d) {
          var v = css.getPropertyValue(n).trim();
          return v || d;
        }
        var C = { bg: tok("--bg", "#0c1014"), surface: tok("--surface", "#18181a"), border: tok("--border", "#2e2e32"), fg: tok("--fg", "#f2f2f2"), muted: tok("--muted", "#8a8a90"), accent: tok("--accent", "#ff0000") };

        // раскладка: область содержимого и размеры шрифтов на каждую раскладку
        var W = 1920,
          H = 1080,
          L = { x: 410, y: 90, w: 1100, h: 900, head: 150, sub: 36, title: 32, desc: 28, row: true, desc_on: true };
        
        canvas.width = W;
        canvas.height = H;
        canvas.style.width = W + "px";
        canvas.style.height = H + "px";

        var page = document.createElement("canvas");
        page.width = W;
        page.height = H;
        var g = page.getContext("2d");
        function wrap(text, font, maxW) {
          g.font = font;
          var words = text.split(/\s+/),
            lines = [],
            cur = "";
          words.forEach(function (w) {
            var t = cur ? cur + " " + w : w;
            if (cur && g.measureText(t).width > maxW) {
              lines.push(cur);
              cur = w;
            } else cur = t;
          });
          if (cur) lines.push(cur);
          return lines;
        }
        var HEAD = '700 ' + L.head + 'px "Bebas Neue"',
          SUB = '400 ' + L.sub + 'px "Montserrat"',
          TITLE = '600 ' + L.title + 'px "Montserrat"',
          DESC = '400 ' + L.desc + 'px "Montserrat"';
        var hl = wrap(txt(V.head1, "Кадр тянется"), HEAD, L.w).map(function (s) {
          return [s, C.fg];
        }).concat(
          wrap(txt(V.head2, "к курсору"), HEAD, L.w).map(function (s) {
            return [s, C.accent];
          }),
        );
        var sl = wrap(txt(V.sub, "Каждый пиксель страницы проходит через шейдер и тянется к точке, как железные опилки к магниту"), SUB, L.w);
        var cards = [
          [txt(V.card1, "Живой текст"), txt(V.card1text, "Страница остаётся читаемой даже под искажением")],
          [txt(V.card2, "Мягкий спад"), txt(V.card2text, "Сильно у точки, к краям тяга плавно сходит на нет")],
          [txt(V.card3, "Цветной сдвиг"), txt(V.card3text, "У точки каналы цвета расходятся, как в объективе")],
        ];
        var PAD = 28,
          GAP = 20,
          ICON = Math.round(L.title * 1.4),
          cw = L.row ? (L.w - 2 * GAP) / 3 : L.w;
        // у карточки в строку значок над заголовком, у карточки в столбик – слева от него
        var inner = L.row ? cw - 2 * PAD : cw - 2 * PAD - ICON - 20;
        var cl = cards.map(function (c) {
          return { t: wrap(c[0], TITLE, inner), d: L.desc_on ? wrap(c[1], DESC, inner) : [] };
        });
        var TLH = L.title * 1.25,
          DLH = L.desc * 1.4;
        function cardH(c) {
          var body = c.t.length * TLH + (c.d.length ? 10 + c.d.length * DLH : 0);
          return L.row ? PAD * 2 + ICON + 16 + body : PAD * 2 + Math.max(ICON, body);
        }
        var ch = L.row
          ? [Math.max.apply(null, cl.map(cardH))]
          : cl.map(cardH);
        var HLH = L.head * 0.95,
          SLH = L.sub * 1.4,
          headH = hl.length * HLH,
          subH = sl.length * SLH,
          cardsH = L.row ? ch[0] : ch.reduce(function (a, b) {
            return a + b;
          }, 0) + GAP * 2;
        var total = headH + L.sub * 0.9 + subH + L.sub * 1.3 + cardsH;
        var y = L.y + Math.max(0, (L.h - total) / 2);
        // путь курсора разработчиков – в долях прямоугольника страницы, а не кадра: в вертикали иначе уходит в пустоту под карточками
        var BOX = { x: L.x, y: y, w: L.w, h: total };

        g.fillStyle = C.bg;
        g.fillRect(0, 0, W, H);
        g.textBaseline = "alphabetic";
        g.font = HEAD;
        hl.forEach(function (l) {
          g.fillStyle = l[1];
          g.fillText(l[0], L.x, y + HLH * 0.86);
          y += HLH;
        });
        y += L.sub * 0.9;
        g.font = SUB;
        g.fillStyle = C.muted;
        sl.forEach(function (l) {
          g.fillText(l, L.x, y + L.sub * 1.05);
          y += SLH;
        });
        y += L.sub * 1.3;
        function rrect(x, yy, w, h, r) {
          g.beginPath();
          g.moveTo(x + r, yy);
          g.arcTo(x + w, yy, x + w, yy + h, r);
          g.arcTo(x + w, yy + h, x, yy + h, r);
          g.arcTo(x, yy + h, x, yy, r);
          g.arcTo(x, yy, x + w, yy, r);
          g.closePath();
        }
        cl.forEach(function (c, i) {
          var x = L.row ? L.x + i * (cw + GAP) : L.x,
            h = L.row ? ch[0] : ch[i];
          rrect(x, y, cw, h, 18);
          g.fillStyle = C.surface;
          g.fill();
          g.lineWidth = 2;
          g.strokeStyle = C.border;
          g.stroke();
          var bx = L.row ? x + PAD : x + PAD + ICON + 20,
            by = L.row ? y + PAD + ICON + 16 : y + (h - (c.t.length * TLH + (c.d.length ? 10 + c.d.length * DLH : 0))) / 2;
          var iy = L.row ? y + PAD : y + (h - ICON) / 2;
          rrect(x + PAD, iy, ICON, ICON, 12);
          g.fillStyle = C.accent;
          g.fill();
          // badge digit – Montserrat (owner rule: digits are not Bebas), centred in the badge
          g.font = '700 ' + Math.round(ICON * 0.56) + 'px "Montserrat"';
          g.fillStyle = C.fg;
          g.textAlign = "center";
          g.textBaseline = "middle";
          g.fillText(String(i + 1), x + PAD + ICON / 2, iy + ICON / 2);
          g.textAlign = "left";
          g.textBaseline = "alphabetic";
          g.font = TITLE;
          g.fillStyle = C.fg;
          c.t.forEach(function (l) {
            g.fillText(l, bx, by + L.title * 0.98);
            by += TLH;
          });
          if (c.d.length) by += 10;
          g.font = DESC;
          g.fillStyle = C.muted;
          c.d.forEach(function (l) {
            g.fillText(l, bx, by + L.desc * 1.08);
            by += DLH;
          });
          if (!L.row) y += h + GAP;
        });

        // шейдер разработчиков: тяга к точке по гауссу + расхождение каналов цвета (WebGL1)
        var gl = canvas.getContext("webgl", { alpha: false, preserveDrawingBuffer: true });
        var S = { mouseX: 0.5, mouseY: 0.5, repel: 0, strength: 0 };
        var render = function () {};
        if (gl) {
          var VS = "attribute vec2 a_pos;varying vec2 v_uv;void main(){v_uv=vec2(a_pos.x*0.5+0.5,0.5-a_pos.y*0.5);gl_Position=vec4(a_pos,0.0,1.0);}";
          var FS = [
            "precision highp float;",
            "varying vec2 v_uv;",
            "uniform sampler2D u_content;",
            "uniform vec2 u_mouse;",
            "uniform vec2 u_resolution;",
            "uniform float u_repel;",
            "uniform float u_strength;",
            "void main(){",
            "  vec2 uv=v_uv;",
            // спад – в долях меньшей стороны: в широком кадре как у разработчиков (aspect, 1), в вертикали зона не раздувается
            "  vec2 delta=u_mouse-uv;",
            "  vec2 ad=delta*u_resolution/min(u_resolution.x,u_resolution.y);",
            "  float dist=length(ad);",
            "  float strength=exp(-dist*dist*20.0)*0.04*u_strength;",
            "  float direction=mix(1.0,-1.0,u_repel);",
            "  vec2 d=clamp(uv+delta*strength*direction,vec2(0.0),vec2(1.0));",
            "  vec2 ab=normalize(delta+0.0001)*strength*0.6;",
            "  float r=texture2D(u_content,d+ab*0.3).r;",
            "  float gg=texture2D(u_content,d).g;",
            "  float b=texture2D(u_content,d-ab*0.3).b;",
            "  gl_FragColor=vec4(r,gg,b,1.0);",
            "}",
          ].join("\n");
          var sh = function (type, src) {
            var s = gl.createShader(type);
            gl.shaderSource(s, src);
            gl.compileShader(s);
            if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
            return s;
          };
          var prog = gl.createProgram();
          gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
          gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
          gl.linkProgram(prog);
          var buf = gl.createBuffer();
          gl.bindBuffer(gl.ARRAY_BUFFER, buf);
          gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
          var tex = gl.createTexture();
          gl.bindTexture(gl.TEXTURE_2D, tex);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, page);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
          var U = {};
          ["u_content", "u_mouse", "u_resolution", "u_repel", "u_strength"].forEach(function (n) {
            U[n] = gl.getUniformLocation(prog, n);
          });
          var aPos = gl.getAttribLocation(prog, "a_pos");
          render = function () {
            gl.viewport(0, 0, W, H);
            gl.useProgram(prog);
            gl.bindBuffer(gl.ARRAY_BUFFER, buf);
            gl.enableVertexAttribArray(aPos);
            gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
            gl.activeTexture(gl.TEXTURE0);
            gl.bindTexture(gl.TEXTURE_2D, tex);
            gl.uniform1i(U.u_content, 0);
            var mx = (BOX.x + S.mouseX * BOX.w) / W,
              my = (BOX.y + S.mouseY * BOX.h) / H;
            gl.uniform2f(U.u_mouse, mx, my);
            gl.uniform2f(U.u_resolution, W, H);
            gl.uniform1f(U.u_repel, S.repel);
            gl.uniform1f(U.u_strength, S.strength);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            dot.style.transform = "translate(" + mx * W + "px," + my * H + "px)";
          };
        }

        var cues = String(V.cues || "")
          .split(",")
          .map(function (v) {
            return parseFloat(v);
          });
        var c0 = isFinite(cues[0]) && cues[0] >= 0 ? cues[0] : 0;
        var exit = oneOf(V.exit, ["none", "fade"], "none");

        // путь курсора разработчиков (восьмёрка по странице), отсчёт от появления точки
        var s = gsap.timeline();
        s.to(dot, { opacity: 1, duration: 0.3 }, 0);
        s.to(S, { strength: 1, duration: 0.5, ease: "power2.out" }, 0);
        s.to(S, { mouseX: 0.35, mouseY: 0.3, duration: 2, ease: "power1.inOut" }, 0.5);
        s.to(S, { mouseX: 0.6, mouseY: 0.35, duration: 2, ease: "power1.inOut" }, 2.5);
        s.to(S, { mouseX: 0.4, mouseY: 0.5, duration: 1.5, ease: "sine.inOut" }, 4.5);
        s.to(S, { mouseX: 0.55, mouseY: 0.55, duration: 1.5, ease: "sine.inOut" }, 6);
        s.to(S, { repel: 1, duration: 0.2, ease: "power4.out" }, 7.5);
        s.to(S, { repel: 0, duration: 0.5, ease: "power2.out" }, 8);
        s.to(S, { mouseX: 0.3, mouseY: 0.75, duration: 2, ease: "power1.inOut" }, 8.5);
        s.to(S, { mouseX: 0.65, mouseY: 0.72, duration: 2, ease: "power1.inOut" }, 10.5);
        s.to(S, { mouseX: 0.8, mouseY: 0.2, duration: 1.5, ease: "power2.inOut" }, 12.5);
        s.to(S, { strength: 0, duration: 0.5 }, 13.5);
        s.to(dot, { opacity: 0, duration: 0.3 }, 13.7);

        var tl = gsap.timeline({ paused: true, onUpdate: render });
        tl.add(s, c0);
        if (exit === "fade") tl.to(frame, { opacity: 0, duration: 0.5, ease: "power2.in" }, isFinite(cues[1]) && cues[1] > c0 ? cues[1] : c0 + 15);
        tl.set({}, {}, 30);
        render();
        window.__timelines = window.__timelines || {};
        window.__timelines["vfx-magnetic"] = tl;
      });
    </script>
  </body>
</html>
