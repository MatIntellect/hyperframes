<!doctype html>
<html
  lang="ru"
  data-composition-variables='[
    { "id": "placement", "type": "enum", "role": "layout", "label": "Placement", "description": "full: own ground to the frame edge, the character walks in at the foot of the 780x1180 field and points at the card beside it. top / bottom: the same scene on a brand card 780x760 at y 180-940 / 600-1360, rest of the frame transparent.", "default": "full", "options": [{ "value": "full", "label": "Full screen" }, { "value": "top", "label": "Top" }, { "value": "bottom", "label": "Bottom" }] },
    { "id": "title", "type": "string", "role": "content", "label": "Card title", "description": "Card title in Bebas Neue.", "maxLength": 28, "default": "Это ваш гид" },
    { "id": "body", "type": "string", "role": "content", "label": "Card text", "description": "Grey text under the title. Empty hides it.", "maxLength": 90, "default": "Входит уверенным шагом, останавливается и показывает, куда смотреть" },
    { "id": "cues", "type": "string", "role": "timing", "label": "Cues", "description": "The character plays the native acting from 2.5 s, so it walks in from the frame edge at the mount start, stops and points at 2.7 s, when the card lands. Comma-separated seconds from mount start: 1 the block fades out (only when exit is fade). Empty keeps 8.5 – the card text reads 5 s.", "default": "" },
    { "id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "none holds the pointing character and the card to the end of the mount; fade fades the block out.", "default": "none", "options": [{ "value": "none", "label": "Hold" }, { "value": "fade", "label": "Fade" }] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lottie-web@5.12.2/build/player/lottie_light.min.js"></script>
    <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: transparent;
        overflow: hidden;
      }
      body {
        width: 1080px;
        height: 1920px;
      }
      #lcwv-root {
        position: absolute;
        inset: 0;
        overflow: hidden;
        font-family: var(--font-body, "Montserrat"), sans-serif;
        color: var(--fg, #f2f2f2);
      }
      #lcwv-ground,
      #lcwv-stage {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      #lcwv-ground {
        background: var(--bg, #0c1014);
      }
      #lcwv-line {
        position: absolute;
        left: 0;
        right: 0;
        height: 1px;
        background: color-mix(in srgb, var(--fg, #f2f2f2) 14%, transparent);
      }
      /* родная сцена Lottie – 1920x1080, переносится целиком */
      #lcwv-mascot {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        transform-origin: 0 0;
      }
      /* персонаж – своя графика: цвета частей из меток темы (файл разработчиков не тронут) */
      #lcwv-mascot .lcwv-near path:not([fill="none"]) {
        fill: var(--fg, #f2f2f2);
      }
      #lcwv-mascot .lcwv-near path[stroke] {
        stroke: var(--bg, #0c1014);
      }
      #lcwv-mascot .lcwv-far path:not([fill="none"]) {
        fill: var(--muted, #8a8a90);
      }
      #lcwv-mascot .lcwv-eye path:not([fill="none"]) {
        fill: var(--bg, #0c1014);
      }
      #lcwv-mascot .lcwv-shadow path:not([fill="none"]) {
        fill: #000000;
      }
      #lcwv-card {
        position: absolute;
        border-radius: 28px;
        background: var(--surface, #18181a);
        border: 2px solid var(--border, #2e2e32);
        opacity: 0;
      }
      #lcwv-title {
        font-family: var(--font-display, "Bebas Neue"), sans-serif;
        font-weight: 400;
        line-height: 1;
        text-transform: uppercase;
        overflow-wrap: break-word;
      }
      #lcwv-rule {
        width: 120px;
        height: 8px;
        border-radius: 4px;
        background: var(--accent, #ff0000);
        transform-origin: left center;
      }
      #lcwv-body {
        font-size: 34px;
        line-height: 1.35;
        color: var(--muted, #8a8a90);
        overflow-wrap: break-word;
      }
      
      
      #lcwv-line {
        top: 1330px;
      }
      #lcwv-card {
        left: 476px;
        bottom: 590px;
        width: 450px;
        padding: 44px 40px 48px;
      }
      #lcwv-title {
        font-size: 80px;
      }
      #lcwv-rule {
        margin: 24px 0 26px;
      }
      #lcwv-root.lcwv-card #lcwv-ground,
      #lcwv-root.lcwv-card #lcwv-stage {
        left: 150px;
        width: 780px;
        top: 180px;
        height: 760px;
        border-radius: 32px;
      }
      #lcwv-root.lcwv-card #lcwv-ground {
        border: 2px solid var(--border, #2e2e32);
      }
      #lcwv-root.lcwv-bottom #lcwv-ground,
      #lcwv-root.lcwv-bottom #lcwv-stage {
        top: 600px;
      }
      #lcwv-root.lcwv-card #lcwv-line {
        top: 700px;
      }
      #lcwv-root.lcwv-card #lcwv-card {
        left: 290px;
        bottom: 60px;
        width: 460px;
        padding: 36px 40px 40px;
      }
      #lcwv-root.lcwv-card #lcwv-title {
        font-size: 72px;
      }
      
    </style>
  </head>
  <body>
    <div id="lcwv-root" data-composition-id="lottie-character-walk-vertical" data-width="1080" data-height="1920" data-start="0" data-duration="30">
      <div id="lcwv-ground"></div>
      <div id="lcwv-stage">
        <div id="lcwv-line" data-layout-ignore></div>
        <div id="lcwv-card">
          <div id="lcwv-title"></div>
          <div id="lcwv-rule"></div>
          <div id="lcwv-body"></div>
        </div>
        <div id="lcwv-mascot" data-layout-allow-overflow data-layout-ignore></div>
      </div>
    </div>
    <script>
      (function () {
        var root = document.getElementById("lcwv-root");
        var V =
          window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
            ? window.__hyperframes.getVariables()
            : {};
        function txt(v, d) {
          return typeof v === "string" ? v.trim() : d;
        }
        document.getElementById("lcwv-title").textContent = txt(V.title, "Это ваш гид") || "Это ваш гид";
        var body = txt(V.body, "Входит уверенным шагом, останавливается и показывает, куда смотреть");
        document.getElementById("lcwv-body").textContent = body;
        if (!body) document.getElementById("lcwv-body").style.display = "none";

        // сцена Lottie в окне: в широкой – как у разработчиков; в вертикали персонаж в левом нижнем углу поля,
        // в карточке – в 0,75 и обрезан окном карточки (не идёт по прозрачной части кадра)
        var mx = 0,
          my = 0,
          k = 1,
          T0 = 0;
        
        var placement = ["full", "top", "bottom"].indexOf(String(V.placement)) >= 0 ? String(V.placement) : "full";
        // бедро после остановки – x 764, земля – y 906 в сцене Lottie
        T0 = 2.5;
        mx = 300 - 764;
        my = 1330 - 906;
        if (placement !== "full") {
          root.classList.add("lcwv-card", "lcwv-" + placement);
          k = 0.75;
          mx = 150 - 764 * k;
          my = 700 - 906 * k;
        }
        
        var box = document.getElementById("lcwv-mascot");
        box.style.transform = "translate(" + mx + "px, " + my + "px) scale(" + k + ")";

        // Игру тела (шаг, остановка, жест, покой) ведёт файл Lottie разработчиков; время ему ставит программа
        var mascot = lottie.loadAnimation({
          container: box,
          renderer: "svg",
          loop: false,
          autoplay: false,
          // файл ставится в assets/ проекта – путь от корня проекта (contributing.md:96-97: assetUrl искал бы рядом с файлом)
          path: "assets/mascot.json",
          // вертикаль: родной путь шага рассчитан на широкий кадр, первые 2,5 с персонаж за краем кадра –
          // файл играется с 2,5 с (кадр 75 из 225), время карточки сдвинуто на столько же
          initialSegment: [T0 * 30, 225],
        });
        var PARTS = {
          near: ["arm.near.fore", "arm.near.upper", "head", "torso", "leg.near.foot", "leg.near.shin", "leg.near.thigh"],
          far: ["leg.far.foot", "leg.far.shin", "leg.far.thigh", "arm.far.fore", "arm.far.upper"],
          eye: ["eye"],
          shadow: ["shadow"],
        };
        mascot.addEventListener("DOMLoaded", function () {
          (mascot.renderer.elements || []).forEach(function (el) {
            if (!el || !el.data || !el.layerElement) return;
            Object.keys(PARTS).forEach(function (part) {
              if (PARTS[part].indexOf(el.data.nm) >= 0) el.layerElement.classList.add("lcwv-" + part);
            });
          });
        });
        window.__hfLottie = window.__hfLottie || [];
        window.__hfLottie.push(mascot);

        var cues = String(V.cues || "")
          .split(",")
          .map(function (v) {
            return parseFloat(v);
          });
        var exit = ["none", "fade"].indexOf(String(V.exit)) >= 0 ? String(V.exit) : "none";

        // карточка – на родной жест (5,2 с)
        var tl = gsap.timeline({ paused: true });
        tl.fromTo("#lcwv-card", { opacity: 0, x: 40, scale: 0.96 }, { opacity: 1, x: 0, scale: 1, duration: 0.6, ease: "power3.out" }, 5.2 - T0);
        tl.fromTo(["#lcwv-title", "#lcwv-body"], { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out", stagger: 0.1 }, 5.3 - T0);
        tl.fromTo("#lcwv-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "expo.out" }, 5.5 - T0);
        if (exit === "fade") tl.to(root, { opacity: 0, duration: 0.5, ease: "power2.in" }, isFinite(cues[0]) && cues[0] > 5.8 - T0 ? cues[0] : 11 - T0);
        tl.set({}, {}, 30);
        window.__timelines = window.__timelines || {};
        window.__timelines["lottie-character-walk-vertical"] = tl;
      })();
    </script>
  </body>
</html>
