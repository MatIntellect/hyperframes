<!doctype html>
<html
  lang="ru"
  data-composition-variables='[
    { "id": "name", "type": "string", "role": "content", "label": "Name", "description": "Upper-case name in the red block; wraps to two lines in the vertical version.", "maxLength": 28, "default": "Мат Джестер" },
    { "id": "role", "type": "string", "role": "content", "label": "Role", "description": "Line under the name. Empty hides it.", "maxLength": 40, "default": "Основатель MatIntellect" },
    { "id": "cues", "type": "string", "role": "timing", "label": "Cues", "description": "Comma-separated seconds from mount start: 1 the red block slides in, name and role rise inside it, 2 the plate leaves (only when exit is out). Empty keeps 0.1, 4.3.", "default": "" },
    { "id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "none holds the plate to the end of the mount; out plays its own leaving motion at cue 2.", "default": "none", "options": [{ "value": "none", "label": "Hold" }, { "value": "out", "label": "Leave" }] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+20BD, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: transparent;
        overflow: hidden;
      }
      body {
        width: 1920px;
        height: 1080px;
      }
      #lcl-root {
        font-family: var(--font-body, "Montserrat"), sans-serif;
      }
      #lcl-lt {
        position: absolute;
      }
      #lcl-block { background: var(--accent, #ff0000); padding: 20px 36px 24px 32px; box-shadow: 0 16px 44px rgba(0, 0, 0, 0.35); display: inline-flex; flex-direction: column; gap: 10px; }
      #lcl-name { font-weight: 800; color: #ffffff; line-height: 0.98; text-transform: uppercase; }
      #lcl-role { color: #ffffff; font-weight: 500; line-height: 1.2; letter-spacing: 0.02em; }
      
      #lcl-lt {
        left: 120px;
        bottom: 116px;
      }
      #lcl-name { font-size: 72px; white-space: nowrap; }
      #lcl-role { font-size: 30px; white-space: nowrap; }
      
      
    </style>
  </head>
  <body>
    <div id="lcl-root" data-composition-id="lt-color-block" data-width="1920" data-height="1080" data-start="0" data-duration="30">
      <div id="lcl-lt">
        <div id="lcl-block">
          <div id="lcl-name"></div>
          <div id="lcl-role"></div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var root = document.getElementById("lcl-root");
        var V =
          window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
            ? window.__hyperframes.getVariables()
            : {};
        function oneOf(v, list, d) {
          return list.indexOf(v) >= 0 ? v : d;
        }
        
        document.getElementById("lcl-name").textContent = typeof V.name === "string" && V.name.trim() ? V.name : "Мат Джестер";
        var role = typeof V.role === "string" ? V.role : "Основатель MatIntellect";
        var roleEl = document.getElementById("lcl-role");
        roleEl.textContent = role;
        if (!role) (document.getElementById("lcl-rolebox") || roleEl).style.display = "none";

        var cues = String(V.cues || "")
          .split(",")
          .map(function (v) {
            return parseFloat(v);
          });
        var c0 = isFinite(cues[0]) && cues[0] >= 0 ? cues[0] : 0.1;
        var exit = oneOf(V.exit, ["none", "out"], "none");

        var tl = gsap.timeline({ paused: true });
        tl.fromTo("#lcl-block", { x: -80, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "back.out(1.4)" }, c0);
        tl.fromTo("#lcl-name", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.42, ease: "power3.out" }, c0 + 0.2);
        tl.fromTo("#lcl-role", { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.42, ease: "power3.out" }, c0 + 0.3);
        if (exit === "out") {
          var out = isFinite(cues[1]) ? cues[1] : c0 + 4.2;
          tl.to("#lcl-block", { x: -60, opacity: 0, duration: 0.35, ease: "power2.in" }, out);
        }
        tl.set({}, {}, 30);
        window.__timelines = window.__timelines || {};
        window.__timelines["lt-color-block"] = tl;
      })();
    </script>
  </body>
</html>
