<!doctype html>
<html
  lang="ru"
  data-resolution="landscape"
  data-composition-variables='[
    { "id": "brandLogo", "type": "image", "role": "content", "label": "Brand logo", "description": "Horizontal transparent wordmark used in the header and belt.", "default": "assets/heygen-logo.svg" },
    { "id": "titleLine1", "type": "string", "role": "content", "label": "Headline line 1", "description": "First headline line.", "maxLength": 13, "default": "Ваш аватар," },
    { "id": "titleLine2", "type": "string", "role": "content", "label": "Headline line 2", "description": "Second headline line.", "maxLength": 13, "default": "без камеры." },
    { "id": "subhead", "type": "string", "role": "content", "label": "Subhead", "description": "Not shown in the landscape layout; kept for parity with the vertical block.", "maxLength": 36, "default": "Видео с ИИ за пару минут." },
    { "id": "pill1", "type": "string", "role": "content", "label": "Pill 1", "description": "First feature pill (not shown in landscape).", "maxLength": 14, "default": "4K АВАТАРЫ" },
    { "id": "pill2", "type": "string", "role": "content", "label": "Pill 2", "description": "Second feature pill (not shown in landscape).", "maxLength": 14, "default": "БЕЗ СЪЁМОК" },
    { "id": "offerValue", "type": "string", "role": "content", "label": "Offer value", "description": "Large offer value in the light tile.", "maxLength": 6, "default": "25%" },
    { "id": "offerSuffix", "type": "string", "role": "content", "label": "Offer suffix", "description": "Large word in the adjacent light tile.", "maxLength": 7, "default": "СКИДКА" },
    { "id": "codeLabel", "type": "string", "role": "content", "label": "Promo code label", "description": "Small label above the promo code.", "maxLength": 10, "default": "ПРОМОКОД" },
    { "id": "promoPrefix", "type": "string", "role": "content", "label": "Promo code prefix", "description": "Accent-colored promo-code prefix.", "maxLength": 5, "default": "GEN" },
    { "id": "promoSuffix", "type": "string", "role": "content", "label": "Promo code suffix", "description": "Light promo-code suffix.", "maxLength": 3, "default": "25" },
    { "id": "canvasColor", "type": "color", "role": "style", "label": "Canvas color", "description": "Main card background.", "default": "#eaf6fa" },
    { "id": "inkColor", "type": "color", "role": "style", "label": "Ink color", "description": "Primary headline, pill, and offer ink.", "default": "#0a1418" },
    { "id": "mutedInkColor", "type": "color", "role": "style", "label": "Muted ink color", "description": "Subhead ink.", "default": "#47545b" },
    { "id": "accentColor", "type": "color", "role": "style", "label": "Accent color", "description": "Brand accent used by tiles and promo-code prefix.", "default": "#00c3ff" },
    { "id": "lightTileColor", "type": "color", "role": "style", "label": "Light tile color", "description": "Light belt-tile surface.", "default": "#f7fcfe" },
    { "id": "darkTileColor", "type": "color", "role": "style", "label": "Dark tile color", "description": "Dark belt-tile surface.", "default": "#0b1215" },
    { "id": "cues", "type": "string", "role": "timing", "label": "Cues", "description": "Comma-separated seconds from mount start: 1 the header starts its fade-in (the belt moves for 10 s from the mount start, then holds), 2 the card leaves (only when exit is not none). Empty keeps 0, 9.5.", "default": "" },
    { "id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "none holds the card to the end of the mount.", "default": "none", "options": [{ "value": "none", "label": "Hold" }, { "value": "fade", "label": "Fade" }] }
  ]'
>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        font-family: "Inter", sans-serif;
      }
      #heygen-avatar-promo-card-landscape {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        --apc-canvas: #eaf6fa;
        --apc-ink: #0a1418;
        --apc-muted: #47545b;
        --apc-accent: #00c3ff;
        --apc-light-tile: #f7fcfe;
        --apc-dark-tile: #0b1215;
      }
      .bgfill {
        position: absolute;
        inset: 0;
        background: var(--apc-canvas);
      }
      /* the authored 1080-wide layout, from the logo (y 118) to the pills (y 1682), as one stage */
      #apc-stage {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1564px;
        transform-origin: 0 0;
      }
      .apc-full #apc-stage {
        transform: translate(133px, 180px) scale(0.7545);
      }
      #apc-card {
        position: absolute;
        left: 150px;
        width: 780px;
        top: 180px;
        height: 760px;
        overflow: hidden;
      }
      .apc-full #apc-card {
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        overflow: visible;
      }
      .apc-bottom #apc-card {
        top: 600px;
      }
      .apc-top #apc-card,
      .apc-bottom #apc-card {
        border-radius: 40px;
        background: var(--apc-canvas);
      }
      .apc-top #apc-stage,
      .apc-bottom #apc-stage {
        transform: translate(30px, -166px) scale(0.884);
      }
      .apc-top #apc-card {
        left: 453px;
        top: 46px;
        width: 1014px;
        height: 988px;
      }
      .apc-top #apc-hdr-logo,
      .apc-bottom #apc-hdr-logo,
      .apc-top #apc-hdr-subhead,
      .apc-bottom #apc-hdr-subhead,
      .apc-top #apc-hdr-pills,
      .apc-bottom #apc-hdr-pills {
        display: none;
      }
      .apc-top #apc-hdr-title,
      .apc-bottom #apc-hdr-title {
        top: 240px;
        font-size: 128px;
        line-height: 128px;
      }

      .hdr {
        position: absolute;
        left: 0;
        width: 1080px;
        text-align: center;
        color: var(--apc-ink);
      }
      #apc-hdr-logo {
        top: 0;
        height: 44px;
      }
      #apc-hdr-logo img {
        height: 44px;
      }
      #apc-hdr-title {
        top: 87px;
        font-family: "EB Garamond", serif;
        font-weight: 700;
        font-size: 148px;
        line-height: 150px;
        letter-spacing: -0.02em;
      }
      #apc-hdr-subhead {
        top: 406px;
        font-weight: 500;
        font-size: 38px;
        color: var(--apc-muted);
        letter-spacing: -0.01em;
      }
      #apc-hdr-pills {
        top: 1472px;
        display: flex;
        justify-content: center;
        gap: 28px;
      }
      .pill {
        border: 2px solid var(--apc-ink);
        border-radius: 999px;
        padding: 0 42px;
        height: 92px;
        line-height: 88px;
        font-weight: 600;
        font-size: 38px;
        letter-spacing: 0.08em;
        color: var(--apc-ink);
        white-space: nowrap;
      }

      #apc-belt-linear {
        position: absolute;
        top: 522px;
        left: 0;
        width: 2600px;
        height: 784px;
      }
      #apc-belt-entry {
        position: absolute;
        inset: 0;
      }
      .tile {
        position: absolute;
        width: 362px;
        height: 380px;
        border-radius: 30px;
        overflow: hidden;
        display: block;
      }
      .row1 {
        top: 0;
      }
      .row2 {
        top: 404px;
      }
      video.tile {
        object-fit: cover;
      }
      .light {
        background: var(--apc-light-tile);
      }
      .dark {
        background: var(--apc-dark-tile);
      }
      .cyan {
        background: var(--apc-accent);
      }
      .serif-tile {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "EB Garamond", serif;
        font-weight: 500;
        font-size: 165px;
        color: var(--apc-ink);
        white-space: nowrap;
      }
      .brand-tile {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .brand-tile img {
        width: 240px;
      }
      .code-tile {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
      }
      .code-tile .code {
        font-weight: 600;
        font-size: 42px;
        letter-spacing: 0.12em;
        color: #8fa3ad;
      }
      .code-tile .promo {
        font-weight: 800;
        font-size: 92px;
        letter-spacing: -0.01em;
      }
      .code-tile .promo .gen {
        color: var(--apc-accent);
      }
      .code-tile .promo .n25 {
        color: #fbfcfc;
      }
    </style>
  </head>
  <body>
    <div
      id="heygen-avatar-promo-card-landscape"
      data-composition-id="heygen-avatar-promo-card-landscape"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="30"
      data-fps="25"
    >
      <div class="bgfill" data-layout-allow-occlusion></div>
      <div id="apc-card">
        <div id="apc-stage">
          <!-- belt: geometry + motion law measured from the reference -->
          <div id="apc-belt-linear">
            <div id="apc-belt-entry">
              <!-- row 1 -->
              <div class="tile row1 cyan brand-tile" style="left: 139.1px">
                <img src="assets/heygen-logo.svg?t=1" alt="" />
              </div>
              <video
                class="tile row1 clip"
                id="apc-v-r1k1"
                src="assets/av_r1k1.mp4"
                style="left: 523.4px"
                data-start="0"
                data-duration="8.60"
                data-track-index="1"
                muted
                playsinline
              ></video>
              <div id="apc-offer-value" class="tile row1 light serif-tile" style="left: 907.7px">
                25%
              </div>
              <video
                class="tile row1 clip"
                id="apc-v-r1k3"
                src="assets/av_r1k3.mp4"
                style="left: 1292px"
                data-start="1.44"
                data-duration="8.56"
                data-track-index="2"
                muted
                playsinline
              ></video>
              <video
                class="tile row1 clip"
                id="apc-v-r1k3-b"
                src="assets/av_r1k3.mp4"
                style="left: 1292px"
                data-start="10"
                data-duration="10"
                data-track-index="2"
                muted
                playsinline
              ></video>
              <video
                class="tile row1 clip"
                id="apc-v-r1k3-c"
                src="assets/av_r1k3.mp4"
                style="left: 1292px"
                data-start="20"
                data-duration="10"
                data-track-index="2"
                muted
                playsinline
              ></video>
              <video
                class="tile row1 clip"
                id="apc-v-r1k4"
                src="assets/av_r1k4.mp4"
                style="left: 1676.3px"
                data-start="5.56"
                data-duration="4.44"
                data-track-index="3"
                muted
                playsinline
              ></video>
              <video
                class="tile row1 clip"
                id="apc-v-r1k4-b"
                src="assets/av_r1k4.mp4"
                style="left: 1676.3px"
                data-start="10"
                data-duration="10"
                data-track-index="3"
                muted
                playsinline
              ></video>
              <video
                class="tile row1 clip"
                id="apc-v-r1k4-c"
                src="assets/av_r1k4.mp4"
                style="left: 1676.3px"
                data-start="20"
                data-duration="10"
                data-track-index="3"
                muted
                playsinline
              ></video>
              <div class="tile row1 cyan" style="left: 2060.6px"></div>
              <!-- row 2 -->
              <video
                class="tile row2 clip"
                id="apc-v-r2k0"
                src="assets/av_r2k0.mp4"
                style="left: 139.1px"
                data-start="0"
                data-duration="4.48"
                data-track-index="4"
                muted
                playsinline
              ></video>
              <div id="apc-offer-suffix" class="tile row2 light serif-tile" style="left: 523.4px">
                СКИДКА
              </div>
              <video
                class="tile row2 clip"
                id="apc-v-r2k2"
                src="assets/av_r2k2.mp4"
                style="left: 907.7px"
                data-start="0"
                data-duration="10"
                data-track-index="5"
                muted
                playsinline
              ></video>
              <video
                class="tile row2 clip"
                id="apc-v-r2k2-b"
                src="assets/av_r2k2.mp4"
                style="left: 907.7px"
                data-start="10"
                data-duration="10"
                data-track-index="5"
                muted
                playsinline
              ></video>
              <video
                class="tile row2 clip"
                id="apc-v-r2k2-c"
                src="assets/av_r2k2.mp4"
                style="left: 907.7px"
                data-start="20"
                data-duration="10"
                data-track-index="5"
                muted
                playsinline
              ></video>
              <div class="tile row2 dark code-tile" style="left: 1292px">
                <div id="apc-code-label" class="code">ПРОМОКОД</div>
                <div class="promo">
                  <span id="apc-promo-prefix" class="gen">GEN</span
                  ><span id="apc-promo-suffix" class="n25">25</span>
                </div>
              </div>
              <div class="tile row2 light brand-tile" style="left: 1676.3px">
                <img src="assets/heygen-logo.svg?t=2" alt="" />
              </div>
              <div class="tile row2 dark" style="left: 2060.6px"></div>
            </div>
          </div>

          <!-- header block -->
          <div class="hdr" id="apc-hdr-logo"><img src="assets/heygen-logo.svg" alt="HeyGen" /></div>
          <div class="hdr" id="apc-hdr-title">
            Ваш аватар,
            <div id="apc-title-line-2">без камеры.</div>
          </div>
          <div class="hdr" id="apc-hdr-subhead">Видео с ИИ за пару минут.</div>
          <div class="hdr" id="apc-hdr-pills">
            <div id="apc-pill-1" class="pill">4K АВАТАРЫ</div>
            <div id="apc-pill-2" class="pill">БЕЗ СЪЁМОК</div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const variables =
        window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
          ? window.__hyperframes.getVariables()
          : {};
      const root = document.getElementById("heygen-avatar-promo-card-landscape");
      const text = (id, fallback) =>
        typeof variables[id] === "string" && variables[id].trim() ? variables[id] : fallback;
      const oneOf = (v, list, d) => (list.indexOf(v) >= 0 ? v : d);

      root.classList.add("apc-top");

      root.style.setProperty("--apc-canvas", text("canvasColor", "#eaf6fa"));
      root.style.setProperty("--apc-ink", text("inkColor", "#0a1418"));
      root.style.setProperty("--apc-muted", text("mutedInkColor", "#47545b"));
      root.style.setProperty("--apc-accent", text("accentColor", "#00c3ff"));
      root.style.setProperty("--apc-light-tile", text("lightTileColor", "#f7fcfe"));
      root.style.setProperty("--apc-dark-tile", text("darkTileColor", "#0b1215"));
      document.querySelectorAll(".brand-tile img, #apc-hdr-logo img").forEach((image) => {
        image.src = text("brandLogo", "assets/heygen-logo.svg");
      });
      document.getElementById("apc-hdr-title").firstChild.nodeValue = text(
        "titleLine1",
        "Ваш аватар,",
      );
      document.getElementById("apc-title-line-2").textContent = text("titleLine2", "без камеры.");
      document.getElementById("apc-hdr-subhead").textContent = text(
        "subhead",
        "Видео с ИИ за пару минут.",
      );
      document.getElementById("apc-pill-1").textContent = text("pill1", "4K АВАТАРЫ");
      document.getElementById("apc-pill-2").textContent = text("pill2", "БЕЗ СЪЁМОК");
      document.getElementById("apc-code-label").textContent = text("codeLabel", "ПРОМОКОД");
      document.getElementById("apc-promo-prefix").textContent = text("promoPrefix", "GEN");
      document.getElementById("apc-promo-suffix").textContent = text("promoSuffix", "25");
      // the offer words fill a 362 px tile: the size follows the letter count, never the width at runtime
      [
        ["apc-offer-value", "offerValue", "25%", 165],
        ["apc-offer-suffix", "offerSuffix", "СКИДКА", 146],
      ].forEach(([id, key, fallback, max]) => {
        const el = document.getElementById(id);
        const value = text(key, fallback);
        el.textContent = value;
        el.style.fontSize = Math.min(max, Math.floor(420 / Math.max(value.length, 1))) + "px";
      });

      const cues = String(variables.cues || "")
        .split(",")
        .map((v) => parseFloat(v));
      const at = (i, d) => (isFinite(cues[i]) ? cues[i] : d);
      const h = at(0, 0);
      const exit = oneOf(variables.exit, ["none", "fade"], "none");

      const tl = gsap.timeline({ paused: true });

      // Belt conveyor — measured from reference: 93.601 px/s constant, leftward; holds after 10 s
      tl.fromTo("#apc-belt-linear", { x: 0 }, { x: -936.01, duration: 10, ease: "none" }, 0);
      // Belt entry — measured offset table, one keyframe per source frame, linear between
      const entryX = [
        0, -11.39, -21.64, -30.9, -39.04, -46.29, -52.55, -57.98, -62.72, -66.71, -69.99, -72.75,
        -74.86, -76.52, -77.85, -78.8, -79.36, -79.75, -79.87, -79.94, -80.0,
      ];
      for (let i = 1; i < entryX.length; i++) {
        tl.fromTo(
          "#apc-belt-entry",
          { x: entryX[i - 1] },
          { x: entryX[i], duration: 0.04, ease: "none", immediateRender: i === 1 },
          (i - 1) * 0.04,
        );
      }

      // Header waterfall — measured fades, from cue 1
      tl.fromTo(
        "#apc-hdr-logo",
        { autoAlpha: 0 },
        { autoAlpha: 1, duration: 0.4, ease: "power2.out" },
        h,
      );
      tl.fromTo(
        "#apc-hdr-title",
        { autoAlpha: 0 },
        { autoAlpha: 1, duration: 0.6, ease: "power2.out" },
        h + 0.1,
      );
      tl.fromTo(
        "#apc-hdr-subhead",
        { autoAlpha: 0 },
        { autoAlpha: 1, duration: 0.4, ease: "power2.out" },
        h + 0.5,
      );
      if (exit === "fade")
        tl.to("#apc-card", { autoAlpha: 0, duration: 0.5, ease: "power2.in" }, at(1, 9.5));
      tl.set({}, {}, 30);

      window.__timelines = window.__timelines || {};
      window.__timelines["heygen-avatar-promo-card-landscape"] = tl;
    </script>
  </body>
</html>
