<!doctype html>
<html
  lang="ru"
  data-composition-variables='[
    { "id": "trackName", "type": "string", "role": "content", "label": "Track", "description": "Track title, bold.", "maxLength": 22, "default": "Монтаж без монтажёра" },
    { "id": "artistName", "type": "string", "role": "content", "label": "Artist", "description": "Artist line under the title.", "maxLength": 28, "default": "MatIntellect" },
    { "id": "cover", "type": "image", "role": "content", "label": "Cover", "description": "Square album cover. Empty keeps the green placeholder with a note icon.", "default": "" },
    { "id": "cues", "type": "string", "role": "timing", "label": "Cues", "description": "Comma-separated seconds from mount start: 1 card lands and the words follow, 2 card leaves (only when exit is not none). Empty keeps 0.1, 4.2.", "default": "" },
    { "id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "none holds the card to the end of the mount.", "default": "none", "options": [{ "value": "none", "label": "Hold" }, { "value": "fade", "label": "Fade" }, { "value": "up", "label": "Lift out" }] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=block" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: transparent;
        overflow: hidden;
      }
      body {
        width: 1920px;
        height: 1080px;
        font-family: "Inter", sans-serif;
      }

      [data-composition-id="spotify-card-landscape"] .spc-field {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      [data-composition-id="spotify-card-landscape"] .spc-card {
        position: relative;
        width: 780px;
        padding: 36px;
        display: flex;
        flex-direction: column;
        background: linear-gradient(165deg, rgba(140, 155, 170, 0.42) 0%, rgba(100, 115, 130, 0.35) 30%, rgba(75, 88, 105, 0.38) 60%, rgba(60, 72, 88, 0.44) 100%);
        border-radius: 28px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        box-shadow:
          0 24px 48px rgba(0, 0, 0, 0.3),
          0 2px 6px rgba(0, 0, 0, 0.12),
          inset 0 1px 0 rgba(255, 255, 255, 0.32),
          inset 0 -1px 0 rgba(0, 0, 0, 0.12);
        backdrop-filter: blur(40px) saturate(180%);
        -webkit-backdrop-filter: blur(40px) saturate(180%);
        overflow: hidden;
      }
      [data-composition-id="spotify-card-landscape"] .spc-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 55%;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0.07) 35%, transparent 100%);
        pointer-events: none;
      }
      [data-composition-id="spotify-card-landscape"] .spc-art {
        position: relative;
        z-index: 1;
        width: 708px;
        height: 708px;
        border-radius: 16px;
        flex-shrink: 0;
        overflow: hidden;
        background: linear-gradient(145deg, #1db954 0%, #17a34a 30%, #0f7234 60%, #191414 100%);
        margin-bottom: 36px;
      }
      [data-composition-id="spotify-card-landscape"] .spc-art img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      [data-composition-id="spotify-card-landscape"] .spc-art-icon {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        opacity: 0.2;
      }
      [data-composition-id="spotify-card-landscape"] .spc-text {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      [data-composition-id="spotify-card-landscape"] .spc-track {
        font-size: 52px;
        font-weight: 700;
        color: #ffffff;
        line-height: 1.15;
        margin-bottom: 8px;
        white-space: nowrap;
      }
      [data-composition-id="spotify-card-landscape"] .spc-artist {
        font-size: 34px;
        color: rgba(255, 255, 255, 0.7);
        line-height: 1.2;
        white-space: nowrap;
      }
      [data-composition-id="spotify-card-landscape"] .spc-bar {
        margin-top: 28px;
        height: 8px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.25);
        overflow: hidden;
      }
      [data-composition-id="spotify-card-landscape"] .spc-bar-fill {
        width: 100%;
        height: 100%;
        background: #ffffff;
        transform-origin: left center;
        transform: scaleX(0.3);
      }
      [data-composition-id="spotify-card-landscape"] .spc-brand {
        margin-top: 26px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      [data-composition-id="spotify-card-landscape"] .spc-brand-text {
        font-size: 28px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.6);
      }

      /* top / bottom: the mini-player row */
      [data-composition-id="spotify-card-landscape"].spc-top .spc-card,
      [data-composition-id="spotify-card-landscape"].spc-bottom .spc-card {
        flex-direction: row;
        align-items: center;
        gap: 32px;
        padding: 32px;
      }
      [data-composition-id="spotify-card-landscape"].spc-top .spc-art,
      [data-composition-id="spotify-card-landscape"].spc-bottom .spc-art {
        width: 300px;
        height: 300px;
        margin-bottom: 0;
      }
      [data-composition-id="spotify-card-landscape"].spc-top .spc-art-icon,
      [data-composition-id="spotify-card-landscape"].spc-bottom .spc-art-icon {
        width: 110px;
        height: 110px;
      }
      [data-composition-id="spotify-card-landscape"].spc-top .spc-text,
      [data-composition-id="spotify-card-landscape"].spc-bottom .spc-text {
        flex: 1;
      }
      [data-composition-id="spotify-card-landscape"].spc-top .spc-track,
      [data-composition-id="spotify-card-landscape"].spc-bottom .spc-track {
        font-size: 40px;
        white-space: normal;
      }
      [data-composition-id="spotify-card-landscape"].spc-top .spc-artist,
      [data-composition-id="spotify-card-landscape"].spc-bottom .spc-artist {
        font-size: 30px;
        white-space: normal;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="spotify-card-landscape" data-width="1920" data-height="1080" data-start="0" data-duration="30">
      <div class="spc-field">
        <div id="spc-card" class="clip spc-card" data-start="0" data-duration="30" data-track-index="0">
          <div id="spc-art" class="spc-art">
            <svg class="spc-art-icon" width="200" height="200" viewBox="0 0 24 24" fill="none">
              <path d="M9 18V5l12-2v13" stroke="rgba(255,255,255,0.7)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
              <circle cx="6" cy="18" r="3" stroke="rgba(255,255,255,0.7)" stroke-width="1" />
              <circle cx="18" cy="16" r="3" stroke="rgba(255,255,255,0.7)" stroke-width="1" />
            </svg>
          </div>
          <div class="spc-text">
            <div id="spc-track" class="spc-track">Монтаж без монтажёра</div>
            <div id="spc-artist" class="spc-artist">MatIntellect</div>
            <div id="spc-bar" class="spc-bar"><div id="spc-bar-fill" class="spc-bar-fill"></div></div>
            <div id="spc-brand" class="spc-brand">
              <svg width="34" height="34" viewBox="0 0 16 16" fill="#1db954">
                <path
                  d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0m3.669 11.538a.5.5 0 0 1-.686.165c-1.879-1.147-4.243-1.407-7.028-.77a.499.499 0 0 1-.222-.973c3.048-.696 5.662-.397 7.770.892a.5.5 0 0 1 .166.686m.979-2.178a.624.624 0 0 1-.858.205c-2.150-1.321-5.428-1.704-7.972-.932a.625.625 0 0 1-.362-1.194c2.905-.881 6.517-.454 8.986 1.063a.624.624 0 0 1 .206.858m.084-2.268C10.154 5.560 5.900 5.419 3.438 6.166a.748.748 0 1 1-.434-1.432c2.825-.857 7.523-.692 10.492 1.070a.747.747 0 1 1-.764 1.288"
                />
              </svg>
              <span class="spc-brand-text">Spotify</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        var root = document.querySelector('[data-composition-id="spotify-card-landscape"]');
        var vars =
          window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
            ? window.__hyperframes.getVariables()
            : {};
        function str(v, d) {
          return typeof v === "string" && v.trim() ? v : d;
        }
        function oneOf(v, list, d) {
          return list.indexOf(v) >= 0 ? v : d;
        }

        root.classList.add("spc-top");

        document.getElementById("spc-track").textContent = str(vars.trackName, "Монтаж без монтажёра");
        document.getElementById("spc-artist").textContent = str(vars.artistName, "MatIntellect");
        var cover = str(vars.cover, "");
        if (cover) {
          var img = document.createElement("img");
          img.src = cover;
          img.alt = "";
          document.getElementById("spc-art").appendChild(img);
        }

        var authored = [0.1, 4.2];
        var cues = String(vars.cues || "")
          .split(",")
          .map(function (s) {
            return parseFloat(s);
          });
        function at(i) {
          return isFinite(cues[i]) ? cues[i] : authored[i];
        }
        var exit = oneOf(vars.exit, ["none", "fade", "up"], "none");

        var card = document.getElementById("spc-card");
        var art = document.getElementById("spc-art");
        var parts = ["spc-track", "spc-artist", "spc-bar", "spc-brand"].map(function (id) {
          return document.getElementById(id);
        });

        var tl = gsap.timeline({ paused: true });
        gsap.set(card, { y: 60, opacity: 0, scale: 0.94 });
        gsap.set(parts, { y: 18, opacity: 0 });
        var t0 = at(0);
        tl.to(card, { y: 0, opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" }, t0);
        tl.to(parts, { y: 0, opacity: 1, duration: 0.45, ease: "power2.out", stagger: 0.15 }, t0 + 0.45);
        tl.to(art, { scale: 1.015, duration: 1.5, ease: "power1.inOut", yoyo: true, repeat: 1 }, t0 + 1.1);
        tl.fromTo("#spc-bar-fill", { scaleX: 0.3 }, { scaleX: 0.75, duration: 30 - t0, ease: "none" }, t0);
        if (exit === "fade") tl.to(card, { opacity: 0, duration: 0.4, ease: "power2.in" }, at(1));
        if (exit === "up") tl.to(card, { y: -40, opacity: 0, scale: 0.96, duration: 0.5, ease: "power2.in" }, at(1));

        window.__timelines = window.__timelines || {};
        window.__timelines["spotify-card-landscape"] = tl;
      })();
    </script>
  </body>
</html>
