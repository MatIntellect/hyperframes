<!doctype html>
<html
  lang="ru"
  data-composition-variables='[
    { "id": "title", "type": "string", "role": "content", "label": "Headline", "description": "Headline, Bebas Neue, one line wide, up to two lines vertical.", "maxLength": 32, "default": "Медианный доход по штатам" },
    { "id": "subtitle", "type": "string", "role": "content", "label": "Subtitle", "description": "Line under the headline. Empty hides it.", "maxLength": 60, "default": "Доход домохозяйства в год, долларов, 2024" },
    { "id": "data", "type": "string", "role": "content", "label": "Data", "description": "States separated by ;, each as code: value with the two-letter postal code (CA, NY, TX, DC...). Every state is one equal hex with its code; colour runs from the lowest to the highest value.", "maxLength": 800, "default": "MD: 106998; NJ: 101778; MA: 101079; CT: 92545; HI: 91010; NH: 90845; WA: 90325; CA: 89648; CO: 87598; VA: 87249; UT: 86833; MN: 84313; AK: 83601; NY: 81386; RI: 81370; IL: 79253; OR: 76632; DE: 75932; WI: 72458; NV: 71646; VT: 71560; PA: 71610; ND: 71017; NE: 70654; TX: 70813; AZ: 70821; ID: 69973; MT: 68091; GA: 67992; ME: 67587; FL: 67917; IA: 67684; WY: 67249; SD: 66894; MI: 66986; IN: 65834; OH: 64018; MO: 63594; KS: 66354; NC: 65070; TN: 63426; SC: 62064; OK: 60438; KY: 57584; NM: 58257; AL: 57563; LA: 55728; WV: 52520; AR: 53289; MS: 52434; DC: 101722" },
    { "id": "highlight", "type": "string", "role": "content", "label": "Highlight", "description": "Codes of up to five states whose hexes pulse, separated by commas. Empty pulses none.", "maxLength": 24, "default": "MD, NJ, MA, CT, HI" },
    { "id": "legendLow", "type": "string", "role": "content", "label": "Legend low", "description": "Label at the low end of the colour bar.", "maxLength": 14, "default": "52 тыс. $" },
    { "id": "legendHigh", "type": "string", "role": "content", "label": "Legend high", "description": "Label at the high end of the colour bar.", "maxLength": 14, "default": "107 тыс. $" },
    { "id": "source", "type": "string", "role": "content", "label": "Source", "description": "Source line. Empty hides it.", "maxLength": 50, "default": "Источник: Бюро переписи США" },
    { "id": "cues", "type": "string", "role": "timing", "label": "Cues", "description": "Comma-separated seconds from mount start: 1 the headline lands, 2 the hexes grow in from the centre and their codes follow (about 3 s), 3 the highlighted hexes pulse twice, 4 the map fades out (only when exit is fade). Empty keeps 0, 1, 5.", "default": "" },
    { "id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "none holds the map to the end of the mount.", "default": "none", "options": [{ "value": "none", "label": "Hold" }, { "value": "fade", "label": "Fade" }] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"
      integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
        <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: transparent;
        overflow: hidden;
      }
      body {
        width: 1920px;
        height: 1080px;
      }
      #ush-root {
        position: absolute;
        inset: 0;
        font-family: var(--font-body, "Montserrat"), sans-serif;
        color: var(--fg, #f2f2f2);
      }
      .ush-ground {
        position: absolute;
        inset: 0;
        background: var(--bg, #0c1014);
      }
      #ush-box {
        position: absolute;
        display: flex;
        flex-direction: column;
      }
      #ush-title {
        font-family: var(--font-display, "Bebas Neue"), sans-serif;
        font-weight: 700;
        line-height: 1;
        text-transform: uppercase;
        clip-path: inset(-0.3em 100% -0.3em 0);
      }
      #ush-sub {
        color: var(--muted, #8a8a90);
        line-height: 1.25;
        opacity: 0;
      }
      #ush-map {
        display: block;
        flex: none;
      }
      .ush-country {
        stroke: var(--bg, #0c1014);
        stroke-width: 2;
      }
      .ush-code {
        font-family: var(--font-body, "Montserrat"), sans-serif;
        font-size: 28px;
        font-weight: 700;
        fill: var(--fg, #f2f2f2);
        text-anchor: middle;
        dominant-baseline: central;
      }
      .ush-label {
        font-family: var(--font-body, "Montserrat"), sans-serif;
        font-size: 28px;
        font-weight: 700;
        fill: var(--fg, #f2f2f2);
        stroke: var(--bg, #0c1014);
        stroke-width: 5px;
        paint-order: stroke;
        text-anchor: middle;
        dominant-baseline: central;
      }
      .ush-tick {
        stroke: var(--fg, #f2f2f2);
        stroke-width: 2;
      }
      #ush-foot {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 40px;
      }
      #ush-source {
        color: var(--muted, #8a8a90);
        font-size: 28px;
        opacity: 0;
      }
      #ush-legend {
        display: flex;
        flex-direction: column;
        gap: 10px;
        opacity: 0;
      }
      #ush-bar {
        height: 16px;
        border-radius: 8px;
      }
      #ush-labels {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        font-size: 28px;
        font-weight: 600;
        color: var(--muted, #8a8a90);
      }
      
      #ush-box {
        left: 120px;
        top: 70px;
        width: 1680px;
        height: 960px;
      }
      #ush-title {
        font-size: 96px;
        white-space: nowrap;
      }
      #ush-sub {
        font-size: 34px;
        margin-top: 12px;
        white-space: nowrap;
      }
      #ush-map {
        margin: 24px auto 0;
      }
      #ush-foot {
        margin-top: 16px;
      }
      #ush-legend {
        width: 520px;
      }
      
      
    </style>
  </head>
  <body>
    <div id="ush-root" data-composition-id="us-map-hex" data-width="1920" data-height="1080" data-start="0" data-duration="30">
      <div class="ush-ground"></div>
      <div id="ush-box">
        <div id="ush-title"></div>
        <div id="ush-sub"></div>
        <svg id="ush-map"></svg>
        <div id="ush-foot">
          <div id="ush-source"></div>
          <div id="ush-legend">
            <div id="ush-bar"></div>
            <div id="ush-labels"><span id="ush-low"></span><span id="ush-high"></span></div>
          </div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var root = document.getElementById("ush-root");
        var V =
          window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
            ? window.__hyperframes.getVariables()
            : {};
        function oneOf(v, list, d) {
          return list.indexOf(v) >= 0 ? v : d;
        }
        function txt(v, d) {
          return typeof v === "string" ? v.trim() : d;
        }
        var showCodes = true;
        var MAPW = 1000,
          MAPH = 700;
        
        var DEF =
          "MD: 106998; NJ: 101778; MA: 101079; CT: 92545; HI: 91010; NH: 90845; WA: 90325; CA: 89648; CO: 87598; VA: 87249; UT: 86833; MN: 84313; AK: 83601; NY: 81386; RI: 81370; IL: 79253; OR: 76632; DE: 75932; WI: 72458; NV: 71646; VT: 71560; PA: 71610; ND: 71017; NE: 70654; TX: 70813; AZ: 70821; ID: 69973; MT: 68091; GA: 67992; ME: 67587; FL: 67917; IA: 67684; WY: 67249; SD: 66894; MI: 66986; IN: 65834; OH: 64018; MO: 63594; KS: 66354; NC: 65070; TN: 63426; SC: 62064; OK: 60438; KY: 57584; NM: 58257; AL: 57563; LA: 55728; WV: 52520; AR: 53289; MS: 52434; DC: 101722";
        var titleEl = document.getElementById("ush-title"),
          subEl = document.getElementById("ush-sub"),
          srcEl = document.getElementById("ush-source");
        titleEl.textContent = txt(V.title, "Медианный доход по штатам");
        subEl.textContent = txt(V.subtitle, "Доход домохозяйства в год, долларов, 2024");
        srcEl.textContent = txt(V.source, "Источник: Бюро переписи США");
        if (!subEl.textContent) subEl.style.display = "none";
        document.getElementById("ush-low").textContent = txt(V.legendLow, "52 тыс. $");
        document.getElementById("ush-high").textContent = txt(V.legendHigh, "107 тыс. $");

        // Плитки: родная раскладка штатов (столбец, строка), шестиугольник с плоским верхом
        var POS = { ME: [10, 0], VT: [9, 1], NH: [10, 1], WA: [0, 2], MT: [1, 2], ND: [2, 2], MN: [3, 2], WI: [4, 2], MI: [7, 2], NY: [8, 2], MA: [9, 2], RI: [10, 2], ID: [0, 3], WY: [1, 3], SD: [2, 3], IA: [3, 3], IL: [4, 3], IN: [5, 3], OH: [6, 3], PA: [7, 3], NJ: [8, 3], CT: [9, 3], OR: [0, 4], NV: [1, 4], CO: [2, 4], NE: [3, 4], MO: [4, 4], KY: [5, 4], WV: [6, 4], VA: [7, 4], MD: [8, 4], DE: [9, 4], CA: [0, 5], UT: [1, 5], NM: [2, 5], KS: [3, 5], AR: [4, 5], TN: [5, 5], NC: [6, 5], SC: [7, 5], DC: [8, 5], AZ: [1, 6], OK: [3, 6], LA: [4, 6], MS: [5, 6], AL: [6, 6], GA: [7, 6], HI: [0, 7], TX: [3, 7], FL: [7, 7], AK: [0, 8] };
        var values = {};
        String(typeof V.data === "string" && V.data.trim() ? V.data : DEF)
          .split(";")
          .forEach(function (item) {
            var k = item.lastIndexOf(":");
            if (k < 0) return;
            var id = item.slice(0, k).trim().toUpperCase();
            var num = parseFloat(item.slice(k + 1).replace(/[\s ]/g, "").replace(",", "."));
            if (POS[id] && isFinite(num)) values[id] = num;
          });
        var ids = Object.keys(values);
        var vmin = Math.min.apply(null, ids.map(function (i) {
            return values[i];
          })),
          vmax = Math.max.apply(null, ids.map(function (i) {
            return values[i];
          }));

        // Цвета – из меток темы: от тёмного красного к акценту; без данных – чуть светлее карточки
        function rgb(css) {
          var p = document.createElement("i");
          p.style.color = css;
          root.appendChild(p);
          var m = getComputedStyle(p).color.match(/[\d.]+/g).map(Number);
          p.remove();
          return m;
        }
        var cs = getComputedStyle(root);
        var accent = rgb(cs.getPropertyValue("--accent").trim() || "#ff0000"),
          surface = rgb(cs.getPropertyValue("--surface").trim() || "#18181a"),
          fg = rgb(cs.getPropertyValue("--fg").trim() || "#f2f2f2");
        function mix(a, b, t) {
          return "rgb(" + [0, 1, 2].map(function (i) {
            return Math.round(a[i] + (b[i] - a[i]) * t);
          }).join(",") + ")";
        }
        var noData = mix(surface, fg, 0.1);
        function colorOf(v) {
          var top = vmax;
          var t = top > vmin ? (v - vmin) / (top - vmin) : 1;
          return mix(surface, accent, 0.28 + 0.72 * Math.min(1, t));
        }
        document.getElementById("ush-bar").style.background =
          "linear-gradient(90deg, " + mix(surface, accent, 0.28) + ", " + mix(surface, accent, 1) + ")";

        var svg = d3.select("#ush-map").attr("width", MAPW).attr("height", MAPH).attr("viewBox", "0 0 " + MAPW + " " + MAPH);
        // размер плитки – наибольший, при котором сетка 11 x 9 входит в поле
        var hw = Math.min(MAPW / 8.875, MAPH / (9 * 0.866));
        var hh = hw * 0.866,
          gx = (MAPW - 8.875 * hw) / 2 + hw / 2,
          gy = (MAPH - 9 * hh) / 2 + hh / 2;
        function center(p) {
          return [gx + p[0] * hw * 0.75 + (p[1] % 2 ? hw * 0.375 : 0), gy + p[1] * hh];
        }
        var codesG = [];
        var tiles = Object.keys(POS).map(function (st) {
          var c = center(POS[st]),
            r = hw / 2 - 2;
          var pts = [0, 60, 120, 180, 240, 300]
            .map(function (a) {
              return (c[0] + r * Math.cos((a * Math.PI) / 180)).toFixed(1) + "," + (c[1] + r * Math.sin((a * Math.PI) / 180)).toFixed(1);
            })
            .join(" ");
          var el = svg
            .append("polygon")
            .attr("class", "ush-country")
            .attr("id", "ush-c" + st)
            .attr("points", pts)
            .attr("fill", st in values ? colorOf(values[st]) : noData)
            .node();
          return { el: el, st: st, c: c, d: Math.hypot(c[0] - MAPW / 2, c[1] - MAPH / 2) };
        });
        // коды – отдельным слоем поверх всех сот, иначе соседняя сота режет буквы
        if (showCodes)
          tiles.forEach(function (t) {
            codesG.push(svg.append("text").attr("class", "ush-code").attr("x", t.c[0]).attr("y", t.c[1]).text(t.st).node());
          });
        tiles.sort(function (a, b) {
          return a.d - b.d;
        });
        var cues = String(V.cues || "")
          .split(",")
          .map(function (v) {
            return parseFloat(v);
          });
        var c0 = isFinite(cues[0]) && cues[0] >= 0 ? cues[0] : 0;
        var cM = isFinite(cues[1]) && cues[1] >= c0 ? cues[1] : c0 + 1;
        var cP = isFinite(cues[2]) && cues[2] > cM ? cues[2] : cM + 4;
        var exit = oneOf(V.exit, ["none", "fade"], "none");

        var tl = gsap.timeline({ paused: true });
        tl.to(titleEl, { clipPath: "inset(-0.3em 0% -0.3em 0)", duration: 1, ease: "power3.inOut" }, c0);
        tl.to(subEl, { opacity: 1, duration: 0.6, ease: "power2.out" }, c0 + 0.4);
        tl.fromTo(
          tiles.map(function (t) {
            return t.el;
          }),
          { opacity: 0, scale: 0, transformOrigin: "50% 50%" },
          { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.4)", stagger: 2.2 / tiles.length },
          cM,
        );
        if (codesG.length) tl.fromTo(codesG, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out", stagger: 1 / codesG.length }, cM + 2.2);
        tl.to("#ush-legend", { opacity: 1, duration: 0.6, ease: "power2.out" }, cM + 3);
        tl.to(srcEl, { opacity: 1, duration: 0.5, ease: "power2.out" }, cM + 3.5);
        var hot = String(typeof V.highlight === "string" ? V.highlight : "MD, NJ, MA, CT, HI")
          .split(",")
          .map(function (c) {
            return document.getElementById("ush-c" + c.trim().toUpperCase());
          })
          .filter(Boolean)
          .slice(0, 5);
        if (hot.length) {
          tl.to(hot, { filter: "brightness(1.4)", duration: 0.4, stagger: 0.08, ease: "power2.out" }, cP);
          tl.to(hot, { filter: "brightness(1)", duration: 0.4, stagger: 0.08, ease: "power2.in" }, cP + 0.8);
          tl.to(hot, { filter: "brightness(1.3)", duration: 0.3, stagger: 0.06, ease: "power2.out" }, cP + 1.4);
          tl.to(hot, { filter: "brightness(1)", duration: 0.5, stagger: 0.06, ease: "power2.in" }, cP + 2);
        }
        if (exit === "fade") tl.to("#ush-root", { opacity: 0, duration: 0.5, ease: "power2.in" }, isFinite(cues[3]) ? cues[3] : cP + 3);
        tl.set({}, {}, 30);
        window.__timelines = window.__timelines || {};
        window.__timelines["us-map-hex"] = tl;
      })();
    </script>
  </body>
</html>
