<!doctype html>
<html
  lang="ru"
  data-composition-variables='[
    { "id": "placement", "type": "enum", "role": "layout", "label": "Placement", "description": "full: own ground to the frame edge, the glass headline centred on the field (y 770), text and glass inside the 780 field. top / bottom: the scene on a 780x760 card at y 180-940 / 600-1360, rest of the frame transparent.", "default": "full", "options": [{ "value": "full", "label": "Full screen" }, { "value": "top", "label": "Top" }, { "value": "bottom", "label": "Bottom" }] },
    {"id": "headline", "type": "string", "label": "Headline", "default": "Монтаж из стекла", "maxLength": 20, "role": "content", "description": "Bebas Neue, one line; a long line scales down to fit the field (20 letters keep at least 28 px)."},
    {"id": "tileCount", "type": "number", "label": "Tiles", "default": 8, "min": 1, "max": 400, "step": 1, "role": "style"},

    {"id": "flyInRotation", "type": "number", "label": "Fly-in rotation (0-60)", "description": "Amount of inbound tumbling over the entire flight. 0 disables flight rotation; final orientation lands with each shard position.", "default": 5, "min": 0, "max": 60, "step": 0.1, "role": "motion"},
    {"id": "flyOutRotation", "type": "number", "label": "Fly-out rotation (0-6)", "default": 6, "min": 0, "max": 6, "step": 0.1, "role": "motion"},
    {"id": "chaos", "type": "number", "label": "Outline chaos (0-1)", "default": 0.25, "min": 0, "max": 1, "step": 0.01, "role": "style"},
    {"id": "padding", "type": "number", "label": "Edge padding (0-1)", "default": 1, "min": 0, "max": 1, "step": 0.01, "role": "style"},
    {"id": "sizeVariance", "type": "number", "label": "Size variance (0-1)", "default": 0.35, "min": 0, "max": 1, "step": 0.01, "role": "style"},
    {"id": "gap", "type": "number", "label": "Tile gap", "default": 0.03, "min": 0, "max": 0.3, "step": 0.002, "role": "style"},
    {"id": "easePow", "type": "number", "label": "Fly-in position ease (1-10)", "description": "Shapes lateral and depth travel. Rotation uses the same staggered flight window with a gentle settle through arrival.", "default": 10, "min": 1, "max": 10, "step": 0.1, "role": "motion"},
    {"id": "sideDist", "type": "number", "label": "Side fly distance", "default": 3, "min": 0, "max": 60, "step": 0.5, "role": "motion"},
    {"id": "zDist", "type": "number", "label": "Z fly-from (negative)", "default": -42, "min": -400, "max": 0, "step": 2, "role": "motion"},
    {"id": "zOut", "type": "number", "label": "Z fly-out to (+ = past camera)", "default": 14, "min": -400, "max": 60, "step": 2, "role": "motion"},
    {"id": "fog", "type": "number", "label": "Fog distance (0 = off)", "default": 36, "min": 0, "max": 400, "step": 2, "role": "style"},
    { "id": "cues", "type": "string", "role": "timing", "label": "Cues", "description": "Comma-separated seconds from mount start: 1 the shards start flying in (default 0.12), 2 the exit starts: the shards fly out, or the block fades (default 6.13 s after cue 1). Empty keeps the native times.", "default": "" },
    { "id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "fly is the native fly-out past the camera; fade dissolves the seated headline; none holds it to the end of the mount.", "default": "fly", "options": [{ "value": "fade", "label": "Fade" }, { "value": "fly", "label": "Fly out" }, { "value": "none", "label": "Hold" }] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3-delaunay@6.0.4/dist/d3-delaunay.min.js"></script>
    <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;
      }
      #gstv-root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        font-family: var(--font-body, "Montserrat"), sans-serif;
      }
      #gst-canvas-clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: var(--bg, #0c1014); /* flat — no gradients, no glow */
      }
      
      #gst-canvas-clip.gstv-card {
        left: 150px;
        width: 780px;
        height: 760px;
        top: 180px;
        border-radius: 32px;
        border: 2px solid var(--border, #2e2e32);
      }
      #gst-canvas-clip.gstv-bottom {
        top: 600px;
      }
      
      #gst-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #gst-fontload {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      data-hf-id="hf-51pv"
      id="gstv-root"
      data-composition-id="glass-shard-title-vertical"
      data-start="0"
      data-duration="30"
      data-width="1080"
      data-height="1920"
    >
      <div
        data-hf-id="hf-lsju"
        id="gst-canvas-clip"
        class="clip"
        data-start="0"
        data-duration="30"
        data-track-index="1"
        data-media-start="0"
      ></div>
      <div
        data-hf-id="hf-uo1i"
        id="gst-fontload"
        aria-hidden="true"
        data-start="0"
        data-duration="30"
        data-media-start="0"
      >
        <span data-hf-id="hf-kqtg" style="font-family: var(--font-display, 'Bebas Neue'); font-weight: 700">Аа</span>
      </div>
      <!-- glass-main.js reads these hrefs: a mounted block's src/href are rebased, strings in its script are not. -->
      <link
        id="gst-hdr"
        rel="preload"
        as="fetch"
        crossorigin="anonymous"
        href="assets/ferndale_studio_01_1k.hdr"
      />
      <link
        id="gst-matcap"
        rel="preload"
        as="image"
        crossorigin="anonymous"
        href="assets/matcap-1.png"
      />
    </div>

    <script>
      /* ================================================================
         glass-shard-title — iridescent glass shards fly in from the left
         and right edges, assemble into the headline, idle with a slight
         rotation, then fly back out and leave the frame empty.

         The ONLY content is the headline. Flat dark background.

         Seek-safety: the timeline drives two master progresses (tin, tout)
         plus the material resolve; every per-shard position/rotation is a
         pure function of those masters and st.time. No rAF, no
         integrators, no Math.random(). Shard layout is seeded and built
         after fonts load (cell selection samples the rasterised text).
         ================================================================ */
      window.__timelines = window.__timelines || {};
      /* Studio's variables/SDK parser fails on any composition with a <canvas>
         in its MARKUP (verified by bisection) — so the canvas is created at
         runtime instead. Identical for preview/render; invisible to the parser.

         Guarded: if this script is evaluated twice in one document a second
         <canvas id="gst-canvas"> would be appended, getElementById would keep
         returning the FIRST one, and the second three.js renderer would be
         built on a canvas that already owns a live WebGL context. */
      (function () {
        if (document.getElementById("gst-canvas")) return;
        var c = document.createElement("canvas");
        c.id = "gst-canvas";
        c.width = 1080;
        c.height = 1920;
        document.getElementById("gst-canvas-clip").appendChild(c);
      })();

      window.gstMulberry32 = gstMulberry32;
      function gstMulberry32(seed) {
        return function () {
          var s = (seed = (seed + 0x6d2b79f5) | 0);
          var t = Math.imul(s ^ (s >>> 15), 1 | s);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      (function () {
        var DUR = 30;

        /* ---- Studio variables ---- */
        var vars = {
          headline: "Монтаж из стекла",
          tileCount: 8,
          roundness: 0.4,
          bevel: 0.35,
          meshSmooth: 0.6,
          flyInTime: 2.3,
          flyOutTime: 2.4,
          stagger: 0.27,
          flyInRotation: 5,
          flyOutRotation: 6,
          chaos: 0.25,
          padding: 1,
          sizeVariance: 0.35,
          gap: 0.03,
          easePow: 10,
          sideDist: 3,
          zDist: -42,
          zOut: 14,
          fog: 36,
        };
        try {
          if (window.__hyperframes && window.__hyperframes.getVariables) {
            var v = window.__hyperframes.getVariables() || {};
            if (v.headline) vars.headline = String(v.headline);
            if (v.title) vars.headline = String(v.title); /* legacy id */
            if (v.tileCount !== undefined && isFinite(Number(v.tileCount)))
              vars.tileCount = Number(v.tileCount);
            if (v.roundness !== undefined && isFinite(Number(v.roundness)))
              vars.roundness = Number(v.roundness);
            if (v.bevel !== undefined && isFinite(Number(v.bevel))) vars.bevel = Number(v.bevel);
            if (v.meshSmooth !== undefined && isFinite(Number(v.meshSmooth)))
              vars.meshSmooth = Number(v.meshSmooth);
            if (v.flyInTime !== undefined && isFinite(Number(v.flyInTime)))
              vars.flyInTime = Number(v.flyInTime);
            if (v.flyOutTime !== undefined && isFinite(Number(v.flyOutTime)))
              vars.flyOutTime = Number(v.flyOutTime);
            if (v.stagger !== undefined && isFinite(Number(v.stagger)))
              vars.stagger = Number(v.stagger);
            /* Legacy callers may still provide spin. New controls override it
               independently; the old multiplier/default keeps its meaning. */
            if (v.spin !== undefined && isFinite(Number(v.spin))) {
              vars.flyInRotation = vars.flyOutRotation = Math.max(0, Math.min(6, Number(v.spin)));
            }
            if (v.flyInRotation !== undefined && isFinite(Number(v.flyInRotation)))
              vars.flyInRotation = Number(v.flyInRotation);
            if (v.flyOutRotation !== undefined && isFinite(Number(v.flyOutRotation)))
              vars.flyOutRotation = Number(v.flyOutRotation);
            if (v.zOut !== undefined && isFinite(Number(v.zOut))) vars.zOut = Number(v.zOut);
            if (v.chaos !== undefined && isFinite(Number(v.chaos))) vars.chaos = Number(v.chaos);
            if (v.padding !== undefined && isFinite(Number(v.padding)))
              vars.padding = Number(v.padding);
            if (v.sizeVariance !== undefined && isFinite(Number(v.sizeVariance)))
              vars.sizeVariance = Number(v.sizeVariance);
            if (v.gap !== undefined && isFinite(Number(v.gap))) vars.gap = Number(v.gap);
            if (v.easePow !== undefined && isFinite(Number(v.easePow)))
              vars.easePow = Number(v.easePow);
            if (v.sideDist !== undefined && isFinite(Number(v.sideDist)))
              vars.sideDist = Number(v.sideDist);
            if (v.zDist !== undefined && isFinite(Number(v.zDist))) vars.zDist = Number(v.zDist);
            if (v.fog !== undefined && isFinite(Number(v.fog))) vars.fog = Number(v.fog);
          }
        } catch (e) {
          /* keep defaults */
        }
        vars.tileCount = Math.max(1, Math.min(400, Math.round(vars.tileCount)));
        vars.roundness = Math.max(0, Math.min(1, vars.roundness));
        vars.bevel = Math.max(0, Math.min(1, vars.bevel));
        vars.meshSmooth = Math.max(0, Math.min(1, vars.meshSmooth));
        vars.flyInTime = Math.max(0.2, Math.min(6, vars.flyInTime));
        vars.flyOutTime = Math.max(0.2, Math.min(6, vars.flyOutTime));
        vars.stagger = Math.max(0, Math.min(1, vars.stagger));
        vars.flyInRotation = Math.max(0, Math.min(60, vars.flyInRotation));
        vars.flyOutRotation = Math.max(0, Math.min(6, vars.flyOutRotation));
        vars.zOut = Math.max(-400, Math.min(60, vars.zOut));
        vars.chaos = Math.max(0, Math.min(1, vars.chaos));
        vars.padding = Math.max(0, Math.min(1, vars.padding));
        vars.sizeVariance = Math.max(0, Math.min(1, vars.sizeVariance));
        vars.gap = Math.max(0, Math.min(0.3, vars.gap));
        vars.easePow = Math.max(1, Math.min(10, vars.easePow));
        vars.sideDist = Math.max(0, Math.min(60, vars.sideDist));
        /* zDist is a coordinate: accept "-200" style input, clamp behind pane. */
        vars.zDist = Math.min(0, Math.max(-400, vars.zDist > 0 ? -vars.zDist : vars.zDist));
        vars.fog = Math.max(0, Math.min(400, vars.fog));

        /* ---- Layout and theme for glass-main.js ---- */
        var V = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
        var root = document.getElementById("gstv-root");
        var clip = document.getElementById("gst-canvas-clip");
        /* W x H canvas; VHV/VY: the full view the camera is built for and the canvas offset
           in it; FW x FH: the field that bounds text and glass. Wide = the native frame. */
        var layout = { W: 1080, H: 1920, VHV: 1920, VY: 0, FW: 1080, FH: 1920 };
        
        var placement = ["full", "top", "bottom"].indexOf(V.placement) >= 0 ? V.placement : "full";
        if (placement === "full") {
          layout.VHV = 2 * (1920 - 770); /* centre of the view on the field centre, y 770 */
          layout.VY = layout.VHV / 2 - 770;
          layout.FW = 780;
          layout.FH = 1180;
        } else {
          clip.classList.add("gstv-card", "gstv-" + placement);
          layout = { W: 780, H: 760, VHV: 760, VY: 0, FW: 700, FH: 680 };
          var cv = document.getElementById("gst-canvas");
          cv.width = 780;
          cv.height = 760;
        }
        
        var cs = getComputedStyle(root);
        var probe = function (name, d) {
          var p = document.createElement("i");
          p.style.color = cs.getPropertyValue(name).trim() || d;
          root.appendChild(p);
          var c = getComputedStyle(p).color;
          p.remove();
          return c;
        };

        /* ---- Phase windows: cue 1 starts the fly-in, cue 2 the exit ---- */
        var cues = String(V.cues || "")
          .split(",")
          .map(parseFloat);
        var IN_START = isFinite(cues[0]) && cues[0] >= 0 ? cues[0] : 0.12;
        /* Native: the fly-out ends 0.35 s before the 9 s scene end, the hold absorbs the rest. */
        var OUT_START = isFinite(cues[1]) && cues[1] > IN_START ? cues[1] : IN_START + 6.13;
        /* Explicit flight durations; if the fly-in and a minimum hold exceed the time
           before the exit, the fly-in scales down. */
        var MIN_HOLD = 0.5;
        var tIn = Math.min(vars.flyInTime, Math.max(0.2, OUT_START - IN_START - MIN_HOLD));
        var IN_WINDOW = tIn;
        var OUT_WINDOW = vars.flyOutTime;

        /* Scripted state read by renderScene. */
        var st = {
          time: 0,
          tin: 0 /* master fly-in progress 0..1 */,
          tout: 0 /* master fly-out progress 0..1 */,
          thickness: 0.5,
          roughness: 0.07,
          ior: 1.52,
        };

        window.__GST = {
          DUR: DUR,
          st: st,
          vars: vars,
          layout: layout,
          bg: probe("--bg", "#0c1014"),
          fg: probe("--fg", "#f2f2f2"),
          font: (cs.getPropertyValue("--font-display").trim() || '"Bebas Neue"').split(",")[0],
        };

        /* ---- Timeline: paused, registered, hf-seek wired ---- */
        var tl = gsap.timeline({ paused: true });
        tl.eventCallback("onUpdate", function () {
          if (window.__gstRender) window.__gstRender();
        });
        /* Studio's player seeks with GSAP events suppressed and dispatches an
           hf-seek CustomEvent instead — re-sync and repaint so the stage follows. */
        /* Exactly one listener and one live timeline per document. A second
           evaluation of this script would otherwise stack another hf-seek
           listener and leave the previous paused timeline registered, so every
           seek would drive N timelines and repaint N times. Declared as a
           named function (not an arrow) so the reference read back off window
           is identical and removeEventListener actually matches. */
        /* the runtime has already put tl at the block's own time; event.detail.time is the reel's */
        function gstOnSeek() {
          var fn = tl.eventCallback("onUpdate");
          if (fn) fn();
        }
        if (window.__gstSeekHandler) window.removeEventListener("hf-seek", window.__gstSeekHandler);
        if (window.__gstTimeline && window.__gstTimeline !== tl) {
          try {
            window.__gstTimeline.kill();
          } catch (e) {
            /* best effort */
          }
        }
        window.__gstSeekHandler = gstOnSeek;
        window.__gstTimeline = tl;
        window.addEventListener("hf-seek", gstOnSeek);
        /* Release the listener and the timeline with the document. Skipped for
           a bfcache'd page, which is coming back with this stage still live. */
        window.addEventListener("pagehide", function (event) {
          if (event && event.persisted === true) return;
          window.removeEventListener("hf-seek", gstOnSeek);
          window.__gstSeekHandler = null;
          window.__gstTimeline = null;
          try {
            tl.kill();
          } catch (e) {
            /* best effort */
          }
        });

        tl.to(st, { time: DUR, duration: DUR, ease: "none" }, 0);
        tl.to(st, { tin: 1, duration: IN_WINDOW, ease: "none" }, IN_START);
        if (V.exit === "fade") tl.to(root, { opacity: 0, duration: 0.5, ease: "power2.in" }, OUT_START);
        else if (V.exit !== "none") tl.to(st, { tout: 1, duration: OUT_WINDOW, ease: "none" }, OUT_START);

        /* Glass stays clear throughout. The old frosted->clear resolve made
           still-flying shards transmit a BLURRED copy of the already-seated
           text — the ghost headline — so it is gone. */

        window.__timelines["glass-shard-title-vertical"] = tl;
      })();
    </script>

    <script src="assets/glass-main.js"></script>
    <script>
      /* Standalone playback: open this file with ?play (add &loop to repeat).
         Inert without the param — Studio and the renderer never add it, so
         editing and deterministic renders are unaffected. */
      (function () {
        var q = new URLSearchParams(location.search);
        if (!q.has("play")) return;
        var tick = setInterval(function () {
          var map = window.__timelines || {};
          var ids = Object.keys(map);
          if (!ids.length) return;
          clearInterval(tick);
          for (var i = 0; i < ids.length; i++) {
            var tl = map[ids[i]];
            if (q.has("loop")) tl.repeat(-1);
            tl.play(0);
          }
        }, 100);
      })();
    </script>
  </body>
</html>
