<!doctype html>
<html
  lang="ru"
  data-composition-variables='[
    { "id": "placement", "type": "enum", "role": "layout", "label": "Placement", "description": "full: both pages to the frame edge, their text centred on the 780x1180 field. top / bottom: the pages on a card 780x760 at y 180-940 / 600-1360, rest of the frame transparent.", "default": "full", "options": [{ "value": "full", "label": "Full screen" }, { "value": "top", "label": "Top" }, { "value": "bottom", "label": "Bottom" }] },
    { "id": "labelA", "type": "string", "role": "content", "label": "Light page label", "description": "Small label above the headline of the light page the portal tears open.", "maxLength": 20, "default": "Было" },
    { "id": "headA", "type": "string", "role": "content", "label": "Light page headline", "description": "Headline of the light page, Bebas Neue, up to two lines.", "maxLength": 28, "default": "Монтаж руками неделями" },
    { "id": "subA", "type": "string", "role": "content", "label": "Light page text", "description": "Text of the light page, Montserrat, up to two lines.", "maxLength": 60, "default": "Склейка, субтитры и графика – всё по кадру" },
    { "id": "btnA", "type": "string", "role": "content", "label": "Light page button", "description": "Button label of the light page.", "maxLength": 16, "default": "Как обычно" },
    { "id": "labelB", "type": "string", "role": "content", "label": "Dark page label", "description": "Small label above the headline of the brand page behind the portal.", "maxLength": 20, "default": "Стало" },
    { "id": "headB", "type": "string", "role": "content", "label": "Dark page headline", "description": "Headline of the brand page, Bebas Neue, up to two lines.", "maxLength": 28, "default": "Ролик из записи за минуты" },
    { "id": "subB", "type": "string", "role": "content", "label": "Dark page text", "description": "Text of the brand page, Montserrat, up to two lines.", "maxLength": 60, "default": "MatIntellect монтирует сам: субтитры, графика, звук" },
    { "id": "btnB", "type": "string", "role": "content", "label": "Dark page button", "description": "Button label of the brand page.", "maxLength": 16, "default": "Попробовать" },
    { "id": "cues", "type": "string", "role": "timing", "label": "Cues", "description": "Comma-separated seconds from mount start: 1 the energy builds at the centre (ring tears open 1.2 s later and covers the frame about 5.7 s after the cue), 2 the block fades out (only when exit is fade). Empty keeps 0 and 9.5.", "default": "" },
    { "id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "none holds the brand page to the end of the mount; fade fades the block out.", "default": "none", "options": [{ "value": "none", "label": "Hold" }, { "value": "fade", "label": "Fade" }] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        background: transparent;
        overflow: hidden;
      }
      #prtv-root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      #prtv-frame {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: #000000;
      }
      
      #prtv-root.prtv-card #prtv-frame {
        left: 150px;
        top: 180px;
        width: 780px;
        height: 760px;
        border-radius: 32px;
        border: 2px solid var(--border, #2e2e32);
      }
      #prtv-root.prtv-card.prtv-bottom #prtv-frame {
        top: 600px;
      }
      
      #prtv-canvas {
        position: absolute;
        left: 0;
        top: 0;
      }
    </style>
  </head>
  <body>
    <div id="prtv-root" data-composition-id="vfx-portal-vertical" data-width="1080" data-height="1920" data-start="0" data-duration="30">
      <div id="prtv-frame">
        <canvas id="prtv-canvas" aria-hidden="true"></canvas>
      </div>
    </div>
    <script>
      // обе страницы рисуются сами на холстах (у разработчиков – снимки живой разметки, которых у рендера нет: кадр чёрный)
      Promise.all([document.fonts.load('700 120px "Bebas Neue"'), document.fonts.load('400 32px "Montserrat"'), document.fonts.load('600 32px "Montserrat"')]).then(function () {
        var V =
          window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
            ? window.__hyperframes.getVariables()
            : {};
        function txt(v, d) {
          return typeof v === "string" && v.trim() ? v.trim() : d;
        }
        function oneOf(v, list, d) {
          return list.indexOf(v) >= 0 ? v : d;
        }
        var $ = function (id) {
          return document.getElementById("prtv-" + id);
        };
        var root = $("root"),
          frame = $("frame"),
          canvas = $("canvas");
        var css = getComputedStyle(root);
        function tok(n, d) {
          var v = css.getPropertyValue(n).trim();
          return v || d;
        }
        var BG = tok("--bg", "#0c1014"),
          SURF = tok("--surface", "#18181a"),
          FG = tok("--fg", "#f2f2f2"),
          MUTED = tok("--muted", "#8a8a90"),
          ACC = tok("--accent", "#ff0000");

        function rgb(cssColor) {
          var i = document.createElement("i");
          i.style.color = cssColor;
          frame.appendChild(i);
          var m = (getComputedStyle(i).color.match(/[\d.]+/g) || [255, 0, 0]).slice(0, 3).map(function (v) {
            return Number(v) / 255;
          });
          i.remove();
          return m;
        }
        // область текста и размеры шрифтов на каждую раскладку
        var W = 1920,
          H = 1080,
          L = { cx: 960, w: 1300, head: 150, label: 32, sub: 38, btn: 32 };
        
        var placement = oneOf(V.placement, ["full", "top", "bottom"], "full");
        W = 1080;
        H = 1920;
        L = { cx: 540, cy: 770, w: 780, head: 120, label: 32, sub: 34, btn: 32 };
        if (placement !== "full") {
          root.classList.add("prtv-card", "prtv-" + placement);
          W = 780;
          H = 760;
          L = { cx: 390, w: 700, head: 96, label: 30, sub: 30, btn: 30 };
        }
        
        if (L.cy === undefined) L.cy = H / 2;
        canvas.width = W;
        canvas.height = H;
        canvas.style.width = W + "px";
        canvas.style.height = H + "px";

        function page(c) {
          var p = document.createElement("canvas");
          p.width = W;
          p.height = H;
          var g = p.getContext("2d");
          function wrap(text, font, maxW) {
            g.font = font;
            var lines = [],
              cur = "";
            text.split(/\s+/).forEach(function (w) {
              var t = cur ? cur + " " + w : w;
              if (cur && g.measureText(t).width > maxW) {
                lines.push(cur);
                cur = w;
              } else cur = t;
            });
            if (cur) lines.push(cur);
            return lines;
          }
          var LAB = '600 ' + L.label + 'px "Montserrat"',
            HEAD = '700 ' + L.head + 'px "Bebas Neue"',
            SUB = '400 ' + L.sub + 'px "Montserrat"',
            BTN = '600 ' + L.btn + 'px "Montserrat"';
          var hl = wrap(c.head, HEAD, L.w),
            sl = wrap(c.sub, SUB, L.w);
          var HLH = L.head * 0.95,
            SLH = L.sub * 1.4,
            BH = L.btn * 2.4;
          var total = L.label * 1.3 + L.label * 0.8 + hl.length * HLH + L.sub * 0.7 + sl.length * SLH + L.sub * 1.1 + BH;
          var y = L.cy - total / 2;
          g.fillStyle = c.bg;
          g.fillRect(0, 0, W, H);
          // мягкое пятно цвета за текстом, как свечение у разработчиков
          var gr = g.createRadialGradient(L.cx, L.cy, 0, L.cx, L.cy, Math.max(W, H) * 0.6);
          gr.addColorStop(0, c.glow);
          gr.addColorStop(1, "rgba(0,0,0,0)");
          g.fillStyle = gr;
          g.fillRect(0, 0, W, H);
          g.textAlign = "center";
          g.font = LAB;
          g.fillStyle = c.label_c;
          g.fillText(c.label.toUpperCase(), L.cx, y + L.label);
          y += L.label * 1.3 + L.label * 0.8;
          g.font = HEAD;
          g.fillStyle = c.fg;
          hl.forEach(function (l) {
            g.fillText(l, L.cx, y + HLH * 0.86);
            y += HLH;
          });
          y += L.sub * 0.7;
          g.font = SUB;
          g.fillStyle = c.muted;
          sl.forEach(function (l) {
            g.fillText(l, L.cx, y + L.sub * 1.05);
            y += SLH;
          });
          y += L.sub * 1.1;
          g.font = BTN;
          var bw = g.measureText(c.btn).width + L.btn * 2.6,
            bx = L.cx - bw / 2,
            r = 16;
          g.beginPath();
          g.moveTo(bx + r, y);
          g.arcTo(bx + bw, y, bx + bw, y + BH, r);
          g.arcTo(bx + bw, y + BH, bx, y + BH, r);
          g.arcTo(bx, y + BH, bx, y, r);
          g.arcTo(bx, y, bx + bw, y, r);
          g.closePath();
          g.fillStyle = c.btn_bg;
          g.fill();
          g.fillStyle = c.btn_fg;
          g.fillText(c.btn, L.cx, y + BH / 2 + L.btn * 0.36);
          return p;
        }
        // светлая страница – светлый вариант бренда (тёмный текст на светлом), тёмная – бренд как есть
        var light = page({ bg: FG, glow: "rgba(255,255,255,0.5)", fg: BG, muted: "#55555b", label_c: ACC, label: txt(V.labelA, "Было"), head: txt(V.headA, "Монтаж руками неделями"), sub: txt(V.subA, "Склейка, субтитры и графика – всё по кадру"), btn: txt(V.btnA, "Как обычно"), btn_bg: BG, btn_fg: FG });
        var dark = page({ bg: BG, glow: "rgba(" + rgb(ACC).map(function (v) { return Math.round(v * 255); }).join(",") + ",0.14)", fg: FG, muted: MUTED, label_c: ACC, label: txt(V.labelB, "Стало"), head: txt(V.headB, "Ролик из записи за минуты"), sub: txt(V.subB, "MatIntellect монтирует сам: субтитры, графика, звук"), btn: txt(V.btnB, "Попробовать"), btn_bg: ACC, btn_fg: FG });

        var RING1 = rgb(ACC),
          RING2 = rgb(FG);

        // шейдер разработчиков: рваное кольцо с искрами и сдвигом цвета, внутри – страница за порталом (WebGL1, без three.js)
        var gl = canvas.getContext("webgl", { alpha: false, preserveDrawingBuffer: true });
        var A = { portalRadius: 0, energyIntensity: 0, chromaticStrength: 0, distortionStrength: 0, edgeWidth: 0.06, t: 0 };
        var render = function () {};
        if (gl) {
          var VS = "attribute vec2 a_pos;varying vec2 vUv;void main(){vUv=vec2(a_pos.x*0.5+0.5,0.5-a_pos.y*0.5);gl_Position=vec4(a_pos,0.0,1.0);}";
          var FS = [
            "precision highp float;",
            "uniform sampler2D tLight;",
            "uniform sampler2D tDark;",
            "uniform float portalRadius;",
            "uniform vec2 aspectV;",
            "uniform vec2 center;",
            "uniform float edgeWidth;",
            "uniform vec3 glowColor;",
            "uniform vec3 glowColor2;",
            "uniform float chromaticStrength;",
            "uniform float distortionStrength;",
            "uniform float time;",
            "uniform float energyIntensity;",
            "varying vec2 vUv;",
            "float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}",
            "float noise(vec2 p){vec2 i=floor(p);vec2 f=fract(p);f=f*f*(3.0-2.0*f);float a=hash(i);float b=hash(i+vec2(1.0,0.0));float c=hash(i+vec2(0.0,1.0));float d=hash(i+vec2(1.0,1.0));return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);}",
            "void main(){",
            "  vec2 uv=vUv;",
            "  vec2 centered=(uv-center)*aspectV;",
            "  float dist=length(centered);",
            "  float angle=atan(centered.y,centered.x);",
            "  float portalEdge=portalRadius+noise(vec2(angle*3.0,time*2.0))*0.03*energyIntensity;",
            "  float edgeDist=abs(dist-portalEdge);",
            "  float distortMask=smoothstep(edgeWidth*1.5,0.0,edgeDist)*distortionStrength;",
            "  vec2 dir=normalize(centered+0.0001);",
            "  vec2 duv=uv+dir*distortMask*sin(angle*8.0+time*5.0);",
            "  vec2 co=dir*smoothstep(edgeWidth*2.0,0.0,edgeDist)*chromaticStrength;",
            "  vec3 lightColor=vec3(texture2D(tLight,duv+co).r,texture2D(tLight,duv).g,texture2D(tLight,duv-co).b);",
            "  float mask=smoothstep(portalEdge-0.008,portalEdge+0.008,dist);",
            "  float glowInner=smoothstep(edgeWidth,0.0,edgeDist);",
            "  float glowOuter=smoothstep(edgeWidth*2.5,edgeWidth*0.5,edgeDist);",
            "  float glow=glowInner*glowOuter*energyIntensity;",
            "  float colorPhase=fract(angle/6.2832+time*0.4);",
            "  vec3 ringColor=mix(glowColor,glowColor2,sin(colorPhase*6.2832)*0.5+0.5);",
            "  float sparks=pow(noise(vec2(angle*12.0,time*8.0)),4.0)*glowInner*energyIntensity*2.0;",
            "  vec3 front=lightColor*mask+ringColor*glow*2.5+vec3(1.0)*sparks;",
            "  float alpha=clamp(mask+glow*0.5+sparks*0.3,0.0,1.0);",
            "  vec3 back=texture2D(tDark,uv).rgb;",
            "  gl_FragColor=vec4(mix(back,front,alpha),1.0);",
            "}",
          ].join("\n");
          var sh = function (type, src) {
            var s = gl.createShader(type);
            gl.shaderSource(s, src);
            gl.compileShader(s);
            if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
            return s;
          };
          var prog = gl.createProgram();
          gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
          gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
          gl.linkProgram(prog);
          var buf = gl.createBuffer();
          gl.bindBuffer(gl.ARRAY_BUFFER, buf);
          gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
          var tex = function (src) {
            var t = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D, t);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
            return t;
          };
          var tL = tex(light),
            tD = tex(dark);
          var U = {};
          ["tLight", "tDark", "portalRadius", "aspectV", "center", "edgeWidth", "glowColor", "glowColor2", "chromaticStrength", "distortionStrength", "time", "energyIntensity"].forEach(function (n) {
            U[n] = gl.getUniformLocation(prog, n);
          });
          var aPos = gl.getAttribLocation(prog, "a_pos");
          // кольцо открывается из середины текста; радиус – в долях меньшей стороны, рост подогнан так,
          // чтобы родные 1.8 (у разработчиков – из центра 16:9 до угла) закрывали самый дальний угол
          var ar = W >= H ? [W / H, 1] : [1, H / W];
          var ctr = [L.cx / W, L.cy / H];
          var far = Math.max.apply(null, [[0, 0], [1, 0], [0, 1], [1, 1]].map(function (k) {
            return Math.hypot((k[0] - ctr[0]) * ar[0], (k[1] - ctr[1]) * ar[1]);
          }));
          var reach = far / (Math.sqrt((16 / 9) * (16 / 9) + 1) / 2);
          render = function () {
            gl.viewport(0, 0, W, H);
            gl.useProgram(prog);
            gl.bindBuffer(gl.ARRAY_BUFFER, buf);
            gl.enableVertexAttribArray(aPos);
            gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
            gl.activeTexture(gl.TEXTURE0);
            gl.bindTexture(gl.TEXTURE_2D, tL);
            gl.uniform1i(U.tLight, 0);
            gl.activeTexture(gl.TEXTURE1);
            gl.bindTexture(gl.TEXTURE_2D, tD);
            gl.uniform1i(U.tDark, 1);
            gl.uniform1f(U.portalRadius, A.portalRadius * reach);
            gl.uniform2f(U.aspectV, ar[0], ar[1]);
            gl.uniform2f(U.center, ctr[0], ctr[1]);
            gl.uniform1f(U.edgeWidth, A.edgeWidth);
            gl.uniform3f(U.glowColor, RING1[0], RING1[1], RING1[2]);
            gl.uniform3f(U.glowColor2, RING2[0], RING2[1], RING2[2]);
            gl.uniform1f(U.chromaticStrength, A.chromaticStrength);
            gl.uniform1f(U.distortionStrength, A.distortionStrength);
            gl.uniform1f(U.time, A.t);
            gl.uniform1f(U.energyIntensity, A.energyIntensity);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
          };
        }

        var cues = String(V.cues || "")
          .split(",")
          .map(function (v) {
            return parseFloat(v);
          });
        var c0 = isFinite(cues[0]) && cues[0] >= 0 ? cues[0] : 0;
        var exit = oneOf(V.exit, ["none", "fade"], "none");

        // ход разработчиков, отсчёт от начала набора энергии (у них 0.3 с)
        var s = gsap.timeline();
        s.to(A, { t: 9.7, duration: 9.7, ease: "none" }, 0);
        s.to(A, { energyIntensity: 0.3, duration: 1.2, ease: "power2.in" }, 0);
        s.to(A, { portalRadius: 0.85, duration: 3.5, ease: "power2.inOut" }, 1.2);
        s.to(A, { energyIntensity: 1, duration: 0.6, ease: "power3.out" }, 1.2);
        s.to(A, { chromaticStrength: 0.035, duration: 2, ease: "power2.in" }, 1.2);
        s.to(A, { distortionStrength: 0.06, duration: 2.5, ease: "power2.inOut" }, 1.2);
        s.to(A, { edgeWidth: 0.08, duration: 2, ease: "sine.inOut" }, 1.7);
        s.to(A, { portalRadius: 1.8, duration: 2, ease: "power3.in" }, 4.7);
        s.to(A, { energyIntensity: 1.5, duration: 0.8, ease: "power2.in" }, 4.7);
        s.to(A, { energyIntensity: 0, duration: 1.2, ease: "power2.out" }, 5.9);
        s.to(A, { chromaticStrength: 0.06, duration: 1, ease: "power3.in" }, 5.2);
        s.to(A, { chromaticStrength: 0, duration: 1, ease: "power2.out" }, 6.5);
        s.to(A, { distortionStrength: 0, duration: 1, ease: "power2.out" }, 6.2);

        var tl = gsap.timeline({ paused: true, onUpdate: render });
        tl.add(s, c0);
        if (exit === "fade") tl.to(frame, { opacity: 0, duration: 0.5, ease: "power2.in" }, isFinite(cues[1]) && cues[1] > c0 ? cues[1] : c0 + 9.5);
        tl.set({}, {}, 30);
        render();
        window.__timelines = window.__timelines || {};
        window.__timelines["vfx-portal-vertical"] = tl;
      });
    </script>
  </body>
</html>
