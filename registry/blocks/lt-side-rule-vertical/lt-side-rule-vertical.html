<!doctype html>
<html
  lang="ru"
  data-composition-variables='[
    { "id": "placement", "type": "enum", "role": "layout", "label": "Placement", "description": "Overlay over footage, centred on the frame, no ground. bottom: the plate sits on y 1360, just above the caption band. top: the plate hangs from y 180. center: centred on y 770.", "default": "bottom", "options": [{ "value": "bottom", "label": "Bottom" }, { "value": "top", "label": "Top" }, { "value": "center", "label": "Centre" }] },
    { "id": "name", "type": "string", "role": "content", "label": "Name", "description": "Upper-case name beside the red bar, shadowed for footage; wraps to two lines in the vertical version.", "maxLength": 28, "default": "Мат Джестер" },
    { "id": "role", "type": "string", "role": "content", "label": "Role", "description": "Line under the name. Empty hides it.", "maxLength": 40, "default": "Основатель MatIntellect" },
    { "id": "cues", "type": "string", "role": "timing", "label": "Cues", "description": "Comma-separated seconds from mount start: 1 the red bar draws down, name and role slide in, 2 the plate leaves (only when exit is out). Empty keeps 0.1, 4.3.", "default": "" },
    { "id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "none holds the plate to the end of the mount; out plays its own leaving motion at cue 2.", "default": "none", "options": [{ "value": "none", "label": "Hold" }, { "value": "out", "label": "Leave" }] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+20BD, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: transparent;
        overflow: hidden;
      }
      body {
        width: 1080px;
        height: 1920px;
      }
      #lsrv-root {
        font-family: var(--font-body, "Montserrat"), sans-serif;
      }
      #lsrv-lt {
        position: absolute;
      }
      #lsrv-row { display: flex; align-items: stretch; gap: 26px; }
      #lsrv-bar { width: 8px; background: var(--accent, #ff0000); border-radius: 4px; transform-origin: 50% 0%; flex-shrink: 0; }
      #lsrv-text { display: flex; flex-direction: column; justify-content: center; gap: 12px; }
      #lsrv-name { font-weight: 800; color: #ffffff; line-height: 0.98; text-transform: uppercase; text-shadow: 0 2px 22px rgba(0, 0, 0, 0.55); }
      #lsrv-role { color: #f2f2f2; line-height: 1.2; text-shadow: 0 2px 22px rgba(0, 0, 0, 0.55); }
      
      
      #lsrv-lt {
        left: 150px;
        width: 780px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      #lsrv-root.lsrv-bottom #lsrv-lt {
        bottom: 560px;
      }
      #lsrv-root.lsrv-top #lsrv-lt {
        top: 180px;
      }
      #lsrv-root.lsrv-center #lsrv-lt {
        top: 770px;
        transform: translateY(-50%);
      }
      #lsrv-row { max-width: 780px; }
      #lsrv-name { font-size: 80px; }
      #lsrv-role { font-size: 34px; }
      
    </style>
  </head>
  <body>
    <div id="lsrv-root" data-composition-id="lt-side-rule-vertical" data-width="1080" data-height="1920" data-start="0" data-duration="30">
      <div id="lsrv-lt">
        <div id="lsrv-row">
          <div id="lsrv-bar"></div>
          <div id="lsrv-text">
            <div id="lsrv-name"></div>
            <div id="lsrv-role"></div>
          </div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var root = document.getElementById("lsrv-root");
        var V =
          window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
            ? window.__hyperframes.getVariables()
            : {};
        function oneOf(v, list, d) {
          return list.indexOf(v) >= 0 ? v : d;
        }
        
        root.classList.add("lsrv-" + oneOf(V.placement, ["bottom", "top", "center"], "bottom"));
        
        document.getElementById("lsrv-name").textContent = typeof V.name === "string" && V.name.trim() ? V.name : "Мат Джестер";
        var role = typeof V.role === "string" ? V.role : "Основатель MatIntellect";
        var roleEl = document.getElementById("lsrv-role");
        roleEl.textContent = role;
        if (!role) (document.getElementById("lsrv-rolebox") || roleEl).style.display = "none";

        var cues = String(V.cues || "")
          .split(",")
          .map(function (v) {
            return parseFloat(v);
          });
        var c0 = isFinite(cues[0]) && cues[0] >= 0 ? cues[0] : 0.1;
        var exit = oneOf(V.exit, ["none", "out"], "none");

        var tl = gsap.timeline({ paused: true });
        tl.fromTo("#lsrv-bar", { scaleY: 0 }, { scaleY: 1, duration: 0.5, ease: "power3.out" }, c0);
        tl.fromTo("#lsrv-name", { x: -24, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, c0 + 0.16);
        tl.fromTo("#lsrv-role", { x: -24, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, c0 + 0.28);
        if (exit === "out") {
          var out = isFinite(cues[1]) ? cues[1] : c0 + 4.2;
          tl.to("#lsrv-role", { opacity: 0, duration: 0.3, ease: "power2.in" }, out);
          tl.to("#lsrv-name", { y: -14, opacity: 0, duration: 0.32, ease: "power2.in" }, out + 0.05);
          tl.to("#lsrv-bar", { scaleY: 0, duration: 0.32, ease: "power2.in" }, out + 0.07);
        }
        tl.set({}, {}, 30);
        window.__timelines = window.__timelines || {};
        window.__timelines["lt-side-rule-vertical"] = tl;
      })();
    </script>
  </body>
</html>
