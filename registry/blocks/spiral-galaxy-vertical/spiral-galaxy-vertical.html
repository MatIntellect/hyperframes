<!doctype html>
<html
  lang="ru"
  data-composition-variables='[
    { "id": "placement", "type": "enum", "role": "layout", "label": "Placement", "description": "full: own ground to the frame edge, the whole disc across the frame centred on the field (y 770). top / bottom: the galaxy on a 780x760 card at y 180-940 / 600-1360, rest of the frame transparent.", "default": "full", "options": [{ "value": "full", "label": "Full screen" }, { "value": "top", "label": "Top" }, { "value": "bottom", "label": "Bottom" }] },
    { "id": "stars", "type": "number", "role": "style", "label": "Star count", "default": 20000, "min": 2000, "max": 40000, "step": 1000 },
    { "id": "arms", "type": "number", "role": "style", "label": "Arm count", "default": 3, "min": 2, "max": 8, "step": 1 },
    { "id": "rate", "type": "number", "role": "motion", "label": "Rotation rate", "description": "Core turn over the native 10 s shot; the rim stands still, so the arms wind. The shot is laid over cue 1 .. cue 2, or to the mount end.", "default": 0.25, "min": 0, "max": 1.5, "step": 0.05, "unit": "rad/s" },
    { "id": "glow", "type": "number", "role": "style", "label": "Core brightness", "default": 1.9, "min": 0.2, "max": 4, "step": 0.1 },
    { "id": "size", "type": "number", "role": "style", "label": "Star size", "default": 10, "min": 2, "max": 40, "step": 1, "unit": "px" },
    { "id": "core", "type": "color", "role": "style", "label": "Core colour", "default": "#f2f2f2" },
    { "id": "rim", "type": "color", "role": "style", "label": "Rim colour", "default": "#ff0000" },
    { "id": "cues", "type": "string", "role": "timing", "label": "Cues", "description": "Comma-separated seconds from mount start: 1 the galaxy fades in over 0.6 s and starts winding (0 = already shining on the first frame), 2 the winding ends, and the galaxy fades out from 0.5 s before it when exit is fade. Without cue 2 the winding spans to the mount end. Empty keeps 0.", "default": "" },
    { "id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "none keeps the galaxy turning to the end of the mount.", "default": "none", "options": [{ "value": "none", "label": "Hold" }, { "value": "fade", "label": "Fade" }] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;
      }
      #sgxv-root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      /* Full-bleed child carries the scene fill; never the composition root. */
      #sgxv-stage {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: var(--bg, #0c1014);
      }
      #sgxv-gl {
        position: absolute;
        left: 0;
        display: block;
      }
      /* Ambient halo in the rim colour, screen-blended over the point cloud.
         Reads the declared `rim` variable. Variable ids are single lowercase
         words on purpose: the runtime injects `--<id>` while the compiler
         injects `--<slugify(id)>`, and those two only agree when the id has
         no capitals or separators. */
      #sgxv-halo {
        position: absolute;
        inset: 0;
        mix-blend-mode: screen;
        opacity: 0.12;
        background: radial-gradient(72% 46% at 50% 50%, var(--rim, #ff0000) 0%, #000000 70%);
      }
      
      #sgxv-halo {
        background: radial-gradient(72% 26% at 50% 40%, var(--rim, #ff0000) 0%, #000000 70%);
      }
      #sgxv-stage.sgxv-card {
        left: 150px;
        width: 780px;
        height: 760px;
        top: 180px;
        border-radius: 32px;
        border: 2px solid var(--border, #2e2e32);
      }
      #sgxv-stage.sgxv-bottom {
        top: 600px;
      }
      #sgxv-stage.sgxv-card #sgxv-halo {
        background: radial-gradient(72% 46% at 50% 50%, var(--rim, #ff0000) 0%, #000000 70%);
      }
      
    </style>
  </head>
  <body>
    <div id="sgxv-root" data-composition-id="spiral-galaxy-vertical" data-start="0" data-duration="30" data-width="1080" data-height="1920">
      <div id="sgxv-stage">
        <canvas id="sgxv-gl"></canvas>
        <div id="sgxv-halo"></div>
      </div>

      <!-- Driver clip: gives the block a timed element for the host timeline. -->
      <div
        id="sgxv-drv"
        class="clip"
        data-start="0"
        data-duration="30"
        data-track-index="0"
        style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none"
      ></div>
    </div>

    <script>
      (function () {
        var COMP_ID = "spiral-galaxy-vertical";
        var DURATION = 30;
        var root = document.getElementById("sgxv-root");
        var stage = document.getElementById("sgxv-stage");

        // ── Measured constants ────────────────────────────────────────────
        // Read from the three.js galaxy examples (MIT) during reference
        // research; reimplemented here, nothing copied.
        //   count 20000 · branches 3 · radius = ratio^1.5 * 5 · spin 1
        //   angle = branchAngle + spin * radius + t * (1 - radiusRatio)
        //   randomnessPower 3 · inside #f2f2f2 · outside #ff0000
        var DISC_RADIUS = 5.0; // world units, from `radius = ratio^1.5 * 5`
        var RADIUS_POWER = 1.5; // ratio -> radius exponent
        // Static Archimedean twist, radians per world unit. This is what draws
        // the arm across the WHOLE disc; the time term below then winds it.
        // Slightly under the example's 1.0 so the outer arms stay open.
        var SPIN = 0.78;
        var RANDOMNESS = 0.2; // arm thickness, as a fraction of DISC_RADIUS
        var RANDOM_POWER = 3.0; // pow(u, 3): most stars hug the arm, a few stray
        var TANGENT_SQUEEZE = 0.62; // arms are thin across, long along
        var DISC_FLATNESS = 0.3; // vertical jitter relative to in-plane jitter
        var SEED = 20240817; // fixes every per-star attribute

        // ── Variables ─────────────────────────────────────────────────────
        // Read ONCE at init. Variables never change mid-render.
        var vars =
          window.__hyperframes && window.__hyperframes.getVariables
            ? window.__hyperframes.getVariables()
            : {};
        function clampNum(value, lo, hi, fallback) {
          var n = Number(value);
          if (!isFinite(n)) n = fallback;
          return Math.min(hi, Math.max(lo, n));
        }
        var STARS = Math.round(clampNum(vars.stars, 2000, 40000, 20000));
        var ARMS = Math.round(clampNum(vars.arms, 2, 8, 3));
        var RATE = clampNum(vars.rate, 0, 1.5, 0.25);
        var GLOW = clampNum(vars.glow, 0.2, 4, 1.9);
        var SIZE = clampNum(vars.size, 2, 40, 10);
        var CORE_COLOR = typeof vars.core === "string" ? vars.core : "#f2f2f2";
        var RIM_COLOR = typeof vars.rim === "string" ? vars.rim : "#ff0000";

        // layout: canvas size and offset; fit scales the native 1920x1080 view
        // (disc about 1610 px wide) so the whole spiral stays in the frame
        var W = 1080,
          H = 1920,
          top0 = 0,
          fit = 1;
        
        var placement = ["full", "top", "bottom"].indexOf(vars.placement) >= 0 ? vars.placement : "full";
        top0 = 770 - H / 2;
        fit = 0.62; // disc about 1000 px across the 1080 frame
        if (placement !== "full") {
          stage.classList.add("sgxv-card", "sgxv-" + placement);
          W = 780;
          H = 760;
          top0 = 0;
          fit = 0.46; // disc about 740 px inside the card
        }
        
        var cv = document.getElementById("sgxv-gl");
        cv.width = W;
        cv.height = H;
        cv.style.cssText = "top:" + top0 + "px;width:" + W + "px;height:" + H + "px";

        // ── Seeded PRNG (mulberry32) ──────────────────────────────────────
        function mulberry32(seed) {
          return function () {
            seed |= 0;
            seed = (seed + 0x6d2b79f5) | 0;
            var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }

        // ── Per-star attributes, seeded once ──────────────────────────────
        // Nothing here depends on time. Every frame is computed from these
        // plus `uTime` alone, so frame N never reads frame N-1.
        var rng = mulberry32(SEED);
        var aRatio = new Float32Array(STARS); // 0 = core, 1 = rim
        var aBranch = new Float32Array(STARS); // base arm angle
        var aJitterR = new Float32Array(STARS); // offset along the arm's radial axis
        var aJitterT = new Float32Array(STARS); // offset along the arm's tangent
        var aJitterY = new Float32Array(STARS); // disc thickness
        var aSpark = new Float32Array(STARS); // per-star size variation

        function jitter() {
          var magnitude = Math.pow(rng(), RANDOM_POWER) * RANDOMNESS * DISC_RADIUS;
          return rng() < 0.5 ? -magnitude : magnitude;
        }
        for (var i = 0; i < STARS; i++) {
          aRatio[i] = rng();
          aBranch[i] = ((i % ARMS) / ARMS) * Math.PI * 2;
          aJitterR[i] = jitter();
          aJitterT[i] = jitter() * TANGENT_SQUEEZE;
          aJitterY[i] = jitter() * DISC_FLATNESS;
          aSpark[i] = rng();
        }

        // ── Scene ─────────────────────────────────────────────────────────
        var renderer = new THREE.WebGLRenderer({
          canvas: cv,
          antialias: false,
          alpha: false,
          preserveDrawingBuffer: true, // survives seek-capture screenshots
        });
        renderer.setPixelRatio(1);
        renderer.setSize(W, H, false);
        renderer.setClearColor(new THREE.Color(getComputedStyle(stage).backgroundColor), 1); // the theme ground

        var scene = new THREE.Scene();
        var vfov = (2 * Math.atan((Math.tan((22.5 * Math.PI) / 180) * (H / 1080)) / fit) * 180) / Math.PI;
        var camera = new THREE.PerspectiveCamera(vfov, W / H, 0.1, 200);
        camera.position.set(0, 2.9, 7.6);
        camera.lookAt(0, 0, 0);

        var uniforms = {
          uTime: { value: 0 },
          uRate: { value: RATE },
          uSpin: { value: SPIN },
          uRadius: { value: DISC_RADIUS },
          uPower: { value: RADIUS_POWER },
          uSize: { value: SIZE * fit },
          uRefDist: { value: camera.position.length() },
          uGlow: { value: GLOW },
          uCore: { value: new THREE.Color(CORE_COLOR) },
          uRim: { value: new THREE.Color(RIM_COLOR) },
        };

        var VERT = [
          "attribute float aRatio;",
          "attribute float aBranch;",
          "attribute float aJitterR;",
          "attribute float aJitterT;",
          "attribute float aJitterY;",
          "attribute float aSpark;",
          "uniform float uTime;",
          "uniform float uRate;",
          "uniform float uSpin;",
          "uniform float uRadius;",
          "uniform float uPower;",
          "uniform float uSize;",
          "uniform float uRefDist;",
          "uniform float uGlow;",
          "uniform vec3 uCore;",
          "uniform vec3 uRim;",
          "varying vec3 vColor;",
          "varying float vBright;",
          "void main() {",
          "  float ratio = clamp(aRatio, 0.0, 1.0);",
          // Differential rotation. omega falls to zero at the rim, so the
          // core laps the outer disc and the arms wind up over time.
          // Solved directly from uTime — never integrated frame to frame.
          "  float omega = 1.0 - ratio;",
          "  float r = pow(ratio, uPower) * uRadius;",
          // uSpin * r is the static arm shape (time-independent, so it drops
          // out of any inner-vs-outer rotation measurement); uRate * uTime *
          // omega is the winding.
          "  float theta = aBranch + uSpin * r + uRate * uTime * omega;",
          "  vec2 radial = vec2(cos(theta), sin(theta));",
          "  vec2 tangent = vec2(-radial.y, radial.x);",
          // Jitter rides in the star's own rotating frame, so arm thickness
          // holds its shape instead of smearing as the disc turns.
          "  vec2 xz = radial * (r + aJitterR) + tangent * aJitterT;",
          "  vec4 mv = modelViewMatrix * vec4(xz.x, aJitterY, xz.y, 1.0);",
          "  gl_Position = projectionMatrix * mv;",
          "  gl_PointSize = uSize * (uRefDist / max(-mv.z, 0.001)) * (0.55 + 0.75 * aSpark);",
          // Lerp by r/R (i.e. ratio^1.5), matching the example's colour ramp:
          // the disc stays warm well past mid-radius and only the rim goes cold.
          "  vColor = mix(uCore, uRim, pow(ratio, uPower));",
          "  vBright = uGlow * (0.22 + 0.78 * exp(-ratio * 3.0));",
          "}",
        ].join("\n");

        var FRAG = [
          "varying vec3 vColor;",
          "varying float vBright;",
          "void main() {",
          "  float d = length(gl_PointCoord - vec2(0.5));",
          "  float a = smoothstep(0.5, 0.0, d);",
          "  a = a * a;",
          "  gl_FragColor = vec4(vColor * vBright, a);",
          "}",
        ].join("\n");

        var geometry = new THREE.BufferGeometry();
        // The vertex shader builds every position from the attributes below;
        // `position` exists only because three.js counts vertices from it.
        geometry.setAttribute(
          "position",
          new THREE.BufferAttribute(new Float32Array(STARS * 3), 3),
        );
        geometry.setAttribute("aRatio", new THREE.BufferAttribute(aRatio, 1));
        geometry.setAttribute("aBranch", new THREE.BufferAttribute(aBranch, 1));
        geometry.setAttribute("aJitterR", new THREE.BufferAttribute(aJitterR, 1));
        geometry.setAttribute("aJitterT", new THREE.BufferAttribute(aJitterT, 1));
        geometry.setAttribute("aJitterY", new THREE.BufferAttribute(aJitterY, 1));
        geometry.setAttribute("aSpark", new THREE.BufferAttribute(aSpark, 1));

        var material = new THREE.ShaderMaterial({
          uniforms: uniforms,
          vertexShader: VERT,
          fragmentShader: FRAG,
          blending: THREE.AdditiveBlending,
          transparent: true,
          depthTest: false,
          depthWrite: false,
        });

        var points = new THREE.Points(geometry, material);
        points.frustumCulled = false; // positions live in the shader, not in `position`
        scene.add(points);


        // ── Timeline ──────────────────────────────────────────────────────
        // `tl.eventCallback("onUpdate", ...)` does NOT fire on tl.seek(), so
        // the repaint hangs off a property setter on the tweened driver —
        // that setter runs on every render, seek included.
        var driver = { _t: 0 };
        Object.defineProperty(driver, "t", {
          get: function () {
            return this._t;
          },
          set: function (value) {
            this._t = value;
            draw(value);
          },
        });

        var cues = String(vars.cues || "")
          .split(",")
          .map(parseFloat);
        var c0 = isFinite(cues[0]) && cues[0] >= 0 ? cues[0] : 0;
        var end = isFinite(cues[1]) && cues[1] > c0 ? cues[1] : DURATION;

        // The native 10 s shot of winding, laid over cue 1 .. cue 2 (or the mount end):
        // past it the arms would keep unwinding into a bar.
        var SHOT = 10;
        function draw(t) {
          uniforms.uTime.value = SHOT * Math.min(1, Math.max(0, (t - c0) / (end - c0)));
          renderer.render(scene, camera);
        }

        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });
        // ease "none" over the full duration makes driver.t === tl.time().
        tl.to(driver, { t: DURATION, duration: DURATION, ease: "none", lazy: false }, 0);
        if (c0 > 0) tl.fromTo(root, { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, c0);
        if (vars.exit === "fade")
          tl.to(root, { opacity: 0, duration: 0.5, ease: "power2.in" }, end - 0.5);
        window.__timelines[COMP_ID] = tl;

        draw(0); // paint frame 0; GSAP skips the setter when the value is unchanged
      })();
    </script>
  </body>
</html>
