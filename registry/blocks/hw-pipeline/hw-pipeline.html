<!doctype html>
<html
  lang="ru"
  data-composition-variables='[
    { "id": "n1", "type": "string", "role": "content", "label": "Step 1", "description": "First box label, Montserrat 46 px, wraps between words only; boxes widen to the longest word.", "maxLength": 10, "default": "Идея" },
    { "id": "n2", "type": "string", "role": "content", "label": "Step 2", "description": "Second box label. Empty drops the box.", "maxLength": 10, "default": "Съёмка" },
    { "id": "n3", "type": "string", "role": "content", "label": "Step 3", "description": "Third box label. Empty drops the box.", "maxLength": 10, "default": "Монтаж" },
    { "id": "n4", "type": "string", "role": "content", "label": "Step 4", "description": "Fourth box label. Empty (default) drops the box.", "maxLength": 10, "default": "" },
    { "id": "cues", "type": "string", "role": "timing", "label": "Cues", "description": "Comma-separated seconds from mount start: 1 the first box starts to draw (each box 0.7 s with its label, each arrow 0.5 s), 2 the scheme fades out (only when exit is fade; empty – 2 s after the last label lands). Empty keeps 0.3.", "default": "" },
    { "id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "none holds the scheme to the end of the mount; fade fades it out.", "default": "none", "options": [{ "value": "none", "label": "Hold" }, { "value": "fade", "label": "Fade" }] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: transparent;
        overflow: hidden;
      }
      body {
        width: 1920px;
        height: 1080px;
      }
      #hwp-root {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: transparent; /* накладка поверх видео или доски */
        font-family: var(--font-body, "Montserrat"), sans-serif;
      }
      #hwp-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      #hwp-svg path {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .hwp-box {
        stroke: var(--fg, #f2f2f2);
        stroke-width: 6;
      }
      .hwp-conn path {
        stroke: var(--accent, #ff0000);
        stroke-width: 5;
      }
      .hwp-label {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 24px;
        text-align: center;
        font-weight: 700;
        font-size: 46px;
        line-height: 1.1;
        overflow-wrap: normal; /* перенос только между словами: коробка шире самого длинного слова */
        color: var(--fg, #f2f2f2);
        opacity: 0;
        text-shadow: 0 2px 14px rgb(0 0 0 / 40%);
      }
    </style>
  </head>
  <body>
    <div id="hwp-root" data-composition-id="hw-pipeline" data-width="1920" data-height="1080" data-start="0" data-duration="30">
      <svg id="hwp-svg" viewBox="0 0 1920 1080" data-layout-ignore></svg>
      <div id="hwp-labels"></div>
    </div>
    <script>
      // ширина коробки – от самого длинного слова, поэтому строим после загрузки шрифта подписей (runtimes.md)
      document.fonts.load('700 46px "Montserrat"').then(function () {
        var V =
          window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
            ? window.__hyperframes.getVariables()
            : {};
        function oneOf(v, list, d) {
          return list.indexOf(v) >= 0 ? v : d;
        }
        var D = { n1: "Идея", n2: "Съёмка", n3: "Монтаж", n4: "" };
        var nodes = ["n1", "n2", "n3", "n4"]
          .map(function (k) {
            return typeof V[k] === "string" ? V[k].trim() : D[k];
          })
          .filter(function (s) {
            return s;
          });
        if (!nodes.length) nodes = [D.n1];
        var n = nodes.length;
        var SEED = 11,
          BOIL = { amp: 1.6, rot: 0.4, frameDrop: 3 },
          OUT = 0.42;

        // самое длинное слово подписей – шире него коробка не бывает (поля по 10 знаков: 4 коробки с самым длинным словом и стрелками встают в ряд 1760, шрифт не ужимается)
        var ctx = document.createElement("canvas").getContext("2d");
        ctx.font = '700 46px "Montserrat"';
        var need = 0;
        nodes.join(" ").split(/\s+/).forEach(function (w) {
          need = Math.max(need, Math.ceil(ctx.measureText(w).width) + 48); // поля по 24 – слово не липнет к дрожащей рамке
        });

        // раскладка: ряд по горизонтали (родной: блок 320x170, промежуток 190, ряд с y 455, по центру кадра)
        var B = [];
        
        var bw = Math.max(need, Math.min(320, 1760 / (n + 0.59 * (n - 1)))),
          bh = 170,
          gap = n > 1 ? Math.min(bw * 0.59, (1760 - n * bw) / (n - 1)) : 0;
        var x0 = (1920 - (n * bw + (n - 1) * gap)) / 2;
        for (var i = 0; i < n; i++) B.push({ x: x0 + i * (bw + gap), y: 455, w: bw, h: bh });
        
        

        /* hw family runtime (родной) */
        function hash(k, seed) {
          var x = Math.sin(k * 127.1 + (seed || 1) * 311.7) * 43758.5453;
          return (x - Math.floor(x)) * 2 - 1;
        }
        function wobbleRect(w, h, r, seed, amp) {
          amp = amp === undefined ? 3.5 : amp;
          function wob(k) {
            return hash(k, seed) * amp;
          }
          var d = "M " + (r + wob(1)) + " " + wob(2);
          d += " L " + (w / 2 + wob(3)) + " " + wob(4);
          d += " L " + (w - r + wob(5)) + " " + wob(6);
          d += " Q " + (w + wob(7)) + " " + wob(8) + " " + (w + wob(9)) + " " + (r + wob(10));
          d += " L " + (w + wob(11)) + " " + (h / 2 + wob(12));
          d += " L " + (w + wob(13)) + " " + (h - r + wob(14));
          d += " Q " + (w + wob(15)) + " " + (h + wob(16)) + " " + (w - r + wob(17)) + " " + (h + wob(18));
          d += " L " + (w / 2 + wob(19)) + " " + (h + wob(20));
          d += " L " + (r + wob(21)) + " " + (h + wob(22));
          d += " Q " + wob(23) + " " + (h + wob(24)) + " " + wob(25) + " " + (h - r + wob(26));
          d += " L " + wob(27) + " " + (h / 2 + wob(28));
          d += " L " + wob(29) + " " + (r + wob(30));
          d += " Q " + wob(31) + " " + wob(32) + " " + (r + wob(33)) + " " + wob(34);
          return d;
        }

        var NS = "http://www.w3.org/2000/svg";
        var svg = document.getElementById("hwp-svg");
        var labels = document.getElementById("hwp-labels");
        var boxes = [],
          boxGs = [],
          conns = [],
          labelEls = [];
        B.forEach(function (b, i) {
          /* внешний g держит сдвиг, внутренний дрожит (как у разработчиков) */
          var gOuter = document.createElementNS(NS, "g");
          gOuter.setAttribute("transform", "translate(" + b.x + " " + b.y + ")");
          var g = document.createElementNS(NS, "g");
          gOuter.appendChild(g);
          var p = document.createElementNS(NS, "path");
          p.setAttribute("class", "hwp-box");
          p.setAttribute("d", wobbleRect(b.w, b.h, 24, SEED + i));
          g.appendChild(p);
          svg.appendChild(gOuter);
          boxes.push(p);
          boxGs.push(g);

          var label = document.createElement("div");
          label.className = "hwp-label";
          label.textContent = nodes[i];
          label.style.left = b.x + "px";
          label.style.top = b.y + "px";
          label.style.width = b.w + "px";
          label.style.height = b.h + "px";
          labels.appendChild(label);
          labelEls.push(label);

          if (i < n - 1) {
            var nb = B[i + 1];
            // от середины стороны к середине стороны следующего, изгиб вбок от направления
            // (у разработчиков для ряда – вверх; та же доля для любого направления и длины)
            
            var sx = b.x + b.w + 10,
              sy = b.y + b.h / 2,
              tx = nb.x - 10,
              ty = nb.y + nb.h / 2;
            
            
            var L = Math.hypot(tx - sx, ty - sy),
              ux = (tx - sx) / L,
              uy = (ty - sy) / L;
            var bend = (L * 46) / 170 + hash(i * 9 + 3, SEED) * 12, // у разработчиков 46 px на стрелку 170 px
              slide = hash(i * 9 + 2, SEED) * 16;
            var qx = (sx + tx) / 2 + ux * slide + uy * bend,
              qy = (sy + ty) / 2 + uy * slide - ux * bend;
            var ang = Math.atan2(ty - qy, tx - qx) + Math.PI;
            var BARB = 26,
              SPREAD = 0.42;
            /* линия и наконечник – два пути в одной группе: дрожат вместе, наконечник
               дорисовывается, когда линия дошла (в одном пути браузер рисует его сразу) */
            var c = document.createElementNS(NS, "g");
            c.setAttribute("class", "hwp-conn");
            var line = document.createElementNS(NS, "path");
            line.setAttribute("d", "M " + sx + " " + sy + " Q " + qx + " " + qy + " " + tx + " " + ty);
            var head = document.createElementNS(NS, "path");
            head.setAttribute(
              "d",
              "M " + (tx + BARB * Math.cos(ang - SPREAD)) + " " + (ty + BARB * Math.sin(ang - SPREAD)) +
                " L " + tx + " " + ty +
                " L " + (tx + BARB * Math.cos(ang + SPREAD)) + " " + (ty + BARB * Math.sin(ang + SPREAD)),
            );
            c.appendChild(line);
            c.appendChild(head);
            svg.appendChild(c);
            conns.push(c);
          }
        });

        var cues = String(V.cues || "")
          .split(",")
          .map(function (v) {
            return parseFloat(v);
          });
        var c0 = isFinite(cues[0]) && cues[0] >= 0 ? cues[0] : 0.3;
        var exit = oneOf(V.exit, ["none", "fade"], "none");

        var tl = gsap.timeline({ paused: true });
        /* родной ход: блок рисуется – подпись – стрелка – следующий блок */
        var t = c0,
          lastLabel = c0;
        boxes.forEach(function (p, i) {
          var len = p.getTotalLength();
          gsap.set(p, { strokeDasharray: len + " " + (len + 2), strokeDashoffset: len + 1 }); // без точки круглого кончика до начала
          tl.to(p, { strokeDashoffset: 0, duration: 0.65, ease: "power2.inOut" }, t);
          tl.to(labelEls[i], { opacity: 1, duration: 0.35, ease: "power2.out" }, t + 0.45);
          lastLabel = t + 0.8;
          t += 0.7;
          if (i < conns.length) {
            var parts = conns[i].querySelectorAll("path");
            var cl = parts[0].getTotalLength(),
              hl = parts[1].getTotalLength();
            gsap.set(parts[0], { strokeDasharray: cl + " " + (cl + 2), strokeDashoffset: cl + 1 });
            gsap.set(parts[1], { strokeDasharray: hl + " " + (hl + 2), strokeDashoffset: hl + 1 });
            tl.to(parts[0], { strokeDashoffset: 0, duration: 0.37, ease: "power2.in" }, t);
            tl.to(parts[1], { strokeDashoffset: 0, duration: 0.08, ease: "none" }, t + 0.37);
            t += 0.5;
          }
        });

        /* дрожь – родная: группы блоков, стрелки, подписи */
        var shake = boxGs.concat(conns, labelEls);
        function boil() {
          var step = Math.floor((tl.time() * 30) / BOIL.frameDrop);
          for (var k = 0; k < shake.length; k++) {
            gsap.set(shake[k], {
              x: hash(step * 3 + k * 97, SEED) * BOIL.amp,
              y: hash(step * 3 + 1 + k * 97, SEED) * BOIL.amp,
              rotation: hash(step * 3 + 2 + k * 97, SEED) * BOIL.rot,
            });
          }
        }
        tl.eventCallback("onUpdate", boil);
        boil();

        if (exit === "fade") tl.to([svg, labels], { opacity: 0, duration: OUT, ease: "power2.in" }, isFinite(cues[1]) && cues[1] > c0 ? cues[1] : lastLabel + 2);
        tl.set({}, {}, 30);
        window.__timelines = window.__timelines || {};
        window.__timelines["hw-pipeline"] = tl;
      });
    </script>
  </body>
</html>
