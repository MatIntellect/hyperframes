<!doctype html>
<html
  lang="ru"
  data-composition-variables='[
    { "id": "x", "type": "number", "role": "layout", "label": "Bubble left", "description": "Left edge of the 640x340 bubble, px.", "default": 620, "min": 40, "max": 1240, "step": 10 },
    { "id": "y", "type": "number", "role": "layout", "label": "Bubble top", "description": "Top edge of the bubble, px (the tail reaches about 120 px below it).", "default": 160, "min": 40, "max": 600, "step": 10 },
    { "id": "text", "type": "string", "role": "content", "label": "Text", "description": "What the bubble says, typed letter by letter in Montserrat.", "maxLength": 32, "default": "На что ты смотришь?" },
    { "id": "tip", "type": "enum", "role": "layout", "label": "Tail", "description": "Which lower corner the tail points from.", "default": "bottom-left", "options": [{ "value": "bottom-left", "label": "Bottom left" }, { "value": "bottom-right", "label": "Bottom right" }] },
    { "id": "cues", "type": "string", "role": "timing", "label": "Cues", "description": "Comma-separated seconds from mount start: 1 the outline starts to draw (the paper fills at +0.55 s, the text types from +0.6 s in up to 1.8 s), 2 the bubble fades out (only when exit is fade; empty – once the text has been read: 0.5 s + 0.3 s a word, at least 2 s after typing ends). Empty keeps 0.3.", "default": "" },
    { "id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "none holds the bubble to the end of the mount; fade fades it out.", "default": "none", "options": [{ "value": "none", "label": "Hold" }, { "value": "fade", "label": "Fade" }] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: transparent;
        overflow: hidden;
      }
      body {
        width: 1920px;
        height: 1080px;
      }
      #hwc-root {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: transparent; /* накладка поверх видео */
        font-family: var(--font-body, "Montserrat"), sans-serif;
      }
      #hwc-wrap {
        position: absolute;
        pointer-events: none;
      }
      #hwc-wrap svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      #hwc-fill {
        fill: var(--fg, #f2f2f2);
        opacity: 0;
      }
      #hwc-stroke {
        fill: none;
        stroke: var(--bg, #0c1014);
        stroke-width: 4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #hwc-text {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-weight: 700;
        font-size: 58px;
        color: var(--bg, #0c1014);
        line-height: 1.05;
        overflow-wrap: break-word;
      }
      #hwc-text .hwc-ch {
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="hwc-root" data-composition-id="hw-text-cloud" data-width="1920" data-height="1080" data-start="0" data-duration="30">
      <div id="hwc-wrap" data-layout-allow-overflow>
        <svg id="hwc-svg" data-layout-ignore>
          <path id="hwc-fill"></path>
          <path id="hwc-stroke"></path>
        </svg>
        <div id="hwc-text"></div>
      </div>
    </div>
    <script>
      (function () {
        var V =
          window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
            ? window.__hyperframes.getVariables()
            : {};
        function oneOf(v, list, d) {
          return list.indexOf(v) >= 0 ? v : d;
        }
        function num(v, d, lo, hi) {
          var n = Number(v);
          return isFinite(n) && v !== "" && v !== null ? Math.max(lo, Math.min(hi, n)) : d;
        }
        var root = document.getElementById("hwc-root");

        // облачко 640x340 (родное 560x300 под Caveat; Montserrat шире – облачко больше, шрифт родной 58)
        var C = { x: 620, y: 160, w: 640, h: 340, len: 90 };
        
        C.x = num(V.x, 620, 40, 1240);
        C.y = num(V.y, 160, 40, 600);
        
        
        var tipSide = oneOf(V.tip, ["bottom-left", "bottom-right"], "bottom-left");
        var SEED = 6,
          BOIL = { amp: 1.6, rot: 0.4, frameDrop: 3 },
          CHAR_DELAY = 0.03,
          OUT = 0.36;

        /* hw family runtime (родной) */
        function hash(n, seed) {
          var x = Math.sin(n * 127.1 + (seed || 1) * 311.7) * 43758.5453;
          return (x - Math.floor(x)) * 2 - 1;
        }
        /* облачко с хвостом – родная форма */
        function cloudPath(W, H, len, side, seed) {
          var cx = W / 2,
            cy = H / 2 - 14,
            rx = W / 2 - 12,
            ry = H / 2 - 34;
          var N = 16,
            pts = [];
          for (var i = 0; i < N; i++) {
            var a = (i / N) * Math.PI * 2;
            var wr = 1 + hash(i * 11 + 3, seed) * 0.06;
            pts.push([cx + Math.cos(a) * rx * wr, cy + Math.sin(a) * ry * wr]);
          }
          var mx = (pts[0][0] + pts[N - 1][0]) / 2,
            my = (pts[0][1] + pts[N - 1][1]) / 2;
          var d = "M" + mx.toFixed(1) + " " + my.toFixed(1);
          for (var j = 0; j < N; j++) {
            var p = pts[j],
              q = pts[(j + 1) % N];
            d += " Q" + p[0].toFixed(1) + " " + p[1].toFixed(1) + " " + ((p[0] + q[0]) / 2).toFixed(1) + " " + ((p[1] + q[1]) / 2).toFixed(1);
          }
          d += "Z";
          var left = side !== "bottom-right";
          var bx = cx + (left ? -rx * 0.45 : rx * 0.45),
            by = cy + ry * 0.92;
          var tx = bx + (left ? -len * 0.5 : len * 0.5),
            ty = by + len;
          d += " M " + (bx - 26).toFixed(1) + " " + (by - 6).toFixed(1);
          d += " Q " + (bx - 8 + hash(31, seed) * 6).toFixed(1) + " " + ((by + ty) / 2).toFixed(1) + " " + tx.toFixed(1) + " " + ty.toFixed(1);
          d += " Q " + (bx + 18).toFixed(1) + " " + ((by + ty) / 2).toFixed(1) + " " + (bx + 30).toFixed(1) + " " + (by - 2).toFixed(1);
          return d;
        }

        var wrap = document.getElementById("hwc-wrap");
        wrap.style.left = C.x + "px";
        wrap.style.top = C.y + "px";
        wrap.style.width = C.w + "px";
        wrap.style.height = C.h + "px";
        document.getElementById("hwc-svg").setAttribute("viewBox", "0 0 " + C.w + " " + C.h);
        var d = cloudPath(C.w, C.h, C.len, tipSide, SEED);
        var stroke = document.getElementById("hwc-stroke");
        document.getElementById("hwc-fill").setAttribute("d", d);
        stroke.setAttribute("d", d);

        var textEl = document.getElementById("hwc-text");
        textEl.style.left = C.w * 0.12 + "px";
        textEl.style.top = C.h * 0.1 + "px";
        textEl.style.width = C.w * 0.76 + "px";
        textEl.style.height = C.h * 0.62 + "px";
        var said = typeof V.text === "string" ? V.text.trim() : "На что ты смотришь?";
        var inner = document.createElement("div");
        // буквы по одной, слова не рвутся (перенос – между словами)
        said.split(/(\s+)/).forEach(function (part) {
          if (!part) return;
          if (/^\s+$/.test(part)) {
            inner.appendChild(document.createTextNode(" "));
            return;
          }
          var w = document.createElement("span");
          w.style.whiteSpace = "nowrap";
          Array.from(part).forEach(function (ch) {
            var s = document.createElement("span");
            s.className = "hwc-ch";
            s.textContent = ch;
            w.appendChild(s);
          });
          inner.appendChild(w);
        });
        textEl.appendChild(inner);

        var cues = String(V.cues || "")
          .split(",")
          .map(function (v) {
            return parseFloat(v);
          });
        var t0 = isFinite(cues[0]) && cues[0] >= 0 ? cues[0] : 0.3;
        var exit = oneOf(V.exit, ["none", "fade"], "none");

        var tl = gsap.timeline({ paused: true });
        var len = stroke.getTotalLength();
        gsap.set(stroke, { strokeDasharray: len, strokeDashoffset: len });
        tl.to(stroke, { strokeDashoffset: 0, duration: 0.8, ease: "power2.inOut" }, t0);
        tl.to("#hwc-fill", { opacity: 0.94, duration: 0.4, ease: "power2.out" }, t0 + 0.55);
        var chars = textEl.querySelectorAll(".hwc-ch");
        var delay = Math.min(CHAR_DELAY, 1.8 / Math.max(1, chars.length));
        if (chars.length) tl.to(chars, { opacity: 1, duration: 0.02, stagger: delay, ease: "none" }, t0 + 0.9);
        var typed = t0 + 0.9 + chars.length * delay;

        /* дрожь всего облачка – родная */
        function boil() {
          var step = Math.floor((tl.time() * 30) / BOIL.frameDrop);
          gsap.set(wrap, {
            x: hash(step * 3, SEED) * BOIL.amp,
            y: hash(step * 3 + 1, SEED) * BOIL.amp,
            rotation: hash(step * 3 + 2, SEED) * BOIL.rot,
          });
        }
        tl.eventCallback("onUpdate", boil);
        boil();

        var words = said ? said.split(/\s+/).length : 0;
        if (exit === "fade") tl.to(wrap, { opacity: 0, duration: OUT, ease: "power2.in" }, isFinite(cues[1]) && cues[1] > t0 ? cues[1] : typed + Math.max(2, 0.5 + 0.3 * words));
        tl.set({}, {}, 30);
        window.__timelines = window.__timelines || {};
        window.__timelines["hw-text-cloud"] = tl;
      })();
    </script>
  </body>
</html>
