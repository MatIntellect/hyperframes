<!doctype html>
<html
  lang="ru"
  data-composition-variables='[
    { "id": "intro", "type": "string", "role": "content", "label": "Intro label", "description": "Spaced pill shown before the first beat.", "maxLength": 18, "default": "В такт" },
    { "id": "hit", "type": "string", "role": "content", "label": "Hit word", "description": "Big Bebas word slammed on the freeze.", "maxLength": 10, "default": "Дроп" },
    { "id": "kicker", "type": "string", "role": "content", "label": "Card kicker", "description": "Spaced line at the foot of the shot one card.", "maxLength": 14, "default": "Промо" },
    { "id": "pill", "type": "string", "role": "content", "label": "Card pill", "description": "Red pill next to the kicker.", "maxLength": 8, "default": "Эфир" },
    { "id": "badge", "type": "string", "role": "content", "label": "Freeze badge", "description": "Red tag in the corner during the freeze.", "maxLength": 10, "default": "Стоп" },
    { "id": "eyebrow", "type": "string", "role": "content", "label": "Eyebrow", "description": "Red spaced line above the shot two title.", "maxLength": 22, "default": "Следующий кадр" },
    { "id": "title", "type": "string", "role": "content", "label": "Title", "description": "Shot two title in Bebas Neue, up to two lines.", "maxLength": 20, "default": "Резкая склейка" },
    { "id": "sub", "type": "string", "role": "content", "label": "Paragraph", "description": "Grey paragraph under the title, up to three lines.", "maxLength": 64, "default": "Стоп-кадр в такт, затем склейка. Для промо под музыку" },
    { "id": "card1", "type": "string", "role": "content", "label": "Card 1", "description": "Label|value of the first stat card, value in red.", "maxLength": 22, "default": "Разгон|1,35→2,2" },
    { "id": "card2", "type": "string", "role": "content", "label": "Card 2", "description": "Label|value of the second stat card; it pulses on the third beat.", "maxLength": 22, "default": "Стоп|0,8 с" },
    { "id": "card3", "type": "string", "role": "content", "label": "Card 3", "description": "Label|value of the third stat card, value in red.", "maxLength": 22, "default": "Склейка|3,00" },
    { "id": "intensity", "type": "number", "role": "style", "label": "Intensity", "description": "Strength of the punch-ins and the flash.", "default": 1, "min": 0.6, "max": 1.4, "step": 0.05 },
    { "id": "cues", "type": "string", "role": "timing", "label": "Cues", "description": "Comma-separated seconds from mount start, put them on the music: 1 first beat (punch-in; the speed ramp starts 0.65 s later), 2 freeze with the hit word, 3 hard cut to shot two, 4 third beat (card two pulses), 5 the block fades out (only when exit is fade). Empty keeps 0.7, 2.2, 3, 4.7.", "default": "" },
    { "id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "none holds shot two to the end of the mount.", "default": "none", "options": [{ "value": "none", "label": "Hold" }, { "value": "fade", "label": "Fade" }] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: transparent;
        overflow: hidden;
      }
      body {
        width: 1920px;
        height: 1080px;
      }
      #bfc-root {
        position: absolute;
        inset: 0;
        overflow: hidden;
        font-family: var(--font-body, "Montserrat"), sans-serif;
        color: var(--fg, #f2f2f2);
        --panel2: color-mix(in srgb, var(--surface, #18181a) 94%, var(--fg, #f2f2f2));
      }
      #bfc-ground {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background:
          radial-gradient(ellipse 80% 60% at 50% 40%, color-mix(in srgb, var(--accent, #ff0000) 7%, transparent) 0%, transparent 55%),
          var(--bg, #0c1014);
      }
      #bfc-grid {
        position: absolute;
        inset: 0;
        opacity: 0.22;
        background-image:
          linear-gradient(color-mix(in srgb, var(--fg, #f2f2f2) 4%, transparent) 1px, transparent 1px),
          linear-gradient(90deg, color-mix(in srgb, var(--fg, #f2f2f2) 4%, transparent) 1px, transparent 1px);
        background-size: 80px 80px;
        mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, #000 20%, transparent 75%);
      }
      #bfc-vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 75% 70% at 50% 50%, transparent 45%, rgb(0 0 0 / 55%) 100%);
        opacity: 0.85;
      }
      #bfc-box {
        position: absolute;
        inset: 0;
      }
      #bfc-stage {
        position: absolute;
        inset: 0;
        transform-origin: 50% 48%;
      }
      .bfc-shot {
        position: absolute;
        inset: 0;
      }
      #bfc-a-crop {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #bfc-a-card {
        position: relative;
        border-radius: 36px;
        background:
          linear-gradient(160deg, color-mix(in srgb, var(--fg, #f2f2f2) 6%, transparent) 0%, transparent 40%),
          linear-gradient(180deg, var(--panel2) 0%, var(--surface, #18181a) 100%);
        border: 2px solid var(--border, #2e2e32);
        box-shadow: 0 40px 120px rgb(0 0 0 / 55%);
        overflow: hidden;
      }
      #bfc-a-glow {
        position: absolute;
        left: 50%;
        top: 28%;
        width: 420px;
        height: 420px;
        margin: -210px 0 0 -210px;
        border-radius: 50%;
        background: radial-gradient(circle, color-mix(in srgb, var(--accent, #ff0000) 28%, transparent) 0%, transparent 68%);
        opacity: 0.85;
      }
      #bfc-a-wave {
        position: absolute;
        left: 64px;
        right: 64px;
        top: 110px;
        height: 220px;
      }
      #bfc-a-wave svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      #bfc-wave-path {
        fill: none;
        stroke: var(--accent, #ff0000);
        stroke-width: 4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #bfc-wave-fill {
        fill: var(--accent, #ff0000);
        opacity: 0.12;
      }
      #bfc-a-bars {
        position: absolute;
        left: 72px;
        right: 72px;
        bottom: 170px;
        height: 96px;
        display: flex;
        align-items: flex-end;
        gap: 10px;
      }
      .bfc-bar {
        flex: 1;
        border-radius: 6px 6px 2px 2px;
        background: linear-gradient(180deg, var(--accent, #ff0000) 0%, color-mix(in srgb, var(--accent, #ff0000) 25%, transparent) 100%);
        transform-origin: 50% 100%;
      }
      #bfc-a-meta {
        position: absolute;
        left: 56px;
        right: 56px;
        bottom: 52px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }
      #bfc-kicker {
        font-size: 28px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted, #8a8a90);
        white-space: nowrap;
      }
      .bfc-red {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #ffffff;
        background: var(--accent, #ff0000);
        padding: 8px 18px;
        border-radius: 999px;
        white-space: nowrap;
      }
      #bfc-b-layout {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
      }
      #bfc-b-left {
        display: flex;
        flex-direction: column;
        gap: 26px;
      }
      #bfc-eyebrow {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--accent, #ff0000);
      }
      #bfc-title {
        font-family: var(--font-display, "Bebas Neue"), sans-serif;
        line-height: 0.92;
        text-transform: uppercase;
        overflow-wrap: anywhere;
      }
      #bfc-bar-acc {
        width: 120px;
        height: 6px;
        border-radius: 999px;
        background: var(--accent, #ff0000);
      }
      #bfc-sub {
        font-size: 32px;
        font-weight: 500;
        color: var(--muted, #8a8a90);
        line-height: 1.35;
      }
      #bfc-b-right {
        display: flex;
        flex-direction: column;
      }
      .bfc-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        border-radius: 20px;
        background: linear-gradient(135deg, var(--panel2), var(--surface, #18181a));
        border: 2px solid var(--border, #2e2e32);
        box-shadow: 0 18px 48px rgb(0 0 0 / 35%);
      }
      .bfc-card-label {
        font-size: 28px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted, #8a8a90);
        white-space: nowrap;
      }
      .bfc-card-value {
        font-weight: 800;
        white-space: nowrap;
      }
      .bfc-card-value.bfc-acc {
        color: var(--accent, #ff0000);
      }
      #bfc-intro {
        position: absolute;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        opacity: 0;
        visibility: hidden;
      }
      #bfc-intro span {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: var(--muted, #8a8a90);
        padding: 10px 20px;
        border: 2px solid var(--border, #2e2e32);
        border-radius: 999px;
        background: color-mix(in srgb, var(--bg, #0c1014) 55%, transparent);
        white-space: nowrap;
      }
      #bfc-hit {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        visibility: hidden;
      }
      #bfc-hit span {
        font-family: var(--font-display, "Bebas Neue"), sans-serif;
        line-height: 1;
        text-transform: uppercase;
        white-space: nowrap;
        text-shadow:
          0 0 40px color-mix(in srgb, var(--accent, #ff0000) 35%, transparent),
          0 8px 40px rgb(0 0 0 / 55%);
      }
      #bfc-freeze {
        position: absolute;
        inset: 0;
        opacity: 0;
        visibility: hidden;
      }
      #bfc-f-outline {
        position: absolute;
        border: 3px solid var(--accent, #ff0000);
        border-radius: 8px;
        box-shadow: 0 0 48px color-mix(in srgb, var(--accent, #ff0000) 20%, transparent);
      }
      #bfc-f-flash {
        position: absolute;
        inset: 0;
        background: #ffffff;
        mix-blend-mode: screen;
      }
      #bfc-f-contour {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(90deg, transparent 0%, color-mix(in srgb, var(--accent, #ff0000) 8%, transparent) 48%, transparent 52%),
          radial-gradient(ellipse 40% 55% at 50% 48%, transparent 40%, color-mix(in srgb, var(--accent, #ff0000) 18%, transparent) 100%);
        mix-blend-mode: screen;
      }
      #bfc-badge {
        position: absolute;
        border-radius: 6px;
        padding: 8px 18px;
      }
      #bfc-cut {
        position: absolute;
        inset: -8% -20%;
        opacity: 0;
        visibility: hidden;
        background: linear-gradient(90deg, transparent 0%, color-mix(in srgb, var(--accent, #ff0000) 12%, transparent) 35%, rgb(255 255 255 / 55%) 50%, color-mix(in srgb, var(--accent, #ff0000) 12%, transparent) 65%, transparent 100%);
        filter: blur(18px);
      }
      
      #bfc-a-card {
        width: 680px;
        height: 720px;
      }
      #bfc-b-layout {
        padding: 100px 110px;
        gap: 64px;
      }
      #bfc-b-left {
        flex: 1.05;
      }
      #bfc-b-right {
        flex: 0.95;
        gap: 18px;
      }
      #bfc-title {
        font-size: 150px;
      }
      #bfc-sub {
        max-width: 640px;
      }
      .bfc-card {
        padding: 26px 32px;
      }
      .bfc-card-value {
        font-size: 46px;
      }
      #bfc-intro {
        top: 72px;
      }
      #bfc-hit span {
        font-size: 220px;
      }
      #bfc-f-outline {
        inset: 48px;
      }
      #bfc-badge {
        top: 80px;
        right: 96px;
      }
      
      
    </style>
  </head>
  <body>
    <div id="bfc-root" data-composition-id="beat-freeze-cut" data-width="1920" data-height="1080" data-start="0" data-duration="30">
      <div id="bfc-ground">
        <div id="bfc-grid" data-layout-ignore></div>
        <div id="bfc-vignette" data-layout-ignore></div>
      </div>
      <div id="bfc-box">
        <div id="bfc-stage" data-layout-allow-overflow>
          <div id="bfc-shot-a" class="bfc-shot">
            <div id="bfc-a-crop" data-layout-allow-overflow>
              <div id="bfc-a-card" data-layout-allow-overflow>
                <div id="bfc-a-glow" data-layout-ignore></div>
                <div id="bfc-a-wave" data-layout-ignore>
                  <svg viewBox="0 0 592 220" preserveAspectRatio="none">
                    <path id="bfc-wave-fill" d="M0,160 C40,150 60,90 100,100 C140,110 160,40 200,55 C240,70 260,150 300,140 C340,130 360,30 400,45 C440,60 460,130 500,120 C540,110 560,70 592,80 L592,220 L0,220 Z" />
                    <path id="bfc-wave-path" d="M0,160 C40,150 60,90 100,100 C140,110 160,40 200,55 C240,70 260,150 300,140 C340,130 360,30 400,45 C440,60 460,130 500,120 C540,110 560,70 592,80" />
                  </svg>
                </div>
                <div id="bfc-a-bars"></div>
                <div id="bfc-a-meta"><span id="bfc-kicker"></span><span id="bfc-pill" class="bfc-red"></span></div>
              </div>
            </div>
          </div>
          <div id="bfc-shot-b" class="bfc-shot" style="visibility: hidden; opacity: 0">
            <div id="bfc-b-layout">
              <div id="bfc-b-left">
                <div id="bfc-eyebrow"></div>
                <div id="bfc-title"></div>
                <div id="bfc-bar-acc"></div>
                <div id="bfc-sub"></div>
              </div>
              <div id="bfc-b-right"></div>
            </div>
          </div>
        </div>
        <div id="bfc-intro"><span id="bfc-intro-t"></span></div>
        <div id="bfc-hit" data-layout-allow-occlusion><span id="bfc-hit-t"></span></div>
        <div id="bfc-freeze" data-layout-allow-occlusion>
          <div id="bfc-f-flash"></div>
          <div id="bfc-f-contour"></div>
          <div id="bfc-f-outline"></div>
          <div id="bfc-badge" class="bfc-red"></div>
        </div>
        <div id="bfc-cut" data-layout-allow-overflow data-layout-ignore></div>
      </div>
    </div>
    <script>
      (function () {
        var root = document.getElementById("bfc-root");
        var V =
          window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
            ? window.__hyperframes.getVariables()
            : {};
        function oneOf(v, list, d) {
          return list.indexOf(v) >= 0 ? v : d;
        }
        function txt(v, d) {
          return typeof v === "string" ? v.trim() : d;
        }
        function $(id) {
          return document.getElementById("bfc-" + id);
        }
        
        $("intro-t").textContent = txt(V.intro, "В такт");
        $("hit-t").textContent = txt(V.hit, "Дроп") || "Дроп";
        $("kicker").textContent = txt(V.kicker, "Промо");
        $("pill").textContent = txt(V.pill, "Эфир");
        $("badge").textContent = txt(V.badge, "Стоп");
        $("eyebrow").textContent = txt(V.eyebrow, "Следующий кадр");
        $("title").textContent = txt(V.title, "Резкая склейка");
        $("sub").textContent = txt(V.sub, "Стоп-кадр в такт, затем склейка. Для промо под музыку");
        ["intro-t", "kicker", "pill", "badge", "eyebrow", "sub"].forEach(function (id) {
          if (!$(id).textContent) $(id).style.display = "none";
        });
        if (!$("intro-t").textContent) $("intro").style.display = "none";
        var right = $("b-right");
        var cards = [
          [V.card1, "Разгон|1,35→2,2", true],
          [V.card2, "Стоп|0,8 с", false],
          [V.card3, "Склейка|3,00", true],
        ].map(function (c, i) {
          var p = (txt(c[0], c[1]) || c[1]).split("|");
          var el = document.createElement("div");
          el.className = "bfc-card";
          el.id = "bfc-card-" + i;
          var l = document.createElement("span");
          l.className = "bfc-card-label";
          l.textContent = (p[0] || "").trim();
          var v = document.createElement("span");
          v.className = "bfc-card-value" + (c[2] ? " bfc-acc" : "");
          v.textContent = (p[1] || "").trim();
          el.appendChild(l);
          el.appendChild(v);
          right.appendChild(el);
          return el;
        });
        var barsEl = $("a-bars"),
          bars = [];
        [34, 58, 42, 78, 52, 88, 46, 64, 36, 72, 48, 92].forEach(function (h, i) {
          var b = document.createElement("div");
          b.className = "bfc-bar";
          b.style.height = h + "%";
          barsEl.appendChild(b);
          bars.push(b);
        });

        var intensity = Math.max(0.6, Math.min(1.4, Number(V.intensity) || 1));
        var cues = String(V.cues || "")
          .split(",")
          .map(function (v) {
            return parseFloat(v);
          });
        var beat1 = isFinite(cues[0]) && cues[0] >= 0.3 ? cues[0] : 0.7;
        var freezeAt = isFinite(cues[1]) && cues[1] > beat1 + 0.4 ? cues[1] : beat1 + 1.5;
        var cutAt = isFinite(cues[2]) && cues[2] > freezeAt + 0.4 ? cues[2] : freezeAt + 0.8;
        var beat3 = isFinite(cues[3]) && cues[3] > cutAt + 0.5 ? cues[3] : cutAt + 1.7;
        var holdAt = beat3 + 0.5;
        var exit = oneOf(V.exit, ["none", "fade"], "none");
        var introAt = Math.max(0, beat1 - 0.58);

        var stage = $("stage"),
          shotA = $("shot-a"),
          shotB = $("shot-b"),
          aCrop = $("a-crop"),
          aCard = $("a-card"),
          intro = $("intro"),
          hit = $("hit"),
          freeze = $("freeze"),
          fOut = $("f-outline"),
          fFlash = $("f-flash"),
          fCont = $("f-contour"),
          badge = $("badge"),
          cutFx = $("cut"),
          bLeft = $("b-left");

        var tl = gsap.timeline({ paused: true });
        gsap.set(aCard, { scale: 0.9, y: 20 });
        gsap.set(intro, { y: -12 });
        gsap.set(hit, { scale: 1.15 });
        gsap.set([fOut, fFlash, fCont, badge], { opacity: 0 });
        gsap.set(cutFx, { scaleX: 0.4, x: -200 });
        gsap.set(bLeft, { opacity: 0, x: -48 });
        gsap.set(cards, { opacity: 0, x: 40 });
        gsap.set(bars, { scaleY: 0.55 });

        tl.to(aCard, { scale: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0);
        tl.to(stage, { scale: 1 + 0.04 * intensity, duration: 0.7, ease: "power1.out" }, 0);
        tl.to(bars, { scaleY: 1, duration: 0.5, ease: "power2.out", stagger: 0.02 }, 0.12);
        tl.set(intro, { visibility: "visible" }, introAt);
        tl.to(intro, { opacity: 1, y: 0, duration: 0.28, ease: "power2.out" }, introAt);
        tl.to(intro, { opacity: 0, y: -8, duration: 0.18, ease: "power2.in" }, beat1 - 0.18);
        tl.set(intro, { visibility: "hidden" }, beat1);
        // бит 1: рывок
        tl.to(aCrop, { scale: 1 + 0.18 * intensity, x: -80 * intensity, y: 24 * intensity, duration: 0.22, ease: "power4.out" }, beat1);
        tl.to(stage, { scale: Math.min(1.2, 1 + 0.08 * intensity), duration: 0.28, ease: "expo.out" }, beat1);
        var pattern = [0.55, 1.15, 0.7, 1.35, 0.9, 1.4, 0.65, 1.1, 0.5, 1.25, 0.8, 1.45];
        tl.to(bars, { scaleY: function (i) { return pattern[i]; }, duration: 0.18, ease: "power3.out", stagger: 0.01 }, beat1);
        // разгон к стоп-кадру
        var rampStart = Math.min(beat1 + 0.65, freezeAt - 0.2);
        var rampDur = Math.max(0.2, freezeAt - rampStart);
