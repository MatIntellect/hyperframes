<!doctype html>
<html
  lang="ru"
  data-composition-variables='[
    { "id": "title", "type": "string", "role": "content", "label": "Card title", "description": "Card title in Bebas Neue.", "maxLength": 28, "default": "Это ваш гид" },
    { "id": "body", "type": "string", "role": "content", "label": "Card text", "description": "Grey text under the title. Empty hides it.", "maxLength": 90, "default": "Входит уверенным шагом, останавливается и показывает, куда смотреть" },
    { "id": "cues", "type": "string", "role": "timing", "label": "Cues", "description": "The character keeps its native 7.5 s acting from the mount start (the runtime seeks the Lottie file to composition time): walks in, stops and points at 5.2 s, when the card lands. Comma-separated seconds from mount start: 1 the block fades out (only when exit is fade). Empty keeps 11 – the card text reads 5 s.", "default": "" },
    { "id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "none holds the pointing character and the card to the end of the mount; fade fades the block out.", "default": "none", "options": [{ "value": "none", "label": "Hold" }, { "value": "fade", "label": "Fade" }] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lottie-web@5.12.2/build/player/lottie_light.min.js"></script>
    <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: transparent;
        overflow: hidden;
      }
      body {
        width: 1920px;
        height: 1080px;
      }
      #lcw-root {
        position: absolute;
        inset: 0;
        overflow: hidden;
        font-family: var(--font-body, "Montserrat"), sans-serif;
        color: var(--fg, #f2f2f2);
      }
      #lcw-ground,
      #lcw-stage {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      #lcw-ground {
        background: var(--bg, #0c1014);
      }
      #lcw-line {
        position: absolute;
        left: 0;
        right: 0;
        height: 1px;
        background: color-mix(in srgb, var(--fg, #f2f2f2) 14%, transparent);
      }
      /* родная сцена Lottie – 1920x1080, переносится целиком */
      #lcw-mascot {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        transform-origin: 0 0;
      }
      /* персонаж – своя графика: цвета частей из меток темы (файл разработчиков не тронут) */
      #lcw-mascot .lcw-near path:not([fill="none"]) {
        fill: var(--fg, #f2f2f2);
      }
      #lcw-mascot .lcw-near path[stroke] {
        stroke: var(--bg, #0c1014);
      }
      #lcw-mascot .lcw-far path:not([fill="none"]) {
        fill: var(--muted, #8a8a90);
      }
      #lcw-mascot .lcw-eye path:not([fill="none"]) {
        fill: var(--bg, #0c1014);
      }
      #lcw-mascot .lcw-shadow path:not([fill="none"]) {
        fill: #000000;
      }
      #lcw-card {
        position: absolute;
        border-radius: 28px;
        background: var(--surface, #18181a);
        border: 2px solid var(--border, #2e2e32);
        opacity: 0;
      }
      #lcw-title {
        font-family: var(--font-display, "Bebas Neue"), sans-serif;
        font-weight: 400;
        line-height: 1;
        text-transform: uppercase;
        overflow-wrap: break-word;
      }
      #lcw-rule {
        width: 120px;
        height: 8px;
        border-radius: 4px;
        background: var(--accent, #ff0000);
        transform-origin: left center;
      }
      #lcw-body {
        font-size: 34px;
        line-height: 1.35;
        color: var(--muted, #8a8a90);
        overflow-wrap: break-word;
      }
      
      #lcw-line {
        top: 906px;
      }
      #lcw-card {
        left: 1100px;
        top: 300px;
        width: 660px;
        padding: 56px 60px 60px;
      }
      #lcw-title {
        font-size: 84px;
      }
      #lcw-rule {
        margin: 28px 0 30px;
      }
      
      
    </style>
  </head>
  <body>
    <div id="lcw-root" data-composition-id="lottie-character-walk" data-width="1920" data-height="1080" data-start="0" data-duration="30">
      <div id="lcw-ground"></div>
      <div id="lcw-stage">
        <div id="lcw-line" data-layout-ignore></div>
        <div id="lcw-card">
          <div id="lcw-title"></div>
          <div id="lcw-rule"></div>
          <div id="lcw-body"></div>
        </div>
        <div id="lcw-mascot" data-layout-allow-overflow data-layout-ignore></div>
      </div>
    </div>
    <script>
      (function () {
        var root = document.getElementById("lcw-root");
        var V =
          window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
            ? window.__hyperframes.getVariables()
            : {};
        function txt(v, d) {
          return typeof v === "string" ? v.trim() : d;
        }
        document.getElementById("lcw-title").textContent = txt(V.title, "Это ваш гид") || "Это ваш гид";
        var body = txt(V.body, "Входит уверенным шагом, останавливается и показывает, куда смотреть");
        document.getElementById("lcw-body").textContent = body;
        if (!body) document.getElementById("lcw-body").style.display = "none";

        // сцена Lottie в окне: в широкой – как у разработчиков; в вертикали персонаж в левом нижнем углу поля,
        // в карточке – в 0,75 и обрезан окном карточки (не идёт по прозрачной части кадра)
        var mx = 0,
          my = 0,
          k = 1,
          T0 = 0;
        
        var box = document.getElementById("lcw-mascot");
        box.style.transform = "translate(" + mx + "px, " + my + "px) scale(" + k + ")";

        // Игру тела (шаг, остановка, жест, покой) ведёт файл Lottie разработчиков; время ему ставит программа
        var mascot = lottie.loadAnimation({
          container: box,
          renderer: "svg",
          loop: false,
          autoplay: false,
          // файл ставится в assets/ проекта – путь от корня проекта (contributing.md:96-97: assetUrl искал бы рядом с файлом)
          path: "assets/mascot.json",
          // вертикаль: родной путь шага рассчитан на широкий кадр, первые 2,5 с персонаж за краем кадра –
          // файл играется с 2,5 с (кадр 75 из 225), время карточки сдвинуто на столько же
          initialSegment: [T0 * 30, 225],
        });
        var PARTS = {
          near: ["arm.near.fore", "arm.near.upper", "head", "torso", "leg.near.foot", "leg.near.shin", "leg.near.thigh"],
          far: ["leg.far.foot", "leg.far.shin", "leg.far.thigh", "arm.far.fore", "arm.far.upper"],
          eye: ["eye"],
          shadow: ["shadow"],
        };
        mascot.addEventListener("DOMLoaded", function () {
          (mascot.renderer.elements || []).forEach(function (el) {
            if (!el || !el.data || !el.layerElement) return;
            Object.keys(PARTS).forEach(function (part) {
              if (PARTS[part].indexOf(el.data.nm) >= 0) el.layerElement.classList.add("lcw-" + part);
            });
          });
        });
        window.__hfLottie = window.__hfLottie || [];
        window.__hfLottie.push(mascot);

        var cues = String(V.cues || "")
          .split(",")
          .map(function (v) {
            return parseFloat(v);
          });
        var exit = ["none", "fade"].indexOf(String(V.exit)) >= 0 ? String(V.exit) : "none";

        // карточка – на родной жест (5,2 с)
        var tl = gsap.timeline({ paused: true });
        tl.fromTo("#lcw-card", { opacity: 0, x: 40, scale: 0.96 }, { opacity: 1, x: 0, scale: 1, duration: 0.6, ease: "power3.out" }, 5.2 - T0);
        tl.fromTo(["#lcw-title", "#lcw-body"], { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out", stagger: 0.1 }, 5.3 - T0);
        tl.fromTo("#lcw-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "expo.out" }, 5.5 - T0);
        if (exit === "fade") tl.to(root, { opacity: 0, duration: 0.5, ease: "power2.in" }, isFinite(cues[0]) && cues[0] > 5.8 - T0 ? cues[0] : 11 - T0);
        tl.set({}, {}, 30);
        window.__timelines = window.__timelines || {};
        window.__timelines["lottie-character-walk"] = tl;
      })();
    </script>
  </body>
</html>
