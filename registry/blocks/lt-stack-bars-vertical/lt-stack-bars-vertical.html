<!doctype html>
<html
  lang="ru"
  data-composition-variables='[
    { "id": "placement", "type": "enum", "role": "layout", "label": "Placement", "description": "Overlay over footage, centred on the frame, no ground. bottom: the plate sits on y 1360, just above the caption band. top: the plate hangs from y 180. center: centred on y 770.", "default": "bottom", "options": [{ "value": "bottom", "label": "Bottom" }, { "value": "top", "label": "Top" }, { "value": "center", "label": "Centre" }] },
    { "id": "name", "type": "string", "role": "content", "label": "Name", "description": "Upper-case name in the dark bar; wraps to up to three lines in the vertical version.", "maxLength": 28, "default": "Мат Джестер" },
    { "id": "role", "type": "string", "role": "content", "label": "Role", "description": "Upper-case line in the red bar. Empty hides it.", "maxLength": 40, "default": "Основатель MatIntellect" },
    { "id": "cues", "type": "string", "role": "timing", "label": "Cues", "description": "Comma-separated seconds from mount start: 1 the name bar wipes in from the left, the red role bar from the right, 2 the plate leaves (only when exit is out). Empty keeps 0.1, 4.3.", "default": "" },
    { "id": "exit", "type": "enum", "role": "timing", "label": "Exit", "description": "none holds the plate to the end of the mount; out plays its own leaving motion at cue 2.", "default": "none", "options": [{ "value": "none", "label": "Hold" }, { "value": "out", "label": "Leave" }] }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("assets/fonts/bebas-neue-bold.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin-ext.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: transparent;
        overflow: hidden;
      }
      body {
        width: 1080px;
        height: 1920px;
      }
      #lsbv-root {
        font-family: var(--font-body, "Montserrat"), sans-serif;
      }
      #lsbv-lt {
        position: absolute;
      }
      #lsbv-lt { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
      #lsbv-namebar { background: var(--surface, #18181a); padding: 14px 30px; }
      #lsbv-name { font-weight: 900; color: var(--fg, #f2f2f2); line-height: 1.05; text-transform: uppercase; }
      #lsbv-rolebox { background: var(--accent, #ff0000); padding: 9px 22px; margin-left: 14px; }
      #lsbv-role { font-weight: 700; color: var(--fg, #f2f2f2); letter-spacing: 0.06em; text-transform: uppercase; line-height: 1.15; }
      
      
      #lsbv-lt {
        left: 150px;
        width: 780px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      #lsbv-root.lsbv-bottom #lsbv-lt {
        bottom: 560px;
      }
      #lsbv-root.lsbv-top #lsbv-lt {
        top: 180px;
      }
      #lsbv-root.lsbv-center #lsbv-lt {
        top: 770px;
        transform: translateY(-50%);
      }
      #lsbv-namebar { max-width: 780px; text-align: center; }
      #lsbv-rolebox { margin-left: 0; max-width: 780px; text-align: center; }
      #lsbv-name { font-size: 64px; }
      #lsbv-role { font-size: 30px; }
      
    </style>
  </head>
  <body>
    <div id="lsbv-root" data-composition-id="lt-stack-bars-vertical" data-width="1080" data-height="1920" data-start="0" data-duration="30">
      <div id="lsbv-lt">
        <div id="lsbv-namebar"><div id="lsbv-name"></div></div>
        <div id="lsbv-rolebox"><div id="lsbv-role"></div></div>
      </div>
    </div>
    <script>
      (function () {
        var root = document.getElementById("lsbv-root");
        var V =
          window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
            ? window.__hyperframes.getVariables()
            : {};
        function oneOf(v, list, d) {
          return list.indexOf(v) >= 0 ? v : d;
        }
        
        root.classList.add("lsbv-" + oneOf(V.placement, ["bottom", "top", "center"], "bottom"));
        
        document.getElementById("lsbv-name").textContent = typeof V.name === "string" && V.name.trim() ? V.name : "Мат Джестер";
        var role = typeof V.role === "string" ? V.role : "Основатель MatIntellect";
        var roleEl = document.getElementById("lsbv-role");
        roleEl.textContent = role;
        if (!role) (document.getElementById("lsbv-rolebox") || roleEl).style.display = "none";

        var cues = String(V.cues || "")
          .split(",")
          .map(function (v) {
            return parseFloat(v);
          });
        var c0 = isFinite(cues[0]) && cues[0] >= 0 ? cues[0] : 0.1;
        var exit = oneOf(V.exit, ["none", "out"], "none");

        var tl = gsap.timeline({ paused: true });
        tl.fromTo("#lsbv-namebar", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.5, ease: "power4.out" }, c0);
        tl.fromTo("#lsbv-rolebox", { clipPath: "inset(0 0 0 100%)" }, { clipPath: "inset(0 0% 0 0%)", duration: 0.5, ease: "power4.out" }, c0 + 0.24);
        if (exit === "out") {
          var out = isFinite(cues[1]) ? cues[1] : c0 + 4.2;
          tl.to("#lsbv-rolebox", { clipPath: "inset(0 0 0 100%)", duration: 0.32, ease: "power3.in" }, out);
          tl.to("#lsbv-namebar", { clipPath: "inset(0 100% 0 0)", duration: 0.36, ease: "power3.in" }, out + 0.07);
        }
        tl.set({}, {}, 30);
        window.__timelines = window.__timelines || {};
        window.__timelines["lt-stack-bars-vertical"] = tl;
      })();
    </script>
  </body>
</html>
